name: Deploy 24H v120.3 to production
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  deploy:
    if: "contains(github.event.head_commit.message, 'Trigger approved 24H v120.3 production deploy')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify live v120.1 baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object index.html)" = "1361d21d4f17d6a118717ff1dc6c57aa4b7cfc9d"
          test "$(git hash-object luisa_24_heures.html)" = "1361d21d4f17d6a118717ff1dc6c57aa4b7cfc9d"
          test "$(git hash-object manifest.json)" = "6b5f9cbc923e37ff5aa90adad66f7f5d2d21364f"
          test "$(git hash-object sw.js)" = "9960dd472d844962ea6763c35dc5a8aebd78a335"
          test "$(git hash-object version.json)" = "9ec2b1354d45a4a763a970f591a199a232b1e15d"
      - name: Fetch exact tested v120.3 B1 candidate
        shell: bash
        run: |
          set -euo pipefail
          src_commit="39ad59774395d532c450fa53acd276096d0fd295"
          src_dir="24h-v120-3-b1-contextual-stage-navigation"
          mkdir /tmp/v1203
          files=(.nojekyll apple-touch-icon.png favicon-16.png favicon-32.png favicon.ico icon-120.png icon-192.png icon-512.png icon-60.png icon-maskable-512.png index.html luisa_24_heures.html manifest.json sw.js version.json)
          for f in "${files[@]}"; do
            curl --fail --location --silent --show-error "https://raw.githubusercontent.com/louisriv26/App-Test/${src_commit}/${src_dir}/${f}" -o "/tmp/v1203/${f}"
          done
          cat > /tmp/expected.sha256 <<'EOF'
          e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855  /tmp/v1203/.nojekyll
          dd8efc8111a51b98c4c93dcab7357ecc4c2d5448b8a08aa97da7381dc0b56864  /tmp/v1203/apple-touch-icon.png
          18ea7f82b0a52d3ab2e5f89eb294fb06f0057b72f890aa66ada9e0f3ff4beaa8  /tmp/v1203/favicon-16.png
          49d3cd0fdf71b21076d3117b352422730ebc0d0e99749ed4e3b1d230c71ed008  /tmp/v1203/favicon-32.png
          d0b29e153e5783bfd36522c1dc9cabff9817275553b9a2db80db477a1fca53ec  /tmp/v1203/favicon.ico
          12151620d8cf4ff5f9e8b8c4e2ecf5bdb739142613f7d41dc3d8e22d10f43f17  /tmp/v1203/icon-120.png
          6c3f6c4771a505d06efc5f8d9f3da877bb599ec14c45509b185d0749fd83bff4  /tmp/v1203/icon-192.png
          a0c9e8ab677750ca096adfb2748a4f4de8707b01a914faeafbf2ae94ec7da4f7  /tmp/v1203/icon-512.png
          303a69b4d594ca2a22df35bce029cbdb8a143cbda41bbf83199b0f9ac0ea2fb4  /tmp/v1203/icon-60.png
          2c15d684b3c37e62b342f8a2041daa0038fa2280a3c3dafea02ccd10bec4716a  /tmp/v1203/icon-maskable-512.png
          e17883784f2ca1c5b59e08fc140fd19e95382cf3f33c20b218d88edc2aea37da  /tmp/v1203/index.html
          e17883784f2ca1c5b59e08fc140fd19e95382cf3f33c20b218d88edc2aea37da  /tmp/v1203/luisa_24_heures.html
          ecb7b07662dc7432f3c42f94dbbb6ba86afd228d55ae4d80ac554d3a19722e8f  /tmp/v1203/manifest.json
          7ebe63dcf5e39becabeb03f6b8882c8c77c14a9e6223c9762c58ad8a7700cdb4  /tmp/v1203/sw.js
          d25a61668e79f1e99a9739c58bb3f191b850628a74dc62f7bdf32cb0ceb00e23  /tmp/v1203/version.json
          EOF
          sed -i 's/^          //' /tmp/expected.sha256
          sha256sum -c /tmp/expected.sha256
      - name: Install exact candidate and verify Git blobs
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/v1203/* .
          cp /tmp/v1203/.nojekyll .nojekyll
          test "$(git hash-object index.html)" = "0d817262d4af358eb65256ee140b28ac1e350bad"
          test "$(git hash-object luisa_24_heures.html)" = "0d817262d4af358eb65256ee140b28ac1e350bad"
          test "$(git hash-object manifest.json)" = "fdc8c29e75436830db8e032be9aa58fb3b8a6dc6"
          test "$(git hash-object sw.js)" = "f452c5c7b34bb90810e42e8ea8b4e22223424b80"
          test "$(git hash-object version.json)" = "21c8220eafd3b145598dc72fe7f0eea3d7f9980a"
      - name: Commit production release and remove deployment helpers
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/deploy-v120-3-production.yml
          rm -f deploy-v120-3-production-trigger.txt
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Deploy 24H v120.3 exact physically tested B1 candidate"
          git pull --rebase origin main
          git push origin HEAD:main
