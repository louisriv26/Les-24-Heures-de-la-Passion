\":\"Que ta B\u00e9n\u00e9diction appelle\\n- \u00e0 la conversion tous les p\u00e9cheurs et\\n- \u00e0 la lumi\u00e8re de la foi tous les h\u00e9r\u00e9tiques et les infid\u00e8les.\\n\u00d4 J\u00e9sus, ma douce Vie, ton Tourment ne fait que commencer.\\nTes bourreaux ont fini de Te clouer la Main droite.\"},{\"id\":\"PASSION24.HOUR.19.P035\",\"n\":35,\"t\":\"Avec une cruaut\u00e9 inou\u00efe ils prennent ta Main gauche et ils la tirent si violemment pour la faire parvenir au trou d\u00e9j\u00e0 for\u00e9 que les Articulations de tes Bras et de tes Epaules en sont disloqu\u00e9es.\"},{\"id\":\"PASSION24.HOUR.19.P036\",\"n\":36,\"t\":\"\u00c0 cause de la force de cette douleur,\\n- m\u00eame tes Jambes deviennent raides et convulsives.\\nPuis, avec f\u00e9rocit\u00e9, comme pour ta Main droite, ils la clouent sur la Croix.\\n\u00d4 Main gauche de mon J\u00e9sus,\\n- Je Te donne un baiser, je compatis avec Toi.\\n- Je T'adore, je Te remercie.\\nJe Te prie, en raison\\n- des coups que Tu re\u00e7ois et\\n- des cruelles douleurs que Tu subis,\\nde permettre en ce moment aux \u00e2mes du Purgatoire d'\u00eatre lib\u00e9r\u00e9es.\"},{\"id\":\"PASSION24.HOUR.19.P037\",\"n\":37,\"t\":\"Oui, \u00f4 J\u00e9sus, en raison du sang que Tu verses de cette main,\\nje Te prie d'\u00e9teindre les flammes qui br\u00fblent ces \u00e2mes.\\nQue ce Sang\\n- les rafra\u00eechisse et les soulage, et\\n- leur soit un bain salutaire pour\\nles purifier de toute tache et les disposer \u00e0 la vision b\u00e9atifique.\\nMon Amour et mon Tout, en raison de cette douleur cuisante, je Te prie\\n- de fermer l'enfer \u00e0 toutes les \u00e2mes et\"},{\"id\":\"PASSION24.HOUR.19.P038\",\"n\":38,\"t\":\"- de retenir les foudres de la Justice divine irrit\u00e9e par nos fautes !\"},{\"id\":\"PASSION24.HOUR.19.P039\",\"n\":39,\"t\":\"Fais en sorte, \u00f4 J\u00e9sus,\\n- que cette Justice divine se calme,\\n- qu'Elle ne fasse pas pleuvoir les fl\u00e9aux divins sur notre terre, et\\n- que s'ouvrent les tr\u00e9sors de la Mis\u00e9ricorde divine au profit de tous.\"},{\"id\":\"PASSION24.HOUR.19.P040\",\"n\":40,\"t\":\"Mon J\u00e9sus,\\nentre tes Bras, je place le monde et toutes les g\u00e9n\u00e9rations humaines.\\nJe Te prie, \u00f4 mon doux Amour, par ton Sang vers\u00e9,\\n- de ne refuser le pardon \u00e0 personne\\n- et d'accorder \u00e0 chacun le Salut de son \u00e2me.\\nN'exclus personne, \u00f4 J\u00e9sus !\\nMon Amour, J\u00e9sus, tes ennemis poursuivent dans leurs atrocit\u00e9s.\\nAvec une f\u00e9rocit\u00e9 diabolique, ils prennent tes Pieds infiniment saints,\\ncontract\u00e9s par la grande douleur \u00e9prouv\u00e9e lors du clouage des Mains.\\nIls les tirent tant qu'en sont disloqu\u00e9s\\n- tes Genoux, tes C\u00f4tes et tous les Os de ta Poitrine.\"},{\"id\":\"PASSION24.HOUR.19.P041\",\"n\":41,\"t\":\"Mon c\u0153ur ne r\u00e9siste pas, mon cher Bien. Je vois\\n- tes beaux Yeux \u00e9clips\u00e9s et voil\u00e9s par le Sang.\\n- tes L\u00e8vres livides se contorsionnent,\\n- tes Joues se creusent, tes Dents s'entrechoquent,\\n- tandis que ta Poitrine hal\u00e8te.\"},{\"id\":\"PASSION24.HOUR.19.P042\",\"n\":42,\"t\":\"Oh ! mon Amour, combien volontiers je prendrais ta place pour T'\u00e9pargner tant\\nde souffrance ! Je veux, sur tous tes Membres, Te donner pour tous\\n- un baume, un baiser, un r\u00e9confort, une r\u00e9paration.\\nMon J\u00e9sus,\\nils Te mettent un Pied sur l'autre et ils y enfoncent un clou sans pointe.\"},{\"id\":\"PASSION24.HOUR.19.P043\",\"n\":43,\"t\":\"Saints Pieds de mon J\u00e9sus,\\n- je Vous donne un baiser,\\n- je Vous adore,\\n- je Vous remercie et\\n- je Vous prie,\\nen raison des douleurs extr\u00eames que Vous souffrez et du Sang que Vous\\nversez,\\nde renfermer toutes les \u00e2mes dans vos Plaies infiniment saintes.\\n\u00d4 J\u00e9sus, ne d\u00e9daigne personne !\\nQue tes clous\\n- clouent nos puissances, pour qu'elles ne s'\u00e9loignent pas de Toi,\\n- qu'ils clouent notre c\u0153ur, afin qu'il soit toujours fix\u00e9 au Tien,\"},{\"id\":\"PASSION24.HOUR.19.P044\",\"n\":44,\"t\":\"- qu'ils clouent tous nos sentiments,\\nafin qu'ils n'adh\u00e8rent \u00e0 aucun go\u00fbt qui ne vienne de Toi.\"},{\"id\":\"PASSION24.HOUR.19.P045\",\"n\":45,\"t\":\"\u00d4 mon J\u00e9sus crucifi\u00e9, je Te vois tout ensanglant\u00e9 comme si Tu avais nag\u00e9 dans un bain de sang. Ce sang r\u00e9clame continuellement des \u00e2mes. Par la puissance de ce Sang, \u00f4 J\u00e9sus, je Te demande qu'aucune \u00e2me ne s'enfuie de Toi ! \u00d4 J\u00e9sus, je m'approche de ton C\u0153ur tortur\u00e9. Je vois que Tu n'en peux plus. Mais l'Amour crie encore plus fort : \u00ab Souffrances, Souffrances, encore des Souffrances ! \u00bb\"},{\"id\":\"PASSION24.HOUR.19.P046\",\"n\":46,\"t\":\"Mon J\u00e9sus,\\n- je T'embrasse,\\n- je compatis avec Toi,\\n- je T'adore et\\n- je Te remercie\\npour moi et pour tous.\\nJ\u00e9sus, je veux appuyer ma t\u00eate sur ton C\u0153ur\\npour ressentir ce que Tu souffres durant ta douloureuse Crucifixion.\"},{\"id\":\"PASSION24.HOUR.19.P047\",\"n\":47,\"t\":\"Ah ! s'il n'avait pas d\u00e9j\u00e0 \u00e9t\u00e9 d\u00e9cr\u00e9t\u00e9 qu'une lance Te transpercera le C\u0153ur,\\nles Flammes de ton Amour se frayeraient un chemin et le feraient \u00e9clater !\\nCes Flammes appellent les \u00e2mes remplies d'amour\\n- \u00e0 \u00e9tablir leur demeure dans ton C\u0153ur.\"},{\"id\":\"PASSION24.HOUR.19.P048\",\"n\":48,\"t\":\"\u00d4 J\u00e9sus, par ton Sang infiniment pr\u00e9cieux, je Te demande la saintet\u00e9 pour ces \u00e2mes. De gr\u00e2ce, ne les laisse jamais quitter ton C\u0153ur. Multiplie les vocations des \u00e2mes victimes, pour qu'elles continuent ta Vie sur la terre.\"},{\"id\":\"PASSION24.HOUR.19.P049\",\"n\":49,\"t\":\"\u00d4 J\u00e9sus, que les Flammes de ton C\u0153ur me br\u00fblent et me consument, que ton Sang m'embellisse, que ton Amour me tienne toujours clou\u00e9e \u00e0 la Croix pour la souffrance et la r\u00e9paration. \u00d4 mon J\u00e9sus, les bourreaux T'ont clou\u00e9 les mains et les pieds. Maintenant ils retournent la Croix pour river les clous. Ainsi ils contraignent ton adorable Visage \u00e0 toucher le sol. Et Toi, Tu donnes un baiser \u00e0 ce sol ensanglant\u00e9 de ton Sang.\"},{\"id\":\"PASSION24.HOUR.19.P050\",\"n\":50,\"t\":\"Par ce baiser, Tu embrasses toutes les \u00e2mes et les lies \u00e0 ton Amour,\"},{\"id\":\"PASSION24.HOUR.19.P051\",\"n\":51,\"t\":\"scellant leur salut.\"},{\"id\":\"PASSION24.HOUR.19.P052\",\"n\":52,\"t\":\"\u00d4 J\u00e9sus, laisse-moi prendre ta place.\\nTandis que les bourreaux rivent les clous, fais en sorte que ces coups\\n- me blessent aussi et\\n- me clouent tout enti\u00e8re \u00e0 ton Amour.\\nMon J\u00e9sus, les \u00e9pines s'enfoncent de plus en plus dans ta t\u00eate.\\nJe veux T'offrir toutes mes pens\u00e9es, afin que, comme des baisers affectueux,\\n- elles Te consolent et\\n- elles adoucissent l'amertume de tes \u00e9pines.\"},{\"id\":\"PASSION24.HOUR.19.P053\",\"n\":53,\"t\":\"Ta Langue est presque attach\u00e9e \u00e0 ton Palais \u00e0 cause de l'amertume\\n- du fiel et de ta Soif ardente.\\nPour \u00e9tancher ta Soif, \u00f4 mon J\u00e9sus,\\nTu voudrais que tous les c\u0153urs des cr\u00e9atures d\u00e9bordent d'amour.\\nMais, comme Tu ne re\u00e7ois pas cet amour, Tu br\u00fbles de plus en plus.\"},{\"id\":\"PASSION24.HOUR.19.P054\",\"n\":54,\"t\":\"Mon doux Amour, je veux T'envoyer des fleuves d'amour,\\npour amoindrir l'amertume du fiel et de ta Soif ardente.\\n\u00d4 J\u00e9sus, je vois qu'\u00e0 chaque Mouvement que Tu fais,\\n- les plaies de tes Mains se d\u00e9chirent davantage et\\n- la douleur devient plus intense.\"},{\"id\":\"PASSION24.HOUR.19.P055\",\"n\":55,\"t\":\"Mon cher Bien, pour Te d\u00e9dommager de cette souffrance et Te calmer, je T'offre les \u0153uvres saintes de toutes les cr\u00e9atures.\"},{\"id\":\"PASSION24.HOUR.19.P056\",\"n\":56,\"t\":\"\u00d4 J\u00e9sus, combien Tu souffres dans tes Pieds infiniment saints ! Tous les Mouvements de ton Corps infiniment sacr\u00e9 semblent se r\u00e9percuter en eux. Il n'y a personne pr\u00e8s de Toi pour Te soutenir et adoucir quelque peu l'\u00e2pret\u00e9 de tes Souffrances !\"},{\"id\":\"PASSION24.HOUR.19.P057\",\"n\":57,\"t\":\"Ma douce Vie, je voudrais\\n- r\u00e9unir les pas des cr\u00e9atures de toutes les g\u00e9n\u00e9rations et\\n- Te les envoyer tous,\\npour qu'ils viennent Te consoler dans tes dures Peines.\\n\u00d4 mon J\u00e9sus, comme ton pauvre C\u0153ur est tortur\u00e9 !\\nComment Te r\u00e9conforter dans tant de souffrances ?\"},{\"id\":\"PASSION24.HOUR.19.P058\",\"n\":58,\"t\":\"Je m'immergerai en Toi, j'immergerai mon c\u0153ur dans le Tien.\\nJ\u2019immergerai mes d\u00e9sirs dans les Tiens.\\nJ'unirai mon amour au Tien, afin que, par ton Feu, sois\\n- br\u00fbl\u00e9 le c\u0153ur de toutes les cr\u00e9atures et\"},{\"id\":\"PASSION24.HOUR.19.P059\",\"n\":59,\"t\":\"- d\u00e9truits tous les amours profanes.\"},{\"id\":\"PASSION24.HOUR.19.P060\",\"n\":60,\"t\":\"Ton C\u0153ur sacr\u00e9 en sera r\u00e9confort\u00e9.\\nMoi, \u00e0 partir de maintenant, je promets\\n- de rester toujours clou\u00e9e \u00e0 ton C\u0153ur infiniment amoureux\\npar les clous de tes D\u00e9sirs, de ton Amour et de ta Volont\u00e9.\"},{\"id\":\"PASSION24.HOUR.19.P061\",\"n\":61,\"t\":\"\u00d4 mon J\u00e9sus, je veux \u00eatre crucifi\u00e9e en Toi.\\nNe permets pas que je me d\u00e9cloue le moindrement, afin que je puisse\\n- T'aimer et r\u00e9parer pour tous et\\n- calmer la souffrance que Te procurent les cr\u00e9atures par leurs fautes.\"},{\"id\":\"PASSION24.HOUR.19.P062\",\"n\":62,\"t\":\"J\u00e9sus est clou\u00e9 \u00e0 la Croix\"},{\"id\":\"PASSION24.HOUR.19.P063\",\"n\":63,\"t\":\"Mon bon J\u00e9sus, je vois que tes ennemis\\n- soul\u00e8vent le lourd bois de la Croix et\\n- le laissent tomber dans le trou pr\u00e9vu \u00e0 cet effet.\\nEt Toi, mon doux Amour, Tu es suspendu entre Ciel et terre.\"},{\"id\":\"PASSION24.HOUR.19.P064\",\"n\":64,\"t\":\"En ce moment solennel, Tu Te tournes vers le P\u00e8re et d'une voix faible Tu Lui dis :\"},{\"id\":\"PASSION24.HOUR.19.P065\",\"n\":65,\"t\":\"\u00ab P\u00e8re saint, Me voici charg\u00e9 de tous les p\u00e9ch\u00e9s du monde. Il n'y a pas de faute qui n'ait \u00e9t\u00e9 vers\u00e9e sur Moi. Par cons\u00e9quent, ne d\u00e9charge plus sur les hommes les fl\u00e9aux de ta Justice divine, mais fais-le sur Moi, ton Fils.\"},{\"id\":\"PASSION24.HOUR.19.P066\",\"n\":66,\"t\":\"\u00d4 P\u00e8re, permets-Moi\\n- de lier toutes les \u00e2mes \u00e0 cette Croix et,\\n- par mon Sang et mes Plaies, d'obtenir le pardon pour toutes.\\n\u00d4 P\u00e8re, vois \u00e0 quel \u00e9tat Je suis r\u00e9duit !\\nEn raison de cette Croix, en vertu de ces Souffrances,\\ninduis en tous une v\u00e9ritable conversion, la Paix, le Pardon et la Saintet\u00e9. \u00bb\"},{\"id\":\"PASSION24.HOUR.19.P067\",\"n\":67,\"t\":\"Pri\u00e8re pour d\u00e9sarmer la Justice Divine J\u00e9sus, pendant que Tu es pends, transperc\u00e9, sur la Croix, ton \u00c2me n'est plus sur la terre, mais au Ciel avec ton divin P\u00e8re, pour d\u00e9fendre et plaider la cause de nos \u00e2mes.\"},{\"id\":\"PASSION24.HOUR.19.P068\",\"n\":68,\"t\":\"Mon Amour crucifi\u00e9, je souhaite moi aussi Te suivre devant le tr\u00f4ne de l'\u00c9ternel, et d\u00e9sarmer avec Toi la Justice divine. Je fais mienne ta tr\u00e8s sainte Humanit\u00e9, unie \u00e0 ta Volont\u00e9, et avec Toi, je veux faire ce que Tu fais.\"},{\"id\":\"PASSION24.HOUR.19.P069\",\"n\":69,\"t\":\"Permets, ma Vie, que\\n- mes pens\u00e9es s'\u00e9coulent en Toi,\\n- mon amour, ma volont\u00e9 et mes d\u00e9sirs s\u2019\u00e9coulent en Toi,\\n- mon \u00e9lan s'\u00e9coule dans ton C\u0153ur et tout mon \u00eatre en Toi,\\nafin que rien ne m'\u00e9chappe et que je puisse r\u00e9p\u00e9ter,\\n- acte par acte,\\n- mot par mot,\\ntout ce que Tu fais.\\nMon Bien crucifi\u00e9, Je vois, que Toi,\\n- voyant ton divin P\u00e8re \u00eatre outrag\u00e9 par les cr\u00e9atures,\\nTu Te prosternes devant Lui, et Tu caches toutes les cr\u00e9atures dans ta tr\u00e8s\\nsainte Humanit\u00e9.\\nTu nous mets en s\u00fbret\u00e9, afin que le P\u00e8re, nous regardant en Toi,\\n- \u00e0 cause de Toi,\\nne chasse pas la cr\u00e9ature hors de Lui-m\u00eame.\"},{\"id\":\"PASSION24.HOUR.19.P070\",\"n\":70,\"t\":\"Et s'Il la regarde avec d\u00e9dain, c'est parce que tant d'\u00e2mes\\n- ont contrefait la belle Image cr\u00e9\u00e9e par Lui,\\n- n'ont pens\u00e9 qu'\u00e0 L'offenser.\"},{\"id\":\"PASSION24.HOUR.19.P071\",\"n\":71,\"t\":\"Et de leur intelligence, qui \u00e9tait cens\u00e9e s'occuper de Le comprendre, ils font un r\u00e9ceptacle o\u00f9 se nichent tous leurs d\u00e9fauts. Et Toi, \u00f4 mon J\u00e9sus, pour L'apaiser, Tu attires l'attention du divin P\u00e8re pour qu'Il regarde ta T\u00eate tr\u00e8s sainte, perc\u00e9e d'\u00e9pines dans des douleurs atroces.\"},{\"id\":\"PASSION24.HOUR.19.P072\",\"n\":72,\"t\":\"Ainsi vous gardez comme clou\u00e9es dans votre Esprit toutes les intelligences des cr\u00e9atures. Pour chacune desquelles vous offrez une expiation pour satisfaire la Justice Divine.\"},{\"id\":\"PASSION24.HOUR.19.P073\",\"n\":73,\"t\":\"Oh, comme ces \u00e9pines excusent toutes les mauvaises pens\u00e9es des cr\u00e9atures, comme des voix pitoyables devant la Divine Majest\u00e9 ! Mon J\u00e9sus, mes pens\u00e9es ne font qu'un avec les Tiennes.\"},{\"id\":\"PASSION24.HOUR.19.P074\",\"n\":74,\"t\":\"C'est pourquoi, avec Toi, je prie, j'implore, j'excuse et je r\u00e9pare devant la divine Majest\u00e9 tout le mal commis par les cr\u00e9atures avec leur intelligence.\"},{\"id\":\"PASSION24.HOUR.19.P075\",\"n\":75,\"t\":\"Permets-moi\\n- de prendre tes \u00e9pines et ta propre Intelligence et\\n- d'aller avec Toi vers toutes les cr\u00e9atures,\\npour attacher ton Intelligence \u00e0 la leur.\"},{\"id\":\"PASSION24.HOUR.19.P076\",\"n\":76,\"t\":\"Je veux leur rendre leur intelligence, telle que Tu l'as cr\u00e9\u00e9e \u00e0 l'origine,\\n- avec la Saintet\u00e9 qui est la tienne.\\nJe veux\\n- r\u00e9ordonner par la saintet\u00e9 de tes Pens\u00e9es\\ntoutes les pens\u00e9es des cr\u00e9atures en Toi, et\\n- percer de tes \u00e9pines tous les esprits des cr\u00e9atures,\\npour Te rendre la Domination et le R\u00e8gne sur tous.\"},{\"id\":\"PASSION24.HOUR.19.P077\",\"n\":77,\"t\":\"\u00d4 J\u00e9sus, Toi seul es le Ma\u00eetre\\n- de toute pens\u00e9e,\\n- de toute affection et\\n- de tous les peuples.\\nR\u00e8gle tout.\\nC'est seulement ainsi que la face de la terre, qui est horrifi\u00e9e et effray\u00e9e,\\nsera chang\u00e9e.\\nJ\u00e9sus crucifi\u00e9,\\nTu vois que le divin P\u00e8re, indign\u00e9, regarde les pauvres cr\u00e9atures.\\nIl les trouve toutes souill\u00e9es de culpabilit\u00e9 et couvertes des plus vilaines\\nsalet\u00e9s, \u00e0 en d\u00e9go\u00fbter le Ciel tout entier.\"},{\"id\":\"PASSION24.HOUR.19.P078\",\"n\":78,\"t\":\"Oh ! comme la Puret\u00e9 du Regard divin est frapp\u00e9e Il ne reconnait presque plus la pauvre cr\u00e9ature comme l'\u0152uvre de ses Mains tr\u00e8s saintes ! En effet, les cr\u00e9atures semblent \u00eatre autant de monstres qui occupent la terre, et elles attirent le m\u00e9pris du Regard paternel. Mais Toi, \u00f4 mon J\u00e9sus, Tu cherches \u00e0 L'apaiser en \u00e9changeant ses Yeux avec les Tiens. Et Tu les Lui fais voir couverts de Sang et gonfl\u00e9s de Larmes. Devant la divine Majest\u00e9, Tu pleures pour L'inciter \u00e0 la compassion avec le malheur de tant de pauvres cr\u00e9atures. Et j'entends ta Voix qui dit : \u00ab Mon P\u00e8re, il est vrai que la cr\u00e9ature ingrate est de plus en plus lard\u00e9e de fautes, qu'elle ne m\u00e9rite plus ton Regard paternel.\"},{\"id\":\"PASSION24.HOUR.19.P079\",\"n\":79,\"t\":\"Mais regarde-Moi, P\u00e8re, devant Toi Je veux tant pleurer, former un bain de larmes et de sang, pour laver cette salet\u00e9 dont les cr\u00e9atures se sont couvertes.\"},{\"id\":\"PASSION24.HOUR.19.P080\",\"n\":80,\"t\":\"P\u00e8re, veux-Tu Me rejeter ? Non, Tu ne le peux pas, Je suis ton Fils. Et si Je suis ton Fils, Je suis aussi la T\u00eate de toutes les cr\u00e9atures et elles sont mes Membres. Sauve-les, \u00f4 P\u00e8re, sauve-les. \u00bb\"},{\"id\":\"PASSION24.HOUR.19.P081\",\"n\":81,\"t\":\"Mon J\u00e9sus, Amour sans limites, je voudrais avoir tes Yeux pour pleurer devant la Majest\u00e9 supr\u00eame pour la perte de tant de pauvres cr\u00e9atures et pour ces tristes moments.\"},{\"id\":\"PASSION24.HOUR.19.P082\",\"n\":82,\"t\":\"Permets-moi de prendre tes Larmes et tes propres Yeux, qui ne font qu'un\\navec les miens, et d'aller vers toutes les cr\u00e9atures.\\nAfin de pousser leurs \u00e2mes \u00e0 la compassion pour ton Amour,\\nje leur ferai voir\\n- que Tu pleures pour eux et\\n- que, tandis qu'ils se salissent,\\nTu as tes Larmes et ton Sang pr\u00eats pour les laver.\\nEt Te voyant pleurer, ils se rendront.\"},{\"id\":\"PASSION24.HOUR.19.P083\",\"n\":83,\"t\":\"Oui, permets-moi de laver avec ces Larmes toute la souillure des cr\u00e9atures :\\n- qu'elles descendent dans leur c\u0153ur,\\n- qu'elles adoucissent tant d'\u00e2mes endurcies dans la culpabilit\u00e9 et\\n- qu'elles vainquent l'obstination de tous les c\u0153urs.\\nAvec tes Regards, permets-moi de p\u00e9n\u00e9trer les cr\u00e9atures de telle sorte\\n- que tous leurs regards s'\u00e9l\u00e8vent vers le Ciel pour T\u2019aimer,\\n- au lieu de se perdre sur la terre pour T\u2019offenser.\"},{\"id\":\"PASSION24.HOUR.19.P084\",\"n\":84,\"t\":\"Ainsi le P\u00e8re divin n'aura plus de m\u00e9pris en regardant la pauvre humanit\u00e9. J\u00e9sus crucifi\u00e9, je vois que le divin P\u00e8re n'est pas encore apais\u00e9 dans son indignation. Sa Bont\u00e9 paternelle, prise de tant d'Amour pour la pauvre cr\u00e9ature, a rempli le Ciel et la terre d'attestations d'Amour et de Bienfaits pour elle.\"},{\"id\":\"PASSION24.HOUR.19.P085\",\"n\":85,\"t\":\"Presque \u00e0 chaque pas et \u00e0 chaque acte, elle sent couler l'Amour et les Gr\u00e2ces de ce C\u0153ur paternel.\"},{\"id\":\"PASSION24.HOUR.19.P086\",\"n\":86,\"t\":\"Mais la cr\u00e9ature, toujours ingrate, m\u00e9prise cet Amour\"},{\"id\":\"PASSION24.HOUR.19.P087\",\"n\":87,\"t\":\"Et elle ne veut pas le reconna\u00eetre.\\nAu contraire, elle s'oppose \u00e0 tant d'Amour.\\nElle remplit le Ciel et la terre d'insultes, de m\u00e9pris et d'outrages.\\nElle va jusqu'\u00e0 le placer sous ses pieds impurs,\\n- voulant presque le d\u00e9truire, s'idol\u00e2trant elle-m\u00eame.\"},{\"id\":\"PASSION24.HOUR.19.P088\",\"n\":88,\"t\":\"Toutes ces offenses p\u00e9n\u00e8trent jusqu'aux Cieux et arrivent devant la divine\\nMajest\u00e9 !\\nOh, comme Il est indign\u00e9 de voir que l'ignoble cr\u00e9ature vient L'insulter et\\nL'offenser de toutes les mani\u00e8res !\\nMais Toi, \u00f4 mon J\u00e9sus, qui as toujours l'intention de nous d\u00e9fendre,\\n- par la Puissance ravissante de ton Amour,\\nTu obliges le P\u00e8re \u00e0 regarder ton Visage tr\u00e8s saint,\\n- couvert de toutes ces insultes et de tous ces m\u00e9pris,\\net Tu dis :\\n\u00ab Mon P\u00e8re, ne m\u00e9prise pas les pauvres cr\u00e9atures.\\nSi Tu les m\u00e9prises, Tu Me m\u00e9prises. Oh, sois apais\u00e9 !\"},{\"id\":\"PASSION24.HOUR.19.P089\",\"n\":89,\"t\":\"Toutes ces offenses, Je les porte sur mon Visage. Je Te r\u00e9ponds pour toutes.\"},{\"id\":\"PASSION24.HOUR.19.P090\",\"n\":90,\"t\":\"Mon P\u00e8re, arr\u00eate ta fureur contre la pauvre humanit\u00e9. Elle est aveugle et ne sait pas ce qu'elle fait. Par cons\u00e9quent, regarde-Moi bien, car Je suis r\u00e9duit \u00e0 cause d'elle.\"},{\"id\":\"PASSION24.HOUR.19.P091\",\"n\":91,\"t\":\"Si Tu n'es pas \u00e9mu de compassion pour l'humanit\u00e9 mis\u00e9rable,\\nque mon Visage,\\n- souill\u00e9 de crachats, couvert de Sang,\\n- p\u00e2le et gonfl\u00e9 par les nombreuses gifles et coups que J'ai re\u00e7us,\\nT\u2019incite \u00e0 la compassion.\"},{\"id\":\"PASSION24.HOUR.19.P092\",\"n\":92,\"t\":\"Piti\u00e9, P\u00e8re ! J'\u00e9tais le plus beau de tous. Et maintenant Je suis tout d\u00e9figur\u00e9, de sorte que Je ne Me reconnais plus. Je suis devenu l'abjection de tous. C'est pourquoi, \u00e0 tout prix, Je veux sauver la pauvre cr\u00e9ature. \u00bb\"},{\"id\":\"PASSION24.HOUR.19.P093\",\"n\":93,\"t\":\"Mon J\u00e9sus, est-il possible que Tu nous aimes tant ? Ton amour \u00e9crase mon pauvre c\u0153ur.\"},{\"id\":\"PASSION24.HOUR.19.P094\",\"n\":94,\"t\":\"Voulant Te suivre en tout,\\npermets-moi de prendre ton tr\u00e8s saint Visage\\n- pour l'avoir en mon pouvoir,\\n- pour le montrer sans cesse d\u00e9figur\u00e9 au P\u00e8re,\\n- pour l'\u00e9mouvoir de compassion pour la pauvre humanit\u00e9,\\nqui est tellement opprim\u00e9e sous le fouet de la Justice divine qu'elle g\u00eet presque\\nmourante.\\nPermets-moi\\n- d'aller parmi les cr\u00e9atures, et\\n- de leur faire voir ton Visage si d\u00e9figur\u00e9 \u00e0 cause d'elles,\\npour les pousser \u00e0 la compassion pour leurs \u00e2mes et pour ton Amour.\"},{\"id\":\"PASSION24.HOUR.19.P095\",\"n\":95,\"t\":\"Avec la Lumi\u00e8re que rayonne ton Visage et avec la Puissance ravissante de\\nton Amour, fais-leur comprendre\\n- qui Tu es et\\n- qui sont ceux qui osent T'offenser.\"},{\"id\":\"PASSION24.HOUR.19.P096\",\"n\":96,\"t\":\"Fais que leurs \u00e2mes se l\u00e8vent des nombreuses fautes\\n- dans lesquelles ils vivent, morts \u00e0 la gr\u00e2ce,\\nafin qu'ils se prosternent tous devant Toi\\n- dans l'acte de T'adorer et de Te glorifier.\\nMon J\u00e9sus, adorable crucifi\u00e9, la cr\u00e9ature irrite toujours la Justice divine\"},{\"id\":\"PASSION24.HOUR.19.P097\",\"n\":97,\"t\":\"de sa langue r\u00e9sonne l'\u00e9cho\\n- d'horribles blasph\u00e8mes, de voix d'impr\u00e9cations et\\n- de mal\u00e9dictions, de discours diaboliques,\\n- de mani\u00e8res de la meilleure fa\u00e7on de tuer et de faire un carnage.\\nAh ! toutes ces voix assourdissent la terre et p\u00e9n\u00e8trent jusqu'aux cieux,\\nassourdissant l'Ou\u00efe divine, qui,\\n- fatigu\u00e9e de cet \u00e9cho empoisonn\u00e9 qu\u2019envoie la cr\u00e9ature,\\nvoudrait s'en d\u00e9barrasser, en la chassant d'elle-m\u00eame\\nCar toutes ces voix empoisonn\u00e9es\\n- jurent et demandent vengeance et justice contre elle.\\nOh ! comme la Justice divine se sent pouss\u00e9e \u00e0 lancer des fl\u00e9aux !\\nOh ! comme tant de blasph\u00e8mes hideux\\n- enflamment sa fureur contre la cr\u00e9ature !\"},{\"id\":\"PASSION24.HOUR.19.P098\",\"n\":98,\"t\":\"Mais Toi, \u00f4 mon J\u00e9sus, qui nous aimes d'un Amour supr\u00eame,\\nTu affrontes ces voix mortelles.\\nAvec ta Voix toute-puissante et cr\u00e9atrice,\\n- dans laquelle Tu rassembles toutes ces voix,\"},{\"id\":\"PASSION24.HOUR.19.P099\",\"n\":99,\"t\":\"Tu fais entendre ta Voix la plus douce au P\u00e8re\\n- pour Le consoler du harc\u00e8lement que Lui font subir les cr\u00e9atures,\\navec autant de voix de b\u00e9n\u00e9dictions et de louanges, et\\nTu cries : \u00ab Mis\u00e9ricorde, Gr\u00e2ces et Amour pour la pauvre cr\u00e9ature ! \u00bb\"},{\"id\":\"PASSION24.HOUR.19.P100\",\"n\":100,\"t\":\"Et pour apaiser l\u2019indignation du P\u00e8re, Tu Lui montres ta Bouche tr\u00e8s sainte, et Tu dis :\"},{\"id\":\"PASSION24.HOUR.19.P101\",\"n\":101,\"t\":\"\u00ab Mon P\u00e8re, regarde-Moi, n'\u00e9coutes pas les voix des cr\u00e9atures, mais la Mienne. C'est Moi qui satisfais pour toutes.\"},{\"id\":\"PASSION24.HOUR.19.P102\",\"n\":102,\"t\":\"Je Te prie de regarder la cr\u00e9ature en Moi. Si Tu la regardes hors de Moi, qu'en sera-t-il d'elle ? Elle est faible, ignorante, capable de faire seulement le mal. Elle est remplie de toutes les mis\u00e8res.\"},{\"id\":\"PASSION24.HOUR.19.P103\",\"n\":103,\"t\":\"Piti\u00e9, piti\u00e9 pour la pauvre cr\u00e9ature !\\nMoi Je r\u00e9ponds d'elle par ma Langue\\nrendue am\u00e8re par le fiel, dess\u00e9ch\u00e9e par la Soif, br\u00fbl\u00e9e par l'Amour. \u00bb\\nMon J\u00e9sus plein d\u2019amertume, ma voix, fondue dans la Tienne,\\n- veut faire face \u00e0 toutes ces offenses.\"},{\"id\":\"PASSION24.HOUR.19.P104\",\"n\":104,\"t\":\"Permets-moi\\n- de prendre ta Langue, tes L\u00e8vres, et\\n- de faire le tour de toutes les cr\u00e9atures.\"},{\"id\":\"PASSION24.HOUR.19.P105\",\"n\":105,\"t\":\"Permets-moi de toucher leur langue avec la Tienne, afin que,\\n- ressentant l'amertume de la Tienne dans l'acte de T'offenser,\\nsinon par amour, du moins pour l'amertume\\n- qu'ils ressentent, ils ne blasph\u00e8ment plus.\"},{\"id\":\"PASSION24.HOUR.19.P106\",\"n\":106,\"t\":\"Permets-moi de toucher leurs l\u00e8vres avec les Tiennes, afin qu'\\n- en faisant sentir le feu de la culpabilit\u00e9 sur les l\u00e8vres de tous, et\\n- en faisant r\u00e9sonner ta Voix toute-puissante dans toutes les poitrines,\\nTu puisses\\n- arr\u00eater le courant de toutes les voix mauvaises, et\\n- changer toutes les voix humaines en voix de b\u00e9n\u00e9diction et de louange.\"},{\"id\":\"PASSION24.HOUR.19.P107\",\"n\":107,\"t\":\"Mon J\u00e9sus crucifi\u00e9,\\ndevant ton grand Amour et ta grande Souffrance, la cr\u00e9ature ne c\u00e8de pas.\\nAu contraire, Te m\u00e9prisant,\\n- elle commet faute apr\u00e8s faute,\\n- elle fait des sacril\u00e8ges \u00e9normes, des homicides, des suicides, des duels, des\\nfraudes, des tromperies, des cruaut\u00e9s et des trahisons.\\nAh ! toutes ces \u0153uvres mauvaises\\nappesantissent le Bras de ton P\u00e8re c\u00e9leste.\\nLe P\u00e8re ne peut plus soutenir le poids de tant de fautes.\\nIl est sur le point de faire s'abattre la destruction sur la terre.\\nEt Toi, \u00f4 mon J\u00e9sus, pour soustraire la cr\u00e9ature \u00e0 la Fureur divine,\\n- Tu tends les bras vers le P\u00e8re,\\n- Tu Le d\u00e9sarmes et\\n- Tu emp\u00eaches que sa Justice ne suive son cours.\"},{\"id\":\"PASSION24.HOUR.19.P108\",\"n\":108,\"t\":\"Pour Le toucher de compassion envers la mis\u00e9rable humanit\u00e9, Tu Lui dis de ta Voix la plus persuasive :\"},{\"id\":\"PASSION24.HOUR.19.P109\",\"n\":109,\"t\":\"\u00ab Mon P\u00e8re, regarde ces Mains d\u00e9chir\u00e9es et ces clous qui les transpercent.\"},{\"id\":\"PASSION24.HOUR.19.P110\",\"n\":110,\"t\":\"Dans ces Mains, Je ressens les souffrances atroces que Me procurent toutes ces \u0153uvres mauvaises. N'es-Tu pas content, \u00f4 P\u00e8re, de mes Souffrances ?\"},{\"id\":\"PASSION24.HOUR.19.P111\",\"n\":111,\"t\":\"Suis-Je incapable de Te satisfaire ?\\nOui, mes Bras disloqu\u00e9s seront toujours des cha\u00eenes\\n- qui tiendront press\u00e9es sur Moi les pauvres cr\u00e9atures,\\nafin qu'elles ne M'\u00e9chappent pas,\\n- \u00e0 l'exception de celles qui Me quitteront par la force.\"},{\"id\":\"PASSION24.HOUR.19.P112\",\"n\":112,\"t\":\"Mes bras seront des cha\u00eenes amoureuses qui Te retiendront, P\u00e8re, pour T\u2019emp\u00eacher de d\u00e9truire les pauvres cr\u00e9atures.\"},{\"id\":\"PASSION24.HOUR.19.P113\",\"n\":113,\"t\":\"Au contraire, Je T\u2019attirerai de plus en plus pr\u00e8s d'elles,\\npour que Tu d\u00e9verses sur elles tes Gr\u00e2ces de Mis\u00e9ricorde ! \u00bb\\nMon J\u00e9sus, ton Amour est\\n- un doux enchantement pour moi et - me pousse \u00e0 faire ce que Tu fais.\"},{\"id\":\"PASSION24.HOUR.19.P114\",\"n\":114,\"t\":\"Par cons\u00e9quent, avec Toi je veux emp\u00eacher, au prix de n'importe quelle souffrance, que la Justice divine ne suive son cours contre la pauvre humanit\u00e9.\"},{\"id\":\"PASSION24.HOUR.19.P115\",\"n\":115,\"t\":\"Par le sang qui coule de tes Mains, je veux calmer la fureur de cette Justice.\"},{\"id\":\"PASSION24.HOUR.19.P116\",\"n\":116,\"t\":\"Permets que je d\u00e9pose dans tes Bras les souffrances et les d\u00e9chirements\\n- de tous les hommes,\\n- de tous les c\u0153urs afflig\u00e9s et opprim\u00e9s.\"},{\"id\":\"PASSION24.HOUR.19.P117\",\"n\":117,\"t\":\"Et pour mouvoir le P\u00e8re \u00e0 la compassion envers la pauvre cr\u00e9ature, permets-moi de d\u00e9poser toutes les cr\u00e9atures dans tes Bras, afin que toutes reviennent \u00e0 ton C\u0153ur.\"},{\"id\":\"PASSION24.HOUR.19.P118\",\"n\":118,\"t\":\"Permets que, par la puissance de tes Mains cr\u00e9atrices,\\n- j'arr\u00eate le d\u00e9roulement de tant d'\u0153uvres mauvaises et que\\n- je d\u00e9tourne tous les gens de faire le mal.\\nMon aimable J\u00e9sus crucifi\u00e9, la cr\u00e9ature\\n- veut boire jusqu'au fond la lie de la faute et\\n- court comme une folle sur la voie du mal.\"},{\"id\":\"PASSION24.HOUR.19.P119\",\"n\":119,\"t\":\"Elle commet faute apr\u00e8s faute, d\u00e9sob\u00e9it \u00e0 tes Lois et se r\u00e9volte contre Toi. Et comme pour Te faire une m\u00e9chancet\u00e9 suppl\u00e9mentaire, elle veut aller en enfer. Oh ! comme s'indigne la Majest\u00e9 supr\u00eame ! Et Toi, \u00f4 mon J\u00e9sus, pour calmer le divin P\u00e8re, Tu Lui fais voir ta sainte Humanit\u00e9 lac\u00e9r\u00e9e, disloqu\u00e9e, horriblement tortur\u00e9e. Tu Lui montres tes Pieds transperc\u00e9s, tordus par l'atrocit\u00e9 des souffrances.\"},{\"id\":\"PASSION24.HOUR.19.P120\",\"n\":120,\"t\":\"J'entends ta Voix, plus touchante que jamais qui, par la force de ton Amour et de ta Souffrance, veut vaincre la cr\u00e9ature et triompher du C\u0153ur paternel :\"},{\"id\":\"PASSION24.HOUR.19.P121\",\"n\":121,\"t\":\"\u00ab Mon P\u00e8re, regarde-Moi de la T\u00eate aux Pieds : il n'y a aucune partie saine en Moi. Je n'ai plus d'endroit o\u00f9 Me faire ouvrir d'autres plaies et me procurer d'autres souffrances.\"},{\"id\":\"PASSION24.HOUR.19.P122\",\"n\":122,\"t\":\"Si Tu ne T\u2019apaise pas \u00e0 ce spectacle d'Amour, qu'est-ce qui ne pourrait jamais Te calmer ?\"},{\"id\":\"PASSION24.HOUR.19.P123\",\"n\":123,\"t\":\"\u00d4 cr\u00e9atures, si vous ne c\u00e9dez pas devant tant d'Amour, quel espoir Me reste-t-Il de vous amener \u00e0 la conversion ?\"},{\"id\":\"PASSION24.HOUR.19.P124\",\"n\":124,\"t\":\"Mes Plaies et mon Sang seront toujours des chemins qui feront descendre du Ciel \u00e0 la terre des gr\u00e2ces de repentir, de pardon et de compassion pour la pauvre humanit\u00e9 ! \u00bb\"},{\"id\":\"PASSION24.HOUR.19.P125\",\"n\":125,\"t\":\"Mon J\u00e9sus, je Te vois dans un \u00e9tat de violence\\n- pour apaiser le P\u00e8re et vaincre la pauvre cr\u00e9ature.\"},{\"id\":\"PASSION24.HOUR.19.P126\",\"n\":126,\"t\":\"Permets-moi\\n- de prendre tes Pieds tr\u00e8s saints et de faire le tour de toutes les cr\u00e9atures,\\n- de lier leurs pas \u00e0 tes Pieds.\"},{\"id\":\"PASSION24.HOUR.19.P127\",\"n\":127,\"t\":\"Ainsi, si elles veulent marcher dans la voie du mal,\\n- sentant les cha\u00eenes que Tu as mises entre Toi et elles,\\nelles ne peuvent pas le faire.\"},{\"id\":\"PASSION24.HOUR.19.P128\",\"n\":128,\"t\":\"Avec tes Pieds, fais-les d\u00e9vier de la voie du mal, mets-les dans la voie du Bien,\\nrends-les plus dociles \u00e0 tes Lois.\\nEt avec tes clous, ferme l'enfer, pour que plus personne n'y tombe dedans.\\nOh J\u00e9sus, mon Amour crucifi\u00e9, je vois que Tu n'en peux plus.\\nLa tension horrible que Tu subis sur la Croix,\\n- le grincement continu de tes Os\\nqui se disloquent davantage \u00e0 chaque petit mouvement,\\n- tes Chairs qui se d\u00e9chirent de plus en plus,\\n- la Soif ardente qui Te consume,\\n- les Peines int\u00e9rieures qui T'abreuvent,\\n- et avec tout cela, l'ingratitude humaine qui, comme une vague imp\u00e9tueuse,\\np\u00e9n\u00e8tre jusque dans ton C\u0153ur transperc\u00e9,\\nT'opprime tellement que, ne r\u00e9sistant pas au poids de tant de martyrs,\\nton Humanit\u00e9 infiniment sainte est sur le point de s'\u00e9teindre.\\nD\u00e9lirant d'Amour et de Souffrances, Elle demande aide et piti\u00e9 !\\nJ\u00e9sus crucifi\u00e9, est-il possible que Toi qui gouvernes tout et donnes Vie \u00e0 tous,\\nTu demandes de l'aide ?\"},{\"id\":\"PASSION24.HOUR.19.P129\",\"n\":129,\"t\":\"Ah ! comme je voudrais\\n- p\u00e9n\u00e9trer dans chaque goutte de ton Sang et\\n- verser le mien pour soulager chacune de tes Plaies,\\npour apaiser et rendre moins douloureuse la piq\u00fbre de chaque \u00e9pine.\"},{\"id\":\"PASSION24.HOUR.19.P130\",\"n\":130,\"t\":\"Je voudrais p\u00e9n\u00e9trer dans chaque Peine int\u00e9rieure de ton C\u0153ur\\n- pour soulager tes Amertumes.\\nJe voudrais Te donner vie pour Vie.\\nSi cela m'\u00e9tait possible, je voudrais Te d\u00e9clouer de la Croix\\n- pour me mettre \u00e0 ta place.\"},{\"id\":\"PASSION24.HOUR.19.P131\",\"n\":131,\"t\":\"Mais je vois que je ne suis rien et ne peux rien, \u00e9tant trop insignifiante.\"},{\"id\":\"PASSION24.HOUR.19.P132\",\"n\":132,\"t\":\"\u00d4 J\u00e9sus, donne-moi ton propre \u00catre. Je prendrai vie en Toi, et je Te donnerai \u00e0 Toi-m\u00eame. Ainsi je contenterai mes d\u00e9sirs les plus ardents. \u00d4 J\u00e9sus tortur\u00e9, je vois que ton Humanit\u00e9 infiniment sainte est pr\u00e8s de s'\u00e9teindre, non pour Toi-m\u00eame, mais pour accomplir notre R\u00e9demption.\"},{\"id\":\"PASSION24.HOUR.19.P133\",\"n\":133,\"t\":\"Tu as besoin d'Aide divine\\nTu Te jettes dans les Bras de ton P\u00e8re, Lui demandant aide et secours.\\nOh ! comme le divin P\u00e8re s'attendrit \u00e0 regarder\\n- l'horrible souffrance de ton Humanit\u00e9,\\n- la destruction terrible que la faute a fait sur tes Membres infiniment saints !\"},{\"id\":\"PASSION24.HOUR.19.P134\",\"n\":134,\"t\":\"Pour contenter tes ardents D\u00e9sirs d'Amour,\\n- Il Te serre sur son C\u0153ur paternel et\\n- Te donne les Secours n\u00e9cessaires pour accomplir notre R\u00e9demption.\"},{\"id\":\"PASSION24.HOUR.19.P135\",\"n\":135,\"t\":\"Et tandis qu'Il Te serre, Tu ressens dans ton C\u0153ur se r\u00e9p\u00e9ter plus fortement\\n- les coups sur les clous, les morsures des fouets,\\n- les d\u00e9chirements de tes Plaies, les piq\u00fbres des \u00e9pines.\"},{\"id\":\"PASSION24.HOUR.19.P136\",\"n\":136,\"t\":\"Oh ! comme le P\u00e8re en est frapp\u00e9 ! Comme Il s'indigne de voir que toutes ces peines Te sont inflig\u00e9es jusque dans ton C\u0153ur par des \u00e2mes qui Te sont consacr\u00e9es ! Et dans sa Souffrance, Il dit :\"},{\"id\":\"PASSION24.HOUR.19.P137\",\"n\":137,\"t\":\"\u00ab Est-il possible, mon Fils, que pas m\u00eame les \u00e2mes \u00e9lues par Toi soient toutes avec Toi ? Au contraire, il semble que ces \u00e2mes viennent dans ton C\u0153ur pour T'attrister et Te procurer une mort encore plus douloureuse. Et ce qui est pire, toutes ces souffrances qu'elles Te procurent sont couvertes d'hypocrisie.\"},{\"id\":\"PASSION24.HOUR.19.P138\",\"n\":138,\"t\":\"Ah ! Fils, Je ne peux plus contenir mon Indignation devant l'ingratitude de ces \u00e2mes qui M'affligent plus que toutes les autres cr\u00e9atures ensemble ! \u00bb Mais Toi, \u00f4 mon J\u00e9sus, triomphant de tout, Tu d\u00e9fends m\u00eame ces \u00e2mes, Tu endigues par l'Amour immense de ton C\u0153ur les vagues des amertumes et des blessures qu'elles Te procurent.\"},{\"id\":\"PASSION24.HOUR.19.P139\",\"n\":139,\"t\":\"Pour apaiser le P\u00e8re, Tu Lui dis : \u00ab Mon P\u00e8re, regarde mon C\u0153ur : que toutes ces Souffrances Te satisfassent.\"},{\"id\":\"PASSION24.HOUR.19.P140\",\"n\":140,\"t\":\"Et que plus elles sont cruelles, plus elles soient puissantes sur ton C\u0153ur de P\u00e8re pour leur obtenir Gr\u00e2ces, Lumi\u00e8re et Pardon.\"},{\"id\":\"PASSION24.HOUR.19.P141\",\"n\":141,\"t\":\"Mon P\u00e8re, ne les rejetez pas.\\nElles seront mes d\u00e9fenderesses qui continueront ma Vie sur la terre. \u00bb\\nP\u00e8re tr\u00e8s aimant, consid\u00e9rez que,\\n- mon Humanit\u00e9 a maintenant atteint le sommet de ses Souffrances, et\\n- mon C\u0153ur se d\u00e9chire aussi par l'Amertume, les Douleurs intimes et les\\nDouleurs inou\u00efes que J'ai subies pendant trente-quatre ans,\\ncommen\u00e7ant \u00e0 l\u2019instant de mon Incarnation.\"},{\"id\":\"PASSION24.HOUR.19.P142\",\"n\":142,\"t\":\"Tu connais l'intensit\u00e9 de cette Amertume int\u00e9rieure, qui M\u2019aurait fait mourir \u00e0 chaque instant par l\u2019atrocit\u00e9 des spasmes, Si notre Toute-Puissance ne M'avait pas soutenu, pour prolonger mes Souffrances jusqu'\u00e0 cette Agonie extr\u00eame.\"},{\"id\":\"PASSION24.HOUR.19.P143\",\"n\":143,\"t\":\"Ah ! jusqu'\u00e0 pr\u00e9sent,\\nJe T\u2019ai offert toutes les Peines de ma tr\u00e8s sainte Humanit\u00e9\\n- pour apaiser Ta Justice qui p\u00e8se sur tous et\\n- pour attirer Ta Mis\u00e9ricorde triomphante sur tous.\"},{\"id\":\"PASSION24.HOUR.19.P144\",\"n\":144,\"t\":\"Maintenant Je Te montre mon C\u0153ur bris\u00e9 sous la pression de tous les moments de ma Vie mortelle, en particulier par les sacril\u00e8ges des \u00e2mes consacr\u00e9es \u00e0 Nous.\"},{\"id\":\"PASSION24.HOUR.19.P145\",\"n\":145,\"t\":\"Regarde mon P\u00e8re : c'est le C\u0153ur qui T\u2019aimait d'un amour infini, qui a toujours br\u00fbl\u00e9 d'Amour pour mes fr\u00e8res, tes enfants en Moi.\"},{\"id\":\"PASSION24.HOUR.19.P146\",\"n\":146,\"t\":\"C\u2019est le C\u0153ur g\u00e9n\u00e9reux avec lequel J\u2019ai tant souffert\\n- pour Te donner la compl\u00e8te satisfaction\\n- pour tous les p\u00e9ch\u00e9s des hommes.\"},{\"id\":\"PASSION24.HOUR.19.P147\",\"n\":147,\"t\":\"Aie piti\u00e9 de ses D\u00e9solations, de ses Peines constantes, de ses Angoisses, de sa Tristesse avant la mort !\"},{\"id\":\"PASSION24.HOUR.19.P148\",\"n\":148,\"t\":\"\u00d4 mon P\u00e8re, chaque battement de mon C\u0153ur voulait Ta Gloire, au prix de tant de douleurs et de mon Sang, pour le salut de mes fr\u00e8res.\"},{\"id\":\"PASSION24.HOUR.19.P149\",\"n\":149,\"t\":\"Regarde mon C\u0153ur opprim\u00e9, avec\\n- les Supplications ardentes, les G\u00e9missements,\\n- les Soupirs, les Douleurs.\\nPendant trente-quatre ans,\\nJ'ai pleur\u00e9 et demand\u00e9 Ta Mis\u00e9ricorde pour tous.\"},{\"id\":\"PASSION24.HOUR.19.P150\",\"n\":150,\"t\":\"Mon P\u00e8re, Tu M\u2019as toujours \u00e9cout\u00e9. Je Te remercie infiniment.\"},{\"id\":\"PASSION24.HOUR.19.P151\",\"n\":151,\"t\":\"Mais regarde mon P\u00e8re : les Chagrins de mon C\u0153ur ne peuvent pas se calmer si m\u00eame une seule \u00e2me \u00e9chappe \u00e0 son Amour. Car Nous aimons une \u00e2me seule comme Nous aimons toutes les \u00e2mes ensemble. Dois-Je pousser le dernier soupir sur cet \u00e9chafaud douloureux En voyant p\u00e9rir mis\u00e9rablement m\u00eame des \u00e2mes consacr\u00e9es \u00e0 Nous ?\"},{\"id\":\"PASSION24.HOUR.19.P152\",\"n\":152,\"t\":\"Je meurs dans une Mer de Douleurs et de Peines pour l'iniquit\u00e9 et la perte \u00e9ternelle du perfide Judas : Si dur et ingrat il a rejet\u00e9 tous mes Actes affectueux et d\u00e9licats. Il en a profit\u00e9 jusqu'\u00e0 devenir pr\u00eatre, \u00e9v\u00eaque, comme mes autres ap\u00f4tres. Ah, mon P\u00e8re, cet ab\u00eeme de douleur suffit !\"},{\"id\":\"PASSION24.HOUR.19.P153\",\"n\":153,\"t\":\"Je vois tellement d'\u00e2mes, choisies par Nous pour le sacerdoce. Ils veulent imiter Judas, certaines plus, d'autres moins !\"},{\"id\":\"PASSION24.HOUR.19.P154\",\"n\":154,\"t\":\"Aide-Moi, mon P\u00e8re, aide-Moi ! Je ne peux pas supporter toutes ces Douleurs. Vois : il n\u2019y a aucune fibre dans mon C\u0153ur qui ne soit pas tourment\u00e9e autant que tous les Tourments de mon divin Corps ensemble. Vois que tout le Sang que Je verse coule plus de mon C\u0153ur que de mes autres Blessures. Il est sous pression de l'Amour et de la Douleur.\"},{\"id\":\"PASSION24.HOUR.19.P155\",\"n\":155,\"t\":\"Piti\u00e9, mon P\u00e8re, piti\u00e9 ! Pas pour Moi, pour tout ce que Je souffre pour les pauvres \u00e2mes. Mais par piti\u00e9 de toutes les \u00e2mes, en particulier pour celles et ceux, hommes et femmes, consacr\u00e9s \u00e0 Nous.\"},{\"id\":\"PASSION24.HOUR.19.P156\",\"n\":156,\"t\":\"Mon P\u00e8re, \u00e9coute, mon C\u0153ur - arriv\u00e9 \u00e0 la fin de la vie - acc\u00e9l\u00e8re ses Battements et ses Cris lancinants.\"},{\"id\":\"PASSION24.HOUR.19.P157\",\"n\":157,\"t\":\"En \u00e9change de toutes mes Souffrances, Je Te demande le repentir et la conversion de toutes ces \u00e2mes malheureuses. Qu\u2019aucune d\u2019elles ne Nous \u00e9chappent !\"},{\"id\":\"PASSION24.HOUR.19.P158\",\"n\":158,\"t\":\"Mon P\u00e8re, J'ai soif. J\u2019ai soif de toutes les \u00e2mes, surtout de celles-ci. J'ai soif de souffrir davantage pour chacune de ces \u00e2mes. J'ai toujours fait votre Volont\u00e9, mon P\u00e8re. Ceci est ma Volont\u00e9, qui est aussi la Tienne !\"},{\"id\":\"PASSION24.HOUR.19.P159\",\"n\":159,\"t\":\"Que tout cela soit fait parfaitement par Amour pour Moi, votre Fils bien-aim\u00e9, \u2018en qui Tu as trouv\u00e9 tes complaisances\u2019. \u00d4 mon J\u00e9sus, je ne peux plus r\u00e9sister. Je m'unis \u00e0 tes Supplications, \u00e0 tes Souffrances, \u00e0 ton Amour p\u00e9nitent. Donne-moi ton C\u0153ur, afin que je puisse ressentir ta m\u00eame Soif pour les \u00e2mes qui Te sont consacr\u00e9es et, avec mes battements, Te rendre l'amour et les affections de tous.\"},{\"id\":\"PASSION24.HOUR.19.P160\",\"n\":160,\"t\":\"Permets-moi de les parcourir tous et d'y d\u00e9poser ton C\u0153ur.\\nQue les froids soient r\u00e9chauff\u00e9s \u00e0 son contact,\\nque les ti\u00e8des soient secou\u00e9s,\\nque les \u00e9gar\u00e9s soient rappel\u00e9s, et\\nque les nombreuses gr\u00e2ces rejet\u00e9es leur reviennent.\\nVotre C\u0153ur est suffoqu\u00e9 de Tristesse et d'Amertume\\n- de voir tant de projets que Tu avais pour eux rendus vains par leur manque\\nde correspondance, et\\n- de voir que tant d'autres \u00e2mes, qui auraient d\u00fb avoir la Vie et le Salut par eux,\\nen subissent les tristes cons\u00e9quences.\"},{\"id\":\"PASSION24.HOUR.19.P161\",\"n\":161,\"t\":\"Je leur montrerai ton C\u0153ur si amer \u00e0 cause d'eux, je lancerai sur eux des traits de Feu de ton C\u0153ur, je leur pr\u00e9senterai toutes tes Supplications et toutes tes Afflictions : il n'est pas possible qu'ils ne Te c\u00e8dent pas.\"},{\"id\":\"PASSION24.HOUR.19.P162\",\"n\":162,\"t\":\"Ainsi ils reviendront repentants \u00e0 tes Pieds,\\net tes desseins d'Amour sur eux seront r\u00e9tablis\\nIls seront en Toi et autour de Toi,\\n- non plus pour T'offenser,\\n- mais pour Te r\u00e9parer, Te consoler et Te d\u00e9fendre.\\nMa Vie, \u00f4 mon J\u00e9sus crucifi\u00e9,\\nje vois que Tu continues d'agoniser sur la Croix.\\nCar, pour tout accomplir, ton Amour n'est pas encore satisfait.\"},{\"id\":\"PASSION24.HOUR.19.P163\",\"n\":163,\"t\":\"Moi aussi, je veux agoniser avec Toi. Et vous tous, anges et saints, venez sur le mont Calvaire pour contempler les exc\u00e8s et les folies de l'Amour d'un Dieu !\"},{\"id\":\"PASSION24.HOUR.19.P164\",\"n\":164,\"t\":\"Ensemble, baisons ses Plaies sanglantes, adorons-les. Soutenons ses Membres lac\u00e9r\u00e9s, et remercions-le de la R\u00e9demption accomplie.\"},{\"id\":\"PASSION24.HOUR.19.P165\",\"n\":165,\"t\":\"Jetons un regard sur la M\u00e8re afflig\u00e9e, qui ressent autant de peines et de morts dans son C\u0153ur Immacul\u00e9 qu'elle en voit chez son Fils Dieu. Ses propres v\u00eatements sont impr\u00e9gn\u00e9s de sang. Le mont Calvaire en est tout \u00e9maill\u00e9.\"},{\"id\":\"PASSION24.HOUR.19.P166\",\"n\":166,\"t\":\"Tous ensemble, prenons ce Sang,\\n- prions la M\u00e8re afflig\u00e9e de s'unir \u00e0 nous,\\ndivisons entre nous le monde entier, et allons aider tous les gens.\"},{\"id\":\"PASSION24.HOUR.19.P167\",\"n\":167,\"t\":\"Aidons\\n- ceux en danger afin qu'ils ne p\u00e9rissent pas,\\n- ceux qui sont tomb\u00e9s afin qu'ils se rel\u00e8vent,\\n- ceux qui sont sur le point de tomber afin qu'ils ne tombent pas.\"},{\"id\":\"PASSION24.HOUR.19.P168\",\"n\":168,\"t\":\"Donnons ce Sang \u00e0 tous les aveugles, afin que resplendisse sur eux la Lumi\u00e8re de la V\u00e9rit\u00e9. En particulier, allons parmi les combattants. Servons-leur de sentinelles vigilantes. S'ils sont sur le point d'\u00eatre atteints par les balles de l'ennemi, recevons-les dans nos bras pour les r\u00e9conforter. Et s'ils sont abandonn\u00e9s de tous, s'ils sont d\u00e9sesp\u00e9r\u00e9s par leur triste sort, donnons-leur ce Sang, pour qu'ils se r\u00e9signent et que leur soit adoucie l'atrocit\u00e9 de leurs souffrances.\"},{\"id\":\"PASSION24.HOUR.19.P169\",\"n\":169,\"t\":\"Et si nous en voyons qui sont sur le point de tomber en enfer,\\n- donnons-leur ce Sang divin, qui contient les Gr\u00e2ces de la R\u00e9demption,\\net arrachons-les \u00e0 satan !\"},{\"id\":\"PASSION24.HOUR.19.P170\",\"n\":170,\"t\":\"Et tandis que je tiendrai J\u00e9sus serr\u00e9 sur mon c\u0153ur pour Le d\u00e9fendre et tout r\u00e9parer, je serrerai tous ces gens sur ton C\u0153ur, afin que tous obtiennent la gr\u00e2ce de la conversion, de la force et du salut. \u00d4 J\u00e9sus, je vois que le Sang coule \u00e0 ruisseaux de tes Mains et de tes Pieds.\"},{\"id\":\"PASSION24.HOUR.19.P171\",\"n\":171,\"t\":\"Les anges,\\n- pleurent, font cercle autour de Toi,\\n- admirent les Prodiges de ton Amour.\\nJe vois\\n- ta douce Maman au pied de la Croix, transperc\u00e9e de douleur,\\n- ta ch\u00e8re Marie Madeleine,\\n- ton bien-aim\u00e9 Jean,\\ntous pris par une extase de stupeur, d'amour et de douleur !\"},{\"id\":\"PASSION24.HOUR.19.P172\",\"n\":172,\"t\":\"\u00d4 J\u00e9sus,\\n- je m'unis \u00e0 Toi, je me serre sur ta Croix,\\n- je prends toutes les gouttes de ton Sang et je les verse dans mon c\u0153ur.\\nQuand je verrai ta Justice irrit\u00e9e contre les p\u00e9cheurs, alors,\\npour T'apaiser, Je Te montrerai ce Sang.\\nQuand je voudrai la conversion d'\u00e2mes obstin\u00e9es dans la faute,\\nje Te montrerai ce Sang.\\n\u00c0 cause de lui, Tu ne rejetteras pas ma pri\u00e8re.\\nCar j'aurai le gage de ton propre Sang dans mes mains.\"},{\"id\":\"PASSION24.HOUR.19.P173\",\"n\":173,\"t\":\"Et maintenant, mon Bien crucifi\u00e9,\\n- au nom de toutes les g\u00e9n\u00e9rations pass\u00e9es, pr\u00e9sentes et futures,\\n- avec ta Maman et\\n- avec tous les anges,\\nje me prosterne devant Toi et je Te dis :\\n\u00ab Nous T'adorons, \u00f4 Christ et nous Te b\u00e9nissons,\\ncar Tu as rachet\u00e9 le monde par ta sainte Croix ! \u00bb (\u2026)\"}],\"reflections\":[{\"id\":\"PASSION24.HOUR.19.REF.P001\",\"t\":\"J\u00e9sus crucifi\u00e9 ob\u00e9it aux bourreaux. Il accepte avec Amour toutes les insultes et les peines qu'ils Lui infligent. En raison du grand Amour que J\u00e9sus ressentait pour nos \u00e2mes, Il trouvait dans la Croix son lit de repos.\"},{\"id\":\"PASSION24.HOUR.19.REF.P002\",\"t\":\"Et nous, dans toutes nos peines, nous reposons-nous en Lui ? Par notre patience et notre amour, pouvons-nous dire que nous pr\u00e9parons un lit dans notre c\u0153ur pour J\u00e9sus ? Tandis que J\u00e9sus est crucifi\u00e9, il n'y a en Lui aucune partie tant interne qu'externe qui ne ressente une Peine sp\u00e9ciale. Et nous, nous gardons-nous crucifi\u00e9s avec Lui, au moins par nos sens principaux ? Quand nous prenons plaisir \u00e0 une conversation vaine ou \u00e0 un autre divertissement semblable, alors J\u00e9sus reste clou\u00e9 \u00e0 la Croix.\"},{\"id\":\"PASSION24.HOUR.19.REF.P003\",\"t\":\"Mais si ce m\u00eame go\u00fbt, nous le sacrifions par amour pour Lui, alors nous d\u00e9clouons J\u00e9sus et nous nous clouons nous-m\u00eames. Gardons-nous toujours notre intelligence, notre c\u0153ur et tout notre \u00eatre clou\u00e9s par les clous de sa sainte Volont\u00e9 ? Tandis qu'Il est crucifi\u00e9, J\u00e9sus regarde avec Amour ses bourreaux. Et nous, par amour pour Lui, regardons-nous avec amour ceux qui nous blessent ?\"},{\"id\":\"PASSION24.HOUR.19.REF.P004\",\"t\":\"Mon J\u00e9sus crucifi\u00e9,\\n- que tes clous soient enfonc\u00e9s dans mon c\u0153ur,\\n- afin qu'il n'y ait en moi aucun battement, aucune affection, aucun d\u00e9sir\\nqui ne ressente les piq\u00fbres de ces clous.\"},{\"id\":\"PASSION24.HOUR.19.REF.P005\",\"t\":\"Que le sang que versera mon c\u0153ur soit un baume\\n- qui soulage toutes tes Plaies.\"},{\"id\":\"PASSION24.HOUR.19.REF.P006\",\"t\":\"(1) Luisa a fait pr\u00e9c\u00e9der cette Heure de la pri\u00e8re suivante : \u00ab J\u00e9sus, ma M\u00e8re, venez avec moi pour \u00e9crire. Pr\u00eatez-moi vos mains tr\u00e8s saintes, afin que j'\u00e9crive ce qui Vous pla\u00eet et seulement ce que Vous voulez. \u00bb (2) Apr\u00e8s avoir publi\u00e9 la premi\u00e8re \u00e9dition de ces Heures de la Passion de Notre-Seigneur J\u00e9sus-Christ, Luisa \u00e9crivit \u00e0 saint Annibale Maria Di Francia (qui \u00e9tait le responsable de la r\u00e9daction), l'informant qu'elle se sentait pouss\u00e9e \u00e0 ajouter quelque chose au milieu de ces Heures.\"},{\"id\":\"PASSION24.HOUR.19.REF.P007\",\"t\":\"Et voici comment elle s'exprime dans une de ses lettres :\\n\u00ab \u00c0 l'heure de la Crucifixion, presque \u00e0 la fin...\\no\u00f9 il est dit que, pendant que J\u00e9sus \u00e9tait sur la Croix, son \u00e2me \u00e9tait au Ciel\\navec son divin P\u00e8re, je suis par la pens\u00e9e au Ciel.\\nEt j'essaie avec Lui de d\u00e9sarmer la Justice divine en ces temps si difficiles.\\nJe passe environ une demi-heure dans cet exercice.\\nIl me semble que mon Seigneur J\u00e9sus me fait \u00e9crire cet exercice. (...) \u00bb\\nEt ici, elle s\u2019explique :\\n\u00ab Cette Heure, J\u00e9sus sur la Croix, r\u00e9sume toute sa Vie,\\n- depuis le premier instant de sa Conception jusqu'\u00e0 son dernier Soupir.\\nIl donne un accomplissement \u00e0 tout.\\nIl remercie le divin P\u00e8re\\n- pour tout le Bien qu'Il a fait \u00e0 toutes les cr\u00e9atures et aussi\\n- pour ses propres Souffrances.\"},{\"id\":\"PASSION24.HOUR.19.REF.P008\",\"t\":\"Il Le glorifie, L'implore, Le r\u00e9pare.\\nEn un mot, ce qu'Il a fait dans sa Vie, Il l\u2019accomplit tout ensemble ici.\\nOr l'\u00e2me, se faisant l'\u00e9cho de tout ce que fait J\u00e9sus, commence aussi,\\n- depuis le premier moment o\u00f9 J\u00e9sus a \u00e9t\u00e9 con\u00e7u\\n- jusqu'au dernier moment de sa Vie,\\n\u00e0 Le remercier pour ce qu'Il a fait.\"},{\"id\":\"PASSION24.HOUR.19.REF.P009\",\"t\":\"L'ingratitude de la cr\u00e9ature est g\u00e9n\u00e9ralement si grande,\\n- elle se montre plus que jamais ingrate en recevant des bienfaits,\\n- et elle ne remercie jamais le Seigneur,\\nl'\u00e2me cherche aussi \u00e0 faire tout, complet.\"},{\"id\":\"PASSION24.HOUR.19.REF.P010\",\"t\":\"C'est la raison pour laquelle toute la Vie de J\u00e9sus-Christ est reprise dans cette Heure, et que l'on tente de rassembler toutes sortes de r\u00e9parations. Parmi tant d'\u00e2mes, n'y en aura-t-il pas quelques-unes qui voudront montrer cet h\u00e9ro\u00efsme d'amour \u00e0 J\u00e9sus ? \u00bb\"},{\"id\":\"PASSION24.HOUR.19.REF.P011\",\"t\":\"(3) Dans une autre lettre, dat\u00e9e du 7 octobre 1915, Il poursuit : \u00ab Le but de cette Heure est de d\u00e9sarmer la Justice Divine. Si dans les autres Heures on r\u00e9pare, on b\u00e9nit, on demande pardon, etc., avec celle-ci on d\u00e9sarme et on apaise\"},{\"id\":\"PASSION24.HOUR.19.REF.P012\",\"t\":\"Et l'\u00e2me, s'\u00e9levant entre Ciel et terre, tout comme J\u00e9sus-Christ,\\n- regarde la Justice Divine et essaie de l'apaiser,\\n- regarde la cr\u00e9ature et essaie de la ramener en son Sein,\\nmettant en action exactement ce que J\u00e9sus a fait.\"},{\"id\":\"PASSION24.HOUR.19.REF.P013\",\"t\":\"Et cela donne tellement de satisfaction divine qu'Il l'attend presque avec anxi\u00e9t\u00e9, parce qu'Il se sent comme rafra\u00eechi qu'une cr\u00e9ature, venant de la terre, veut sauver ses propres fr\u00e8res.\"},{\"id\":\"PASSION24.HOUR.19.REF.P014\",\"t\":\"Et, tandis que sa Justice s'enflamme,\\nIl cherche un refuge, un abri dans cette \u00e2me qui,\\n- veut faire sienne ses Souffrances.\\nEt cette \u00e2me m\u00eame, L'invite et le force \u00e0 ne pas d\u00e9truire la pauvre humanit\u00e9.\"}],\"subsections\":[]},{\"hour_id\":\"PASSION24.HOUR.20\",\"hour_number\":20,\"display_time\":\"midi \u00e0 13h\",\"title\":\"Premi\u00e8re Heure d\u2019Agonie sur la Croix\",\"short_title\":\"Premi\u00e8re Heure d\u2019Agonie sur la Croix\",\"source_pages\":[195,196,197,198,199,200,201,202,203,204],\"opening_prayer_ids\":[\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"],\"closing_prayer_ids\":[\"PASSION24.PRAYER.AFTER_EACH_HOUR\"],\"paragraphs\":[{\"id\":\"PASSION24.HOUR.20.P001\",\"n\":1,\"t\":\"La premi\u00e8re Parole :\\n\u00ab P\u00e8re, pardonne-leur car ils ne savent pas ce qu\u2019ils font ! \u00bb\\nMon Bien crucifi\u00e9,\\nje Te vois sur la Croix comme sur ton Tr\u00f4ne de Triomphe,\\nen train\\n- de conqu\u00e9rir toute chose et tous les c\u0153urs, et\\n- de les attirer \u00e0 Toi\\nde telle mani\u00e8re que tous ressentent ton Pouvoir surhumain.\"},{\"id\":\"PASSION24.HOUR.20.P002\",\"n\":2,\"t\":\"La nature, horrifi\u00e9e par ton \u00e9tat,\\n- se prosterne devant Toi et, en silence,\\n- attend des Paroles de Toi,\\npour Te rendre honneur et faire reconna\u00eetre ta Domination.\"},{\"id\":\"PASSION24.HOUR.20.P003\",\"n\":3,\"t\":\"Le soleil, en pleurant, retire sa lumi\u00e8re, ne pouvant supporter de Te voir dans cet \u00e9tat. L'enfer ressent de la terreur et, silencieux, attend. Tout est silence.\"},{\"id\":\"PASSION24.HOUR.20.P004\",\"n\":4,\"t\":\"Ta Maman afflig\u00e9e et tes fid\u00e8les sont muets et p\u00e9trifi\u00e9s \u00e0 la douloureuse vue de ton Humanit\u00e9 d\u00e9chir\u00e9e et disloqu\u00e9e. Silencieux, ils attendent une Parole de Toi !\"},{\"id\":\"PASSION24.HOUR.20.P005\",\"n\":5,\"t\":\"Ton Humanit\u00e9, qui g\u00eet dans un oc\u00e9an de Douleurs et dans les atroces\\nSouffrances de ton Agonie sur la Croix, est silencieuse.\\nOn craint que d'une Respiration \u00e0 l'autre Tu ne meures !\\nEt quoi d'autre ?\\nLes Juifs perfides et tes bourreaux impitoyables qui, jusqu'\u00e0 tout r\u00e9cemment,\\n- T'outrageaient, se moquaient de Toi,\\n- Te traitaient d'imposteur et de malfaiteur,\\nles larrons qui Te blasph\u00e9maient,\\ntous se taisent maintenant.\"},{\"id\":\"PASSION24.HOUR.20.P006\",\"n\":6,\"t\":\"Le remords les envahit.\\nS\u2019il y a encore quelque insulte qu'ils essaient de Te faire,\\nelle meurt sur leurs l\u00e8vres.\\nMais p\u00e9n\u00e9trant dans ton for int\u00e9rieur, je vois que ton Amour\\n- d\u00e9borde et\\n- Te tourmente plus encore que tes autres Souffrances.\\nTu ne peux le contenir.\"},{\"id\":\"PASSION24.HOUR.20.P007\",\"n\":7,\"t\":\"Contraint par cet Amour,\\n- Tu parles comme ce Dieu que Tu es,\\n- Tu l\u00e8ves tes Yeux mourants vers le Ciel et\\n- Tu T'exclames d'une Voix forte et \u00e9mouvante :\"},{\"id\":\"PASSION24.HOUR.20.P008\",\"n\":8,\"t\":\"\u00ab P\u00e8re, pardonne-leur, car ils ne savent pas ce qu'ils font ! \u00bb\\nEt, de nouveau,\\n- Tu Te renfermes dans le silence,\\n- Tu es plong\u00e9 dans des Souffrances inou\u00efes.\\nJ\u00e9sus crucifi\u00e9, tant d'Amour est-il possible ?\\nAh ! Apr\u00e8s tant de Souffrances et d'insultes, ta premi\u00e8re Parole\\nen est une de pardon.\"},{\"id\":\"PASSION24.HOUR.20.P009\",\"n\":9,\"t\":\"Tu nous excuses devant le P\u00e8re de tant de p\u00e9ch\u00e9s ! Cette Parole, Tu la fais descendre dans tout c\u0153ur apr\u00e8s la faute.\"},{\"id\":\"PASSION24.HOUR.20.P010\",\"n\":10,\"t\":\"C'est Toi le premier \u00e0 offrir le Pardon.\\nMais beaucoup rejettent ce Pardon.\\nAlors ton Amour devient fou.\\nCar, br\u00fblant d'ardeur, il veut donner \u00e0 tous le Pardon et le Baiser de Paix !\\n\u00c0 cette Parole de pardon,\\n- l'enfer tremble et Te reconna\u00eet pour Dieu,\\n- la nature et tous les hommes sont stup\u00e9faits.\\nIls reconnaissent ta Divinit\u00e9, ton Amour inextinguible.\"},{\"id\":\"PASSION24.HOUR.20.P011\",\"n\":11,\"t\":\"Silencieux, ils attendent pour voir jusqu'o\u00f9 cela ira.\"},{\"id\":\"PASSION24.HOUR.20.P012\",\"n\":12,\"t\":\"Ce n'est pas seulement ta Voix, mais aussi ton Sang et tes Plaies qui crient \u00e0 chaque c\u0153ur apr\u00e8s le p\u00e9ch\u00e9 : \u00ab Viens dans mes Bras que Je Te pardonne. Le sceau de mon Pardon est mon Sang. \u00bb\"},{\"id\":\"PASSION24.HOUR.20.P013\",\"n\":13,\"t\":\"\u00d4 mon aimable J\u00e9sus,\\n- r\u00e9p\u00e8te cette Parole \u00e0 tous les p\u00e9cheurs.\\n- Implore pour tous la Mis\u00e9ricorde divine.\\n- Applique \u00e0 tous les m\u00e9rites infinis de ton Sang infiniment pr\u00e9cieux.\\n- Pour tous, continue \u00e0de calmer la Justice divine.\"},{\"id\":\"PASSION24.HOUR.20.P014\",\"n\":14,\"t\":\"Donne ta Gr\u00e2ce \u00e0 celui qui, se trouvant dans la situation de devoir pardonner, se sent incapable de le faire. Mon J\u00e9sus crucifi\u00e9, durant ces trois Heures d'Agonie si am\u00e8res, Tu veux tout accomplir. Tu es silencieux sur cette Croix. Mais je vois que dans ton for int\u00e9rieur, Tu veux satisfaire le P\u00e8re en toutes choses.\"},{\"id\":\"PASSION24.HOUR.20.P015\",\"n\":15,\"t\":\"- Tu Le remercies \u00e0 la place de tous.\\n- Tu satisfais \u00e0 la place de tous.\\n- Pour tous, Tu demandes pardon et,\\n- Pour tous, Tu implores la Gr\u00e2ce qu'ils ne T\u2019offensent plus jamais.\"},{\"id\":\"PASSION24.HOUR.20.P016\",\"n\":16,\"t\":\"Et pour obtenir tout cela du P\u00e8re, Tu r\u00e9capitules devant Lui toute ta Vie : du premier instant de ton Incarnation jusqu'\u00e0 ton dernier Souffle.\"},{\"id\":\"PASSION24.HOUR.20.P017\",\"n\":17,\"t\":\"Mon J\u00e9sus, Amour infini, laisse-moi aussi r\u00e9capituler toute ta Vie\\n- avec Toi,\\n- avec ton inconsolable Maman,\\n- avec saint Jean et\\n- avec les saintes femmes. Mon doux J\u00e9sus,\\nje Te remercie\"},{\"id\":\"PASSION24.HOUR.20.P018\",\"n\":18,\"t\":\"- des nombreuses \u00e9pines qui ont transperc\u00e9 ton adorable T\u00eate,\\n- des gouttes de Sang vers\u00e9es \u00e0 cause d'elles,\\n- des coups re\u00e7us sur elles,\\n- des Cheveux qu'on T'a arrach\u00e9s.\"},{\"id\":\"PASSION24.HOUR.20.P019\",\"n\":19,\"t\":\"Je Te remercie\\n- pour tout le Bien que Tu as fait et\\n- tout le Bien que Tu nous as obtenu par tes Pri\u00e8res.\"},{\"id\":\"PASSION24.HOUR.20.P020\",\"n\":20,\"t\":\"Merci pour les Lumi\u00e8res et les bonnes Inspirations que Tu nous as donn\u00e9es.\\nMerci pour toutes les fois que Tu as pardonn\u00e9 nos p\u00e9ch\u00e9s\\nd'orgueil et d'amour-propre.\\nJe Te demande pardon au nom de tous, \u00f4 mon J\u00e9sus,\\n- pour toutes les fois que nous T'avons couronn\u00e9 d'\u00e9pines,\\n- pour toutes les gouttes de Sang\\nque nous T'avons fait verser de ta T\u00eate infiniment sainte,\\n- pour toutes les fois que nous n'avons pas r\u00e9pondu \u00e0 tes Inspirations.\"},{\"id\":\"PASSION24.HOUR.20.P021\",\"n\":21,\"t\":\"En raison de toutes ces Douleurs souffertes par Toi, je Te prie, \u00f4 bon J\u00e9sus, de nous obtenir la Gr\u00e2ce de ne plus jamais commettre de p\u00e9ch\u00e9s dans nos pens\u00e9es.\"},{\"id\":\"PASSION24.HOUR.20.P022\",\"n\":22,\"t\":\"Je veux encore T'offrir tout ce que Tu as souffert dans ta T\u00eate infiniment sainte\\n- pour Te donner toute cette gloire que les cr\u00e9atures T'auraient donn\u00e9e\\n- si elles avaient fait bon usage de leur intelligence.\\n\u00ab Louez le Seigneur tous les peuples, f\u00eatez-le tous les pays !\\nFort est son Amour pour nous, pour toujours sa V\u00e9rit\u00e9. Gloire au P\u00e8re, ... \u00bb\\n(Ps. 118)\\nJ'adore, \u00f4 mon J\u00e9sus, tes Yeux infiniment saints.\"},{\"id\":\"PASSION24.HOUR.20.P023\",\"n\":23,\"t\":\"Je Te remercie\\n- pour toutes les Larmes et tout le Sang qu'ils ont vers\u00e9s,\\n- pour les piq\u00fbres cruelles des \u00e9pines,\\n- pour les insultes,\\n- pour les d\u00e9risions et\\n- pour les hontes support\u00e9es\\ndurant toute ta Passion.\"},{\"id\":\"PASSION24.HOUR.20.P024\",\"n\":24,\"t\":\"Je Te demande pardon pour tous ceux qui se servent de leur vue pour T'offenser et T'outrager. Je Te prie, en raison des Douleurs souffertes par tes Yeux infiniment sacr\u00e9s, de nous donner la Gr\u00e2ce que plus personne ne T'offense par des regards\"},{\"id\":\"PASSION24.HOUR.20.P025\",\"n\":25,\"t\":\"mauvais. Je T'offre tout ce que Tu as souffert par tes Yeux infiniment saints - pour Te donner toute cette Gloire que les cr\u00e9atures T'auraient donn\u00e9e, si leurs regards avaient \u00e9t\u00e9 fix\u00e9s seulement sur le Ciel, sur la Divinit\u00e9 et sur Toi, \u00f4 mon J\u00e9sus. J'adore tes Oreilles infiniment saintes.\"},{\"id\":\"PASSION24.HOUR.20.P026\",\"n\":26,\"t\":\"Je Te remercie de tout ce que Tu as souffert tandis que, sur le Calvaire,\\nles canailles T'accablaient les Oreilles par leurs cris et leurs moqueries.\\nJe Te demande pardon au nom de tous\\npour toutes les conversations mauvaises.\\nJe Te prie\\npour que les oreilles de tous les hommes s'ouvrent\\n- aux V\u00e9rit\u00e9s \u00e9ternelles,\\n- aux appels de la Gr\u00e2ce,\\net pour que plus personne ne T'offense par le sens de l'ou\u00efe.\"},{\"id\":\"PASSION24.HOUR.20.P027\",\"n\":27,\"t\":\"Je veux encore T'offrir tout ce que Tu as souffert dans ton Ou\u00efe infiniment sainte, pour Te donner toute la Gloire que les cr\u00e9atures T'auraient donn\u00e9e, si de cet organe elles avaient fait un saint usage. J'adore ton Visage infiniment saint. Mon J\u00e9sus, je lui donne un baiser.\"},{\"id\":\"PASSION24.HOUR.20.P028\",\"n\":28,\"t\":\"Je Te remercie pour tout ce que Tu as souffert \u00e0 cause des crachats, des gifles et des moqueries, pour toutes les fois que Tu T'es laiss\u00e9 fouler aux pieds par tes ennemis.\"},{\"id\":\"PASSION24.HOUR.20.P029\",\"n\":29,\"t\":\"Je Te demande pardon au nom de tous pour toutes les fois que l'on a os\u00e9 T'offenser.\"},{\"id\":\"PASSION24.HOUR.20.P030\",\"n\":30,\"t\":\"Je Te prie, en raison de ces gifles et de ces crachats, de faire en sorte\\nque tous reconnaissent, louent et glorifient ta Divinit\u00e9.\\n\u00d4 mon J\u00e9sus,\\nje veux aller partout dans le monde :\\nde l'orient \u00e0 l'occident, du midi au septentrion,\\n- pour unir toutes les voix des cr\u00e9atures et\\n- les changer en autant d'actes de louange, d'amour et d'adoration\\nenvers ta divine Personne.\"},{\"id\":\"PASSION24.HOUR.20.P031\",\"n\":31,\"t\":\"Je veux encore, \u00f4 mon J\u00e9sus, T'apporter le c\u0153ur de toutes les cr\u00e9atures, afin que Tu remplisses chacun de ta Lumi\u00e8re, de ta V\u00e9rit\u00e9 et de ton Amour. Que chaque c\u0153ur soit rempli de compassion envers ta divine Personne.\"},{\"id\":\"PASSION24.HOUR.20.P032\",\"n\":32,\"t\":\"Tandis que Tu pardonneras \u00e0 tous, je Te prie de faire en sorte que plus personne ne T'offense, m\u00eame au prix de mon sang.\"},{\"id\":\"PASSION24.HOUR.20.P033\",\"n\":33,\"t\":\"Je veux enfin T'offrir tout ce que Tu as souffert dans ton Visage infiniment\\nsaint,\\n- pour Te donner toute la Gloire que les cr\u00e9atures T'auraient donn\u00e9e\\nsi personne ne T'avait offens\u00e9.\\nJ'adore ta Bouche infiniment sainte.\"},{\"id\":\"PASSION24.HOUR.20.P034\",\"n\":34,\"t\":\"Je Te remercie\\n- pour tes premiers Vagissements,\\n- pour le lait que Tu as suc\u00e9,\\n- pour toutes les Paroles que Tu as dites,\\n- pour les Baisers embras\u00e9s que Tu as donn\u00e9s \u00e0 ta Tr\u00e8s Sainte M\u00e8re,\\n- pour la nourriture que Tu as prise,\\n- pour l'amertume du fiel et la Soif ardente dont Tu as souffert sur la Croix,\\n- pour les Pri\u00e8res que Tu as \u00e9lev\u00e9es vers le P\u00e8re.\"},{\"id\":\"PASSION24.HOUR.20.P035\",\"n\":35,\"t\":\"Je Te demande pardon\\n- pour toutes les m\u00e9disances et les conversations mauvaises des cr\u00e9atures, et\\npour tous les blasph\u00e8mes qu'elles prof\u00e8rent.\"},{\"id\":\"PASSION24.HOUR.20.P036\",\"n\":36,\"t\":\"Je veux offrir\\n- tes saintes Conversations en r\u00e9paration de leurs conversations mauvaises,\\n- la mortification de ton Go\u00fbt en r\u00e9paration de leurs gourmandises et de toutes\\nles offenses qu'elles Te font par le mauvais usage de leur langue.\"},{\"id\":\"PASSION24.HOUR.20.P037\",\"n\":37,\"t\":\"Je veux T'offrir tout ce que Tu as souffert dans ta Bouche infiniment sainte,\\n- pour Te donner toute la Gloire que les cr\u00e9atures T'auraient donn\u00e9e\\nsi aucune n'avait os\u00e9 T'offenser par le sens du go\u00fbt et par l'abus de la langue.\\n\u00d4 J\u00e9sus,\\nje Te remercie pour tout au nom de tous, et\\nje T'adresse un hymne de remerciements \u00e9ternels et infinis.\"},{\"id\":\"PASSION24.HOUR.20.P038\",\"n\":38,\"t\":\"\u00d4 mon J\u00e9sus,\\nje veux T\u2019offrir tout ce que Tu as souffert dans ta Personne infiniment sainte,\\n- pour Te donner toute la Gloire que T'auraient donn\u00e9e toutes les cr\u00e9atures\\nsi elles avaient conform\u00e9 leur vie \u00e0 la Tienne.\\nJe Te remercie, \u00f4 J\u00e9sus,\\n- pour tout ce que Tu as souffert dans tes \u00c9paules infiniment saintes,\\n- pour tous les coups que Tu as re\u00e7us,\\n- pour toutes les Plaies que Tu T'es laiss\u00e9 ouvrir sur ton Corps infiniment sacr\u00e9\"},{\"id\":\"PASSION24.HOUR.20.P039\",\"n\":39,\"t\":\"- pour toutes les gouttes de Sang que Tu as vers\u00e9es.\"},{\"id\":\"PASSION24.HOUR.20.P040\",\"n\":40,\"t\":\"Je Te demande pardon au nom de tous pour toutes les fois que par amour du confort, nous T'avons offens\u00e9 par des plaisirs illicites.\"},{\"id\":\"PASSION24.HOUR.20.P041\",\"n\":41,\"t\":\"Je T'offre ta douloureuse flagellation\\npour r\u00e9parer tous les p\u00e9ch\u00e9s commis avec nos sens,\\n- par amour pour les plaisirs sensibles,\\n- pour les satisfactions naturelles.\"},{\"id\":\"PASSION24.HOUR.20.P042\",\"n\":42,\"t\":\"Je T'offre tout ce que Tu as souffert dans tes \u00c9paules\\npour Te donner toute la Gloire que les cr\u00e9atures t'auraient donn\u00e9e\\nsi, en toutes choses, elles avaient cherch\u00e9\\n- \u00e0 Te plaire \u00e0 Toi seul et\\n- \u00e0 se r\u00e9fugier \u00e0 l'ombre de ta Protection divine.\\nMon J\u00e9sus, je donne un baiser \u00e0 ton Pied gauche.\"},{\"id\":\"PASSION24.HOUR.20.P043\",\"n\":43,\"t\":\"Je Te remercie\\n- pour tous les Pas que Tu as faits durant ta Vie mortelle et\\n- pour toutes les fois que Tu T'es fatigu\u00e9 pour aller \u00e0 la recherche d'\u00e2mes.\"},{\"id\":\"PASSION24.HOUR.20.P044\",\"n\":44,\"t\":\"Je T'offre, \u00f4 mon J\u00e9sus,\\n- toutes mes actions,\\n- tous mes pas et\\n- tous mes mouvements,\\ndans l'intention de Te faire r\u00e9paration pour tout et pour tous.\"},{\"id\":\"PASSION24.HOUR.20.P045\",\"n\":45,\"t\":\"Je Te demande pardon pour ceux qui n'agissent pas dans une intention droite.\\nJ'unis mes actes \u00e0 tous ceux que Tu as accomplis dans ton Humanit\u00e9\\ninfiniment sainte\\n- pour qu'ils soient divinis\u00e9s et\\n- pour Te donner toute la Gloire que T'auraient donn\u00e9e les cr\u00e9atures\\nsi elles avaient agi saintement et avec des buts honn\u00eates.\\nJ\u00e9sus, je donne un baiser \u00e0 ton Pied droit.\"},{\"id\":\"PASSION24.HOUR.20.P046\",\"n\":46,\"t\":\"Je Te remercie pour tout ce que Tu as souffert pour moi, surtout en ces Heures o\u00f9 Tu \u00e9tais suspendu \u00e0 la Croix. Je Te remercie pour la douleur atroce que Te causaient les clous dans tes Plaies qui se d\u00e9chiraient de plus en plus \u00e0 cause du poids de ton Corps.\"},{\"id\":\"PASSION24.HOUR.20.P047\",\"n\":47,\"t\":\"Je Te demande pardon pour toutes les r\u00e9bellions et les d\u00e9sob\u00e9issances des cr\u00e9atures.\"},{\"id\":\"PASSION24.HOUR.20.P048\",\"n\":48,\"t\":\"Je T'offre les douleurs de tes Pieds infiniment saints\\n- en r\u00e9paration de ces offenses,\\n- pour Te donner toute la Gloire que les cr\u00e9atures T'auraient donn\u00e9e\\nsi en toutes choses elles T'avaient \u00e9t\u00e9 soumises.\\n\u00d4 mon J\u00e9sus, je donne un baiser \u00e0 ta Main gauche infiniment sainte.\"},{\"id\":\"PASSION24.HOUR.20.P049\",\"n\":49,\"t\":\"Je Te remercie\\n- pour tout ce que Tu as souffert pour moi,\\n- pour toutes les fois que Tu as calm\u00e9 la Justice divine en satisfaisant pour\\ntous !\\nJe donne un baiser \u00e0 ta Main droite.\"},{\"id\":\"PASSION24.HOUR.20.P050\",\"n\":50,\"t\":\"Je Te remercie pour tout le Bien\\n- que Tu as fait et que Tu continues de faire pour tous,\\nen particulier pour les \u0152uvres\\n- de la Cr\u00e9ation, de la R\u00e9demption et de la Sanctification.\"},{\"id\":\"PASSION24.HOUR.20.P051\",\"n\":51,\"t\":\"Je Te demande pardon au nom de tous,\\n- pour toutes les fois que nous avons manqu\u00e9 de reconnaissance\\npour tes Bienfaits.\\n- pour nos nombreuses \u0153uvres faites sans une intention droite.\"},{\"id\":\"PASSION24.HOUR.20.P052\",\"n\":52,\"t\":\"En r\u00e9paration de ces offenses, je veux T'offrir toute la Perfection et la Saintet\u00e9 de tes \u0152uvres, pour Te donner toute cette Gloire que les cr\u00e9atures T'auraient donn\u00e9e si elles avaient r\u00e9pondu \u00e0 tous tes Bienfaits. \u00d4 mon J\u00e9sus, je donne un baiser \u00e0 ton C\u0153ur infiniment sacr\u00e9.\"},{\"id\":\"PASSION24.HOUR.20.P053\",\"n\":53,\"t\":\"Je Te remercie\\n- pour tout ce que Tu as souffert et d\u00e9sir\u00e9 pour chaque cr\u00e9ature, et\\n- pour le z\u00e8le dont Tu as br\u00fbl\u00e9 par Amour pour elles.\"},{\"id\":\"PASSION24.HOUR.20.P054\",\"n\":54,\"t\":\"Je Te demande pardon\\n- pour nos nombreux d\u00e9sirs mauvais,\\n- pour nos affections et nos tendances mauvaises\"},{\"id\":\"PASSION24.HOUR.20.P055\",\"n\":55,\"t\":\"J\u00e9sus, pardon,\\n- pour les nombreuses \u00e2mes\\n- qui font passer l'amour des cr\u00e9atures avant ton Amour.\"},{\"id\":\"PASSION24.HOUR.20.P056\",\"n\":56,\"t\":\"Pour Te donner toute la Gloire qu'elles T'ont refus\u00e9e, je T'offre tout ce qu'a fait et continue de faire ton C\u0153ur infiniment adorable.\"}],\"reflections\":[{\"id\":\"PASSION24.HOUR.20.REF.P001\",\"t\":\"De midi \u00e0 13h, J\u00e9sus, \u00e9lev\u00e9 sur la Croix, reste suspendu sans toucher la terre.\"},{\"id\":\"PASSION24.HOUR.20.REF.P002\",\"t\":\"Et nous, cherchons-nous \u00e0 vivre d\u00e9tach\u00e9s\\n- du monde, des cr\u00e9atures et de tout ce qui go\u00fbte la terre ?\"},{\"id\":\"PASSION24.HOUR.20.REF.P003\",\"t\":\"Tout doit concourir \u00e0 former la Croix sur laquelle nous devons\\n- nous \u00e9tendre et rester suspendus comme J\u00e9sus,\\nloin de tout ce qui est terre, afin que les cr\u00e9atures ne s'attachent pas \u00e0 nous.\\nJ\u00e9sus souffrant n'a pas\\n- d'autre lit que la Croix, d'autre soulagement que ses Plaies et les insultes.\\nEt, par amour pour J\u00e9sus,\\narrivons-nous \u00e0 trouver le repos dans la souffrance ?\"},{\"id\":\"PASSION24.HOUR.20.REF.P004\",\"t\":\"Tout les choses que nous faisons et vivons, renfermons-les dans les Plaies de J\u00e9sus, trempons-les dans son Sang. Et nous ne trouverons de r\u00e9confort que dans ses Souffrances.\"},{\"id\":\"PASSION24.HOUR.20.REF.P005\",\"t\":\"Si bien que\\n- ses Plaies seront les n\u00f4tres,\\n- son Sang agira continuellement en nous pour nous laver et nous embellir.\"},{\"id\":\"PASSION24.HOUR.20.REF.P006\",\"t\":\"Ainsi nous obtiendrons n'importe quelle Gr\u00e2ce pour nous et pour le salut des \u00e2mes.\"},{\"id\":\"PASSION24.HOUR.20.REF.P007\",\"t\":\"Ayant le Sang de J\u00e9sus dans notre c\u0153ur,\"},{\"id\":\"PASSION24.HOUR.20.REF.P008\",\"t\":\"si nous commettons une faute, nous prierons J\u00e9sus\\n- de ne pas nous garder souill\u00e9s en sa Pr\u00e9sence,\\nde nous laver de son Sang et de nous garder avec Lui.\"},{\"id\":\"PASSION24.HOUR.20.REF.P009\",\"t\":\"Si nous nous sentons faibles, nous prierons J\u00e9sus\\nde donner une portion de son Sang \u00e0 notre \u00e2me,\\n- afin que son Sang nous donne force et courage.\\nLe doux J\u00e9sus prie pour ses bourreaux et m\u00eame, Il les excuse.\"},{\"id\":\"PASSION24.HOUR.20.REF.P010\",\"t\":\"Et nous, faisons-nous n\u00f4tre la Pri\u00e8re de J\u00e9sus\\n- pour excuser continuellement les p\u00e9cheurs devant le P\u00e8re et\"},{\"id\":\"PASSION24.HOUR.20.REF.P011\",\"t\":\"- pour obtenir pour eux, par nos pri\u00e8res, sa Mis\u00e9ricorde,\\nm\u00eame pour ceux qui nous auraient personnellement offens\u00e9s ?\\nTandis que nous prions, agissons et cheminons, n'oublions pas les pauvres\\n\u00e2mes qui sont sur le point de rendre le dernier soupir.\"},{\"id\":\"PASSION24.HOUR.20.REF.P012\",\"t\":\"Portons-leur en guise d'aide et de r\u00e9confort les Pri\u00e8res et les Baisers de J\u00e9sus, pour qu'Il les purifie et leur fasse prendre leur envol vers le Ciel. Mon J\u00e9sus, c'est dans tes Plaies et dans ton Sang que je veux puiser la force de pouvoir reproduire en moi ta propre Vie.\"},{\"id\":\"PASSION24.HOUR.20.REF.P013\",\"t\":\"Et ainsi je pourrai obtenir pour tous, par mes pri\u00e8res, le bien que Tu as fait.\"}],\"subsections\":[]},{\"hour_id\":\"PASSION24.HOUR.21\",\"hour_number\":21,\"display_time\":\"13h \u00e0 14h\",\"title\":\"Deuxi\u00e8me Heure d\u2019Agonie sur la Croix\",\"short_title\":\"Deuxi\u00e8me Heure d\u2019Agonie sur la Croix\",\"source_pages\":[205,206,207,208,209,210,211,212,213,214,215,216],\"opening_prayer_ids\":[\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"],\"closing_prayer_ids\":[\"PASSION24.PRAYER.AFTER_EACH_HOUR\"],\"paragraphs\":[{\"id\":\"PASSION24.HOUR.21.P001\",\"n\":1,\"t\":\"Deuxi\u00e8me Parole : \u00ab Aujourd'hui, tu seras avec Moi au Paradis. \u00bb\"},{\"id\":\"PASSION24.HOUR.21.P002\",\"n\":2,\"t\":\"Mon Amour crucifi\u00e9,\\nTandis que je prie avec Toi,\\nla force\\n- de ton Amour s\u00e9duisant et\\n- de tes Souffrances\\nmaintient mon regard fix\u00e9 sur Toi.\\nMais mon c\u0153ur se brise de Te voir tant souffrir.\"},{\"id\":\"PASSION24.HOUR.21.P003\",\"n\":3,\"t\":\"Tu es tortur\u00e9 par l'Amour et la Douleur. Les flammes qui Te br\u00fblent le C\u0153ur sont si intenses\"},{\"id\":\"PASSION24.HOUR.21.P004\",\"n\":4,\"t\":\"Elles sont en train de Te r\u00e9duire en cendres.\"},{\"id\":\"PASSION24.HOUR.21.P005\",\"n\":5,\"t\":\"Ton Amour est plus fort que la mort m\u00eame\\nDonnant libre cours \u00e0 cet Amour, Tu regardes le larron \u00e0 ta droite et\\nTu le d\u00e9robes \u00e0 l'enfer :\\n- Tu lui touches le c\u0153ur par ta Gr\u00e2ce et il devient tout transform\u00e9.\\n- Il reconna\u00eet que Tu es Dieu et, tout contrit, il Te dit :\\n\u00ab Seigneur, souviens-Toi de moi quand Tu seras dans ton Royaume. \u00bb\"},{\"id\":\"PASSION24.HOUR.21.P006\",\"n\":6,\"t\":\"Toi, Tu lui r\u00e9ponds sans h\u00e9siter :\"},{\"id\":\"PASSION24.HOUR.21.P007\",\"n\":7,\"t\":\"\u00ab Aujourd'hui m\u00eame, tu seras avec Moi dans le Paradis ! \u00bb\"},{\"id\":\"PASSION24.HOUR.21.P008\",\"n\":8,\"t\":\"Tu en fais ainsi le premier triomphe de ton Amour.\\nJe vois que\\n- Tu ne d\u00e9robes pas seulement le c\u0153ur du larron, mais\\n- Tu fais de m\u00eame pour de nombreux mourants.\"},{\"id\":\"PASSION24.HOUR.21.P009\",\"n\":9,\"t\":\"Tu mets \u00e0 leur disposition\\n- ton Sang,\\n- ton Amour,\\n- tes M\u00e9rites\"},{\"id\":\"PASSION24.HOUR.21.P010\",\"n\":10,\"t\":\"Tu Te sers de tous tes Stratag\u00e8mes et Astuces divins\\n- pour toucher leur c\u0153ur et\\n- pour les d\u00e9rober \u00e0 l'enfer.\"},{\"id\":\"PASSION24.HOUR.21.P011\",\"n\":11,\"t\":\"Mais ici aussi, ton Amour est contrari\u00e9 ! Combien de refus tranchants ! Combien de fois on ne Te fait pas confiance ! Combien c\u00e8dent au d\u00e9sespoir ! Mon J\u00e9sus je veux r\u00e9parer pour tous ceux qui d\u00e9sesp\u00e8rent de ta divine Mis\u00e9ricorde au moment de leur mort.\"},{\"id\":\"PASSION24.HOUR.21.P012\",\"n\":12,\"t\":\"Mon doux Amour, inspire\\n- \u00e0 tous, la confiance en Toi,\\n- en particulier \u00e0 ceux qui se trouvent dans les \u00e9treintes de l'agonie.\"},{\"id\":\"PASSION24.HOUR.21.P013\",\"n\":13,\"t\":\"Et par cette Parole que Tu as dite au larron, accorde-leur\\n- la Lumi\u00e8re, la Force et l'Aide\\npour qu'ils puissent mourir saintement et s'envoler vers le Ciel.\"},{\"id\":\"PASSION24.HOUR.21.P014\",\"n\":14,\"t\":\"J\u00e9sus, place toutes les \u00e2mes,\\n- dans ton Corps infiniment saint,\\n- dans ton Sang,\\n- dans tes Plaies,\"},{\"id\":\"PASSION24.HOUR.21.P015\",\"n\":15,\"t\":\"Par les m\u00e9rites de ton Sang pr\u00e9cieux, ne permets pas que m\u00eame une seule \u00e2me soit perdue ! Que ta Voix accompagn\u00e9e de ton Sang r\u00e9p\u00e8te \u00e0 toutes :\"},{\"id\":\"PASSION24.HOUR.21.P016\",\"n\":16,\"t\":\"\u00ab Aujourd'hui, tu seras avec Moi au Paradis ! \u00bb\"},{\"id\":\"PASSION24.HOUR.21.P017\",\"n\":17,\"t\":\"Troisi\u00e8me Parole : J\u00e9sus dit \u00e0 sa Maman : \u00ab Femme, voici ton fils ! \u00bb et \u00e0 Jean : \u00ab Voici ta M\u00e8re ! \u00bb Mon J\u00e9sus martyris\u00e9, tes Souffrances augmentent de plus en plus. Ah ! sur cette Croix, Tu es le vrai Roi des Douleurs. Au milieu de tant de souffrances, aucune \u00e2me ne T'\u00e9chappe : Tu donnes \u00e0 chacune ta propre Vie.\"},{\"id\":\"PASSION24.HOUR.21.P018\",\"n\":18,\"t\":\"Mais ton Amour se voit contrari\u00e9 et m\u00e9pris\u00e9 par les cr\u00e9atures. On ne s'en soucie pas. Comme Il ne peut s'\u00e9pancher, Il devient plus intense. Il Te procure des tortures indicibles. Dans ces tortures, il recherche ce qu'il pourrait donner d'autre \u00e0 l'homme pour le vaincre.\"},{\"id\":\"PASSION24.HOUR.21.P019\",\"n\":19,\"t\":\"Il Te fait dire :\\n\u00ab Tu vois, \u00f4 \u00e2me, combien Je t'ai aim\u00e9e. Si tu ne veux pas avoir piti\u00e9 de\\nToi-m\u00eame, aie au moins piti\u00e9 de mon Amour ! \u00bb\\nLeur ayant tout donn\u00e9, Tu n'as plus rien \u00e0 donner aux cr\u00e9atures.\\nTu tournes ton Regard suppliant vers ta Maman.\\nElle comme Toi, se sent crucifi\u00e9e \u00e0 cause\\n- de tes Souffrances et\\n- de l'Amour qui la torture.\"},{\"id\":\"PASSION24.HOUR.21.P020\",\"n\":20,\"t\":\"M\u00e8re et Fils, Vous vous entendez. Alors Tu respires de satisfaction et de r\u00e9confort en sachant que Tu peux donner ta Maman aux cr\u00e9atures.\"},{\"id\":\"PASSION24.HOUR.21.P021\",\"n\":21,\"t\":\"En associant Jean \u00e0 tout le genre humain, Tu dis \u00e0 Marie d'une Voix remplie de tendresse : \u00ab Femme, voici ton Fils ! \u00bb et Tu dis \u00e0 Jean : \u00ab Voici ta M\u00e8re ! \u00bb\"},{\"id\":\"PASSION24.HOUR.21.P022\",\"n\":22,\"t\":\"Et, dans un doux C\u0153ur \u00e0 C\u0153ur, Tu poursuis :\"},{\"id\":\"PASSION24.HOUR.21.P023\",\"n\":23,\"t\":\"\u00ab Ma M\u00e8re, Je Te confie tous mes enfants.\\nTout l'Amour que tu ressens pour Moi, ressens-le pour eux !\\nQue tous tes \u00e9gards et toutes tes tendresses maternelles\\nsoient pour mes enfants. Toi, tu Me les sauveras tous ! \u00bb\\nEt ta sainte Maman accepte.\\nJe veux ici, \u00f4 mon J\u00e9sus, r\u00e9parer\\n- les offenses qui sont faites \u00e0 ta Tr\u00e8s Sainte M\u00e8re,\\n- les blasph\u00e8mes et les ingratitudes\\nde tant de gens qui ne veulent pas reconna\u00eetre le grand Bienfait\\nque Tu as accord\u00e9 \u00e0 tous, en nous donnant Marie comme M\u00e8re.\\nComment pouvons-nous Te remercier d'un si grand Bienfait ?\\nNous le ferons, \u00f4 J\u00e9sus, en T'offrant\\n- ton Sang,\\n- tes Plaies,\\n- l'Amour infini de ton C\u0153ur !\"},{\"id\":\"PASSION24.HOUR.21.P024\",\"n\":24,\"t\":\"\u00d4 Tr\u00e8s Sainte Vierge, quel n'est pas ton choc en entendant la Voix du bon J\u00e9sus qui Te donne \u00e0 chacun de nous comme M\u00e8re ! Nous voulons te remercier, \u00f4 Vierge b\u00e9nie. Pour te remercier comme tu le m\u00e9rites, nous t'offrons les Remerciements m\u00eames de ton J\u00e9sus.\"},{\"id\":\"PASSION24.HOUR.21.P025\",\"n\":25,\"t\":\"\u00d4 douce Maman,\\n- sois notre M\u00e8re,\\n- prends soin de nous et\\n- ne permets jamais que nous t'offensions le moindrement.\"},{\"id\":\"PASSION24.HOUR.21.P026\",\"n\":26,\"t\":\"Tiens-nous toujours serr\u00e9s sur J\u00e9sus. De tes Mains, lie-nous \u00e0 Lui, de sorte que nous ne puissions plus jamais nous s\u00e9parer de Lui.\"},{\"id\":\"PASSION24.HOUR.21.P027\",\"n\":27,\"t\":\"Pour tous, je veux r\u00e9parer les offenses\\nqui sont faites \u00e0 ton J\u00e9sus et \u00e0 toi, ma douce Maman !\\n\u00d4 mon J\u00e9sus,\\n- Tu es plong\u00e9 dans tant de Souffrances,\\n- et Tu plaides encore plus la cause du Salut des \u00e2mes.\"},{\"id\":\"PASSION24.HOUR.21.P028\",\"n\":28,\"t\":\"Moi, je ne serai pas indiff\u00e9rente \u00e0 cela. Comme une colombe,\"},{\"id\":\"PASSION24.HOUR.21.P029\",\"n\":29,\"t\":\"- je volerai sur tes Plaie
