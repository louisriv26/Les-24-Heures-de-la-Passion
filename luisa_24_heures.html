\": [\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"], \"closing_prayer_ids\": [\"PASSION24.PRAYER.AFTER_EACH_HOUR\"], \"paragraphs\": [{\"id\": \"PASSION24.HOUR.08.P001\", \"n\": 1, \"t\": \"Mon Jésus, nous voilà rendus à minuit. Je sens que tes ennemis s'approchent.\"}, {\"id\": \"PASSION24.HOUR.08.P002\", \"n\": 2, \"t\": \"Et Toi, Tu T'arranges et essuies le Sang qui couvre ton Visage Fortifié par les réconforts reçus, Tu vas de nouveau voir tes disciples. Tu les appelles, les avertis, et les rassembles auprès de Toi. Et Tu vas à la rencontre de tes ennemis.\"}, {\"id\": \"PASSION24.HOUR.08.P003\", \"n\": 3, \"t\": \"Par ta promptitude, Tu répares ma lenteur et ma nonchalance à agir et à souffrir pour Toi.\"}, {\"id\": \"PASSION24.HOUR.08.P004\", \"n\": 4, \"t\": \"Mais, mon doux Bien, quelle scène émouvante je vois : Le premier qui se présente est le perfide Judas. Il s'approche de Toi. Il met ses bras autour de ton Cou, il Te salue et Te donne le baiser. Et Toi, Amour infini, Tu ne dédaignes pas de donner un baiser à ses lèvres infernales : Tu l'embrasses et même Tu le serres sur ton Cœur Tu lui donnes un nouveau signe d'Amour pour l’arracher à l'enfer. Mon Jésus, comment est-ce possible qu'il ne T'aime pas ? La tendresse de ton Amour est telle qu'elle devrait amener tout cœur à T'aimer. Et pourtant Tu n'es pas aimé !\"}, {\"id\": \"PASSION24.HOUR.08.P005\", \"n\": 5, \"t\": \"Par ce baiser de Judas, Tu répares les trahisons et les tromperies ayant l'apparence de l'amitié et de la sainteté, surtout celles provenant des âmes consacrées.\"}, {\"id\": \"PASSION24.HOUR.08.P006\", \"n\": 6, \"t\": \"Par tes Prières,\\nTu obtiens le Pardon pour n'importe quel pécheur qui, vraiment contrit,\\na recours à ton Cœur infiniment saint.\\nMon doux Bien, je serai à tes côtés\\n- pour Te défendre, pour apprendre tes Enseignements et\\n- pour compter une à une tes Paroles.\\nAh ! comme elle m'est douce au cœur, la Parole que Tu adressas à Judas :\\n« Mon ami, pourquoi es-tu venu ici ? »\\nOn dirait que c'est à moi aussi que Tu adresses cette Parole,\\n- non en m'appelant ‘ami’, mais en m'appelant du doux nom d'‘enfant’\\n« Mon enfant, pourquoi es-tu venue ici ? »\\nEt je veux Te répondre : « Jésus, je viens pour T'aimer. »\"}, {\"id\": \"PASSION24.HOUR.08.P007\", \"n\": 7, \"t\": \"Tu me dis : « Pourquoi es-tu venue ici ? » quand je me réveille le matin ou quand je Te prie. Tu me répètes : « Pourquoi es-tu venue ici ? » à travers la sainte Hostie, quand je viens Te recevoir dans mon cœur. Quel beau rappel pour moi !\"}, {\"id\": \"PASSION24.HOUR.08.P008\", \"n\": 8, \"t\": \"Mais combien, à ton « Pourquoi es-tu venu ici ? » répondent : « Je viens pour Toffenser ! »\"}, {\"id\": \"PASSION24.HOUR.08.P009\", \"n\": 9, \"t\": \"D'autres, feignant de ne pas T'entendre,\\n- s'adonnent à toutes sortes de péchés et\\n- ils répondent par leur descente en enfer !\"}, {\"id\": \"PASSION24.HOUR.08.P010\", \"n\": 10, \"t\": \"Combien je compatis avec Toi, ô mon Jésus !\\nJe voudrais prendre les mêmes cordes\\n- avec lesquelles tes ennemis sont sur le point de Te lier\\n- pour lier ces âmes et T'épargner cette Souffrance.\\nMais j'entends ta Voix infiniment tendre qui,\\npendant que Tu vas à la rencontre de tes ennemis,\\nleur dit : « Qui cherchez-vous ? »\"}, {\"id\": \"PASSION24.HOUR.08.P011\", \"n\": 11, \"t\": \"Et eux Te répondent : « Jésus de Nazareth. »\"}, {\"id\": \"PASSION24.HOUR.08.P012\", \"n\": 12, \"t\": \"Alors Tu leur dis : « Me voici ! » Par ces simples paroles, Tu dis tout. Tu Te fais connaître pour ce que Tu es. Tant et si bien que tes ennemis tremblent et tombent à la renverse, comme morts.\"}, {\"id\": \"PASSION24.HOUR.08.P013\", \"n\": 13, \"t\": \"Et toi, ô Amour, c'est par un autre « Me voici ! »\\n- que Tu les rappelles à la Vie et\\n- que, de ta propre initiative, Tu Te places entre leurs mains.\\nEt eux, perfides et ingrats,\\n- au lieu de s'humilier et de trembler à tes pieds pour Te demander pardon,\\nils abusent de ta Bonté et, ils méprisent tes Grâces et tes Prodiges,\\nils Te mettent les Mains dans le dos et, avec des cordes et des chaînes,\\n- Te lient, Te serrent,\\n- Te jettent par terre, Te foulent aux pieds,\\n- Te tirent par les Cheveux.\\nEt Toi, avec une patience inouïe, Tu Te tais, Tu souffres et\\nTu répares les offenses qui, malgré tes Miracles, sont faites obstinément.\\nPar les cordes et les chaînes que Tu supportes,\\nTu brises les chaînes de nos fautes et\\nTu nous attaches par la douce chaîne de l'Amour.\"}, {\"id\": \"PASSION24.HOUR.08.P014\", \"n\": 14, \"t\": \"Avec Amour Tu corriges Pierre qui veut Te défendre en coupant l'oreille de Malchus. Ainsi, Tu répares les bonnes œuvres qui ne sont pas faites selon la sainte prudence. Tu répares aussi pour ceux qui, par excès de zèle, tombent dans la faute.\"}, {\"id\": \"PASSION24.HOUR.08.P015\", \"n\": 15, \"t\": \"Mon Jésus\\nTu es infiniment patient. Ces cordes et ces chaînes ajoutent quelque chose de\\nplus beau à ta Personne divine :\\n- ton Front devient plus serein,\\ntellement qu'il attire l'attention de tes ennemis.\\n- tes Yeux brillent d'une plus grande Lumière.\\n- ton Visage dégage une Paix et une Douceur suprêmes,\\ncapables de séduire tes bourreaux.\\nÔ Amour enchaîné, est-il possible\\nque Tu sois lié pour moi et que moi, ta créature, je reste sans chaînes ?\\nNon, je T'en prie, lie-moi avec tes propres chaînes.\\nPar conséquent, je T'en prie,\\ntandis que je baise tes Mains adorables, lie\\n- mes pensées, mes yeux, mes oreilles, ma langue,\\n- mon cœur, mes affections et tout moi-même.\"}, {\"id\": \"PASSION24.HOUR.08.P016\", \"n\": 16, \"t\": \"En même temps, lie toutes les créatures, afin\\n- qu'elles ressentent les douceurs de tes Chaînes amoureuses et\\n- qu'elles ne T'offensent plus.\\nMon Jésus infiniment tendre,\\n- Tu T'es remis entre les mains de tes ennemis,\\n- Tu leur accordes le pouvoir de faire de Toi ce qu'ils veulent.\"}, {\"id\": \"PASSION24.HOUR.08.P017\", \"n\": 17, \"t\": \"Mon Jésus,\\n- moi, je me remets entre tes Mains,\\n- afin que Tu puisses librement faire de moi ce qu'il Te plaira.\\nJe veux\\n- suivre ta Volonté,\\n- T'accompagner dans tes Réparations,\\n- souffrir tes Peines.\\nJe veux être toujours près de Toi pour qu'il n'y ait pas\\n- d'offense que je ne répare,\\n- d'amertume que je n'adoucisse,\\n- de crachats et de gifles que Tu reçois,\\nqui ne soient pas suivis de mes baisers et de mes caresses.\\nEt lors de tes chutes, mes mains seront toujours prêtes à Te relever.\\nJe veux être toujours avec Toi.\\nJe ne veux pas Te laisser seul, même pas pour un instant.\\nEt pour en être certaine mets-moi à l'intérieur de Toi.\"}, {\"id\": \"PASSION24.HOUR.08.P018\", \"n\": 18, \"t\": \"Ainsi je serai dans ton Intelligence, dans tes Regards, dans ton Cœur, dans tout Toi-même. Et ce que Tu feras, je le ferai aussi.\"}, {\"id\": \"PASSION24.HOUR.08.P019\", \"n\": 19, \"t\": \"Mon doux Bien, il est déjà une heure du matin !\"}, {\"id\": \"PASSION24.HOUR.08.P020\", \"n\": 20, \"t\": \"Mon intelligence commence à s'assoupir.\\nJe ferai ce que je pourrai pour rester éveillée.\\nSi le sommeil me surprend, je me déposerai en Toi pour Te suivre\\nen tout ce que Tu feras. Et même, Tu agiras Toi-même pour moi.\\nMon Jésus, à partir de maintenant, je Te laisse\\nmes pensées pour Te défendre de tes ennemis,\\nmes respirations en guise de cortège et de compagnie,\\nmes battements de cœur\\n- pour Te dire sans cesse « je T'aime ! » et\\n- pour Te dédommager de l'amour que les autres ne Te donnent pas ;\\nles gouttes de mon sang\\n- pour réparer et\\n- pour Te restituer les honneurs et l'estime que T'enlèveront tes ennemis\\npar leurs insultes, leurs crachats et leurs gifles.\\net tout mon être en guise de garde.\\nMon Jésus,\\nde grâce, embrasse-moi et bénis-moi.\\nEt si Tu veux que je sommeille, fais-moi dormir dans ton adorable Cœur,\\nafin que par tes Battements accélérés par l'Amour et la Souffrance,\\nje puisse être réveillée rapidement pour poursuivre mon accompagnement !\"}], \"reflections\": [{\"id\": \"PASSION24.HOUR.08.REF.P001\", \"t\": \"C'est promptement que Jésus se remit entre les mains de ses ennemis, en conformité avec la Volonté du Père. Lors des tromperies des créatures, de leurs trahisons, sommes-nous prêts à pardonner comme Jésus a pardonné ?\"}, {\"id\": \"PASSION24.HOUR.08.REF.P002\", \"t\": \"Tout le mal que nous recevons des créatures, l'acceptons-nous comme provenant des Mains de Dieu ? Sommes-nous prêts à faire tout ce que Jésus attend de nous ?\"}, {\"id\": \"PASSION24.HOUR.08.REF.P003\", \"t\": \"Quand nous subissons des croix, des excès de fatigue, est-ce que notre patience imite celle de Jésus ?\"}, {\"id\": \"PASSION24.HOUR.08.REF.P004\", \"t\": \"Mon Jésus enchaîné, que tes chaînes lient mon cœur et le rendent ferme et prompt à souffrir tout ce que Tu veux !\"}], \"subsections\": []}, {\"hour_id\": \"PASSION24.HOUR.09\", \"hour_number\": 9, \"display_time\": \"1h à 2h\", \"title\": \"Jésus est précipité dans le torrent du Cédron\", \"short_title\": \"Jésus est précipité dans le torrent du Cédron\", \"source_pages\": [105, 106, 107, 108], \"opening_prayer_ids\": [\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"], \"closing_prayer_ids\": [\"PASSION24.PRAYER.AFTER_EACH_HOUR\"], \"paragraphs\": [{\"id\": \"PASSION24.HOUR.09.P001\", \"n\": 1, \"t\": \"Mon bien-aimé Jésus, mon pauvre esprit oscille entre l’état de veille et celui de sommeil. Comment pourrais-je m'abandonner au sommeil, quand je vois que tous Te quittent et Te fuient ?\"}, {\"id\": \"PASSION24.HOUR.09.P002\", \"n\": 2, \"t\": \"Les apôtres eux-mêmes,\\n- le fervent Pierre, qui vient de dire qu'il voulait donner sa vie pour Toi,\\n- le disciple bien-aimé qu'avec tant d'amour Tu as fait reposer sur ton cœur,\\nah, tous T'abandonnent et Te laissent à la merci de tes cruels ennemis !\\nMon Jésus, Tu es seul !\\nTes Yeux infiniment purs regardent autour d’eux\"}, {\"id\": \"PASSION24.HOUR.09.P003\", \"n\": 3, \"t\": \"pour voir s'il n'y aurait pas au moins un des Tiens qui Te suive pour Te témoigner de l'amour et Te défendre.\"}, {\"id\": \"PASSION24.HOUR.09.P004\", \"n\": 4, \"t\": \"Et comme personne ne T'est resté fidèle, ton Cœur se serre et pleure.\\nTu ressens plus de Souffrance\\n- à cause de l'abandon de tes amis les plus fidèles\\n- qu'à cause de ce que tes ennemis sont en train de Te faire subir.\\nMon Jésus, ne pleure pas, plutôt laisse-moi pleurer avec Toi.\"}, {\"id\": \"PASSION24.HOUR.09.P005\", \"n\": 5, \"t\": \"Et l'adorable Jésus semble me dire :\\n« Ah ! mon enfant,\\npleurons ensemble le destin de tant d'âmes consacrées qui,\\n- en raison de petites épreuves ou d'incidents de la vie,\\nne s'occupent plus de Moi et Me laissent seul.\"}, {\"id\": \"PASSION24.HOUR.09.P006\", \"n\": 6, \"t\": \"Pleurons pour tant d'autres âmes, timides et viles qui, par manque de courage et de confiance, M'abandonnent.\"}, {\"id\": \"PASSION24.HOUR.09.P007\", \"n\": 7, \"t\": \"Pleurons aussi pour tant d'autres qui,\\n- ne trouvent pas leur compte dans les choses saintes,\\n- ne s'occupent pas de Moi.\"}, {\"id\": \"PASSION24.HOUR.09.P008\", \"n\": 8, \"t\": \"Pleurons pour tant de prêtres qui prêchent, célèbrent, confessent pour leur gloire personnelle. Ils montrent qu’ils sont autour de Moi, mais Me laissent seul !\"}, {\"id\": \"PASSION24.HOUR.09.P009\", \"n\": 9, \"t\": \"Ah ! mon enfant, comme il est dur pour Moi cet abandon ! Je t'en prie, répare ma cruelle Souffrance par la promesse de ne jamais Me laisser seul. » Oui, mon Jésus, avec l'aide de ta Grâce et en m'identifiant à ta Divine Volonté je Te promets de ne jamais Te laisser seul.\"}, {\"id\": \"PASSION24.HOUR.09.P010\", \"n\": 10, \"t\": \"Mais Jésus, tandis que Tu pleures l'abandon de ceux qui Te sont chers, tes ennemis ne T'épargnent aucun outrage.\"}, {\"id\": \"PASSION24.HOUR.09.P011\", \"n\": 11, \"t\": \"Alors que Tu es lié et serré, au point de ne pouvoir faire un pas par Toi-même,\\n- ils Te foulent aux pieds et\\n- ils Te traînent par des voies pleines de pierres et d'épines,\\nsi bien que chacun de tes Mouvements T'amène\\n- à Te heurter à des pierres ou\\n- à être piqué par des épines.\"}, {\"id\": \"PASSION24.HOUR.09.P012\", \"n\": 12, \"t\": \"Mon Jésus, je vois que pendant qu'ils Te traînent, Tu laisses derrière Toi\\n- des traces de ton Sang précieux ou\\n- quelques-uns de tes Cheveux blonds qu'ils T'arrachent de la Tête !\"}, {\"id\": \"PASSION24.HOUR.09.P013\", \"n\": 13, \"t\": \"Ma Vie et mon Tout, permets-moi de recueillir ces Cheveux,\\nafin que je puisse en lier les pas des créatures\\n- qui, même la nuit, ne T'épargnent pas, que dis-je,\\nqui se servent de la nuit pour T'offenser davantage,\\n- soit pour des rendez-vous, soit pour des plaisirs,\\n- soit pour accomplir des vols sacrilèges !\\nMon Jésus, je m'unis à Toi pour réparer ces offenses.\\nNous voici rendus au torrent du Cédron.\\nLes perfides Juifs se préparent à Te précipiter dans ce torrent.\\nIls Te font Te heurter avec tant de violence contre une pierre\\nqu'il sort de ta Bouche du Sang précieux dont reste marquée cette pierre !\"}, {\"id\": \"PASSION24.HOUR.09.P014\", \"n\": 14, \"t\": \"Puis, Te poussant,\\nils Te plongent au fond de ces eaux putrides, de sorte qu'elles entrent\\n- dans tes Oreilles, dans ta Bouche et dans tes Narines.\"}, {\"id\": \"PASSION24.HOUR.09.P015\", \"n\": 15, \"t\": \"Ô mon Amour, Tu es inondé de ces eaux\\n- putrides, nauséabondes et froides.\\nTel est l'état lamentable des créatures quand elles commettent le péché :\\nElles se couvrent d'un manteau de saletés répugnantes,\\n- à en dégoûter le Ciel et la terre,\\nattirant ainsi les foudres de la Justice divine !\\nOh ! Vie de ma vie, pourrais-Tu nous manifester un Amour plus grand ?\\nTu permets que tes ennemis Te jettent dans ce torrent\\n- pour nous départir de ce manteau de saletés répugnantes,\"}, {\"id\": \"PASSION24.HOUR.09.P016\", \"n\": 16, \"t\": \"et tout cela Tu le souffres\\npour réparer les sacrilèges et les froideurs des âmes\\n- qui Te reçoivent de manière sacrilège et\\n- qui T'obligent à entrer dans leur cœur\\noù Tu éprouves la nausée plus que dans ce torrent !\"}, {\"id\": \"PASSION24.HOUR.09.P017\", \"n\": 17, \"t\": \"Tu permets encore que ces eaux pénètrent jusqu'à tes viscères,\\nà tel point que tes ennemis, craignant que Tu Te noies, T'en ressortent,\\n- afin de Te réserver pour de plus grands tourments.\\nTon état est tellement répugnant,\\nqu'eux-mêmes ont la nausée rien qu'à Te toucher.\\nMon tendre Jésus, Te voilà hors du torrent. Mon cœur ne supporte pas de Te\\nvoir ainsi recouvert de ces eaux nauséabondes.\"}, {\"id\": \"PASSION24.HOUR.09.P018\", \"n\": 18, \"t\": \"Je vois que Tu trembles de la tête aux pieds à cause du froid. Tu regardes autour de Toi, cherchant au moins une personne qui voudrait Te sécher, Te laver et Te réchauffer. Mais en vain.\"}, {\"id\": \"PASSION24.HOUR.09.P019\", \"n\": 19, \"t\": \"Personne ne s’attendrit sur ta situation. Tes ennemis se moquent de Toi et Te raillent. Les Tiens T’ont abandonné. Ta douce Maman est loin, car c’est ainsi que le veut le Père ! Jésus, me voici. Viens dans mes bras. Je veux tant pleurer que je Te ferai un bain pour Te nettoyer. Je veux de mes mains replacer tes Cheveux en broussaille.\"}, {\"id\": \"PASSION24.HOUR.09.P020\", \"n\": 20, \"t\": \"Mon Amour,\\nje veux T’enfermer dans mon cœur pour\\n- Te réchauffer de la chaleur de mes affections,\\n- Te parfumer de mes désirs saints,\\n- réparer toutes ces offenses que Tu reçois, et\\n- joindre ma vie à la Tienne pour sauver toutes les âmes.\"}, {\"id\": \"PASSION24.HOUR.09.P021\", \"n\": 21, \"t\": \"Je veux T’offrir mon cœur comme un lieu de repos\\n- pour Te dédommager des Peines souffertes jusqu’ici.\\nPuis nous reprendrons ensemble le chemin de ta Passion.\"}], \"reflections\": [{\"id\": \"PASSION24.HOUR.09.REF.P001\", \"t\": \"Durant cette Heure, Jésus se livra à ses ennemis. Ils L’ont jeté dans le torrent du Cédron. Jésus les regardait avec Amour, supportant tout par Amour pour eux.\"}, {\"id\": \"PASSION24.HOUR.09.REF.P002\", \"t\": \"Et nous, savons-nous nous livrer à la Volonté de Dieu ?\\nDans nos faiblesses et nos chutes,\\nsommes-nous prêts à nous relever pour nous jeter dans les Bras de Jésus ?\\nJésus fut jeté dans le torrent du Cédron, éprouvant\\nde la suffocation, de la nausée et du dégoût.\\nEt nous, abhorrons-nous toute ombre de péché ?\\nSommes-nous prêts à donner à Jésus un asile dans notre cœur,\\n- pour Lui faire oublier la nausée que les âmes Lui donnent par le péché et\\n- pour Le dédommager de celle que nous Lui avons donnée nous-mêmes ?\\nMon Jésus torturé, ne m’épargne en rien, et fais en sorte que je puisse être\\nl’objet de tes Visées divines et amoureuses !\"}], \"subsections\": []}, {\"hour_id\": \"PASSION24.HOUR.10\", \"hour_number\": 10, \"display_time\": \"2h à 3h\", \"title\": \"Jésus est présenté à Anne\", \"short_title\": \"Jésus est présenté à Anne\", \"source_pages\": [109, 110, 111], \"opening_prayer_ids\": [\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"], \"closing_prayer_ids\": [\"PASSION24.PRAYER.AFTER_EACH_HOUR\"], \"paragraphs\": [{\"id\": \"PASSION24.HOUR.10.P001\", \"n\": 1, \"t\": \"Jésus, Sentinelle divine, je dors et Toi, Tu ne veux pas rester seul. Ainsi Tu me réveilles et Tu me laisses être présent avec Toi chez Anne.\"}, {\"id\": \"PASSION24.HOUR.10.P002\", \"n\": 2, \"t\": \"Il T'interroge sur ta Doctrine et tes disciples. Et toi, ô Jésus, pour défendre la Gloire du Père, Tu réponds d'une Voix sonore et digne : « J'ai parlé en public, et tous ceux qui sont ici M'ont entendu ! » À ces Paroles, tous tremblent. Perfidement, un serviteur s'approche de Toi. D’une main ferrée, il Te donne une gifle si forte qu'elle Te fait chanceler et rend livide ton doux Visage !\"}, {\"id\": \"PASSION24.HOUR.10.P003\", \"n\": 3, \"t\": \"Ma douce Vie, maintenant je comprends pourquoi Tu m'as réveillée.\"}, {\"id\": \"PASSION24.HOUR.10.P004\", \"n\": 4, \"t\": \"Tu avais raison ! En fait, qui T'aurait soutenu quand Tu étais sur le point de tomber ?\"}, {\"id\": \"PASSION24.HOUR.10.P005\", \"n\": 5, \"t\": \"Tandis que tes ennemis éclatent d'un rire satanique, sifflent et battent des mains, applaudissant à cet acte si injuste, Toi, chancelant, Tu n'as personne sur qui T'appuyer.\"}, {\"id\": \"PASSION24.HOUR.10.P006\", \"n\": 6, \"t\": \"Mon Jésus, je T'embrasse.\\nEt je fais de mon être un mur de protection pour Toi.\\nJe m'offre à Toi pour supporter toute peine par amour pour Toi !\\nJe compatis avec Toi pour cet outrage.\\nEt avec Toi je répare les timidités\\n- de tant d'âmes qui se découragent facilement,\\n- de celles qui, ayant peur, ne disent pas la vérité,\\n- de celles qui manquent de respect pour les prêtres,\\n- de celles qui s'expriment par des murmures.\\nMon Jésus affligé, Anne T'envoie à Caïphe. Je vois que, pendant le\\ndéplacement, tes ennemis Te font tomber dans un escalier.\"}, {\"id\": \"PASSION24.HOUR.10.P007\", \"n\": 7, \"t\": \"Toi, mon Amour, par cette chute, Tu répares pour ceux qui, profitant des ténèbres de la nuit, tombent dans la faute. Jésus, je veux unir mes réparations aux Tiennes. Pendant que Tu Te rendras chez Caïphe, je T'enverrai mon affection pour Te défendre de tes ennemis. Entretemps je dormirai.\"}, {\"id\": \"PASSION24.HOUR.10.P008\", \"n\": 8, \"t\": \"Et Toi, continue à être ma sentinelle d'Amour. Réveille-moi quand ton Amour Te poussera à m'appeler à Te tenir compagnie. Donne-moi ton doux Baiser. Moi, je donne un baiser à ton Cœur bien-aimé et je ferme les yeux. Je prends le sommeil qu'exige ma nature.\"}], \"reflections\": [{\"id\": \"PASSION24.HOUR.10.REF.P001\", \"t\": \"Jésus est interrogé par Anne sur sa Doctrine et ses disciples. Pour glorifier le Père, Il répond quant à sa Doctrine. Mais Il ne parle pas de ses disciples pour ne pas manquer à la charité.\"}, {\"id\": \"PASSION24.HOUR.10.REF.P002\", \"t\": \"Et nous, quand il s'agit de glorifier le Seigneur, sommes-nous intrépides et courageux, ou bien nous laissons-nous vaincre par le respect humain ?\"}, {\"id\": \"PASSION24.HOUR.10.REF.P003\", \"t\": \"Nous devons toujours dire la vérité, même devant des personnes importantes !\"}, {\"id\": \"PASSION24.HOUR.10.REF.P004\", \"t\": \"Quand nous parlons, cherchons-nous toujours la Gloire de Dieu ?\\nEt pour exalter cette Gloire de Dieu,\\n- supportons-nous tout avec patience comme Jésus ?\\nSavons-nous toujours éviter de parler en mal du prochain ?\\nSavons-nous l'excuser si nous entendons d'autres gens qui en disent du mal ?\\nJésus veille sur notre Cœur.\\nEt nous, savons-nous nous surveiller en toutes choses,\\nafin que\\n- nos regards, nos paroles, nos affections,\\n- nos émotions, nos pensées et nos désirs,\\nsoient autant de sentinelles autour de Jésus\\n- pour veiller sur son Cœur et tout réparer ?\"}, {\"id\": \"PASSION24.HOUR.10.REF.P005\", \"t\": \"Et quand Jésus nous appelle, sommes-nous prêts à répondre ?\"}, {\"id\": \"PASSION24.HOUR.10.REF.P006\", \"t\": \"Les Appels de Dieu peuvent se faire entendre de nombreuses manières :\\n- par les inspirations, la lecture de bons livres, par les exemples reçus,\\n- par les attraits de la Grâce, et même par les intempéries.\\nMon Jésus,\\n- que ta douce Voix résonne toujours dans mon cœur et\\n- que tout ce qui m'entoure soit une voix continuelle m'appelant à T'aimer !\"}, {\"id\": \"PASSION24.HOUR.10.REF.P007\", \"t\": \"Que l'harmonie de ta Voix divine m'empêche de prêter attention à toute autre voix qui pourrait me distraire de Toi !\"}], \"subsections\": []}, {\"hour_id\": \"PASSION24.HOUR.11\", \"hour_number\": 11, \"display_time\": \"3h à 4h\", \"title\": \"Chez Caïphe, Jésus est accusé par de faux témoins\", \"short_title\": \"Chez Caïphe, Jésus est accusé par de faux témoins\", \"source_pages\": [112, 113, 114, 115, 116, 117], \"opening_prayer_ids\": [\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"], \"closing_prayer_ids\": [\"PASSION24.PRAYER.AFTER_EACH_HOUR\"], \"paragraphs\": [{\"id\": \"PASSION24.HOUR.11.P001\", \"n\": 1, \"t\": \"Ô mon Bien affligé et abandonné, ma faible nature dort. Cependant mon sommeil est très souvent interrompu par les serrements d'Amour et par les Souffrance de ton divin Cœur.\"}, {\"id\": \"PASSION24.HOUR.11.P002\", \"n\": 2, \"t\": \"Pendant que je suis entre l'état de veille et celui de sommeil et j'entends les coups que Te portent tes ennemis.\"}, {\"id\": \"PASSION24.HOUR.11.P003\", \"n\": 3, \"t\": \"Mon pauvre Jésus, abandonné de tous, il n'y a personne qui prenne ta défense ? Je T'offre ma vie pour Te servir d'appui quand ils Te feront heurter quelque chose.\"}, {\"id\": \"PASSION24.HOUR.11.P004\", \"n\": 4, \"t\": \"Entre temps, je m'assoupis de nouveau.\\nMais un autre serrement d'Amour de ton Cœur divin me reveille.\\nJe sens mes oreilles devenir sourdes à cause\\n- des gens qui arrivent, des chuchotements, des cris et des insultes.\\nMon Amour,\\npourquoi sont-ils tous contre Toi ? Qu'as-Tu fait pour que, comme autant de\\nloups affamés, ils veuillent Te mettre en pièces ?\"}, {\"id\": \"PASSION24.HOUR.11.P005\", \"n\": 5, \"t\": \"Je sens mon sang se geler dans mes veines à voir les préparatifs de tes ennemis. Je tremble et me sens triste. Je pense à la manière que j'utiliserai pour Te défendre. Et Jésus semble me dire : « Mon enfant, Je n'ai pas encore tout fait ! L'Amour comporte tous les sacrifices. l'Amour est d'un coût incommensurable. Nous n’en sommes encore qu’au début.\"}, {\"id\": \"PASSION24.HOUR.11.P006\", \"n\": 6, \"t\": \"Toi, reste dans mon Cœur : observe tout, aime-Moi, tais-toi et apprends.\"}, {\"id\": \"PASSION24.HOUR.11.P007\", \"n\": 7, \"t\": \"Et que ton sang, gelé de compassion, circule dans mes Veines pour restaurer mon Sang qui est en Feu.\"}, {\"id\": \"PASSION24.HOUR.11.P008\", \"n\": 8, \"t\": \"Fais en sorte que ton tremblement parcourt mes Membres,\\nafin qu'identifiée à Moi\\n- tu puisses te fortifier et te réchauffer,\\n- pour ressentir une partie de mes Peines.\"}, {\"id\": \"PASSION24.HOUR.11.P009\", \"n\": 9, \"t\": \"Tu acquerras la force en Me voyant souffrir à ce point. Ce sera la plus belle défense que tu puisses M'accorder. Sois fidèle et attentive ! » Mon doux Amour, le vacarme de tes ennemis est si considérable qu'il m’empêche de prendre un peu de sommeil. Les coups deviennent plus violents. J'entends le bruit des chaînes avec lesquelles ils T’ont attaché si fermement que de tes Poignets jaillit du Sang, lequel marque ces rues.\"}, {\"id\": \"PASSION24.HOUR.11.P010\", \"n\": 10, \"t\": \"Rappelle-Toi que mon sang est dans le Tien.\\nPendant que Tu verses le Tien, le mien T’y donne un baiser, T’adore et répare,\\n- pour que ton Sang soit Lumière pour tous ceux qui T’offensent dans la nuit.\\n- pour qu'il soit un aimant pour attirer tous les cœurs à Toi.\"}, {\"id\": \"PASSION24.HOUR.11.P011\", \"n\": 11, \"t\": \"Mon Amour et mon Tout, pendant qu'ils Te traînent, l'air est alourdi de cris et de sifflements. Et Tu arrives chez Caïphe. Tu es paisible, modeste et humble. Ta Douceur et ta Patience sont telles qu'elles terrorisent tes ennemis mêmes. Et Caïphe devient furieux. Il semble vouloir Te dévorer. Ah ! comme l'innocence et le péché se départagent facilement ! Mon Amour, Tu es devant Caïphe comme un coupable en train d'être condamné. Caïphe demande aux témoins quels sont tes délits. Ah ! il aurait mieux fait d'implorer ton pardon ! L'un T’accuse d'une chose, un autre d'une autre. On dit des bêtises et on se contredit.\"}, {\"id\": \"PASSION24.HOUR.11.P012\", \"n\": 12, \"t\": \"Et tandis qu'on T’accuse,\\ndes soldats\\n- Te tirent les Cheveux,\\n- Te giflent de manière si horrible qu'ils font résonner toute la salle.\\nIls Te maltraitent, Te battent, Te piquent.\\nMais quand Tu les regardes,\\nla Lumière de tes Yeux leur descend dans le cœur.\\nEt comme ils ne peuvent pas le supporter, ils s'éloignent de Toi.\\nD'autres soldats prennent la relève.\\nEt Toi, au milieu de tant d'accusations et d'outrages, Tu gardes le silence.\\nTon Cœur bat si fort qu'il semble sur le point d'éclater.\\nTu reçois les brutalités de tes ennemis avec beaucoup d'Amour.\\nTu les offres pour notre salut.\"}, {\"id\": \"PASSION24.HOUR.11.P013\", \"n\": 13, \"t\": \"Ainsi, dans le plus grand calme,\\nton Cœur répare\\n- les calomnies, - les haines, - les faux témoignages,\\n- le mal fait avec préméditation aux innocents.\"}, {\"id\": \"PASSION24.HOUR.11.P014\", \"n\": 14, \"t\": \"Il répare\\n- les offenses faites à l'instigation des chefs, et\\n- les fautes commises par les âmes consacrées.\\nJe sens qu'une souffrance nouvelle afflige ton Cœur.\\nDis-moi ce que c'est, ô Jésus. Fais-moi participer à tout !\\nJésus semble me dire :\"}, {\"id\": \"PASSION24.HOUR.11.P015\", \"n\": 15, \"t\": \"« Mon enfant, tu veux le savoir ? J'entends la voix de Pierre\\n- qui prétend ne pas Me connaître, qui le jure, et le jure encore.\"}, {\"id\": \"PASSION24.HOUR.11.P016\", \"n\": 16, \"t\": \"Ah ! Pierre, tu ne Me connais pas ? Tu ne Te souviens pas de tous les Bienfaits dont Je T’ai comblé ? Si les autres me font mourir de peines, toi, tu Me fais mourir de douleur ! Comme tu as mal fait de T’exposer aux occasions en Me suivant de loin ! » Mon Bien renié, comme elles se reconnaissent vite les offenses de ceux qui Te sont les plus chers !\"}, {\"id\": \"PASSION24.HOUR.11.P017\", \"n\": 17, \"t\": \"Jésus, je veux faire passer les battements de mon cœur dans les Tiens pour adoucir tes tortures. Et mes battements de cœur te jurent fidélité, amour, et jurent mille fois que je Te connais.\"}, {\"id\": \"PASSION24.HOUR.11.P018\", \"n\": 18, \"t\": \"Mais ton Cœur ne se calme pas : Tu cherches à voir Pierre. À tes Regards d'Amour, aux Larmes que Tu verses à cause de son reniement, Pierre s'émeut, pleure et s'éloigne.\"}, {\"id\": \"PASSION24.HOUR.11.P019\", \"n\": 19, \"t\": \"Et Toi, l'ayant placé à l'abri,\\n- Tu Te calmes et Tu répares les offenses des âmes consacrées.\\n- Tu répares pour les âmes qui se mettent volontairement\\ndans les occasions de péché.\\nMais tes ennemis continuent de T’accuser.\\nVoyant que Tu ne réponds rien à leurs accusations,\\nCaïphe Te dit :\\n« Je Te conjure par le Dieu vivant, dis-moi : es-Tu vraiment le Fils de Dieu ? »\"}, {\"id\": \"PASSION24.HOUR.11.P020\", \"n\": 20, \"t\": \"Alors Toi, mon Amour, ayant toujours à cœur la Vérité et la Gloire de ton Père,\"}, {\"id\": \"PASSION24.HOUR.11.P021\", \"n\": 21, \"t\": \"Tu réponds avec une Voix sonore et majestueuse telle\\n- que tous en restent frappés et\\n- que les démons mêmes s'enfoncent dans l'abîme :\\n« C'est toi qui le dis ; Je suis le Fils de Dieu.\\nUn jour Je descendrai sur les nuées du Ciel\\npour juger toutes les nations. »\\nÀ ces Paroles solennelles, tous font silence et frissonnent d'épouvante.\\nAprès quelques instants de sa propre épouvante, Caïphe,\\nfurieux comme une bête féroce, dit à tous :\\n« À quoi bon les témoins maintenant ?\\nIl vient de proférer un grand blasphème.\\nQu'attendons-nous de plus pour le condamner ? Il est coupable de mort ! »\"}, {\"id\": \"PASSION24.HOUR.11.P022\", \"n\": 22, \"t\": \"Pour donner plus d'emphase à ses paroles sacrilèges,\\n- il déchire ses vêtements avec tant de courroux que\\n- tous (comme s'ils ne formaient qu'une seule personne) hurlent :\\n« Il est coupable de mort ! Il est coupable de mort ! »\"}, {\"id\": \"PASSION24.HOUR.11.P023\", \"n\": 23, \"t\": \"Ils foncent sur Toi et, à qui mieux mieux. Ils Te distribuent coups de poing, coups de pied, gifles et crachats au Visage.\"}, {\"id\": \"PASSION24.HOUR.11.P024\", \"n\": 24, \"t\": \"Mon Bien, les Tourments qu'ils Te donnent, sont tels que la terre et le Ciel en sont bouleversés ! Mon Amour et ma Vie, pendant ces terribles moments, mon cœur est lacéré par la douleur !\"}, {\"id\": \"PASSION24.HOUR.11.P025\", \"n\": 25, \"t\": \"De grâce, permets-moi\\n- de rentrer dans ton Cœur affligé et\\n- d'affronter ces outrages à ta place !\"}, {\"id\": \"PASSION24.HOUR.11.P026\", \"n\": 26, \"t\": \"Ah ! si cela m’était possible,\\nje voudrais Te faire T’échapper des mains de tes ennemis.\\nMais Toi, Tu ne veux pas, car cela est exigé pour le salut de tous.\\nEt je suis obligée de me résigner !\\nMon doux Amour,\\n- laisse-moi Te remettre en état,\\n- arranger tes Cheveux,\\n- enlever les crachats et le Sang qui couvrent ton Visage, et\\n- m'enfermer dans ton Cœur,\"}, {\"id\": \"PASSION24.HOUR.11.P027\", \"n\": 27, \"t\": \"Car je vois que Caïphe veut quitter la pièce et Te remettre entre les mains des soldats. Mon Jésus, je T’adore. Bénis-moi, donne-moi le Baiser mystique de l'Amour. Je m'enferme dans la fournaise de ton Cœur divin pour prendre un peu de sommeil.\"}, {\"id\": \"PASSION24.HOUR.11.P028\", \"n\": 28, \"t\": \"J'appuie ma tête sur ton Cœur,\\n- afin que par mes respirations, je Te donne des baisers\\n- et que, d'après la diversité des Battements de ton Cœur,\\nje puisse me rendre compte si Tu souffres ou si Tu Te reposes.\\nJésus, je T’embrasse, je me serre fort contre ton Cœur, et je m'endors.\"}], \"reflections\": [{\"id\": \"PASSION24.HOUR.11.REF.P001\", \"t\": \"Devant Caïphe, Jésus est accusé injustement et soumis à des tortures inouïes. Interrogé, Il dit toujours la vérité.\"}, {\"id\": \"PASSION24.HOUR.11.REF.P002\", \"t\": \"Et nous, quand le Seigneur permet qu'on nous calomnie ou qu'on nous accuse injustement, nous réfugions-nous uniquement en Dieu, Lui qui connaît notre innocence ? Ou bien mendions-nous l'estime et les honneurs des créatures ?\"}, {\"id\": \"PASSION24.HOUR.11.REF.P003\", \"t\": \"Nos lèvres disent-elles toujours la vérité ? Sommes-nous ennemis de toute ruse ou de tout mensonge ? Supportons-nous avec patience les dérisions et les confusions provenant des créatures ? Sommes-nous prêts à donner notre vie pour le salut de ces créatures ? Mon doux Jésus, comme je suis différente de Toi ! De grâce, fais en sorte que mes lèvres disent toujours la vérité de manière à atteindre le cœur de ceux qui m'écoutent pour les conduire à Toi !\"}], \"subsections\": []}, {\"hour_id\": \"PASSION24.HOUR.12\", \"hour_number\": 12, \"display_time\": \"4h à 5h\", \"title\": \"Jésus est parmi les soldats\", \"short_title\": \"Jésus est parmi les soldats\", \"source_pages\": [118, 119, 120], \"opening_prayer_ids\": [\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"], \"closing_prayer_ids\": [\"PASSION24.PRAYER.AFTER_EACH_HOUR\"], \"paragraphs\": [{\"id\": \"PASSION24.HOUR.12.P001\", \"n\": 1, \"t\": \"Ma douce Vie, tandis que je dors serrée contre Toi, souvent je me sens piquée par les épines qui transpercent ton Cœur.\"}, {\"id\": \"PASSION24.HOUR.12.P002\", \"n\": 2, \"t\": \"Et comme Tu veux une âme aimante près de Toi pour qu'elle note toutes tes Peines et compatisse avec Toi, je me serre plus fortement contre Toi et, sentant ainsi davantage les piqûres, je me réveille.\"}, {\"id\": \"PASSION24.HOUR.12.P003\", \"n\": 3, \"t\": \"Mais, que vois-je et qu'entends-je ? Je voudrais Te cacher dans mon Cœur pour m'exposer à ta place et recevoir tes insultes et tes humiliations ! Seul un Amour comme le Tien peut supporter tant d'outrages !\"}, {\"id\": \"PASSION24.HOUR.12.P004\", \"n\": 4, \"t\": \"Ô mon Jésus infiniment patient, que peut-on espérer de gens aussi barbares ? Je vois que tes ennemis se jouent de Toi.\"}, {\"id\": \"PASSION24.HOUR.12.P005\", \"n\": 5, \"t\": \"Tandis que Tu verses des fleuves de Larmes pour notre salut, ces gens Te couvrent le Visage de crachats, tellement que la Lumière de tes beaux Yeux en est voilée.\"}, {\"id\": \"PASSION24.HOUR.12.P006\", \"n\": 6, \"t\": \"Et ne supportant pas l'éclat de tes Regards divins,\\nils Te couvrent d'encore plus de crachats.\\nMais ils ne peuvent masquer ta divine Majesté.\\nTon infinie Douceur ressort de plus en plus !\\nIls ont honte d'eux-mêmes\\nEt pour se sentir plus libres, ils Te bandent les Yeux avec une vile guenille,\\nde manière à pouvoir se déchaîner plus à leur aise sur ta Personne adorable.\\nIls Te battent sans pitié,\\n- Te traînent,\\n- Te foulent aux pieds, et\\n- Te répètent leurs coups de poing et leurs gifles au Visage.\\nIls T’égratignent, Te tirent les Cheveux et la Barbe.\\nEt ils Te projettent d'un endroit à l'autre.\\nJésus, mon Amour, mon cœur ne supporte pas de Te voir ainsi maltraité !\\nTu veux que je note tout.\\nMais j'ai des frissons et je voudrais me couvrir les yeux pour ne pas voir ces\\nhorreurs. Mais l'Amour m'oblige à continuer de Te regarder !\\nJ'observe que Tu ne dis pas un seul mot pour Te defendre.\\nTu es entre les mains de ces soldats comme un vulgaire chiffon\\ndont on peut faire ce qu'on veut.\\nOn Te projette par terre et on T’écrase sous les pieds avec une furie infernale.\\nÀ tel point que j'ai peur que Tu meures sous ces pieds impitoyables.\\nMon Bien et mon Tout, la souffrance est extrême de voir ce qu'on Te fait.\\nEt je voudrais pousser des cris si forts qu'ils parviennent là-haut, au Ciel et\\nappellent le Père, le Saint-Esprit et tous les anges\\n- à venir Te réconforter et T’aider.\"}, {\"id\": \"PASSION24.HOUR.12.P007\", \"n\": 7, \"t\": \"Et ici, sur la terre, je veux appeler ta douce Maman et toutes les âmes\\naimantes à faire cercle autour de Toi, afin d'empêcher ces soldats insolents de\\nT’insulter et de Te tourmenter davantage.\\nAvec Toi, Jésus, je veux réparer\\n- les péchés nocturnes, surtout ceux qui sont commis par les sectaires\\nsur ta Présence sacramentelle.\"}, {\"id\": \"PASSION24.HOUR.12.P008\", \"n\": 8, \"t\": \"- aussi toutes les offenses des âmes qui ne Te restent pas fidèles\\nquand elles sont dans la nuit de l'épreuve.\\nMon Bien tyrannisé,\\nje vois, que les soldats fatigués et ivres veulent se reposer.\\nMais mon cœur brisé à la vue de tant de Souffrances,\\nne veut pas rester seul avec Toi.\\nIl ressent le besoin d'une autre compagnie.\"}, {\"id\": \"PASSION24.HOUR.12.P009\", \"n\": 9, \"t\": \"Douce Maman, sois avec nous sans cesse. Je serre fort ta Main maternelle et je la baise. Daigne me fortifier de ta bénédiction. Embrassons ensemble Jésus et posons nos têtes sur son Cœur adorable pour Le consoler.\"}, {\"id\": \"PASSION24.HOUR.12.P010\", \"n\": 10, \"t\": \"Jésus, c'est avec ta Maman que je T’embrasse. Bénis-nous et, avec elle, nous prendrons le sommeil de l'Amour dans ton Cœur adorable.\"}], \"reflections\": [{\"id\": \"PASSION24.HOUR.12.REF.P001\", \"t\": \"Durant cette Heure, Jésus se trouve parmi les soldats\\n- avec un courage imperturbable, une constance de fer.\\nEn tant que Dieu, Il souffre tous les outrages que les soldats Lui font, et\\nIl les regarde avec tant d'Amour\\nqu'Il semble les inviter à Lui donner plus de Souffrances encore.\"}, {\"id\": \"PASSION24.HOUR.12.REF.P002\", \"t\": \"Et nous, dans nos souffrances,\\n- sommes-nous constants, ou bien nous lamentons-nous,\\n- nous ennuyons-nous, perdons-nous la paix,\\ncette paix du cœur nécessaire pour que Jésus\\npuisse trouver en nous une heureuse demeure ?\\nLa constance est une vertu montrant que Dieu règne vraiment en nous.\\n- Elle nous rend fermes dans l'épreuve, non pas avec des hauts et des bas.\\n- Et elle nous amène la paix.\\nSi nous sommes inconstants, notre champ d'action est petit et\\nl'action de Jésus en nous ne peut qu'être limitée.\\nJésus regardait avec Amour ceux qui le maltraitaient.\\nNous, regardons-nous avec amour ceux qui nous offensent ?\\nEt cet amour est-il assez grand pour que ces personnes soient attirées\\nà se convertir à Jésus ?\\nMon Jésus, Amour sans limite, donne-moi ton Amour\\nafin que chacune de mes peines rapproche des âmes de Toi.\"}], \"subsections\": []}, {\"hour_id\": \"PASSION24.HOUR.13\", \"hour_number\": 13, \"display_time\": \"5h à 6h\", \"title\": \"L’emprisonnement de Jésus\", \"short_title\": \"L’emprisonnement de Jésus\", \"source_pages\": [121, 122, 123, 124, 125, 126, 127], \"opening_prayer_ids\": [\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"], \"closing_prayer_ids\": [\"PASSION24.PRAYER.AFTER_EACH_HOUR\"], \"paragraphs\": [{\"id\": \"PASSION24.HOUR.13.P001\", \"n\": 1, \"t\": \"Mon Jésus, doux Prisonnier, je me suis réveillée et je ne Te trouve pas. J'ai le cœur qui bat fort. Je brûle du désir d'aimer. Dis-moi où Tu es. Mon ange, amène-moi chez Caïphe. Je me promène partout, je fouille partout, et je ne trouve pas Jésus ! Mon Amour, vite, amène-moi à Toi, afin que je puisse me jeter dans tes Bras. Je découvre qu'ils T’ont mis en prison. Mon cœur exulte de joie de Te retrouver.\"}, {\"id\": \"PASSION24.HOUR.13.P002\", \"n\": 2, \"t\": \"Mais il est blessé de douleur en voyant l'état dans lequel ils T’ont réduit. Je Te vois : les Mains liées à une colonne, - les Pieds serrés et liés, ton saint Visage gonflé et ensanglanté à cause des gifles et des coups reçus.\"}, {\"id\": \"PASSION24.HOUR.13.P003\", \"n\": 3, \"t\": \"Tes Yeux sont livides, Tes Pupilles sont fatiguées et mélancoliques à cause de tout ce qu'on T’a fait subir et du manque de sommeil. Tes Cheveux sont en désordre, ta divine Personne a mal partout. Et Tu ne peux pas T’aider et Te nettoyer car Tu es attaché.\"}, {\"id\": \"PASSION24.HOUR.13.P004\", \"n\": 4, \"t\": \"Et moi, en sanglots, je T’embrasse les Pieds et je Te dis : « Comme Tu es mal en point, mon Amour ! »\"}, {\"id\": \"PASSION24.HOUR.13.P005\", \"n\": 5, \"t\": \"Tu me réponds :\\n« Viens, ô âme.\\nSois attentive à tout ce que tu Me vois faire pour le faire avec Moi,\\nafin que Je puisse continuer ma Vie en toi. »\\nMon Jésus, à ma stupeur, je vois qu'au lieu de Te préoccuper de tes Peines,\\n- Tu penses - avec un Amour indicible - à glorifier le Père\\npour Le dédommager de nos négligences envers Lui, et\\n- Tu appelles toutes les âmes autour de Toi\\npour prendre tous leurs maux sur Toi et leur donner tous tes Biens.\\nNous sommes déjà au point du jour.\\nIl me semble entendre ta Voix infiniment douce dire :\"}, {\"id\": \"PASSION24.HOUR.13.P006\", \"n\": 6, \"t\": \"« Père saint, Je Te rends grâce pour tout ce que J'ai souffert et pour ce qu'il Me reste encore à souffrir.\"}, {\"id\": \"PASSION24.HOUR.13.P007\", \"n\": 7, \"t\": \"Comme cette aube appelle le jour,\\n- que l'aube de ta Grâce se manifeste dans tous les cœurs.\\n- que Moi, le Soleil divin,\\nJe surgisse dans tous les cœurs et règne en tous.\"}, {\"id\": \"PASSION24.HOUR.13.P008\", \"n\": 8, \"t\": \"Tu vois, ô Père, toutes ces âmes.\\nJe réponds de toutes :\\n- leurs pensées, leurs paroles,\\n- leurs œuvres et leurs omissions,\\nau coût de mon Sang et de ma Mort ! »\\nMon Jésus, Amour infini,\\nje m'unis à ta Prière en Te remerciant\\npour ce que Tu m'as fait souffrir et pour ce qu'il me reste à souffrir à tes côtés.\"}, {\"id\": \"PASSION24.HOUR.13.P009\", \"n\": 9, \"t\": \"Je Te prie de faire poindre dans tous les cœurs l'aube de ta Grâce. Mais je vois, mon doux Jésus, que Tu répares pour les premières\"}, {\"id\": \"PASSION24.HOUR.13.P010\", \"n\": 10, \"t\": \"pensées, affections et paroles, qui au petit jour, ne Te sont pas offertes. Tu les appelles, puisqu'elles Te sont dues. Tu répares pour donner au Père la Gloire qui Lui est due. Mon Jésus, Maître divin, dans cette prison nous avons une heure de libre et nous sommes seuls. Je veux faire non seulement ce que Tu fais.\"}, {\"id\": \"PASSION24.HOUR.13.P011\", \"n\": 11, \"t\": \"Je veux\\n- Te nettoyer,\\n- T’arranger les Cheveux et\\n- me fondre en Toi.\"}, {\"id\": \"PASSION24.HOUR.13.P012\", \"n\": 12, \"t\": \"Par conséquent, je m'approche de ta Tête infiniment sainte et, en T'arrangeant les Cheveux, je veux réparer pour les intelligences dénaturées, qui n'ont pas une seule pensée pour Toi.\"}, {\"id\": \"PASSION24.HOUR.13.P013\", \"n\": 13, \"t\": \"Et, me fondant dans ton Intelligence,\\nje veux adorer toutes tes Pensées, pour en tirer assez de réparations\\n- pour toutes les pensées mauvaises des créatures,\\n- pour toutes les lumières et les inspirations qu'elles repoussent.\"}, {\"id\": \"PASSION24.HOUR.13.P014\", \"n\": 14, \"t\": \"Je voudrais que toutes les pensées des créatures\\nne fassent qu'un avec les Tiennes, pour Te donner\\n- une vraie réparation et une gloire parfaite.\\nMon Jésus affligé, je baise tes Yeux mélancoliques et remplis de Larmes.\\nComme tes Mains sont liées à la colonne, Tu ne peux\\nni Te sécher, ni T’enlever les crachats avec lesquels T’ont souillé tes ennemis.\\nEt comme la position dans laquelle ils T’ont lié est torturante,\\nne peux fermer tes Yeux fatigués pour prendre un peu de repos.\"}, {\"id\": \"PASSION24.HOUR.13.P015\", \"n\": 15, \"t\": \"Mon Amour, combien volontiers je voudrais Te servir de lit avec mes bras pour Te donner du repos !\"}, {\"id\": \"PASSION24.HOUR.13.P016\", \"n\": 16, \"t\": \"Je veux essuyer tes Yeux,\\n- Te demander pardon, et réparer\\npour les nombreuses fois que nous n'avons pas eu l'intention\\n- de Te plaire et de Te regarder\\npour voir\\n- ce que Tu voulais de nous,\\n- ce que nous devions faire, et\\n- où Tu voulais que nous allions.\"}, {\"id\": \"PASSION24.HOUR.13.P017\", \"n\": 17, \"t\": \"Et je veux fondre mes yeux et ceux de toutes les créatures dans les Tiens,\\npour pouvoir réparer par tes propres Yeux\\ntout le mal que nous avons fait au moyen de notre vue.\\nMon Jésus compatissant, je baise tes Oreilles infiniment saintes.\\nElles sont fatiguées\\n- par les insultes de toute la nuit, et\\n- plus encore par l'écho des offenses de toutes les créatures.\"}, {\"id\": \"PASSION24.HOUR.13.P018\", \"n\": 18, \"t\": \"Je Te demande pardon et\\nje veux réparer pour toutes les fois que Tu nous as appelés et\\n- que nous avons été sourds à ta Voix, ou\\n- que nous avons feint de ne pas T’entendre.\"}, {\"id\": \"PASSION24.HOUR.13.P019\", \"n\": 19, \"t\": \"Et Toi, mon Bien si patient, Tu as répété tes Appels, mais en vain.\\nJe veux fondre mes oreilles et celles de toutes les créatures dans les Tiennes,\\n- pour faire une réparation continuelle et complète, et\\n- pour que les créatures écoutent tes divines Paroles et\\nles mettent en pratique.\\nMon Jésus plein d'Amour, je baise ton Visage infiniment saint,\\ndevenu livide à cause des gifles.\"}, {\"id\": \"PASSION24.HOUR.13.P020\", \"n\": 20, \"t\": \"Je Te demande pardon et je répare pour toutes les fois que Tu nous as appelés à être tes victimes de réparation, alors que nous, nous unissant à tes ennemis, nous T’avons giflé et craché dessus !\"}, {\"id\": \"PASSION24.HOUR.13.P021\", \"n\": 21, \"t\": \"Mon Jésus, je veux fondre mon visage dans le Tien,\\n- pour Te restituer ta Beauté originale et\\n- pour Te donner réparation entière pour tous les mépris\\nque tes ennemis ont dirigé contre ta divine Majesté.\\nMon Bien si attristé, je baise ta Bouche infiniment douce,\\n- endolorie à cause des coups de poing, et\\n- brûlée par l'Amour.\"}, {\"id\": \"PASSION24.HOUR.13.P022\", \"n\": 22, \"t\": \"Je veux, au moyen\\n- de ma langue et\\n- de celle de toutes les créatures unies à ta propre Langue,\\nréparer toutes les conversations mauvaises des créatures.\"}, {\"id\": \"PASSION24.HOUR.13.P023\", \"n\": 23, \"t\": \"Je veux, mon Jésus assoiffé,\\nunir toutes les voix des créatures à la Tienne,\\n- pour étouffer les voix du péché et\\n- pour les changer en voix de louange et d'amour.\"}, {\"id\": \"PASSION24.HOUR.13.P024\", \"n\": 24, \"t\": \"Mon Jésus enchaîné, je baise ton Cou chargé de lourdes chaînes et de cordes, lesquelles, encerclant ta Poitrine, tes Épaules et tes Bras, te tiennent serré contre la colonne.\"}, {\"id\": \"PASSION24.HOUR.13.P025\", \"n\": 25, \"t\": \"Tes Mains sont gonflées et noircies à cause de ces liens serrés.\\nElles laissent couler du Sang.\\nJésus lié, de grâce, permets-moi de Te délier.\\nSi Tu aimes être lié, permets-moi de Te lier avec les chaînes de l'amour\\nqui, étant douces, allégeront tes Peines.\\nEt tandis que je Te délie, je veux m'unir à Toi\\n- pour réparer avec Toi les attachements mauvais de tous et\\n- pour donner à tous les chaînes de l'Amour.\"}, {\"id\": \"PASSION24.HOUR.13.P026\", \"n\": 26, \"t\": \"Ainsi, nous emplirons les poitrines des créatures de ton Feu. Celui-ci a tant de force que Tu ne peux le contenir.\"}, {\"id\": \"PASSION24.HOUR.13.P027\", \"n\": 27, \"t\": \"Nous réparerons\\n- toutes les froideurs, tous les plaisirs illicites et l'amour du confort,\\npour donner à tous l'esprit de sacrifice et l'amour de la souffrance.\\nJe veux me fondre en tes Mains\\npour réparer\\n- les œuvres mauvaises, les miennes et celles de tous, et\\n- le bien mal fait ou fait avec présomption,\\npour donner à tous le parfum de tes Œuvres.\"}, {\"id\": \"PASSION24.HOUR.13.P028\", \"n\": 28, \"t\": \"Je veux me fondre en tes Pieds et, pour réparer,\\n- y enfermer tous les pas des créatures pour qu'elles cheminent à ta suite.\\nMa douce Vie, permets que, me fondant en ton Cœur,\\nJ'y renferme toutes les affections, les sentiments et les désirs des créatures,\\npour les réparer avec Toi.\"}, {\"id\": \"PASSION24.HOUR.13.P029\", \"n\": 29, \"t\": \"Je donne à tous tes Affections, tes Sentiments et tes Désirs, afin que plus personne ne T’offense. Et maintenant j'entends un bruit de clefs. Ce sont tes ennemis qui viennent Te prendre. Jésus, je tremble, je sens mon sang se glacer. Sous peu Tu seras de nouveau entre leurs mains. Qu'adviendra-t-il de Toi ?\"}, {\"id\": \"PASSION24.HOUR.13.P030\", \"n\": 30, \"t\": \"Ah ! il me semble entendre le bruit des clefs des saints tabernacles !\\nParfois ce sont des mains indignes\\n- qui viennent les ouvrir, et même\\n- pour Te faire descendre dans des cœurs sacrilèges !\"}, {\"id\": \"PASSION24.HOUR.13.P031\", \"n\": 31, \"t\": \"Combien de fois Te conduit-on\\n- dehors dans les rues, en procession ou\\n- pour donner le saint viatique,\\noù Tu rencontres des personnes qui Te méprisent et T’outragent !\"}, {\"id\": \"PASSION24.HOUR.13.P032\", \"n\": 32, \"t\": \"Mon Jésus prisonnier,\\nje veux me trouver dans toutes tes prisons d'Amour\\n- pour être spectatrice quand tes ministres Te libèrent,\\n- pour Te tenir compagnie et\\n- pour réparer les offenses que tu peux y recevoir !\"}, {\"id\": \"PASSION24.HOUR.13.P033\", \"n\": 33, \"t\": \"Mon Jésus, tes ennemis sont tout près. Tu es en train de saluer le soleil levant, le dernier que Tu verras en tes jours mortels.\"}, {\"id\": \"PASSION24.HOUR.13.P034\", \"n\": 34, \"t\": \"Tandis qu'ils Te detachent, Te voyant tout majestueux et le Regard rempli d'Amour, ils Te décochent au Visage des gifles si fortes qu'elles font rougir tes divines Joues. Mon Amour, avant que Tu ne quittes la prison, je Te prie de me bénir, pour que je reçoive assez de force pour Te suivre durant le reste de ta Passion.\"}], \"reflections\": [{\"id\": \"PASSION24.HOUR.13.REF.P001\", \"t\": \"Jésus, prisonnier, lié à une colonne et immobilisé,\\nest souillé de crachats et de boue.\\nIl cherche notre âme pour qu'elle Lui tienne compagnie.\\nEt nous, sommes-nous contents d'être seuls avec Jésus.\\nOu bien préférons-nous la compagnie des créatures ?\\nNotre respiration et nos battements de cœur sont-ils toujours pour Jésus ?\\nPour que nous soyons semblables à Lui,\\nJésus lie notre âme au moyen\\n- des aridités,\\n- des oppressions,\\n- des souffrances et\\n- d'autres mortifications.\\nEt nous, sommes-nous contents de nous faire lier par Jésus dans la prison\\noù son Amour nous place, c'est-à-dire l'obscurité, les oppressions, etc. ?\\nJésus est en prison.\\nAvons-nous la force et la promptitude de nous emprisonner avec Lui\\npar amour pour Lui ?\"}, {\"id\": \"PASSION24.HOUR.13.REF.P002\", \"t\": \"Jésus désire ardemment notre âme pour se sentir délié et soutenu dans la douloureuse position dans laquelle Il se trouve.\"}, {\"id\": \"PASSION24.HOUR.13.REF.P003\", \"t\": \"Et nous, désirons-nous ardemment\\n- que seul Jésus vienne nous tenir compagnie,\\n- qu'Il nous délie des chaînes des passions et\\n- qu’Il nous lie à son Cœur au moyen de chaînes plus fortes.\"}, {\"id\": \"PASSION24.HOUR.13.REF.P004\", \"t\": \"Mettons-nous nos peines autour de Jésus souffrant\\n- pour éloigner de Lui les crachats et la boue que les pécheurs Lui envoient ?\\nDans sa prison, Jésus prie.\\nNotre prière est-elle constante avec Lui et comme Lui ?\\nMon Jésus enchaîné, Tu T’es laissé emprisonner par Amour pour moi.\\nJe Te prie d’emprisonner en Toi\\n- mon intelligence,\\n- ma langue,\\n- mon cœur,\\n- tout moi-même,\\npour que je n'aie aucune liberté et que Tu aies le contrôle absolu sur moi.\"}], \"subsections\": []}, {\"hour_id\": \"PASSION24.HOUR.14\", \"hour_number\": 14, \"display_time\": \"6h à 7h\", \"title\": \"Jésus est ramené chez Caïphe, puis conduit chez Pilate\", \"short_title\": \"Jésus est ramené chez Caïphe, puis conduit chez Pilate\", \"source_pages\": [128, 129, 130], \"opening_prayer_ids\": [\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"], \"closing_prayer_ids\": [\"PASSION24.PRAYER.AFTER_EACH_HOUR\"], \"paragraphs\": [{\"id\": \"PASSION24.HOUR.14.P001\", \"n\": 1, \"t\": \"Mon Jésus affligé, on T’a maintenant sorti de prison. Tu es si exténué que Tu vacilles à chacun de tes Pas. Permets que je me tienne près de Toi pour Te soutenir quand Tu seras sur le point de tomber. Je vois que les soldats Te présentent de nouveau devant Caïphe.\"}, {\"id\": \"PASSION24.HOUR.14.P002\", \"n\": 2, \"t\": \"Et Toi, mon Jésus, Tu apparais parmi eux comme un Soleil. Et malgré que Tu sois défiguré, Tu rayonnes de Lumière.\"}, {\"id\": \"PASSION24.HOUR.14.P003\", \"n\": 3, \"t\": \"Je m'aperçois que Caïphe jubile de Te voir si mal en point. Devant ta Lumière, il devient encore plus aveugle. Dans sa fureur il recommence à T’interroger : « Donc, Tu es le Fils de Dieu ? »\"}, {\"id\": \"PASSION24.HOUR.14.P004\", \"n\": 4, \"t\": \"Et Toi, mon Amour, avec majesté, mais de ton Accent habituel, doux et émouvant, Tu réponds : « Oui, Je suis le Fils de Dieu ! »\"}, {\"id\": \"PASSION24.HOUR.14.P005\", \"n\": 5, \"t\": \"Ces hommes iniques ressentent en eux toute la Force de ces Paroles. Ils étouffent en eux tout bon sentiment et ils crient d'une voix unanime : « Il est coupable de mort ! Il est coupable de mort. » Caïphe confirme la sentence de mort et T’envoie à Pilate.\"}, {\"id\": \"PASSION24.HOUR.14.P006\", \"n\": 6, \"t\": \"Toi, mon Jésus condamné,\\nTu acceptes cette sentence du Pontife inique avec Amour et résignation.\\nTu répares ainsi les péchés commis délibérément et avec malice,\\nles péchés de ceux qui,\\n- au lieu de s'affliger du mal,\\n- jubilent et exultent du péché même,\\nCeci les conduit à la cécité et au rejet de toute Lumière et de toute Grâce.\\nMa Vie, tes Réparations et tes Prières font écho dans mon Cœur.\\nJe veux réparer et prier avec Toi.\"}, {\"id\": \"PASSION24.HOUR.14.P007\", \"n\": 7, \"t\": \"Mon doux Amour, je vois qu'en Te voyant condamné à mort par Caïphe, les soldats ont perdu toute pitié. Ils T’ajoutent des cordes et des chaînes. Ils Te serrent si fort qu'ils T’enlèvent presque toute possibilité de mouvement. IIs Te poussent et Te traînent pour Te faire sortir du palais. Des foules T’attendent, mais il n'y a personne pour Te défendre. Toi, mon Soleil divin, Tu sors parmi eux pour les éclairer de ta Lumière. En faisant ces Pas, Tu veux renfermer dans les Tiens tous les pas des créatures. Tu pries et Tu répares pour ceux qui font leurs pas pour agir dans le mal, pour se venger, pour tuer, pour trahir, pour voler, etc. Et pour empêcher tant de mal, Tu pries, Tu répares et Tu T’offres au Père. Ô Jésus, je vois qu'en descendant du palais de Caïphe Tu rencontres celle qui est ton Soleil, Marie, ta douce Maman. Vos Regards se rencontrent. Bien que vous soyez heureux de vous voir, des Douleurs particulières transpercent vos Cœurs :\"}, {\"id\": \"PASSION24.HOUR.14.P008\", \"n\": 8, \"t\": \"C’est pour Toi la Douleur de voir ta Maman affligée, pâle et accablée par le deuil. C'est sa Douleur de Te voir Toi, Soleil divin, éclipsé par tant d'opprobres et tout couvert de Sang.\"}, {\"id\": \"PASSION24.HOUR.14.P009\", \"n\": 9, \"t\": \"Vous vivez aussi la Douleur de ne pouvoir échanger ne serait-ce qu'une parole. Vos Cœurs, cependant, se communiquent tout, se fondant l'un dans l'autre.\"}, {\"id\": \"PASSION24.HOUR.14.P010\", \"n\": 10, \"t\": \"Mais vous cessez rapidement de vous regarder, car les soldats Te poussent, ô mon Jésus. Et ainsi bousculé et traîné, Tu arrives chez le gouverneur romain Pilate.\"}, {\"id\": \"PASSION24.HOUR.14.P011\", \"n\": 11, \"t\": \"Mon Jésus, je m'unis à ta Maman affligée pour Te suivre, en me fondant en Toi avec elle. Et Toi, me jetant un Regard d'Amour, Tu me bénis !\"}], \"reflections\": [{\"id\": \"PASSION24.HOUR.14.REF.P001\", \"t\": \"Jésus sort à la lumière du jour et on L'amène devant Caïphe. Là, avec fermeté, Il confirme qu'Il est le Fils de Dieu.\"}, {\"id\": \"PASSION24.HOUR.14.REF.P002\", \"t\": \"Et nous, quand nous sortons, nous laissons-nous conduire par Jésus ? Sommes-nous des témoins de la Vérité ? Notre comportement est-il un exemple pour les autres ? Nos pas conduisent-ils les âmes à Jésus ?\"}, {\"id\": \"PASSION24.HOUR.14.REF.P003\", \"t\": \"Mon Jésus, Sainteté absolue, guide-moi. Fais en sorte que tout mon être, y compris mon comportement extérieur, manifeste en moi ta Vie divine.\"}], \"subsections\": []}, {\"hour_id\": \"PASSION24.HOUR.15\", \"hour_number\": 15, \"display_time\": \"7h à 8h\", \"title\": \"Jésus est devant Pilate, puis devant Hérode\", \"short_title\": \"Jésus est devant Pilate, puis devant Hérode\", \"source_pages\": [131, 132, 133, 134, 135], \"opening_prayer_ids\": [\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"], \"closing_prayer_ids\": [\"PASSION24.PRAYER.AFTER_EACH_HOUR\"], \"paragraphs\": [{\"id\": \"PASSION24.HOUR.15.P001\", \"n\": 1, \"t\": \"Mon Bien enchaîné, tes ennemis unis aux prêtres Te présentent à Pilate. Ils restent à l'extérieur, dans l'atrium, pour ne pas être souillés. Ils doivent demain fêter la Pâque et ils ne veulent pas affecter leur ‘sainteté’ et leur ‘rectitude’.\"}, {\"id\": \"PASSION24.HOUR.15.P002\", \"n\": 2, \"t\": \"Toi, mon Amour, à travers leur malice,\\nTu répares toutes les hypocrisies des gens d'Église.\\nJe veux réparer avec Toi.\\nTu Te préoccupes de leur bien.\\nEux, au contraire,\\n- commencent à T’accuser auprès du tribun,\\n- vomissant contre Toi tout le venin qu'ils portent dans leur cœur.\"}, {\"id\": \"PASSION24.HOUR.15.P003\", \"n\": 3, \"t\": \"Mais,\\n- pas satisfait des accusations qu'ils portent contre Toi et\\n- pour pouvoir mieux étayer son jugement,\\nPilate T’appelle à l'écart, et examine ta situation en privé.\"}, {\"id\": \"PASSION24.HOUR.15.P004\", \"n\": 4, \"t\": \"Il Te demande : « Es-Tu le roi des Juifs ? » Et Toi, mon vrai Roi Jésus, Tu réponds :\"}, {\"id\": \"PASSION24.HOUR.15.P005\", \"n\": 5, \"t\": \"« Mon Règne n'est pas de ce monde. Si mon Règne était de ce monde, mes ministres feraient tous leurs efforts pour que Je ne sois pas remis au pouvoir des Juifs. » Pilate est surpris et touché par la suavité et la dignité de tes Paroles, et il Te dit : « Comment, Tu es roi ? »\"}, {\"id\": \"PASSION24.HOUR.15.P006\", \"n\": 6, \"t\": \"Et Tu reprends : « Je le suis, et Je suis venu dans le monde pour enseigner la Vérité. »\"}, {\"id\": \"PASSION24.HOUR.15.P007\", \"n\": 7, \"t\": \"Pilate Te demande ce que c'est, la Vérité, mais il n'attend pas la réponse. Convaincu de ton innocence, il sort sur la terrasse et il dit : « Moi, je ne trouve aucune faute en cet homme. »\"}, {\"id\": \"PASSION24.HOUR.15.P008\", \"n\": 8, \"t\": \"Les Juifs, enragés, T’accusent de beaucoup d'autres choses.\\nToi, Tu Te tais et ne Te défends pas.\\nAinsi,\\n- Tu répares les faiblesses des juges quand ils font face aux personnes\\nviolentes,\\n- Tu pries pour les innocents opprimés et abandonnés.\"}, {\"id\": \"PASSION24.HOUR.15.P009\", \"n\": 9, \"t\": \"Voyant la fureur de tes ennemis et pour se tirer une épine du pied, Pilate T’envoie chez Hérode.\"}, {\"id\": \"PASSION24.HOUR.15.P010\", \"n\": 10, \"t\": \"Jésus est devant Hérode\"}, {\"id\": \"PASSION24.HOUR.15.P011\", \"n\": 11, \"t\": \"Mon Roi divin, je veux\\n- participer à tes Prières et tes Réparations, et\\n- T’accompagner jusque chez Hérode.\\nJe vois que, furieux, tes ennemis voudraient Te dévorer.\\nIls Te conduisent chez Hérode parmi les insultes et les moqueries.\"}, {\"id\": \"PASSION24.HOUR.15.P012\", \"n\": 12, \"t\": \"Hérode, content de Te voir, Te pose beaucoup de questions. Toi, Tu ne réponds rien. Tu ne le regardes même pas.\"}, {\"id\": \"PASSION24.HOUR.15.P013\", \"n\": 13, \"t\": \"Il est irrité\\n- parce que ses curiosités ne sont pas satisfaites, et\\n- en se sentant humilié par ton silence.\\nIl proclame devant tous que Tu es un fou.\\nIl ordonne que Tu sois traité comme un fou.\\nAinsi\\n- il Te fait revêtir d'un vêtement blanc et\\n- il Te met entre les mains des soldats, afin qu'ils Te bafouent le plus possible.\"}, {\"id\": \"PASSION24.HOUR.15.P014\", \"n\": 14, \"t\": \"Mon innocent Jésus, personne ne trouve de faute en Toi.\\nSeuls les Juifs en trouvent, parce que leur religiosité\\n- est affectée et\\n- empêche la Lumière de la Vérité de resplendir dans leur intelligence.\\nMon Jésus, Sagesse infinie,\\nquelles Souffrances d’être déclaré fou par Hérode !\"}, {\"id\": \"PASSION24.HOUR.15.P015\", \"n\": 15, \"t\": \"Les soldats T’abusent de Toi : ils\\n- Te jettent par terre, Te foulent aux pieds,\\n- Te souillent de crachats, Te bafouent,\\n- Te battent à coups de bâton.\"}, {\"id\": \"PASSION24.HOUR.15.P016\", \"n\": 16, \"t\": \"Les peines, les humiliations et les opprobres que Tu reçois sont tels et si nombreux, que les anges pleurent et se couvrent le visage de leurs ailes pour ne pas Te voir si brutalisé. Moi aussi, ô mon doux Jésus, je veux T’appeler fou, mais fou d'Amour.\"}, {\"id\": \"PASSION24.HOUR.15.P017\", \"n\": 17, \"t\": \"Elle est si grande ta folie d'Amour,\\nqu'au lieu de Te froisser de tout ce qu'on Te fait,\\nTu pries et répares\\n- pour les rois qui établissent leur règne en ruinant des peuples,\\n- pour les nombreux massacres qu'ils font,\\n- pour le sang qu'ils font couler par caprice,\\n- pour leurs péchés de curiosité,\\n- pour les fautes commises dans les cours et dans les armées.\\nMon Jésus, quel spectacle émouvant de Te voir prier et réparer\\navec mansuétude et fidélité au milieu de tant d'outrages !\\nTes Prières se répercutent dans mon cœur.\\nMaintenant, laisse-moi, Jésus,\\n- me tenir près de Toi,\\n- prendre part à tes Peines et\\n- Te consoler par mon amour.\"}, {\"id\": \"PASSION24.HOUR.15.P018\", \"n\": 18, \"t\": \"Pour éloigner de Toi tes ennemis et Te réconforter,\\nlaisse-moi Te prendre entre mes bras.\\nMon Jésus,\\nje donne un baiser à ton Front infiniment saint.\\n- Par toutes les Peines que Tu subis, purifie mes pensées.\\nJe donne un baiser à tes Yeux étincelants de Lumière. Que cette Lumière\\nm'entoure et pénètre mes pensées, regards, mes paroles et mon cœur.\"}, {\"id\": \"PASSION24.HOUR.15.P019\", \"n\": 19, \"t\": \"Je donne un baiser à tes Oreilles infiniment saintes. Sanctifie mes oreilles.\\nJe donne un baiser ton doux et saint Visage.\\nFais-moi m'éprendre de ta Beauté, moi et toutes les créatures,\\n- pour Te dédommager de toutes les insultes et les moqueries\\nque Tu reçois au palais d'Hérode.\"}, {\"id\": \"PASSION24.HOUR.15.P020\", \"n\": 20, \"t\": \"Je donne un baiser à ta sainte Bouche. Donne-moi la Grâce de ne jamais dire des paroles qui pourraient offenser ta divine Personne. Je veux réparer toutes les offenses que Te font les autres. J'étends tes Bras divins et je Te serre fort sur mon cœur. Je Te prie de bien vouloir imprimer ton Image dans mon intelligence, mon cœur, mes œuvres, dans tout.\"}, {\"id\": \"PASSION24.HOUR.15.P021\", \"n\": 21, \"t\": \"Je donne un baiser à ta Main droite. Distribue tes Grâces efficaces pour la conversion des pécheurs. Donne à tous les fruits salutaires de tes Actes infiniment saints. Je donne un baiser à ta Main gauche. Imprime en moi tes Vertus et surtout ta Charité.\"}, {\"id\": \"PASSION24.HOUR.15.P022\", \"n\": 22, \"t\": \"Je donne un baiser à ton Pied gauche. Donne-moi la connaissance de moi-même. Je donne un baiser à ton Pied droit. Donne-moi la Grâce d'obéir avec promptitude.\"}, {\"id\": \"PASSION24.HOUR.15.P023\", \"n\": 23, \"t\": \"Je donne un baiser à ton Cœur infiniment pur. Consume-moi dans les Flammes ardentes de ton Amour ! Mon doux Amour, je vois que ces sinistres individus ne Te donnent aucun répit et qu'Hérode Te renvoie à Pilate. Si ta première venue chez Pilate fut douloureuse, ta seconde l'est plus encore. Parce que je vois que les Juifs sont plus enragés qu'avant, et que c'est à tout prix qu'ils ont résolu de Te faire mourir.\"}, {\"id\": \"PASSION24.HOUR.15.P024\", \"n\": 24, \"t\": \"Par conséquent, avant que Tu ne sortes du palais d'Hérode, je veux Te serrer sur mon cœur pour Te témoigner mon amour.\"}, {\"id\": \"PASSION24.HOUR.15.P025\", \"n\": 25, \"t\": \"Et Toi, fortifie-moi par ton Baiser mystique et par ta Bénédiction. Je Te suivrai jusque devant Pilate.\"}], \"reflections\": [{\"id\": \"PASSION24.HOUR.15.REF.P001\", \"t\": \"Jésus est présenté à Pilate au milieu de tant d'insultes et de mépris. Il reste toujours doux. Il ne dédaigne personne et chez tous Il cherche à faire resplendir la Lumière de la Vérité.\"}, {\"id\": \"PASSION24.HOUR.15.REF.P002\", \"t\": \"Et nous, cherchons-nous à vaincre notre mauvaise humeur si quelqu'un ne nous témoigne pas d'amitié ?\"}, {\"id\": \"PASSION24.HOUR.15.REF.P003\", \"t\": \"Quand nous avons affaire aux créatures, cherchons-nous toujours\\n- à faire connaître Jésus et\\n- à faire resplendir pour elles la Lumière de sa Vérité ?\"}, {\"id\": \"PASSION24.HOUR.15.REF.P004\", \"t\": \"Ô Jésus, ma douce Vie, mets sur mes lèvres tes Paroles et fais que je parle toujours avec ta Langue. Devant Hérode, Jésus se tait quand on l'habille comme un fou. Il souffre des Peines inouïes.\"}, {\"id\": \"PASSION24.HOUR.15.REF.P005\", \"t\": \"Et nous, quand nous sommes calomniés, bafoués, insultés, raillés, pensons-nous que le Seigneur veut nous faire ressembler à Lui ?\"}, {\"id\": \"PASSION24.HOUR.15.REF.P006\", \"t\": \"Dans nos peines, ou lorsque les autres nous méprisent,\\n- ou en tout ce que notre pauvre cœur peut ressentir,\\npensons-nous que c'est Jésus qui, par sa Touche divine,\\n- nous donne ces souffrances et - nous transforme en Lui-même ?\\nEt quand la souffrance recommence pour nous,\\npensons-nous que Jésus, nous visitant de nouveau, - nous donne une autre\\nétreinte pour pouvoir nous faire ressembler tout à fait à Lui ?\\nÀ l'exemple de Jésus, avons-nous la maîtrise de nous-mêmes ?\\nAu lieu de répliquer lors des contrariétés, savons-nous nous taire ?\\nNous laissons-nous vaincre par la curiosité ?\\nMon Amour et mon Tout,\\nsois le seul à prendre la maîtrise de mon cœur, et tiens-le entre tes Mains,\\nafin que dans mes rencontres, je puisse reproduire en moi ta grande Patience.\"}], \"subsections\": []}, {\"hour_id\": \"PASSION24.HOUR.16\", \"hour_number\": 16, \"display_time\": \"8h à 9h\", \"title\": \"Barabbas est préféré à Jésus – La flagellation\", \"short_title\": \"Barabbas est préféré à Jésus – La flagellation\", \"source_pages\": [136, 137, 138, 139, 140, 141, 142], \"opening_prayer_ids\": [\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"], \"closing_prayer_ids\": [\"PASSION24.PRAYER.AFTER_EACH_HOUR\"], \"paragraphs\": [{\"id\": \"PASSION24.HOUR.16.P001\", \"n\": 1, \"t\": \"Mon Jésus tourmenté, mon pauvre cœur Te suit au milieu de tes anxiétés et de tes peines.\"}, {\"id\": \"PASSION24.HOUR.16.P002\", \"n\": 2, \"t\": \"Te voyant vêtu comme un fou et sachant que Tu es la Sagesse infinie qui\\ndonne le discernement à tous, mon cœur tombe en délire et dit :\\n« Comment ! Jésus fou ? Jésus malfaiteur ? »\\nMon Jésus, Sainteté sans pareille, Te voilà de nouveau devant Pilate.\\nEt lui, Il Te voit\\n- si mal en point,\\n- vêtu comme un fou.\\nIl constate que Tu n'as pas été condamné par Hérode.\"}, {\"id\": \"PASSION24.HOUR.16.P003\", \"n\": 3, \"t\": \"Alors il est encore plus indigné contre les Juifs. Il se convainc davantage de ton innocence et il ne veut pas Te condamner.\"}, {\"id\": \"PASSION24.HOUR.16.P004\", \"n\": 4, \"t\": \"Il veut toutefois donner quelque satisfaction aux Juifs\\n- pour apaiser leur haine et la soif ardente qu'ils ont de ton Sang.\\nIl Te présente aux côtés de Barabbas. Mais les Juifs crient :\\n« Nous ne voulons pas que Jésus soit libéré, mais Barabbas.\\nQue Jésus de Nazareth soit crucifié ! »\\nÔ comble de l'ingratitude humaine !\\nUn peuple auquel Tu as fait tant de bien,\\n- Te fait maintenant passer après un grand malfaiteur et\\n- Te condamne au supplice de la croix !\"}, {\"id\": \"PASSION24.HOUR.16.P005\", \"n\": 5, \"t\": \"Ne sachant que faire pour les calmer, Pilate Te condamne à la Flagellation ! Mon Jésus, mon cœur se brise en voyant qu'on a préféré une créature à ta divine Personne. Les Juifs cherchent à Te faire mourir dans l'ignominie. Entretemps Toi, Tu penses à donner la Vie à tous. Et il semble que Tu dises :\"}, {\"id\": \"PASSION24.HOUR.16.P006\", \"n\": 6, \"t\": \"« Père Saint, regarde ton Fils vêtu comme un fou. Il répare la folie de tant de créatures quand elles tombent dans le péché !\"}, {\"id\": \"PASSION24.HOUR.16.P007\", \"n\": 7, \"t\": \"Que ce vêtement blanc soit devant Toi pour la disculpation de beaucoup d'âmes qui revêtent le vêtement pitoyable de la faute.\"}, {\"id\": \"PASSION24.HOUR.16.P008\", \"n\": 8, \"t\": \"Vois, ô Père, la haine et la rage qu'ils ont contre Moi\\n- leur font perdre la raison et\\n- les rendent assoiffées de mon Sang.\\nJe veux\\n- réparer toutes les haines, les vengeances, les colères, les homicides, et\\n- obtenir par mes Prières,\\nla Lumière de la Raison et de la Foi pour tous.\\nRegarde-Moi encore, ô mon Père.\\nAurait-on pu Me faire une plus grande insulte ?\\nIls M’ont fait passer après un grand malfaiteur.\"}, {\"id\": \"PASSION24.HOUR.16.P009\", \"n\": 9, \"t\": \"Je veux ainsi réparer pour toutes les fois\\nqu'on Nous fait passer en second : après\\n- de vils intérêts,\"}, {\"id\": \"PASSION24.HOUR.16.P010\", \"n\": 10, \"t\": \"- la vanité,\\n- les plaisirs,\\n- les attachements,\\n- les honneurs mondains,\\n- les ripailles.\\nLes créatures Nous font passer après toutes sortes de niaiseries.\"}, {\"id\": \"PASSION24.HOUR.16.P011\", \"n\": 11, \"t\": \"Et Moi, Je suis prêt à accepter qu'on Me fasse passer après Barabbas pour réparer toutes ces fautes ! » Comme elles sont réelles et incessantes nos décisions de faire passer Dieu en second, même chez ceux qui aiment Jésus !\"}, {\"id\": \"PASSION24.HOUR.16.P012\", \"n\": 12, \"t\": \"Ah ! cherchons cet Amour Pur et Fort\\nqui fait passer tous et tout après Jésus, même notre vie.\\nÔ Jésus, je me sens remplie d'admiration à la vue\\n- de ton Amour si sublime au milieu de tant de peines,\\n- de ton Héroïsme au milieu de tant d'insultes.\"}, {\"id\": \"PASSION24.HOUR.16.P013\", \"n\": 13, \"t\": \"Tes Paroles et tes Réparations, comme autant de flèches,\\n- blessent mon cœur.\\nDans ma souffrance, je veux m'associer à tes Prières et à tes Réparations. Pas\\nmême un seul instant je ne veux me détacher de Toi.\\nSinon beaucoup de choses m'échapperaient de ce que Tu fais.\\nEt que vois-je ?\\nLes soldats Te conduisent tout près d'une colonne pour Te flageller.\"}, {\"id\": \"PASSION24.HOUR.16.P014\", \"n\": 14, \"t\": \"Mon Amour, je Te suis. Et Toi, de ton Regard d'Amour, regarde-moi et donne-moi la force d'assister à cet atroce supplice !\"}, {\"id\": \"PASSION24.HOUR.16.P015\", \"n\": 15, \"t\": \"La Flagellation de Jésus\"}, {\"id\": \"PASSION24.HOUR.16.P016\", \"n\": 16, \"t\": \"Mon Jésus infiniment pur,\\n- Tu es déjà tout près de la colonne et\\n- les soldats déchaînés Te délient pour T’attacher à cette colonne.\\nMais cela ne suffit pas. Ils Te dépouillent de tes vêtements\\npour que le Supplice de ton Corps infiniment saint soit plus cruel.\"}, {\"id\": \"PASSION24.HOUR.16.P017\", \"n\": 17, \"t\": \"Mon Amour et ma Vie,\"}, {\"id\": \"PASSION24.HOUR.16.P018\", \"n\": 18, \"t\": \"je me sens m'évanouir par la souffrance de Te voir presque nu. Tu trembles de la tête aux pieds Ton Visage infiniment saint rougit par pudeur. Ta confusion et ton épuisement sont tels que, ne Te tenant plus debout, Tu es sur le point de T’écrouler par terre.\"}, {\"id\": \"PASSION24.HOUR.16.P019\", \"n\": 19, \"t\": \"Mais, dans le but de mieux Te lier, et non pas pour T’aider,\\nles soldats ne Te laissent pas T’écrouler.\\nIls prennent les cordes et Te lient les Bras si fermement\\n- qu'ils se gonflent immédiatement et\\n- que, de la pointe de tes Doigts, le Sang coule !\"}, {\"id\": \"PASSION24.HOUR.16.P020\", \"n\": 20, \"t\": \"Puis ils T’attachent à la colonne et ils font courir les cordes jusqu'à tes Pieds.\\nIls Te lient, si fermement que Tu ne peux faire aucun mouvement.\\nEt ils font ainsi pour être plus libres de se déchaîner sur Toi !\\nMon Jésus, Toi qui habilles toutes les choses créées,\\n- le soleil de lumière, - le ciel d'étoiles,\\n- les plantes de feuilles, - les oiseaux de plumes,\\nte voilà dévêtu ! Quelle effronterie !\"}, {\"id\": \"PASSION24.HOUR.16.P021\", \"n\": 21, \"t\": \"Et, plein d'Amour, Tu me dis par la Lumière que transmettent tes Yeux :\"}, {\"id\": \"PASSION24.HOUR.16.P022\", \"n\": 22, \"t\": \"« Tais-toi, ô mon enfant.\\nIl était nécessaire que Je sois dépouillé\\nafin de réparer pour beaucoup qui se dépouillent\\n- de toute pudeur, candeur et innocence,\\n- du bien et de ma Grâce,\\net se revêtent de laideur, et vivent à la manière des brutes.\"}, {\"id\": \"PASSION24.HOUR.16.P023\", \"n\": 23, \"t\": \"Par la rougeur de ma Face, Je répare les malhonnêtetés, les mollesses et les plaisirs brutaux.\"}, {\"id\": \"PASSION24.HOUR.16.P024\", \"n\": 24, \"t\": \"Par conséquent, sois attentive à ce que Je fais, prie et répare avec Moi ! » Jésus torturé, ton Amour passe d'un excès à l'autre. Je vois que tes bourreaux prennent des fouets de corde et Te battent sans pitié, à tel point que ton Corps infiniment saint devient tout livide.\"}, {\"id\": \"PASSION24.HOUR.16.P025\", \"n\": 25, \"t\": \"Comme ils poursuivent dans leur fureur, ton Sang précieux coule sur le sol. Mais cela ne leur suffit pas. Deux autres bourreaux prennent la relève avec cette fois des chaînes de fer crochu.\"}, {\"id\": \"PASSION24.HOUR.16.P026\", \"n\": 26, \"t\": \"Aux premiers coups, tes Chairs, broyées et blessées,\\n- se déchirent davantage et\\n- tombent en lambeaux sur le sol, et tes Os se découvrent.\\nTon Sang coule à flots,\\ntellement qu'Il forme une flaque au pied de la colonne.\\nMon Jésus, mon Amour dépouillé,\\nTu subis cette tempête indescriptible de coups.\\nJ'embrasse tes Pieds divins afin de\\n- pouvoir prendre part à tes Souffrances et\\n- d'être couverte de ton Sang précieux !\\nÔ Jésus,\\nflagelle mon intelligence.\\nMets en fuite toutes les pensées qui pourraient m'éloigner de Toi.\\nFlagelle mes yeux.\\nS'ils se tournent pour regarder les choses de la terre, fais en sorte\\nqu'un coup de tes fouets les attire à n'admirer que Toi.\"}, {\"id\": \"PASSION24.HOUR.16.P027\", \"n\": 27, \"t\": \"Jésus, le bruit de tes fouets parvient à mes oreilles ! Mon Roi bafoué, quand Tu me verras écouter des choses qui me distraient de Toi, fais en sorte qu'un coup de tes fouets me fasse écouter seulement ta divine Voix.\"}, {\"id\": \"PASSION24.HOUR.16.P028\", \"n\": 28, \"t\": \"Jésus, flagelle mon visage et si un acte de complaisance naissait en moi, que les coups de tes fouets me détachent de la terre et me poussent à regarder seulement le Ciel.\"}, {\"id\": \"PASSION24.HOUR.16.P029\", \"n\": 29, \"t\": \"Jésus, flagelle ma langue et mes lèvres.\\nSi elles osaient prononcer des paroles\\n- qui ne soient pas d'Amour, qui ne disent pas ta Gloire,\\nfais en sorte que tes Fouets me jettent du Feu et des Flammes\\n- pour me faire brûler d'Amour.\"}, {\"id\": \"PASSION24.HOUR.16.P030\", \"n\": 30, \"t\": \"Jésus, flagelle mes mains afin que je ne fasse aucun mouvement et je n'accomplisse aucune œuvre qui ne soit marqués du sceau de ton Amour.\"}, {\"id\": \"PASSION24.HOUR.16.P031\", \"n\": 31, \"t\": \"Jésus, que tes fouets frappent mes pieds, que je Te prie de lier aux Tiens,\\nafin que je sois empêchée de faire des pas qui\\n- ne soient pas pour Toi et\\n- n'attirent pas les autres à T’aimer.\"}, {\"id\": \"PASSION24.HOUR.16.P032\", \"n\": 32, \"t\": \"Jésus, flagelle mon cœur avec ses tendances, ses affections et ses désirs, afin que chaque coup que je recevrai le blesse, et que ces coups fassent renaître en moi la Vie de l'Amour.\"}, {\"id\": \"PASSION24.HOUR.16.P033\", \"n\": 33, \"t\": \"Mon Jésus, j'entends tes Gémissements que n'entendent pas tes ennemis, car la tempête de leurs coups assourdit l'air environnant.\"}, {\"id\": \"PASSION24.HOUR.16.P034\", \"n\": 34, \"t\": \"Par ces gémissements, Tu dis :\"}, {\"id\": \"PASSION24.HOUR.16.P035\", \"n\": 35, \"t\": \"« Vous tous qui M’aimez,\\nvenez apprendre l'héroïsme de l'Amour.\\nvenez noyer dans mon Sang\\n- la soif de vos passions,\\n- la soif de tant d'ambitions,\\n- la soif de fumées, de plaisirs et de sensualités.\\nDans mon Sang, vous trouverez le Remède à tous vos maux.\\nRegarde-Moi, Père,\\ndans cette bourrasque de coups.\\nJe suis blessé sur tout mon Corps, mais cela ne suffit pas.\"}, {\"id\": \"PASSION24.HOUR.16.P036\", \"n\": 36, \"t\": \"Je veux beaucoup de Plaies sur mon Corps pour préparer\\ndes chambres dans le Ciel de mon Humanité\\npour toutes les âmes, afin\\n- qu'elles trouvent en Moi leur salut et\\n- qu'elles puissent ainsi passer au Ciel de ma Divinité.\"}, {\"id\": \"PASSION24.HOUR.16.P037\", \"n\": 37, \"t\": \"Mon Père, que chaque coup de ces fouets répare devant Toi, à tour de rôle, les diverses sortes de péchés.\"}, {\"id\": \"PASSION24.HOUR.16.P038\", \"n\": 38, \"t\": \"Et que ces coups de fouets excusent ceux qui commettent le péché, qu'ils flagellent leurs passions. Qu'ils leur parlent de mon Amour, tant et si bien qu'ils soient forcés de céder devant Moi. » Jésus, l'Amour avec lequel Tu souffres, est si grand, que Tu excites presque tes bourreaux à Te battre davantage !\"}, {\"id\": \"PASSION24.HOUR.16.P039\", \"n\": 39, \"t\": \"Mon Jésus décharné, ton Amour m'écrase, me rend folle. Alors que ton Amour n'est pas fatigué, tes bourreaux, eux, sont épuisés et cessent leur terrible massacre. Ils coupent tes cordes et, Presque mort, Tu tombes dans la mare de ton propre Sang. Tu vois sur le sol les lambeaux de ta Chair. Tu Te sens mourir de Douleur en y voyant les âmes réprouvées. Tu Te meurs dans ton Sang, ô Jésus ! Laisse-moi Te prendre dans mes bras pour Te restaurer au moins par mon amour. Je donne un baiser à toutes tes Plaies.\"}, {\"id\": \"PASSION24.HOUR.16.P040\", \"n\": 40, \"t\": \"Par ces baisers j'enferme toutes les âmes en Toi. Ainsi, aucune ne se perdra plus. Et Toi, Tu me bénis !\"}], \"reflections\": [{\"id\": \"PASSION24.HOUR.16.REF.P001\", \"t\": \"Pendant cette heure, Jésus\\n- est dépouillé de ses vêtements et\\n- est soumis à toutes sortes de coups.\\nEt nous, sommes-nous dépouillés de tout ?\"}, {\"id\": \"PASSION24.HOUR.16.REF.P002\", \"t\": \"Jésus est lié à la colonne. Et nous, nous laissons-nous lier à son Amour ?\"}, {\"id\": \"PASSION24.HOUR.16.REF.P003\", \"t\": \"Par son Regard tendre, Jésus nous appelle à Le délier. Ne voyons-nous pas en ce Regard qu'Il a aussi un reproche à nous faire : celui d'avoir contribué à Le lier ?\"}, {\"id\": \"PASSION24.HOUR.16.REF.P004\", \"t\": \"Pour Le soulager,\\n- nous devons d'abord nous départir de nos propres chaînes\\npour pouvoir ensuite enlever celles des autres.\\nNos chaînes, bien souvent,\\nne sont rien d'autre que de petits attachements\\n- à notre volonté, à notre amour-propre vexé,\\n- à nos petites vanités qui, s'entrelaçant,\\nlient douloureusement notre aimable Jésus.\"}, {\"id\": \"PASSION24.HOUR.16.REF.P005\", \"t\": \"Parfois, pris d'Amour pour notre pauvre âme,\\nJésus veut Lui-même nous enlever nos chaînes.\\nQuand nous nous lamentons parce que nous ne voulons pas être liés à Jésus,\\nnous Le contraignons, chagriné, à se retirer.\\nÀ travers ses Souffrances,\\nnotre Jésus martyrisé répare nos péchés contre la modestie.\\nEt nous, sommes-nous purs\\n- dans nos regards, - dans nos paroles et - dans nos affections,\\nde sorte que nous n'ajoutions pas d'autres coups sur son Corps innocent ?\"}, {\"id\": \"PASSION24.HOUR.16.REF.P006\", \"t\": \"Sommes-nous toujours attachés à Jésus de sorte que nous nous trouvions\\nprêts à Le défendre quand les créatures Le frappent par leurs offenses ?\\nMon Jésus enchaîné, que tes chaînes soient les miennes, de sorte\\n- que je Te sente toujours en moi, et que Tu me sentes toujours en Toi.\"}], \"subsections\": []}, {\"hour_id\": \"PASSION24.HOUR.17\", \"hour_number\": 17, \"display_time\": \"9h à 10h\", \"title\": \"Le couronnement d’épines – La condamnation à mort\", \"short_title\": \"Le couronnement d’épines – La condamnation à mort\", \"source_pages\": [143, 144, 145, 146, 147, 148, 149, 150, 151, 152, 153, 154], \"opening_prayer_ids\": [\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"], \"closing_prayer_ids\": [\"PASSION24.PRAYER.AFTER_EACH_HOUR\"], \"paragraphs\": [{\"id\": \"PASSION24.HOUR.17.P001\", \"n\": 1, \"t\": \"Jésus est condamné à mort Plus je Te regarde et plus je vois combien Tu souffres. Tu es tout lacéré. Il n'y a aucune partie saine en ton Corps.\"}, {\"id\": \"PASSION24.HOUR.17.P002\", \"n\": 2, \"t\": \"Les bourreaux sont furieux de voir que malgré tant de Souffrances, Tu les regardes toujours avec Amour. Ton Regard aimant forme un doux enchantement et recherche de nouvelles Souffrances.\"}, {\"id\": \"PASSION24.HOUR.17.P003\", \"n\": 3, \"t\": \"Tes bourreaux,\"}, {\"id\": \"PASSION24.HOUR.17.P004\", \"n\": 4, \"t\": \"- non seulement parce qu'ils sont cruels,\\n- mais aussi forcés à leur insu par ton Amour,\\nte mettent sur pied pour T’infliger de nouveaux Tourments.\"}, {\"id\": \"PASSION24.HOUR.17.P005\", \"n\": 5, \"t\": \"Mais Toi, à bout de forces, Tu tombes de nouveau dans ton Sang. Les bourreaux, irrités, à coups de pied et en Te poussant Te font parvenir au lieu où ils Te couronneront d'épines.\"}, {\"id\": \"PASSION24.HOUR.17.P006\
