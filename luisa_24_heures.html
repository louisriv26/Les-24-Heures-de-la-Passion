résonne l'écho\\n- d'horribles blasphèmes, de voix d'imprécations et\\n- de malédictions, de discours diaboliques,\\n- de manières de la meilleure façon de tuer et de faire un carnage.\\nAh ! toutes ces voix assourdissent la terre et pénètrent jusqu'aux cieux,\\nassourdissant l'Ouïe divine, qui,\\n- fatiguée de cet écho empoisonné qu’envoie la créature,\\nvoudrait s'en débarrasser, en la chassant d'elle-même\\nCar toutes ces voix empoisonnées\\n- jurent et demandent vengeance et justice contre elle.\\nOh ! comme la Justice divine se sent poussée à lancer des fléaux !\\nOh ! comme tant de blasphèmes hideux\\n- enflamment sa fureur contre la créature !\"}, {\"id\": \"PASSION24.HOUR.19.P098\", \"n\": 98, \"t\": \"Mais Toi, ô mon Jésus, qui nous aimes d'un Amour suprême,\\nTu affrontes ces voix mortelles.\\nAvec ta Voix toute-puissante et créatrice,\\n- dans laquelle Tu rassembles toutes ces voix,\"}, {\"id\": \"PASSION24.HOUR.19.P099\", \"n\": 99, \"t\": \"Tu fais entendre ta Voix la plus douce au Père\\n- pour Le consoler du harcèlement que Lui font subir les créatures,\\navec autant de voix de bénédictions et de louanges, et\\nTu cries : « Miséricorde, Grâces et Amour pour la pauvre créature ! »\"}, {\"id\": \"PASSION24.HOUR.19.P100\", \"n\": 100, \"t\": \"Et pour apaiser l’indignation du Père, Tu Lui montres ta Bouche très sainte, et Tu dis :\"}, {\"id\": \"PASSION24.HOUR.19.P101\", \"n\": 101, \"t\": \"« Mon Père, regarde-Moi, n'écoutes pas les voix des créatures, mais la Mienne. C'est Moi qui satisfais pour toutes.\"}, {\"id\": \"PASSION24.HOUR.19.P102\", \"n\": 102, \"t\": \"Je Te prie de regarder la créature en Moi. Si Tu la regardes hors de Moi, qu'en sera-t-il d'elle ? Elle est faible, ignorante, capable de faire seulement le mal. Elle est remplie de toutes les misères.\"}, {\"id\": \"PASSION24.HOUR.19.P103\", \"n\": 103, \"t\": \"Pitié, pitié pour la pauvre créature !\\nMoi Je réponds d'elle par ma Langue\\nrendue amère par le fiel, desséchée par la Soif, brûlée par l'Amour. »\\nMon Jésus plein d’amertume, ma voix, fondue dans la Tienne,\\n- veut faire face à toutes ces offenses.\"}, {\"id\": \"PASSION24.HOUR.19.P104\", \"n\": 104, \"t\": \"Permets-moi\\n- de prendre ta Langue, tes Lèvres, et\\n- de faire le tour de toutes les créatures.\"}, {\"id\": \"PASSION24.HOUR.19.P105\", \"n\": 105, \"t\": \"Permets-moi de toucher leur langue avec la Tienne, afin que,\\n- ressentant l'amertume de la Tienne dans l'acte de T'offenser,\\nsinon par amour, du moins pour l'amertume\\n- qu'ils ressentent, ils ne blasphèment plus.\"}, {\"id\": \"PASSION24.HOUR.19.P106\", \"n\": 106, \"t\": \"Permets-moi de toucher leurs lèvres avec les Tiennes, afin qu'\\n- en faisant sentir le feu de la culpabilité sur les lèvres de tous, et\\n- en faisant résonner ta Voix toute-puissante dans toutes les poitrines,\\nTu puisses\\n- arrêter le courant de toutes les voix mauvaises, et\\n- changer toutes les voix humaines en voix de bénédiction et de louange.\"}, {\"id\": \"PASSION24.HOUR.19.P107\", \"n\": 107, \"t\": \"Mon Jésus crucifié,\\ndevant ton grand Amour et ta grande Souffrance, la créature ne cède pas.\\nAu contraire, Te méprisant,\\n- elle commet faute après faute,\\n- elle fait des sacrilèges énormes, des homicides, des suicides, des duels, des\\nfraudes, des tromperies, des cruautés et des trahisons.\\nAh ! toutes ces œuvres mauvaises\\nappesantissent le Bras de ton Père céleste.\\nLe Père ne peut plus soutenir le poids de tant de fautes.\\nIl est sur le point de faire s'abattre la destruction sur la terre.\\nEt Toi, ô mon Jésus, pour soustraire la créature à la Fureur divine,\\n- Tu tends les bras vers le Père,\\n- Tu Le désarmes et\\n- Tu empêches que sa Justice ne suive son cours.\"}, {\"id\": \"PASSION24.HOUR.19.P108\", \"n\": 108, \"t\": \"Pour Le toucher de compassion envers la misérable humanité, Tu Lui dis de ta Voix la plus persuasive :\"}, {\"id\": \"PASSION24.HOUR.19.P109\", \"n\": 109, \"t\": \"« Mon Père, regarde ces Mains déchirées et ces clous qui les transpercent.\"}, {\"id\": \"PASSION24.HOUR.19.P110\", \"n\": 110, \"t\": \"Dans ces Mains, Je ressens les souffrances atroces que Me procurent toutes ces œuvres mauvaises. N'es-Tu pas content, ô Père, de mes Souffrances ?\"}, {\"id\": \"PASSION24.HOUR.19.P111\", \"n\": 111, \"t\": \"Suis-Je incapable de Te satisfaire ?\\nOui, mes Bras disloqués seront toujours des chaînes\\n- qui tiendront pressées sur Moi les pauvres créatures,\\nafin qu'elles ne M'échappent pas,\\n- à l'exception de celles qui Me quitteront par la force.\"}, {\"id\": \"PASSION24.HOUR.19.P112\", \"n\": 112, \"t\": \"Mes bras seront des chaînes amoureuses qui Te retiendront, Père, pour T’empêcher de détruire les pauvres créatures.\"}, {\"id\": \"PASSION24.HOUR.19.P113\", \"n\": 113, \"t\": \"Au contraire, Je T’attirerai de plus en plus près d'elles,\\npour que Tu déverses sur elles tes Grâces de Miséricorde ! »\\nMon Jésus, ton Amour est\\n- un doux enchantement pour moi et - me pousse à faire ce que Tu fais.\"}, {\"id\": \"PASSION24.HOUR.19.P114\", \"n\": 114, \"t\": \"Par conséquent, avec Toi je veux empêcher, au prix de n'importe quelle souffrance, que la Justice divine ne suive son cours contre la pauvre humanité.\"}, {\"id\": \"PASSION24.HOUR.19.P115\", \"n\": 115, \"t\": \"Par le sang qui coule de tes Mains, je veux calmer la fureur de cette Justice.\"}, {\"id\": \"PASSION24.HOUR.19.P116\", \"n\": 116, \"t\": \"Permets que je dépose dans tes Bras les souffrances et les déchirements\\n- de tous les hommes,\\n- de tous les cœurs affligés et opprimés.\"}, {\"id\": \"PASSION24.HOUR.19.P117\", \"n\": 117, \"t\": \"Et pour mouvoir le Père à la compassion envers la pauvre créature, permets-moi de déposer toutes les créatures dans tes Bras, afin que toutes reviennent à ton Cœur.\"}, {\"id\": \"PASSION24.HOUR.19.P118\", \"n\": 118, \"t\": \"Permets que, par la puissance de tes Mains créatrices,\\n- j'arrête le déroulement de tant d'œuvres mauvaises et que\\n- je détourne tous les gens de faire le mal.\\nMon aimable Jésus crucifié, la créature\\n- veut boire jusqu'au fond la lie de la faute et\\n- court comme une folle sur la voie du mal.\"}, {\"id\": \"PASSION24.HOUR.19.P119\", \"n\": 119, \"t\": \"Elle commet faute après faute, désobéit à tes Lois et se révolte contre Toi. Et comme pour Te faire une méchanceté supplémentaire, elle veut aller en enfer. Oh ! comme s'indigne la Majesté suprême ! Et Toi, ô mon Jésus, pour calmer le divin Père, Tu Lui fais voir ta sainte Humanité lacérée, disloquée, horriblement torturée. Tu Lui montres tes Pieds transpercés, tordus par l'atrocité des souffrances.\"}, {\"id\": \"PASSION24.HOUR.19.P120\", \"n\": 120, \"t\": \"J'entends ta Voix, plus touchante que jamais qui, par la force de ton Amour et de ta Souffrance, veut vaincre la créature et triompher du Cœur paternel :\"}, {\"id\": \"PASSION24.HOUR.19.P121\", \"n\": 121, \"t\": \"« Mon Père, regarde-Moi de la Tête aux Pieds : il n'y a aucune partie saine en Moi. Je n'ai plus d'endroit où Me faire ouvrir d'autres plaies et me procurer d'autres souffrances.\"}, {\"id\": \"PASSION24.HOUR.19.P122\", \"n\": 122, \"t\": \"Si Tu ne T’apaise pas à ce spectacle d'Amour, qu'est-ce qui ne pourrait jamais Te calmer ?\"}, {\"id\": \"PASSION24.HOUR.19.P123\", \"n\": 123, \"t\": \"Ô créatures, si vous ne cédez pas devant tant d'Amour, quel espoir Me reste-t-Il de vous amener à la conversion ?\"}, {\"id\": \"PASSION24.HOUR.19.P124\", \"n\": 124, \"t\": \"Mes Plaies et mon Sang seront toujours des chemins qui feront descendre du Ciel à la terre des grâces de repentir, de pardon et de compassion pour la pauvre humanité ! »\"}, {\"id\": \"PASSION24.HOUR.19.P125\", \"n\": 125, \"t\": \"Mon Jésus, je Te vois dans un état de violence\\n- pour apaiser le Père et vaincre la pauvre créature.\"}, {\"id\": \"PASSION24.HOUR.19.P126\", \"n\": 126, \"t\": \"Permets-moi\\n- de prendre tes Pieds très saints et de faire le tour de toutes les créatures,\\n- de lier leurs pas à tes Pieds.\"}, {\"id\": \"PASSION24.HOUR.19.P127\", \"n\": 127, \"t\": \"Ainsi, si elles veulent marcher dans la voie du mal,\\n- sentant les chaînes que Tu as mises entre Toi et elles,\\nelles ne peuvent pas le faire.\"}, {\"id\": \"PASSION24.HOUR.19.P128\", \"n\": 128, \"t\": \"Avec tes Pieds, fais-les dévier de la voie du mal, mets-les dans la voie du Bien,\\nrends-les plus dociles à tes Lois.\\nEt avec tes clous, ferme l'enfer, pour que plus personne n'y tombe dedans.\\nOh Jésus, mon Amour crucifié, je vois que Tu n'en peux plus.\\nLa tension horrible que Tu subis sur la Croix,\\n- le grincement continu de tes Os\\nqui se disloquent davantage à chaque petit mouvement,\\n- tes Chairs qui se déchirent de plus en plus,\\n- la Soif ardente qui Te consume,\\n- les Peines intérieures qui T'abreuvent,\\n- et avec tout cela, l'ingratitude humaine qui, comme une vague impétueuse,\\npénètre jusque dans ton Cœur transpercé,\\nT'opprime tellement que, ne résistant pas au poids de tant de martyrs,\\nton Humanité infiniment sainte est sur le point de s'éteindre.\\nDélirant d'Amour et de Souffrances, Elle demande aide et pitié !\\nJésus crucifié, est-il possible que Toi qui gouvernes tout et donnes Vie à tous,\\nTu demandes de l'aide ?\"}, {\"id\": \"PASSION24.HOUR.19.P129\", \"n\": 129, \"t\": \"Ah ! comme je voudrais\\n- pénétrer dans chaque goutte de ton Sang et\\n- verser le mien pour soulager chacune de tes Plaies,\\npour apaiser et rendre moins douloureuse la piqûre de chaque épine.\"}, {\"id\": \"PASSION24.HOUR.19.P130\", \"n\": 130, \"t\": \"Je voudrais pénétrer dans chaque Peine intérieure de ton Cœur\\n- pour soulager tes Amertumes.\\nJe voudrais Te donner vie pour Vie.\\nSi cela m'était possible, je voudrais Te déclouer de la Croix\\n- pour me mettre à ta place.\"}, {\"id\": \"PASSION24.HOUR.19.P131\", \"n\": 131, \"t\": \"Mais je vois que je ne suis rien et ne peux rien, étant trop insignifiante.\"}, {\"id\": \"PASSION24.HOUR.19.P132\", \"n\": 132, \"t\": \"Ô Jésus, donne-moi ton propre Être. Je prendrai vie en Toi, et je Te donnerai à Toi-même. Ainsi je contenterai mes désirs les plus ardents. Ô Jésus torturé, je vois que ton Humanité infiniment sainte est près de s'éteindre, non pour Toi-même, mais pour accomplir notre Rédemption.\"}, {\"id\": \"PASSION24.HOUR.19.P133\", \"n\": 133, \"t\": \"Tu as besoin d'Aide divine\\nTu Te jettes dans les Bras de ton Père, Lui demandant aide et secours.\\nOh ! comme le divin Père s'attendrit à regarder\\n- l'horrible souffrance de ton Humanité,\\n- la destruction terrible que la faute a fait sur tes Membres infiniment saints !\"}, {\"id\": \"PASSION24.HOUR.19.P134\", \"n\": 134, \"t\": \"Pour contenter tes ardents Désirs d'Amour,\\n- Il Te serre sur son Cœur paternel et\\n- Te donne les Secours nécessaires pour accomplir notre Rédemption.\"}, {\"id\": \"PASSION24.HOUR.19.P135\", \"n\": 135, \"t\": \"Et tandis qu'Il Te serre, Tu ressens dans ton Cœur se répéter plus fortement\\n- les coups sur les clous, les morsures des fouets,\\n- les déchirements de tes Plaies, les piqûres des épines.\"}, {\"id\": \"PASSION24.HOUR.19.P136\", \"n\": 136, \"t\": \"Oh ! comme le Père en est frappé ! Comme Il s'indigne de voir que toutes ces peines Te sont infligées jusque dans ton Cœur par des âmes qui Te sont consacrées ! Et dans sa Souffrance, Il dit :\"}, {\"id\": \"PASSION24.HOUR.19.P137\", \"n\": 137, \"t\": \"« Est-il possible, mon Fils, que pas même les âmes élues par Toi soient toutes avec Toi ? Au contraire, il semble que ces âmes viennent dans ton Cœur pour T'attrister et Te procurer une mort encore plus douloureuse. Et ce qui est pire, toutes ces souffrances qu'elles Te procurent sont couvertes d'hypocrisie.\"}, {\"id\": \"PASSION24.HOUR.19.P138\", \"n\": 138, \"t\": \"Ah ! Fils, Je ne peux plus contenir mon Indignation devant l'ingratitude de ces âmes qui M'affligent plus que toutes les autres créatures ensemble ! » Mais Toi, ô mon Jésus, triomphant de tout, Tu défends même ces âmes, Tu endigues par l'Amour immense de ton Cœur les vagues des amertumes et des blessures qu'elles Te procurent.\"}, {\"id\": \"PASSION24.HOUR.19.P139\", \"n\": 139, \"t\": \"Pour apaiser le Père, Tu Lui dis : « Mon Père, regarde mon Cœur : que toutes ces Souffrances Te satisfassent.\"}, {\"id\": \"PASSION24.HOUR.19.P140\", \"n\": 140, \"t\": \"Et que plus elles sont cruelles, plus elles soient puissantes sur ton Cœur de Père pour leur obtenir Grâces, Lumière et Pardon.\"}, {\"id\": \"PASSION24.HOUR.19.P141\", \"n\": 141, \"t\": \"Mon Père, ne les rejetez pas.\\nElles seront mes défenderesses qui continueront ma Vie sur la terre. »\\nPère très aimant, considérez que,\\n- mon Humanité a maintenant atteint le sommet de ses Souffrances, et\\n- mon Cœur se déchire aussi par l'Amertume, les Douleurs intimes et les\\nDouleurs inouïes que J'ai subies pendant trente-quatre ans,\\ncommençant à l’instant de mon Incarnation.\"}, {\"id\": \"PASSION24.HOUR.19.P142\", \"n\": 142, \"t\": \"Tu connais l'intensité de cette Amertume intérieure, qui M’aurait fait mourir à chaque instant par l’atrocité des spasmes, Si notre Toute-Puissance ne M'avait pas soutenu, pour prolonger mes Souffrances jusqu'à cette Agonie extrême.\"}, {\"id\": \"PASSION24.HOUR.19.P143\", \"n\": 143, \"t\": \"Ah ! jusqu'à présent,\\nJe T’ai offert toutes les Peines de ma très sainte Humanité\\n- pour apaiser Ta Justice qui pèse sur tous et\\n- pour attirer Ta Miséricorde triomphante sur tous.\"}, {\"id\": \"PASSION24.HOUR.19.P144\", \"n\": 144, \"t\": \"Maintenant Je Te montre mon Cœur brisé sous la pression de tous les moments de ma Vie mortelle, en particulier par les sacrilèges des âmes consacrées à Nous.\"}, {\"id\": \"PASSION24.HOUR.19.P145\", \"n\": 145, \"t\": \"Regarde mon Père : c'est le Cœur qui T’aimait d'un amour infini, qui a toujours brûlé d'Amour pour mes frères, tes enfants en Moi.\"}, {\"id\": \"PASSION24.HOUR.19.P146\", \"n\": 146, \"t\": \"C’est le Cœur généreux avec lequel J’ai tant souffert\\n- pour Te donner la complète satisfaction\\n- pour tous les péchés des hommes.\"}, {\"id\": \"PASSION24.HOUR.19.P147\", \"n\": 147, \"t\": \"Aie pitié de ses Désolations, de ses Peines constantes, de ses Angoisses, de sa Tristesse avant la mort !\"}, {\"id\": \"PASSION24.HOUR.19.P148\", \"n\": 148, \"t\": \"Ô mon Père, chaque battement de mon Cœur voulait Ta Gloire, au prix de tant de douleurs et de mon Sang, pour le salut de mes frères.\"}, {\"id\": \"PASSION24.HOUR.19.P149\", \"n\": 149, \"t\": \"Regarde mon Cœur opprimé, avec\\n- les Supplications ardentes, les Gémissements,\\n- les Soupirs, les Douleurs.\\nPendant trente-quatre ans,\\nJ'ai pleuré et demandé Ta Miséricorde pour tous.\"}, {\"id\": \"PASSION24.HOUR.19.P150\", \"n\": 150, \"t\": \"Mon Père, Tu M’as toujours écouté. Je Te remercie infiniment.\"}, {\"id\": \"PASSION24.HOUR.19.P151\", \"n\": 151, \"t\": \"Mais regarde mon Père : les Chagrins de mon Cœur ne peuvent pas se calmer si même une seule âme échappe à son Amour. Car Nous aimons une âme seule comme Nous aimons toutes les âmes ensemble. Dois-Je pousser le dernier soupir sur cet échafaud douloureux En voyant périr misérablement même des âmes consacrées à Nous ?\"}, {\"id\": \"PASSION24.HOUR.19.P152\", \"n\": 152, \"t\": \"Je meurs dans une Mer de Douleurs et de Peines pour l'iniquité et la perte éternelle du perfide Judas : Si dur et ingrat il a rejeté tous mes Actes affectueux et délicats. Il en a profité jusqu'à devenir prêtre, évêque, comme mes autres apôtres. Ah, mon Père, cet abîme de douleur suffit !\"}, {\"id\": \"PASSION24.HOUR.19.P153\", \"n\": 153, \"t\": \"Je vois tellement d'âmes, choisies par Nous pour le sacerdoce. Ils veulent imiter Judas, certaines plus, d'autres moins !\"}, {\"id\": \"PASSION24.HOUR.19.P154\", \"n\": 154, \"t\": \"Aide-Moi, mon Père, aide-Moi ! Je ne peux pas supporter toutes ces Douleurs. Vois : il n’y a aucune fibre dans mon Cœur qui ne soit pas tourmentée autant que tous les Tourments de mon divin Corps ensemble. Vois que tout le Sang que Je verse coule plus de mon Cœur que de mes autres Blessures. Il est sous pression de l'Amour et de la Douleur.\"}, {\"id\": \"PASSION24.HOUR.19.P155\", \"n\": 155, \"t\": \"Pitié, mon Père, pitié ! Pas pour Moi, pour tout ce que Je souffre pour les pauvres âmes. Mais par pitié de toutes les âmes, en particulier pour celles et ceux, hommes et femmes, consacrés à Nous.\"}, {\"id\": \"PASSION24.HOUR.19.P156\", \"n\": 156, \"t\": \"Mon Père, écoute, mon Cœur - arrivé à la fin de la vie - accélère ses Battements et ses Cris lancinants.\"}, {\"id\": \"PASSION24.HOUR.19.P157\", \"n\": 157, \"t\": \"En échange de toutes mes Souffrances, Je Te demande le repentir et la conversion de toutes ces âmes malheureuses. Qu’aucune d’elles ne Nous échappent !\"}, {\"id\": \"PASSION24.HOUR.19.P158\", \"n\": 158, \"t\": \"Mon Père, J'ai soif. J’ai soif de toutes les âmes, surtout de celles-ci. J'ai soif de souffrir davantage pour chacune de ces âmes. J'ai toujours fait votre Volonté, mon Père. Ceci est ma Volonté, qui est aussi la Tienne !\"}, {\"id\": \"PASSION24.HOUR.19.P159\", \"n\": 159, \"t\": \"Que tout cela soit fait parfaitement par Amour pour Moi, votre Fils bien-aimé, ‘en qui Tu as trouvé tes complaisances’. Ô mon Jésus, je ne peux plus résister. Je m'unis à tes Supplications, à tes Souffrances, à ton Amour pénitent. Donne-moi ton Cœur, afin que je puisse ressentir ta même Soif pour les âmes qui Te sont consacrées et, avec mes battements, Te rendre l'amour et les affections de tous.\"}, {\"id\": \"PASSION24.HOUR.19.P160\", \"n\": 160, \"t\": \"Permets-moi de les parcourir tous et d'y déposer ton Cœur.\\nQue les froids soient réchauffés à son contact,\\nque les tièdes soient secoués,\\nque les égarés soient rappelés, et\\nque les nombreuses grâces rejetées leur reviennent.\\nVotre Cœur est suffoqué de Tristesse et d'Amertume\\n- de voir tant de projets que Tu avais pour eux rendus vains par leur manque\\nde correspondance, et\\n- de voir que tant d'autres âmes, qui auraient dû avoir la Vie et le Salut par eux,\\nen subissent les tristes conséquences.\"}, {\"id\": \"PASSION24.HOUR.19.P161\", \"n\": 161, \"t\": \"Je leur montrerai ton Cœur si amer à cause d'eux, je lancerai sur eux des traits de Feu de ton Cœur, je leur présenterai toutes tes Supplications et toutes tes Afflictions : il n'est pas possible qu'ils ne Te cèdent pas.\"}, {\"id\": \"PASSION24.HOUR.19.P162\", \"n\": 162, \"t\": \"Ainsi ils reviendront repentants à tes Pieds,\\net tes desseins d'Amour sur eux seront rétablis\\nIls seront en Toi et autour de Toi,\\n- non plus pour T'offenser,\\n- mais pour Te réparer, Te consoler et Te défendre.\\nMa Vie, ô mon Jésus crucifié,\\nje vois que Tu continues d'agoniser sur la Croix.\\nCar, pour tout accomplir, ton Amour n'est pas encore satisfait.\"}, {\"id\": \"PASSION24.HOUR.19.P163\", \"n\": 163, \"t\": \"Moi aussi, je veux agoniser avec Toi. Et vous tous, anges et saints, venez sur le mont Calvaire pour contempler les excès et les folies de l'Amour d'un Dieu !\"}, {\"id\": \"PASSION24.HOUR.19.P164\", \"n\": 164, \"t\": \"Ensemble, baisons ses Plaies sanglantes, adorons-les. Soutenons ses Membres lacérés, et remercions-le de la Rédemption accomplie.\"}, {\"id\": \"PASSION24.HOUR.19.P165\", \"n\": 165, \"t\": \"Jetons un regard sur la Mère affligée, qui ressent autant de peines et de morts dans son Cœur Immaculé qu'elle en voit chez son Fils Dieu. Ses propres vêtements sont imprégnés de sang. Le mont Calvaire en est tout émaillé.\"}, {\"id\": \"PASSION24.HOUR.19.P166\", \"n\": 166, \"t\": \"Tous ensemble, prenons ce Sang,\\n- prions la Mère affligée de s'unir à nous,\\ndivisons entre nous le monde entier, et allons aider tous les gens.\"}, {\"id\": \"PASSION24.HOUR.19.P167\", \"n\": 167, \"t\": \"Aidons\\n- ceux en danger afin qu'ils ne périssent pas,\\n- ceux qui sont tombés afin qu'ils se relèvent,\\n- ceux qui sont sur le point de tomber afin qu'ils ne tombent pas.\"}, {\"id\": \"PASSION24.HOUR.19.P168\", \"n\": 168, \"t\": \"Donnons ce Sang à tous les aveugles, afin que resplendisse sur eux la Lumière de la Vérité. En particulier, allons parmi les combattants. Servons-leur de sentinelles vigilantes. S'ils sont sur le point d'être atteints par les balles de l'ennemi, recevons-les dans nos bras pour les réconforter. Et s'ils sont abandonnés de tous, s'ils sont désespérés par leur triste sort, donnons-leur ce Sang, pour qu'ils se résignent et que leur soit adoucie l'atrocité de leurs souffrances.\"}, {\"id\": \"PASSION24.HOUR.19.P169\", \"n\": 169, \"t\": \"Et si nous en voyons qui sont sur le point de tomber en enfer,\\n- donnons-leur ce Sang divin, qui contient les Grâces de la Rédemption,\\net arrachons-les à satan !\"}, {\"id\": \"PASSION24.HOUR.19.P170\", \"n\": 170, \"t\": \"Et tandis que je tiendrai Jésus serré sur mon cœur pour Le défendre et tout réparer, je serrerai tous ces gens sur ton Cœur, afin que tous obtiennent la grâce de la conversion, de la force et du salut. Ô Jésus, je vois que le Sang coule à ruisseaux de tes Mains et de tes Pieds.\"}, {\"id\": \"PASSION24.HOUR.19.P171\", \"n\": 171, \"t\": \"Les anges,\\n- pleurent, font cercle autour de Toi,\\n- admirent les Prodiges de ton Amour.\\nJe vois\\n- ta douce Maman au pied de la Croix, transpercée de douleur,\\n- ta chère Marie Madeleine,\\n- ton bien-aimé Jean,\\ntous pris par une extase de stupeur, d'amour et de douleur !\"}, {\"id\": \"PASSION24.HOUR.19.P172\", \"n\": 172, \"t\": \"Ô Jésus,\\n- je m'unis à Toi, je me serre sur ta Croix,\\n- je prends toutes les gouttes de ton Sang et je les verse dans mon cœur.\\nQuand je verrai ta Justice irritée contre les pécheurs, alors,\\npour T'apaiser, Je Te montrerai ce Sang.\\nQuand je voudrai la conversion d'âmes obstinées dans la faute,\\nje Te montrerai ce Sang.\\nÀ cause de lui, Tu ne rejetteras pas ma prière.\\nCar j'aurai le gage de ton propre Sang dans mes mains.\"}, {\"id\": \"PASSION24.HOUR.19.P173\", \"n\": 173, \"t\": \"Et maintenant, mon Bien crucifié,\\n- au nom de toutes les générations passées, présentes et futures,\\n- avec ta Maman et\\n- avec tous les anges,\\nje me prosterne devant Toi et je Te dis :\\n« Nous T'adorons, ô Christ et nous Te bénissons,\\ncar Tu as racheté le monde par ta sainte Croix ! » (…)\"}], \"reflections\": [{\"id\": \"PASSION24.HOUR.19.REF.P001\", \"t\": \"Jésus crucifié obéit aux bourreaux. Il accepte avec Amour toutes les insultes et les peines qu'ils Lui infligent. En raison du grand Amour que Jésus ressentait pour nos âmes, Il trouvait dans la Croix son lit de repos.\"}, {\"id\": \"PASSION24.HOUR.19.REF.P002\", \"t\": \"Et nous, dans toutes nos peines, nous reposons-nous en Lui ? Par notre patience et notre amour, pouvons-nous dire que nous préparons un lit dans notre cœur pour Jésus ? Tandis que Jésus est crucifié, il n'y a en Lui aucune partie tant interne qu'externe qui ne ressente une Peine spéciale. Et nous, nous gardons-nous crucifiés avec Lui, au moins par nos sens principaux ? Quand nous prenons plaisir à une conversation vaine ou à un autre divertissement semblable, alors Jésus reste cloué à la Croix.\"}, {\"id\": \"PASSION24.HOUR.19.REF.P003\", \"t\": \"Mais si ce même goût, nous le sacrifions par amour pour Lui, alors nous déclouons Jésus et nous nous clouons nous-mêmes. Gardons-nous toujours notre intelligence, notre cœur et tout notre être cloués par les clous de sa sainte Volonté ? Tandis qu'Il est crucifié, Jésus regarde avec Amour ses bourreaux. Et nous, par amour pour Lui, regardons-nous avec amour ceux qui nous blessent ?\"}, {\"id\": \"PASSION24.HOUR.19.REF.P004\", \"t\": \"Mon Jésus crucifié,\\n- que tes clous soient enfoncés dans mon cœur,\\n- afin qu'il n'y ait en moi aucun battement, aucune affection, aucun désir\\nqui ne ressente les piqûres de ces clous.\"}, {\"id\": \"PASSION24.HOUR.19.REF.P005\", \"t\": \"Que le sang que versera mon cœur soit un baume\\n- qui soulage toutes tes Plaies.\"}, {\"id\": \"PASSION24.HOUR.19.REF.P006\", \"t\": \"(1) Luisa a fait précéder cette Heure de la prière suivante : « Jésus, ma Mère, venez avec moi pour écrire. Prêtez-moi vos mains très saintes, afin que j'écrive ce qui Vous plaît et seulement ce que Vous voulez. » (2) Après avoir publié la première édition de ces Heures de la Passion de Notre-Seigneur Jésus-Christ, Luisa écrivit à saint Annibale Maria Di Francia (qui était le responsable de la rédaction), l'informant qu'elle se sentait poussée à ajouter quelque chose au milieu de ces Heures.\"}, {\"id\": \"PASSION24.HOUR.19.REF.P007\", \"t\": \"Et voici comment elle s'exprime dans une de ses lettres :\\n« À l'heure de la Crucifixion, presque à la fin...\\noù il est dit que, pendant que Jésus était sur la Croix, son âme était au Ciel\\navec son divin Père, je suis par la pensée au Ciel.\\nEt j'essaie avec Lui de désarmer la Justice divine en ces temps si difficiles.\\nJe passe environ une demi-heure dans cet exercice.\\nIl me semble que mon Seigneur Jésus me fait écrire cet exercice. (...) »\\nEt ici, elle s’explique :\\n« Cette Heure, Jésus sur la Croix, résume toute sa Vie,\\n- depuis le premier instant de sa Conception jusqu'à son dernier Soupir.\\nIl donne un accomplissement à tout.\\nIl remercie le divin Père\\n- pour tout le Bien qu'Il a fait à toutes les créatures et aussi\\n- pour ses propres Souffrances.\"}, {\"id\": \"PASSION24.HOUR.19.REF.P008\", \"t\": \"Il Le glorifie, L'implore, Le répare.\\nEn un mot, ce qu'Il a fait dans sa Vie, Il l’accomplit tout ensemble ici.\\nOr l'âme, se faisant l'écho de tout ce que fait Jésus, commence aussi,\\n- depuis le premier moment où Jésus a été conçu\\n- jusqu'au dernier moment de sa Vie,\\nà Le remercier pour ce qu'Il a fait.\"}, {\"id\": \"PASSION24.HOUR.19.REF.P009\", \"t\": \"L'ingratitude de la créature est généralement si grande,\\n- elle se montre plus que jamais ingrate en recevant des bienfaits,\\n- et elle ne remercie jamais le Seigneur,\\nl'âme cherche aussi à faire tout, complet.\"}, {\"id\": \"PASSION24.HOUR.19.REF.P010\", \"t\": \"C'est la raison pour laquelle toute la Vie de Jésus-Christ est reprise dans cette Heure, et que l'on tente de rassembler toutes sortes de réparations. Parmi tant d'âmes, n'y en aura-t-il pas quelques-unes qui voudront montrer cet héroïsme d'amour à Jésus ? »\"}, {\"id\": \"PASSION24.HOUR.19.REF.P011\", \"t\": \"(3) Dans une autre lettre, datée du 7 octobre 1915, Il poursuit : « Le but de cette Heure est de désarmer la Justice Divine. Si dans les autres Heures on répare, on bénit, on demande pardon, etc., avec celle-ci on désarme et on apaise\"}, {\"id\": \"PASSION24.HOUR.19.REF.P012\", \"t\": \"Et l'âme, s'élevant entre Ciel et terre, tout comme Jésus-Christ,\\n- regarde la Justice Divine et essaie de l'apaiser,\\n- regarde la créature et essaie de la ramener en son Sein,\\nmettant en action exactement ce que Jésus a fait.\"}, {\"id\": \"PASSION24.HOUR.19.REF.P013\", \"t\": \"Et cela donne tellement de satisfaction divine qu'Il l'attend presque avec anxiété, parce qu'Il se sent comme rafraîchi qu'une créature, venant de la terre, veut sauver ses propres frères.\"}, {\"id\": \"PASSION24.HOUR.19.REF.P014\", \"t\": \"Et, tandis que sa Justice s'enflamme,\\nIl cherche un refuge, un abri dans cette âme qui,\\n- veut faire sienne ses Souffrances.\\nEt cette âme même, L'invite et le force à ne pas détruire la pauvre humanité.\"}], \"subsections\": []}, {\"hour_id\": \"PASSION24.HOUR.20\", \"hour_number\": 20, \"display_time\": \"midi à 13h\", \"title\": \"Première Heure d’Agonie sur la Croix\", \"short_title\": \"Première Heure d’Agonie sur la Croix\", \"source_pages\": [195, 196, 197, 198, 199, 200, 201, 202, 203, 204], \"opening_prayer_ids\": [\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"], \"closing_prayer_ids\": [\"PASSION24.PRAYER.AFTER_EACH_HOUR\"], \"paragraphs\": [{\"id\": \"PASSION24.HOUR.20.P001\", \"n\": 1, \"t\": \"La première Parole :\\n« Père, pardonne-leur car ils ne savent pas ce qu’ils font ! »\\nMon Bien crucifié,\\nje Te vois sur la Croix comme sur ton Trône de Triomphe,\\nen train\\n- de conquérir toute chose et tous les cœurs, et\\n- de les attirer à Toi\\nde telle manière que tous ressentent ton Pouvoir surhumain.\"}, {\"id\": \"PASSION24.HOUR.20.P002\", \"n\": 2, \"t\": \"La nature, horrifiée par ton état,\\n- se prosterne devant Toi et, en silence,\\n- attend des Paroles de Toi,\\npour Te rendre honneur et faire reconnaître ta Domination.\"}, {\"id\": \"PASSION24.HOUR.20.P003\", \"n\": 3, \"t\": \"Le soleil, en pleurant, retire sa lumière, ne pouvant supporter de Te voir dans cet état. L'enfer ressent de la terreur et, silencieux, attend. Tout est silence.\"}, {\"id\": \"PASSION24.HOUR.20.P004\", \"n\": 4, \"t\": \"Ta Maman affligée et tes fidèles sont muets et pétrifiés à la douloureuse vue de ton Humanité déchirée et disloquée. Silencieux, ils attendent une Parole de Toi !\"}, {\"id\": \"PASSION24.HOUR.20.P005\", \"n\": 5, \"t\": \"Ton Humanité, qui gît dans un océan de Douleurs et dans les atroces\\nSouffrances de ton Agonie sur la Croix, est silencieuse.\\nOn craint que d'une Respiration à l'autre Tu ne meures !\\nEt quoi d'autre ?\\nLes Juifs perfides et tes bourreaux impitoyables qui, jusqu'à tout récemment,\\n- T'outrageaient, se moquaient de Toi,\\n- Te traitaient d'imposteur et de malfaiteur,\\nles larrons qui Te blasphémaient,\\ntous se taisent maintenant.\"}, {\"id\": \"PASSION24.HOUR.20.P006\", \"n\": 6, \"t\": \"Le remords les envahit.\\nS’il y a encore quelque insulte qu'ils essaient de Te faire,\\nelle meurt sur leurs lèvres.\\nMais pénétrant dans ton for intérieur, je vois que ton Amour\\n- déborde et\\n- Te tourmente plus encore que tes autres Souffrances.\\nTu ne peux le contenir.\"}, {\"id\": \"PASSION24.HOUR.20.P007\", \"n\": 7, \"t\": \"Contraint par cet Amour,\\n- Tu parles comme ce Dieu que Tu es,\\n- Tu lèves tes Yeux mourants vers le Ciel et\\n- Tu T'exclames d'une Voix forte et émouvante :\"}, {\"id\": \"PASSION24.HOUR.20.P008\", \"n\": 8, \"t\": \"« Père, pardonne-leur, car ils ne savent pas ce qu'ils font ! »\\nEt, de nouveau,\\n- Tu Te renfermes dans le silence,\\n- Tu es plongé dans des Souffrances inouïes.\\nJésus crucifié, tant d'Amour est-il possible ?\\nAh ! Après tant de Souffrances et d'insultes, ta première Parole\\nen est une de pardon.\"}, {\"id\": \"PASSION24.HOUR.20.P009\", \"n\": 9, \"t\": \"Tu nous excuses devant le Père de tant de péchés ! Cette Parole, Tu la fais descendre dans tout cœur après la faute.\"}, {\"id\": \"PASSION24.HOUR.20.P010\", \"n\": 10, \"t\": \"C'est Toi le premier à offrir le Pardon.\\nMais beaucoup rejettent ce Pardon.\\nAlors ton Amour devient fou.\\nCar, brûlant d'ardeur, il veut donner à tous le Pardon et le Baiser de Paix !\\nÀ cette Parole de pardon,\\n- l'enfer tremble et Te reconnaît pour Dieu,\\n- la nature et tous les hommes sont stupéfaits.\\nIls reconnaissent ta Divinité, ton Amour inextinguible.\"}, {\"id\": \"PASSION24.HOUR.20.P011\", \"n\": 11, \"t\": \"Silencieux, ils attendent pour voir jusqu'où cela ira.\"}, {\"id\": \"PASSION24.HOUR.20.P012\", \"n\": 12, \"t\": \"Ce n'est pas seulement ta Voix, mais aussi ton Sang et tes Plaies qui crient à chaque cœur après le péché : « Viens dans mes Bras que Je Te pardonne. Le sceau de mon Pardon est mon Sang. »\"}, {\"id\": \"PASSION24.HOUR.20.P013\", \"n\": 13, \"t\": \"Ô mon aimable Jésus,\\n- répète cette Parole à tous les pécheurs.\\n- Implore pour tous la Miséricorde divine.\\n- Applique à tous les mérites infinis de ton Sang infiniment précieux.\\n- Pour tous, continue àde calmer la Justice divine.\"}, {\"id\": \"PASSION24.HOUR.20.P014\", \"n\": 14, \"t\": \"Donne ta Grâce à celui qui, se trouvant dans la situation de devoir pardonner, se sent incapable de le faire. Mon Jésus crucifié, durant ces trois Heures d'Agonie si amères, Tu veux tout accomplir. Tu es silencieux sur cette Croix. Mais je vois que dans ton for intérieur, Tu veux satisfaire le Père en toutes choses.\"}, {\"id\": \"PASSION24.HOUR.20.P015\", \"n\": 15, \"t\": \"- Tu Le remercies à la place de tous.\\n- Tu satisfais à la place de tous.\\n- Pour tous, Tu demandes pardon et,\\n- Pour tous, Tu implores la Grâce qu'ils ne T’offensent plus jamais.\"}, {\"id\": \"PASSION24.HOUR.20.P016\", \"n\": 16, \"t\": \"Et pour obtenir tout cela du Père, Tu récapitules devant Lui toute ta Vie : du premier instant de ton Incarnation jusqu'à ton dernier Souffle.\"}, {\"id\": \"PASSION24.HOUR.20.P017\", \"n\": 17, \"t\": \"Mon Jésus, Amour infini, laisse-moi aussi récapituler toute ta Vie\\n- avec Toi,\\n- avec ton inconsolable Maman,\\n- avec saint Jean et\\n- avec les saintes femmes. Mon doux Jésus,\\nje Te remercie\"}, {\"id\": \"PASSION24.HOUR.20.P018\", \"n\": 18, \"t\": \"- des nombreuses épines qui ont transpercé ton adorable Tête,\\n- des gouttes de Sang versées à cause d'elles,\\n- des coups reçus sur elles,\\n- des Cheveux qu'on T'a arrachés.\"}, {\"id\": \"PASSION24.HOUR.20.P019\", \"n\": 19, \"t\": \"Je Te remercie\\n- pour tout le Bien que Tu as fait et\\n- tout le Bien que Tu nous as obtenu par tes Prières.\"}, {\"id\": \"PASSION24.HOUR.20.P020\", \"n\": 20, \"t\": \"Merci pour les Lumières et les bonnes Inspirations que Tu nous as données.\\nMerci pour toutes les fois que Tu as pardonné nos péchés\\nd'orgueil et d'amour-propre.\\nJe Te demande pardon au nom de tous, ô mon Jésus,\\n- pour toutes les fois que nous T'avons couronné d'épines,\\n- pour toutes les gouttes de Sang\\nque nous T'avons fait verser de ta Tête infiniment sainte,\\n- pour toutes les fois que nous n'avons pas répondu à tes Inspirations.\"}, {\"id\": \"PASSION24.HOUR.20.P021\", \"n\": 21, \"t\": \"En raison de toutes ces Douleurs souffertes par Toi, je Te prie, ô bon Jésus, de nous obtenir la Grâce de ne plus jamais commettre de péchés dans nos pensées.\"}, {\"id\": \"PASSION24.HOUR.20.P022\", \"n\": 22, \"t\": \"Je veux encore T'offrir tout ce que Tu as souffert dans ta Tête infiniment sainte\\n- pour Te donner toute cette gloire que les créatures T'auraient donnée\\n- si elles avaient fait bon usage de leur intelligence.\\n« Louez le Seigneur tous les peuples, fêtez-le tous les pays !\\nFort est son Amour pour nous, pour toujours sa Vérité. Gloire au Père, ... »\\n(Ps. 118)\\nJ'adore, ô mon Jésus, tes Yeux infiniment saints.\"}, {\"id\": \"PASSION24.HOUR.20.P023\", \"n\": 23, \"t\": \"Je Te remercie\\n- pour toutes les Larmes et tout le Sang qu'ils ont versés,\\n- pour les piqûres cruelles des épines,\\n- pour les insultes,\\n- pour les dérisions et\\n- pour les hontes supportées\\ndurant toute ta Passion.\"}, {\"id\": \"PASSION24.HOUR.20.P024\", \"n\": 24, \"t\": \"Je Te demande pardon pour tous ceux qui se servent de leur vue pour T'offenser et T'outrager. Je Te prie, en raison des Douleurs souffertes par tes Yeux infiniment sacrés, de nous donner la Grâce que plus personne ne T'offense par des regards\"}, {\"id\": \"PASSION24.HOUR.20.P025\", \"n\": 25, \"t\": \"mauvais. Je T'offre tout ce que Tu as souffert par tes Yeux infiniment saints - pour Te donner toute cette Gloire que les créatures T'auraient donnée, si leurs regards avaient été fixés seulement sur le Ciel, sur la Divinité et sur Toi, ô mon Jésus. J'adore tes Oreilles infiniment saintes.\"}, {\"id\": \"PASSION24.HOUR.20.P026\", \"n\": 26, \"t\": \"Je Te remercie de tout ce que Tu as souffert tandis que, sur le Calvaire,\\nles canailles T'accablaient les Oreilles par leurs cris et leurs moqueries.\\nJe Te demande pardon au nom de tous\\npour toutes les conversations mauvaises.\\nJe Te prie\\npour que les oreilles de tous les hommes s'ouvrent\\n- aux Vérités éternelles,\\n- aux appels de la Grâce,\\net pour que plus personne ne T'offense par le sens de l'ouïe.\"}, {\"id\": \"PASSION24.HOUR.20.P027\", \"n\": 27, \"t\": \"Je veux encore T'offrir tout ce que Tu as souffert dans ton Ouïe infiniment sainte, pour Te donner toute la Gloire que les créatures T'auraient donnée, si de cet organe elles avaient fait un saint usage. J'adore ton Visage infiniment saint. Mon Jésus, je lui donne un baiser.\"}, {\"id\": \"PASSION24.HOUR.20.P028\", \"n\": 28, \"t\": \"Je Te remercie pour tout ce que Tu as souffert à cause des crachats, des gifles et des moqueries, pour toutes les fois que Tu T'es laissé fouler aux pieds par tes ennemis.\"}, {\"id\": \"PASSION24.HOUR.20.P029\", \"n\": 29, \"t\": \"Je Te demande pardon au nom de tous pour toutes les fois que l'on a osé T'offenser.\"}, {\"id\": \"PASSION24.HOUR.20.P030\", \"n\": 30, \"t\": \"Je Te prie, en raison de ces gifles et de ces crachats, de faire en sorte\\nque tous reconnaissent, louent et glorifient ta Divinité.\\nÔ mon Jésus,\\nje veux aller partout dans le monde :\\nde l'orient à l'occident, du midi au septentrion,\\n- pour unir toutes les voix des créatures et\\n- les changer en autant d'actes de louange, d'amour et d'adoration\\nenvers ta divine Personne.\"}, {\"id\": \"PASSION24.HOUR.20.P031\", \"n\": 31, \"t\": \"Je veux encore, ô mon Jésus, T'apporter le cœur de toutes les créatures, afin que Tu remplisses chacun de ta Lumière, de ta Vérité et de ton Amour. Que chaque cœur soit rempli de compassion envers ta divine Personne.\"}, {\"id\": \"PASSION24.HOUR.20.P032\", \"n\": 32, \"t\": \"Tandis que Tu pardonneras à tous, je Te prie de faire en sorte que plus personne ne T'offense, même au prix de mon sang.\"}, {\"id\": \"PASSION24.HOUR.20.P033\", \"n\": 33, \"t\": \"Je veux enfin T'offrir tout ce que Tu as souffert dans ton Visage infiniment\\nsaint,\\n- pour Te donner toute la Gloire que les créatures T'auraient donnée\\nsi personne ne T'avait offensé.\\nJ'adore ta Bouche infiniment sainte.\"}, {\"id\": \"PASSION24.HOUR.20.P034\", \"n\": 34, \"t\": \"Je Te remercie\\n- pour tes premiers Vagissements,\\n- pour le lait que Tu as sucé,\\n- pour toutes les Paroles que Tu as dites,\\n- pour les Baisers embrasés que Tu as donnés à ta Très Sainte Mère,\\n- pour la nourriture que Tu as prise,\\n- pour l'amertume du fiel et la Soif ardente dont Tu as souffert sur la Croix,\\n- pour les Prières que Tu as élevées vers le Père.\"}, {\"id\": \"PASSION24.HOUR.20.P035\", \"n\": 35, \"t\": \"Je Te demande pardon\\n- pour toutes les médisances et les conversations mauvaises des créatures, et\\npour tous les blasphèmes qu'elles profèrent.\"}, {\"id\": \"PASSION24.HOUR.20.P036\", \"n\": 36, \"t\": \"Je veux offrir\\n- tes saintes Conversations en réparation de leurs conversations mauvaises,\\n- la mortification de ton Goût en réparation de leurs gourmandises et de toutes\\nles offenses qu'elles Te font par le mauvais usage de leur langue.\"}, {\"id\": \"PASSION24.HOUR.20.P037\", \"n\": 37, \"t\": \"Je veux T'offrir tout ce que Tu as souffert dans ta Bouche infiniment sainte,\\n- pour Te donner toute la Gloire que les créatures T'auraient donnée\\nsi aucune n'avait osé T'offenser par le sens du goût et par l'abus de la langue.\\nÔ Jésus,\\nje Te remercie pour tout au nom de tous, et\\nje T'adresse un hymne de remerciements éternels et infinis.\"}, {\"id\": \"PASSION24.HOUR.20.P038\", \"n\": 38, \"t\": \"Ô mon Jésus,\\nje veux T’offrir tout ce que Tu as souffert dans ta Personne infiniment sainte,\\n- pour Te donner toute la Gloire que T'auraient donnée toutes les créatures\\nsi elles avaient conformé leur vie à la Tienne.\\nJe Te remercie, ô Jésus,\\n- pour tout ce que Tu as souffert dans tes Épaules infiniment saintes,\\n- pour tous les coups que Tu as reçus,\\n- pour toutes les Plaies que Tu T'es laissé ouvrir sur ton Corps infiniment sacré\"}, {\"id\": \"PASSION24.HOUR.20.P039\", \"n\": 39, \"t\": \"- pour toutes les gouttes de Sang que Tu as versées.\"}, {\"id\": \"PASSION24.HOUR.20.P040\", \"n\": 40, \"t\": \"Je Te demande pardon au nom de tous pour toutes les fois que par amour du confort, nous T'avons offensé par des plaisirs illicites.\"}, {\"id\": \"PASSION24.HOUR.20.P041\", \"n\": 41, \"t\": \"Je T'offre ta douloureuse flagellation\\npour réparer tous les péchés commis avec nos sens,\\n- par amour pour les plaisirs sensibles,\\n- pour les satisfactions naturelles.\"}, {\"id\": \"PASSION24.HOUR.20.P042\", \"n\": 42, \"t\": \"Je T'offre tout ce que Tu as souffert dans tes Épaules\\npour Te donner toute la Gloire que les créatures t'auraient donnée\\nsi, en toutes choses, elles avaient cherché\\n- à Te plaire à Toi seul et\\n- à se réfugier à l'ombre de ta Protection divine.\\nMon Jésus, je donne un baiser à ton Pied gauche.\"}, {\"id\": \"PASSION24.HOUR.20.P043\", \"n\": 43, \"t\": \"Je Te remercie\\n- pour tous les Pas que Tu as faits durant ta Vie mortelle et\\n- pour toutes les fois que Tu T'es fatigué pour aller à la recherche d'âmes.\"}, {\"id\": \"PASSION24.HOUR.20.P044\", \"n\": 44, \"t\": \"Je T'offre, ô mon Jésus,\\n- toutes mes actions,\\n- tous mes pas et\\n- tous mes mouvements,\\ndans l'intention de Te faire réparation pour tout et pour tous.\"}, {\"id\": \"PASSION24.HOUR.20.P045\", \"n\": 45, \"t\": \"Je Te demande pardon pour ceux qui n'agissent pas dans une intention droite.\\nJ'unis mes actes à tous ceux que Tu as accomplis dans ton Humanité\\ninfiniment sainte\\n- pour qu'ils soient divinisés et\\n- pour Te donner toute la Gloire que T'auraient donnée les créatures\\nsi elles avaient agi saintement et avec des buts honnêtes.\\nJésus, je donne un baiser à ton Pied droit.\"}, {\"id\": \"PASSION24.HOUR.20.P046\", \"n\": 46, \"t\": \"Je Te remercie pour tout ce que Tu as souffert pour moi, surtout en ces Heures où Tu étais suspendu à la Croix. Je Te remercie pour la douleur atroce que Te causaient les clous dans tes Plaies qui se déchiraient de plus en plus à cause du poids de ton Corps.\"}, {\"id\": \"PASSION24.HOUR.20.P047\", \"n\": 47, \"t\": \"Je Te demande pardon pour toutes les rébellions et les désobéissances des créatures.\"}, {\"id\": \"PASSION24.HOUR.20.P048\", \"n\": 48, \"t\": \"Je T'offre les douleurs de tes Pieds infiniment saints\\n- en réparation de ces offenses,\\n- pour Te donner toute la Gloire que les créatures T'auraient donnée\\nsi en toutes choses elles T'avaient été soumises.\\nÔ mon Jésus, je donne un baiser à ta Main gauche infiniment sainte.\"}, {\"id\": \"PASSION24.HOUR.20.P049\", \"n\": 49, \"t\": \"Je Te remercie\\n- pour tout ce que Tu as souffert pour moi,\\n- pour toutes les fois que Tu as calmé la Justice divine en satisfaisant pour\\ntous !\\nJe donne un baiser à ta Main droite.\"}, {\"id\": \"PASSION24.HOUR.20.P050\", \"n\": 50, \"t\": \"Je Te remercie pour tout le Bien\\n- que Tu as fait et que Tu continues de faire pour tous,\\nen particulier pour les Œuvres\\n- de la Création, de la Rédemption et de la Sanctification.\"}, {\"id\": \"PASSION24.HOUR.20.P051\", \"n\": 51, \"t\": \"Je Te demande pardon au nom de tous,\\n- pour toutes les fois que nous avons manqué de reconnaissance\\npour tes Bienfaits.\\n- pour nos nombreuses œuvres faites sans une intention droite.\"}, {\"id\": \"PASSION24.HOUR.20.P052\", \"n\": 52, \"t\": \"En réparation de ces offenses, je veux T'offrir toute la Perfection et la Sainteté de tes Œuvres, pour Te donner toute cette Gloire que les créatures T'auraient donnée si elles avaient répondu à tous tes Bienfaits. Ô mon Jésus, je donne un baiser à ton Cœur infiniment sacré.\"}, {\"id\": \"PASSION24.HOUR.20.P053\", \"n\": 53, \"t\": \"Je Te remercie\\n- pour tout ce que Tu as souffert et désiré pour chaque créature, et\\n- pour le zèle dont Tu as brûlé par Amour pour elles.\"}, {\"id\": \"PASSION24.HOUR.20.P054\", \"n\": 54, \"t\": \"Je Te demande pardon\\n- pour nos nombreux désirs mauvais,\\n- pour nos affections et nos tendances mauvaises\"}, {\"id\": \"PASSION24.HOUR.20.P055\", \"n\": 55, \"t\": \"Jésus, pardon,\\n- pour les nombreuses âmes\\n- qui font passer l'amour des créatures avant ton Amour.\"}, {\"id\": \"PASSION24.HOUR.20.P056\", \"n\": 56, \"t\": \"Pour Te donner toute la Gloire qu'elles T'ont refusée, je T'offre tout ce qu'a fait et continue de faire ton Cœur infiniment adorable.\"}], \"reflections\": [{\"id\": \"PASSION24.HOUR.20.REF.P001\", \"t\": \"De midi à 13h, Jésus, élevé sur la Croix, reste suspendu sans toucher la terre.\"}, {\"id\": \"PASSION24.HOUR.20.REF.P002\", \"t\": \"Et nous, cherchons-nous à vivre détachés\\n- du monde, des créatures et de tout ce qui goûte la terre ?\"}, {\"id\": \"PASSION24.HOUR.20.REF.P003\", \"t\": \"Tout doit concourir à former la Croix sur laquelle nous devons\\n- nous étendre et rester suspendus comme Jésus,\\nloin de tout ce qui est terre, afin que les créatures ne s'attachent pas à nous.\\nJésus souffrant n'a pas\\n- d'autre lit que la Croix, d'autre soulagement que ses Plaies et les insultes.\\nEt, par amour pour Jésus,\\narrivons-nous à trouver le repos dans la souffrance ?\"}, {\"id\": \"PASSION24.HOUR.20.REF.P004\", \"t\": \"Tout les choses que nous faisons et vivons, renfermons-les dans les Plaies de Jésus, trempons-les dans son Sang. Et nous ne trouverons de réconfort que dans ses Souffrances.\"}, {\"id\": \"PASSION24.HOUR.20.REF.P005\", \"t\": \"Si bien que\\n- ses Plaies seront les nôtres,\\n- son Sang agira continuellement en nous pour nous laver et nous embellir.\"}, {\"id\": \"PASSION24.HOUR.20.REF.P006\", \"t\": \"Ainsi nous obtiendrons n'importe quelle Grâce pour nous et pour le salut des âmes.\"}, {\"id\": \"PASSION24.HOUR.20.REF.P007\", \"t\": \"Ayant le Sang de Jésus dans notre cœur,\"}, {\"id\": \"PASSION24.HOUR.20.REF.P008\", \"t\": \"si nous commettons une faute, nous prierons Jésus\\n- de ne pas nous garder souillés en sa Présence,\\nde nous laver de son Sang et de nous garder avec Lui.\"}, {\"id\": \"PASSION24.HOUR.20.REF.P009\", \"t\": \"Si nous nous sentons faibles, nous prierons Jésus\\nde donner une portion de son Sang à notre âme,\\n- afin que son Sang nous donne force et courage.\\nLe doux Jésus prie pour ses bourreaux et même, Il les excuse.\"}, {\"id\": \"PASSION24.HOUR.20.REF.P010\", \"t\": \"Et nous, faisons-nous nôtre la Prière de Jésus\\n- pour excuser continuellement les pécheurs devant le Père et\"}, {\"id\": \"PASSION24.HOUR.20.REF.P011\", \"t\": \"- pour obtenir pour eux, par nos prières, sa Miséricorde,\\nmême pour ceux qui nous auraient personnellement offensés ?\\nTandis que nous prions, agissons et cheminons, n'oublions pas les pauvres\\nâmes qui sont sur le point de rendre le dernier soupir.\"}, {\"id\": \"PASSION24.HOUR.20.REF.P012\", \"t\": \"Portons-leur en guise d'aide et de réconfort les Prières et les Baisers de Jésus, pour qu'Il les purifie et leur fasse prendre leur envol vers le Ciel. Mon Jésus, c'est dans tes Plaies et dans ton Sang que je veux puiser la force de pouvoir reproduire en moi ta propre Vie.\"}, {\"id\": \"PASSION24.HOUR.20.REF.P013\", \"t\": \"Et ainsi je pourrai obtenir pour tous, par mes prières, le bien que Tu as fait.\"}], \"subsections\": []}, {\"hour_id\": \"PASSION24.HOUR.21\", \"hour_number\": 21, \"display_time\": \"13h à 14h\", \"title\": \"Deuxième Heure d’Agonie sur la Croix\", \"short_title\": \"Deuxième Heure d’Agonie sur la Croix\", \"source_pages\": [205, 206, 207, 208, 209, 210, 211, 212, 213, 214, 215, 216], \"opening_prayer_ids\": [\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"], \"closing_prayer_ids\": [\"PASSION24.PRAYER.AFTER_EACH_HOUR\"], \"paragraphs\": [{\"id\": \"PASSION24.HOUR.21.P001\", \"n\": 1, \"t\": \"Deuxième Parole : « Aujourd'hui, tu seras avec Moi au Paradis. »\"}, {\"id\": \"PASSION24.HOUR.21.P002\", \"n\": 2, \"t\": \"Mon Amour crucifié,\\nTandis que je prie avec Toi,\\nla force\\n- de ton Amour séduisant et\\n- de tes Souffrances\\nmaintient mon regard fixé sur Toi.\\nMais mon cœur se brise de Te voir tant souffrir.\"}, {\"id\": \"PASSION24.HOUR.21.P003\", \"n\": 3, \"t\": \"Tu es torturé par l'Amour et la Douleur. Les flammes qui Te brûlent le Cœur sont si intenses\"}, {\"id\": \"PASSION24.HOUR.21.P004\", \"n\": 4, \"t\": \"Elles sont en train de Te réduire en cendres.\"}, {\"id\": \"PASSION24.HOUR.21.P005\", \"n\": 5, \"t\": \"Ton Amour est plus fort que la mort même\\nDonnant libre cours à cet Amour, Tu regardes le larron à ta droite et\\nTu le dérobes à l'enfer :\\n- Tu lui touches le cœur par ta Grâce et il devient tout transformé.\\n- Il reconnaît que Tu es Dieu et, tout contrit, il Te dit :\\n« Seigneur, souviens-Toi de moi quand Tu seras dans ton Royaume. »\"}, {\"id\": \"PASSION24.HOUR.21.P006\", \"n\": 6, \"t\": \"Toi, Tu lui réponds sans hésiter :\"}, {\"id\": \"PASSION24.HOUR.21.P007\", \"n\": 7, \"t\": \"« Aujourd'hui même, tu seras avec Moi dans le Paradis ! »\"}, {\"id\": \"PASSION24.HOUR.21.P008\", \"n\": 8, \"t\": \"Tu en fais ainsi le premier triomphe de ton Amour.\\nJe vois que\\n- Tu ne dérobes pas seulement le cœur du larron, mais\\n- Tu fais de même pour de nombreux mourants.\"}, {\"id\": \"PASSION24.HOUR.21.P009\", \"n\": 9, \"t\": \"Tu mets à leur disposition\\n- ton Sang,\\n- ton Amour,\\n- tes Mérites\"}, {\"id\": \"PASSION24.HOUR.21.P010\", \"n\": 10, \"t\": \"Tu Te sers de tous tes Stratagèmes et Astuces divins\\n- pour toucher leur cœur et\\n- pour les dérober à l'enfer.\"}, {\"id\": \"PASSION24.HOUR.21.P011\", \"n\": 11, \"t\": \"Mais ici aussi, ton Amour est contrarié ! Combien de refus tranchants ! Combien de fois on ne Te fait pas confiance ! Combien cèdent au désespoir ! Mon Jésus je veux réparer pour tous ceux qui désespèrent de ta divine Miséricorde au moment de leur mort.\"}, {\"id\": \"PASSION24.HOUR.21.P012\", \"n\": 12, \"t\": \"Mon doux Amour, inspire\\n- à tous, la confiance en Toi,\\n- en particulier à ceux qui se trouvent dans les étreintes de l'agonie.\"}, {\"id\": \"PASSION24.HOUR.21.P013\", \"n\": 13, \"t\": \"Et par cette Parole que Tu as dite au larron, accorde-leur\\n- la Lumière, la Force et l'Aide\\npour qu'ils puissent mourir saintement et s'envoler vers le Ciel.\"}, {\"id\": \"PASSION24.HOUR.21.P014\", \"n\": 14, \"t\": \"Jésus, place toutes les âmes,\\n- dans ton Corps infiniment saint,\\n- dans ton Sang,\\n- dans tes Plaies,\"}, {\"id\": \"PASSION24.HOUR.21.P015\", \"n\": 15, \"t\": \"Par les mérites de ton Sang précieux, ne permets pas que même une seule âme soit perdue ! Que ta Voix accompagnée de ton Sang répète à toutes :\"}, {\"id\": \"PASSION24.HOUR.21.P016\", \"n\": 16, \"t\": \"« Aujourd'hui, tu seras avec Moi au Paradis ! »\"}, {\"id\": \"PASSION24.HOUR.21.P017\", \"n\": 17, \"t\": \"Troisième Parole : Jésus dit à sa Maman : « Femme, voici ton fils ! » et à Jean : « Voici ta Mère ! » Mon Jésus martyrisé, tes Souffrances augmentent de plus en plus. Ah ! sur cette Croix, Tu es le vrai Roi des Douleurs. Au milieu de tant de souffrances, aucune âme ne T'échappe : Tu donnes à chacune ta propre Vie.\"}, {\"id\": \"PASSION24.HOUR.21.P018\", \"n\": 18, \"t\": \"Mais ton Amour se voit contrarié et méprisé par les créatures. On ne s'en soucie pas. Comme Il ne peut s'épancher, Il devient plus intense. Il Te procure des tortures indicibles. Dans ces tortures, il recherche ce qu'il pourrait donner d'autre à l'homme pour le vaincre.\"}, {\"id\": \"PASSION24.HOUR.21.P019\", \"n\": 19, \"t\": \"Il Te fait dire :\\n« Tu vois, ô âme, combien Je t'ai aimée. Si tu ne veux pas avoir pitié de\\nToi-même, aie au moins pitié de mon Amour ! »\\nLeur ayant tout donné, Tu n'as plus rien à donner aux créatures.\\nTu tournes ton Regard suppliant vers ta Maman.\\nElle comme Toi, se sent crucifiée à cause\\n- de tes Souffrances et\\n- de l'Amour qui la torture.\"}, {\"id\": \"PASSION24.HOUR.21.P020\", \"n\": 20, \"t\": \"Mère et Fils, Vous vous entendez. Alors Tu respires de satisfaction et de réconfort en sachant que Tu peux donner ta Maman aux créatures.\"}, {\"id\": \"PASSION24.HOUR.21.P021\", \"n\": 21, \"t\": \"En associant Jean à tout le genre humain, Tu dis à Marie d'une Voix remplie de tendresse : « Femme, voici ton Fils ! » et Tu dis à Jean : « Voici ta Mère ! »\"}, {\"id\": \"PASSION24.HOUR.21.P022\", \"n\": 22, \"t\": \"Et, dans un doux Cœur à Cœur, Tu poursuis :\"}, {\"id\": \"PASSION24.HOUR.21.P023\", \"n\": 23, \"t\": \"« Ma Mère, Je Te confie tous mes enfants.\\nTout l'Amour que tu ressens pour Moi, ressens-le pour eux !\\nQue tous tes égards et toutes tes tendresses maternelles\\nsoient pour mes enfants. Toi, tu Me les sauveras tous ! »\\nEt ta sainte Maman accepte.\\nJe veux ici, ô mon Jésus, réparer\\n- les offenses qui sont faites à ta Très Sainte Mère,\\n- les blasphèmes et les ingratitudes\\nde tant de gens qui ne veulent pas reconnaître le grand Bienfait\\nque Tu as accordé à tous, en nous donnant Marie comme Mère.\\nComment pouvons-nous Te remercier d'un si grand Bienfait ?\\nNous le ferons, ô Jésus, en T'offrant\\n- ton Sang,\\n- tes Plaies,\\n- l'Amour infini de ton Cœur !\"}, {\"id\": \"PASSION24.HOUR.21.P024\", \"n\": 24, \"t\": \"Ô Très Sainte Vierge, quel n'est pas ton choc en entendant la Voix du bon Jésus qui Te donne à chacun de nous comme Mère ! Nous voulons te remercier, ô Vierge bénie. Pour te remercier comme tu le mérites, nous t'offrons les Remerciements mêmes de ton Jésus.\"}, {\"id\": \"PASSION24.HOUR.21.P025\", \"n\": 25, \"t\": \"Ô douce Maman,\\n- sois notre Mère,\\n- prends soin de nous et\\n- ne permets jamais que nous t'offensions le moindrement.\"}, {\"id\": \"PASSION24.HOUR.21.P026\", \"n\": 26, \"t\": \"Tiens-nous toujours serrés sur Jésus. De tes Mains, lie-nous à Lui, de sorte que nous ne puissions plus jamais nous séparer de Lui.\"}, {\"id\": \"PASSION24.HOUR.21.P027\", \"n\": 27, \"t\": \"Pour tous, je veux réparer les offenses\\nqui sont faites à ton Jésus et à toi, ma douce Maman !\\nÔ mon Jésus,\\n- Tu es plongé dans tant de Souffrances,\\n- et Tu plaides encore plus la cause du Salut des âmes.\"}, {\"id\": \"PASSION24.HOUR.21.P028\", \"n\": 28, \"t\": \"Moi, je ne serai pas indifférente à cela. Comme une colombe,\"}, {\"id\": \"PASSION24.HOUR.21.P029\", \"n\": 29, \"t\": \"- je volerai sur tes Plaies. Je les baiserai, les soulagerai.\\n- Je me plongerai dans ton Sang pour pouvoir m'écrier avec Toi :\\n« Âmes, âmes ! »\\nJésus, je veux soutenir ta Tête transpercée et endolorie\\n- pour réparer et\\n- pour implorer ta Miséricorde, ton Amour et ton Pardon pour tous.\"}, {\"id\": \"PASSION24.HOUR.21.P030\", \"n\": 30, \"t\": \"Règne dans mon intelligence, ô mon Jésus.\\nGuéris-la en vertu des épines qui Te percent la Tête.\\nNe permets à aucune défaillance d'entrer dans mon intelligence.\\nFront majestueux de mon Bien, je Te donne un baiser\\nAttire toutes mes pensées\\n- à Te contempler et\\n- à Te comprendre.\\nYeux infiniment doux de mon Jésus, bien que couverts de Sang,\\n- regardez-moi,\\n- regardez ma misère,\\n- regardez ma faiblesse,\\n- regardez mon pauvre cœur.\\nFaites en sorte que je puisse éprouver les effets admirables du Regard divin.\\nOreilles de mon Jésus,\\n- bien qu'accablées par les insultes et les blasphèmes,\\n- vous demeurez tout de même attentives à nous écouter.\\nEntendez mes prières.\\nNe dédaignez pas mes réparations.\\nOui, ô Jésus, écoute les supplications de mon cœur.\\nIl se calmera quand Tu l'auras rempli de ton Amour.\\nVisage infiniment beau de mon Jésus, montre-toi à moi, afin que\\n- de tous et de tout je détache mon pauvre cœur :\\n- ta beauté me fasse m'éprendre uniquement de Toi et\\nme tienne toujours ravie en Toi.\\nBouche infiniment suave de mon Jésus, parle-moi.\\nQue résonne toujours ta Voix en mes oreilles.\\nQue la puissance de ta Parole détruise en moi\\n- tout ce qui n'est pas Volonté de Dieu,\\n- tout ce qui n'est pas Amour.\\nJésus,\\nJe tends mes bras vers ton Cou pour T'embrasser.\"}, {\"id\": \"PASSION24.HOUR.21.P031\", \"n\": 31, \"t\": \"Toi-même, tends les Tiens vers moi pour m'embrasser. De grâce, ô mon Bien, fais en sorte que cet embrassement d'Amour soit si étroit qu'aucune force humaine ne puisse nous dégager l'un de l'autre. Ainsi, j'appuierai mon visage sur ton Cœur.\"}, {\"id\": \"PASSION24.HOUR.21.P032\", \"n\": 32, \"t\": \"Avec confiance, je Te donnerai un baiser sur tes Lèvres\\nEt Toi Tu me donneras ton Baiser d'Amour.\\nAinsi Tu me feras respirer\\n- ton Haleine infiniment douce,\\n- ton Amour,\\n- ton Vouloir,\\n- tes Souffrances et\\n- toute ta Vie divine.\\nÉpaules infiniment saintes de mon Jésus,\\ntoujours fortes et constantes dans la Souffrance par Amour pour moi,\\ndonnez-moi\\n- la force intérieure,\\n- la constance et l'héroïsme dans la souffrance par amour pour vous.\"}, {\"id\": \"PASSION24.HOUR.21.P033\", \"n\": 33, \"t\": \"Jésus, de grâce,\\n- ne permets pas que je sois inconstante dans l'amour\\n- partage avec moi ton Immutabilité.\\nPoitrine enflammée de mon Jésus, donne-moi tes Flames.\\nTu ne peux contenir ces Flammes\\nMon cœur les cherche avec anxiété par l'entremise\\n- de ton Sang et de tes Plaies.\"}, {\"id\": \"PASSION24.HOUR.21.P034\", \"n\": 34, \"t\": \"Jésus,\\nce sont les Flammes de ton Amour, qui Te tourmentent le plus.\\nÔ mon Bien, partage-les avec moi.\\nCela ne Te touche-t-il pas de compassion de voir une âme aussi pauvre de ton\\nAmour ?\\nMains infiniment saintes de mon Jésus,\\n- vous qui avez créé le Ciel et la terre,\\n- vous voilà réduites à l'immobilité !\"}, {\"id\": \"PASSION24.HOUR.21.P035\", \"n\": 35, \"t\": \"Ô mon Jésus,\\n- continue ta création : ta création d'Amour.\\n- Crée en tout mon être une vie nouvelle, la Vie divine.\\n- Prononce tes Paroles créatrices sur mon pauvre cœur et rends-le totalement\\ncomme le Tien.\"}, {\"id\": \"PASSION24.HOUR.21.P036\", \"n\": 36, \"t\": \"Pieds saints de mon Jésus,\\nne me laissez jamais seule, mais faites en sorte\\n- que je coure toujours avec vous et\\n- que je ne fasse pas un seul pas loin de vous.\"}, {\"id\": \"PASSION24.HOUR.21.P037\", \"n\": 37, \"t\": \"Jésus,\\npar mon amour pour Toi et par mes réparations,\\nje veux Te soulager des Peines dont Tu souffres dans tes Pieds infiniment\\nsaints.\\nÔ mon Jésus crucifié, j'adore ton Sang infiniment précieux.\\nJe baise tes saintes Plaies une à une, voulant leur prodiguer\\n- tout mon amour, toutes mes adorations\\n- et toutes mes réparations les plus ardentes.\"}, {\"id\": \"PASSION24.HOUR.21.P038\", \"n\": 38, \"t\": \"Que ton Sang soit pour toutes les âmes dans les ténèbres,\\n- réconfort dans la souffrance, force dans la faiblesse,\\n- pardon dans la faute, aide dans les tentations,\\n- protection dans les dangers, soutien dans la mort.\\nEt qu'il soit les ailes qui transporteront les âmes de cette terre vers le Ciel.\\nJésus,\\nje viens à Toi !\\nDans ton Cœur je veux faire mon nid et ma demeure.\\nDe l'intérieur de ton Cœur, ô mon doux Amour,\\nj'appellerai tous les gens à Toi.\\nEt si quelqu'un veut s'approcher pour T'offenser,\\n- j'exposerai ma poitrine et\\n- je ne permettrai pas qu'on Te blesse.\\nAu contraire,\\n- j'enfermerai cette personne dans ton Cœur,\\n- je lui parlerai de ton Amour et\\n- je changerai ses offenses en Amour.\"}, {\"id\": \"PASSION24.HOUR.21.P039\", \"n\": 39, \"t\": \"Ô Jésus, ne permets jamais que je sorte de ton Cœur. Alimente-moi de tes Flammes. Par ta Vie, donne-moi la Vie, pour que je T'aime comme Tu le désires si ardemment.\"}, {\"id\": \"PASSION24.HOUR.21.P040\", \"n\": 40, \"t\": \"Quatrième Parole : « Mon Dieu, mon Dieu, pourquoi M'as-Tu abandonné ? »\"}, {\"id\": \"PASSION24.HOUR.21.P041\", \"n\": 41, \"t\": \"Ô Jésus souffrant, serrée sur ton Cœur, je m'abandonne en comptant tes Souffrances. Je vois qu'un tremblement convulsif envahit ton Humanité infiniment sainte. Tes Membres se débattent comme s'ils voulaient se détacher l'un de l'autre. Et durant ces convulsions, Tu cries avec force : « Mon Dieu, mon Dieu, pourquoi M'as-Tu abandonné ? »\"}, {\"id\": \"PASSION24.HOUR.21.P042\", \"n\": 42, \"t\": \"À ce cri,\\n- tous tremblent\\n- les ténèbres deviennent plus épaisses,\\n- ta Maman pétrifiée pâlit et se sent très mal !\\nMon Jésus ! ma Vie ! mon Tout ! que vois-je ?\\nAh ! Tu es tout proche de la mort !\"}, {\"id\": \"PASSION24.HOUR.21.P043\", \"n\": 43, \"t\": \"Tes Souffrances, qui T'ont toujours été fidèles, sont sur le point de Te laisser. Après tant de souffrances, avec une Douleur immense, Tu vois que beaucoup d'âmes ne sont pas incorporées à Toi.\"}, {\"id\": \"PASSION24.HOUR.21.P044\", \"n\": 44, \"t\": \"Au contraire ! Tu vois que beaucoup seront perdues. Tu ressens la douloureuse séparation d'avec elles.\"}, {\"id\": \"PASSION24.HOUR.21.P045\", \"n\": 45, \"t\": \"Et comme Tu dois satisfaire la Justice divine même pour ces âmes,\\nTu ressens\\n- la mort de chacune et\\n- les peines mêmes qu'elles souffriront en enfer.\"}, {\"id\": \"PASSION24.HOUR.21.P046\", \"n\": 46, \"t\": \"Et Tu cries fort à toutes :\"}, {\"id\": \"PASSION24.HOUR.21.P047\", \"n\": 47, \"t\": \"« Ne M'abandonnez pas. Si vous voulez plus de Souffrances, Je suis prêt. Mais ne vous séparez pas de mon Humanité.\"}, {\"id\": \"PASSION24.HOUR.21.P048\", \"n\": 48, \"t\": \"C'est cela la Douleur des douleurs, la Mort des morts. Tout le reste Me serait néant si M'était épargnée votre séparation d'avec Moi !\"}, {\"id\": \"PASSION24.HOUR.21.P049\", \"n\": 49, \"t\": \"De grâce, pitié pour mon Sang, pour mes Plaies, pour ma Mort ! Ne M'abandonnez pas ! » Mon Amour, combien je suis désolée ! Tu T'essouffles !\"}, {\"id\": \"PASSION24.HOUR.21.P050\", \"n\": 50, \"t\": \"Ta Tête infiniment sainte tombe déjà sur ta Poitrine ! La vie T'abandonne ! Mon Amour, je me sens mourir avec Toi !\"}, {\"id\": \"PASSION24.HOUR.21.P051\", \"n\": 51, \"t\": \"Moi aussi je veux crier avec Toi : « Âmes, âmes ! »\\nJe ne veux pas me détacher\\n- de cette Croix,\\n- de tes Plaies,\\npour Te procurer des âmes.\"}, {\"id\": \"PASSION24.HOUR.21.P052\", \"n\": 52, \"t\": \"Et si Tu le veux,\\n- je descendrai dans le cœur des créatures,\\n- je les entourerai de tes Peines\\nafin qu'elles ne m'échappent pas.\"}, {\"id\": \"PASSION24.HOUR.21.P053\", \"n\": 53, \"t\": \"Et si cela m'était possible, je voudrais me mettre devant la porte de l'enfer pour\\n- faire reculer les âmes qui s'y présentent et\\n- les amener à ton Cœur.\\nMon Jésus, Tu agonises et Tu Te tais.\"}, {\"id\": \"PASSION24.HOUR.21.P054\", \"n\": 54, \"t\": \"Et moi\\n- je pleure ta mort prochaine.\\n- je compatis avec Toi,\\n- je serre ton Cœur sur le mien,\\n- je lui donne un baiser et\\n- je le regarde avec toute la tendresse dont je suis capable.\\n- je fais mienne la Tendresse divine pour Te donner un plus grand soulagement\\net avec elle que je veux compatir avec Toi.\"}, {\"id\": \"PASSION24.HOUR.21.P055\", \"n\": 55, \"t\": \"Je veux\\n- changer mon cœur en un fleuve de douceur et\\n- le verser dans le Tien\\npour adoucir l'amertume que Tu éprouves à cause de la perte des âmes.\\nJésus, ton cri, est extrêmement douloureux.\\nLes âmes qui s'éloignent de Toi, plus que l'abandon du Père, font s'échapper\\nde ton Cœur cette lamentation douloureuse :\"}, {\"id\": \"PASSION24.HOUR.21.P056\", \"n\": 56, \"t\": \"« Mon Dieu, pourquoi M’as-Tu abandonné ? »\"}, {\"id\": \"PASSION24.HOUR.21.P057\", \"n\": 57, \"t\": \"Jésus, augmente en tous la Grâce, afin que personne ne se perde.\\nQue ma réparation soit au profit des âmes\\n- qui devraient se perdre,\\n- pour qu'elles soient sauvées.\"}, {\"id\": \"PASSION24.HOUR.21.P058\", \"n\": 58, \"t\": \"Jésus, par cet abandon extrême que Tu ressens sur la Croix,\\nje Te prie de donner ton aide\\n- aux nombreuses âmes aimantes\\n- à qui Tu demandes d'avoir pour compagnon ton Abandon.\"}, {\"id\": \"PASSION24.HOUR.21.P059\", \"n\": 59, \"t\": \"Ceci Tu fais en leur donnant la sensation\\n- d'être privées de ta présence,\\n- d'être plongées dans les ténèbres.\\nPourtant Toi, Tu les portes si serrées sur ton Cœur.\"}, {\"id\": \"PASSION24.HOUR.21.P060\", \"n\": 60, \"t\": \"Jésus, les souffrances de ces âmes\\n- amènent beaucoup d'âmes près de Toi et\\n- te soulagent dans ta Douleur.\"}], \"reflections\": [{\"id\": \"PASSION24.HOUR.21.REF.P001\", \"t\": \"Jésus pardonne avec tant d'Amour au bon larron :\\nIl l'emmène immédiatement avec Lui au Paradis.\\nEt nous, prions-nous pour l'âme des nombreux mourants qui ont besoin d'une\\nprière, afin que pour eux\\n- se ferme l'enfer et\\n- s'ouvrent les portes du Ciel ?\\nLes Peines de Jésus sur la Croix augmentent.\\nOublieux de Lui-même, Il prie sans cesse pour nous.\\nIl nous donne tout, y compris sa Très Sainte Mère.\\nIl fait d'elle le don le plus précieux dont disposait son Cœur.\\nEt nous, savons-nous tout donner à Jésus ?\\nEn tout ce que nous faisons prières, actions, etc.\\n- avons-nous toujours l'intention d'absorber de l'Amour frais en nous,\\n- pour pouvoir ensuite tout redonner à Jésus ?\"}, {\"id\": \"PASSION24.HOUR.21.REF.P002\", \"t\": \"Nous devons absorber l'Amour pour le redonner,\\nafin que tout ce que nous faisons porte l'empreinte de Jésus.\\nQuand le Seigneur nous donne\\n- de la Ferveur, de la Lumière ou de l'Amour,\\nsavons-nous nous en servir\\n- pour le bien des autres,\\n- pour favoriser leur conversion ?\\nOu bien gardons-nous égoïstement pour nous seuls ces Grâces ?\"}, {\"id\": \"PASSION24.HOUR.21.REF.P003\", \"t\": \"Mon Jésus, que chaque petite étincelle d'Amour que je ressens dans mon cœur devienne un incendie qui consume le cœur de chaque créature et la conduise à ton Cœur. Quel usage faisons-nous du grand don qu'il nous a fait de sa Maman ? Faisons-nous nôtre l'Amour de Jésus, ses Tendresses et tout ce qu'Il faisait, afin de contenter sa Maman ?\"}, {\"id\": \"PASSION24.HOUR.21.REF.P004\", \"t\": \"Pouvons-nous dire que notre divine Mère trouve en nous le contentement, qu'elle trouvait en son divin Fils ? Sommes-nous toujours unis à elle, comme des enfants fidèles, lui obéissant et imitant ses vertus ? Pour pouvoir donner à Marie le contentement que Lui donnait son Fils, faisons nôtre l'Amour que Jésus éprouvait envers sa Mère, la gloire, la tendresse et toutes les finesses d'Amour qu'Il lui donnait continuellement.\"}, {\"id\": \"PASSION24.HOUR.21.REF.P005\", \"t\": \"« J'ai en moi Jésus pour Te rendre contente. Et je Te donnerai tout pour que tu puisses trouver en moi ce que tu trouvais en Jésus,\"}, {\"id\": \"PASSION24.HOUR.21.REF.P006\", \"t\": \"De plus, belle Maman, je veux donner à Jésus tous les contentements qu'Il trouvait en toi. Pour ce faire, je veux entrer dans ton Cœur et prendre ton amour, toutes tes tendresses et tous tes soins maternels pour les donner à Jésus.\"}, {\"id\": \"PASSION24.HOUR.21.REF.P007\", \"t\": \"Douce Maman, que tes Mains maternelles soient les douces chaînes qui me tiennent lié à Toi et à Jésus. » Jésus ne s'épargne en rien. Il nous aime d'un Amour suprême. Il veut nous sauver tous. Si c'était possible, Il voudrait arracher à l'enfer toutes les âmes, même en subissant toutes leurs peines. Cependant, Il voit que bien des âmes cherchent à se détacher de ses Bras.\"}, {\"id\": \"PASSION24.HOUR.21.REF.P008\", \"t\": \"Alors, ne pouvant contenir sa Douleur, Il s'exclame : « Mon Dieu, mon Dieu, pourquoi M'as-Tu abandonné ? »\"}, {\"id\": \"PASSION24.HOUR.21.REF.P009\", \"t\": \"Et nous, pouvons-nous dire que notre amour envers les âmes est semblable à celui de Jésus ? Pouvons-nous dire que nos prières, nos peines et toutes nos actions, même les plus petites, sont unies aux Actions et aux Prières de Jésus pour arracher les âmes à l'enfer ?\"}, {\"id\": \"PASSION24.HOUR.21.REF.P010\", \"t\": \"Comment compatissons-nous avec Jésus dans son immense Douleur ?\\nSi notre vie pouvait se consumer en un holocauste continuel,\\ncela ne serait pas suffisant pour compatir adéquatement à cette Douleur.\\nChaque petit acte que nous faisons en union avec Jésus,\\nchaque petite peine que nous vivons en union avec Lui\\n- peut servir à arracher des âmes des griffes de Satan\\npour qu'elles ne tombent pas en enfer.\"}, {\"id\": \"PASSION24.HOUR.21.REF.P011\", \"t\": \"Si nous sommes unis à Jésus, nous avons en mains son propre Pouvoir.\"}, {\"id\": \"PASSION24.HOUR.21.REF.P012\", \"t\": \"Si, au contraire, nous ne faisons pas nos actions en union avec Lui,\\nelles ne serviront pas à empêcher ne fût-ce qu'une âme\\nd'aller en enfer.\\nMon Amour et mon Tout, tiens-moi serrée sur ton Cœur, afin que\\n- je ressente combien le pécheur T'afflige en se détachant de Toi, et\\n- qu'ainsi je puisse faire ma part pour le ramener à Toi.\"}, {\"id\": \"PASSION24.HOUR.21.REF.P013\", \"t\": \"Ô Jésus, que ton Amour brûle mon cœur, afin que je puisse ressentir l'Amour que Tu as pour les âmes.\"}, {\"id\": \"PASSION24.HOUR.21.REF.P014\", \"t\": \"Quand je souffre des amertumes, alors, ô Jésus, donne libre cours à ta Justice sur moi et prends la satisfaction que Tu veux.\"}, {\"id\": \"PASSION24.HOUR.21.REF.P015\", \"t\": \"Mais le pécheur, ô Jésus, qu'il soit sauvé.\\n- que mes peines soient un lien qui l'attache à Toi,\\n- que mon âme ait la consolation de voir ta Justice satisfaite.\"}], \"subsections\": []}, {\"hour_id\": \"PASSION24.HOUR.22\", \"hour_number\": 22, \"display_time\": \"14h à 15h\", \"title\": \"Troisième Heure d’Agonie sur la Croix – Mort de Jésus\", \"short_title\": \"Troisième Heure d’Agonie sur la Croix – Mort de Jésus\", \"source_pages\": [217, 218, 219, 220, 221, 222, 223, 224, 225], \"opening_prayer_ids\": [\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"], \"closing_prayer_ids\": [\"PASSION24.PRAYER.AFTER_EACH_HOUR\"], \"paragraphs\": [{\"id\": \"PASSION24.HOUR.22.P001\", \"n\": 1, \"t\": \"Cinquième Parole : « J'ai soif ! »\"}, {\"id\": \"PASSION24.HOUR.22.P002\", \"n\": 2, \"t\": \"Ô mon Crucifié moribond, J'embrasse ta Croix et je ressens le Feu qui brûle toute ta Personne infiniment sainte.\"}, {\"id\": \"PASSION24.HOUR.22.P003\", \"n\": 3, \"t\": \"Ton Cœur bat si fort qu’il\\n- Te soulève les Côtes,\\n- Te tourmente de manière déchirante et horrible.\"}, {\"id\": \"PASSION24.HOUR.22.P004\", \"n\": 4, \"t\": \"Toute ton Humanité infiniment sainte\\n- subit une transformation telle\\n- qu'elle Te rend méconnaissable.\"}, {\"id\": \"PASSION24.HOUR.22.P005\", \"n\": 5, \"t\": \"Tu ne peux pas contenir l'Amour dont ton Cœur est enflamé.\\nIl Te brûle et Te dessèche tout entier.\\nTon Tourment est\\n- non seulement celui de la soif corporelle causée par l'effusion de ton Sang,\\n- mais bien davantage celui de ta Soif ardente du salut de nos âmes.\"}, {\"id\": \"PASSION24.HOUR.22.P006\", \"n\": 6, \"t\": \"Par l'eau que Tu aimerais boire, Tu voudrais nous mettre tous en sûreté à l'intérieur de Toi. Rassemblant tes forces très affaiblies, Tu cries : « J'ai soif ! » Ah ! cette Parole, Tu la dis de tout ton divin Cœur :\"}, {\"id\": \"PASSION24.HOUR.22.P007\", \"n\": 7, \"t\": \"« J'ai Soif de ta volonté, de tes affections, de tes désirs, de ton amour. Il n'y a pas d'eau plus fraîche et plus douce que tu puisses Me donner que ton âme. De grâce, ne Me laisse pas brûler.\"}, {\"id\": \"PASSION24.HOUR.22.P008\", \"n\": 8, \"t\": \"J'ai une Soif ardente ! Non seulement\\n- Je sens brûler ma Langue et ma Gorge, mais\\n- Je sens aussi mon Cœur et mes Viscères se dessécher.\\nPitié pour ma Soif, pitié ! »\"}, {\"id\": \"PASSION24.HOUR.22.P009\", \"n\": 9, \"t\": \"Et dans le délire de cette Soif, Tu T'abandonnes à la Volonté du Père. Mon cœur ne peut plus vivre en voyant la cruauté de tes ennemis Ceux-ci, au lieu d'eau, Te donnent du fiel et du vinaigre. Et Toi, Tu ne les refuses pas !\"}, {\"id\": \"PASSION24.HOUR.22.P010\", \"n\": 10, \"t\": \"Ah ! je comprends, Tu reçois\\n- le fiel de nos nombreuses fautes et\\n- le vinaigre de nos passions non maîtrisées\\nCeux-ci au lieu de Te restaurer, Te brûlent davantage.\"}, {\"id\": \"PASSION24.HOUR.22.P011\", \"n\": 11, \"t\": \"Jésus, voici mon cœur, mes pensées, mes affections, tout mon être,\\nafin que\\n- Tu Te désaltères et que\\n- Tu donnes un réconfort à ta Bouche brûlée et remplie d'amertume.\\nJésus, tout ce que j'ai, tout ce que je suis, tout est pour Toi.\"}, {\"id\": \"PASSION24.HOUR.22.P012\", \"n\": 12, \"t\": \"Si mes peines étaient nécessaires pour pouvoir sauver ne serait-ce qu'une seule âme, me voici. Je suis prête à tout souffrir. Je m'offre à Toi intérieurement. Fais de moi ce qui Te plaira davantage. Je veux réparer la Douleur dont Tu souffres à cause des âmes qui se perdent.\"}, {\"id\": \"PASSION24.HOUR.22.P013\", \"n\": 13, \"t\": \"Je veux réparer la Peine que Te donnent les âmes que Tu invites à partager, ta Tristesse et ton Abandon. Au lieu de T'offrir ces souffrances comme soulagement pour ta Soif cuisante, ils Te tournent le dos et, ainsi, ils Te font souffrir davantage.\"}, {\"id\": \"PASSION24.HOUR.22.P014\", \"n\": 14, \"t\": \"Sixième Parole : « Tout est consommé ! »\\nMon Bien, Tu es sur le point de mourir.\\n- L'océan incommensurable de tes Peines,\\n- le Feu qui Te consume et, plus que tout,\\n- le Vouloir suprême du Père qui veut que Tu meures,\\nne me font plus espérer que Tu puisses continuer à vivre.\"}, {\"id\": \"PASSION24.HOUR.22.P015\", \"n\": 15, \"t\": \"Comment pourrai-je vivre sans Toi ?\\n- Les forces Te manquent,\\n- tes Yeux se voilent,\\n- ton Visage se transforme et se couvre d'une pâleur mortelle,\\n- ta Bouche est entrouverte,\\n- ton Souffle est haletant et intermittent :\"}, {\"id\": \"PASSION24.HOUR.22.P016\", \"n\": 16, \"t\": \"Il n'y a plus d'espoir que Tu puisses Te ranimer. Au Feu qui Te brûle, s'ajoute une Sueur froide qui Te baigne le Front. Tes Muscles et tes Nerfs se contractent de plus en plus à cause de l'âpreté de tes Douleurs et des Blessures des clous. Tes Plaies se déchirent encore.\"}, {\"id\": \"PASSION24.HOUR.22.P017\", \"n\": 17, \"t\": \"Et moi, je tremble et me sens mourir. Je Te regarde, ô mon Bien. Je vois descendre de tes Yeux tes dernières Larmes, signes avant-coureurs de ta Mort. A grand-peine Tu fais entendre encore une Parole :\"}, {\"id\": \"PASSION24.HOUR.22.P018\", \"n\": 18, \"t\": \"« Tout est consommé ! » Ô mon Jésus, Tu as déjà tout épuisé. Il ne Te reste rien d'autre. L'Amour est parvenu à son terme. Et moi, me suis-je consumée tout entière par amour ? Quels remerciements ne devrais-je pas Te faire. Quelle ne devrait pas être ma gratitude envers Toi ?\"}, {\"id\": \"PASSION24.HOUR.22.P019\", \"n\": 19, \"t\": \"Mon Jésus, je veux\\n- réparer pour tous, réparer nos manques de retour d'Amour et\\n- Te consoler des affronts que Tu reçois de la part des gens\\ntandis que Tu Te consumes d'Amour sur la Croix.\"}, {\"id\": \"PASSION24.HOUR.22.P020\", \"n\": 20, \"t\": \"Septième Parole : « Entre tes Mains, ô Père, Je remets mon Esprit ! »\\nMon Jésus crucifié,\\n- Tu en es à tes dernières Respirations,\\n- ton Humanité infiniment sainte se raidit,\\n- ton Cœur ne semble plus battre.\"}, {\"id\": \"PASSION24.HOUR.22.P021\", \"n\": 21, \"t\": \"Avec Marie Madeleine, j'embrasse tes Pieds. Je voudrais, si c'était possible, donner ma vie pour ranimer la Tienne. Jésus, je vois que Tu ouvres tes Yeux moribonds et regardes autour de la Croix comme si Tu voulais faire ton dernier adieu à tous.\"}, {\"id\": \"PASSION24.HOUR.22.P022\", \"n\": 22, \"t\": \"Ta Maman est mourante.\"}, {\"id\": \"PASSION24.HOUR.22.P023\", \"n\": 23, \"t\": \"Elle n'a plus de mouvement ni de voix, tant sont grandes ses peines. Tu la regardes et Tu dis : « Adieu, Maman, Moi Je pars. Mais Je te garderai dans mon Cœur. Prends soin de nos enfants. »\"}, {\"id\": \"PASSION24.HOUR.22.P024\", \"n\": 24, \"t\": \"Tu regardes Marie Madeleine qui pleure, le fidèle Jean. Par tes Regards, Tu leur dis : « Adieu ! »\"}, {\"id\": \"PASSION24.HOUR.22.P025\", \"n\": 25, \"t\": \"Tu regardes tes ennemis avec Amour. Par tes Regards, Tu leur dis : « Je vous pardonne, Je vous donne le Baiser de Paix. »\"}, {\"id\": \"PASSION24.HOUR.22.P026\", \"n\": 26, \"t\": \"Rien n'échappe à ton Regard. Tu prends congé de tous. Tu pardonnes à tous. Puis Tu rassembles toutes tes forces et d'une Voix forte Tu cries : « Père, entre tes Mains, Je remets mon Esprit ! »\"}, {\"id\": \"PASSION24.HOUR.22.P027\", \"n\": 27, \"t\": \"Baissant la tête, Tu expires.\\nMon Jésus,\\nà ce cri, la nature est toute bouleversée et pleure ta mort,\\nla mort de son Créateur !\\n- La terre tremble. Par son tremblement, elle semble pleurer et vouloir secouer\\nles âmes pour les amener à Te reconnaître comme le vrai Dieu.\\n- Le voile du Temple se déchire.\\n- Des morts ressuscitent.\\n- Le soleil qui jusqu'ici a pleuré tes Peines, a retiré avec effroi sa lumière.\"}, {\"id\": \"PASSION24.HOUR.22.P028\", \"n\": 28, \"t\": \"À ce cri,\\n- tes ennemis s'agenouillent, se frappent la poitrine et disent :\"}, {\"id\": \"PASSION24.HOUR.22.P029\", \"n\": 29, \"t\": \"« Vraiment, celui-ci est le Fils de Dieu ! »\\n- Ta Mère, pétrifiée et mourante, souffre des Peines plus dures que la mort.\\nMon Jésus mort, par ce cri Tu nous mets nous aussi entre les Mains du Père,\\npour qu'Il ne nous rejette pas.\"}, {\"id\": \"PASSION24.HOUR.22.P030\", \"n\": 30, \"t\": \"Par conséquent, Tu cries fort,\\n- non seulement de ta Voix corporelle,\\n- mais par toutes tes Peines et tout ton Sang :\\n« Père, entre tes Mains, Je remets mon Esprit et toutes les âmes ! »\"}, {\"id\": \"PASSION24.HOUR.22.P031\", \"n\": 31, \"t\": \"Ô mon Jésus, avec Toi, je m'abandonne aussi entre les Mains du Père. Donne-moi la Grâce de mourir complètement dans ton Amour, dans ton Vouloir.\"}, {\"id\": \"PASSION24.HOUR.22.P032\", \"n\": 32, \"t\": \"Je Te prie de ne jamais me permettre, ni en cette vie ni à ma mort, de quitter ta Volonté infiniment sainte. Et je veux réparer pour tous ceux qui ne s'abandonnent pas parfaitement à ta Volonté infiniment sainte, perdant ainsi ou affaiblissant en eux le précieux fruit de ta Rédemption.\"}, {\"id\": \"PASSION24.HOUR.22.P033\", \"n\": 33, \"t\": \"Jésus, quelle n'est pas la Douleur de ton Cœur, de voir tant de créatures qui s'enfuient de tes Bras et ne comptent que sur elles-mêmes ?\"}, {\"id\": \"PASSION24.HOUR.22.P034\", \"n\": 34, \"t\": \"Pitié pour tous, ô mon Jésus, pitié pour moi.\"}, {\"id\": \"PASSION24.HOUR.22.P035\", \"n\": 35, \"t\": \"Je baise ta Tête couronnée d'épines.\\nJe Te demande pardon pour mes nombreuses pensées\\n- d'orgueil, d'ambition et d'amour propre.\"}, {\"id\": \"PASSION24.HOUR.22.P036\", \"n\": 36, \"t\": \"Je Te promets que chaque fois\\n- qu'il me viendra une pensée qui ne soit pas toute pour Toi ou\\n- que je me trouverai dans une occasion de T'offenser,\\nje crierai immédiatement :\\n« Jésus et Marie, je Vous recommande mon âme ! »\\nJésus, je donne un baiser à tes beaux Yeux\\n- encore baignés de Larmes et\\n- tout couverts de Sang coagulé.\"}, {\"id\": \"PASSION24.HOUR.22.P037\", \"n\": 37, \"t\": \"Je Te demande pardon pour toutes les fois où je T'ai offensé par des regards mauvais ou immodestes.\"}, {\"id\": \"PASSION24.HOUR.22.P038\", \"n\": 38, \"t\": \"Je Te promets que chaque fois que mes yeux seront portés à s'arrêter aux choses de la terre,\"}, {\"id\": \"PASSION24.HOUR.22.P039\", \"n\": 39, \"t\": \"je crierai immédiatement :\\n« Jésus et Marie, je Vous recommande mon âme ! »\\nJésus, je donne un baiser à tes Oreilles infiniment sacrées,\\naccablées par tant d'insultes et d'horribles blasphèmes.\\nJe Te demande pardon pour toutes les fois que\\n- j'ai écouté ou j’ai fait écouter des paroles qui éloignent de Toi.\\nJe Te demande pardon également\\npour toutes les conversations mauvaises faites par les créatures.\"}, {\"id\": \"PASSION24.HOUR.22.P040\", \"n\": 40, \"t\": \"Je Te promets que chaque fois que je me trouverai dans l'occasion\\nd'entendre des conversations inconvenantes,\\nje crierai immédiatement :\\n« Jésus et Marie, je Vous recommande mon âme ! »\\nJésus, je donne un baiser à ton Visage infiniment saint,\\n- livide et ensanglanté.\"}, {\"id\": \"PASSION24.HOUR.22.P041\", \"n\": 41, \"t\": \"Je Te demande pardon pour les nombreux mépris, affronts et insultes que Tu reçois de nous, viles créatures pécheresses.\"}, {\"id\": \"PASSION24.HOUR.22.P042\", \"n\": 42, \"t\": \"Je Te promets que chaque fois que me viendra la tentation de ne pas Te donner toute la gloire, l'amour et l'adoration qui Te sont dus, je crierai immédiatement : « Jésus et Marie, je Vous recommande mon âme ! » Jésus, je donne un baiser à ta Bouche infiniment sacrée, desséchée et remplie d'amertume.\"}, {\"id\": \"PASSION24.HOUR.22.P043\", \"n\": 43, \"t\": \"Je Te demande pardon\\n- pour toutes les fois où je T'ai offensé par mes con
