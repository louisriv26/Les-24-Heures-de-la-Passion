le Saint-Esprit. Les deux sont avec Toi, \u00f4 J\u00e9sus. Et Toi, d'une Voix majestueuse et \u00e9mouvante, Tu prononces les Paroles de la cons\u00e9cration.\"},{\"id\":\"PASSION24.HOUR.04.P032\",\"n\":32,\"t\":\"Et sans Te laisser Toi-m\u00eame, Tu Te cr\u00e9es Toi-m\u00eame sous forme sacramentelle dans ce pain et ce vin.\"},{\"id\":\"PASSION24.HOUR.04.P033\",\"n\":33,\"t\":\"Et puis, apr\u00e8s T'\u00eatre communi\u00e9, Tu communies tes ap\u00f4tres et ta c\u00e9leste Maman, qui ne pouvait pas rester sans Te recevoir. \u00d4 J\u00e9sus, les Cieux s'inclinent. Tous Te font un acte d'adoration dans ton nouvel \u00e9tat d'annihilation.\"},{\"id\":\"PASSION24.HOUR.04.P034\",\"n\":34,\"t\":\"Doux J\u00e9sus, ton Amour est content et satisfait. Je vois sur cet autel, dans tes Mains, toutes les Hosties consacr\u00e9es qui se perp\u00e9tueront jusqu'\u00e0 la fin des si\u00e8cles.\"},{\"id\":\"PASSION24.HOUR.04.P035\",\"n\":35,\"t\":\"Mais dans tant et tant d'Hosties, ta douloureuse Passion est d\u00e9ploy\u00e9e.\\nCar beaucoup de cr\u00e9atures r\u00e9pondront aux exc\u00e8s de ton Amour par\\n- des exc\u00e8s d'ingratitude et\\n- d'\u00e9normes d\u00e9lits !\"},{\"id\":\"PASSION24.HOUR.04.P036\",\"n\":36,\"t\":\"Et moi je veux me trouver toujours avec Toi,\\n- dans chaque tabernacle,\\n- dans chaque ciboire et\\n- dans chaque Hostie consacr\u00e9e qui existera jusqu'\u00e0 la fin du monde,\\npour T'offrir\\n- mes actes d'amour et\\n- mes actes de r\u00e9paration pour les offenses que Tu recevras.\\nMon J\u00e9sus, je Te contemple dans la sainte Hostie.\"},{\"id\":\"PASSION24.HOUR.04.P037\",\"n\":37,\"t\":\"Comme si j'y voyais ton adorable Personne, je donne un baiser \u00e0 ton Front majestueux. En Te donnant ce baiser, je sens les \u00e9lancements des \u00e9pines.\"},{\"id\":\"PASSION24.HOUR.04.P038\",\"n\":38,\"t\":\"Mon J\u00e9sus, dans cette Hostie sainte, combien de cr\u00e9atures ne T'\u00e9pargnent pas\"},{\"id\":\"PASSION24.HOUR.04.P039\",\"n\":39,\"t\":\"les \u00e9pines.\\nElles se rendent devant Toi :\\n- au lieu de Te donner l'hommage de leurs bonnes pens\u00e9es,\\n- elles Te donnent leurs pens\u00e9es mauvaises.\"},{\"id\":\"PASSION24.HOUR.04.P040\",\"n\":40,\"t\":\"Toi, de nouveau,\\n- Tu baisses la t\u00eate comme durant ta Passion et\\n- Tu re\u00e7ois et tol\u00e8res les \u00e9pines de ces pens\u00e9es mauvaises.\"},{\"id\":\"PASSION24.HOUR.04.P041\",\"n\":41,\"t\":\"Mon Amour, je m'approche de Toi, pour partager tes Peines.\\n- Je mets toutes mes pens\u00e9es dans ton Intelligence\\n- pour repousser ces \u00e9pines qui t'attristent tant.\"},{\"id\":\"PASSION24.HOUR.04.P042\",\"n\":42,\"t\":\"Que chacune de mes pens\u00e9es d\u00e9file dans chacune des Tiennes\\n- pour Te faire r\u00e9paration pour chaque pens\u00e9e mauvaise, et\\n- ainsi consoler ton Intelligence afflig\u00e9e.\\nJ\u00e9sus, mon Bien, je donne un baiser \u00e0 tes beaux Yeux.\\nJe vois ton Regard amoureux tourn\u00e9 vers ceux qui vont \u00e0 ta sainte Pr\u00e9sence.\\nTon Regard est anxieux de recevoir leur regard d'amour.\"},{\"id\":\"PASSION24.HOUR.04.P043\",\"n\":43,\"t\":\"Mais combien viennent devant Toi.\\n- au lieu de Te regarder et de Te chercher,\\n- ils regardent des choses qui les distraient et ainsi\\n- ils Te privent du plaisir que Tu \u00e9prouves dans l'\u00e9change de regards d'amour !\"},{\"id\":\"PASSION24.HOUR.04.P044\",\"n\":44,\"t\":\"Toi, Tu souffres, et moi, en Te donnant des baisers, je sens mes l\u00e8vres baign\u00e9es de tes Larmes.\"},{\"id\":\"PASSION24.HOUR.04.P045\",\"n\":45,\"t\":\"Mon J\u00e9sus, ne pleure pas. Je veux mettre mes yeux dans les Tiens\\npour partager tes Peines et pleurer avec Toi.\\nPour r\u00e9parer les regards distraits des cr\u00e9atures,\\nje garde mon regard toujours fix\u00e9 sur Toi.\\nJ\u00e9sus, mon Amour, je donne un baiser \u00e0 tes Oreilles infiniment saintes.\\nJe Te vois attentif \u00e0 \u00e9couter ce que veulent de Toi les cr\u00e9atures,\\nafin de les consoler.\\nMais celles-ci font parvenir \u00e0 tes Oreilles\\n- des pri\u00e8res mal r\u00e9cit\u00e9es, remplies de m\u00e9fiance,\\n- des pri\u00e8res faites par habitude.\\nEt ton Ou\u00efe, dans cette Hostie sainte,\\nest importun\u00e9e plus que durant ta Passion m\u00eame.\"},{\"id\":\"PASSION24.HOUR.04.P046\",\"n\":46,\"t\":\"Mon J\u00e9sus, Je veux prendre toutes les Harmonies du Ciel et les diriger vers tes Oreilles pour r\u00e9parer.\"},{\"id\":\"PASSION24.HOUR.04.P047\",\"n\":47,\"t\":\"Je veux mettre mes oreilles dans les Tiennes,\\n- non seulement pour partager tes Peines,\\n- mais pour T'offrir mon acte continu de r\u00e9paration et Te consoler.\\nJ\u00e9sus, ma Vie, je donne un baiser \u00e0 ton Visage infiniment saint.\"},{\"id\":\"PASSION24.HOUR.04.P048\",\"n\":48,\"t\":\"Je le vois ensanglant\u00e9, livide et gonfl\u00e9. Des cr\u00e9atures, \u00f4 J\u00e9sus, viennent devant cette sainte Hostie. Par leurs positions ind\u00e9centes et leurs conversations mauvaises, il semble qu'elles Te giflent et Te crachent dessus au lieu de Te faire honneur.\"},{\"id\":\"PASSION24.HOUR.04.P049\",\"n\":49,\"t\":\"Et Toi, c'est en toute Paix et avec Patience\\nque Tu les re\u00e7ois et que Tu supportes tout, comme durant ta Passion !\\nJ\u00e9sus,\\nje veux mettre mon visage pr\u00e8s du Tien,\\nnon seulement\\n- pour Te donner des baisers et\\n- pour recevoir avec Toi les insultes qui Te viennent des cr\u00e9atures,\\nmais pour partager toutes tes Peines.\"},{\"id\":\"PASSION24.HOUR.04.P050\",\"n\":50,\"t\":\"De mes mains, je veux\\n- Te caresser,\\n- T'enlever les crachats et\\n- Te presser sur mon c\u0153ur.\\nJe veux faire de tout mon \u00eatre de nombreux, extr\u00eamement petits morceaux, et\\nje veux les mettre devant Toi comme autant d'\u00e2mes qui T'adorent.\"},{\"id\":\"PASSION24.HOUR.04.P051\",\"n\":51,\"t\":\"Je veux que tous mes mouvements soient chang\u00e9s en prostrations pour r\u00e9parer les d\u00e9shonneurs qui Te viennent des cr\u00e9atures. Mon J\u00e9sus, je donne un baiser \u00e0 ta Bouche infiniment sainte. Je vois que lorsque Tu descends dans le c\u0153ur des cr\u00e9atures sous la forme sacramentelle, Tu es oblig\u00e9 de Te poser sur beaucoup de langues mordantes, impures, mauvaises.\"},{\"id\":\"PASSION24.HOUR.04.P052\",\"n\":52,\"t\":\"Oh ! comme Tu en es attrist\u00e9 ! Tu Te sens comme intoxiqu\u00e9 par ces langues. C'est encore pire quand Tu descends dans leurs c\u0153urs !\"},{\"id\":\"PASSION24.HOUR.04.P053\",\"n\":53,\"t\":\"J\u00e9sus, si c'\u00e9tait possible, je voudrais me retrouver dans la bouche de chaque cr\u00e9ature, pour changer en louanges toutes les offenses que Tu re\u00e7ois d'elles de cette mani\u00e8re ! Mon Bien, Tu baises ta T\u00eate infiniment sainte. Je la vois fatigu\u00e9e, \u00e9puis\u00e9e et toute occup\u00e9e \u00e0 tes Activit\u00e9s d'Amour.\"},{\"id\":\"PASSION24.HOUR.04.P054\",\"n\":54,\"t\":\"Dis-moi, que fais-Tu ?\"},{\"id\":\"PASSION24.HOUR.04.P055\",\"n\":55,\"t\":\"Et Tu me r\u00e9ponds : \u00ab Mon enfant, dans cette Hostie, Je travaille du matin au soir, fabriquant des cha\u00eenes d'Amour. Quand les \u00e2mes viennent chez Moi, Je les encha\u00eene \u00e0 mon C\u0153ur.\"},{\"id\":\"PASSION24.HOUR.04.P056\",\"n\":56,\"t\":\"Mais sais-tu ce que plusieurs Me font ? Beaucoup, \u00e0 coups d'efforts, se d\u00e9gagent et mettent mes cha\u00eenes d'Amour en pieces. Comme ces cha\u00eenes sont li\u00e9es \u00e0 mon C\u0153ur, J'en suis tortur\u00e9 et Je tombe dans le d\u00e9lire.\"},{\"id\":\"PASSION24.HOUR.04.P057\",\"n\":57,\"t\":\"De plus, quand elles brisent mes cha\u00eenes, ces \u00e2mes r\u00e9duisent mon intense activit\u00e9 \u00e0 rien. Car elles recherchent les cha\u00eenes des cr\u00e9atures. Elles le font m\u00eame en ma Pr\u00e9sence, se servant de Moi pour parvenir \u00e0 leurs fins.\"},{\"id\":\"PASSION24.HOUR.04.P058\",\"n\":58,\"t\":\"Cela M'attriste tant que \u00e7a Me donne une fi\u00e8vre violente qui Me fait\\nM'\u00e9vanouir et d\u00e9lirer. \u00bb\\nComme je Te plains, J\u00e9sus ! Ton Amour est mis au pilori !\\nMoi, pour Te d\u00e9dommager, je Te prie\\n- d'encha\u00eener mon c\u0153ur avec ces cha\u00eenes bris\u00e9es par les cr\u00e9atures,\\n- pour pouvoir Te donner \u00e0 leur place un retour d'amour.\\nMon J\u00e9sus, mon divin Archer, je donne un baiser \u00e0 ta Poitrine.\\nLe Feu qu'elle contient est si grand que\\n- pour donner un peu d'\u00e9panchements \u00e0 tes Flammes et\\n- pour Te donner un peu de r\u00e9pit dans ton Travail,\\nTu Te mets \u00e0 jouer avec les \u00e2mes qui viennent \u00e0 Toi,\\nleur d\u00e9cochant des fl\u00e8ches d'Amour qui sortent de ta Poitrine.\"},{\"id\":\"PASSION24.HOUR.04.P059\",\"n\":59,\"t\":\"Ton jeu consiste \u00e0 fabriquer des fl\u00e8ches, des dards, des traits. Quand ils frappent les \u00e2mes, Tu jubiles.\"},{\"id\":\"PASSION24.HOUR.04.P060\",\"n\":60,\"t\":\"Mais beaucoup, \u00f4 J\u00e9sus, les repoussent et T'envoient en \u00e9change\\n- des fl\u00e8ches de froideur,\\n- des dards de ti\u00e9deur et\\n- des traits d'ingratitude.\\nEt Tu en es tellement afflig\u00e9 que Tu pleures am\u00e8rement !\"},{\"id\":\"PASSION24.HOUR.04.P061\",\"n\":61,\"t\":\"\u00d4 J\u00e9sus, voici ma poitrine pr\u00eate \u00e0 recevoir\\n- non seulement les fl\u00e8ches qui me sont destin\u00e9es,\\nmais encore celles que repoussent les autres \u00e2mes.\"},{\"id\":\"PASSION24.HOUR.04.P062\",\"n\":62,\"t\":\"Ainsi Tu ne seras plus vaincu dans ton jeu d'Amour.\"},{\"id\":\"PASSION24.HOUR.04.P063\",\"n\":63,\"t\":\"Et ainsi, je r\u00e9parerai les froideurs, les ti\u00e9deurs et les ingratitudes\\nque Tu re\u00e7ois de ces \u00e2mes.\\nJ\u00e9sus, je donne un baiser \u00e0 ta Main gauche.\\nJe veux ainsi r\u00e9parer\\n- pour tous les coups illicites ou\\n- bl\u00e2mables donn\u00e9s \u00e0 ta sainte Pr\u00e9sence.\"},{\"id\":\"PASSION24.HOUR.04.P064\",\"n\":64,\"t\":\"Je Te prie de me tenir toujours serr\u00e9 sur ton C\u0153ur !\\nGloire au P\u00e8re, ...\\n\u00d4 J\u00e9sus, je baise ta Main droite.\\nJe veux par l\u00e0\\n- r\u00e9parer tous les sacril\u00e8ges, surtout les messes mal c\u00e9l\u00e9br\u00e9es !\\nCombien de fois, mon Amour, es-Tu contraint de descendre du Ciel\\n- entre des mains et dans des poitrines indignes.\\nBien que Tu en aies la naus\u00e9e, l'Amour Te contraint d'y rester.\"},{\"id\":\"PASSION24.HOUR.04.P065\",\"n\":65,\"t\":\"Il y a m\u00eame certains de tes ministres qui,\\n- par leurs \u00e9normes d\u00e9lits et sacril\u00e8ges,\\n- renouvellent ta Passion,\\n- renouvellent le d\u00e9icide !\\nJ\u00e9sus, cela m'\u00e9pouvante, rien que d'y penser !\"},{\"id\":\"PASSION24.HOUR.04.P066\",\"n\":66,\"t\":\"Tout comme durant ta Passion Tu \u00e9tais entre les mains des Juifs d\u00e9icides, Tu es entre ces mains indignes, Toi, l'Agnelet paisible, attendant de nouveau la mort. Mais Tu attends aussi leur conversion. J\u00e9sus, combien Tu souffres ! Tu voudrais bien une main pleine d'amour pour Te lib\u00e9rer de ces mains sanguinaires.\"},{\"id\":\"PASSION24.HOUR.04.P067\",\"n\":67,\"t\":\"J\u00e9sus, quand Tu Te trouveras dans de telles mains,\\n- je Te prie de m'appeler pr\u00e8s de Toi et pour r\u00e9parer\\n- je Te couvrirai de la puret\u00e9 des anges,\\n- je Te parfumerai de tes Vertus\\npour calmer la naus\u00e9e que Tu \u00e9prouves dans ces mains,\\n- et je T'offrirai mon c\u0153ur comme abri et refuge.\"},{\"id\":\"PASSION24.HOUR.04.P068\",\"n\":68,\"t\":\"Tandis que Tu seras en moi,\\n- je Te prierai pour les pr\u00eatres,\\n- afin que tous soient tes dignes ministres.\\nAmen. Gloire au P\u00e8re, ...\\nJ\u00e9sus, je donne un baiser \u00e0 ton Pied gauche.\\nJe veux ainsi r\u00e9parer pour ceux\"},{\"id\":\"PASSION24.HOUR.04.P069\",\"n\":69,\"t\":\"- qui Te re\u00e7oivent par habitude et\\n- sans les dispositions requises.\\nGloire au P\u00e8re, ...\\n\u00d4 J\u00e9sus, je donne un baiser \u00e0 ton Pied droit.\\nCe faisant, je veux r\u00e9parer pour ceux qui Te re\u00e7oivent en T'outrageant.\"},{\"id\":\"PASSION24.HOUR.04.P070\",\"n\":70,\"t\":\"De gr\u00e2ce, je T'en prie,\\n- quand ils oseront faire cela,\\n- renouvelle le miracle que Tu fis pour Longin.\"},{\"id\":\"PASSION24.HOUR.04.P071\",\"n\":71,\"t\":\"Tu l'as gu\u00e9ri et l'as converti au toucher du Sang qui jaillit de ton C\u0153ur,\\ntransperc\u00e9 par sa lance,\\nAinsi, \u00e0 ton toucher sacramentel, convertis\\n- les offenses en actes d'amour et\\n- les offenseurs en personnes repentantes !\\nGloire au P\u00e8re, ...\\n\u00d4 J\u00e9sus, je donne un baiser ton C\u0153ur infiniment doux\\ndans lequel se d\u00e9versent tant d'offenses.\"},{\"id\":\"PASSION24.HOUR.04.P072\",\"n\":72,\"t\":\"Par mon geste, je veux tout r\u00e9parer, Te donner de l'amour pour tous, et partager toutes tes Peines. Gloire au P\u00e8re, ... Archer c\u00e9leste, si quelque offense \u00e9chappe \u00e0 ma r\u00e9paration, je Te prie de m'emprisonner dans ton C\u0153ur et dans ta Volont\u00e9, afin que je r\u00e9pare tout.\"},{\"id\":\"PASSION24.HOUR.04.P073\",\"n\":73,\"t\":\"Je prierai ta douce Maman\\n- de me garder toujours avec elle,\\n- afin que je r\u00e9pare tout pour tous.\\nNous T'embrasserons ensemble.\\nEn T'embrassant, nous \u00e9loignerons de Toi les vagues d'amertume\\nque Tu re\u00e7ois des cr\u00e9atures.\"},{\"id\":\"PASSION24.HOUR.04.P074\",\"n\":74,\"t\":\"J\u00e9sus, rappelle-Toi que moi aussi je suis une pauvre \u00e2me p\u00e9cheresse. De gr\u00e2ce renferme-moi dans ton C\u0153ur.\"},{\"id\":\"PASSION24.HOUR.04.P075\",\"n\":75,\"t\":\"Par tes cha\u00eenes d'Amour\\n- emprisonne-moi et\\n- attache une \u00e0 une mes pens\u00e9es, mes affections et mes d\u00e9sirs.\\n- Encha\u00eene mes mains et mes pieds \u00e0 ton C\u0153ur,\\nafin que je n'aie d'autres mains et d'autres pieds que les Tiens !\"},{\"id\":\"PASSION24.HOUR.04.P076\",\"n\":76,\"t\":\"Mon Amour,\\n- mon cachot sera ton C\u0153ur,\\n- mes cha\u00eenes seront form\u00e9es de ton Amour,\\n- tes Flammes seront ma nourriture,\\n- ton Souffle sera le mien,\\n- les grilles qui m'emp\u00eachent de sortir seront ta Volont\u00e9 infiniment sainte\"},{\"id\":\"PASSION24.HOUR.04.P077\",\"n\":77,\"t\":\"Et ainsi :\\n- je ne verrai que des Flammes,\\n- je ne toucherai que du Feu, qui, tandis qu'il me donnera la Vie,\\nme donnera aussi la mort comme celle que Tu subis dans la sainte Hostie.\"},{\"id\":\"PASSION24.HOUR.04.P078\",\"n\":78,\"t\":\"Je Te donnerai ma vie, et ainsi,\\n- tandis que je serai prisonni\u00e8re en Toi,\\n- Toi, tu seras prisonnier en moi.\"},{\"id\":\"PASSION24.HOUR.04.P079\",\"n\":79,\"t\":\"Ceci n'est-il pas ton dessein dans ton incarc\u00e9ration dans l'Hostie, o\u00f9 Tu veux \u00eatre remis en libert\u00e9 par les \u00e2mes qui Te re\u00e7oivent, retrouvant la Vie en elles ?\"},{\"id\":\"PASSION24.HOUR.04.P080\",\"n\":80,\"t\":\"Et maintenant, b\u00e9nis-moi et donne le Baiser mystique d'Amour \u00e0 mon \u00e2me, tandis que moi je reste serr\u00e9e contre Toi en T'embrassant. Gloire au P\u00e8re, ... Mon doux C\u0153ur, en instituant l'infiniment Saint Sacrement, Tu as entrevu les \u00e9normes ingratitudes et offenses des cr\u00e9atures. Mais Tu n'as pourtant pas recul\u00e9.\"},{\"id\":\"PASSION24.HOUR.04.P081\",\"n\":81,\"t\":\"Bless\u00e9 et attrist\u00e9, Tu veux tout noyer dans l'immensit\u00e9 de ton Amour. Tu instruis tes ap\u00f4tres et Tu pr\u00e9cises que ce que Tu viens de faire, ils doivent le faire eux aussi. Ainsi Tu leur donnes le pouvoir de consacrer. Tu leur conf\u00e8res le sacerdoce.\"},{\"id\":\"PASSION24.HOUR.04.P082\",\"n\":82,\"t\":\"\u00d4 J\u00e9sus, Tu penses \u00e0 tous et Tu r\u00e9pares pour tous et pour tout. La C\u00e8ne est termin\u00e9e. Tu prends avec Toi les ap\u00f4tres. Tu T'achemines vers le Jardin de Geths\u00e9mani. L\u00e0 ta douloureuse Passion va commencer. Je Te suivrai en toutes choses, mon J\u00e9sus, pour Te tenir fid\u00e8le compagnie. Triste, Tu avances vers le Jardin.\"},{\"id\":\"PASSION24.HOUR.04.P083\",\"n\":83,\"t\":\"Entretemps\\n- je veux r\u00e9parer pour ces \u00e2mes\\nqui sont dissip\u00e9es et distraites quand elles quittent l'\u00e9glise.\"},{\"id\":\"PASSION24.HOUR.04.P084\",\"n\":84,\"t\":\"- je Te prie de donner Lumi\u00e8re et Gr\u00e2ces \u00e0 ces \u00e2mes qui,\\npendant qu'elles pratiquent les choses saintes,\\nn'en re\u00e7oivent aucun profit.\"}],\"reflections\":[{\"id\":\"PASSION24.HOUR.04.REF.P001\",\"t\":\"J\u00e9sus est cach\u00e9 dans l'Hostie. Il embrasse tous les si\u00e8cles. Il donne Vie et Lumi\u00e8re \u00e0 tous.\"},{\"id\":\"PASSION24.HOUR.04.REF.P002\",\"t\":\"Ainsi, en nous cachant en J\u00e9sus,\\nnous donnerons par nos pri\u00e8res et nos r\u00e9parations Vie et Lumi\u00e8re\\n- \u00e0 tous, - m\u00eame aux h\u00e9r\u00e9tiques et aux infid\u00e8les.\\nCar J\u00e9sus n'exclut personne.\\nPour nous rendre semblables \u00e0 J\u00e9sus, nous devons tout cacher en Lui.\\n- nos pens\u00e9es, nos regards, nos paroles,\\n- nos \u00e9motions, nos affections, nos d\u00e9sirs,\\n- nos pas et nos \u0153uvres.\\n- nos pri\u00e8res \u00e9galement.\\nDans son Eucharistie, J\u00e9sus embrasse tous les si\u00e8cles.\\nDe m\u00eame nous embrasserons tous les si\u00e8cles avec Lui.\\nSerr\u00e9s contre Lui, nous serons\\n- la pens\u00e9e de toute intelligence, la parole de toute langue,\\n- le d\u00e9sir de tout c\u0153ur, les pas de tout pied, l'\u0153uvre de tout bras.\"},{\"id\":\"PASSION24.HOUR.04.REF.P003\",\"t\":\"Ce faisant,\\n- nous d\u00e9tournerons du C\u0153ur de J\u00e9sus le mal\\nque les cr\u00e9atures veulent Lui faire,\\n- nous Le presserons de donner le Salut, la Saintet\u00e9 et l\u2019Amour\\n\u00e0 toutes les \u00e2mes.\\nNotre vie doit \u00eatre en parfaite conformit\u00e9 avec la Vie de J\u00e9sus.\\nNotre \u00e2me doit se tenir (par l'intention) dans tous les tabernacles du monde\\n- pour tenir compagnie \u00e0 J\u00e9sus et\\n- lui donner soulagement et r\u00e9paration continuels.\\nElle doit faire toutes ses actions dans cette intention.\"},{\"id\":\"PASSION24.HOUR.04.REF.P004\",\"t\":\"Le premier tabernacle est en nous, en notre c\u0153ur. Il faut donc pr\u00eater grande attention \u00e0 tout ce que le bon J\u00e9sus veut faire en nous. J\u00e9sus est dans notre C\u0153ur. Bien des fois, Il nous fait ressentir le besoin de prier.\"},{\"id\":\"PASSION24.HOUR.04.REF.P005\",\"t\":\"C'est Lui qui veut prier.\\nIl nous veut tout proches de Lui.\\nIl s'identifie presque avec notre voix, nos affections et notre c\u0153ur\\npour unifier notre pri\u00e8re \u00e0 la Sienne !\\nPour faire honneur \u00e0 la Pri\u00e8re de J\u00e9sus, soyons attentifs\\n\u00e0 Lui pr\u00eater tout notre \u00eatre.\\nIl nous faut \u00eatre attentifs \u00e0 tous nos mouvements int\u00e9rieurs,\\nparce que le bon J\u00e9sus\\n- tant\u00f4t nous fait souffrir, tant\u00f4t nous veut en pri\u00e8re,\\n- tant\u00f4t nous met dans tel \u00e9tat d'\u00e2me, tant\u00f4t dans tel autre,\\nafin que toute sa Vie soit r\u00e9p\u00e9t\u00e9e en nous.\\nSupposons que J\u00e9sus nous met dans l'occasion de faire preuve de patience.\\nIl re\u00e7oit de la part des cr\u00e9atures des offenses telles et si nombreuses\\nqu'Il se sent pouss\u00e9 \u00e0 envoyer des fl\u00e9aux pour les frapper.\"},{\"id\":\"PASSION24.HOUR.04.REF.P006\",\"t\":\"Alors Il nous donne l'occasion de faire preuve de patience. Nous devons L'honorer et supporter tout avec paix.\"},{\"id\":\"PASSION24.HOUR.04.REF.P007\",\"t\":\"Ainsi notre patience \u00e9vitera les fl\u00e9aux que les autres cr\u00e9atures provoquent. Car en nous Il trouve sa propre Patience.\"},{\"id\":\"PASSION24.HOUR.04.REF.P008\",\"t\":\"Comme il en va de la patience, il en va aussi de toutes les autres vertus. J\u00e9sus, dans le sacrement d'Amour, pratique toutes les vertus.\"},{\"id\":\"PASSION24.HOUR.04.REF.P009\",\"t\":\"Et c'est de J\u00e9sus (dans la sainte Hostie) que nous puiserons\\n- la force morale, l'indulgence,\\n- la patience, la tol\u00e9rance,\\n- l'humilit\u00e9, l'ob\u00e9issance, etc.\\nLe bon J\u00e9sus nous donne sa Chair en nourriture.\\nNous donnons \u00e0 J\u00e9sus (en guise d'aliment pour Lui,)\\nnotre amour, notre volont\u00e9,\\nnos d\u00e9sirs, nos pens\u00e9es, nos affections.\\nAinsi nous rivaliserons d'Amour avec Lui.\"},{\"id\":\"PASSION24.HOUR.04.REF.P010\",\"t\":\"Ne laissons entrer en nous rien qui ne soit de Lui. (Laissons entrer en nous seulement ce qui vient de Lui.)\"},{\"id\":\"PASSION24.HOUR.04.REF.P011\",\"t\":\"Ainsi, en tout ce que nous ferons, tout servira d'aliment \u00e0 notre bien-aim\u00e9 J\u00e9sus. Notre facult\u00e9 de penser doit alimenter la Pens\u00e9e divine.\"},{\"id\":\"PASSION24.HOUR.04.REF.P012\",\"t\":\"Ainsi, si nous pensons saintement, nous alimentons la Pens\u00e9e divine.\\n- De m\u00eame, notre regard doit alimenter le Regard divin.\"},{\"id\":\"PASSION24.HOUR.04.REF.P013\",\"t\":\"- Nos paroles, nos \u00e9motions, nos affections, nos d\u00e9sirs, nos pas, nos \u0153uvres,\\ntout doit servir \u00e0 alimenter J\u00e9sus.\"},{\"id\":\"PASSION24.HOUR.04.REF.P014\",\"t\":\"Si nous alimentons J\u00e9sus de cette mani\u00e8re,\\nnous devons avoir l'intention d'alimenter aussi les cr\u00e9atures en J\u00e9sus.\\nJ\u00e9sus, ma douce Vie, quand Tu viens en moi, fais en sorte que\\n- mes \u00e9motions, mes d\u00e9sirs,\\n- mes affections, mes pens\u00e9es, mes paroles,\\nsubissent la Puissance de la Cons\u00e9cration sacramentelle,\\nde sorte qu'elles deviennent autant d'Hosties,\\npour Te donner aux \u00e2mes.\"}],\"subsections\":[]},{\"hour_id\":\"PASSION24.HOUR.05\",\"hour_number\":5,\"display_time\":\"21h \u00e0 22h\",\"title\":\"Premi\u00e8re Heure de l\u2019Agonie dans le Jardin\",\"short_title\":\"Premi\u00e8re Heure de l\u2019Agonie dans le Jardin\",\"source_pages\":[69,70,71,72,73,74,75],\"opening_prayer_ids\":[\"PASSION24.PRAYER.BEFORE_EACH_HOUR\",\"PASSION24.PRAYER.HOLY_HOUR_PREPARATION\"],\"closing_prayer_ids\":[\"PASSION24.PRAYER.HOLY_HOUR_THANKSGIVING\"],\"paragraphs\":[{\"id\":\"PASSION24.HOUR.05.P001\",\"n\":1,\"t\":\"Mon J\u00e9sus, attir\u00e9e par ton Amour, je viens Te tenir compagnie dans le Jardin. Tu appelles mon c\u0153ur bless\u00e9.\"},{\"id\":\"PASSION24.HOUR.05.P002\",\"n\":2,\"t\":\"Moi j'accours en me disant : \u00ab D'o\u00f9 vient cette attirance d'Amour que je ressens ? Ah ! peut-\u00eatre mon J\u00e9sus se trouve dans un tel \u00e9tat d'amertume, qu'Il ressent le besoin de ma compagnie ! \u00bb Et je vole vers Toi. En entrant dans ce jardin, je tremble d'horreur. Il fait froid et la nuit est obscure.\"},{\"id\":\"PASSION24.HOUR.05.P003\",\"n\":3,\"t\":\"Le mouvement des feuilles est comme une voix plaintive. Il m'annonce la peine, la tristesse et la mort de mon J\u00e9sus !\"},{\"id\":\"PASSION24.HOUR.05.P004\",\"n\":4,\"t\":\"Les \u00e9toiles, par leur doux scintillement, sont comme des yeux qui pleurent. Elles me reprochent mes ingratitudes. Elles sont toutes attentives \u00e0 regarder. Elles font \u00e9cho aux Larmes de J\u00e9sus\"},{\"id\":\"PASSION24.HOUR.05.P005\",\"n\":5,\"t\":\"En tremblant et \u00e0 t\u00e2tons, je cherche J\u00e9sus. Je L'appelle : \u00ab J\u00e9sus, o\u00f9 es-Tu ? Tu M'attires \u00e0 Toi et Tu ne Te laisses pas voir ? Tu m'appelles et Tu Te caches ? Tout est terreur ici. Tout est \u00e9pouvante et silence profond ! \u00bb\"},{\"id\":\"PASSION24.HOUR.05.P006\",\"n\":6,\"t\":\"Je tends l'oreille et j'entends un Souffle p\u00e9nible. C'est J\u00e9sus. Je viens de Le trouver. Mais quel changement terrible ! Ce n'est plus le doux J\u00e9sus de la C\u00e8ne Eucharistique dont le Visage resplendissait d'une beaut\u00e9 ravissante.\"},{\"id\":\"PASSION24.HOUR.05.P007\",\"n\":7,\"t\":\"C\u2019est un J\u00e9sus triste, d'une tristesse si mortelle qu'elle Le d\u00e9figure ! Il agonise. Et moi, je me sens troubl\u00e9e en pensant que, peut-\u00eatre, je n'entendrai plus sa Voix ! J'embrasse ses Pieds.\"},{\"id\":\"PASSION24.HOUR.05.P008\",\"n\":8,\"t\":\"Puis je me fais plus hardie, je m'approche de ses Bras. Je mets ma main sur son Front pour Le soutenir et, \u00e0 voix basse, je Lui dis : \u00ab J\u00e9sus, J\u00e9sus ! \u00bb\"},{\"id\":\"PASSION24.HOUR.05.P009\",\"n\":9,\"t\":\"Et Lui, interpell\u00e9 par ma voix, me regarde et Il me dit : \u00ab \u00c2me, tu es ici ? Ah ! Je t'attendais. Car la tristesse qui M'opprime le plus, c'est l'abandon total par tous !\"},{\"id\":\"PASSION24.HOUR.05.P010\",\"n\":10,\"t\":\"Je t'attendais\\n- pour Te rendre spectatrice de mes Peines et\\n- Te faire partager le Calice d'Amertume\\nque sous peu mon P\u00e8re c\u00e9leste M'enverra par l'entremise d'un ange.\"},{\"id\":\"PASSION24.HOUR.05.P011\",\"n\":11,\"t\":\"Nous le boirons ensemble. Ce ne sera pas un Calice de r\u00e9confort, mais d'intense Amertume ! Je ressens le besoin que quelque \u00e2me aimante en boive au moins quelques gouttes.\"},{\"id\":\"PASSION24.HOUR.05.P012\",\"n\":12,\"t\":\"Par cons\u00e9quent, Je t'ai appel\u00e9e\\n- pour que tu partages mes Peines, et\\n- pour M'assurer de ne pas demeurer seul, dans un total abandon ! \u00bb\"},{\"id\":\"PASSION24.HOUR.05.P013\",\"n\":13,\"t\":\"\u00ab Ah ! oui, \u00f4 mon J\u00e9sus angoiss\u00e9,\\n- nous boirons ensemble le Calice de tes Peines, et\\n- je ne Te quitterai pas ! \u00bb\\nRassur\u00e9, J\u00e9sus\\n- entre dans une Agonie mortelle et\\n- souffre des Peines intenses, jamais vues auparavant.\\n\u00ab \u00d4 mon J\u00e9sus, mon Amour, dis-moi pourquoi\\nTu es si triste, si afflig\u00e9, et seul dans ce jardin et en cette nuit ? \u00bb\\nC'est la derni\u00e8re nuit de ta Vie mortelle !\"},{\"id\":\"PASSION24.HOUR.05.P014\",\"n\":14,\"t\":\"Peu d'Heures Te restent avant de commencer ta Passion ! Ici, j'aurais cru trouver la c\u00e9leste Maman, Marie Madeleine pleine d'amour, les fid\u00e8les ap\u00f4tres.\"},{\"id\":\"PASSION24.HOUR.05.P015\",\"n\":15,\"t\":\"Mais je Te trouve seul et en proie \u00e0 une tristesse\\n- qui est pour Toi plus qu'une mort cruelle, mais\\n- qui ne Te fait pas mourir !\"},{\"id\":\"PASSION24.HOUR.05.P016\",\"n\":16,\"t\":\"\u00d4 mon Bien et mon Tout, Tu ne me r\u00e9ponds pas ? Parle-moi.\\nOn dirait que la Tristesse qui T'opprime est si grande\\nqu'elle T'a fait perdre la parole.\\nTon Regard si investigateur et plein de Lumi\u00e8re est triste.\\nOn dirait que Tu cherches de l'aide et du r\u00e9confort.\\n- Ton Visage est p\u00e2le et tes L\u00e8vres sont dess\u00e9ch\u00e9es,\\n- ta Personne divine tremble de la t\u00eate aux pieds\\n- ton C\u0153ur bat tr\u00e8s fort \u00e0 la recherche d'\u00e2mes.\\nIls manifestent une angoisse telle\\n- qu'on dirait que Tu vas expirer d'un moment \u00e0 l'autre.\"},{\"id\":\"PASSION24.HOUR.05.P017\",\"n\":17,\"t\":\"Tout me dit que Tu Te sens tr\u00e8s seul et que Tu recherches ma compagnie.\\nMe voici tout pr\u00e8s de Toi, J\u00e9sus.\\nMon c\u0153ur ne supporte pas de Te voir prostr\u00e9 sur le sol.\\nJe Te prends entre mes bras et Te serre fort sur mon c\u0153ur.\\nJe veux compter une \u00e0 une, tes angoisses et les offenses qu'on Te fait,\\nafin de Te donner pour toutes\\n- du soulagement, des r\u00e9parations, et de la compassion.\\nMon J\u00e9sus, ma Vie, je suis ici avec Toi et je Te serre dans mes bras.\\nJe vois que tes Souffrances s'accroissent.\\nJe sens qu\u2019un Feu circule dans tes Veines. Ton Sang bouille dans tes Veines.\\nOn dirait qu'il va les d\u00e9chirer et en sortir !\"},{\"id\":\"PASSION24.HOUR.05.P018\",\"n\":18,\"t\":\"Dis-moi, mon Amour, qu'as-Tu ? Je ne vois pas de fouets, d'\u00e9pines, de clous, ni de croix.\"},{\"id\":\"PASSION24.HOUR.05.P019\",\"n\":19,\"t\":\"J\u2019appuie la t\u00eate sur ton C\u0153ur.\\nJe ressens\\n- que des \u00e9pines cruelles le transpercent,\\n- que des fouets impitoyables n'\u00e9pargnent aucune parcelle de ta divine\\nPersonne, ni \u00e0 l'int\u00e9rieur ni \u00e0 l'ext\u00e9rieur.\\nJe vois tes Mains raidies et contorsionn\u00e9es plus que par des clous.\"},{\"id\":\"PASSION24.HOUR.05.P020\",\"n\":20,\"t\":\"Mon doux Bien, dis-moi : \u00ab Qu'est-ce donc qui a tant de pouvoir, m\u00eame dans ton for int\u00e9rieur, qui Te fait subir autant de tourments et de morts ? \u00bb Il me semble que le doux J\u00e9sus entrouvre ses L\u00e8vres Il me dit d'une Voix \u00e9teinte :\"},{\"id\":\"PASSION24.HOUR.05.P021\",\"n\":21,\"t\":\"\u00ab Fille, tu veux savoir\\n- ce qui Me tourmente plus que les bourreaux m\u00eames, et\\n- pourquoi les tourments de ceux-ci ne seront rien,\\ncompar\u00e9s \u00e0 ce que Je souffre actuellement ?\\nC'est l'Amour. L'Amour \u00e9ternel veut la supr\u00e9matie en tout.\"},{\"id\":\"PASSION24.HOUR.05.P022\",\"n\":22,\"t\":\"Il Me fait souffrir tout ensemble et dans mes Fibres les plus profondes, ce que les bourreaux Me feront souffrir peu \u00e0 peu dans ma Personne.\"},{\"id\":\"PASSION24.HOUR.05.P023\",\"n\":23,\"t\":\"\u00c2me, c\u2019est l'Amour qui pr\u00e9domine en Moi. L'Amour est un clou pour Moi, l'Amour est un fouet pour Moi, l'Amour est une couronne d'\u00e9pines pour Moi, l'Amour est tout pour Moi, l'Amour est ma Passion \u00e9ternelle, alors que ce que Je souffre dans mon Humanit\u00e9 est temporaire. Mon enfant, entre dans mon C\u0153ur et viens Te perdre dans mon Amour Seulement dans mon Amour tu comprendras combien Je souffre pour toi et combien Je t'aime. Ainsi tu apprendras \u00e0 M'aimer et \u00e0 souffrir par amour ! \u00bb Mon J\u00e9sus, Tu m'appelles dans ton C\u0153ur pour me faire voir ce que l'Amour Te fait souffrir. Alors j'y entre. Mais que vois-je ?\"},{\"id\":\"PASSION24.HOUR.05.P024\",\"n\":24,\"t\":\"Je vois les prodiges de l'Amour :\"},{\"id\":\"PASSION24.HOUR.05.P025\",\"n\":25,\"t\":\"- ce n'est pas avec des \u00e9pines naturelles que l'Amour Te couronne la T\u00eate,\\nmais avec des \u00e9pines de Feu.\\n- ce n'est pas avec des fouets de cordes qu'Il tourmente ton Corps adorable,\\nmais avec des fouets de Feu.\\n- ce n'est pas avec des clous de fer qu'Il Te perce les Mains et les Pieds,\\nmais avec des clous de Feu.\"},{\"id\":\"PASSION24.HOUR.05.P026\",\"n\":26,\"t\":\"Tout ce qui Te p\u00e9n\u00e8tre jusque dans la moelle de tes Os est Feu. Toute ton Humanit\u00e9 infiniment sainte est transform\u00e9e en Feu. L\u2019Amour Te donne des Peines indicibles et mortelles, plus que ta Passion Elle-m\u00eame.\"},{\"id\":\"PASSION24.HOUR.05.P027\",\"n\":27,\"t\":\"Il fait de ton Sang un bain d'Amour pour toutes les \u00e2mes\\n- qui veulent se laver de quelque t\u00e2che que ce soit et\\n- qui veulent acqu\u00e9rir le droit des fils de l'Amour.\\nJ\u00e9sus, Amour infini,\\nje me sens confuse devant ton Immensit\u00e9.\\nJe vois que, pour pouvoir entrer dans l'Amour et comprendre ton Amour,\\nje dois \u00eatre tout Amour !\"},{\"id\":\"PASSION24.HOUR.05.P028\",\"n\":28,\"t\":\"Mon J\u00e9sus, comme Tu veux ma compagnie et Tu veux que j'entre en Toi, je Te prie de me remplir compl\u00e8tement d'Amour.\"},{\"id\":\"PASSION24.HOUR.05.P029\",\"n\":29,\"t\":\"Par cons\u00e9quent, J\u00e9sus,\\nJe Te supplie de couronner\\n- ma t\u00eate et chacune de mes pens\u00e9es de la couronne de l'Amour.\\nJe T'implore de me flageller avec les fouets de l'Amour :\\n- mon \u00e2me, mon corps, mes sentiments, mes d\u00e9sirs, mes affections.\\nQue tout soit flagell\u00e9 et scell\u00e9 par l'Amour.\\nAmour infini, fais en sorte que tout en moi vive seulement par l'Amour.\\nJ\u00e9sus, centre de tout Amour, je Te supplie\\n- de me clouer les mains et les pieds avec les clous de l'Amour,\\nafin que je devienne Amour, que je comprenne l'Amour.\"},{\"id\":\"PASSION24.HOUR.05.P030\",\"n\":30,\"t\":\"Que je sois v\u00eatue par l'Amour, nourrie par l'Amour ! Que l'Amour me tienne toute clou\u00e9e \u00e0 Toi. Que rien, tant \u00e0 l'int\u00e9rieur qu'\u00e0 l'ext\u00e9rieur de moi, ne me d\u00e9tache de l'Amour ! \u00bb\"}],\"reflections\":[{\"id\":\"PASSION24.HOUR.05.REF.P001\",\"t\":\"Durant cette heure J\u00e9sus \u00e9tait abandonn\u00e9 par son P\u00e8re.\\nIl souffrit un Incendie d'Amour, tel, qu'Il eut le pouvoir\\n- de d\u00e9truire tous les p\u00e9ch\u00e9s imaginables et possibles,\\n- d'enflammer de son Amour toutes les cr\u00e9atures, m\u00eame\\n- de millions et de millions de mondes,\\n- tous les r\u00e9prouv\u00e9s de l'enfer,\\nsi seulement ils n'\u00e9taient pas \u00e9ternellement obstin\u00e9s dans leur iniquit\u00e9.\\nEntrons en J\u00e9sus, p\u00e9n\u00e9trons\\n- dans ses Fibres les plus profondes,\\n- dans ses Pulsations enflamm\u00e9es,\\n- dans son Intelligence embras\u00e9e.\\nEmparons-nous de tout cet Amour qui L'incendie.\\nPuis nous nous plongeons dans sa Volont\u00e9.\\nNous y trouverons toutes les cr\u00e9atures.\\nNous toucherons le c\u0153ur et l'intelligence de chacune avec\\n- l'Amour de J\u00e9sus,\\n- ses D\u00e9sirs,\\n- ses Battements de C\u0153ur et\\n- ses Pens\u00e9es,\\nainsi nous formerons J\u00e9sus en chacune. Ensuite, nous pr\u00e9sentons \u00e0 J\u00e9sus\\ntoutes les cr\u00e9atures qui Le portent dans leur c\u0153ur.\"},{\"id\":\"PASSION24.HOUR.05.REF.P002\",\"t\":\"Et nous les mettons autour de Lui en Lui disant : \u00ab J\u00e9sus, je Te pr\u00e9sente toutes les cr\u00e9atures qui Te poss\u00e8dent dans leur c\u0153ur, pour Te donner du soulagement et du r\u00e9confort. Je ne connais pas d'autre moyen pour soulager ton C\u0153ur ! \u00bb Ce faisant, nous donnerons un vrai soulagement \u00e0 J\u00e9sus. Car il y a tant de flammes qui le br\u00fblent, qu'Il nous dit et nous redit :\"},{\"id\":\"PASSION24.HOUR.05.REF.P003\",\"t\":\"\u00ab Je suis calcin\u00e9 par l'Amour et il n'y a personne qui veut mon Amour. De gr\u00e2ce, soulagez-Moi. Acceptez mon Amour et donnez-Moi de l'amour ! \u00bb Pour nous conformer en toute chose \u00e0 J\u00e9sus, nous devons rentrer en nous-m\u00eames et nous poser cette question : \u00ab En tout ce que je fais, est-ce qu\u2019il y a un flux continu d'Amour qui circule entre Dieu et moi ? \u00bb\"},{\"id\":\"PASSION24.HOUR.05.REF.P004\",\"t\":\"Notre vie est habit\u00e9e par un incessant flux d'Amour nous venant de Dieu.\\n- Quand nous pensons, il y a ce flux d'Amour.\\n- quand nous agissons, il y a ce flux d'Amour,\\n- la parole est Amour, - les battements de notre c\u0153ur sont Amour.\"},{\"id\":\"PASSION24.HOUR.05.REF.P005\",\"t\":\"Nous recevons tout de Dieu.\\n- Nos actions courent-elles vers Dieu avec amour ?\\n- J\u00e9sus trouve-t-Il en nous le doux enchantement de son Amour qui,\\n\u00e0 travers nous, retourne vers Lui, afin que, ravi par cet enchantement,\\nIl surabonde d'un Amour encore plus grand pour nous ?\\nSi en tout ce que nous faisons,\\nnotre amour pour Dieu n'est pas notre premier mobile d'action,\\n- entrons en nous-m\u00eames et demandons-Lui pardon de Lui avoir fait perdre\\n- le doux enchantement de notre retour d'amour.\\nNous laissons-nous travailler par les Mains divines\\ncomme ce fut le cas pour l'Humanit\u00e9 de J\u00e9sus ?\\nTout ce qui nous arrive, sauf le p\u00e9ch\u00e9,\\nnous devons le consid\u00e9rer comme une Activit\u00e9 divine intense en nous.\"},{\"id\":\"PASSION24.HOUR.05.REF.P006\",\"t\":\"Si telle n'est pas notre attitude,\\n- nous refusons au P\u00e8re la gloire qui Lui est due,\\n- nous mettons en fuite la Vie divine en nous, et\\n- nous perdons la saintet\u00e9.\"},{\"id\":\"PASSION24.HOUR.05.REF.P007\",\"t\":\"Tout ce que nous ressentons en nous :\\n- inspirations, - tribulations, - gr\u00e2ces,\\nn'est rien d'autre que l'Activit\u00e9 intense de l'Amour en nous.\"},{\"id\":\"PASSION24.HOUR.05.REF.P008\",\"t\":\"Voyons-nous les choses de cette mani\u00e8re ? Donnons-nous \u00e0 J\u00e9sus la libert\u00e9 de travailler en nous ?\"},{\"id\":\"PASSION24.HOUR.05.REF.P009\",\"t\":\"Ou bien en prenant tout ce qui nous arrive dans un sens humain, regardant tout comme indiff\u00e9rent, repoussons-nous l'Activit\u00e9 intense de Dieu en nous, Le contraignant \u00e0 se croiser les bras ?\"},{\"id\":\"PASSION24.HOUR.05.REF.P010\",\"t\":\"Nous abandonnons-nous entre ses Bras comme des morts\\npour recevoir tous les coups de pinceau\\nque le Seigneur nous donnera pour notre sanctification ?\\nMon Amour et mon Tout,\\n- que ton Amour m'inonde de toute part et\\n- br\u00fble en moi tout ce qui n'est pas de Toi.\\nFais en sorte que ce qui est \u00e0 moi accoure vers Toi,\\npour que Tu puisses br\u00fbler tout ce qui pourrait attrister ton C\u0153ur.\\nQue l'Amour me tienne toute clou\u00e9e \u00e0 Toi.\\nQue rien, tant \u00e0 l'int\u00e9rieur qu'\u00e0 l'ext\u00e9rieur de moi, ne me d\u00e9tache de l'Amour ! \u00bb\"}],\"subsections\":[]},{\"hour_id\":\"PASSION24.HOUR.06\",\"hour_number\":6,\"display_time\":\"22h \u00e0 23h\",\"title\":\"Deuxi\u00e8me Heure de l\u2019Agonie dans le Jardin\",\"short_title\":\"Deuxi\u00e8me Heure de l\u2019Agonie dans le Jardin\",\"source_pages\":[76,77,78,79,80,81,82,83,84],\"opening_prayer_ids\":[\"PASSION24.PRAYER.BEFORE_EACH_HOUR\",\"PASSION24.PRAYER.HOLY_HOUR_PREPARATION\"],\"closing_prayer_ids\":[\"PASSION24.PRAYER.HOLY_HOUR_THANKSGIVING\"],\"paragraphs\":[{\"id\":\"PASSION24.HOUR.06.P001\",\"n\":1,\"t\":\"Mon J\u00e9sus, Tu Te trouves d\u00e9j\u00e0 depuis une heure dans le Jardin. L\u2019Amour a pris chez Toi la supr\u00e9matie. Il Te fait souffrir en un seul coup ce que les bourreaux Te feront souffrir tout au long de ton am\u00e8re Passion.\"},{\"id\":\"PASSION24.HOUR.06.P002\",\"n\":2,\"t\":\"L'Amour parvient m\u00eame \u00e0 Te faire souffrir ce que les bourreaux ne pourront pas Te faire souffrir, jusque dans les parties les plus profondes de ta Personne divine !\"},{\"id\":\"PASSION24.HOUR.06.P003\",\"n\":3,\"t\":\"Mon J\u00e9sus, je vois que, m\u00eame si tes pas sont vacillants, Tu veux marcher.\\nDis-moi, mon Bien, o\u00f9 veux-Tu aller ?\\nAh ! Tu vas retrouver tes bien-aim\u00e9s disciples.\\nJe veux T'accompagner pour Te soutenir de mes bras si Tu vacilles !\\nEt voici une autre amertume pour ton C\u0153ur ! Tes ap\u00f4tres dorment.\\nEt toi, toujours compatissant, Tu les appelles. Tu les r\u00e9veilles.\\nAvec un Amour paternel,\\n- Tu les r\u00e9primandes,\\n- Tu leur recommandes de veiller et de prier.\\nPuis Tu retournes dans le Jardin.\\nMais ton C\u0153ur porte une autre Blessure.\\nMon Amour, je vois dans cette Blessure, toutes les blessures\\ndes \u00e2mes qui Te sont consacr\u00e9es et qui\\n- soit \u00e0 cause de la tentation,\\n- soit par n\u00e9gligence,\\nau lieu de se serrer contre Toi en veillant et en priant, se laissent aller.\"},{\"id\":\"PASSION24.HOUR.06.P004\",\"n\":4,\"t\":\"Au lieu de faire des progr\u00e8s dans l'amour et dans l'union avec Toi, somnolentes, elles s'atti\u00e9dissent et reculent !\"},{\"id\":\"PASSION24.HOUR.06.P005\",\"n\":5,\"t\":\"Amoureux passionn\u00e9, combien je compatis avec Toi. Je veux r\u00e9parer toutes leurs ingratitudes ! Ce genre d'offenses attriste le plus ton C\u0153ur adorable. Cette amertume qui T'opprime est si grande, qu'elle Te m\u00e8ne au d\u00e9lire.\"},{\"id\":\"PASSION24.HOUR.06.P006\",\"n\":6,\"t\":\"Amour infini, ton Sang, qui bouille dans tes Veines, vainc tout et oublie tout !\\nJe Te vois prostern\u00e9 par terre et en pri\u00e8re profonde.\\nTu T'offres, Tu r\u00e9pares et, au nom de tous, Tu cherches \u00e0 glorifier le P\u00e8re.\\nJ\u00e9sus,\\nje me prosterne avec Toi. Je veux faire ce que Tu fais.\\nMais que vois-je ?\\nJe Te vois charg\u00e9 de tous les p\u00e9ch\u00e9s du monde :\\n- nos mis\u00e8res, nos faiblesses, nos d\u00e9lits les plus \u00e9normes,\\n- nos ingratitudes les plus noires, nos iniquit\u00e9s les plus \u00e9pouvantables,\\n- nos cruaut\u00e9s les plus atroces, nos haines,\\n- nos massacres, nos blasph\u00e8mes, nos h\u00e9r\u00e9sies, nos schismes,\\n- et tout l'ab\u00eeme des bassesses humaines\\nse pr\u00e9sentent devant Toi, T'oppriment, T'\u00e9crasent, Te blessent.\"},{\"id\":\"PASSION24.HOUR.06.P007\",\"n\":7,\"t\":\"Et Toi, que fais-Tu ? Ton Sang qui bouille dans tes Veines fait face \u00e0 ces offenses. Tes Veines s'ouvrent. Le Sang sort \u00e0 l'ext\u00e9rieur, Il baigne tes v\u00eatements et, coule par terre :\"},{\"id\":\"PASSION24.HOUR.06.P008\",\"n\":8,\"t\":\"Tu donnes ton Sang pour ces offenses, ta Vie pour contrer la mort. \u00d4 Amour, \u00e0 quel \u00e9tat je Te vois r\u00e9duit ! Tu expires !\"},{\"id\":\"PASSION24.HOUR.06.P009\",\"n\":9,\"t\":\"Mon Bien, ma douce Vie, de gr\u00e2ce, ne meurs pas ! D\u00e9gage ton Visage de cette terre baign\u00e9e de ton Sang. Viens dans mes bras. Fais en sorte que moi, en T'embrassant, je meure \u00e0 ta place.\"},{\"id\":\"PASSION24.HOUR.06.P010\",\"n\":10,\"t\":\"J'entends ta Voix moribonde dire :\"},{\"id\":\"PASSION24.HOUR.06.P011\",\"n\":11,\"t\":\"\u00ab P\u00e8re, si c'est possible, que s'\u00e9carte de Moi ce calice. Cependant, non pas ma Volont\u00e9, mais la Tienne. \u00bb C'est la premi\u00e8re fois que j'entends ces mots de ta Bouche. Comme les Accents de ta Voix d\u00e9chirent mon c\u0153ur ! Toutes les r\u00e9voltes des cr\u00e9atures se pr\u00e9sentent devant Toi Ce \u00ab Fiat Voluntas Tua \u00bb qui devrait \u00eatre le principe de Vie de toute cr\u00e9ature, Tu le vois rejet\u00e9 par presque toutes. En cons\u00e9quence, au lieu de trouver la Vie, elles trouvent la mort.\"},{\"id\":\"PASSION24.HOUR.06.P012\",\"n\":12,\"t\":\"Et Toi, Tu veux\\n- donner la Vie \u00e0 toutes et\\n- faire une R\u00e9paration solennelle au P\u00e8re pour leurs r\u00e9voltes,\\net Tu r\u00e9p\u00e8tes une deuxi\u00e8me fois :\"},{\"id\":\"PASSION24.HOUR.06.P013\",\"n\":13,\"t\":\"\u00ab P\u00e8re, si c'est possible, que s'\u00e9carte de Moi ce calice. Ce calice, pour Moi, est tr\u00e8s amer. Cependant, non pas ma Volont\u00e9, mais la Tienne. \u00bb\"},{\"id\":\"PASSION24.HOUR.06.P014\",\"n\":14,\"t\":\"Mon Bien, l'amertume qui T\u2019opprime est si grande que Tu en es r\u00e9duit \u00e0 la derni\u00e8re extr\u00e9mit\u00e9. Tu agonises, Tu es sur le point de rendre le dernier soupir !\"},{\"id\":\"PASSION24.HOUR.06.P015\",\"n\":15,\"t\":\"J\u00e9sus, mon Amour, pendant que Tu es entre mes bras, je veux m'unir \u00e0 Toi, r\u00e9parer et compatir avec Toi pour tous les manquements qui se font contre ta Volont\u00e9 infiniment sainte et, Je veux en m\u00eame temps, Te prier pour qu'en toutes choses, je fasse moi-m\u00eame toujours ta Volont\u00e9 !\"},{\"id\":\"PASSION24.HOUR.06.P016\",\"n\":16,\"t\":\"Que ta Volont\u00e9 soit\\n- ma respiration, mon c\u0153ur, ma sensibilit\u00e9,\\n- ma pens\u00e9e, ma vie et mon triomphe \u00e0 l'heure de ma mort.\\nJ\u00e9sus,\\nde gr\u00e2ce, ne meurs pas.\\n- O\u00f9 irai-je sans Toi ? \u00c0 qui vais-je m'adresser ? Qui m'aidera ?\"},{\"id\":\"PASSION24.HOUR.06.P017\",\"n\":17,\"t\":\"Tout sera fini pour moi !\"},{\"id\":\"PASSION24.HOUR.06.P018\",\"n\":18,\"t\":\"De gr\u00e2ce, ne me laisse pas, garde-moi toujours avec Toi. Qu'il n'arrive jamais, ne f\u00fbt-ce qu'un instant, que je sois s\u00e9par\u00e9e de Toi ! Laisse-moi Te soulager, r\u00e9parer pour Toi, compatir avec Toi \u00e0 la place de tous. Car je vois que tous les p\u00e9ch\u00e9s, quels qu'ils soient, T\u2019\u00e9crasent ! Mon Amour, je donne un baiser \u00e0 ta T\u00eate infiniment sainte. Mais que vois-je ? Je vois toutes les pens\u00e9es mauvaises dont Tu ressens l'horrible laideur. Chacune d'elles est une \u00e9pine qui pique cruellement ta T\u00eate. J\u00e9sus, les Juifs ne Te mettront qu'une seule couronne d'\u00e9pines. Mais les pens\u00e9es mauvaises de toutes les cr\u00e9atures mettent tellement de couronnes terribles sur ta T\u00eate adorable !\"},{\"id\":\"PASSION24.HOUR.06.P019\",\"n\":19,\"t\":\"J\u00e9sus,\\nje compatis avec Toi !\\nJe voudrais Te mettre autant de Couronnes de Gloire.\\n- Pour Te soulager et\\n- pour Te donner de la compassion pour tous,\\nje T'offre les intelligences ang\u00e9liques et ta propre Intelligence.\\nJ\u00e9sus,\\nje donne un baiser \u00e0 tes Yeux compatissants.\\nJe vois en eux tous les regards m\u00e9chants des cr\u00e9atures qui font couler sur ton\\nVisage des Larmes de Sang. Je compatis avec Toi !\\nJe voudrais\\n- soulager ta Vue et\\n- disposer devant Toi toutes les d\u00e9lices visuels du Ciel et de la terre.\\nJ\u00e9sus,\\nmon Bien, je donne un baiser \u00e0 tes Oreilles infiniment saintes.\\nMais qu'entends-je ?\\nJ'entends en elles\\n- l'\u00e9cho d'horribles blasph\u00e8mes,\\n- des cris de vengeance et de mal\u00e9dictions.\"},{\"id\":\"PASSION24.HOUR.06.P020\",\"n\":20,\"t\":\"Amour insatiable,\\nje compatis avec Toi et je veux Te consoler et\\nje veux faire r\u00e9sonner \u00e0 tes Oreilles\\n- toutes les Harmonies du Ciel,\\n- la Voix exquise de ta ch\u00e8re Maman,\\n- les accents embras\u00e9s de Marie Madeleine et de toutes les \u00e2mes aimantes.\\nJ\u00e9sus, ma Vie,\\nje Te donne un baiser fervent sur ton Visage.\"},{\"id\":\"PASSION24.HOUR.06.P021\",\"n\":21,\"t\":\"Ta beaut\u00e9 est sans pareille !\\nPourtant,\\nce Visage que les anges contemplent avec ravissement,\\n- les cr\u00e9atures le giflent et le souillent par des crachats.\"},{\"id\":\"PASSION24.HOUR.06.P022\",\"n\":22,\"t\":\"Mon Amour, quelle effronterie !\\nJe voudrais crier assez fort pour mettre ces cr\u00e9atures en fuite !\\nJe compatis avec Toi et pour r\u00e9parer ces insultes.\\nJe me tourne vers la Tr\u00e8s Sainte Trinit\u00e9 pour demander\\n- les Baisers du P\u00e8re et du Saint-Esprit,\\n- les Caresses divines de leurs Mains cr\u00e9atrices.\"},{\"id\":\"PASSION24.HOUR.06.P023\",\"n\":23,\"t\":\"Je m'adresse aussi \u00e0 ta Maman c\u00e9leste, afin qu'elle me donne\\n- ses Baisers, les Caresses de ses Mains maternelles,\\n- ses Adorations profondes.\\nJe T'offre tout cela en r\u00e9paration des offenses\\nqui sont faites \u00e0 ton Visage infiniment beau et saint !\\nJ\u00e9sus,\\nMon doux Bien, je donne un baiser \u00e0 ta Bouche infiniment douce.\\nElle est remplie d'amertume\\n- par les horribles blasph\u00e8mes,\\n- par la naus\u00e9e que Te donnent les ivresses et la gourmandise,\\n- par les conversations obsc\u00e8nes,\\n- par les pri\u00e8res mal faites,\\n- par les enseignements pernicieux,\\n- par tout le mal que fait l'homme au moyen de sa langue.\"},{\"id\":\"PASSION24.HOUR.06.P024\",\"n\":24,\"t\":\"J\u00e9sus,\\nje compatis avec Toi.\\nJe veux enlever l'amertume de ta Bouche en T'offrant\\n- toutes les louanges ang\u00e9liques et\\n- le bon usage que font de leur langue tant de saints chr\u00e9tiens.\\nJ\u00e9sus,\\nMon Amour opprim\u00e9, je donne un baiser \u00e0 ton Cou.\\nJe le vois charg\u00e9 de cordes et de cha\u00eenes \u00e0 cause des attachements\\ncoupables des cr\u00e9atures.\"},{\"id\":\"PASSION24.HOUR.06.P025\",\"n\":25,\"t\":\"Je compatis avec Toi. Pour Te soulager, je T'offre l'union indissoluble des trois Personnes divines. Je me fonde au milieu de cette union et je Te tends les bras. Je forme de douces cha\u00eenes d'amour autour de ton Cou et j'\u00e9loigne de Toi les cordes des attachements coupables qui Te font suffoquer, tandis que je Te serre fort contre mon C\u0153ur,\"},{\"id\":\"PASSION24.HOUR.06.P026\",\"n\":26,\"t\":\"J\u00e9sus, Force divine, je donne un baiser \u00e0 tes \u00c9paules infiniment saintes. Je les vois lac\u00e9r\u00e9es, leur chair presque arrach\u00e9e par morceaux \u00e0 cause des scandales et des mauvais exemples des cr\u00e9atures.\"},{\"id\":\"PASSION24.HOUR.06.P027\",\"n\":27,\"t\":\"Je compatis avec Toi. Pour Te soulager je T'offre\\n- tes exemples infiniment saints,\\n- ceux de la Reine Maman, et\\n- ceux de tous les saints.\\nMon J\u00e9sus,\\n- je fais courir mes baisers sur chacune de tes Plaies,\\n- j'y enferme les \u00e2mes qui, \u00e0 la suite de scandales,\\nont \u00e9t\u00e9 arrach\u00e9es \u00e0 ton C\u0153ur,\\npour ainsi remettre en \u00e9tat les Chairs de ta sainte Humanit\u00e9.\\nMon J\u00e9sus angoiss\u00e9, je donne un baiser \u00e0 ta Poitrine.\\nJe vois ta poitrine bless\u00e9e\\n- par les froideurs et les ti\u00e9deurs des cr\u00e9atures,\\n- par leur manque de r\u00e9ciprocit\u00e9 et leurs ingratitudes.\\nJe compatis avec Toi. Pour Te soulager je T'offre la parfaite correspondance\\nd'Amour des trois Personnes divines.\"},{\"id\":\"PASSION24.HOUR.06.P028\",\"n\":28,\"t\":\"Mon J\u00e9sus,\\nMoi, je me plonge dans ton Amour.\\n- Je veux Te faire un abri pour Te prot\u00e9ger des nouveaux coups\\nque les cr\u00e9atures Te porteront par leurs p\u00e9ch\u00e9s.\\n- Je veux blesser ces cr\u00e9atures par ton Amour,\\nafin qu'elles n'osent plus T'offenser.\\n- Je veux verser ton propre Amour sur ta divine Poitrine\\npour la soulager et la gu\u00e9rir.\\nMon J\u00e9sus,\\nje donne un baiser \u00e0 tes Mains cr\u00e9atrices.\\nJe vois toutes les actions mauvaises des cr\u00e9atures qui, comme autant de\\nclous, transpercent tes Mains infiniment saintes.\\nCe n'est pas par trois clous, comme sur la Croix, que Tu es transperc\u00e9,\\nmais par autant de clous qu'il y a d'\u0153uvres mauvaises faites par les cr\u00e9atures.\"},{\"id\":\"PASSION24.HOUR.06.P029\",\"n\":29,\"t\":\"Je compatis avec Toi. Pour Te soulager je T'offre\\n- toutes les \u0153uvres saintes des martyrs,\\n- leur courage \u00e0 donner leur sang et leur vie par amour pour Toi.\\nEn somme,\"},{\"id\":\"PASSION24.HOUR.06.P030\",\"n\":30,\"t\":\"je veux, \u00f4 mon J\u00e9sus, T'offrir toutes les bonnes \u0153uvres des cr\u00e9atures pour T'enlever les nombreux clous que constituent leurs \u0153uvres mauvaises. J\u00e9sus, je donne un baiser \u00e0 tes Pieds infiniment saints, infatigables dans la recherche des \u00e2mes. En eux, Tu renfermes tous les pas des cr\u00e9atures. Mais Tu sens que beaucoup Te fuient et Tu voudrais les retenir. Par chacun de leurs mauvais pas, Tu Te sens mettre un clou. Et Tu veux Te servir de leurs propres clous pour les clouer \u00e0 ton Amour. La Souffrance que Tu ressens et l'effort que Tu fais pour les clouer \u00e0 ton Amour sont si grands que Tu en trembles.\"},{\"id\":\"PASSION24.HOUR.06.P031\",\"n\":31,\"t\":\"Mon Dieu et mon Bien, je compatis avec Toi.\\nPour Te consoler je T'offre les pas des bons religieux et des \u00e2mes fid\u00e8les\\nqui risquent leur vie pour sauver les \u00e2mes.\\nJ\u00e9sus,\\nje donne un baiser \u00e0 ton C\u0153ur !\\nTu continues \u00e0 agoniser,\\n- non pas tant \u00e0 cause de ce que Te feront souffrir les Juifs,\\n- mais \u00e0 cause de la douleur que Te donnent les offenses\\nde toutes les cr\u00e9atures.\\nDurant ces Heures, Tu veux donner\\n- la supr\u00e9matie \u00e0 l'Amour,\\n- la deuxi\u00e8me place \u00e0 tous les p\u00e9ch\u00e9s pour lesquels\\nTu expies, Tu r\u00e9pares, Tu glorifies le P\u00e8re et Tu apaises la Justice divine.\\n- la troisi\u00e8me place aux Juifs qui Te feront souffrir ta Passion.\"},{\"id\":\"PASSION24.HOUR.06.P032\",\"n\":32,\"t\":\"Ainsi Tu nous montres que la Passion que Te feront souffrir les Juifs\\n- ne sera rien d'autre que le reflet de la double Passion extr\u00eamement am\u00e8re\\nque Te font souffrir l'Amour et les p\u00e9ch\u00e9s.\\nC'est pourquoi je vois dans ton C\u0153ur, toutes trois concentr\u00e9es :\\n- la lance de l'Amour, la lance du p\u00e9ch\u00e9, et la lance des Juifs.\"},{\"id\":\"PASSION24.HOUR.06.P033\",\"n\":33,\"t\":\"Ton C\u0153ur amoureux souffre\\n- des convulsions violentes, des impatiences d'Amour,\\n- des D\u00e9sirs qui Te consument,\\n- des Pulsations embras\u00e9es qui voudraient enflammer tous les c\u0153urs.\"},{\"id\":\"PASSION24.HOUR.06.P034\",\"n\":34,\"t\":\"Tu ressens dans ton C\u0153ur la souffrance que Te procurent les cr\u00e9atures qui, par leurs d\u00e9sirs mauvais, par leurs affections et leurs \u00e9motions d\u00e9sordonn\u00e9es, cherchent d'autres amours que le Tien.\"},{\"id\":\"PASSION24.HOUR.06.P035\",\"n\":35,\"t\":\"J\u00e9sus, combien Tu souffres ! Je Te vois T'\u00e9vanouir, submerg\u00e9 par les vagues de nos iniquit\u00e9s !\"},{\"id\":\"PASSION24.HOUR.06.P036\",\"n\":36,\"t\":\"Je compatis avec Toi.\\nJe veux adoucir l'amertume de ton C\u0153ur triplement transperc\u00e9, en T'offrant\\n- les Douceurs \u00e9ternelles,\\n- l'Amour exquis de ta ch\u00e8re Maman et\\n- celui de tous ceux qui T'aiment vraiment.\\nMon J\u00e9sus,\\nfais que mon propre c\u0153ur tire sa Vie de ton C\u0153ur,\\nafin qu'il vive seulement de ton Amour.\\nEt qu\u2019en toute offense que Tu recevras, je sois toujours pr\u00eate \u00e0 T'offrir\\nsoulagement, r\u00e9confort, r\u00e9paration, actes d'amour, sans interruption.\"}],\"reflections\":[{\"id\":\"PASSION24.HOUR.06.REF.P001\",\"t\":\"Pendant sa deuxi\u00e8me Heure d'Agonie dans le Jardin,\\ntous les p\u00e9ch\u00e9s de tous les temps se sont pr\u00e9sent\u00e9s devant J\u00e9sus. Il a pris sur\\nLui tous ces p\u00e9ch\u00e9s pour donner au P\u00e8re Gloire et R\u00e9paration compl\u00e8tes.\\nIl \u00e9prouva dans son C\u0153ur tous nos \u00e9tats d'\u00e2me sans jamais cesser de prier.\\nEt nous, dans nos divers \u00e9tats d'\u00e2me - froideurs, duret\u00e9s, tentations -,\\n- est-ce que nous savons prier sans cesse ?\\n- Sommes-nous constants dans la pri\u00e8re ?\\n- Savons-nous rester avec courage aux pieds de J\u00e9sus, Lui donner tout ce que\\nnous souffrons afin qu'Il retrouve en nous sa propre Humanit\u00e9 ?\"},{\"id\":\"PASSION24.HOUR.06.REF.P002\",\"t\":\"L'Humanit\u00e9 de J\u00e9sus, que faisait-elle ?\\nElle glorifiait son P\u00e8re, elle expiait, elle priait pour le salut des \u00e2mes.\\nEt nous, en tout ce que nous faisons, portons-nous ces trois intentions ?\\nMon J\u00e9sus,\\n- pour compatir avec Toi et\\n- pour Te soulager de l'accablement total dans lequel Tu Te trouves,\\nje m'\u00e9l\u00e8ve jusqu'au Ciel et je fais mienne ta propre Divinit\u00e9.\\nEn Te la pr\u00e9sentant, je veux r\u00e9parer toutes les offenses des cr\u00e9atures.\"},{\"id\":\"PASSION24.HOUR.06.REF.P003\",\"t\":\"Je T'offre\\n- ta Beaut\u00e9 pour Te consoler de la laideur du p\u00e9ch\u00e9,\\n- ta Saintet\u00e9 pour Te consoler de l'horreur de toutes ces \u00e2mes\\nqui Te font \u00e9prouver le d\u00e9go\u00fbt parce qu'elles sont mortes \u00e0 la Gr\u00e2ce,\\n- ta Paix pour Te consoler des discordes et des r\u00e9voltes\\nde toutes les cr\u00e9atures,\\n- tes Harmonies pour d\u00e9dommager ton Ou\u00efe des propos mauvais\\ndes cr\u00e9atures.\\nMon J\u00e9sus,\\nje veux T'offrir autant d'Actes divins r\u00e9parateurs qu'il y a d'offenses\\nqui T'attaquent comme si elles voulaient Te donner la mort.\\nJe veux projeter ta Divinit\u00e9 sur toutes les cr\u00e9atures,\\nafin que, \u00e0 ton Contact divin, elles n'osent plus T'offenser.\\nJ\u00e9sus, seulement ainsi, je pourrai compatir avec Toi pour toutes les offenses\\nque Tu re\u00e7ois des cr\u00e9atures.\"},{\"id\":\"PASSION24.HOUR.06.REF.P004\",\"t\":\"Ma douce Vie, que mes pri\u00e8res et mes peines s'\u00e9l\u00e8vent toujours vers le Ciel\\n- pour faire pleuvoir sur toutes les cr\u00e9atures ta Lumi\u00e8re et\\n- absorber en moi ta propre Vie.\"}],\"subsections\":[]},{\"hour_id\":\"PASSION24.HOUR.07\",\"hour_number\":7,\"display_time\":\"23h \u00e0 24h\",\"title\":\"Troisi\u00e8me Heure de l\u2019Agonie dans le Jardin\",\"short_title\":\"Troisi\u00e8me Heure de l\u2019Agonie dans le Jardin\",\"source_pages\":[85,86,87,88,89,90,91,92,93,94,95,96,97,98,99],\"opening_prayer_ids\":[\"PASSION24.PRAYER.BEFORE_EACH_HOUR\",\"PASSION24.PRAYER.HOLY_HOUR_PREPARATION\"],\"closing_prayer_ids\":[\"PASSION24.PRAYER.HOLY_HOUR_THANKSGIVING\"],\"paragraphs\":[{\"id\":\"PASSION24.HOUR.07.P001\",\"n\":1,\"t\":\"Mon doux Bien,\\nje Te regarde et je vois que Tu continues \u00e0 agoniser.\\nTon Sang s'\u00e9coule de tout ton Corps et,\\n- ne pouvant plus Te tenir debout,\\n- Tu tombes dans la marre de ton Sang r\u00e9pandu.\"},{\"id\":\"PASSION24.HOUR.07.P002\",\"n\":2,\"t\":\"\u00d4 mon Amour, mon c\u0153ur se brise \u00e0 Te voir\\n- si faible et\\n- ext\u00e9nu\u00e9 !\\nTon adorable Visage et tes Mains cr\u00e9atrices\\n- reposent sur le sol et\\n- trempent dans ton propre Sang.\"},{\"id\":\"PASSION24.HOUR.07.P003\",\"n\":3,\"t\":\"Aux fleuves d'iniquit\u00e9s provenant des cr\u00e9atures, Tu opposes les fleuves de ton\\nSang pr\u00e9cieux pour faire en sorte\\n- que toutes nos fautes soient noy\u00e9es dans ce Sang et\\n- que chacun profite de ton Pardon.\"},{\"id\":\"PASSION24.HOUR.07.P004\",\"n\":4,\"t\":\"Mais, de gr\u00e2ce, \u00f4 mon J\u00e9sus, rel\u00e8ve-Toi, c'est trop ! Mon aimable J\u00e9sus semble mourir dans son Sang, mais l'Amour Lui donne une nouvelle Vie. Je Le vois bouger avec peine. Il se l\u00e8ve, et tout tremp\u00e9 de Sang et de boue, il semble qu'Il veuille marcher. Mais, Il n\u2019en a pas la force. C'est \u00e0 peine s'Il arrive \u00e0 se tra\u00eener.\"},{\"id\":\"PASSION24.HOUR.07.P005\",\"n\":5,\"t\":\"Ma douce Vie, laisse-moi Te serrer dans mes bras. Tu vas voir tes chers disciples ? Mais quelle n'est pas ta Souffrance de les trouver de nouveau endormis ! D'une Voix presque \u00e9teinte, Tu les interpelles :\"},{\"id\":\"PASSION24.HOUR.07.P006\",\"n\":6,\"t\":\"\u00ab Mes fils, ne dormez pas, l'heure est proche. Ne voyez-vous pas \u00e0 quel \u00e9tat Je suis r\u00e9duit ? De gr\u00e2ce, aidez-Moi, ne M'abandonnez pas en ces Heures si terribles ! \u00bb J\u00e9sus, Tu vacilles et Tu es sur le point de tomber. Alors Jean \u00e9tend les bras pour Te soutenir. Tu es tellement m\u00e9connaissable. Si ce n'\u00e9tait pas de ta suave Voix, tes disciples ne Te reconna\u00eetraient pas. Puis, leur recommandant de veiller et de prier, Tu retournes dans le Jardin.\"},{\"id\":\"PASSION24.HOUR.07.P007\",\"n\":7,\"t\":\"Je d\u00e9c\u00e8le dans ton C\u0153ur une nouvelle Blessure.\\nJ'y vois les fautes de ces \u00e2mes\\n- que Tu as combl\u00e9es de tes Faveurs, Dons et Caresses,\\net qui, durant cette nuit de l'\u00e9preuve,\\n- restent comme assoupies et endormies,\\n- perdent ainsi l'esprit de pri\u00e8re et de veille continuelles.\\nMon J\u00e9sus,\\nil est pourtant vrai que pour l'\u00e2me\\n- qui a go\u00fbt\u00e9 \u00e0 tes Caresses et qui, par la suite en est priv\u00e9e,\\nil lui faut une grande force, presque un miracle, pour r\u00e9sister \u00e0 l'\u00e9preuve.\"},{\"id\":\"PASSION24.HOUR.07.P008\",\"n\":8,\"t\":\"Par cons\u00e9quent :\\nJe compatis avec Toi pour ces \u00e2mes dont\\n- les n\u00e9gligences,\\n- les l\u00e9g\u00e8ret\u00e9s et\\n- les offenses sont particuli\u00e8rement am\u00e8res \u00e0 ton C\u0153ur.\"},{\"id\":\"PASSION24.HOUR.07.P009\",\"n\":9,\"t\":\"Je Te prie,\\n- au cas o\u00f9 elles parviendraient \u00e0 faire un seul pas qui puisse Te d\u00e9plaire,\\n- de les entourer de tant de Gr\u00e2ces qu'elles les arr\u00eatent\\nafin qu'elles ne perdent pas l'esprit de pri\u00e8re continuelle !\\nMon doux J\u00e9sus,\\nTu retournes dans le Jardin et on a l'impression que Tu n'en peux plus.\\nTu \u00e9l\u00e8ves au Ciel ta Face tremp\u00e9e de Sang et de terre, et\\nTu r\u00e9p\u00e8tes pour la troisi\u00e8me fois :\"},{\"id\":\"PASSION24.HOUR.07.P010\",\"n\":10,\"t\":\"\u00ab P\u00e8re, si c'est possible, que s'\u00e9carte de Moi ce calice. P\u00e8re Saint, aide-Moi, J'ai besoin de r\u00e9confort.\"},{\"id\":\"PASSION24.HOUR.07.P011\",\"n\":11,\"t\":\"Il est vrai qu'\u00e0 cause des fautes charg\u00e9es sur mon dos,\\nJe suis\\n- r\u00e9pugnant, repoussant,\\n- le dernier parmi les hommes devant ta Majest\u00e9 infinie,\\nComme ta Justice est indign\u00e9e contre Moi !\"},{\"id\":\"PASSION24.HOUR.07.P012\",\"n\":12,\"t\":\"Mais regarde-Moi, \u00f4 P\u00e8re. Je suis toujours ton Fils et Je fais un avec Toi. De gr\u00e2ce, aie piti\u00e9 de Moi. \u00d4 P\u00e8re, ne Me laisse pas sans r\u00e9confort ! \u00bb Puis il me semble entendre que Tu appelles \u00e0 l'aide ta ch\u00e8re Maman :\"},{\"id\":\"PASSION24.HOUR.07.P013\",\"n\":13,\"t\":\"\u00ab Douce Maman, serre-Moi dans tes Bras comme tu le faisais quand J'\u00e9tais enfant.\"},{\"id\":\"PASSION24.HOUR.07.P014\",\"n\":14,\"t\":\"Donne-Moi ce lait que tu Me donnais alors\\n- pour Me restaurer et adoucir les amertumes de mon Agonie.\\nDonne-Moi ton C\u0153ur, qui \u00e9tait tout mon contentement.\"},{\"id\":\"PASSION24.HOUR.07.P015\",\"n\":15,\"t\":\"Maman, Marie Madeleine, chers ap\u00f4tres, vous tous qui M'aimez,\\n- aidez-Moi,\\n- r\u00e9confortez-Moi,\\n- ne Me laissez pas seul en ces derniers moments,\\n- faites cercle autour de Moi,\\n- r\u00e9confortez-Moi par votre compagnie et votre amour ! \u00bb\\nJ\u00e9sus, mon Amour,\\n- qui pourrait r\u00e9sister en Te voyant \u00e0 cette extr\u00e9mit\u00e9 ?\\n- Pourrait-il y avoir un c\u0153ur si dur qu'il ne se briserait pas\\n\u00e0 Te voir ainsi suffoquer dans ton Sang ?\\n- Qui ne fondrait pas en larmes en entendant tes Accents douloureux\\nen qu\u00eate d'aide et de r\u00e9confort ?\"},{\"id\":\"PASSION24.HOUR.07.P016\",\"n\":16,\"t\":\"Mon J\u00e9sus,\\nje vois le P\u00e8re qui T'envoie un ange pour Te r\u00e9conforter et T'aider, afin\\n- que Tu sortes de cet \u00e9tat d'agonie et\\n- que Tu puisses Te remettre Toi-m\u00eame entre les mains des Juifs.\\nTandis que Tu seras avec l'ange, moi je parcourrai le Ciel et la terre.\"},{\"id\":\"PASSION24.HOUR.07.P017\",\"n\":17,\"t\":\"Tu me permettras de prendre ce Sang que Tu as vers\u00e9, afin que je puisse\\n- le donner \u00e0 tous les hommes comme gage de salut et\\n- T'apporter en \u00e9change et en guise de r\u00e9confort,\\nleurs affections, leurs \u00e9motions, leurs pens\u00e9es, leurs pas, leurs \u0153uvres.\\nMaman c\u00e9leste,\\nje viens \u00e0 toi pour que nous allions ensemble chez toutes les \u00e2mes,\\npour leur donner le Sang de J\u00e9sus.\"},{\"id\":\"PASSION24.HOUR.07.P018\",\"n\":18,\"t\":\"Douce Maman, J\u00e9sus veut du r\u00e9confort, et le plus grand r\u00e9confort que nous puissions Lui donner est de Lui amener des \u00e2mes. Marie Madeleine, accompagne-nous. Tous les anges, venez voir \u00e0 quel point J\u00e9sus est accabl\u00e9. Il veut de tous du r\u00e9confort. Son accablement est si grand qu'Il ne refuse personne. Mon J\u00e9sus, Tu bois le calice d'amertume que le P\u00e8re c\u00e9leste T'envoie.\"},{\"id\":\"PASSION24.HOUR.07.P019\",\"n\":19,\"t\":\"Je T\u2019entends dire :\"},{\"id\":\"PASSION24.HOUR.07.P020\",\"n\":20,\"t\":\"\u00ab \u00c2mes, \u00e2mes, venez ! Soulagez-Moi, prenez place dans mon Humanit\u00e9. Je vous veux, Je vous d\u00e9sire !\"},{\"id\":\"PASSION24.HOUR.07.P021\",\"n\":21,\"t\":\"De gr\u00e2ce, ne faites pas la sourde oreille \u00e0 mes Appels !\\nNe rendez pas vains\\n- mes D\u00e9sirs ardents,\\n- mon Sang,\\n- mon Amour,\\n- mes Peines !\\nVenez, \u00e2mes, venez ! \u00bb\\nJ\u00e9sus, chacun de tes G\u00e9missements est une blessure \u00e0 mon c\u0153ur.\\nJe fais miens ton Sang, ton Vouloir, ton Z\u00e8le ardent, ton Amour.\"},{\"id\":\"PASSION24.HOUR.07.P022\",\"n\":22,\"t\":\"Parcourant le Ciel et la terre,\\nje veux aller chez toutes les \u00e2mes\\n- pour leur donner ton Sang comme gage de salut,\"},{\"id\":\"PASSION24.HOUR.07.P023\",\"n\":23,\"t\":\"puis Te les apporter\\n- pour calmer tes D\u00e9sirs v\u00e9h\u00e9ments et adoucir les amertumes de ton Agonie.\\nEt pendant que je le ferai, daigne m'accompagner de ton Regard.\\nMaman, je viens chez toi.\\nJ\u00e9sus veut du r\u00e9confort, Il veut des \u00e2mes.\\nDonne-moi ta main maternelle.\\nParcourons ensemble le monde entier \u00e0 la recherche d'\u00e2mes.\"},{\"id\":\"PASSION24.HOUR.07.P024\",\"n\":24,\"t\":\"Renfermons dans son Sang\\n- les affections, les d\u00e9sirs, les pens\u00e9es, les actions et les pas\\nde toutes les cr\u00e9atures.\"},{\"id\":\"PASSION24.HOUR.07.P025\",\"n\":25,\"t\":\"Remplissons leurs \u00e2mes des Flammes de son C\u0153ur,\\nafin qu'elles c\u00e8dent et, qu'une fois qu'elles seront\\n- enferm\u00e9es ainsi dans son Sang et transform\u00e9es par ses Flammes,\\nnous les conduisions \u00e0 Lui pour all\u00e9ger les Peines de son Agonie.\\nMon ange gardien,\\n- pr\u00e9c\u00e8de-moi et va pr\u00e9parer les \u00e2mes qui doivent recevoir ce Sang afin\\nqu'aucune goutte ne reste sans son effet puissant.\\nMaman, vite, allons-y. Je vois le Regard de J\u00e9sus qui nous suit et nous pousse\\n\u00e0 activer notre t\u00e2che.\"},{\"id\":\"PASSION24.HOUR.07.P026\",\"n\":26,\"t\":\"Maman, 1. aux premiers pas nous sommes aux portes des maisons o\u00f9 gisent les infirmes.\"},{\"id\":\"PASSION24.HOUR.07.P027\",\"n\":27,\"t\":\"Combien de membres martyris\u00e9s !\\nCombien, \u00e0 cause de l'atrocit\u00e9 de leurs souffrances,\\n- \u00e9clatent en blasph\u00e8mes et essaient de s'enlever la vie !\\nD'autres sont abandonn\u00e9s de tous et n'ont personne qui leur donne\\n- une parole de r\u00e9confort,\\n- les secours les plus n\u00e9cessaires et,\\npar cons\u00e9quent,\\n- ils jurent et\\n- ils d\u00e9sesp\u00e8rent encore plus.\\nAh ! Maman, j'entends les Sanglots de J\u00e9sus.\\nSes plus ch\u00e8res marques d'Amour font souffrir les \u00e2mes pour les rendre\\nsemblables \u00e0 Lui.\\nElles les changent en offenses.\"},{\"id\":\"PASSION24.HOUR.07.P028\",\"n\":28,\"t\":\"De gr\u00e2ce, donnons-leur son Sang, afin\\n- qu'Il leur fournisse l'aide n\u00e9cessaire et\"},{\"id\":\"PASSION24.HOUR.07.P029\",\"n\":29,\"t\":\"- que, par sa Lumi\u00e8re, Il leur fasse comprendre le bien\\nqui se trouve dans la souffrance.\\nMaman, mets-toi tout pr\u00e8s d'eux.\\nEtant une M\u00e8re affectueuse,\\n- touche de tes Mains maternelles leurs membres endoloris,\\n- calme leurs souffrances,\\n- prends-les entre tes Bras et,\\n- de ton C\u0153ur, verse des torrents de Gr\u00e2ces sur toutes leurs peines.\\n- tiens compagnie aux abandonn\u00e9s,\\n- console les afflig\u00e9s.\\nPour qui manque des moyens n\u00e9cessaires,\\ndispose des \u00e2mes g\u00e9n\u00e9reuses pour les secourir.\\nPour qui se trouvent soumis \u00e0 l'atrocit\u00e9 des tourments,\\n- obtiens par tes Pri\u00e8res un r\u00e9pit et du repos, afin que, fortifi\u00e9s,\\n- ils puissent avec plus de patience supporter ce que J\u00e9sus dispose pour eux.\\n2. Cheminons encore et entrons dans les chambres des moribonds.\\nMaman, quelle terreur !\\nCombien d'\u00e2mes sont sur le point de tomber en enfer !\\nCombien de gens, apr\u00e8s une vie de p\u00e9ch\u00e9s,\\n- donnent l'ultime douleur au C\u0153ur de J\u00e9sus\\n- en accompagnant leur dernier souffle d'un acte de d\u00e9sespoir.\\nIl y a beaucoup de d\u00e9mons autour d'eux.\"},{\"id\":\"PASSION24.HOUR.07.P030\",\"n\":30,\"t\":\"Ceux-ci\\n- jettent dans leur c\u0153ur la terreur et l'\u00e9pouvante des Jugements divins,\\n- m\u00e8nent leurs derni\u00e8res attaques afin de les amener en enfer.\\nD'autres, li\u00e9s par les liens de la terre\\nn'arrivent pas \u00e0 se r\u00e9signer \u00e0 faire le dernier pas.\"},{\"id\":\"PASSION24.HOUR.07.P031\",\"n\":31,\"t\":\"De gr\u00e2ce, \u00f4 Maman,\\n- ce sont leurs derniers moments,\\n- ils ont grand besoin d'aide.\"},{\"id\":\"PASSION24.HOUR.07.P032\",\"n\":32,\"t\":\"Tu vois\\n- comme ils tremblent,\\n- comment ils se d\u00e9battent dans les tourments de l'agonie,\\n- comment ils cherchent de l'aide et de la piti\u00e9 ?\\nD\u00e9j\u00e0 la terre est disparue pour eux !\"},{\"id\":\"PASSION24.HOUR.07.P033\",\"n\":33,\"t\":\"Sainte Maman,\\n- mets ta Main maternelle sur leur front gel\u00e9,\\n- accueille leur dernier souffle,\"},{\"id\":\"PASSION24.HOUR.07.P034\",\"n\":34,\"t\":\"- donne \u00e0 chacun le Sang de J\u00e9sus et\\n- mets ainsi en fuite les d\u00e9mons.\\n- Dispose-les \u00e0 recevoir les derniers sacrements\\net \u00e0 avoir une bonne et sainte mort.\\nEn guise de r\u00e9confort, donnons-leur\\n- les Agonies de J\u00e9sus,\\n- ses Baisers, ses Larmes, ses Plaies.\"},{\"id\":\"PASSION24.HOUR.07.P035\",\"n\":35,\"t\":\"Rompons les liens qui les tiennent li\u00e9s aux t\u00e9n\u00e8bres. Faisons entendre \u00e0 tous la Parole du pardon. Mettons-leur tant de confiance dans le c\u0153ur qu'ils s'\u00e9lanceront dans les Bras de J\u00e9sus.\"},{\"id\":\"PASSION24.HOUR.07.P036\",\"n\":36,\"t\":\"Quand J\u00e9sus les jugera, Il les trouvera\\n- couverts de son Sang,\\n- abandonn\u00e9s entre ses Mains.\\nEt Il leur accordera son Pardon.\\n3. Cheminons encore, Maman. Vois comme la terre est pleine\\nd'\u00e2mes qui sont sur le point de tomber dans le p\u00e9ch\u00e9.\\nIl faudrait un miracle pour emp\u00eacher leur chute.\"},{\"id\":\"PASSION24.HOUR.07.P037\",\"n\":37,\"t\":\"Par cons\u00e9quent,\\ndonnons-leur le Sang de J\u00e9sus\\n- pour qu'ils trouvent en Lui la force et la gr\u00e2ce\\n- de ne pas tomber dans le p\u00e9ch\u00e9.\\n4. Allons-y pour un autre pas, Maman. Voici des \u00e2mes d\u00e9j\u00e0 tomb\u00e9es dans la\\nfaute et qui voudraient une aide pour se relever.\"},{\"id\":\"PASSION24.HOUR.07.P038\",\"n\":38,\"t\":\"J\u00e9sus les aime, mais\\nIl les regarde, horrifi\u00e9, parce qu'elles sont souill\u00e9es.\\nDonnons-leur le Sang de J\u00e9sus,\\n- pour qu'elles trouvent la Main qui les rel\u00e8vera.\\nMaman, ce sont\\n- des \u00e2mes qui ont grand besoin de ce Sang,\\n- des \u00e2mes mortes \u00e0 la Gr\u00e2ce.\\nComme leur \u00e9tat est d\u00e9plorable !\"},{\"id\":\"PASSION24.HOUR.07.P039\",\"n\":39,\"t\":\"Le Ciel les regarde et pleure de douleur. La terre les regarde avec d\u00e9go\u00fbt. Tous les \u00e9l\u00e9ments sont contre elles et voudraient les d\u00e9truire, parce qu'elles sont les ennemis du Cr\u00e9ateur.\"},{\"id\":\"PASSION24.HOUR.07.P040\",\"n\":40,\"t\":\"Maman, le Sang de J\u00e9sus donne la Vie.\\nDonnons-le \u00e0 ces \u00e2mes, afin qu'\u00e0 son contact, elles ressuscitent et\\n- qu'elles ressuscitent plus belles encore, et\\n- qu'ainsi elles fassent sourire tout le Ciel et toute la terre.\\n5. Cheminons encore, Maman. Vois, il y a\\ndes \u00e2mes qui portent la marque de la perdition,\\n- qui p\u00e8chent et s'enfuient de J\u00e9sus,\\n- qui L'offensent et d\u00e9sesp\u00e8rent de son Pardon.\\nCe sont elles les nouveaux Judas r\u00e9pandus sur la terre et\\n- ils percent le C\u0153ur de J\u00e9sus.\\nDonnons-leur le Sang de J\u00e9sus, afin\\n- qu'Il annule la marque de la perdition qu'elles portent et\\n- la remplace par celle du salut ;\\n- qu'il mette dans leur c\u0153ur une telle confiance et un tel amour apr\u00e8s la faute,\\nqu\u2019elles\\n- accourent aux pieds de J\u00e9sus et\\n- s'attachent \u00e0 ses Pieds divins pour ne plus jamais s'en d\u00e9tacher.\\nVois, Maman, il y a des \u00e2mes qui courent follement vers la perdition et\\nil n'y a personne pour arr\u00eater leur course.\"},{\"id\":\"PASSION24.HOUR.07.P041\",\"n\":41,\"t\":\"Mettons ce Sang sous leurs pieds, afin qu'\u00e0 son contact elles\\n- reculent et se remettent sur le chemin du salut !\\n6. Poursuivons notre course, Maman.\\nVois, il y a des \u00e2mes qui sont bonnes, des \u00e2mes innocentes\"},{\"id\":\"PASSION24.HOUR.07.P042\",\"n\":42,\"t\":\"J\u00e9sus trouve en elles ses complaisances et son repos.\\nMais les cr\u00e9atures sont autour d'elles\\n- avec beaucoup de pi\u00e8ges et de scandales\\n- pour leur arracher cette innocence et\\n- pour changer les complaisances et le repos de J\u00e9sus en amertume.\"},{\"id\":\"PASSION24.HOUR.07.P043\",\"n\":43,\"t\":\"Scellons l'innocence de ces \u00e2mes du Sang de J\u00e9sus\\n- comme d'un mur de protection, afin que la faute n'entre pas en elles.\"},{\"id\":\"PASSION24.HOUR.07.P044\",\"n\":44,\"t\":\"Que ce Sang\\n- mette en fuite quiconque voudrait les contaminer,\\net qu'il\\n- les conserve sans tache et pures pour la plus grande Joie de J\u00e9sus.\\n7. Maman, le Sang de J\u00e9sus crie et veut d'autres \u00e2mes encore.\\nCourons ensemble.\"},{\"id\":\"PASSION24.HOUR.07.P045\",\"n\":45,\"t\":\"Rendons-nous dans les r\u00e9gions des h\u00e9r\u00e9tiques et des infid\u00e8les.\"},{\"id\":\"PASSION24.HOUR.07.P046\",\"n\":46,\"t\":\"Combien de douleurs J\u00e9sus ne ressent-Il pas dans ces r\u00e9gions. Lui qui est la Vie de tous, n'a en retour pas m\u00eame un petit acte d'amour de ces \u00e2mes. Il n'est pas connu de ses propres cr\u00e9atures. De gr\u00e2ce, Maman, donnons-leur ce Sang, afin qu'il mette en fuite les t\u00e9n\u00e8bres de l'ignorance et de l'h\u00e9r\u00e9sie.\"},{\"id\":\"PASSION24.HOUR.07.P047\",\"n\":47,\"t\":\"Maman Marie, fais-leur comprendre qu'ils ont une \u00e2me et ouvre-leur le Ciel.\\n- Mettons-les tous dans le Sang de J\u00e9sus,\\n- conduisons-les pr\u00e8s de Lui comme autant d'enfants orphelins et exil\u00e9s\\nqui retrouvent leur p\u00e8re.\"},{\"id\":\"PASSION24.HOUR.07.P048\",\"n\":48,\"t\":\"Ainsi J\u00e9sus se sentira r\u00e9confort\u00e9 dans son Agonie. 8. Mais J\u00e9sus ne semble pas totalement content. Il veut encore d'autres \u00e2mes : les \u00e2mes moribondes de ces m\u00eames r\u00e9gions. Il sent qu'elles s'arrachent de ses Bras pour se diriger vers l'enfer.\"},{\"id\":\"PASSION24.HOUR.07.P049\",\"n\":49,\"t\":\"Ces \u00e2mes sont sur le point d'expirer et de tomber dans l'ab\u00eeme, et personne n'est pr\u00e8s d'elles pour les aider.\"},{\"id\":\"PASSION24.HOUR.07.P050\",\"n\":50,\"t\":\"Et il n'y a plus de temps. Ce sont les derniers moments pour elles.\\nPour que le Sang de J\u00e9sus ne soit pas r\u00e9pandu en vain pour elles,\\nvolons vers elles, versons le Sang de J\u00e9sus sur leur t\u00eate\\n- pour qu'Il leur serve de bapt\u00eame et\\n- pour qu\u2019Il infuse en elles la Foi, l'Esp\u00e9rance et l'Amour.\\nMaman,\\n- Mets-toi, tout pr\u00e8s de ces personnes, suppl\u00e9e \u00e0 tout ce qui leur manqu\u00e9.\"},{\"id\":\"PASSION24.HOUR.07.P051\",\"n\":51,\"t\":\"M\u00eame, montre-toi \u00e0 elles :\\n- sur ton visage resplendit la Beaut\u00e9 de J\u00e9sus ;\\n- tes mani\u00e8res d'agir sont les Siennes et donc,\\n- en Te voyant, elles pourront conna\u00eetre J\u00e9sus.\\nPuis,\\n- presse-les sur ton C\u0153ur maternel,\\n- infuse en elles la Vie de J\u00e9sus qui t'habite,\"},{\"id\":\"PASSION24.HOUR.07.P052\",\"n\":52,\"t\":\"Dis-leur qu'en tant que leur M\u00e8re tu les veux heureuses pour toujours avec toi dans le Ciel. Pendant qu'elles expirent, prends-les dans tes Bras, puis d\u00e9pose-les dans les Bras de J\u00e9sus.\"},{\"id\":\"PASSION24.HOUR.07.P053\",\"n\":53,\"t\":\"Si, selon les droits de la Justice,\\nJ\u00e9sus montre qu\u2019Il ne veut pas les recevoir,\\n- rappelle-Lui l'Amour avec lequel Il Te les a confi\u00e9es sous la Croix,\\n- r\u00e9clame tes droits de M\u00e8re,\\nde sorte qu'\u00e0 ton amour et \u00e0 tes pri\u00e8res, J\u00e9sus ne saura r\u00e9sister.\"},{\"id\":\"PASSION24.HOUR.07.P054\",\"n\":54,\"t\":\"Et tandis qu'Il contentera ton C\u0153ur, Il contentera aussi le Sien.\\n9. Maman, prenons ce Sang et donnons-le \u00e0 tous :\\n- aux afflig\u00e9s, pour qu'ils en obtiennent du r\u00e9confort,\\n- aux pauvres, pour que, r\u00e9sign\u00e9s, ils vivent leur pauvret\u00e9,\\n- \u00e0 ceux qui subissent la tentation, pour qu'ils obtiennent la victoire,\\n- aux incroyants, pour que triomphe en eux la vertu de foi,\\n- aux blasph\u00e9mateurs, pour qu'ils changent leurs blasph\u00e8mes en b\u00e9n\u00e9dictions,\\n- aux pr\u00eatres, pour qu'ils comprennent leur mission et soient de dignes\\nministres de J\u00e9sus.\"},{\"id\":\"PASSION24.HOUR.07.P055\",\"n\":55,\"t\":\"Touche leurs l\u00e8vres avec ce Sang,\\nafin qu'ils ne disent aucune parole qui ne rende gloire \u00e0 Dieu ;\\nTouche leurs pieds, afin qu'ils s'empressent\\nd'aller \u00e0 la recherche d'\u00e2mes \u00e0 conduire \u00e0 J\u00e9sus.\\nDonnons ce Sang aux gouvernants des peuples, pour qu'ils\\n- soient unis entre eux et\\n- ressentent de la douceur et de l'amour envers leurs sujets.\\n10. Rendons-nous maintenant au Purgatoire.\\nMaman,\\ntu entends les g\u00e9missements des \u00e2mes qui s'y trouvent ?\\nTu vois\\n- leurs d\u00e9sirs v\u00e9h\u00e9ments d'amour,\\n- leurs tortures,\\n- leurs \u00e9lans incessants vers le Bien supr\u00eame ?\\nNous voyons comment J\u00e9sus Lui-m\u00eame veut les purifier plus vite pour les avoir\\navec Lui.\\nIl les attire par son Amour.\\nMais quand elles arrivent en sa divine Pr\u00e9sence,\\n- elles ne peuvent pas encore soutenir la Puret\u00e9 du Regard divin,\\n- elles sont oblig\u00e9es de retomber dans les flammes !\\nMaman,\\n- descendons dans cette prison profonde et,\\n- versant sur ces \u00e2mes le Sang de J\u00e9sus,\\n- portons-leur la Lumi\u00e8re,\\n- apaisons leurs d\u00e9sirs ardents d'amour,\"},{\"id\":\"PASSION24.HOUR.07.P056\",\"n\":56,\"t\":\"- \u00e9teignons le feu qui les br\u00fble,\\n- purifions leurs taches.\\nAinsi,\\n- une fois lib\u00e9r\u00e9es de toute faute,\\n- elles voleront dans les Bras du Bien supr\u00eame.\"},{\"id\":\"PASSION24.HOUR.07.P057\",\"n\":57,\"t\":\"Donnons le Sang de J\u00e9sus aux \u00e2mes les plus abandonn\u00e9es, afin qu'elles trouvent en Lui tous les suffrages que les cr\u00e9atures leur refusent. Maman, donnons ce Sang \u00e0 toutes. N'en privons aucune, afin qu'elles en re\u00e7oivent soulagement et lib\u00e9ration. Agis en Reine dans ces r\u00e9gions de larmes et de lamentation. Etends tes Mains maternelles et, une \u00e0 une, sors-les de ces flammes ardentes, afin qu'elles prennent leur envol vers le Ciel. 11. Maintenant, rendons-nous au Ciel. Pla\u00e7ons-nous aux portes \u00e9ternelles.\"},{\"id\":\"PASSION24.HOUR.07.P058\",\"n\":58,\"t\":\"Maman, permets, que je Te donne \u00e0 toi aussi ce Sang pr\u00e9cieux pour ta plus grande Gloire. Que ce Sang t'inonde d'une nouvelle Lumi\u00e8re et de nouveaux Contentements. Maman, donne ce Sang \u00e0 moi aussi. Tu sais combien j'en ai besoin.\"},{\"id\":\"PASSION24.HOUR.07.P059\",\"n\":59,\"t\":\"De tes mains maternelles couvre-moi tout enti\u00e8re de ce Sang et purifie ainsi mes taches, gu\u00e9ris mes plaies, enrichis ma pauvret\u00e9.\"},{\"id\":\"PASSION24.HOUR.07.P060\",\"n\":60,\"t\":\"Fais en sorte\\nque ce Sang circule dans mes veines et m'impr\u00e8gne de la Vie de J\u00e9sus.\\nQu'Il descende dans mon c\u0153ur et le transforme en son propre C\u0153ur.\\nQu'Il m'embellisse afin que J\u00e9sus trouve en moi tous ses Contentements.\\n12. Enfin, Maman, entrons dans les r\u00e9gions c\u00e9lestes.\\nDonnons ce Sang \u00e0 tous les saints et \u00e0 tous les anges, afin qu'ils puissent\\nrecevoir\\n- une plus grande gloire,\\n- \u00e9clater en remerciements envers J\u00e9sus et\\n- prier pour nous, pour que nous puissions tous les rejoindre.\\n13. Apr\u00e8s avoir donn\u00e9 \u00e0 tous ce Sang, retournons \u00e0 J\u00e9sus.\\nAnges, saints, venez avec nous. J\u00e9sus d\u00e9sire tant les \u00e2mes.\\nIl veut toutes les faire entrer dans son Humanit\u00e9\\npour donner les fruits de son Sang \u00e0 toutes.\"},{\"id\":\"PASSION24.HOUR.07.P061\",\"n\":61,\"t\":\"Pla\u00e7ons-les toutes autour de Lui. Il sentira la Vie revenir en Lui et Il se sentira r\u00e9compens\u00e9 de l'Agonie extr\u00eame qu'Il a soufferte.\"},{\"id\":\"PASSION24.HOUR.07.P062\",\"n\":62,\"t\":\"14. Sainte Maman, maintenant, appelons tous les \u00e9l\u00e9ments \u00e0 Lui tenir compagnie, afin qu'eux aussi honorent J\u00e9sus.\"},{\"id\":\"PASSION24.HOUR.07.P063\",\"n\":63,\"t\":\"- \u00d4 lumi\u00e8re du soleil,\\nviens dissiper les t\u00e9n\u00e8bres de cette nuit pour r\u00e9conforter J\u00e9sus.\\n- \u00d4 \u00e9toiles, avec vos rayons scintillants,\\ndescendez du ciel et venez r\u00e9conforter J\u00e9sus.\\n- Fleurs de la terre, venez avec vos parfums.\\n- Oiseaux, venez avec vos gazouillis.\\n- Tous les \u00e9l\u00e9ments de la terre, venez r\u00e9conforter J\u00e9sus.\\n- Viens, \u00f4 mer, rafra\u00eechir et laver J\u00e9sus.\"},{\"id\":\"PASSION24.HOUR.07.P064\",\"n\":64,\"t\":\"Il est notre Cr\u00e9ateur, notre Vie, notre Tout. Venez tous Le r\u00e9conforter, Lui rendre hommage en tant que notre souverain Seigneur.\"},{\"id\":\"PASSION24.HOUR.07.P065\",\"n\":65,\"t\":\"Je vois que J\u00e9sus ne cherche pas tellement la lumi\u00e8re, les \u00e9toiles, les fleurs, les oiseaux. Il veut des \u00e2mes, des \u00e2mes ! Mon doux Bien, ta ch\u00e8re Maman est tout pr\u00e8s de Toi. Repose-Toi entre ses Bras. Elle sera r\u00e9confort\u00e9e elle aussi en Te pressant sur son Sein. Parce qu\u2019elle a pris grande part \u00e0 ta douloureuse Agonie.\"},{\"id\":\"PASSION24.HOUR.07.P066\",\"n\":66,\"t\":\"Il y a \u00e9galement ici Marie Madeleine, Marthe, a
