// ── Section ──
// Parse display_text into typed blocks for structured rendering
function parseSectionBlocks(sectionId, displayText) {
  const blocks = [];
  const lines = displayText.split('\n');
  let i = 0;
  while (i < lines.length) {
    const stripped = lines[i].trim();

    if (sectionId === 'PASSION24.SECTION.PRACTICE_METHODS') {
      if (/^Méthodes pour la pratique des Heures de la Passion$/i.test(stripped)) {
        blocks.push({ type: 'section_title', text: stripped }); i++; continue;
      }
      if (/^Voici trois suggestions\s*:$/i.test(stripped)) {
        blocks.push({ type: 'method_intro', text: stripped }); i++; continue;
      }
      if (/^Les 24 Heures de la Passion de Notre-Seigneur Jésus-Christ/i.test(stripped)) {
        let sl = [stripped]; i++;
        while (i < lines.length && lines[i].trim() && !/^Prière avant chaque Heure/i.test(lines[i].trim())) {
          sl.push(lines[i].trim()); i++;
        }
        blocks.push({ type: 'hours_schedule', text: sl.join(' ') }); continue;
      }
    }
    // LDC reference heading
    if (/^LDC \d+/.test(stripped)) {
      blocks.push({ type: 'ldc_ref', text: stripped, anchor: 'ldc-' + blocks.filter(b=>b.type==='ldc_ref').length });
      i++; continue;
    }
    // Method headings — join description if heading ends with ":"
    if (/^(?:Première|Deuxième|Troisième|Quatrième)\s+manière/.test(stripped)) {
      let headingText = stripped;
      if (headingText.trimEnd().endsWith(':')) {
        let j = i + 1;
        while (j < lines.length && !lines[j].trim()) j++;
        if (j < lines.length) {
          const nextLine = lines[j].trim();
          const isStructural = /^LDC \d+/.test(nextLine) ||
            /^(?:Première|Deuxième|Troisième|Quatrième)\s+manière/.test(nextLine);
          if (!isStructural && nextLine) {
            headingText = headingText + ' ' + nextLine;
            i = j + 1;
            blocks.push({ type: 'method_heading', text: headingText });
            continue;
          }
        }
      }
      blocks.push({ type: 'method_heading', text: stripped });
      i++; continue;
    }
    // Skip empty
    if (!stripped) { i++; continue; }
    // Accumulate paragraph lines
    const paraLines = [stripped]; i++;
    while (i < lines.length) {
      const next = lines[i].trim();
      if (!next) break;
      if (/^LDC \d+/.test(next) ||
          /^(?:Première|Deuxième|Troisième|Quatrième)\s+manière/.test(next) ||
          /^Méthodes pour la pratique des Heures de la Passion$/i.test(next) ||
          /^Voici trois suggestions\s*:$/i.test(next) ||
          /^Les 24 Heures de la Passion de Notre-Seigneur Jésus-Christ/i.test(next)) break;
      paraLines.push(next); i++;
    }
    blocks.push({ type: 'paragraph', text: paraLines.join('\n') });
  }
  return blocks;
}

function renderMethodHeading(text) {
  const match = text.match(/^((?:Première|Deuxième|Troisième|Quatrième)\s+manière)\s*:?\s*(.*)$/);
  if (!match) return `<div class="block-method-heading">${escHtml(text)}</div>`;
  return `<div class="block-method-heading"><span class="method-badge">${escHtml(match[1])}</span><span class="method-heading-text">${escHtml(match[2])}</span></div>`;
}

function renderHoursSchedule(text) {
  const title = 'Les 24 Heures de la Passion de Notre-Seigneur Jésus-Christ';
  const body = text.replace(title, '').trim();
  const items = body.split(/(?=De\s+(?:\d+h|midi|24h|17h))/g).map(x => x.trim()).filter(Boolean);
  return `<div class="section-schedule"><div class="section-schedule-title">${escHtml(title)}</div>${
    items.map(item => `<p class="block-paragraph" style="margin-bottom:0.55em">${escHtml(item)}</p>`).join('')
  }</div>`;
}

function renderSectionBlocks(blocks, sectionId) {
  // Build mini-TOC for BENEFITS (has LDC refs)
  const ldcRefs = blocks.filter(b => b.type === 'ldc_ref');
  let tocHtml = '';
  if (ldcRefs.length > 3) {
    tocHtml = `<div class="section-toc">
      <div class="section-toc-title">Références — ${ldcRefs.length} passages du Livre du Ciel</div>
      ${ldcRefs.map((b,i) => `<a class="section-toc-item" onclick="(function(){var _ta=document.getElementById('${b.anchor}');if(_ta)smoothScrollTo(_ta,{behavior:'smooth',block:'start'});})();return false">${escHtml(b.text.slice(0,70))}${b.text.length>70?'…':''}</a>`).join('')}
    </div>`;
  }
  const bodyHtml = blocks.map(b => {
    if (b.type === 'ldc_ref')       return `<div class="block-ldc-ref" id="${b.anchor}">${escHtml(b.text)}</div>`;
    if (b.type === 'method_heading') return renderMethodHeading(b.text);
    if (b.type === 'method_intro')   return `<div class="block-method-intro">${escHtml(b.text)}</div>`;
    if (b.type === 'hours_schedule') return renderHoursSchedule(b.text);
    if (b.type === 'section_title')  return `<div class="block-section-title">${escHtml(b.text)}</div>`;
    return `<p class="block-paragraph">${escHtml(b.text)}</p>`;
  }).join('');
  return tocHtml + '<div class="section-blocks">' + bodyHtml + '</div>';
}

function openSection(id, push = true, scrollToAnchor = null) {
  const s = CORPUS.sections.find(x => x.section_id === id); if (!s) return;
  if (push) pushHistory(state.view, state.currentSection);
  state.view = 'section'; state.currentSection = id;
  const blocks = parseSectionBlocks(s.section_id, s.display_text || '');
  const bodyContent = blocks.length > 1
    ? renderSectionBlocks(blocks, s.section_id)
    : `<div class="section-content">${escHtml(s.display_text)}</div>`;
  document.getElementById('content').innerHTML = `
  <div class="section-screen">
    <div class="reader-header">
      <div class="reader-eyebrow">Les 24 Heures de la Passion</div>
      <h2 class="reader-title">${escHtml(s.title)}</h2>
      </div>
    ${bodyContent}
  </div>`;
  if (scrollToAnchor) {
    setTimeout(() => {
      const el = document.getElementById(scrollToAnchor);
      if (el) { smoothScrollTo(el, { behavior: 'smooth', block: 'start' }); el.style.outline = '3px solid var(--accent-light)'; setTimeout(()=>{ el.style.outline=''; },2000); }
      else document.getElementById('content').scrollTop = 0;
    }, 100);
  } else {
    document.getElementById('content').scrollTop = 0;
  }
  document.getElementById('progressWrap').style.display = 'none';
  buildSidebar();
}

    </div>

  </div>`;
  requestAnimationFrame(() => { (function(){var _si=document.getElementById('homeSearchInput');if(_si)_si.focus();})(); });

  document.getElementById('progressWrap').style.display = 'none';

function onSearchInput(v) { state.searchQuery = v; performSearch(v); }
function performSearch(query) {
  const resultsEl = document.getElementById('homeSearchResults');
  const homeMain = document.getElementById('homeMain');
  if (!query || query.trim().length < 2) {
    if (resultsEl) { resultsEl.classList.remove('visible'); resultsEl.innerHTML = ''; }
    if (homeMain) homeMain.style.display = ''; return;
  }
  if (homeMain) homeMain.style.display = 'none';
  const q = norm(query.trim());
  const results = [];
  // Search hours: meditations + reflections
  for (const hour of CORPUS.hours) {
    for (const p of hour.paragraphs) { if (norm(p.t).includes(q)) { results.push({label:`${hour.hour_number}e Heure — ${hour.title}`, para:p, type:'meditation', target:{kind:'hour',n:hour.hour_number}}); if(results.length>=80) break; } }
    for (const p of (hour.reflections||[])) { if (norm(p.t).includes(q)) { results.push({label:`${hour.hour_number}e Heure — ${hour.title}`, para:p, type:'reflection', target:{kind:'hour',n:hour.hour_number}}); if(results.length>=80) break; } }
    if (results.length>=80) break;
  }
  // Search prayers
  if (results.length < 80) {
    for (const pr of CORPUS.prayers) {
      for (const p of (pr.paragraphs||[])) {
        if (norm(p.t).includes(q)) { results.push({label:pr.title, para:p, type:'prayer', target:{kind:'prayer',id:pr.prayer_id}}); if(results.length>=80) break; }
      }
      if (results.length>=80) break;
    }
  }
  // Search sections (display_text as plain text)
  if (results.length < 80) {
    for (const s of CORPUS.sections) {
      const dt = s.display_text || '';
      const normDt = norm(dt);
      const sBlocks = parseSectionBlocks(s.section_id, dt);
      let sMatched = false;
      for (const blk of sBlocks) {
        const nb = norm(blk.text);
        if (nb.includes(q) && results.length < 80) {
          const bi = nb.indexOf(q);
          const snip = blk.text.slice(Math.max(0,bi-55), Math.min(blk.text.length,bi+q.length+90)).replace(/\n/g,' ');
          results.push({label:s.title, para:{id:blk.anchor||(s.section_id+'_blk'), t:snip},
            type:'section', target:{kind:'section', id:s.section_id, anchor:blk.anchor||null}});
          sMatched = true;
        }
      }
      if (!sMatched) {
        let idx = normDt.indexOf(q);
        while (idx !== -1 && results.length < 80) {
          const snip = dt.slice(Math.max(0,idx-55),Math.min(dt.length,idx+q.length+90));
          results.push({label:s.title, para:{id:s.section_id+'_'+idx, t:snip},
            type:'section', target:{kind:'section', id:s.section_id, anchor:null}});
          idx = normDt.indexOf(q, idx + q.length + 1);
          if (results.length >= 80) break;
        }
      }
    }
  }
  if (!resultsEl) return;
  // Apply search filter + restore filter button state
  const filtered = (state.searchFilter && state.searchFilter !== 'all')
    ? results.filter(r => r.type === state.searchFilter) : results;
  document.querySelectorAll('.sf-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.filter === (state.searchFilter||'all')));
  if (!filtered.length) { resultsEl.innerHTML=`<div class="no-results">Aucun résultat pour « ${escHtml(query)} »</div>`; resultsEl.classList.add('visible'); return; }
  const reRx = new RegExp(escRe(query.trim()), 'gi');
  const badgeMap = {
    meditation: '<span class="sr-badge meditation">Méditation</span>',
    reflection: '<span class="sr-badge reflection">Réflexion</span>',
    prayer:     '<span class="sr-badge prayer">Prière</span>',
    section:    '<span class="sr-badge section">Complément</span>'
  };
  resultsEl.innerHTML = `
    <div class="search-count">${filtered.length}${results.length>=80?'+':''} résultat${results.length>1?'s':''} pour « ${escHtml(query)} »</div>
    ${filtered.map(r => {
      const raw = r.para.t;
      const normRaw = norm(raw);
      const idx = normRaw.indexOf(q);
      const start = Math.max(0, idx-55), end = Math.min(raw.length, idx+q.length+90);
      let snip = raw.slice(start, end).replace(/\n/g,' ');
      if (start>0) snip='…'+snip; if (end<raw.length) snip+='…';
      const marked = escHtml(snip).replace(reRx, m=>`<mark>${m}</mark>`);
      const badge = badgeMap[r.type] || '';
      const onclick = r.target.kind==='hour'
        ? `openHourAtPara(${r.target.n},'${r.para.id}','${r.type}')`
        : r.target.kind==='prayer'
          ? `openPrayer('${r.target.id}')`
          : `openSection('${r.target.id}', true, ${r.target.anchor ? `'${r.target.anchor}'` : 'null'})`;
      return `<button type="button" class="search-result-item" onclick="${onclick}">
        <div class="sr-ref">${escHtml(r.label)}${badge}</div>
        <div class="sr-text">${marked}</div></button>`;
    }).join('')}`;
  resultsEl.classList.add('visible');
}
function openHourAtPara(hourNum, paraId, type) {
  state.searchQuery = '';
  openHour(hourNum);
  setTimeout(() => {
    if (type === 'reflection') {
      switchTab('reflections', true);
      requestAnimationFrame(() => {
        (function(){var _p=document.getElementById(paraId);if(_p)smoothScrollTo(_p,{behavior:'smooth',block:'center'});})();
      });
    } else {
      (function(){var _p=document.getElementById(paraId);if(_p)smoothScrollTo(_p,{behavior:'smooth',block:'center'});})();
    }
  }, 50);
}

// ── Text-selection highlighting ──
function renderParaText(text, paraId) {
  const hls = (state.textHighlights[paraId] || []).slice().sort((a,b)=>a.start-b.start);
  const speechSegs = (SPEECH_DATA[paraId] || []).slice().sort((a,b)=>a.start-b.start);
  if (!hls.length && !speechSegs.length) return escHtml(text);

  // Build sorted event list from both speech and highlight ranges
  const events = [];
  for (const seg of speechSegs) {
    const cls = seg.speaker === 'JESUS' ? 'sp-jesus' : 'sp-mary';
    events.push({ pos: seg.start, open: true,  kind: 'speech', cls });
    events.push({ pos: seg.end,   open: false, kind: 'speech', cls });
  }
  for (const hl of hls) {
    events.push({ pos: hl.start, open: true,  kind: 'hl', id: hl.id, cls: `hl hl-${hl.color}` });
    events.push({ pos: hl.end,   open: false, kind: 'hl', id: hl.id, cls: null });
  }
  events.sort((a, b) => a.pos - b.pos || (a.open ? 1 : -1));

  let out = '', pos = 0, speechCls = null, hlCls = null, hlId = null;

  const flush = (to) => {
    if (to <= pos) return;
    let chunk = escHtml(text.slice(pos, to));
    if (speechCls) chunk = `<span class="${speechCls}">${chunk}</span>`;
    if (hlCls) chunk = `<mark class="${hlCls}" data-hl-id="${hlId}" onclick="onMarkClick(event,'${paraId}','${hlId}')" title="Modifier">${chunk}</mark>`;
    out += chunk;
    pos = to;
  };

  for (const ev of events) {
    const evPos = Math.min(ev.pos, text.length);
    flush(evPos);
    if (ev.kind === 'speech') speechCls = ev.open ? ev.cls : null;
    else { if (ev.open) { hlCls = ev.cls; hlId = ev.id; } else { hlCls = null; hlId = null; } }
  }
  flush(text.length);
  return out;
}

function getCharOffset(container, node, offset) {
  const r = document.createRange();
  r.selectNodeContents(container);
  r.setEnd(node, offset);
  return r.toString().length;
}

function handleSelectionEnd() {
  setTimeout(() => {
    const sel = window.getSelection();
    if (!sel || sel.isCollapsed || !sel.rangeCount) return;
    const range = sel.getRangeAt(0);
    const selText = range.toString().trim();
    if (selText.length < 2) return;
    const anc = range.commonAncestorContainer;
    const paraText = (function(){var _a=(anc.nodeType===3?anc.parentElement:anc);return(_a&&_a.closest)?_a.closest('.para-text'):null;})();
    if (!paraText) return;
    const block = paraText.closest('.para-block') || paraText.closest('.ref-para-block');
    if (!block) return;
    var _qel=block.querySelector('[data-para-id]');const paraId=block.id||(_qel&&_qel.dataset?_qel.dataset.paraId:undefined);
    if (!paraId) return;
    const start = getCharOffset(paraText, range.startContainer, range.startOffset);
    const end   = getCharOffset(paraText, range.endContainer,   range.endOffset);
    if (end <= start) return;
    state._pending = { paraId, start, end, text: selText };
    if (window.matchMedia('(pointer: coarse)').matches) {
      // Touch: show colour picker anchored to screen bottom.
      // iOS native menu appears near the selection (top); our picker is at bottom — no conflict.
      showColourPickerBottom();
      return;
    }
    const rect = range.getBoundingClientRect();
    showColourPicker(rect.left + rect.width/2, rect.top, false, null);
  }, 20);
}

function showColourPicker(x, y, isExisting, hlId) {
  const picker = document.getElementById('colourPicker');
  const removeBtn = document.getElementById('cpRemoveBtn');
  removeBtn.style.display = isExisting ? 'block' : 'none';
  removeBtn.dataset.hlId = hlId || '';
  picker.classList.add('open');
  const pw = 220, ph = 110;
  const left = Math.max(8, Math.min(x - pw/2, window.innerWidth - pw - 8));
  const top  = Math.max(8, y - ph - 10);
  picker.style.cssText += `;left:${left}px;top:${top}px`;
}

function closeColourPicker() {
  document.getElementById('colourPicker').classList.remove('open', 'cp-bottom');
  state._pending = null;
}

function applyHighlight(color) {
  const existHlId = document.getElementById('cpRemoveBtn').dataset.hlId;
  // Changing colour of existing highlight
  if (existHlId && state._pending) {
    const hls = state.textHighlights[state._pending.paraId] || [];
    const hl = hls.find(h=>h.id===existHlId);
    if (hl) { hl.color = color; saveState(); rerenderPara(state._pending.paraId); }
    closeColourPicker(); (function(){var _ws=window.getSelection();if(_ws)_ws.removeAllRanges();})();
    showToast('Couleur modifiée'); return;
  }
  const sel = state._pending;
  if (!sel) { closeColourPicker(); return; }
  // Remove overlapping highlights
  const existing = state.textHighlights[sel.paraId] || [];
  state.textHighlights[sel.paraId] = existing.filter(h=>!(h.start<sel.end && h.end>sel.start));
  const hlId = 'hl_' + Date.now();
  state.textHighlights[sel.paraId].push({id:hlId, start:sel.start, end:sel.end, color, text:sel.text, para_hash:paraHash(sel.text)});
  saveState(); rerenderPara(sel.paraId);
  closeColourPicker(); (function(){var _ws=window.getSelection();if(_ws)_ws.removeAllRanges();})();
  showToast('Passage surligné ◐');
}

function rerenderPara(paraId) {
  const block = document.getElementById(paraId);
  if (!block) return;
  const el = block.querySelector('.para-text');
  if (!el || !state.currentHour) return;
  const h = CORPUS.hours.find(x=>x.hour_number===state.currentHour);
  if (!h) return;
  const all = [...h.paragraphs,...(h.reflections||[]),...(h.subsections||[]).flatMap(s=>s.paragraphs)];
  const p = all.find(x=>x.id===paraId);
  if (p) el.innerHTML = renderParaText(p.t, paraId);
}

function onMarkClick(event, paraId, hlId) {
  event.stopPropagation();
  (function(){var _ws=window.getSelection();if(_ws)_ws.removeAllRanges();})();
  const hls = state.textHighlights[paraId]||[];
  const hl = hls.find(h=>h.id===hlId);
  if (!hl) return;
  state._pending = {paraId, start:hl.start, end:hl.end, text:hl.text};
  showColourPicker(event.clientX, event.clientY, true, hlId);
}

function removeHighlightAtSelection() {
  const hlId = document.getElementById('cpRemoveBtn').dataset.hlId;
  const paraId=state._pending?state._pending.paraId:undefined;
  if (paraId && hlId) {
    state.textHighlights[paraId] = (state.textHighlights[paraId]||[]).filter(h=>h.id!==hlId);
    if (!state.textHighlights[paraId].length) delete state.textHighlights[paraId];
    saveState(); rerenderPara(paraId); showToast('Surlignage supprimé');
  }
  closeColourPicker();
}

function openMobileHighlight(paraId) {
  // FIRST: use a pending text selection (the common case — user selected text
  // then tapped Surligner; iOS cleared the DOM selection but _pending is still set)
  if (state._pending && state._pending.paraId === paraId) {
    showColourPickerBottom();
    return;
  }
  // SECOND: edit an existing highlight on this paragraph
  const hls = state.textHighlights[paraId]||[];
  if (hls.length) {
    state._pending = {paraId, start:hls[0].start, end:hls[0].end, text:hls[0].text};
    showColourPickerBottom(true, hls[0].id);
    return;
  }
  showToast('Sélectionnez du texte pour surligner');
}

function showColourPickerBottom(isExisting, hlId) {
  const picker = document.getElementById('colourPicker');
  const removeBtn = document.getElementById('cpRemoveBtn');
  removeBtn.style.display = isExisting ? 'block' : 'none';
  removeBtn.dataset.hlId = hlId || '';
  picker.classList.add('open', 'cp-bottom');
  // Clear any previous inline position
  picker.style.left = ''; picker.style.top = ''; picker.style.right = ''; picker.style.bottom = '';
}

function escHtml(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function norm(s){return(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/['']/g,"'").replace(/[«»""]/g,'"');}
function escRe(s){return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');}

  showToast(state.studyMode ? '✏ Mode Étude activé' : '✝ Mode Prier activé');
}
function applyStudyMode() {
  document.getElementById('app').classList.toggle('mode-etude', state.studyMode);
  const btn = document.getElementById('modeBtn');
  if (!btn) return;
  if (state.studyMode) {
    btn.textContent = '✏'; btn.className = 'icon-btn mode-pill';
    btn.title = 'Passer en mode Prier'; btn.setAttribute('aria-label','Mode Étude actif');
  } else {
    btn.textContent = '✝'; btn.className = 'icon-btn mode-pill prier';
    btn.title = 'Passer en mode Étude'; btn.setAttribute('aria-label','Mode Prier actif');
  }
}

// ─── Export / Import ────────────────────────────────────────
function exportUserData() {
  const data = {
    schema_version: STORAGE_SCHEMA_VERSION, exported_at: new Date().toISOString(),
    app_version: APP_VERSION, corpus_version: CORPUS_VERSION,
    favorites: state.favorites, textHighlights: state.textHighlights,
    highlights: [...state.highlights], readHours: [...state.readHours],
    lastParas: state.lastParas, fontSize: state.fontSize,
    theme: state.theme, studyMode: state.studyMode
  };
  try {
    const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'luisa-24h-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a); a.click();
    document.body.removeChild(a); URL.revokeObjectURL(url);
    showToast('Données exportées ✓');
  } catch(e) { showToast('Export non disponible dans ce navigateur'); }
}
function triggerImport() { document.getElementById('importFileInput').click(); }
function handleImportFile(input) {
  const file = input.files[0]; if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.favorites && !data.schema_version) throw new Error('Format invalide');
      if (!confirm('Importer cette sauvegarde ?\n\nVos données actuelles seront remplacées.')) { input.value=''; return; }
      state.favorites      = data.favorites      || {};
      state.textHighlights = data.textHighlights || {};
      state.highlights     = new Set(data.highlights  || []);
      state.readHours      = new Set(data.readHours   || []);
      state.lastParas      = data.lastParas      || {};
      if (data.fontSize  !== undefined) state.fontSize  = data.fontSize;
      if (data.theme)                   state.theme     = data.theme;
      if (data.studyMode !== undefined) state.studyMode = data.studyMode;
      saveState(); applyStudyMode(); applyFontSize(); applyTheme();
      renderPanelTab('fav');
      showToast('Données importées ✓');
    } catch(err) { showToast('Erreur : fichier invalide'); }
    input.value = '';
  };
  reader.readAsText(file);
}

// ─── Search filter ──────────────────────────────────────────
function setSearchFilter(f) {
  state.searchFilter = f;
  document.querySelectorAll('.sf-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.filter === f));
  const q = document.getElementById('homeSearchInput');
  if (q && q.value.trim().length >= 2) performSearch(q.value.trim());
}


function smoothScrollTo(el, opts) { if (!el) return; try { el.scrollIntoView(opts); } catch(e) { el.scrollIntoView(true); } }

document.addEventListener('mouseup', handleSelectionEnd);
document.addEventListener('touchend', handleSelectionEnd);
document.addEventListener('touchcancel', () => { closeColourPicker(); (function(){var _ws=window.getSelection();if(_ws)_ws.removeAllRanges();})(); });
document.addEventListener('click', e => {
  const picker = document.getElementById('colourPicker');
  if (picker&&picker.classList.contains('open')&&!picker.contains(e.target)&&!e.target.closest('mark.hl'))
    closeColourPicker();
});
