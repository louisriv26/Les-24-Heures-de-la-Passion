les plus intimes.\\nEt elle les fait siens.\\n\\nS'élevant entre le Ciel et la terre, elle remplit la fonction de co-rédemptrice et elle dit à ma suite :\\n\\n\\\"Me voici, je veux réparer pour tous, implorer pour tous et répondre de tous.\\\" »\\n\\nLDC 11 - 9 décembre 1916 - Jésus veut des âmes qui soient d'autres Lui-même.\\n\\nJ'étais affligée à cause de la privation de mon doux Jésus. Quand Il vient, je ressens un peu de soulagement. Mais je deviens vite plus affligée en le voyant plus affligé que moi.\\n\\nIl n'est pas question qu'Il s'apaise\\n- puisque les créatures le forcent à envoyer encore plus de fléaux.\\nPendant qu’Il sévit, Il pleure sur le sort de l'humanité.\\nEt Il se cache au tréfonds de mon cœur\\ncomme s'Il ne voulait pas voir les souffrances de ses créatures.\\n\\nCes temps sont invivables, mais il semble que ce n'est que le commencement. Comme j'étais très affligée à cause de mon pénible sort, celui d'être si souvent sans Jésus, Il vint et, entourant mon cou d'un de ses bras, Il me dit :\\n\\n« Ma fille, n'augmente pas mes souffrances en t'affligeant de la sorte.\\nJ'en ai déjà beaucoup trop. Je n'attends pas cela de toi.\\nJ'attends de toi que tu t'appropries\\n- mes Peines,\\n- mes Prières et\\n- tout Moi-même\\nDe sorte que Je puisse trouver en toi un autre Moi-même.\\n\\nEn ces temps, Je veux de grandes satisfactions. Et seulement ceux qui sont d'autres Moi-même peuvent répondre à cette attente.\\n\\nCe que le Père trouvait en Moi :\\n- Gloire, Délices, Amour,\\n\\n- satisfactions complètes pour le bien de tous\\nIl le trouve en ces âmes.\\n\\nTu dois avoir ces intentions\\n- à chaque Heure de la Passion que tu fais,\\n- à chacune de tes actions,\\ntout le temps.\\n\\nSi Je ne trouve pas ces satisfactions, ah ! ce sera le désastre : les fléaux vont se répandre par torrents. Ah ! Ma fille ! Ah ! Ma fille ! » Puis Il disparut.\\n\\nBienfaits de la méditation des Heures de la Passion\\n\\nLDC 11 - 2 février 1917 - Le monde est devenu déséquilibré parce qu'il a perdu la pensée de la Passion.\\n\\nÉtant dans mon état habituel, je me suis retrouvée hors de mon corps. J'ai vu mon aimable Jésus ruisselant de Sang et couvert d'une horrible couronne d'épines.\\n\\nMe regardant avec difficulté à travers les épines, Il me dit : « Ma fille, le monde est devenu déséquilibré parce qu'il a perdu la pensée de ma Passion. Dans la noirceur, il n'a pas trouvé la Lumière de ma Passion qui\\n\\nl'aurait éclairé. Cette Lumière lui aurait fait connaître\\n- mon Amour et combien les âmes M'ont coûté.\\n\\nIl se serait mis à aimer Celui qui l'a tant aimé. Et la Lumière de ma Passion l'aurait guidé et mis sur ses gardes au milieu des dangers.\\n\\nDans la faiblesse,\\n- il n'a pas trouvé la Force de ma Passion qui l'aurait soutenu.\\nDans l'impatience,\\n- il n'a pas trouvé le miroir de ma Patience\\nqui lui aurait infusé le calme et la résignation.\\nEt, à la vue de ma Patience,\\n- il se serait senti gêné et\\n- il se serait fait un devoir de se dominer.\\nDans les souffrances, il n'a pas trouvé le réconfort des Souffrances d'un Dieu\\nqui lui aurait infusé l'amour de la souffrance.\\nDans le péché, il n'a pas trouvé ma Sainteté\\n- qui lui aurait infusé la haine du péché.\\nAh ! L’homme a abusé de tout.\\nParce que, sur tous les points, il s'est éloigné de Celui qui aurait pu l'aider.\\n\\nVoilà pourquoi le monde est devenu déséquilibré. Il s'est comporté\\n- comme un enfant qui ne veut plus reconnaître sa mère, ou\\n- comme un disciple qui, reniant son maître, ne veut plus entendre ses\\nenseignements.\\n\\nQu'est-ce qui va arriver à cet enfant et à ce disciple ? Ils seront la honte de la société. Tel est devenu l'homme. Ah ! Il va de mal en pis et Je pleure sur lui avec des larmes de Sang ! »\\n\\nLDC 12 - 16 mai 1917 - Les avantages que l’on trouve à se fondre en Jésus. Les “Heures de la Passion” mettent la Rédemption en action.\\n\\nMe trouvant dans mon état habituel, je me fondais totalement en mon doux Jésus. Et je me déversais dans toutes les créatures dans le but de les remplir de Lui.\\n\\nMon aimable Jésus me dit :\\n\\n« Ma fille, chaque fois que la créature se fond en Moi,\\nelle communique les influences divines à toutes les créatures\\nqui, selon leurs besoins, sont ainsi visitées :\\n- ceux qui sont faibles ressentent la force ;\\n- ceux qui sont obstinés dans le péché reçoivent la lumière ;\\n- ceux qui souffrent reçoivent le réconfort ;\\net ainsi de suite. »\\n\\nAprès cela, je me suis retrouvée hors de mon corps au milieu de beaucoup d’âmes. Il me semblait que c’était des âmes du purgatoire et des saints. Ces âmes me parlaient d’une personne morte récemment que je connaissais.\\n\\nElles me disaient : « Comme elle est contente que les âmes qui portent l’empreinte des “Heures de la Passion” ne passent pas par le purgatoire ! Escortées par ces Heures, elles prennent position dans un endroit sécuritaire. De plus, il n’est pas une âme qui vole au Paradis qui ne soit accompagnée des “ Heures de la Passion ”.\\n\\nCes Heures répandent continuellement la rosée du Ciel\\n- sur la terre,\\n- dans le purgatoire et\\n- même dans le Ciel. »\\n\\nEn entendant cela je me disais :\\n« Peut-être que pour tenir parole\\n- à savoir que pour chaque mot des “ Heures de la Passion ”,\\nJésus sauverait une âme -\\nmon bien-aimé Jésus accorde qu’il n’y ait pas d’âmes sauvées\\nqui ne le soient par l’intermédiaire de ces Heures. »\\nAprès, je suis revenue dans mon corps.\\nAyant trouvé mon doux Jésus, je lui ai demandé si cela était vrai.\\n\\nIl me dit :\\n« Ces Heures mettent en harmonie le Ciel et la terre et M’empêchent de\\ndétruire le monde.\\nJe sens mon Sang, mes Plaies, mon Amour et tout ce que J’ai fait\\n- mis en circulation et\\n- se répandre sur tout pour tout sauver.\\n\\nQuand on médite ces Heures de la Passion, Je sens mon Sang, mes Plaies et mes anxiétés pour le salut des âmes mis en motion.\\n\\nJe sens ma Vie se répéter. Comment les créatures peuvent-elles obtenir quelque bien\\n\\nsi ce n’est par le truchement de ces Heures ?\\n\\nPourquoi en doutes-tu ? La chose n’est pas la tienne mais la Mienne. Tu as été le faible instrument. »\\n\\nLDC 12 - 12 juillet 1918 - Les fruits de la Passion de Jésus.\\n\\nJe priais pour une âme mourante avec un peu de crainte et d’anxiété.\\nMon aimable Jésus vint et Il me dit :\\n« Ma fille, pourquoi crains-tu ?\\nQuand une âme médite sur ma Passion,\\n- se rappelant mes souffrances\\n- en entretenant des pensées de compassion et de réparation,\\ndes chemins s’ouvrent entre elle et Moi\\net des Beautés variées viennent orner son âme.\\n\\nCette âme a fait les “ Heures de ma Passion ”.\\nEt Je la recevrai comme une fille de ma Passion,\\n- revêtue de mon Sang et ornée de mes Plaies.\\nCette fleur fut cultivée dans ton cœur\\nEt Je la bénis et la reçois dans mon Cœur comme une fleur de prédilection. »\\n\\nPendant qu’Il disait cela, une fleur partit de mon cœur et s’envola vers Jésus.\\n\\nLDC 13 - 21 octobre 1921 - Les Bienfaits de la méditation des Heures de la Passion.\\n\\nEn dépit de tous les bienfaits de ma Passion, on voit\\n- tant d’âmes faibles, aveugles, sourdes, muettes et boiteuses,\\n- en somme, de dégoûtants cadavres vivants.\\n\\nPourquoi ? On oublie ma Passion.\\n\\nAlors que mes Souffrances, mes Plaies et mon Sang offrent\\n- une Force pour surmonter la faiblesse,\\n- une Lumière pour donner la vue aux aveugles,\\n- une Langue pour délier les langues des muets et ouvrir les oreilles des\\nsourds,\\n- une Voie pour guider les faibles,\\n- la Vie pour ressusciter les morts.\\n\\nTous les remèdes dont l’humanité a tant besoin peuvent être trouvés dans ma Vie et ma Passion.\\n\\nLDC 13 - 21 octobre 1921 - La haute Valeur de la méditation des 24 Heures de la Passion.\\n\\nChaque fois\\n- que l’âme pense à ma Passion,\\n- qu’elle se souvient de ce que J’ai souffert ou\\n- qu’elle sent de la compassion pour Moi,\\nl’application de mes Souffrances est renouvelée en elle.\\n\\nMon Sang surgit pour l’inonder.\\nMes Plaies\\n- la guérissent si elle est blessée ou\\n- l’embellissent si elle est en santé\\nTous mes Mérites l’enrichissent.\\n\\nTout ce qui est nécessaire, c’est que l’âme le désire.\\n\\nAussi souvent que l’âme le désire, elle reçoit les Fruits de ma Vie. Si elle se souvient de ma Passion vingt, cent, ou mille fois, autant de fois elle jouira de ses Effets.\", \"paragraphs\": [{\"id\": \"PASSION24.SECTION.BENEFITS.P001\", \"t\": \"L'affection toute particulière et les belles promesses de Jésus envers ceux qui pratiqueront ces Heures.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P002\", \"t\": \"Le feuillet dont il est question plus haut contient quelques passages de Paroles que Notre-Seigneur a dites à Luisa.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P003\", \"t\": \"LDC 7 - 9 novembre 1906 - L’âme qui médite souvent ma Passion me donne beaucoup de réconfort.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P004\", \"t\": \"Lorsqu'une âme médite sur la Passion\\n- que Je souffris dans mon âme et mon corps\\n- avec tant d'Amour et de Souffrances infinies,\\net lorsqu'elle s'afflige et compatit avec Moi,\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P005\", \"t\": \"cela m'est tellement agréable que Je me sens comme dédommagé de toutes\\nles tortures et les ignominies que J'ai subies,\\n- non seulement dans ma Passion,\\n- mais à partir du moment de mon Incarnation\\njusqu' à mon dernier souffle sur la Croix.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P006\", \"t\": \"L'âme qui médite souvent sur ma Passion me réconforte de diverses façons :\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P007\", \"t\": \"Si, durant ma Passion, on Me lia avec des cordes et des chaînes, l'âme qui Me considère ainsi attaché et compatit avec Moi, Me délie et Me rend la liberté.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P008\", \"t\": \"Si les hommes d'armes Me méprisèrent, Me crachèrent dessus\\n- et Me déshonorèrent,\\nL'âme compatissante Me donne de l'estime,\\n- Me lave de ces crachats et M'honore.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P009\", \"t\": \"Si mes bourreaux Me dévêtirent et Me flagellèrent, l'âme compatissante Me guérit et M'habille.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P010\", \"t\": \"Si on Me couronna d'épines, si on Me traita comme un roi de plaisanterie, si on Me remplit la bouche de fiel et Me crucifia,\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P011\", \"t\": \"L'âme qui considère avec compassion toutes ces souffrances,\\n- Me couronne de Gloire, M'honore comme son Roi,\\n- Me remplit la bouche de douceur,\\n- Me décloue de la Croix et\\n- Me fait ressusciter dans son cœur.\\nEt, en échange\\n- de sa méditation amoureuse et\\n- de sa considération pour mes peines,\\nJe donne à cette âme une vie de grâces renouvelée.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P012\", \"t\": \"Tandis qu'elle M'attire à elle\\n- par la contemplation de mes Souffrances et par sa compassion,\\nJe l'attire à Moi et Je Me donne à elle comme Aliment spirituel.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P013\", \"t\": \"Tandis qu'elle se nourrit\\n- de mes Plaies, de mes Opprobres et des Agonies de mon Cœur,\\nJe me nourris\\n- de son âme en l’absorbant en Moi-même dans l'Amour.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P014\", \"t\": \"Voilà pourquoi la méditation dévote et fréquente de ma Passion M'est si agréable. »\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P015\", \"t\": \"LDC 11 - 10 avril 1913 - Méditer sur ma Passion fait naître dans le cœur une source salutaire.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P016\", \"t\": \"« Celui qui pense souvent à ma Passion fait naître dans son cœur comme une source salutaire. Plus l'âme s'applique à réfléchir et à méditer sur ma douloureuse Passion, plus le débit de cette source augmente.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P017\", \"t\": \"Les eaux qui coulent d'une fontaine sont des eaux pour tous,\\nDe même, cette source de salut, qui se forme dans le cœur de celui qui médite\\nsur ma Passion, sert\\n- à ma Gloire,\\n- au bien personnel de cette âme et\\n- au profit de beaucoup d'autres âmes. »\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P018\", \"t\": \"LDC 11 - 10 avril 1913 - Luisa demande à Jésus ce qu’Il va donner en échange de cette méditation.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P019\", \"t\": \"Luisa demanda à Jésus : « Dis-moi, Ô mon Bien, que donneras-Tu en échange aux âmes qui méditeront les Heures de ta Passion comme Tu me l'as enseigné ? »\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P020\", \"t\": \"Notre-Seigneur répondit : « Ma fille, ces Heures, Je ne les considérerai pas comme des choses provenant de vous, mais comme si c'était Moi qui les faisais.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P021\", \"t\": \"À ceux qui les méditeront, Je donnerai mes Mérites\\n- comme si Je souffrais la Passion durant ce temps qu'ils les méditent.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P022\", \"t\": \"Les effets\\n- que produisait ma Passion quand Je l'endurais, et\\n- qu'elle peut produire à toute époque,\\nseront renouvelés dans les âmes qui méditeront sur ces Heures,\\nselon la qualité de leurs dispositions intérieures.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P023\", \"t\": \"Il n 'y a pas de récompense plus grande que celle-là qu'on puisse recevoir en cette vie terrestre.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P024\", \"t\": \"Au Paradis, Je mettrai ces âmes en ma Présence divine, devant ma Face,\\nJe les darderai de flèches d'Amour et de contentements éternels.\\nEt, elles-mêmes, enivrées de mon Amour,\\n- me répondront en dardant mon Cœur de toute la capacité d'amour\\nqu'aura leur âme dans la béatitude céleste.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P025\", \"t\": \"Ceci constituera un doux enchantement pour tous les bienheureux du Ciel (c'est-à-dire toutes les créatures qui jouissent de la vue parfaite de Dieu). »\\n\\nLDC 11 - 6 septembre 1913 - Les Heures de la Passion sont issues du tréfonds du Cœur de Jésus.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P026\", \"t\": \"Je pensais aux Heures de la Passion et au fait qu'elles sont sans indulgences. Ceci fait que ceux qui les font ne gagnent rien, alors qu'il existe de nombreuses prières enrichies d'indulgences.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P027\", \"t\": \"Avec beaucoup de gentillesse, mon toujours aimable Jésus me dit :\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P028\", \"t\": \"« Ma fille, on peut gagner quelques choses par les prières indulgenciées.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P029\", \"t\": \"Mais les Heures de ma Passion,\\n- qui sont mes propres prières et\\n- qui débordent d'Amour,\\nviennent du tréfonds de mon Cœur.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P030\", \"t\": \"Aurais-tu oublié\\n- combien de temps Nous avons mis pour les composer et\\n- que, par elles, des châtiments se sont changés en grâces sur toute la terre ?\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P031\", \"t\": \"Ma satisfaction par rapport à ces prières est telle que,\\n- plutôt que des indulgences,\\nJe donne à l'âme une surabondance d'Amour\\naccompagnée de grâces d'un prix incalculable.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P032\", \"t\": \"Quand elles sont faites dans un Amour pur,\\n- elles permettent à mon Amour de se déverser.\\nEt cela n'est pas banal que la créature puisse\\n- donner du soulagement à son Créateur et\\n- lui permettre de déverser son Amour. »\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P033\", \"t\": \"LDC 11 - 6 septembre 1913 - Même s'il n'y avait qu'une seule âme qui les méditait, tu devrais être contente.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P034\", \"t\": \"Luisa raconte ceci :\\nUne autre fois, j'étais en train de me plaindre auprès de Jésus\\n- sur le fait que, après tant de sacrifices à écrire ces Heures de la Passion,\\nil y avait si peu d'âmes qui les méditaient.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P035\", \"t\": \"Jésus me dit : « Ne te plains pas, o fille. Même s'il n'y avait qu'une seule âme qui les méditait, tu devrais être contente.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P036\", \"t\": \"Est-ce que Moi, Je n'aurais pas souffert ma douloureuse Passion et ma Mort en Croix même pour une seule âme ? Tu dois agir ainsi toi aussi.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P037\", \"t\": \"Il ne faut jamais omettre le bien parce que peu de personnes en profiteraient.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P038\", \"t\": \"Ma Passion et ma Mort firent acquérir à ma sainte Humanité les mérites\\n- comme si tous allaient être sauvés,\\ntelle étant ma Volonté et le but de toutes mes Souffrances et de ma Mort.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P039\", \"t\": \"Ainsi toi, selon que ta volonté aura voulu faire du bien à tous dans ma Volonté, tu seras récompensée de ton travail dans cette même proportion.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P040\", \"t\": \"Tout le mal reviendra à ceux qui ne les mettront pas en pratique,\\n- soit à cause de leur nature infirme,\\n- soit à la suite de suggestions diaboliques. »\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P041\", \"t\": \"LDC 11 - 6 septembre 1913 - Cet exercice pieux de réparation est vraiment sorti de mon Cœur.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P042\", \"t\": \"Une autre fois, Jésus dit à Luisa :\\n« Les Heures de ma Passion furent remplies\\n- de mes Prières, de mes Réparations et de mon Amour.\\nCet exercice pieux de réparation fait dans la méditation de ces Heures\\n- est vraiment sorti de mon Cœur.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P043\", \"t\": \"Ah ! combien de fois, grâce à ces méditations pratiquées secrètement dans toute mon Église par tant d'âmes qui m'étaient chères, n'ai-Je pas changé des fléaux en grâces pour toute la terre !\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P044\", \"t\": \"Ces méditations ont un prix incalculable.\\nSi les exercices pieux que tu as pratiqués et que tu as mis par écrit\\n- sont pratiqués par d'autres avec amour,\\nmon Amour y trouvera son épanchement et son réconfort.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P045\", \"t\": \"Et sache, Ô fille, que ce n'est pas peu de choses que la créature donne\\n- du soulagement et\\n- de l'épanchement à l'Amour de son Créateur. »\\nLDC 11 - 6 septembre 1913 - Je souhaite la méditation de ces Heures\\ndans chaque cité ou village.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P046\", \"t\": \"Notre-Seigneur donna aussi à Luisa ces Paroles expressives qui résonnèrent au plus profond de son âme contemplative :\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P047\", \"t\": \"« Oh ! combien J’aimerais que dans chaque cité ou village il se trouve, ne fût-ce qu'une âme, qui s'applique à méditer ces Heures de ma Passion !\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P048\", \"t\": \"Alors, Je m'entendrais Moi-même dans chaque cité ou village. Et ma Justice qui en cette époque, est très indignée, serait en partie apaisée ! »\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P049\", \"t\": \"LDC 11 - 14 octobre 1914 - Luisa demanda à Jésus si ce petit ouvrage Lui serait agréable et dans quelle mesure.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P050\", \"t\": \"Luisa se répandait en compassion et en amour envers Jésus souffrant, du Jeudi Saint à 17h jusqu'au Vendredi Saint à 17h, alors que tout se termine par la sépulture de son Corps adorable.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P051\", \"t\": \"Après avoir mis par écrit ces Heures de la Passion, elle demanda, avec une confiance spéciale que son Époux céleste lui a donnée, si ce petit ouvrage Lui serait agréable et dans quelle mesure.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P052\", \"t\": \"Jésus lui répondit :\\n« En échange du fait que tu as écrit ces Heures de ma Passion,\\npour chaque mot que tu as écrit\\n- Je donnerai un baiser à ton âme et\\n- Je t'accorderai une âme. »\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P053\", \"t\": \"Et Luisa reprit : « Seigneur, c'est ce que Tu me donneras à moi, mais le donneras-Tu également à quiconque méditera ces Heures ? »\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P054\", \"t\": \"« Oui, répondit Notre-Seigneur,\\n- à chacun Je donnerai une âme, à chaque mot,\\n- à condition qu'il les médite uni à Moi et dans ma propre Volonté\\ncar l'efficacité de la méditation de ces Heures sera proportionnelle\\n- à l'union plus ou moins grande qu'on aura avec Moi.\\nSi l'âme les fait dans ma Volonté,\\n- elle se cachera avec Moi dans cette Volonté.\\nEt quand ma Volonté se met à agir, Je peux faire tout le bien que Je veux,\\n- même pour un seul mot, et ce, autant de fois qu'on méditera ainsi. »\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P055\", \"t\": \"LDC 11 - 14 octobre 1914 - La Valeur des Heures de la Passion.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P056\", \"t\": \"Quant à la Valeur de ces Heures, Notre-Seigneur a parlé ainsi :\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P057\", \"t\": \"Cette méditation est préférable à beaucoup d’autres exercices. Car cette méditation n'est rien d'autre qu'un renouvellement et une augmentation continus\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P058\", \"t\": \"- des Mérites\\n- de tout ce que J'ai fait et souffert au cours de ma Vie mortelle, et\\n- de ce que J'ai fait et que Je fais continuellement dans ma sainte Eucharistie.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P059\", \"t\": \"Quand Je vois une âme méditer ces Heures,\\n- J’entends ma propre Voix, mes propres Prières,\\n- Je vois ma propre Volonté en cette âme,\\nc'est-à-dire la volonté de vouloir le bien de tous et de réparer pour tous.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P060\", \"t\": \"Et Je Me sens attiré à demeurer en cette âme.\\n\\nLDC 11 - 4 novembre 1914 - La satisfaction que causent à Jésus les Heures de la Passion.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P061\", \"t\": \"Je faisais les Heures de la Passion et, tout heureux, Jésus me dit : « Ma fille, si tu savais quelle grande satisfaction Je ressens en te voyant refaire ces Heures de ma Passion encore et encore, tu en serais très heureuse.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P062\", \"t\": \"Il est vrai que mes saints ont médité ma Passion et ayant compris à quel point\\nJ'ai souffert, ils ont versé des larmes de compassion.\\n- jusqu'à se sentir consumés d'amour pour mes Souffrances.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P063\", \"t\": \"Cependant,\\nil ne s'agissait pas de cette manière toujours répétée et dans cet ordre.\\nTu es la première à Me donner ce plaisir si grand et si spécial\\n- de revivre intérieurement, Heure après Heure,\\nma Vie et tout ce que J'ai souffert.\\nJe Me sens si attiré par cela que, Heure après Heure,\\nJe te donne cette nourriture et Je la mange avec toi,\\n- faisant avec toi ce que tu fais.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P064\", \"t\": \"Sache que Je te récompenserai abondamment de Lumière et de Grâces nouvelles. Même après ta mort, chaque fois que des âmes sur la terre feront ces Heures, au Ciel Je te vêtirai de Lumière et de Gloire nouvelles. »\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P065\", \"t\": \"LDC 11 - 6 novembre 1914 - L'âme qui fait les Heures de la Passion devient corédemptrice.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P066\", \"t\": \"Pendant que, suivant mon habitude, je faisais les Heures de la Passion, mon aimable Jésus me dit :\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P067\", \"t\": \"« Ma fille,\\nle monde renouvelle sans cesse ma Passion.\\nPuisque mon immensité enveloppe toutes les créatures,\\n- tant intérieurement qu'extérieurement,\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P068\", \"t\": \"Je suis forcé, à leur contact, de recevoir\\n- clous, épines, coups de fouet,\\n- mépris, crachats et tout le reste\\ndont J'étais accablé pendant ma Passion, et même plus.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P069\", \"t\": \"Cependant, au contact des âmes qui font les Heures de ma Passion,\\nJe sens\\n- que les clous s'enlèvent, que les épines sont détruites,\\n- que mes blessures sont soulagées et que les crachats disparaissent.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P070\", \"t\": \"Je Me sens dédommagé pour le mal que les autres créatures Me font. Et, sentant que ces âmes ne Me font aucun mal, mais plutôt du bien, Je M'appuie sur elles. »\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P071\", \"t\": \"Jésus béni ajouta :\\n« Ma fille, sache qu'en faisant ces Heures, l'âme s'empare\\n- de mes Pensées, de mes Réparations, de mes Prières,\\n- de mes désirs, de mes affections et même\\n- de mes fibres les plus intimes.\\nEt elle les fait siens.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P072\", \"t\": \"S'élevant entre le Ciel et la terre, elle remplit la fonction de co-rédemptrice et elle dit à ma suite : \\\"Me voici, je veux réparer pour tous, implorer pour tous et répondre de tous.\\\" »\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P073\", \"t\": \"LDC 11 - 14 août 1915 - La Passion de Jésus, ses Plaies, son Sang et tout ce qu'Il a fait et souffert opèrent sans cesse.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P074\", \"t\": \"« Ma fille,\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P075\", \"t\": \"ma Passion, mes Plaies, mon Sang, et tout ce que J'ai fait et souffert opèrent sans cesse comme si tout se passait actuellement.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P076\", \"t\": \"Ils servent de supports\\n- sur lesquels Je peux M'appuyer et\\n- sur lesquels les âmes peuvent s'appuyer\\npour ne pas tomber dans le péché et pour être sauvées.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P077\", \"t\": \"En ces temps de châtiments, Je suis comme une personne\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P078\", \"t\": \"- suspendue dans les airs et\\n- qui reçoit des coups continuellement :\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P079\", \"t\": \"la Justice Me frappe à partir du Ciel et les créatures, par le péché, Me frappent à partir de la terre.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P080\", \"t\": \"Plus l'âme reste auprès de Moi,\\n- baisant mes Plaies,\\n- faisant réparation et\\n- offrant mon Sang,\\nen un mot, refaisant tout ce que J'ai fait durant ma Vie et ma Passion,\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P081\", \"t\": \"plus elle forme des supports\\n- sur lesquels Je peux M'appuyer pour ne pas tomber, et\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P082\", \"t\": \"plus le cercle s'agrandit où les âmes peuvent trouver appui\\n- pour ne pas tomber dans le péché et\\n- pour être sauvées.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P083\", \"t\": \"Ne te lasse pas, ma fille,\\n- de te tenir auprès de Moi et\\n- de parcourir mes Plaies encore et encore.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P084\", \"t\": \"Je te donnerai\\n- les pensées,\\n- les affections et\\n- les mots\\npour que tu puisses rester auprès de Moi.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P085\", \"t\": \"Sois-Moi fidèle. Parce que le temps est court. Et parce que, irritée par les créatures, la Justice veut déployer sa fureur. Il est nécessaire que les supports se multiplient. Ne cesse pas de travailler. »\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P086\", \"t\": \"LDC 11 - 23 avril 1916 - Chaque pensée sur la Passion de Jésus produit dans l'âme de la Lumière qui se transformera en Joie éternelle.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P087\", \"t\": \"Pendant que je me trouvais dans mon état habituel, mon aimable Jésus se montra tout inondé de Lumière.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P088\", \"t\": \"Cette Lumière émanait de sa très sainte Humanité et Lui conférait une très grande beauté. Je fus surprise et Il me dit :\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P089\", \"t\": \"« Ma fille,\\n- chaque douleur que J'ai subie dans mon Humanité,\\n- chaque goutte de Sang que J’ai versée,\\n- chaque Blessure, chaque Prière, chaque Parole, chaque Action, chaque Pas,\\netc., produisaient de la Lumière dans mon Humanité.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P090\", \"t\": \"Et cette Lumière M'embellissait au point que tous les bienheureux du Ciel en étaient ravis.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P091\", \"t\": \"En ce qui concerne les âmes,\\n- chaque pensée qu'elles ont sur ma Passion,\\n- chaque acte de compassion qu'elles effectuent,\\n- chaque acte de réparation, etc.\\nfait descendre en elles de la Lumière émanant de mon Humanité et qui les\\nembellit.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P092\", \"t\": \"Chaque pensée sur ma Passion est un ajout de Lumière qui se transformera en Joie éternelle. »\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P093\", \"t\": \"LDC 11 - 13 octobre 1916 - Les anges entourent les âmes qui font les Heures de la Passion. Ces Heures sont pour Jésus d'agréables petites douceurs.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P094\", \"t\": \"J'étais à faire les Heures de la Passion et Jésus béni me dit : « Ma fille, pendant ma Vie terrestre, des milliers et des milliers d'anges accompagnaient mon Humanité.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P095\", \"t\": \"Ils recueillaient tout ce que Je faisais : mes Pas, mes Travaux, mes Paroles,\\nmes Soupirs, mes Peines, les gouttes de mon Sang, etc.\\n- Ils Me donnaient des honneurs.\\n- Ils obéissaient à tous mes désirs.\\n- Et ils montaient au Ciel et en redescendaient\\npour apporter au Père tout ce que Je faisais.\\nCes anges ont une mission particulière :\\nQuand une âme se remémore ma Vie, ma Passion, mon Sang, mes Plaies,\\nmes Prières, etc.,\\n- ils viennent auprès de cette âme et\\n- ils recueillent ses paroles, ses prières, ses actes de compassion, ses larmes,\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P096\", \"t\": \"ses offrandes, etc.,\\n- ils les unissent aux Miens et les apportent devant ma majesté pour renouveler\\nma Gloire.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P097\", \"t\": \"Avec révérence, ils écoutent ce que les âmes disent et ils prient avec elles.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P098\", \"t\": \"Par conséquent, avec quelle attention et quel respect les âmes doivent-elles faire les Heures de la Passion, sachant que les anges sont suspendus à leurs lèvres pour répéter ce qu'elles disent ! » Il ajouta : « Au milieu de tant d'amertume que me donnent les créatures, ces Heures sont pour Moi d'agréables petites douceurs, même si elles sont trop peu nombreuses, vu toute l'amertume que Je reçois des créatures.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P099\", \"t\": \"Par conséquent, fais connaître ces Heures autant que tu peux. »\\n\\nLDC 11 - 14 Octobre 1914 - La Valeur des Heures de la Passion et les récompenses qui y sont attachées.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P100\", \"t\": \"Pendant que j'écrivais les Heures de la Passion, je me disais : « Que de sacrifices il me faut faire pour écrire ces Heures bénies de la Passion, surtout quand je dois mentionner certaines choses intérieures qui se sont passées entre moi et Jésus ! Quelle récompense me donnera-t-Il ? »\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P101\", \"t\": \"D'une voix tendre et douce, Il me dit : « Ma fille, pour chaque mot que tu as écrit, Je te donnerai un baiser, une âme. »\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P102\", \"t\": \"Je repris : « Mon Amour, cela est pour moi, mais que donneras-Tu à ceux qui les feront ? »\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P103\", \"t\": \"Il me dit : « S'ils les font avec Moi dans ma Volonté, Je leur donnerai aussi une âme pour chaque mot qu'ils réciteront. En fait, l'effet sera petit ou grand suivant la grandeur de leur union avec Moi. En les faisant dans ma Volonté, la créature se cache en Elle. Comme c'est ma Volonté qui agit, Je peux produire tous les biens que Je veux, même à travers un seul Mot. »\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P104\", \"t\": \"Une autre fois, Je me plaignais à Jésus en constatant qu'après tant de sacrifices pour écrire ces Heures, très peu d'âmes les font.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P105\", \"t\": \"Il me dit : « Ma fille, ne te plains pas. Même s'il n'y avait qu'une seule âme qui les faisait, tu devrais être contente. N'aurais-Je pas souffert ma Passion au complet même s'il n'y avait eu qu'une âme qui allait être sauvée ? De même pour toi.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P106\", \"t\": \"On ne doit pas omettre de faire le bien sous prétexte que peu de gens en profiteront. Le dommage sera du côté de ceux qui ne voudront pas en profiter.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P107\", \"t\": \"Ma Passion fit acquérir à mon Humanité le mérite nécessaire pour que tous soient sauvés, même si certains ne veulent pas en profiter.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P108\", \"t\": \"La même chose pour toi : tu seras récompensée dans la proportion où ta\\nvolonté aura été identifiée à la Mienne et aura voulu le bien de tous.\\nTout le dommage est du côté de ceux qui,\\nbien qu'ils en soient capables, ne les font pas.\\nCes Heures sont très précieuses parce qu'elles ne sont rien d'autre\\n- que la répétition de ce que J'ai fait au cours de ma Vie mortelle et\\n- que Je continue de faire dans le très saint Sacrement.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P109\", \"t\": \"Quand J'entends ces Heures, J'entends ma propre Voix, mes propres Prières.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P110\", \"t\": \"Dans l'âme qui fait ces Heures, Je vois ma Volonté voulant\\n- le bien de tous et\\n- la réparation pour tous\\nEt Je me sens attiré à venir habiter en cette âme pour y faire ce qu'elle fait.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P111\", \"t\": \"Oh ! comme J'aimerais que, dans chaque ville, il y ait au moins une âme qui fasse les Heures de ma Passion ! Je m'entendrais ainsi dans chaque ville. Et ma Justice, si indignée en ces temps, serait en partie apaisée. » Un jour, alors que j'en étais à l'Heure où la céleste Maman participa à l'ensevelissement de Jésus, je me tenais près d'elle pour la consoler.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P112\", \"t\": \"En fait, je ne faisais généralement pas cette Heure et j'hésitais à la faire.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P113\", \"t\": \"Sur un ton suppliant et plein d'amour, Jésus béni me dit :\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P114\", \"t\": \"« Ma fille, Je ne veux pas que tu omettes cette Heure-là.\\nTu la feras\\n- par amour pour Moi et\\n- en l'honneur de ma Maman.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P115\", \"t\": \"Sache que chaque fois que tu la fais,\\n- ma Maman se sent comme si elle revivait sa vie terrestre et\\n- elle reçoit la gloire et l'amour qu'elle me donnait.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P116\", \"t\": \"Quant à Moi, Je ressens\\n- sa tendresse maternelle, son amour\\n- et toute la gloire qu'elle me donnait.\\nDe plus, Je te considère comme une mère. »\\nEnsuite, Il m'embrassa et me dit avec une grande douceur :\\n« Ma maman, maman ! »,\\nEt Il me murmura tout ce que sa douce Maman fit et souffrit durant cette Heure.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P117\", \"t\": \"À partir de cet instant, aidé de sa grâce, je n'ai plus jamais omis cette Heure.\\n\\nLDC 11 - 4 novembre 1914 - La satisfaction que causent à Jésus les Heures de la Passion.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P118\", \"t\": \"Je faisais les Heures de la Passion et, tout heureux, Jésus me dit :\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P119\", \"t\": \"« Ma fille, si tu savais quelle grande satisfaction Je ressens\\n- en te voyant refaire ces Heures de ma Passion encore et encore,\\ntu en serais très heureuse.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P120\", \"t\": \"Il est vrai que mes saints ont médité ma Passion et ayant compris à quel point\\nJ'ai souffert, ils ont versé des larmes de compassion jusqu'à se sentir consumés d'amour pour mes souffrances.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P121\", \"t\": \"Cependant,\\nil ne s'agissait pas de cette manière toujours répétée et dans cet ordre.\\nTu es la première à Me donner ce plaisir si grand et si spécial\\n- de revivre intérieurement, Heure après Heure,\\nma Vie et tout ce que J'ai souffert.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P122\", \"t\": \"Je me sens si attiré par cela que, Heure après Heure,\\nJe te donne cette nourriture et Je la mange avec toi,\\n- faisant avec toi ce que tu fais.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P123\", \"t\": \"Sache que Je te récompenserai abondamment\\n- de Lumière et de Grâces nouvelles.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P124\", \"t\": \"Même après ta mort, chaque fois que des âmes sur la terre feront ces Heures, au Ciel Je te vêtirai de Lumière et de Gloire nouvelles. »\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P125\", \"t\": \"LDC 11 - 6 novembre 1914 - L'âme qui fait les Heures de la Passion devient corédemptrice.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P126\", \"t\": \"Pendant que, suivant mon habitude, je faisais les Heures de la Passion, mon aimable Jésus me dit :\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P127\", \"t\": \"« Ma fille,\\nle monde renouvelle sans cesse ma Passion.\\nPuisque mon immensité enveloppe toutes les créatures,\\n- tant intérieurement qu'extérieurement,\\nJe suis forcé, à leur contact, de recevoir\\n- clous, épines, coups de fouet,\\n- mépris, crachats et tout le reste\\ndont J'étais accablé pendant ma Passion, et même plus.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P128\", \"t\": \"Cependant, au contact des âmes qui font les Heures de ma Passion,\\nJe sens\\n- que les clous s'enlèvent, que les épines sont détruites,\\n- que mes blessures sont soulagées et que les crachats disparaissent.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P129\", \"t\": \"Je Me sens dédommagé pour le mal que les autres créatures me font. Et, sentant que ces âmes ne Me font aucun mal, mais plutôt du bien, Je M'appuie sur elles. » Jésus béni ajouta :\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P130\", \"t\": \"« Ma fille, sache qu'en faisant ces Heures,\\nl'âme s'empare\\n- de mes Pensées, de mes Réparations, de mes Prières,\\n- de mes désirs, de mes affections et même\\n- de mes fibres les plus intimes.\\nEt elle les fait siens.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P131\", \"t\": \"S'élevant entre le Ciel et la terre, elle remplit la fonction de co-rédemptrice et elle dit à ma suite :\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P132\", \"t\": \"\\\"Me voici, je veux réparer pour tous, implorer pour tous et répondre de tous.\\\" »\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P133\", \"t\": \"LDC 11 - 9 décembre 1916 - Jésus veut des âmes qui soient d'autres Lui-même.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P134\", \"t\": \"J'étais affligée à cause de la privation de mon doux Jésus. Quand Il vient, je ressens un peu de soulagement. Mais je deviens vite plus affligée en le voyant plus affligé que moi.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P135\", \"t\": \"Il n'est pas question qu'Il s'apaise\\n- puisque les créatures le forcent à envoyer encore plus de fléaux.\\nPendant qu’Il sévit, Il pleure sur le sort de l'humanité.\\nEt Il se cache au tréfonds de mon cœur\\ncomme s'Il ne voulait pas voir les souffrances de ses créatures.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P136\", \"t\": \"Ces temps sont invivables, mais il semble que ce n'est que le commencement. Comme j'étais très affligée à cause de mon pénible sort, celui d'être si souvent sans Jésus, Il vint et, entourant mon cou d'un de ses bras, Il me dit :\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P137\", \"t\": \"« Ma fille, n'augmente pas mes souffrances en t'affligeant de la sorte.\\nJ'en ai déjà beaucoup trop. Je n'attends pas cela de toi.\\nJ'attends de toi que tu t'appropries\\n- mes Peines,\\n- mes Prières et\\n- tout Moi-même\\nDe sorte que Je puisse trouver en toi un autre Moi-même.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P138\", \"t\": \"En ces temps, Je veux de grandes satisfactions. Et seulement ceux qui sont d'autres Moi-même peuvent répondre à cette attente.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P139\", \"t\": \"Ce que le Père trouvait en Moi :\\n- Gloire, Délices, Amour,\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P140\", \"t\": \"- satisfactions complètes pour le bien de tous\\nIl le trouve en ces âmes.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P141\", \"t\": \"Tu dois avoir ces intentions\\n- à chaque Heure de la Passion que tu fais,\\n- à chacune de tes actions,\\ntout le temps.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P142\", \"t\": \"Si Je ne trouve pas ces satisfactions, ah ! ce sera le désastre : les fléaux vont se répandre par torrents. Ah ! Ma fille ! Ah ! Ma fille ! » Puis Il disparut.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P143\", \"t\": \"Bienfaits de la méditation des Heures de la Passion\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P144\", \"t\": \"LDC 11 - 2 février 1917 - Le monde est devenu déséquilibré parce qu'il a perdu la pensée de la Passion.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P145\", \"t\": \"Étant dans mon état habituel, je me suis retrouvée hors de mon corps. J'ai vu mon aimable Jésus ruisselant de Sang et couvert d'une horrible couronne d'épines.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P146\", \"t\": \"Me regardant avec difficulté à travers les épines, Il me dit : « Ma fille, le monde est devenu déséquilibré parce qu'il a perdu la pensée de ma Passion. Dans la noirceur, il n'a pas trouvé la Lumière de ma Passion qui\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P147\", \"t\": \"l'aurait éclairé. Cette Lumière lui aurait fait connaître\\n- mon Amour et combien les âmes M'ont coûté.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P148\", \"t\": \"Il se serait mis à aimer Celui qui l'a tant aimé. Et la Lumière de ma Passion l'aurait guidé et mis sur ses gardes au milieu des dangers.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P149\", \"t\": \"Dans la faiblesse,\\n- il n'a pas trouvé la Force de ma Passion qui l'aurait soutenu.\\nDans l'impatience,\\n- il n'a pas trouvé le miroir de ma Patience\\nqui lui aurait infusé le calme et la résignation.\\nEt, à la vue de ma Patience,\\n- il se serait senti gêné et\\n- il se serait fait un devoir de se dominer.\\nDans les souffrances, il n'a pas trouvé le réconfort des Souffrances d'un Dieu\\nqui lui aurait infusé l'amour de la souffrance.\\nDans le péché, il n'a pas trouvé ma Sainteté\\n- qui lui aurait infusé la haine du péché.\\nAh ! L’homme a abusé de tout.\\nParce que, sur tous les points, il s'est éloigné de Celui qui aurait pu l'aider.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P150\", \"t\": \"Voilà pourquoi le monde est devenu déséquilibré. Il s'est comporté\\n- comme un enfant qui ne veut plus reconnaître sa mère, ou\\n- comme un disciple qui, reniant son maître, ne veut plus entendre ses\\nenseignements.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P151\", \"t\": \"Qu'est-ce qui va arriver à cet enfant et à ce disciple ? Ils seront la honte de la société. Tel est devenu l'homme. Ah ! Il va de mal en pis et Je pleure sur lui avec des larmes de Sang ! »\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P152\", \"t\": \"LDC 12 - 16 mai 1917 - Les avantages que l’on trouve à se fondre en Jésus. Les “Heures de la Passion” mettent la Rédemption en action.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P153\", \"t\": \"Me trouvant dans mon état habituel, je me fondais totalement en mon doux Jésus. Et je me déversais dans toutes les créatures dans le but de les remplir de Lui.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P154\", \"t\": \"Mon aimable Jésus me dit :\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P155\", \"t\": \"« Ma fille, chaque fois que la créature se fond en Moi,\\nelle communique les influences divines à toutes les créatures\\nqui, selon leurs besoins, sont ainsi visitées :\\n- ceux qui sont faibles ressentent la force ;\\n- ceux qui sont obstinés dans le péché reçoivent la lumière ;\\n- ceux qui souffrent reçoivent le réconfort ;\\net ainsi de suite. »\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P156\", \"t\": \"Après cela, je me suis retrouvée hors de mon corps au milieu de beaucoup d’âmes. Il me semblait que c’était des âmes du purgatoire et des saints. Ces âmes me parlaient d’une personne morte récemment que je connaissais.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P157\", \"t\": \"Elles me disaient : « Comme elle est contente que les âmes qui portent l’empreinte des “Heures de la Passion” ne passent pas par le purgatoire ! Escortées par ces Heures, elles prennent position dans un endroit sécuritaire. De plus, il n’est pas une âme qui vole au Paradis qui ne soit accompagnée des “ Heures de la Passion ”.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P158\", \"t\": \"Ces Heures répandent continuellement la rosée du Ciel\\n- sur la terre,\\n- dans le purgatoire et\\n- même dans le Ciel. »\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P159\", \"t\": \"En entendant cela je me disais :\\n« Peut-être que pour tenir parole\\n- à savoir que pour chaque mot des “ Heures de la Passion ”,\\nJésus sauverait une âme -\\nmon bien-aimé Jésus accorde qu’il n’y ait pas d’âmes sauvées\\nqui ne le soient par l’intermédiaire de ces Heures. »\\nAprès, je suis revenue dans mon corps.\\nAyant trouvé mon doux Jésus, je lui ai demandé si cela était vrai.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P160\", \"t\": \"Il me dit :\\n« Ces Heures mettent en harmonie le Ciel et la terre et M’empêchent de\\ndétruire le monde.\\nJe sens mon Sang, mes Plaies, mon Amour et tout ce que J’ai fait\\n- mis en circulation et\\n- se répandre sur tout pour tout sauver.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P161\", \"t\": \"Quand on médite ces Heures de la Passion, Je sens mon Sang, mes Plaies et mes anxiétés pour le salut des âmes mis en motion.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P162\", \"t\": \"Je sens ma Vie se répéter. Comment les créatures peuvent-elles obtenir quelque bien\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P163\", \"t\": \"si ce n’est par le truchement de ces Heures ?\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P164\", \"t\": \"Pourquoi en doutes-tu ? La chose n’est pas la tienne mais la Mienne. Tu as été le faible instrument. »\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P165\", \"t\": \"LDC 12 - 12 juillet 1918 - Les fruits de la Passion de Jésus.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P166\", \"t\": \"Je priais pour une âme mourante avec un peu de crainte et d’anxiété.\\nMon aimable Jésus vint et Il me dit :\\n« Ma fille, pourquoi crains-tu ?\\nQuand une âme médite sur ma Passion,\\n- se rappelant mes souffrances\\n- en entretenant des pensées de compassion et de réparation,\\ndes chemins s’ouvrent entre elle et Moi\\net des Beautés variées viennent orner son âme.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P167\", \"t\": \"Cette âme a fait les “ Heures de ma Passion ”.\\nEt Je la recevrai comme une fille de ma Passion,\\n- revêtue de mon Sang et ornée de mes Plaies.\\nCette fleur fut cultivée dans ton cœur\\nEt Je la bénis et la reçois dans mon Cœur comme une fleur de prédilection. »\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P168\", \"t\": \"Pendant qu’Il disait cela, une fleur partit de mon cœur et s’envola vers Jésus.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P169\", \"t\": \"LDC 13 - 21 octobre 1921 - Les Bienfaits de la méditation des Heures de la Passion.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P170\", \"t\": \"En dépit de tous les bienfaits de ma Passion, on voit\\n- tant d’âmes faibles, aveugles, sourdes, muettes et boiteuses,\\n- en somme, de dégoûtants cadavres vivants.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P171\", \"t\": \"Pourquoi ? On oublie ma Passion.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P172\", \"t\": \"Alors que mes Souffrances, mes Plaies et mon Sang offrent\\n- une Force pour surmonter la faiblesse,\\n- une Lumière pour donner la vue aux aveugles,\\n- une Langue pour délier les langues des muets et ouvrir les oreilles des\\nsourds,\\n- une Voie pour guider les faibles,\\n- la Vie pour ressusciter les morts.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P173\", \"t\": \"Tous les remèdes dont l’humanité a tant besoin peuvent être trouvés dans ma Vie et ma Passion.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P174\", \"t\": \"LDC 13 - 21 octobre 1921 - La haute Valeur de la méditation des 24 Heures de la Passion.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P175\", \"t\": \"Chaque fois\\n- que l’âme pense à ma Passion,\\n- qu’elle se souvient de ce que J’ai souffert ou\\n- qu’elle sent de la compassion pour Moi,\\nl’application de mes Souffrances est renouvelée en elle.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P176\", \"t\": \"Mon Sang surgit pour l’inonder.\\nMes Plaies\\n- la guérissent si elle est blessée ou\\n- l’embellissent si elle est en santé\\nTous mes Mérites l’enrichissent.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P177\", \"t\": \"Tout ce qui est nécessaire, c’est que l’âme le désire.\"}, {\"id\": \"PASSION24.SECTION.BENEFITS.P178\", \"t\": \"Aussi souvent que l’âme le désire, elle reçoit les Fruits de ma Vie. Si elle se souvient de ma Passion vingt, cent, ou mille fois, autant de fois elle jouira de ses Effets.\"}]}, {\"section_id\": \"PASSION24.SECTION.PRACTICE_METHODS\", \"segment_type\": \"PRACTICE_METHODS\", \"title\": \"Méthodes de pratique\", \"display_text\": \"Méthodes pour la pratique des Heures de la Passion\\n\\nLa pratique de la dévotion des Heures douloureuses\\n- pourra sembler malaisée, sinon impossible.\\nComment pourrait-on passer tous ses jours à méditer durant 24 Heures,\\nde 17h aujourd'hui à 17h demain, et puis recommencer demain ?\\n\\nIl est évident que cela est humainement impossible.\\nGrâce à un secours spécial de la Grâce divine,\\nLuisa a fait cette méditation continue pendant maintes années.\\nQuant à nous, la méditation des 24 Heures de la Passion,\\n- de la Mort et de la Sépulture de Notre-Seigneur,\\npeut se faire de diverses manières,\\n\\n- selon les conditions et les circonstances.\\n\\nVoici trois suggestions :\\n\\nPremière manière :\\npenser à la Passion au moins à chaque Heure de la journée et de la nuit.\\nLa première manière s'adresse aux personnes\\n- qui vivent une vie plutôt retirée et contemplative,\\nsoit au monastère, soit à la maison.\\nCes personnes sont certainement peu nombreuses.\\n\\nLa méthode consiste à d'abord lire ce Livre des Heures en entier, un passage à la fois, en quelques jours, comme on le peut et en méditant.\\n\\nC’est bien de se former une idée d'ensemble. Puis la personne, chaque fois que l'heure sonne, peut se rendre présents à l'esprit le titre et le contenu de cette Heure.\\n\\nEt si, vu ses occupations, elle ne peut faire plus, elle tâchera au moins\\n- d'avoir présent à l'esprit le mystère concerné,\\n- de se recueillir en esprit et\\n- de faire monter quelques ferventes prières intérieures.\\n\\nPour cela, il sera utile\\n- d’apprendre par cœur la table des 24 Heures avec les mystères de l’Heure.\\n- d'avoir à la portée des yeux une liste de ces Heures.\\nSi possible, on lira le texte du Mystère correspondant dans le livre.\\n\\nChaque fois que l’âme le désire et qu’elle est attentive et persévérante, l'aide de la Grâce divine sera toujours présente.\\n\\nNous pouvons faire ainsi pendant la journée.\\nMais, durant la nuit,\\n- normalement le sommeil est indispensable (au moins cinq ou six heures).\\n\\nLa personne dévote pourra, avant d'aller au lit, lire une ou deux Heures\\nd'avance - dont la lecture ne dépassera pas soixante minutes.\\nQuant aux autres Heures de la nuit,\\n- nous pouvons en lire au moins les titres,\\n\\n- puis former l'intention que,\\npendant que l'on dormira, nous voulons les méditer en esprit.\\n\\nNotre-Seigneur, dans sa Bonté infinie,\\n- agrée cette intention comme si elle était l'action elle-même.\\n\\nDeuxième manière : consacrer une heure par jour à la lecture et à la méditation de la Passion de Notre-Seigneur.\\n\\nLes gens qui, durant la journée, sont occupés à de multiples affaires,\\n- domestiques ou autres,\\npourraient mettre en pratique cet exercice pieux\\n- d'une autre manière mieux adaptée à leur situation.\\nNous admettons qu'ils veulent consacrer au moins une heure par jour à la\\nlecture et à la méditation de la Passion de Notre-Seigneur,\\nIls peuvent le faire aussi en deux étapes :\\nc'est-à-dire une demi-heure le matin et une demi-heure en soirée.\\n\\nIls commencent à la première page de ces Heures. Ils en lisent et en méditent un certain nombre de pages (pendant une trentaine de minutes). Et puis, le soir, durant la deuxième demi-heure, ils poursuivent.\\n\\nIls procèdent ainsi chaque jour, allant toujours de l'avant, jusqu'à ce qu'après un certain nombre de jours, ils aient parcouru tout le livre. Alors, ils recommencent au début pour le refaire au complet. Et puis encore une fois. Ils continuent ainsi pendant un certain nombre de mois.\\n\\nQuand ils ont une bonne idée d'ensemble de toutes les Heures,\\nils peuvent très bien continuer à faire leur méditation habituelle de\\n- trente minutes le matin et\\n- de trente minutes le soir\\nen variant les mystères comme d'habitude.\\n\\nMais ils peuvent aller plus loin.\\nDurant les autres heures de la journée, ils peuvent\\n- lire les titres ou y penser, et\\n- former l'intention de vouloir méditer ces mystères d'heure en heure,\\n\\nc'est-à-dire même au milieu de leurs occupations.\\n\\nAvant le sommeil de la nuit, ils forment l'intention de méditer\\n- sur les mystères correspondants pendant qu'ils dormiront,\\nayant lu auparavant seulement les titres.\\n\\nCependant, le vendredi, il serait préférable de méditer sur\\n- la Crucifixion (Heure 19) et\\n- les trois Heures d'Agonie sur la Croix. (Heure 20-21-22)\\n\\nIl est bien entendu que ces méditations, comme toute oraison mentale, doivent\\nêtre accompagnées\\n- d'une préparation,\\n- puis d'affections, d'actes d'amour et d'autres choses semblables,\\nsans omettre de faire les remerciements à la fin.\\n\\nTroisième manière : 24 personnes méditent chacun une Heure par jour. Il y a une méthode qui permet de méditer toutes les Heures chaque jour. 24 personnes peuvent s'associer pour faire cet exercice. Chacune prend une heure.\\n\\nCelles à qui revient une heure de la nuit pourraient\\n- la faire d'avance, en soirée, et\\n- puis former l'intention de la répéter à l'heure correspondante,\\nmême durant le sommeil.\\n\\nMais si on pouvait trouver huit personnes ferventes,\\n- toutes disposées à faire une heure de veille durant la nuit\\npar amour pour Jésus,\\n- Lui qui passa toutes ses nuits à prier pour nous,\\nalors, de 22h à 6h, ces huit personnes feraient chacune l'Heure assignée.\\n\\nAinsi, toutes les 24 Heures seraient mises en pratique de manière\\nininterrompue,\\n- au grand plaisir de Notre-Seigneur et\\n- au grand profit des 24 personnes qui les feraient, et\\n- pour le bien de toute I'Église militante, de toute l'Église souffrante, et\\n- pour la gloire de l'Église triomphante.\\n\\nAvec un peu de bonne volonté, cette manière de faire pourrait être pratiquée\\nchez les communautés religieuses contemplatives\\n- qui en recevraient des bénédictions spéciales de Dieu.\\n\\nLes 24 Heures de la Passion de Notre-Seigneur Jésus-Christ De 17h à 18h : Jésus fait ses adieux à sa Mère. De 18h à 19h : Jésus se sépare de sa Très Sainte Mère et se rend au Cénacle. De 19h à 20h : La cène légale. De 20h à 21h : Le lavement des pieds - La Cène Eucharistique. De 21h à 22h : Première Heure d'Agonie dans le Jardin. De 22h à 23h : Deuxième Heure d'Agonie dans le Jardin. De 23h à 24h : Troisième Heure d'Agonie dans le Jardin. De 24h à 1h : L'arrestation de Jésus dans le Jardin des Oliviers. De 1h à 2h : Jésus est précipité dans le torrent du Cédron.\\n\\nDe 2h à 3h : Jésus est présenté à Anne. De 3h à 4h : Chez Caïphe, Jésus accusé par de faux témoins. De 4h à 5h : Jésus est parmi les soldats. De 5h à 6h : L'emprisonnement de Jésus. De 6h à 7h : Jésus est ramené chez Caïphe, puis conduit chez Pilate. De 7h à 8h : Jésus est devant Pilate, puis devant Hérode. De 8h à 9h : Barabbas est préféré à Jésus - La flagellation. De 9h à 10h : Le couronnement d'épines - La condamnation à mort. De 10h à 11h : Jésus est chargé de sa Croix et conduit au Calvaire où on le dépouille de ses vêtements. De 11h à midi : La crucifixion. De midi à 13h : Première heure d'Agonie sur la Croix. De 13h à 14h : Deuxième heure d'Agonie sur la Croix. De 14h à 15h : Troisième heure d'Agonie sur la Croix. La Mort de Jésus. De 15h à 16h : Jésus transpercé par la lance - Sa déposition. De 16h à 17h : La sépulture de Jésus. La Désolation de la Vierge Marie Prière avant chaque Heure\"}, {\"section_id\": \"PASSION24.SECTION.GETHSEMANI\", \"segment_type\": \"GETHSEMANI_SPECIAL\", \"title\": \"Les trois Heures de Gethsémani\", \"display_text\": \"Règle spéciale : les Heures 5, 6 et 7 utilisent l’oraison préparatoire et la prière de remerciement de l’Heure Sainte.\"}]}");

  remove(key)     { try { localStorage.removeItem(key); } catch(e){} }
};

// ── Persistence ──
function saveState() {
  try {
    localStorage.setItem('lp24_schema', STORAGE_SCHEMA_VERSION);
    localStorage.setItem('lp24_read', JSON.stringify([...state.readHours]));
    localStorage.setItem('lp24_favs', JSON.stringify(state.favorites));
    localStorage.setItem('lp24_hl', JSON.stringify([...state.highlights]));
    localStorage.setItem('lp24_thl', JSON.stringify(state.textHighlights));
    localStorage.setItem('lp24_tabs', JSON.stringify(state.hourTabs));
    localStorage.setItem('lp24_pos', JSON.stringify(state.lastParas));
    localStorage.setItem('lp24_font', state.fontSize);
    localStorage.setItem('lp24_theme', state.theme);
    if (state.currentHour) localStorage.setItem('lp24_lastHour', state.currentHour);
    localStorage.setItem('lp24_med', JSON.stringify(state.meditationLog));
  } catch(e) {}
}
function loadState() {
  try {
    const storedSchema=parseInt(localStorage.getItem('lp24_schema')||'1');
    if(storedSchema<STORAGE_SCHEMA_VERSION){localStorage.removeItem('lp24_thl');}
    const r = localStorage.getItem('lp24_read'); if (r) state.readHours = new Set(JSON.parse(r));
    const f = localStorage.getItem('lp24_favs');
    if (f) {
      const favData = JSON.parse(f);
      Object.values(favData).forEach(fav => {
        if (!fav.type) {
          fav.type = fav.id && fav.id.includes('.REF.') ? 'reflection' :
                     fav.id && fav.id.includes('.DESOL.') ? 'subsection' : 'meditation';
        }
      });
      state.favorites = favData;
    }
    const h = localStorage.getItem('lp24_hl'); if (h) state.highlights = new Set(JSON.parse(h));
    const thl = localStorage.getItem('lp24_thl'); if (thl) { try { state.textHighlights = JSON.parse(thl); } catch(e) {} }
    const tabs=localStorage.getItem('lp24_tabs'); if(tabs){try{state.hourTabs=JSON.parse(tabs);}catch(e){}}
    const pos=localStorage.getItem('lp24_pos');   if(pos){try{state.lastParas=JSON.parse(pos);}catch(e){}}
    const fs = localStorage.getItem('lp24_font'); if (fs !== null) state.fontSize = parseInt(fs);
    const th = localStorage.getItem('lp24_theme'); if (th) state.theme = th;
  } catch(e) {}
  state.studyMode = SafeStorage.get('lp24_mode','0') === '1';
  try { state.meditationLog = JSON.parse(localStorage.getItem('lp24_med') || '[]'); } catch(e) { state.meditationLog = []; }
  applyFontSize(); applyTheme();
}

// ── Prayer Modal ──
function renderPrayerParagraph(pr, p, modal = false) {
  const txt = p.t || '';
  const paraClass = modal ? 'prayer-modal-para' : 'block-paragraph';
  if (pr.prayer_id === 'PASSION24.PRAYER.DE_PROFUNDIS') {
    if (/^Psaume\s+129/i.test(txt)) return `<div class="psalm-title">${escHtml(txt)}</div>`;
    const lines = txt.split('\n');
    const rendered = lines.map(line => {
      const m = line.match(/^(\d{2})\s+(.*)$/);
      if (m) return `<div class="psalm-verse"><span class="psalm-num">${escHtml(m[1])}</span><span class="psalm-line">${escHtml(m[2])}</span></div>`;
      return `<div class="psalm-verse"><span class="psalm-num" aria-hidden="true"></span><span class="psalm-line">${escHtml(line)}</span></div>`;
    }).join('');
    return `<div class="psalm-stanza">${rendered}</div>`;
  }
  return `<p class="${paraClass}">${escHtml(txt)}</p>`;
}
let _prayerModalTrigger = null;
function openPrayerModal(prayerId, isHoly = false) {
  const pr = PRAYERS[prayerId];

function closePrayerModal() {

// ── History ──
function pushHistory(v, d) {
  state.history.push({view: v, data: d});
  document.getElementById('backBtn').style.display = 'flex';
}
function goBack() {
  if (!state.history.length) return;
  const prev = state.history.pop();
  document.getElementById('backBtn').style.display = state.history.length ? 'flex' : 'none';
  if (prev.view === 'home') { state.view = 'home'; renderHome(); }
  else if (prev.view === 'reader') { state.currentHour = prev.data; renderReader(CORPUS.hours.find(h => h.hour_number === prev.data), false); }
  else if (prev.view === 'section') { state.currentSection = prev.data; openSection(prev.data, false); }
  else if (prev.view === 'prayer') { state.currentPrayer = prev.data; openPrayer(prev.data, false); }
  else if (prev.view === 'provenance' || prev.view === 'help') { showHelp(); }
  else if (prev.view === 'search') { showSearchView(); }
  buildSidebar();
}

// ─── Daily meditation tracking ────────────────────────────────
function getLocalDateStr() {
  const d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}
function getLocalDateYesterday() {
  const d = new Date(); d.setDate(d.getDate()-1);
  return d.getFullYear() + '-' +
    String(d.getMonth()+1).padStart(2,'0') + '-' +
    String(d.getDate()).padStart(2,'0');
}
function markHourMeditated(hourNum) {
  const today = getLocalDateStr();
  state.meditationLog = state.meditationLog.filter(e => e.date !== today);
  state.meditationLog.push({ date: today, hour: hourNum });
  if (state.meditationLog.length > 100) state.meditationLog = state.meditationLog.slice(-100);
  saveState();
  showToast('\u2713\u00a0' + hourNum + 'e\u00a0Heure m\u00e9dit\u00e9e');
  const bar = document.getElementById('markMeditatedBar');
  if (bar) bar.outerHTML = buildMarkBar(hourNum);
}
function buildMarkBar(hourNum) {
  const today = getLocalDateStr();
  const done = state.meditationLog.some(e => e.date === today && e.hour === hourNum);
  if (done) return '<div class="mark-bar done" id="markMeditatedBar"><span class="mark-hint">\u2713\u00a0M\u00e9dit\u00e9e aujourd\u2019hui</span></div>';
  return '<div class="mark-bar" id="markMeditatedBar"><button class="mark-btn" onclick="markHourMeditated(' + hourNum + ')">\u2713\u00a0M\u00e9dit\u00e9e aujourd\u2019hui</button><span class="mark-hint">Appuyez apr\u00e8s votre m\u00e9ditation</span></div>';
}
function buildDailyCard() {
  if (!state.meditationLog || !state.meditationLog.length) return '';
  const last = state.meditationLog[state.meditationLog.length-1];
  const today = getLocalDateStr();
  const yesterday = getLocalDateYesterday();
  const lastH = CORPUS.hours.find(h => h.hour_number === last.hour);
  const nextNum = last.hour === 24 ? 1 : last.hour + 1;
  const nextH  = CORPUS.hours.find(h => h.hour_number === nextNum);
  if (!lastH || !nextH) return '';
  if (last.date === today) {
    return '<div class="daily-card done"><div class="dc-check">\u2713</div><div class="dc-meta"><div class="dc-label">M\u00e9dit\u00e9e aujourd\u2019hui</div><div class="dc-title">' + escHtml(lastH.hour_number + 'e\u00a0Heure \u2014 ' + lastH.title) + '</div><div class="dc-next">Prochaine\u00a0: ' + nextNum + 'e\u00a0Heure \u2014 ' + escHtml(nextH.short_title||nextH.title) + '</div></div></div>';
  }
  const MOIS = ['jan','f\u00e9v','mar','avr','mai','jun','jul','ao\u00fb','sep','oct','nov','d\u00e9c'];
  let timeLabel = last.date === yesterday ? 'Hier' : (function(){ const [,m,d]=last.date.split('-'); return parseInt(d)+'\u00a0'+MOIS[parseInt(m)-1]; })();
  return '<div class="daily-card" onclick="openHour(' + nextNum + ')"><div class="dc-meta"><div class="dc-prev">' + timeLabel + '\u00a0: ' + last.hour + 'e\u00a0Heure \u2014 ' + escHtml(lastH.short_title||lastH.title) + '</div><div class="dc-label">Aujourd\u2019hui</div><div class="dc-title">' + nextNum + 'e\u00a0Heure \u2014 ' + escHtml(nextH.title) + '</div><div class="dc-time">' + nextH.display_time + '</div></div><svg class="dc-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg></div>';
}

// ── Reader ──
function openHour(n, push = true) {
  const h = CORPUS.hours.find(x => x.hour_number === n);
  if (!h) return;
  if (push) pushHistory(state.view, state.currentHour);
  state.view = 'reader'; state.currentHour = n;
  state.activeTab = state.hourTabs[n] || 'meditation';
  SafeStorage.set('lp24_lastHour', n);
  renderReader(h); buildSidebar();
  document.getElementById('progressWrap').style.display = 'block';
  setBottomNav('none');
  const _savedPara=state.lastParas[n];
  if(_savedPara){ setTimeout(()=>{ const el=document.getElementById(_savedPara); if(el) smoothScrollTo(el, {behavior:'smooth',block:'start'}); },80); }
}
function renderReader(hour, scroll = true) {
  if (typeof hour === 'number') hour = CORPUS.hours.find(h => h.hour_number === hour);
  const hasRefl = hour.reflections && hour.reflections.length > 0;
  const hasSub = hour.subsections && hour.subsections.length > 0;
  const isRead = state.readHours.has(hour.hour_number);
  const prev = CORPUS.hours.find(h => h.hour_number === hour.hour_number - 1);
  const next = CORPUS.hours.find(h => h.hour_number === hour.hour_number + 1);

  const openingBtns = buildOpeningButtons(hour);
  const closingBtns = buildClosingButtons(hour);

  const tabsHtml = hasRefl ? `
    <div class="tabs">
      <button class="tab-btn ${state.activeTab==='meditation'?'active':''}" onclick="switchTab('meditation')">

// Parse display_text into typed blocks for structured rendering
// ── Benefits section paragraph renderer (speech-aware) ──────────
function renderBenefitsParagraphs(section) {
  const paras = section.paragraphs || [];
  // LDC reference paragraphs — text starts with "LDC \d"
  const ldcRe = /^LDC\s+\d+/;
  const ldcParas = paras.filter(p => ldcRe.test(p.t));
  let tocHtml = '';
  if (ldcParas.length > 2) {
    tocHtml = `<div class="section-toc">
      <div class="section-toc-title">Références — ${ldcParas.length} passages du Livre du Ciel</div>
      ${ldcParas.map(p => {
        const label = p.t.replace(/^(LDC\s+\d+\s+-\s+[^-]+-\s+)/, '').slice(0,70);
        return `<a class="section-toc-item" onclick="(function(){var el=document.getElementById('${p.id}');if(el)smoothScrollTo(el,{behavior:'smooth',block:'start'});})();return false">${escHtml(label)}…</a>`;
      }).join('')}
    </div>`;
  }
  const paraHtml = paras.map(p => {
    const isLdc = ldcRe.test(p.t);
    const rendered = renderParaText(p.t, p.id);
    if (isLdc) {
      // LDC reference header — styled as reference block, still speech-annotated
      return `<div class="block-ldc-ref" id="${p.id}">
        <div class="block-ldc-label">Livre du Ciel</div>
        <div class="block-paragraph" style="margin:0">${rendered}</div>
        </div>`;
    }
    return `<div class="para-block sec-para-block" id="${p.id}">
      <div class="para-text">${rendered}</div>
    </div>`;
  }).join('');
  return tocHtml + paraHtml;
}


function parseSectionBlocks(sectionId, displayText) {
  const blocks = [];
  const lines = displayText.split('\n');
  let i = 0;
  while (i < lines.length) {
    const stripped = lines[i].trim();

    if (sectionId === 'PASSION24.SECTION.PRACTICE_METHODS') {
      if (/^Méthodes pour la pratique des Heures de la Passion$/i.test(stripped)) {
        blocks.push({ type: 'section_title', text: stripped }); i++; continue;
      }
      if (/^Voici trois suggestions\s*:$/i.test(stripped)) {
        blocks.push({ type: 'method_intro', text: stripped }); i++; continue;
      }
      if (/^Les 24 Heures de la Passion de Notre-Seigneur Jésus-Christ/i.test(stripped)) {
        let sl = [stripped]; i++;
        while (i < lines.length && lines[i].trim() && !/^Prière avant chaque Heure/i.test(lines[i].trim())) {
          sl.push(lines[i].trim()); i++;
        }
        blocks.push({ type: 'hours_schedule', text: sl.join(' ') }); continue;
      }
    }
    // LDC reference heading
    if (/^LDC \d+/.test(stripped)) {
      blocks.push({ type: 'ldc_ref', text: stripped, anchor: 'ldc-' + blocks.filter(b=>b.type==='ldc_ref').length });
      i++; continue;
    }
    // Method headings — join description if heading ends with ":"
    if (/^(?:Première|Deuxième|Troisième|Quatrième)\s+manière/.test(stripped)) {
      let headingText = stripped;
      if (headingText.trimEnd().endsWith(':')) {
        let j = i + 1;
        while (j < lines.length && !lines[j].trim()) j++;
        if (j < lines.length) {
          const nextLine = lines[j].trim();
          const isStructural = /^LDC \d+/.test(nextLine) ||
            /^(?:Première|Deuxième|Troisième|Quatrième)\s+manière/.test(nextLine);
          if (!isStructural && nextLine) {
            headingText = headingText + ' ' + nextLine;
            i = j + 1;
            blocks.push({ type: 'method_heading', text: headingText });
            continue;
          }
        }
      }
      blocks.push({ type: 'method_heading', text: stripped });
      i++; continue;
    }
    // Skip empty
    if (!stripped) { i++; continue; }
    // Accumulate paragraph lines
    const paraLines = [stripped]; i++;
    while (i < lines.length) {
      const next = lines[i].trim();
      if (!next) break;
      if (/^LDC \d+/.test(next) ||
          /^(?:Première|Deuxième|Troisième|Quatrième)\s+manière/.test(next) ||
          /^Méthodes pour la pratique des Heures de la Passion$/i.test(next) ||
          /^Voici trois suggestions\s*:$/i.test(next) ||
          /^Les 24 Heures de la Passion de Notre-Seigneur Jésus-Christ/i.test(next)) break;
      paraLines.push(next); i++;
    }
    blocks.push({ type: 'paragraph', text: paraLines.join('\n') });
  }
  return blocks;
}

function renderMethodHeading(text) {
  const match = text.match(/^((?:Première|Deuxième|Troisième|Quatrième)\s+manière)\s*:?\s*(.*)$/);
  if (!match) return `<div class="block-method-heading">${escHtml(text)}</div>`;
  return `<div class="block-method-heading"><span class="method-badge">${escHtml(match[1])}</span><span class="method-heading-text">${escHtml(match[2])}</span></div>`;
}

function renderHoursSchedule(text) {
  const title = 'Les 24 Heures de la Passion de Notre-Seigneur Jésus-Christ';
  const body = text.replace(title, '').trim();
  const items = body.split(/(?=De\s+(?:\d+h|midi|24h|17h))/g).map(x => x.trim()).filter(Boolean);
  return `<div class="section-schedule"><div class="section-schedule-title">${escHtml(title)}</div>${
    items.map(item => `<p class="block-paragraph" style="margin-bottom:0.55em">${escHtml(item)}</p>`).join('')
  }</div>`;
}

function renderSectionBlocks(blocks, sectionId) {
  // Build mini-TOC for BENEFITS (has LDC refs)
  const ldcRefs = blocks.filter(b => b.type === 'ldc_ref');
  let tocHtml = '';
  if (ldcRefs.length > 3) {
    tocHtml = `<div class="section-toc">
      <div class="section-toc-title">Références — ${ldcRefs.length} passages du Livre du Ciel</div>
      ${ldcRefs.map((b,i) => `<a class="section-toc-item" onclick="(function(){var _ta=document.getElementById('${b.anchor}');if(_ta)smoothScrollTo(_ta,{behavior:'smooth',block:'start'});})();return false">${escHtml(b.text.slice(0,70))}${b.text.length>70?'…':''}</a>`).join('')}
    </div>`;
  }
  const bodyHtml = blocks.map(b => {
    if (b.type === 'ldc_ref')       return `<div class="block-ldc-ref" id="${b.anchor}">${escHtml(b.text)}</div>`;
    if (b.type === 'method_heading') return renderMethodHeading(b.text);
    if (b.type === 'method_intro')   return `<div class="block-method-intro">${escHtml(b.text)}</div>`;
    if (b.type === 'hours_schedule') return renderHoursSchedule(b.text);
    if (b.type === 'section_title')  return `<div class="block-section-title">${escHtml(b.text)}</div>`;
    return `<p class="block-paragraph">${escHtml(b.text)}</p>`;
  }).join('');
  return tocHtml + '<div class="section-blocks">' + bodyHtml + '</div>';
}

function openSection(id, push = true, scrollToAnchor = null) {
  const s = CORPUS.sections.find(x => x.section_id === id); if (!s) return;
  if (push) pushHistory(state.view, state.currentSection);

  requestAnimationFrame(() => { (function(){var _si=document.getElementById('homeSearchInput');if(_si)_si.focus();})(); });

  document.getElementById('progressWrap').style.display = 'none';

function onSearchInput(v) { state.searchQuery = v; performSearch(v); }
function performSearch(query) {
  const resultsEl = document.getElementById('homeSearchResults');
  const homeMain = document.getElementById('homeMain');
  if (!query || query.trim().length < 2) {
    if (resultsEl) { resultsEl.classList.remove('visible'); resultsEl.innerHTML = ''; }
    if (homeMain) homeMain.style.display = ''; return;
  }
  if (homeMain) homeMain.style.display = 'none';
  const q = norm(query.trim());
  const results = [];
  // Search hours: meditations + reflections
  for (const hour of CORPUS.hours) {
    for (const p of hour.paragraphs) { if (norm(p.t).includes(q)) { results.push({label:`${hour.hour_number}e Heure — ${hour.title}`, para:p, type:'meditation', target:{kind:'hour',n:hour.hour_number}}); if(results.length>=80) break; } }
    for (const p of (hour.reflections||[])) { if (norm(p.t).includes(q)) { results.push({label:`${hour.hour_number}e Heure — ${hour.title}`, para:p, type:'reflection', target:{kind:'hour',n:hour.hour_number}}); if(results.length>=80) break; } }
    if (results.length>=80) break;
  }
  // Search prayers
  if (results.length < 80) {
    for (const pr of CORPUS.prayers) {
      for (const p of (pr.paragraphs||[])) {
        if (norm(p.t).includes(q)) { results.push({label:pr.title, para:p, type:'prayer', target:{kind:'prayer',id:pr.prayer_id}}); if(results.length>=80) break; }
      }
      if (results.length>=80) break;
    }
  }
  // Search sections (display_text as plain text)
  if (results.length < 80) {
    for (const s of CORPUS.sections) {
      const dt = s.display_text || '';
      const normDt = norm(dt);
      const sBlocks = parseSectionBlocks(s.section_id, dt);
      let sMatched = false;
      for (const blk of sBlocks) {
        const nb = norm(blk.text);
        if (nb.includes(q) && results.length < 80) {
          const bi = nb.indexOf(q);
          const snip = blk.text.slice(Math.max(0,bi-55), Math.min(blk.text.length,bi+q.length+90)).replace(/\n/g,' ');
          results.push({label:s.title, para:{id:blk.anchor||(s.section_id+'_blk'), t:snip},
            type:'section', target:{kind:'section', id:s.section_id, anchor:blk.anchor||null}});
          sMatched = true;
        }
      }
      if (!sMatched) {
        let idx = normDt.indexOf(q);
        while (idx !== -1 && results.length < 80) {
          const snip = dt.slice(Math.max(0,idx-55),Math.min(dt.length,idx+q.length+90));
          results.push({label:s.title, para:{id:s.section_id+'_'+idx, t:snip},
            type:'section', target:{kind:'section', id:s.section_id, anchor:null}});
          idx = normDt.indexOf(q, idx + q.length + 1);
          if (results.length >= 80) break;
        }
      }
    }
  }
  if (!resultsEl) return;
  // Apply search filter + restore filter button state
  const filtered = (state.searchFilter && state.searchFilter !== 'all')
    ? results.filter(r => r.type === state.searchFilter) : results;
  document.querySelectorAll('.sf-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.filter === (state.searchFilter||'all')));
  if (!filtered.length) { resultsEl.innerHTML=`<div class="no-results">Aucun résultat pour « ${escHtml(query)} »</div>`; resultsEl.classList.add('visible'); return; }
  const reRx = new RegExp(escRe(query.trim()), 'gi');
  const badgeMap = {
    meditation: '<span class="sr-badge meditation">Méditation</span>',
    reflection: '<span class="sr-badge reflection">Réflexion</span>',
    prayer:     '<span class="sr-badge prayer">Prière</span>',
    section:    '<span class="sr-badge section">Complément</span>'
  };
  resultsEl.innerHTML = `
    <div class="search-count">${filtered.length}${results.length>=80?'+':''} résultat${results.length>1?'s':''} pour « ${escHtml(query)} »</div>
    ${filtered.map(r => {
      const raw = r.para.t;
      const normRaw = norm(raw);
      const idx = normRaw.indexOf(q);
      const start = Math.max(0, idx-55), end = Math.min(raw.length, idx+q.length+90);
      let snip = raw.slice(start, end).replace(/\n/g,' ');
      if (start>0) snip='…'+snip; if (end<raw.length) snip+='…';
      const marked = escHtml(snip).replace(reRx, m=>`<mark>${m}</mark>`);
      const badge = badgeMap[r.type] || '';
      const onclick = r.target.kind==='hour'
        ? `openHourAtPara(${r.target.n},'${r.para.id}','${r.type}')`
        : r.target.kind==='prayer'
          ? `openPrayer('${r.target.id}')`
          : `openSection('${r.target.id}', true, ${r.target.anchor ? `'${r.target.anchor}'` : 'null'})`;
      return `<button type="button" class="search-result-item" onclick="${onclick}">
        <div class="sr-ref">${escHtml(r.label)}${badge}</div>
        <div class="sr-text">${marked}</div></button>`;
    }).join('')}`;
  resultsEl.classList.add('visible');
}
function openHourAtPara(hourNum, paraId, type) {
  state.searchQuery = '';
  openHour(hourNum);
  setTimeout(() => {
    if (type === 'reflection') {
      switchTab('reflections', true);
      requestAnimationFrame(() => {
        (function(){var _p=document.getElementById(paraId);if(_p)smoothScrollTo(_p,{behavior:'smooth',block:'center'});})();

// ── Integrity check ──
function runIntegrityCheck() {
  const btn = document.querySelector('.integrity-btn'); btn.textContent = '… Vérification en cours';
  setTimeout(() => {
    const totalMed = CORPUS.hours.reduce((a,h)=>a+h.paragraphs.length,0);
    const totalRef = CORPUS.hours.reduce((a,h)=>a+(h.reflections||[]).length,0);
    document.getElementById('integrityResult').style.display = 'block';
    const fp = CORPUS.fingerprint_sha256 || '';
    document.getElementById('integrityResult').innerHTML = `✓ ${CORPUS.module_id} — structure chargée<br>✓ 24 Heures · ${totalMed} paragraphes de méditation<br>✓ Réflexions présentes dans 24/24 heures · ${totalRef} paragraphes<br>✓ ${CORPUS.prayers.length} prières · ${CORPUS.sections.length} sections<br>✓ Empreinte déclarée : <code style="font-size:0.78rem">${fp.slice(0,32)}…</code><br><br><span style="color:var(--ink3);font-style:italic;font-size:0.88rem">Structure et dénombrements vérifiés. Vérification cryptographique non exécutée dans cette version.</span><br><span style="font-size:0.82rem;color:var(--ink3);font-style:italic">Annotation des paroles directes : expérimentale — 235 paragraphes annotés — 215 paroles de Jésus, 25 de Marie. Confiance validée (min. 0.93). Revue éditoriale en cours. Ne pas traiter comme couche théologique définitive.</span>`;
    btn.textContent = '✓ Structure vérifiée';
  }, 900);
}
