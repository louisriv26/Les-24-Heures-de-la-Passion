s. Je les baiserai, les soulagerai.\\n- Je me plongerai dans ton Sang pour pouvoir m'\u00e9crier avec Toi :\\n\u00ab \u00c2mes, \u00e2mes ! \u00bb\\nJ\u00e9sus, je veux soutenir ta T\u00eate transperc\u00e9e et endolorie\\n- pour r\u00e9parer et\\n- pour implorer ta Mis\u00e9ricorde, ton Amour et ton Pardon pour tous.\"},{\"id\":\"PASSION24.HOUR.21.P030\",\"n\":30,\"t\":\"R\u00e8gne dans mon intelligence, \u00f4 mon J\u00e9sus.\\nGu\u00e9ris-la en vertu des \u00e9pines qui Te percent la T\u00eate.\\nNe permets \u00e0 aucune d\u00e9faillance d'entrer dans mon intelligence.\\nFront majestueux de mon Bien, je Te donne un baiser\\nAttire toutes mes pens\u00e9es\\n- \u00e0 Te contempler et\\n- \u00e0 Te comprendre.\\nYeux infiniment doux de mon J\u00e9sus, bien que couverts de Sang,\\n- regardez-moi,\\n- regardez ma mis\u00e8re,\\n- regardez ma faiblesse,\\n- regardez mon pauvre c\u0153ur.\\nFaites en sorte que je puisse \u00e9prouver les effets admirables du Regard divin.\\nOreilles de mon J\u00e9sus,\\n- bien qu'accabl\u00e9es par les insultes et les blasph\u00e8mes,\\n- vous demeurez tout de m\u00eame attentives \u00e0 nous \u00e9couter.\\nEntendez mes pri\u00e8res.\\nNe d\u00e9daignez pas mes r\u00e9parations.\\nOui, \u00f4 J\u00e9sus, \u00e9coute les supplications de mon c\u0153ur.\\nIl se calmera quand Tu l'auras rempli de ton Amour.\\nVisage infiniment beau de mon J\u00e9sus, montre-toi \u00e0 moi, afin que\\n- de tous et de tout je d\u00e9tache mon pauvre c\u0153ur :\\n- ta beaut\u00e9 me fasse m'\u00e9prendre uniquement de Toi et\\nme tienne toujours ravie en Toi.\\nBouche infiniment suave de mon J\u00e9sus, parle-moi.\\nQue r\u00e9sonne toujours ta Voix en mes oreilles.\\nQue la puissance de ta Parole d\u00e9truise en moi\\n- tout ce qui n'est pas Volont\u00e9 de Dieu,\\n- tout ce qui n'est pas Amour.\\nJ\u00e9sus,\\nJe tends mes bras vers ton Cou pour T'embrasser.\"},{\"id\":\"PASSION24.HOUR.21.P031\",\"n\":31,\"t\":\"Toi-m\u00eame, tends les Tiens vers moi pour m'embrasser. De gr\u00e2ce, \u00f4 mon Bien, fais en sorte que cet embrassement d'Amour soit si \u00e9troit qu'aucune force humaine ne puisse nous d\u00e9gager l'un de l'autre. Ainsi, j'appuierai mon visage sur ton C\u0153ur.\"},{\"id\":\"PASSION24.HOUR.21.P032\",\"n\":32,\"t\":\"Avec confiance, je Te donnerai un baiser sur tes L\u00e8vres\\nEt Toi Tu me donneras ton Baiser d'Amour.\\nAinsi Tu me feras respirer\\n- ton Haleine infiniment douce,\\n- ton Amour,\\n- ton Vouloir,\\n- tes Souffrances et\\n- toute ta Vie divine.\\n\u00c9paules infiniment saintes de mon J\u00e9sus,\\ntoujours fortes et constantes dans la Souffrance par Amour pour moi,\\ndonnez-moi\\n- la force int\u00e9rieure,\\n- la constance et l'h\u00e9ro\u00efsme dans la souffrance par amour pour vous.\"},{\"id\":\"PASSION24.HOUR.21.P033\",\"n\":33,\"t\":\"J\u00e9sus, de gr\u00e2ce,\\n- ne permets pas que je sois inconstante dans l'amour\\n- partage avec moi ton Immutabilit\u00e9.\\nPoitrine enflamm\u00e9e de mon J\u00e9sus, donne-moi tes Flames.\\nTu ne peux contenir ces Flammes\\nMon c\u0153ur les cherche avec anxi\u00e9t\u00e9 par l'entremise\\n- de ton Sang et de tes Plaies.\"},{\"id\":\"PASSION24.HOUR.21.P034\",\"n\":34,\"t\":\"J\u00e9sus,\\nce sont les Flammes de ton Amour, qui Te tourmentent le plus.\\n\u00d4 mon Bien, partage-les avec moi.\\nCela ne Te touche-t-il pas de compassion de voir une \u00e2me aussi pauvre de ton\\nAmour ?\\nMains infiniment saintes de mon J\u00e9sus,\\n- vous qui avez cr\u00e9\u00e9 le Ciel et la terre,\\n- vous voil\u00e0 r\u00e9duites \u00e0 l'immobilit\u00e9 !\"},{\"id\":\"PASSION24.HOUR.21.P035\",\"n\":35,\"t\":\"\u00d4 mon J\u00e9sus,\\n- continue ta cr\u00e9ation : ta cr\u00e9ation d'Amour.\\n- Cr\u00e9e en tout mon \u00eatre une vie nouvelle, la Vie divine.\\n- Prononce tes Paroles cr\u00e9atrices sur mon pauvre c\u0153ur et rends-le totalement\\ncomme le Tien.\"},{\"id\":\"PASSION24.HOUR.21.P036\",\"n\":36,\"t\":\"Pieds saints de mon J\u00e9sus,\\nne me laissez jamais seule, mais faites en sorte\\n- que je coure toujours avec vous et\\n- que je ne fasse pas un seul pas loin de vous.\"},{\"id\":\"PASSION24.HOUR.21.P037\",\"n\":37,\"t\":\"J\u00e9sus,\\npar mon amour pour Toi et par mes r\u00e9parations,\\nje veux Te soulager des Peines dont Tu souffres dans tes Pieds infiniment\\nsaints.\\n\u00d4 mon J\u00e9sus crucifi\u00e9, j'adore ton Sang infiniment pr\u00e9cieux.\\nJe baise tes saintes Plaies une \u00e0 une, voulant leur prodiguer\\n- tout mon amour, toutes mes adorations\\n- et toutes mes r\u00e9parations les plus ardentes.\"},{\"id\":\"PASSION24.HOUR.21.P038\",\"n\":38,\"t\":\"Que ton Sang soit pour toutes les \u00e2mes dans les t\u00e9n\u00e8bres,\\n- r\u00e9confort dans la souffrance, force dans la faiblesse,\\n- pardon dans la faute, aide dans les tentations,\\n- protection dans les dangers, soutien dans la mort.\\nEt qu'il soit les ailes qui transporteront les \u00e2mes de cette terre vers le Ciel.\\nJ\u00e9sus,\\nje viens \u00e0 Toi !\\nDans ton C\u0153ur je veux faire mon nid et ma demeure.\\nDe l'int\u00e9rieur de ton C\u0153ur, \u00f4 mon doux Amour,\\nj'appellerai tous les gens \u00e0 Toi.\\nEt si quelqu'un veut s'approcher pour T'offenser,\\n- j'exposerai ma poitrine et\\n- je ne permettrai pas qu'on Te blesse.\\nAu contraire,\\n- j'enfermerai cette personne dans ton C\u0153ur,\\n- je lui parlerai de ton Amour et\\n- je changerai ses offenses en Amour.\"},{\"id\":\"PASSION24.HOUR.21.P039\",\"n\":39,\"t\":\"\u00d4 J\u00e9sus, ne permets jamais que je sorte de ton C\u0153ur. Alimente-moi de tes Flammes. Par ta Vie, donne-moi la Vie, pour que je T'aime comme Tu le d\u00e9sires si ardemment.\"},{\"id\":\"PASSION24.HOUR.21.P040\",\"n\":40,\"t\":\"Quatri\u00e8me Parole : \u00ab Mon Dieu, mon Dieu, pourquoi M'as-Tu abandonn\u00e9 ? \u00bb\"},{\"id\":\"PASSION24.HOUR.21.P041\",\"n\":41,\"t\":\"\u00d4 J\u00e9sus souffrant, serr\u00e9e sur ton C\u0153ur, je m'abandonne en comptant tes Souffrances. Je vois qu'un tremblement convulsif envahit ton Humanit\u00e9 infiniment sainte. Tes Membres se d\u00e9battent comme s'ils voulaient se d\u00e9tacher l'un de l'autre. Et durant ces convulsions, Tu cries avec force : \u00ab Mon Dieu, mon Dieu, pourquoi M'as-Tu abandonn\u00e9 ? \u00bb\"},{\"id\":\"PASSION24.HOUR.21.P042\",\"n\":42,\"t\":\"\u00c0 ce cri,\\n- tous tremblent\\n- les t\u00e9n\u00e8bres deviennent plus \u00e9paisses,\\n- ta Maman p\u00e9trifi\u00e9e p\u00e2lit et se sent tr\u00e8s mal !\\nMon J\u00e9sus ! ma Vie ! mon Tout ! que vois-je ?\\nAh ! Tu es tout proche de la mort !\"},{\"id\":\"PASSION24.HOUR.21.P043\",\"n\":43,\"t\":\"Tes Souffrances, qui T'ont toujours \u00e9t\u00e9 fid\u00e8les, sont sur le point de Te laisser. Apr\u00e8s tant de souffrances, avec une Douleur immense, Tu vois que beaucoup d'\u00e2mes ne sont pas incorpor\u00e9es \u00e0 Toi.\"},{\"id\":\"PASSION24.HOUR.21.P044\",\"n\":44,\"t\":\"Au contraire ! Tu vois que beaucoup seront perdues. Tu ressens la douloureuse s\u00e9paration d'avec elles.\"},{\"id\":\"PASSION24.HOUR.21.P045\",\"n\":45,\"t\":\"Et comme Tu dois satisfaire la Justice divine m\u00eame pour ces \u00e2mes,\\nTu ressens\\n- la mort de chacune et\\n- les peines m\u00eames qu'elles souffriront en enfer.\"},{\"id\":\"PASSION24.HOUR.21.P046\",\"n\":46,\"t\":\"Et Tu cries fort \u00e0 toutes :\"},{\"id\":\"PASSION24.HOUR.21.P047\",\"n\":47,\"t\":\"\u00ab Ne M'abandonnez pas. Si vous voulez plus de Souffrances, Je suis pr\u00eat. Mais ne vous s\u00e9parez pas de mon Humanit\u00e9.\"},{\"id\":\"PASSION24.HOUR.21.P048\",\"n\":48,\"t\":\"C'est cela la Douleur des douleurs, la Mort des morts. Tout le reste Me serait n\u00e9ant si M'\u00e9tait \u00e9pargn\u00e9e votre s\u00e9paration d'avec Moi !\"},{\"id\":\"PASSION24.HOUR.21.P049\",\"n\":49,\"t\":\"De gr\u00e2ce, piti\u00e9 pour mon Sang, pour mes Plaies, pour ma Mort ! Ne M'abandonnez pas ! \u00bb Mon Amour, combien je suis d\u00e9sol\u00e9e ! Tu T'essouffles !\"},{\"id\":\"PASSION24.HOUR.21.P050\",\"n\":50,\"t\":\"Ta T\u00eate infiniment sainte tombe d\u00e9j\u00e0 sur ta Poitrine ! La vie T'abandonne ! Mon Amour, je me sens mourir avec Toi !\"},{\"id\":\"PASSION24.HOUR.21.P051\",\"n\":51,\"t\":\"Moi aussi je veux crier avec Toi : \u00ab \u00c2mes, \u00e2mes ! \u00bb\\nJe ne veux pas me d\u00e9tacher\\n- de cette Croix,\\n- de tes Plaies,\\npour Te procurer des \u00e2mes.\"},{\"id\":\"PASSION24.HOUR.21.P052\",\"n\":52,\"t\":\"Et si Tu le veux,\\n- je descendrai dans le c\u0153ur des cr\u00e9atures,\\n- je les entourerai de tes Peines\\nafin qu'elles ne m'\u00e9chappent pas.\"},{\"id\":\"PASSION24.HOUR.21.P053\",\"n\":53,\"t\":\"Et si cela m'\u00e9tait possible, je voudrais me mettre devant la porte de l'enfer pour\\n- faire reculer les \u00e2mes qui s'y pr\u00e9sentent et\\n- les amener \u00e0 ton C\u0153ur.\\nMon J\u00e9sus, Tu agonises et Tu Te tais.\"},{\"id\":\"PASSION24.HOUR.21.P054\",\"n\":54,\"t\":\"Et moi\\n- je pleure ta mort prochaine.\\n- je compatis avec Toi,\\n- je serre ton C\u0153ur sur le mien,\\n- je lui donne un baiser et\\n- je le regarde avec toute la tendresse dont je suis capable.\\n- je fais mienne la Tendresse divine pour Te donner un plus grand soulagement\\net avec elle que je veux compatir avec Toi.\"},{\"id\":\"PASSION24.HOUR.21.P055\",\"n\":55,\"t\":\"Je veux\\n- changer mon c\u0153ur en un fleuve de douceur et\\n- le verser dans le Tien\\npour adoucir l'amertume que Tu \u00e9prouves \u00e0 cause de la perte des \u00e2mes.\\nJ\u00e9sus, ton cri, est extr\u00eamement douloureux.\\nLes \u00e2mes qui s'\u00e9loignent de Toi, plus que l'abandon du P\u00e8re, font s'\u00e9chapper\\nde ton C\u0153ur cette lamentation douloureuse :\"},{\"id\":\"PASSION24.HOUR.21.P056\",\"n\":56,\"t\":\"\u00ab Mon Dieu, pourquoi M\u2019as-Tu abandonn\u00e9 ? \u00bb\"},{\"id\":\"PASSION24.HOUR.21.P057\",\"n\":57,\"t\":\"J\u00e9sus, augmente en tous la Gr\u00e2ce, afin que personne ne se perde.\\nQue ma r\u00e9paration soit au profit des \u00e2mes\\n- qui devraient se perdre,\\n- pour qu'elles soient sauv\u00e9es.\"},{\"id\":\"PASSION24.HOUR.21.P058\",\"n\":58,\"t\":\"J\u00e9sus, par cet abandon extr\u00eame que Tu ressens sur la Croix,\\nje Te prie de donner ton aide\\n- aux nombreuses \u00e2mes aimantes\\n- \u00e0 qui Tu demandes d'avoir pour compagnon ton Abandon.\"},{\"id\":\"PASSION24.HOUR.21.P059\",\"n\":59,\"t\":\"Ceci Tu fais en leur donnant la sensation\\n- d'\u00eatre priv\u00e9es de ta pr\u00e9sence,\\n- d'\u00eatre plong\u00e9es dans les t\u00e9n\u00e8bres.\\nPourtant Toi, Tu les portes si serr\u00e9es sur ton C\u0153ur.\"},{\"id\":\"PASSION24.HOUR.21.P060\",\"n\":60,\"t\":\"J\u00e9sus, les souffrances de ces \u00e2mes\\n- am\u00e8nent beaucoup d'\u00e2mes pr\u00e8s de Toi et\\n- te soulagent dans ta Douleur.\"}],\"reflections\":[{\"id\":\"PASSION24.HOUR.21.REF.P001\",\"t\":\"J\u00e9sus pardonne avec tant d'Amour au bon larron :\\nIl l'emm\u00e8ne imm\u00e9diatement avec Lui au Paradis.\\nEt nous, prions-nous pour l'\u00e2me des nombreux mourants qui ont besoin d'une\\npri\u00e8re, afin que pour eux\\n- se ferme l'enfer et\\n- s'ouvrent les portes du Ciel ?\\nLes Peines de J\u00e9sus sur la Croix augmentent.\\nOublieux de Lui-m\u00eame, Il prie sans cesse pour nous.\\nIl nous donne tout, y compris sa Tr\u00e8s Sainte M\u00e8re.\\nIl fait d'elle le don le plus pr\u00e9cieux dont disposait son C\u0153ur.\\nEt nous, savons-nous tout donner \u00e0 J\u00e9sus ?\\nEn tout ce que nous faisons pri\u00e8res, actions, etc.\\n- avons-nous toujours l'intention d'absorber de l'Amour frais en nous,\\n- pour pouvoir ensuite tout redonner \u00e0 J\u00e9sus ?\"},{\"id\":\"PASSION24.HOUR.21.REF.P002\",\"t\":\"Nous devons absorber l'Amour pour le redonner,\\nafin que tout ce que nous faisons porte l'empreinte de J\u00e9sus.\\nQuand le Seigneur nous donne\\n- de la Ferveur, de la Lumi\u00e8re ou de l'Amour,\\nsavons-nous nous en servir\\n- pour le bien des autres,\\n- pour favoriser leur conversion ?\\nOu bien gardons-nous \u00e9go\u00efstement pour nous seuls ces Gr\u00e2ces ?\"},{\"id\":\"PASSION24.HOUR.21.REF.P003\",\"t\":\"Mon J\u00e9sus, que chaque petite \u00e9tincelle d'Amour que je ressens dans mon c\u0153ur devienne un incendie qui consume le c\u0153ur de chaque cr\u00e9ature et la conduise \u00e0 ton C\u0153ur. Quel usage faisons-nous du grand don qu'il nous a fait de sa Maman ? Faisons-nous n\u00f4tre l'Amour de J\u00e9sus, ses Tendresses et tout ce qu'Il faisait, afin de contenter sa Maman ?\"},{\"id\":\"PASSION24.HOUR.21.REF.P004\",\"t\":\"Pouvons-nous dire que notre divine M\u00e8re trouve en nous le contentement, qu'elle trouvait en son divin Fils ? Sommes-nous toujours unis \u00e0 elle, comme des enfants fid\u00e8les, lui ob\u00e9issant et imitant ses vertus ? Pour pouvoir donner \u00e0 Marie le contentement que Lui donnait son Fils, faisons n\u00f4tre l'Amour que J\u00e9sus \u00e9prouvait envers sa M\u00e8re, la gloire, la tendresse et toutes les finesses d'Amour qu'Il lui donnait continuellement.\"},{\"id\":\"PASSION24.HOUR.21.REF.P005\",\"t\":\"\u00ab J'ai en moi J\u00e9sus pour Te rendre contente. Et je Te donnerai tout pour que tu puisses trouver en moi ce que tu trouvais en J\u00e9sus,\"},{\"id\":\"PASSION24.HOUR.21.REF.P006\",\"t\":\"De plus, belle Maman, je veux donner \u00e0 J\u00e9sus tous les contentements qu'Il trouvait en toi. Pour ce faire, je veux entrer dans ton C\u0153ur et prendre ton amour, toutes tes tendresses et tous tes soins maternels pour les donner \u00e0 J\u00e9sus.\"},{\"id\":\"PASSION24.HOUR.21.REF.P007\",\"t\":\"Douce Maman, que tes Mains maternelles soient les douces cha\u00eenes qui me tiennent li\u00e9 \u00e0 Toi et \u00e0 J\u00e9sus. \u00bb J\u00e9sus ne s'\u00e9pargne en rien. Il nous aime d'un Amour supr\u00eame. Il veut nous sauver tous. Si c'\u00e9tait possible, Il voudrait arracher \u00e0 l'enfer toutes les \u00e2mes, m\u00eame en subissant toutes leurs peines. Cependant, Il voit que bien des \u00e2mes cherchent \u00e0 se d\u00e9tacher de ses Bras.\"},{\"id\":\"PASSION24.HOUR.21.REF.P008\",\"t\":\"Alors, ne pouvant contenir sa Douleur, Il s'exclame : \u00ab Mon Dieu, mon Dieu, pourquoi M'as-Tu abandonn\u00e9 ? \u00bb\"},{\"id\":\"PASSION24.HOUR.21.REF.P009\",\"t\":\"Et nous, pouvons-nous dire que notre amour envers les \u00e2mes est semblable \u00e0 celui de J\u00e9sus ? Pouvons-nous dire que nos pri\u00e8res, nos peines et toutes nos actions, m\u00eame les plus petites, sont unies aux Actions et aux Pri\u00e8res de J\u00e9sus pour arracher les \u00e2mes \u00e0 l'enfer ?\"},{\"id\":\"PASSION24.HOUR.21.REF.P010\",\"t\":\"Comment compatissons-nous avec J\u00e9sus dans son immense Douleur ?\\nSi notre vie pouvait se consumer en un holocauste continuel,\\ncela ne serait pas suffisant pour compatir ad\u00e9quatement \u00e0 cette Douleur.\\nChaque petit acte que nous faisons en union avec J\u00e9sus,\\nchaque petite peine que nous vivons en union avec Lui\\n- peut servir \u00e0 arracher des \u00e2mes des griffes de Satan\\npour qu'elles ne tombent pas en enfer.\"},{\"id\":\"PASSION24.HOUR.21.REF.P011\",\"t\":\"Si nous sommes unis \u00e0 J\u00e9sus, nous avons en mains son propre Pouvoir.\"},{\"id\":\"PASSION24.HOUR.21.REF.P012\",\"t\":\"Si, au contraire, nous ne faisons pas nos actions en union avec Lui,\\nelles ne serviront pas \u00e0 emp\u00eacher ne f\u00fbt-ce qu'une \u00e2me\\nd'aller en enfer.\\nMon Amour et mon Tout, tiens-moi serr\u00e9e sur ton C\u0153ur, afin que\\n- je ressente combien le p\u00e9cheur T'afflige en se d\u00e9tachant de Toi, et\\n- qu'ainsi je puisse faire ma part pour le ramener \u00e0 Toi.\"},{\"id\":\"PASSION24.HOUR.21.REF.P013\",\"t\":\"\u00d4 J\u00e9sus, que ton Amour br\u00fble mon c\u0153ur, afin que je puisse ressentir l'Amour que Tu as pour les \u00e2mes.\"},{\"id\":\"PASSION24.HOUR.21.REF.P014\",\"t\":\"Quand je souffre des amertumes, alors, \u00f4 J\u00e9sus, donne libre cours \u00e0 ta Justice sur moi et prends la satisfaction que Tu veux.\"},{\"id\":\"PASSION24.HOUR.21.REF.P015\",\"t\":\"Mais le p\u00e9cheur, \u00f4 J\u00e9sus, qu'il soit sauv\u00e9.\\n- que mes peines soient un lien qui l'attache \u00e0 Toi,\\n- que mon \u00e2me ait la consolation de voir ta Justice satisfaite.\"}],\"subsections\":[]},{\"hour_id\":\"PASSION24.HOUR.22\",\"hour_number\":22,\"display_time\":\"14h \u00e0 15h\",\"title\":\"Troisi\u00e8me Heure d\u2019Agonie sur la Croix \u2013 Mort de J\u00e9sus\",\"short_title\":\"Troisi\u00e8me Heure d\u2019Agonie sur la Croix \u2013 Mort de J\u00e9sus\",\"source_pages\":[217,218,219,220,221,222,223,224,225],\"opening_prayer_ids\":[\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"],\"closing_prayer_ids\":[\"PASSION24.PRAYER.AFTER_EACH_HOUR\"],\"paragraphs\":[{\"id\":\"PASSION24.HOUR.22.P001\",\"n\":1,\"t\":\"Cinqui\u00e8me Parole : \u00ab J'ai soif ! \u00bb\"},{\"id\":\"PASSION24.HOUR.22.P002\",\"n\":2,\"t\":\"\u00d4 mon Crucifi\u00e9 moribond, J'embrasse ta Croix et je ressens le Feu qui br\u00fble toute ta Personne infiniment sainte.\"},{\"id\":\"PASSION24.HOUR.22.P003\",\"n\":3,\"t\":\"Ton C\u0153ur bat si fort qu\u2019il\\n- Te soul\u00e8ve les C\u00f4tes,\\n- Te tourmente de mani\u00e8re d\u00e9chirante et horrible.\"},{\"id\":\"PASSION24.HOUR.22.P004\",\"n\":4,\"t\":\"Toute ton Humanit\u00e9 infiniment sainte\\n- subit une transformation telle\\n- qu'elle Te rend m\u00e9connaissable.\"},{\"id\":\"PASSION24.HOUR.22.P005\",\"n\":5,\"t\":\"Tu ne peux pas contenir l'Amour dont ton C\u0153ur est enflam\u00e9.\\nIl Te br\u00fble et Te dess\u00e8che tout entier.\\nTon Tourment est\\n- non seulement celui de la soif corporelle caus\u00e9e par l'effusion de ton Sang,\\n- mais bien davantage celui de ta Soif ardente du salut de nos \u00e2mes.\"},{\"id\":\"PASSION24.HOUR.22.P006\",\"n\":6,\"t\":\"Par l'eau que Tu aimerais boire, Tu voudrais nous mettre tous en s\u00fbret\u00e9 \u00e0 l'int\u00e9rieur de Toi. Rassemblant tes forces tr\u00e8s affaiblies, Tu cries : \u00ab J'ai soif ! \u00bb Ah ! cette Parole, Tu la dis de tout ton divin C\u0153ur :\"},{\"id\":\"PASSION24.HOUR.22.P007\",\"n\":7,\"t\":\"\u00ab J'ai Soif de ta volont\u00e9, de tes affections, de tes d\u00e9sirs, de ton amour. Il n'y a pas d'eau plus fra\u00eeche et plus douce que tu puisses Me donner que ton \u00e2me. De gr\u00e2ce, ne Me laisse pas br\u00fbler.\"},{\"id\":\"PASSION24.HOUR.22.P008\",\"n\":8,\"t\":\"J'ai une Soif ardente ! Non seulement\\n- Je sens br\u00fbler ma Langue et ma Gorge, mais\\n- Je sens aussi mon C\u0153ur et mes Visc\u00e8res se dess\u00e9cher.\\nPiti\u00e9 pour ma Soif, piti\u00e9 ! \u00bb\"},{\"id\":\"PASSION24.HOUR.22.P009\",\"n\":9,\"t\":\"Et dans le d\u00e9lire de cette Soif, Tu T'abandonnes \u00e0 la Volont\u00e9 du P\u00e8re. Mon c\u0153ur ne peut plus vivre en voyant la cruaut\u00e9 de tes ennemis Ceux-ci, au lieu d'eau, Te donnent du fiel et du vinaigre. Et Toi, Tu ne les refuses pas !\"},{\"id\":\"PASSION24.HOUR.22.P010\",\"n\":10,\"t\":\"Ah ! je comprends, Tu re\u00e7ois\\n- le fiel de nos nombreuses fautes et\\n- le vinaigre de nos passions non ma\u00eetris\u00e9es\\nCeux-ci au lieu de Te restaurer, Te br\u00fblent davantage.\"},{\"id\":\"PASSION24.HOUR.22.P011\",\"n\":11,\"t\":\"J\u00e9sus, voici mon c\u0153ur, mes pens\u00e9es, mes affections, tout mon \u00eatre,\\nafin que\\n- Tu Te d\u00e9salt\u00e8res et que\\n- Tu donnes un r\u00e9confort \u00e0 ta Bouche br\u00fbl\u00e9e et remplie d'amertume.\\nJ\u00e9sus, tout ce que j'ai, tout ce que je suis, tout est pour Toi.\"},{\"id\":\"PASSION24.HOUR.22.P012\",\"n\":12,\"t\":\"Si mes peines \u00e9taient n\u00e9cessaires pour pouvoir sauver ne serait-ce qu'une seule \u00e2me, me voici. Je suis pr\u00eate \u00e0 tout souffrir. Je m'offre \u00e0 Toi int\u00e9rieurement. Fais de moi ce qui Te plaira davantage. Je veux r\u00e9parer la Douleur dont Tu souffres \u00e0 cause des \u00e2mes qui se perdent.\"},{\"id\":\"PASSION24.HOUR.22.P013\",\"n\":13,\"t\":\"Je veux r\u00e9parer la Peine que Te donnent les \u00e2mes que Tu invites \u00e0 partager, ta Tristesse et ton Abandon. Au lieu de T'offrir ces souffrances comme soulagement pour ta Soif cuisante, ils Te tournent le dos et, ainsi, ils Te font souffrir davantage.\"},{\"id\":\"PASSION24.HOUR.22.P014\",\"n\":14,\"t\":\"Sixi\u00e8me Parole : \u00ab Tout est consomm\u00e9 ! \u00bb\\nMon Bien, Tu es sur le point de mourir.\\n- L'oc\u00e9an incommensurable de tes Peines,\\n- le Feu qui Te consume et, plus que tout,\\n- le Vouloir supr\u00eame du P\u00e8re qui veut que Tu meures,\\nne me font plus esp\u00e9rer que Tu puisses continuer \u00e0 vivre.\"},{\"id\":\"PASSION24.HOUR.22.P015\",\"n\":15,\"t\":\"Comment pourrai-je vivre sans Toi ?\\n- Les forces Te manquent,\\n- tes Yeux se voilent,\\n- ton Visage se transforme et se couvre d'une p\u00e2leur mortelle,\\n- ta Bouche est entrouverte,\\n- ton Souffle est haletant et intermittent :\"},{\"id\":\"PASSION24.HOUR.22.P016\",\"n\":16,\"t\":\"Il n'y a plus d'espoir que Tu puisses Te ranimer. Au Feu qui Te br\u00fble, s'ajoute une Sueur froide qui Te baigne le Front. Tes Muscles et tes Nerfs se contractent de plus en plus \u00e0 cause de l'\u00e2pret\u00e9 de tes Douleurs et des Blessures des clous. Tes Plaies se d\u00e9chirent encore.\"},{\"id\":\"PASSION24.HOUR.22.P017\",\"n\":17,\"t\":\"Et moi, je tremble et me sens mourir. Je Te regarde, \u00f4 mon Bien. Je vois descendre de tes Yeux tes derni\u00e8res Larmes, signes avant-coureurs de ta Mort. A grand-peine Tu fais entendre encore une Parole :\"},{\"id\":\"PASSION24.HOUR.22.P018\",\"n\":18,\"t\":\"\u00ab Tout est consomm\u00e9 ! \u00bb \u00d4 mon J\u00e9sus, Tu as d\u00e9j\u00e0 tout \u00e9puis\u00e9. Il ne Te reste rien d'autre. L'Amour est parvenu \u00e0 son terme. Et moi, me suis-je consum\u00e9e tout enti\u00e8re par amour ? Quels remerciements ne devrais-je pas Te faire. Quelle ne devrait pas \u00eatre ma gratitude envers Toi ?\"},{\"id\":\"PASSION24.HOUR.22.P019\",\"n\":19,\"t\":\"Mon J\u00e9sus, je veux\\n- r\u00e9parer pour tous, r\u00e9parer nos manques de retour d'Amour et\\n- Te consoler des affronts que Tu re\u00e7ois de la part des gens\\ntandis que Tu Te consumes d'Amour sur la Croix.\"},{\"id\":\"PASSION24.HOUR.22.P020\",\"n\":20,\"t\":\"Septi\u00e8me Parole : \u00ab Entre tes Mains, \u00f4 P\u00e8re, Je remets mon Esprit ! \u00bb\\nMon J\u00e9sus crucifi\u00e9,\\n- Tu en es \u00e0 tes derni\u00e8res Respirations,\\n- ton Humanit\u00e9 infiniment sainte se raidit,\\n- ton C\u0153ur ne semble plus battre.\"},{\"id\":\"PASSION24.HOUR.22.P021\",\"n\":21,\"t\":\"Avec Marie Madeleine, j'embrasse tes Pieds. Je voudrais, si c'\u00e9tait possible, donner ma vie pour ranimer la Tienne. J\u00e9sus, je vois que Tu ouvres tes Yeux moribonds et regardes autour de la Croix comme si Tu voulais faire ton dernier adieu \u00e0 tous.\"},{\"id\":\"PASSION24.HOUR.22.P022\",\"n\":22,\"t\":\"Ta Maman est mourante.\"},{\"id\":\"PASSION24.HOUR.22.P023\",\"n\":23,\"t\":\"Elle n'a plus de mouvement ni de voix, tant sont grandes ses peines. Tu la regardes et Tu dis : \u00ab Adieu, Maman, Moi Je pars. Mais Je te garderai dans mon C\u0153ur. Prends soin de nos enfants. \u00bb\"},{\"id\":\"PASSION24.HOUR.22.P024\",\"n\":24,\"t\":\"Tu regardes Marie Madeleine qui pleure, le fid\u00e8le Jean. Par tes Regards, Tu leur dis : \u00ab Adieu ! \u00bb\"},{\"id\":\"PASSION24.HOUR.22.P025\",\"n\":25,\"t\":\"Tu regardes tes ennemis avec Amour. Par tes Regards, Tu leur dis : \u00ab Je vous pardonne, Je vous donne le Baiser de Paix. \u00bb\"},{\"id\":\"PASSION24.HOUR.22.P026\",\"n\":26,\"t\":\"Rien n'\u00e9chappe \u00e0 ton Regard. Tu prends cong\u00e9 de tous. Tu pardonnes \u00e0 tous. Puis Tu rassembles toutes tes forces et d'une Voix forte Tu cries : \u00ab P\u00e8re, entre tes Mains, Je remets mon Esprit ! \u00bb\"},{\"id\":\"PASSION24.HOUR.22.P027\",\"n\":27,\"t\":\"Baissant la t\u00eate, Tu expires.\\nMon J\u00e9sus,\\n\u00e0 ce cri, la nature est toute boulevers\u00e9e et pleure ta mort,\\nla mort de son Cr\u00e9ateur !\\n- La terre tremble. Par son tremblement, elle semble pleurer et vouloir secouer\\nles \u00e2mes pour les amener \u00e0 Te reconna\u00eetre comme le vrai Dieu.\\n- Le voile du Temple se d\u00e9chire.\\n- Des morts ressuscitent.\\n- Le soleil qui jusqu'ici a pleur\u00e9 tes Peines, a retir\u00e9 avec effroi sa lumi\u00e8re.\"},{\"id\":\"PASSION24.HOUR.22.P028\",\"n\":28,\"t\":\"\u00c0 ce cri,\\n- tes ennemis s'agenouillent, se frappent la poitrine et disent :\"},{\"id\":\"PASSION24.HOUR.22.P029\",\"n\":29,\"t\":\"\u00ab Vraiment, celui-ci est le Fils de Dieu ! \u00bb\\n- Ta M\u00e8re, p\u00e9trifi\u00e9e et mourante, souffre des Peines plus dures que la mort.\\nMon J\u00e9sus mort, par ce cri Tu nous mets nous aussi entre les Mains du P\u00e8re,\\npour qu'Il ne nous rejette pas.\"},{\"id\":\"PASSION24.HOUR.22.P030\",\"n\":30,\"t\":\"Par cons\u00e9quent, Tu cries fort,\\n- non seulement de ta Voix corporelle,\\n- mais par toutes tes Peines et tout ton Sang :\\n\u00ab P\u00e8re, entre tes Mains, Je remets mon Esprit et toutes les \u00e2mes ! \u00bb\"},{\"id\":\"PASSION24.HOUR.22.P031\",\"n\":31,\"t\":\"\u00d4 mon J\u00e9sus, avec Toi, je m'abandonne aussi entre les Mains du P\u00e8re. Donne-moi la Gr\u00e2ce de mourir compl\u00e8tement dans ton Amour, dans ton Vouloir.\"},{\"id\":\"PASSION24.HOUR.22.P032\",\"n\":32,\"t\":\"Je Te prie de ne jamais me permettre, ni en cette vie ni \u00e0 ma mort, de quitter ta Volont\u00e9 infiniment sainte. Et je veux r\u00e9parer pour tous ceux qui ne s'abandonnent pas parfaitement \u00e0 ta Volont\u00e9 infiniment sainte, perdant ainsi ou affaiblissant en eux le pr\u00e9cieux fruit de ta R\u00e9demption.\"},{\"id\":\"PASSION24.HOUR.22.P033\",\"n\":33,\"t\":\"J\u00e9sus, quelle n'est pas la Douleur de ton C\u0153ur, de voir tant de cr\u00e9atures qui s'enfuient de tes Bras et ne comptent que sur elles-m\u00eames ?\"},{\"id\":\"PASSION24.HOUR.22.P034\",\"n\":34,\"t\":\"Piti\u00e9 pour tous, \u00f4 mon J\u00e9sus, piti\u00e9 pour moi.\"},{\"id\":\"PASSION24.HOUR.22.P035\",\"n\":35,\"t\":\"Je baise ta T\u00eate couronn\u00e9e d'\u00e9pines.\\nJe Te demande pardon pour mes nombreuses pens\u00e9es\\n- d'orgueil, d'ambition et d'amour propre.\"},{\"id\":\"PASSION24.HOUR.22.P036\",\"n\":36,\"t\":\"Je Te promets que chaque fois\\n- qu'il me viendra une pens\u00e9e qui ne soit pas toute pour Toi ou\\n- que je me trouverai dans une occasion de T'offenser,\\nje crierai imm\u00e9diatement :\\n\u00ab J\u00e9sus et Marie, je Vous recommande mon \u00e2me ! \u00bb\\nJ\u00e9sus, je donne un baiser \u00e0 tes beaux Yeux\\n- encore baign\u00e9s de Larmes et\\n- tout couverts de Sang coagul\u00e9.\"},{\"id\":\"PASSION24.HOUR.22.P037\",\"n\":37,\"t\":\"Je Te demande pardon pour toutes les fois o\u00f9 je T'ai offens\u00e9 par des regards mauvais ou immodestes.\"},{\"id\":\"PASSION24.HOUR.22.P038\",\"n\":38,\"t\":\"Je Te promets que chaque fois que mes yeux seront port\u00e9s \u00e0 s'arr\u00eater aux choses de la terre,\"},{\"id\":\"PASSION24.HOUR.22.P039\",\"n\":39,\"t\":\"je crierai imm\u00e9diatement :\\n\u00ab J\u00e9sus et Marie, je Vous recommande mon \u00e2me ! \u00bb\\nJ\u00e9sus, je donne un baiser \u00e0 tes Oreilles infiniment sacr\u00e9es,\\naccabl\u00e9es par tant d'insultes et d'horribles blasph\u00e8mes.\\nJe Te demande pardon pour toutes les fois que\\n- j'ai \u00e9cout\u00e9 ou j\u2019ai fait \u00e9couter des paroles qui \u00e9loignent de Toi.\\nJe Te demande pardon \u00e9galement\\npour toutes les conversations mauvaises faites par les cr\u00e9atures.\"},{\"id\":\"PASSION24.HOUR.22.P040\",\"n\":40,\"t\":\"Je Te promets que chaque fois que je me trouverai dans l'occasion\\nd'entendre des conversations inconvenantes,\\nje crierai imm\u00e9diatement :\\n\u00ab J\u00e9sus et Marie, je Vous recommande mon \u00e2me ! \u00bb\\nJ\u00e9sus, je donne un baiser \u00e0 ton Visage infiniment saint,\\n- livide et ensanglant\u00e9.\"},{\"id\":\"PASSION24.HOUR.22.P041\",\"n\":41,\"t\":\"Je Te demande pardon pour les nombreux m\u00e9pris, affronts et insultes que Tu re\u00e7ois de nous, viles cr\u00e9atures p\u00e9cheresses.\"},{\"id\":\"PASSION24.HOUR.22.P042\",\"n\":42,\"t\":\"Je Te promets que chaque fois que me viendra la tentation de ne pas Te donner toute la gloire, l'amour et l'adoration qui Te sont dus, je crierai imm\u00e9diatement : \u00ab J\u00e9sus et Marie, je Vous recommande mon \u00e2me ! \u00bb J\u00e9sus, je donne un baiser \u00e0 ta Bouche infiniment sacr\u00e9e, dess\u00e9ch\u00e9e et remplie d'amertume.\"},{\"id\":\"PASSION24.HOUR.22.P043\",\"n\":43,\"t\":\"Je Te demande pardon\\n- pour toutes les fois o\u00f9 je T'ai offens\u00e9 par mes conversations mauvaises,\\n- pour toutes les fois o\u00f9 j'ai contribu\u00e9\\n\u00e0 Te remplir d'amertume et \u00e0 augmenter ta Soif.\"},{\"id\":\"PASSION24.HOUR.22.P044\",\"n\":44,\"t\":\"Je promets que chaque fois que me viendra la pens\u00e9e d'entretenir des conversations qui pourraient T'offenser, je crierai imm\u00e9diatement : \u00ab J\u00e9sus et Marie, je Vous recommande mon \u00e2me ! \u00bb J\u00e9sus, je donne un baiser \u00e0 ton Cou infiniment saint, o\u00f9 je vois encore les marques des cha\u00eenes et des cordes qui T'ont tyrannis\u00e9.\"},{\"id\":\"PASSION24.HOUR.22.P045\",\"n\":45,\"t\":\"Je Te demande pardon pour nos nombreux attachements aux cr\u00e9atures, attachements qui ont augment\u00e9 les cha\u00eenes et les cordes autour de ton Cou infiniment sacr\u00e9.\"},{\"id\":\"PASSION24.HOUR.22.P046\",\"n\":46,\"t\":\"Je Te promets que chaque fois que je me sentirai troubl\u00e9e par\\n- des attachements, des d\u00e9sirs et des affections qui ne sont pas pour Toi,\\nje crierai imm\u00e9diatement :\\n\u00ab J\u00e9sus et Marie, je Vous recommande mon \u00e2me ! \u00bb\\nJ\u00e9sus, je donne un baiser \u00e0 tes \u00c9paules infiniment saintes.\"},{\"id\":\"PASSION24.HOUR.22.P047\",\"n\":47,\"t\":\"Je Te demande pardon pour\\n- les nombreuses satisfactions illicites,\\n- les nombreux p\u00e9ch\u00e9s commis avec les cinq sens de mon corps.\"},{\"id\":\"PASSION24.HOUR.22.P048\",\"n\":48,\"t\":\"Je Te promets que chaque fois que me viendra la pens\u00e9e de me procurer des plaisirs ou satisfactions qui ne soient pas pour ta Gloire, je crierai imm\u00e9diatement : \u00ab J\u00e9sus et Marie, je Vous recommande mon \u00e2me ! \u00bb J\u00e9sus, je donne un baiser \u00e0 ta Poitrine infiniment sainte.\"},{\"id\":\"PASSION24.HOUR.22.P049\",\"n\":49,\"t\":\"Je Te demande pardon pour les nombreuses\\n- froideurs, indiff\u00e9rences, ti\u00e9deurs et ingratitudes\\nque Tu re\u00e7ois des cr\u00e9atures.\"},{\"id\":\"PASSION24.HOUR.22.P050\",\"n\":50,\"t\":\"Je Te promets que chaque fois que je sentirai se refroidir mon amour pour Toi, je crierai imm\u00e9diatement : \u00ab J\u00e9sus et Marie, je Vous recommande mon \u00e2me ! \u00bb J\u00e9sus, je donne un baiser \u00e0 tes Mains infiniment sacr\u00e9es.\"},{\"id\":\"PASSION24.HOUR.22.P051\",\"n\":51,\"t\":\"Je Te demande pardon\\npour toutes nos \u0153uvres mauvaises ou indiff\u00e9rentes,\\npour nos nombreuses actions guid\u00e9es\\n- par l'amour propre, la vanit\u00e9 ou le respect humain.\"},{\"id\":\"PASSION24.HOUR.22.P052\",\"n\":52,\"t\":\"Je Te promets que chaque fois que me viendra la pens\u00e9e de ne pas agir seulement par amour pour Toi, je crierai imm\u00e9diatement : \u00ab J\u00e9sus et Marie, je Vous recommande mon \u00e2me ! \u00bb J\u00e9sus, je donne un baiser \u00e0 tes Pieds infiniment saints.\"},{\"id\":\"PASSION24.HOUR.22.P053\",\"n\":53,\"t\":\"Je Te demande pardon pour\\n- les nombreux pas faits sans intention droite,\\n- les nombreuses rues fr\u00e9quent\u00e9es pour faire le mal.\\n- pour les nombreuses \u00e2mes qui s'\u00e9loignent de Toi\\npour aller \u00e0 la recherche des plaisirs terrestres.\"},{\"id\":\"PASSION24.HOUR.22.P054\",\"n\":54,\"t\":\"Je Te promets que chaque fois o\u00f9 me viendra la pens\u00e9e de m'\u00e9loigner de Toi, je crierai imm\u00e9diatement : \u00ab J\u00e9sus et Marie, je Vous recommande mon \u00e2me ! \u00bb\"},{\"id\":\"PASSION24.HOUR.22.P055\",\"n\":55,\"t\":\"J\u00e9sus, je donne un baiser \u00e0 ton C\u0153ur infiniment sacr\u00e9. Je veux m'enfermer en lui et y enfermer toutes les \u00e2mes rachet\u00e9es par Toi, pour que toutes soient sauv\u00e9es, sans aucune exception. J\u00e9sus, enferme-moi dans ton C\u0153ur et fermes-en les portes, de sorte que je ne puisse voir que Toi.\"},{\"id\":\"PASSION24.HOUR.22.P056\",\"n\":56,\"t\":\"Je Te promets que chaque fois que me viendra la pens\u00e9e de vouloir sortir de ce C\u0153ur, je crierai imm\u00e9diatement : \u00ab J\u00e9sus et Marie, \u00e0 je Vous je donne mon c\u0153ur et mon \u00e2me ! \u00bb\"}],\"reflections\":[{\"id\":\"PASSION24.HOUR.22.REF.P001\",\"t\":\"J\u00e9sus br\u00fble de Soif. Et nous, br\u00fblons-nous d'amour pour Lui ?\\nNos pens\u00e9es et nos affections ont-elles toujours pour but\\nd'\u00e9tancher sa Soif ardente ?\\nJ\u00e9sus assoiff\u00e9, ne pouvant supporter la Soif qui le br\u00fble, dit :\\n\u00ab Tout est consomm\u00e9 ! \u00bb\\nJ\u00e9sus s'est sacrifi\u00e9 tout entier pour nous.\\nEt nous, en toute chose, nous effor\u00e7ons-nous d'\u00eatre continuellement consum\u00e9s\\nd'amour pour Lui ?\\nToutes les Actions, Paroles et Pens\u00e9es de J\u00e9sus\\nle portaient vers le sacrifice total de Lui-m\u00eame.\\nEt nous, chacune de nos actions, paroles et pens\u00e9es\\nnous poussent-elles \u00e0 nous consumer d'amour pour Lui ?\\nJ\u00e9sus, ma douce Vie,\\n- que ton Haleine moribonde p\u00e9n\u00e8tre dans mon pauvre c\u0153ur\\n- pour que je puisse recevoir l'empreinte de ton Sacrifice total.\\nSur la Croix, J\u00e9sus accomplit en toute chose la Volont\u00e9 du P\u00e8re\\net Il expire dans un Acte de parfait abandon \u00e0 cette Volont\u00e9 infiniment sainte.\"},{\"id\":\"PASSION24.HOUR.22.REF.P002\",\"t\":\"Et nous, accomplissons-nous en toute chose la Volont\u00e9 de Dieu ?\\nNous abandonnons-nous parfaitement \u00e0 son Vouloir\\n- sans nous demander s'il nous en vient du bien ou du mal,\\n- contents de seulement nous trouver abandonn\u00e9s dans ses Bras\\ninfiniment saints ?\"},{\"id\":\"PASSION24.HOUR.22.REF.P003\",\"t\":\"Sommes-nous toujours dispos\u00e9s \u00e0 mourir \u00e0 nous-m\u00eames par amour pour J\u00e9sus ? Pouvons-nous dire que bien que nous vivions, nous ne vivons pas par nous-m\u00eames, c'est-\u00e0-dire que nous sommes morts \u00e0 tout pour ne vivre que de la Vie de J\u00e9sus ?\"},{\"id\":\"PASSION24.HOUR.22.REF.P004\",\"t\":\"Est-ce que tout ce que nous faisons, pensons, d\u00e9sirons, aimons, attire en nous la Vie de J\u00e9sus pour que meurent en Lui nos paroles, nos pas, nos d\u00e9sirs, nos pens\u00e9es ?\"},{\"id\":\"PASSION24.HOUR.22.REF.P005\",\"t\":\"Mon J\u00e9sus, que ma vie soit une mort continuelle par amour pour Toi, et que toute mort que je subis soit une Vie que je donne \u00e0 toutes les \u00e2mes.\"}],\"subsections\":[]},{\"hour_id\":\"PASSION24.HOUR.23\",\"hour_number\":23,\"display_time\":\"15h \u00e0 16h\",\"title\":\"J\u00e9sus transperc\u00e9 par la lance \u2013 Sa d\u00e9position\",\"short_title\":\"J\u00e9sus transperc\u00e9 par la lance \u2013 Sa d\u00e9position\",\"source_pages\":[226,227,228,229,230],\"opening_prayer_ids\":[\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"],\"closing_prayer_ids\":[\"PASSION24.PRAYER.AFTER_EACH_HOUR\"],\"paragraphs\":[{\"id\":\"PASSION24.HOUR.23.P001\",\"n\":1,\"t\":\"Mon J\u00e9sus, au moment o\u00f9 Tu as expir\u00e9, toute la nature a pleur\u00e9 ta douloureuse Mort. Elle Te reconnaissait pour son Cr\u00e9ateur.\"},{\"id\":\"PASSION24.HOUR.23.P002\",\"n\":2,\"t\":\"Les anges, par milliers, volent autour de la Croix et pleurent ta Mort.\\n- ils T'adorent, Toi notre vrai Dieu, et\\n- ils T'accompagnent aux limbes.\\nL\u00e0 Tu combles de joie tant d'\u00e2mes qui, depuis des si\u00e8cles,\\nT\u2018attendent ardemment.\\nMon J\u00e9sus mort,\\n- je ne sais pas comment me d\u00e9tacher de ta Croix, et\\n- je ne me rassasie pas de baiser tes Plaies infiniment saintes.\\nCelles-ci me disent avec \u00e9loquence combien Tu m'aimes.\"},{\"id\":\"PASSION24.HOUR.23.P003\",\"n\":3,\"t\":\"En voyant tes horribles d\u00e9chirures, la profondeur de tes Plaies, si profondes qu'elles d\u00e9couvrent tes Os, je me sens mourir !\"},{\"id\":\"PASSION24.HOUR.23.P004\",\"n\":4,\"t\":\"Je voudrais tant pleurer sur ces Plaies que je les laverais de mes larmes.\\nJe voudrais tant T'aimer\\n- que je Te gu\u00e9rirais tout entier par mon amour et\\n- que je restituerais \u00e0 ton Humanit\u00e9 m\u00e9connaissable sa Beaut\u00e9 originale.\\nJe voudrais m'ouvrir les veines\\npour remplir les Tiennes de mon sang et Te ramener \u00e0 la vie.\\nMon J\u00e9sus, que ne peut pas faire l'Amour ? L'Amour est Vie !\\nMoi, au moyen de mon amour, je veux Te redonner la Vie.\\nSi mon amour ne suffit pas, donne-moi ton propre Amour.\\nAu moyen de cet Amour, je pourrai tout.\\nOui, je pourrai redonner Vie \u00e0 ton Humanit\u00e9 infiniment sainte.\\nMon doux J\u00e9sus, m\u00eame mort, Tu veux me t\u00e9moigner ton Amour et me donner\\nun refuge dans ton C\u0153ur sacr\u00e9.\"},{\"id\":\"PASSION24.HOUR.23.P005\",\"n\":5,\"t\":\"Un soldat, pouss\u00e9 par une force supr\u00eame, pour s'assurer de ta mort, Te d\u00e9chire le C\u0153ur d'un coup lance et T'y ouvre une Plaie profonde.\"},{\"id\":\"PASSION24.HOUR.23.P006\",\"n\":6,\"t\":\"Toi, mon Amour, Tu verses des gouttes de Sang et d'Eau, les derni\u00e8res que contient ton C\u0153ur embras\u00e9.\"},{\"id\":\"PASSION24.HOUR.23.P007\",\"n\":7,\"t\":\"Cette Plaie ouverte par l'Amour me dit tellement de choses ! Ta Bouche est muette, mais ton C\u0153ur me parle.\"},{\"id\":\"PASSION24.HOUR.23.P008\",\"n\":8,\"t\":\"Il me dit : \u00ab Mon enfant, J\u2019avais tout donn\u00e9. Par ce coup de lance, J\u2019ai voulu ouvrir dans mon C\u0153ur un refuge pour toutes les \u00e2mes.\"},{\"id\":\"PASSION24.HOUR.23.P009\",\"n\":9,\"t\":\"Mon C\u0153ur ouvert, criera continuellement \u00e0 tous : \u00ab Si vous voulez \u00eatre sauv\u00e9s, venez \u00e0 Moi !\"},{\"id\":\"PASSION24.HOUR.23.P010\",\"n\":10,\"t\":\"En Moi vous trouverez\\n- la saintet\u00e9,\\n- le soulagement dans les afflictions,\\n- la force dans la faiblesse,\\n- la paix dans les doutes,\\n- la compagnie dans la solitude.\\n\u00d4 \u00e2mes qui M'aimez :\\nsi vous voulez M'aimer vraiment, demeurez toujours dans ce C\u0153ur.\"},{\"id\":\"PASSION24.HOUR.23.P011\",\"n\":11,\"t\":\"C'est ici que vous trouverez\\n- l'Amour vrai pour aimer et\\n- des Flammes ardentes pour vous br\u00fbler et vous consumer d'Amour.\"},{\"id\":\"PASSION24.HOUR.23.P012\",\"n\":12,\"t\":\"Tout est concentr\u00e9 dans ce C\u0153ur : c'est l\u00e0 que se trouvent\\n- les Sacrements,\\n- la Vie de mon \u00c9glise, et\\n- la Vie de toutes les \u00e2mes.\"},{\"id\":\"PASSION24.HOUR.23.P013\",\"n\":13,\"t\":\"En lui, Je ressens aussi\\n- les profanations qui se font contre mon \u00c9glise,\\n- les intrigues de ses ennemis,\\n- les fl\u00e8ches qu'ils lui d\u00e9cochent,\\n- mes enfants qu'ils pi\u00e9tinent.\\nCar il n'y a pas d'offense que mon C\u0153ur ne ressente.\"},{\"id\":\"PASSION24.HOUR.23.P014\",\"n\":14,\"t\":\"Par cons\u00e9quent, mon enfant, que ta vie soit en mon C\u0153ur.\\n- d\u00e9fends-le, r\u00e9pare toutes les offenses contre lui,\\n- conduis-y tous les gens. \u00bb\\nJ\u00e9sus,\\npar Amour pour moi, Tu T'es laiss\u00e9 blesser le C\u0153ur par une lance.\\nDe tes Mains, blesse mon c\u0153ur, mes affections, mes d\u00e9sirs et tout moi-m\u00eame.\\nQu'il n'y ait rien en moi qui ne soit bless\u00e9 par tes Mains amoureuses.\"},{\"id\":\"PASSION24.HOUR.23.P015\",\"n\":15,\"t\":\"Je m'unis aux peines navrantes de notre ch\u00e8re Maman. En voyant qu'on Te d\u00e9chire le C\u0153ur, elle d\u00e9faille de douleur et d'Amour.\"},{\"id\":\"PASSION24.HOUR.23.P016\",\"n\":16,\"t\":\"Comme une colombe, elle vole en ton C\u0153ur\\npour y occuper la premi\u00e8re place, pour y \u00eatre\\n- la premi\u00e8re R\u00e9paratrice,\\n- la Reine,\\n- la M\u00e9diatrice entre Toi et les cr\u00e9atures.\\nAvec ma Maman, je veux moi aussi voler dans ton C\u0153ur\\nafin de voir comment elle y r\u00e9pare les offenses des cr\u00e9atures.\"},{\"id\":\"PASSION24.HOUR.23.P017\",\"n\":17,\"t\":\"J\u00e9sus, Je trouverai la Vie dans ton C\u0153ur bless\u00e9, si bien que, peu importe ce que je ferai, mes actions y trouveront Vie. Je ne donnerai plus de vie \u00e0 mes pens\u00e9es, mais si elles veulent la Vie, je prendrai tes Pens\u00e9es.\"},{\"id\":\"PASSION24.HOUR.23.P018\",\"n\":18,\"t\":\"Ma volont\u00e9 n'aura plus de vie, mais si elle veut la Vie, je prendrai ta Volont\u00e9. Mon amour n'aura plus de vie, mais s'il veut la Vie, je prendrai ton Amour.\"},{\"id\":\"PASSION24.HOUR.23.P019\",\"n\":19,\"t\":\"J\u00e9sus, toute ta Vie m'appartient : c'est ta Volont\u00e9.\"},{\"id\":\"PASSION24.HOUR.23.P020\",\"n\":20,\"t\":\"J\u00e9sus Tu es mort. Tes disciples se d\u00e9p\u00eachent de Te d\u00e9poser de la Croix. Joseph et Nicod\u00e8me \u00e9taient jusqu'\u00e0 pr\u00e9sent tes disciples en secret.\"},{\"id\":\"PASSION24.HOUR.23.P021\",\"n\":21,\"t\":\"Eh bien, maintenant, avec courage, sans craindre quoi que ce soit, ils veulent Te donner une s\u00e9pulture honorable. Ils prennent des marteaux et des tenailles pour accomplir le D\u00e9clouement sacr\u00e9 et si triste. Ta M\u00e8re, afflig\u00e9e, \u00e9tend ses bras maternels pour Te recevoir sur son Sein. Mon J\u00e9sus, ils Te d\u00e9clouent Je veux aider tes disciples \u00e0 soutenir ton Corps infiniment saint. Au moyen des clous qu'ils T'enl\u00e8vent, cloue-moi tout enti\u00e8re sur Toi. Avec ta sainte M\u00e8re, je veux T'adorer, T'embrasser, puis m'enfermer dans ton C\u0153ur pour ne plus jamais en sortir.\"}],\"reflections\":[{\"id\":\"PASSION24.HOUR.23.REF.P001\",\"t\":\"Apr\u00e8s sa Mort, J\u00e9sus a voulu, par Amour pour nous, \u00eatre bless\u00e9 par une lance. Et nous, nous laissons-nous blesser en toutes choses par J\u00e9sus ? Ou bien nous laissons-nous blesser par les cr\u00e9atures, par les plaisirs, par l\u2019attachement \u00e0 nous-m\u00eames ? Les froideurs, les obscurit\u00e9s, les mortifications internes et externes sont des blessures que le Seigneur pr\u00e9sente \u00e0 notre \u00e2me.\"},{\"id\":\"PASSION24.HOUR.23.REF.P002\",\"t\":\"Si nous ne les recevons pas des Mains de Dieu,\\n- nous nous blessons nous-m\u00eames,\\n- nos blessures activent nos passions, nos faiblesses, notre amour-propre et\\ntous nos maux.\\nSi, au contraire, nous les recevons comme des blessures am\u00e9nag\u00e9es en nous\\npar J\u00e9sus, il y mettra son Amour, ses Vertus et sa Ressemblance.\\nCeci nous fera m\u00e9riter ses Baisers, ses Caresses et tous les stratag\u00e8mes de\\nl\u2019Amour divin.\"},{\"id\":\"PASSION24.HOUR.23.REF.P003\",\"t\":\"Ces blessures seront des voix qui L\u2019appelleront et Le contraindront \u00e0 demeurer avec nous continuellement. Mon J\u00e9sus, que ta Lance soit le garde qui me d\u00e9fende de toute blessure provenant des cr\u00e9atures.\"},{\"id\":\"PASSION24.HOUR.23.REF.P004\",\"t\":\"En quittant la Croix, J\u00e9sus est d\u00e9pos\u00e9 dans les Bras de sa Maman. Et nous, d\u00e9posons-nous dans les Mains de notre Maman nos doutes, nos anxi\u00e9t\u00e9s, nos craintes ?\"},{\"id\":\"PASSION24.HOUR.23.REF.P005\",\"t\":\"J\u00e9sus reposa sur le Sein de sa sainte M\u00e8re. Et nous, faisons-nous reposer J\u00e9sus en nous en faisant dispara\u00eetre nos craintes et nos agitations ? Ma Maman, de tes Mains maternelles enl\u00e8ve de mon c\u0153ur tout ce qui pourrait emp\u00eacher J\u00e9sus de reposer en moi.\"}],\"subsections\":[]},{\"hour_id\":\"PASSION24.HOUR.24\",\"hour_number\":24,\"display_time\":\"16h \u00e0 17h\",\"title\":\"La s\u00e9pulture de J\u00e9sus \u2013 La D\u00e9solation de la Vierge Marie\",\"short_title\":\"La s\u00e9pulture de J\u00e9sus \u2013 La D\u00e9solation de la Vierge Marie\",\"source_pages\":[231,232,233,234,235,236,237,238,239,240,241,242,243,244],\"opening_prayer_ids\":[\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"],\"closing_prayer_ids\":[\"PASSION24.PRAYER.AFTER_EACH_HOUR\"],\"paragraphs\":[{\"id\":\"PASSION24.HOUR.24.P001\",\"n\":1,\"t\":\"24e Heure \u2014 16h \u00e0 17h\"},{\"id\":\"PASSION24.HOUR.24.P002\",\"n\":2,\"t\":\"La s\u00e9pulture de J\u00e9sus \u2013 La D\u00e9solation de la Vierge Marie\"},{\"id\":\"PASSION24.HOUR.24.P003\",\"n\":3,\"t\":\"La s\u00e9pulture de J\u00e9sus\"},{\"id\":\"PASSION24.HOUR.24.P004\",\"n\":4,\"t\":\"Mon J\u00e9sus, d\u00e9gag\u00e9 de la Croix,\\nta M\u00e8re afflig\u00e9e fut la premi\u00e8re \u00e0 Te recevoir sur son Sein.\\nTa T\u00eate transperc\u00e9e reposa doucement dans ses Bras.\\nDouce Maman,\\n- ne d\u00e9daigne pas de m'avoir en ta compagnie et\\n- fais qu'avec toi je puisse accomplir mes derniers devoirs\\nenvers mon bien-aim\u00e9 J\u00e9sus.\"},{\"id\":\"PASSION24.HOUR.24.P005\",\"n\":5,\"t\":\"Ma M\u00e8re pleine de douceur, Tu me surpasses dans l'amour et dans la d\u00e9licatesse pour toucher \u00e0 mon J\u00e9sus. Mais moi, je m'efforcerai de t'imiter de mon mieux pour Lui plaire en tout.\"},{\"id\":\"PASSION24.HOUR.24.P006\",\"n\":6,\"t\":\"Par cons\u00e9quent, comme tu le fais si d\u00e9licatement de tes Mains, je veux moi aussi, de mes mains, extraire toutes les \u00e9pines qui entourent sa T\u00eate ador\u00e9e, et je veux unir mes profondes adorations aux tiennes.\"},{\"id\":\"PASSION24.HOUR.24.P007\",\"n\":7,\"t\":\"\u00d4 c\u00e9leste Maman, tes Mains enl\u00e8vent le Sang coagul\u00e9 des Yeux de J\u00e9sus.\\nCes Yeux\\n- un jour, donnaient la Lumi\u00e8re \u00e0 tout le monde et\\n- maintenant, sont obscurcis et \u00e9teints.\"},{\"id\":\"PASSION24.HOUR.24.P008\",\"n\":8,\"t\":\"Maman, je m'unis \u00e0 toi\\nDonnons ensemble \u00e0 ces Yeux divins un baiser et adorons-les profond\u00e9ment !\\nJe vois les Oreilles de mon J\u00e9sus\\n- tremp\u00e9es de Sang, \u00e9cras\u00e9es par les gifles, lac\u00e9r\u00e9es par les \u00e9pines.\"},{\"id\":\"PASSION24.HOUR.24.P009\",\"n\":9,\"t\":\"Donnons, \u00f4 M\u00e8re, nos adorations \u00e0 ces Oreilles\\n- qui n'entendent plus et\\n- qui ont tant souffert, pour \u00e9veiller les \u00e2mes sourdes et obstin\u00e9es\\naux appels de la Gr\u00e2ce.\\n\u00d4 douce Maman,\\nTon visage est baign\u00e9 de larmes en voyant le Visage de J\u00e9sus, l'Afflig\u00e9.\\nJ'unis ma douleur \u00e0 la Tienne.\\nEnsemble, enlevons-Lui la boue et les crachats qui L'ont \u00e0 ce point d\u00e9form\u00e9.\\nAdorons ce Visage de divine Majest\u00e9\\n- qui faisait s'\u00e9prendre le Ciel et la terre, et\\n- qui, maintenant, ne donne plus signe de Vie !\\n\u00d4 douce Maman,\\ndonnons ensemble un baiser \u00e0 la divine Bouche de J\u00e9sus qui\\n- par la suavit\u00e9 de sa Parole a attir\u00e9 tant d'\u00e2mes \u00e0 son C\u0153ur !\\n\u00d4 M\u00e8re, c'est avec ta propre Bouche que je veux baiser ses L\u00e8vres livides et\\nensanglant\u00e9es. Je les adore profond\u00e9ment.\\n\u00d4 ma douce Maman,\\navec toi je veux donner des baisers\\n\u00e0 l'adorable Corps de mon J\u00e9sus, r\u00e9duit tout entier en une effroyable Plaie.\\nComme toi, j'utilise mes mains\\npour remettre en place les morceaux de Chair qui pendent de son Corps.\\nAdorons profond\u00e9ment ce Corps infiniment saint.\\n\u00d4 M\u00e8re, donnons des baisers \u00e0,\\n- ces Mains cr\u00e9atrices, qui ont fait tant de Prodiges pour nous,\\n- ces Mains transperc\u00e9es, contorsionn\u00e9es,\\nmaintenant froides et raidies par la mort !\"},{\"id\":\"PASSION24.HOUR.24.P010\",\"n\":10,\"t\":\"\u00d4 douce Maman, renfermons en leurs Blessures infiniment saintes le sort de toutes les \u00e2mes. \u00c0 sa R\u00e9surrection, J\u00e9sus les trouvera plac\u00e9es l\u00e0 par toi, et aucune ne sera perdue.\"},{\"id\":\"PASSION24.HOUR.24.P011\",\"n\":11,\"t\":\"\u00d4 M\u00e8re, au nom de tous et avec tous adorons ensemble ces pr\u00e9cieuses Blessures. \u00d4 c\u00e9leste Maman, te voil\u00e0 en train de donner des baisers aux Pieds de J\u00e9sus. Les Blessures de ces Pieds divins sont navrantes ! Les clous ont enlev\u00e9 une partie de la Chair et de la Peau. Le poids du Corps infiniment sacr\u00e9 les a d\u00e9chir\u00e9s de mani\u00e8re horrible !\"},{\"id\":\"PASSION24.HOUR.24.P012\",\"n\":12,\"t\":\"Donnons ensemble un baiser \u00e0 ces Blessures et adorons-les profond\u00e9ment.\\nEn elles, renfermons tous les pas des p\u00e9cheurs afin que,\\n- quand ils marchent, ils entendent les Pas de J\u00e9sus derri\u00e8re eux, et\\n- qu'ainsi ils n'osent pas L'offenser.\\nJe Te vois, \u00f4 douce Maman, fixer du regard\\nle C\u0153ur ouvert de l'adorable J\u00e9sus.\\nDe gr\u00e2ce, ensevelis-moi en ce C\u0153ur sacr\u00e9.\\nEt comme je poss\u00e9derai ainsi le C\u0153ur et la Vie de mon Bien-Aim\u00e9,\\nj'y resterai cach\u00e9e jusqu'\u00e0 l'\u00e9ternit\u00e9.\"},{\"id\":\"PASSION24.HOUR.24.P013\",\"n\":13,\"t\":\"Donne-moi ton Amour, \u00f4 Maman, pour que je puisse aimer J\u00e9sus comme toi.\\nDonne-moi ta Douleur pour que, comme toi,\\n- je puisse souffrir et plaider pour tous, et\\n- r\u00e9parer toutes les offenses faites \u00e0 ce C\u0153ur !\\n\u00d4 Maman,\\ntoi qui pr\u00e9pares J\u00e9sus pour l'ensevelissement,\\nc\u2019est de tes propres Mains que je veux \u00eatre ensevelie avec Lui,\\nafin que je puisse ressusciter avec Lui. Ainsi soit-il.\\nEt maintenant, c'est \u00e0 toi aussi, \u00f4 M\u00e8re amoureuse,\\nque je veux donner mon tribut filial.\\nJe compatis beaucoup avec toi.\"},{\"id\":\"PASSION24.HOUR.24.P014\",\"n\":14,\"t\":\"Au moyen de toutes les effusions d'amour de mon c\u0153ur,\\nje voudrais\\n- r\u00e9unir tous les battements de c\u0153ur, tous les d\u00e9sirs, toute la vie des cr\u00e9atures\\n- les d\u00e9poser devant toi comme autant d'actes d'amour.\"},{\"id\":\"PASSION24.HOUR.24.P015\",\"n\":15,\"t\":\"Je compatis avec toi pour l'extr\u00eame douleur que tu as soufferte en voyant J\u00e9sus couronn\u00e9 d'\u00e9pines, tortur\u00e9 par les coups et les clous.\"},{\"id\":\"PASSION24.HOUR.24.P016\",\"n\":16,\"t\":\"Aussi en voyant\\n- ces Yeux qui ne Te regardent plus,\\n- ces Oreilles qui n'entendent plus ta voix,\\n- cette Bouche qui ne Te parle plus,\"},{\"id\":\"PASSION24.HOUR.24.P017\",\"n\":17,\"t\":\"- ces Mains qui ne Te caressent plus,\\n- ces Pieds qui ne Te suivront plus.\\nJe voudrais t'offrir le C\u0153ur de ce m\u00eame J\u00e9sus d\u00e9bordant d'Amour,\\n- pour compatir avec toi comme tu le m\u00e9rites et\\n- pour donner un soulagement \u00e0 tes Douleurs si cruelles.\"}],\"reflections\":[{\"id\":\"PASSION24.HOUR.24.REF.P001\",\"t\":\"J\u00e9sus est enseveli. Une pierre ferme le tombeau. Elle emp\u00eache la Maman de continuer \u00e0 regarder et admirer son Fils.\"},{\"id\":\"PASSION24.HOUR.24.REF.P002\",\"t\":\"Et nous, savons-nous nous dissimuler aux regards des cr\u00e9atures ?\\nSommes-nous indiff\u00e9rents \u00e0 ce que tous nous oublient ?\\nDans les choses saintes,\\n- sommes-nous dans une sainte indiff\u00e9rence,\\n- ne nous opposant \u00e0 rien de ce que Dieu attend de nous ?\"},{\"id\":\"PASSION24.HOUR.24.REF.P003\",\"t\":\"Notre regard est-il enseveli dans le Regard de J\u00e9sus,\\nde sorte que nous ne regardions rien, sauf J\u00e9sus et ce qui \u00e9mane de Lui ?\\nNotre voix est-elle ensevelie dans la Voix de J\u00e9sus,\\nde sorte que si nous parlons, nous ne parlions qu'avec la Langue de J\u00e9sus ?\\nNos pas sont-ils ensevelis dans ceux de J\u00e9sus,\\nde sorte que quand nous marchons, la seule empreinte que nous laissions\\n- soit celle des Pas de J\u00e9sus ?\\nEt notre c\u0153ur est-il enseveli dans celui de J\u00e9sus,\\nde sorte que nous n'aimions et ne d\u00e9sirions que\\n- ce qu'aime et d\u00e9sire son C\u0153ur ?\\nMaman, quand, J\u00e9sus se dissimule \u00e0 moi, pour le bien de mon \u00e2me,\\ndonne-moi la Gr\u00e2ce que tu avais quand tu \u00e9tais priv\u00e9e de sa Pr\u00e9sence,\\nafin que je puisse Lui donner toute la gloire\\nque tu Lui as donn\u00e9e quand on L'a d\u00e9pos\u00e9 dans le s\u00e9pulcre.\\nJ\u00e9sus, je veux Te prier avec ta propre Voix.\\nEt comme ta Voix p\u00e9n\u00e9trait les Cieux et se r\u00e9percutait dans la voix de tous, en\\nparticulier dans la mienne, que ma voix p\u00e9n\u00e8tre jusqu'aux Cieux pour Te\\ndonner la gloire de ta propre Voix.\\nJ\u00e9sus, mon c\u0153ur palpite.\\nMais je ne serai pas contente si Tu ne le fais pas palpiter avec le Tien.\"},{\"id\":\"PASSION24.HOUR.24.REF.P004\",\"t\":\"Avec tes Battements de C\u0153ur, j'aimerai comme Toi Tu aimes.\"},{\"id\":\"PASSION24.HOUR.24.REF.P005\",\"t\":\"Je Te donnerai l'amour de toutes les cr\u00e9atures. Nous n'entendrons qu'un cri : \u00ab Amour, Amour ! \u00bb\"},{\"id\":\"PASSION24.HOUR.24.REF.P006\",\"t\":\"Mon J\u00e9sus, fais-toi honneur :\\nen tout ce que je fais, mets-y l'empreinte\\n- de ton Pouvoir,\\n- de ton Amour et\\n- de ta Gloire.\"}],\"subsections\":[{\"title\":\"La D\u00e9solation de la Vierge Marie\",\"paragraphs\":[{\"id\":\"PASSION24.HOUR.24.DESOL.P002\",\"n\":2,\"t\":\"\u00ab Elles me co\u00fbtent trop, les \u00e2mes, elles me co\u00fbtent la Vie d'un Fils Dieu. Et moi, comme Cor\u00e9demptrice et M\u00e8re, je les lie \u00e0 toi, \u00f4 Croix. \u00bb\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P003\",\"n\":3,\"t\":\"Maman souffrante, voil\u00e0 que tu te disposes au sacrifice ultime de devoir donner la s\u00e9pulture \u00e0 ton Fils J\u00e9sus.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P004\",\"n\":4,\"t\":\"Compl\u00e8tement r\u00e9sign\u00e9e aux Vouloirs du Ciel, tu t'affaires pr\u00e8s de Lui. De tes propres Mains, tu Le d\u00e9poses dans le S\u00e9pulcre.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P005\",\"n\":5,\"t\":\"Et tandis\\n- que tu arranges ses Membres et\\n- que tu es sur le point de Lui faire ton dernier adieu et de Lui donner ton\\ndernier Baiser, tu sens ton C\u0153ur s'arracher de ta Poitrine !\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P006\",\"n\":6,\"t\":\"L'Amour te cloue sur ses Membres. Par la force de l'Amour et de la Douleur, tu te sens t'\u00e9teindre avec ton Fils \u00e9teint ! Pauvre Maman ! Comment feras-tu sans J\u00e9sus qui \u00e9tait ta Vie, ton Tout ? Et pourtant, le Vouloir de l'\u00c9ternel le veut ainsi.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P007\",\"n\":7,\"t\":\"Tu es aux prises avec deux Puissances insurmontables :\\nton Amour pour J\u00e9sus et le Vouloir divin.\\n- Ton Amour te cloue de telle sorte qu'il emp\u00eache la s\u00e9paration,\\n- et le Vouloir divin s'impose et veut ce sacrifice.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P008\",\"n\":8,\"t\":\"Pauvre Maman, comment feras-tu ? Comme je compatis avec toi !\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P009\",\"n\":9,\"t\":\"De gr\u00e2ce, anges du Ciel, venez la soutenir aupr\u00e8s des Membres raidis de son\\nJ\u00e9sus. Autrement elle mourra elle aussi !\\nMais, \u00f4 prodige,\\n- tandis que tu sembles \u00e9teinte avec J\u00e9sus,\\n- j'entends ta Voix tremblante et entrecoup\u00e9e de sanglots qui dit :\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P010\",\"n\":10,\"t\":\"\u00ab Fils, \u00f4 Bien-Aim\u00e9 Fils,\\nc'est le dernier soulagement qu'il me reste pour adoucir mes peines :\\n- m'\u00e9pancher sur les Plaies de ton Humanit\u00e9 infiniment sainte,\\n- les adorer,\\n- les baiser.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P011\",\"n\":11,\"t\":\"Et maintenant, cela aussi, on me l'enl\u00e8ve. Le Vouloir divin le veut ainsi. Et moi, je me r\u00e9signe.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P012\",\"n\":12,\"t\":\"Mais sache, \u00f4 Fils,\\n- que m\u00eame si c'est ce que je veux,\\n- j'en suis incapable.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P013\",\"n\":13,\"t\":\"\u00c0 la seule pens\u00e9e de le faire, les forces me manquent et la vie me fuit.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P014\",\"n\":14,\"t\":\"De gr\u00e2ce, \u00f4 Fils,\\npour que je puisse avoir la force d'effectuer l'am\u00e8re s\u00e9paration,\\npermets-moi\\n- de me laisser toute ensevelie en Toi et\\n- de prendre ta Vie en moi, tes Peines, tes R\u00e9parations,\\net tout ce que Tu es.\\nAh ! seul un \u00e9change de Vies entre Toi et moi peut me donner la force\\nd'accomplir le sacrifice de me s\u00e9parer de Toi ! \u00bb\\nMaman afflig\u00e9e,\\ntu penches ta t\u00eate sur celle de J\u00e9sus,\\ntu Lui donnes des baisers, et\\ntu enfermes tes pens\u00e9es dans les Siennes.\\nOh ! comme tu voudrais ranimer son Intelligence avec la tienne,\\npour ainsi lui donner vie pour Vie !\\nMaman afflig\u00e9e,\\nje te vois donner des baisers aux Yeux \u00e9teints de J\u00e9sus.\\nOh ! comme tu souffres de constater que J\u00e9sus ne te regarde plus !\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P015\",\"n\":15,\"t\":\"Combien de fois, en te regardant, ces Yeux divins te transportaient de joie et faisaient ressusciter ton C\u0153ur ! Maintenant qu'Il ne te regarde plus, tu te sens mourir.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P016\",\"n\":16,\"t\":\"Tu \u00e9changes tes yeux avec ceux de J\u00e9sus.\\nTu prends pour toi\\n- ses Larmes,\\n- l'amertume que Lui procuraient les offenses des cr\u00e9atures,\\n- leurs insultes et\\n- leurs m\u00e9pris.\\nMaman afflig\u00e9e,\\nje te vois donner des baisers \u00e0 ses Oreilles infiniment saintes.\\nTu l'appelles et lui dis :\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P017\",\"n\":17,\"t\":\"\u00ab Mon Fils, est-il possible que Tu ne m'\u00e9coutes plus, Toi qui \u00e0 chacun de mes appels joyeux, accourrais ? Maintenant, je pleure, je T'appelle, et Tu ne m'entends pas ? Ah ! l'Amour fortement ressenti est un cruel tyran. Toi, Tu \u00e9tais pour moi plus que ma propre vie. Et maintenant, comment pourrais-je d\u00e9sormais survivre \u00e0 tant de douleurs ?\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P018\",\"n\":18,\"t\":\"\u00d4 Fils, je laisse mon ou\u00efe dans la Tienne et je prends pour moi ce qu'ont souffert tes Oreilles infiniment saintes. Seules tes Peines et tes Douleurs peuvent me redonner Vie. \u00bb\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P019\",\"n\":19,\"t\":\"Et pendant que tu dis cela,\\n- la douleur et les serrements que tu ressens au C\u0153ur sont si grands\\n- que tu en perds la voix et restes sans mouvement.\\nMa pauvre Maman, ma pauvre Maman, comme je compatis avec toi !\\nCombien de morts cruelles ne subis-tu pas !\\nMaman souffrante,\\nle Vouloir divin\\n- s'impose et te met en action.\\nAinsi\\n- tu regardes le Visage infiniment saint de ton J\u00e9sus,\\n- tu Lui donnes des baisers et t'exclames :\\n\u00ab Fils ador\u00e9, comme Tu es d\u00e9figur\u00e9 !\\nAh ! si l'Amour ne m'indiquait pas que Tu es mon Fils, ma Vie et mon\\nTout, je ne Te reconna\u00eetrais pas.\\n- Ta Beaut\u00e9 originale s'est transform\u00e9e en difformit\u00e9s.\\n- le teint rose de tes Joues pourpr\u00e9es s'est chang\u00e9 en bleus.\\n- la Lumi\u00e8re et la Gr\u00e2ce que transmettait ton beau Visage,\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P020\",\"n\":20,\"t\":\"qui comblait de joie ceux qui l'admiraient, se sont chang\u00e9es en p\u00e2leur de\\nmort !\\n\u00ab Ah ! Fils bien-aim\u00e9,\\n\u00e0 quel piteux \u00e9tat as-Tu \u00e9t\u00e9 r\u00e9duit !\\nQuel horrible ravage a fait le p\u00e9ch\u00e9 sur tes Membres infiniment saints !\\nOh ! comme ton ins\u00e9parable Maman voudrait Te restituer ta Beaut\u00e9\\npremi\u00e8re !\\nJe veux \u00e9changer mon visage avec le Tien et prendre pour moi\\n- les gifles, les crachats, les m\u00e9pris et\\n- tout ce que Tu as souffert dans ton saint Visage.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P021\",\"n\":21,\"t\":\"Ah ! Fils, si Tu me veux en vie, donne-moi tes Peines,\\nautrement je mourrai ! \u00bb\\nTa douleur est telle, \u00f4 Maman, qu'elle\\n- Te paralyse,\\n- Te coupe la parole, et que\\n- tu es comme \u00e9teinte aupr\u00e8s du Visage de ton J\u00e9sus.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P022\",\"n\":22,\"t\":\"Pauvre Maman, comme je compatis avec toi ! Mes saints anges, venez soutenir ma Maman. Sa douleur immense l'inonde, la suffoque, et il ne lui reste ni vie ni force.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P023\",\"n\":23,\"t\":\"Mais, d\u00e9chirant ces vagues de souffrances, le Vouloir divin te remet en Vie.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P024\",\"n\":24,\"t\":\"Tu donnes des baisers sur la Bouche de J\u00e9sus. Ce faisant, tu sens tes l\u00e8vres devenir am\u00e8res \u00e0 cause du fiel qui a rempli sa Bouche d'amertume.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P025\",\"n\":25,\"t\":\"En sanglotant tu Lui dis :\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P026\",\"n\":26,\"t\":\"\u00ab Mon Fils, dis une derni\u00e8re Parole \u00e0 ta Maman.\\nEst-il possible que je ne puisse plus entendre ta Voix ?\\nToutes les Paroles que Tu m'as dites quand Tu \u00e9tais en vie, eh bien,\\ncomme autant de fl\u00e8ches, me blessent le C\u0153ur de Douleur et d'Amour.\\n\u00ab Maintenant que je Te vois muet,\\ntes fl\u00e8ches\\n- se meuvent dans mon C\u0153ur,\\n- me donnent de continuelles morts et\\n- me disent :\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P027\",\"n\":27,\"t\":\"\u00ab Tu ne L'entendras plus ! Tu n'entendras plus son doux Accent, la m\u00e9lodie de sa Parole cr\u00e9atrice,\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P028\",\"n\":28,\"t\":\"qui cr\u00e9ait en toi autant de paradis qu'Il pronon\u00e7ait de Paroles ! \u00bb\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P029\",\"n\":29,\"t\":\"Ah ! mon paradis est fini. Je n'aurai plus rien d'autre que de l'amertume ! Ah ! Fils, je veux \u00e9changer ma langue avec la Tienne.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P030\",\"n\":30,\"t\":\"Fais-moi ressentir\\n- ce que Tu as souffert dans ta Bouche infiniment sainte,\\n- l'amertume du fiel et ta Soif ardente.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P031\",\"n\":31,\"t\":\"Fais-moi aussi ressentir tes R\u00e9parations et tes Pri\u00e8res.\\nComme, au moyen de ta Langue, j'entendrai ta Voix,\\n- ma douleur sera plus supportable.\\nTa M\u00e8re souffrante pourra vivre par le moyen de tes Peines ! \u00bb\\nMaman tortur\u00e9e, je vois que tu Te h\u00e2tes,\\ncar ceux qui sont autour de toi veulent fermer le s\u00e9pulcre.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P032\",\"n\":32,\"t\":\"Alors\\n- tu prends les Mains de J\u00e9sus dans les tiennes,\\n- tu les baises,\\n- tu les serres sur ton C\u0153ur, et\\n- tu fais tiennes leurs blessures.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P033\",\"n\":33,\"t\":\"Puis,\\n- fixant du regard ses Pieds et\\n- voyant la torture cruelle que les clous leurs ont donn\u00e9e,\\ntu fais tienne ces Plaies et ces Pieds m\u00eames,\\n- pour courir au moyen d'eux apr\u00e8s tous les p\u00e9cheurs et\\n- pour les arracher \u00e0 l'enfer.\\nMaman angoiss\u00e9e,\\nje vois que tu adresses ton dernier adieu au C\u0153ur transperc\u00e9 de J\u00e9sus.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P034\",\"n\":34,\"t\":\"Ici ton C\u0153ur maternel subit le dernier assaut. Tu le sens s'arracher de ta poitrine par la v\u00e9h\u00e9mence de ton amour et de ta douleur.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P035\",\"n\":35,\"t\":\"Il sent le besoin de faire sien\\n- le C\u0153ur infiniment saint de J\u00e9sus,\\n- son Amour rejet\u00e9 par tant de cr\u00e9atures,\\n- ses Douleurs,\\n- ses Blessures,\\n- ses nombreux D\u00e9sirs ardents non r\u00e9alis\u00e9s\\n\u00e0 cause des ingratitudes des cr\u00e9atures.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P036\",\"n\":36,\"t\":\"Tu regardes avec \u00e9tonnement la grande Blessure de ce C\u0153ur. Tu Lui donnes des baisers. Tu en touches le Sang.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P037\",\"n\":37,\"t\":\"Comme si tu en avais acquis la Vie, tu ressens la force de r\u00e9aliser l'am\u00e8re s\u00e9paration. Et apr\u00e8s avoir embrass\u00e9 ton J\u00e9sus, tu permets qu'on ferme le s\u00e9pulcre ! Maman souffrante, je te prie, en pleurant, de ne pas permettre pour le moment que J\u00e9sus soit soustrait \u00e0 mes regards. Attends que d'abord je m'enferme en Lui pour prendre sa Vie en moi.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P038\",\"n\":38,\"t\":\"Si tu ne peux pas vivre sans J\u00e9sus, toi qui es\\n- l'Immacul\u00e9e,\\n- la Sainte,\\n- la Combl\u00e9e de Gr\u00e2ces,\\nmoi, je le peux encore bien moins,\\nmoi qui suis la faiblesse, la mis\u00e8re, un ab\u00eeme de p\u00e9ch\u00e9s.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P039\",\"n\":39,\"t\":\"De gr\u00e2ce, Maman souffrante,\\nne me laisse pas seule.\\n- Prends-moi avec toi.\\n- Mais d\u00e9pose-moi d'abord tout enti\u00e8re en J\u00e9sus.\\n- Et vide-moi compl\u00e8tement, afin que\\nje puisse mettre J\u00e9sus tout entier en moi, comme tu L'as mis en toi.\\nCommence chez moi l'office maternel que J\u00e9sus t'a donn\u00e9 sur la Croix.\\nQue mon extr\u00eame pauvret\u00e9 fasse impression sur ton C\u0153ur maternel.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P040\",\"n\":40,\"t\":\"De tes mains maternelles,\\n- enferme-moi tout enti\u00e8re en J\u00e9sus, et\\n- enferme J\u00e9sus tout entier en moi.\\n- enferme dans mon intelligence les Pens\u00e9es de J\u00e9sus,\\nafin que nulle autre pens\u00e9e n'entre en moi.\\n- enferme les Yeux de J\u00e9sus dans les miens,\\nafin que rien ne puisse jamais \u00e9chapper \u00e0 mon regard ;\\n- enferme son Ou\u00efe dans la mienne, pour que je l'\u00e9coute toujours et\\nqu'en toutes choses j'accomplisse son Vouloir infiniment saint.\\n- enferme son Visage dans le mien, afin que, admirant ce Visage si d\u00e9figur\u00e9\\npar Amour pour moi, je l'aime, je compatisse avec Lui et Le r\u00e9pare.\\n- enferme sa Langue dans la mienne, pour que je parle, prie, et enseigne\\nau moyen de la Langue de J\u00e9sus ;\\n- enferme ses Mains dans les miennes, afin que\\ntout mouvement que je ferai et\\ntoute \u0153uvre que j'accomplirai\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P041\",\"n\":41,\"t\":\"prennent Vie des \u0152uvres et des Mouvements de J\u00e9sus ;\\n- enferme ses Pieds dans les miens, afin que tout pas que je ferai\\napporte la Vie, le Salut et la Force aux cr\u00e9atures.\\nMaman afflig\u00e9e,\\nque moi aussi je donne des baisers \u00e0 son C\u0153ur,\\nque j'en touche le Sang infiniment pr\u00e9cieux.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P042\",\"n\":42,\"t\":\"Enfermant son C\u0153ur dans le mien, fais en sorte que je puisse vivre\\n- de son Amour,\\n- de ses D\u00e9sirs et\\n- de ses Peines.\\nEt maintenant, prenant la Main droite raidie de J\u00e9sus,\\n- donne-moi par elle ta b\u00e9n\u00e9diction,\\n- puis permets qu'on l'enferme de nouveau dans le tombeau.\\nLa pierre ferme maintenant le s\u00e9pulcre.\\nToi, tortur\u00e9e, tu la baises et, en pleurant, tu essaies de partir.\\nMais ta douleur est si grande que tu restes p\u00e9trifi\u00e9e !\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P043\",\"n\":43,\"t\":\"Ma M\u00e8re tortur\u00e9e et afflig\u00e9e, avec toi je fais mes adieux \u00e0 J\u00e9sus. En pleurant, je compatis avec toi et je te tiens compagnie en ton am\u00e8re d\u00e9solation.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P044\",\"n\":44,\"t\":\"Je veux me mettre \u00e0 tes c\u00f4t\u00e9s\\npour donner \u00e0 chacune de tes respirations et de tes douleurs\\n- une parole de r\u00e9confort,\\n- un regard de compassion.\\nJe recueillerai tes larmes.\\nSi je te vois t'\u00e9vanouir, je te soutiendrai de mes bras.\\nAvec un effort surhumain,\\n- tu te d\u00e9taches du s\u00e9pulcre et\\n- tu entreprends de retourner \u00e0 J\u00e9rusalem\\npar le m\u00eame chemin que tu as suivi pour venir.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P045\",\"n\":45,\"t\":\"Tu as fait \u00e0 peine quelques pas et la Croix se pr\u00e9sente \u00e0 toi, la Croix sur laquelle J\u00e9sus a tant souffert et est mort.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P046\",\"n\":46,\"t\":\"Tu cours et tu l'embrasses. Tu vois la Croix teint\u00e9e de Sang. Alors, les Douleurs que J\u00e9sus a souffertes sur elle se renouvellent une \u00e0 une dans ton C\u0153ur. Tu ne peux plus contenir tant d'angoisse.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P047\",\"n\":47,\"t\":\"Tu t'exclames d\u00e9sol\u00e9e : \u00ab \u00d4 Croix, pourquoi as-tu \u00e9t\u00e9 si cruelle envers mon Fils ? Oh ! tu ne L'as \u00e9pargn\u00e9 en rien ! Tu as \u00e9t\u00e9 inflexible !\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P048\",\"n\":48,\"t\":\"Tu ne m'as pas permis, \u00e0 moi, sa M\u00e8re souffrante,\\n- de Lui donner ne serait-ce qu'une gorg\u00e9e d'eau quand Il la demandait,\\nalors qu'\u00e0 sa Bouche dess\u00e9ch\u00e9e on donna du fiel et du vinaigre !\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P049\",\"n\":49,\"t\":\"Ah ! je sentais fondre mon C\u0153ur transperc\u00e9 et j'aurais voulu appr\u00eater pour ses L\u00e8vres mon C\u0153ur liqu\u00e9fi\u00e9 pour Le d\u00e9salt\u00e9rer ! \u00d4 Croix \u00e0 la fois cruelle et sainte, Tu as \u00e9t\u00e9 sanctifi\u00e9e et divinis\u00e9e au contact de mon Fils ! Cette cruaut\u00e9 dont tu as fait usage envers Lui, change-la en compassion pour les mis\u00e9rables mortels.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P050\",\"n\":50,\"t\":\"En raison des Peines qu'Il a souffertes sur toi, obtiens par ses Pri\u00e8res et ses Souffrances la force pour les \u00e2mes souffrantes. Qu'aucune d'entre elles ne se perde \u00e0 cause des tribulations et des croix.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P051\",\"n\":51,\"t\":\"Elles me co\u00fbtent trop, les \u00e2mes, elles me co\u00fbtent la Vie d'un Fils Dieu. Et moi, comme Cor\u00e9demptrice et M\u00e8re, je les lie \u00e0 toi, \u00f4 Croix. Et c'est en te donnant des baisers que je pars. \u00bb\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P052\",\"n\":52,\"t\":\"Pauvre Maman, comme je compatis avec toi ! \u00c0 chaque pas, tu souffres de nouvelles douleurs qui, rendant plus amers les flots qui t'inondent, te noient. Tu te sens mourir !\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P053\",\"n\":53,\"t\":\"Et tu parviens \u00e0 cet endroit o\u00f9 tu rencontras J\u00e9sus sous le poids \u00e9norme de la Croix, ext\u00e9nu\u00e9, ruisselant de Sang, avec un faisceau d'\u00e9pines sur la T\u00eate, lesquelles, heurtant la Croix, p\u00e9n\u00e9traient en dedans, Lui donnant des douleurs extr\u00eames.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P054\",\"n\":54,\"t\":\"Alors, rencontrant les tiens, les Regards de J\u00e9sus cherchaient de la piti\u00e9.\\nMais, pour Vous priver tous les deux de tout soulagement,\\nles soldats\\n- bouscul\u00e8rent J\u00e9sus,\\n- Le firent tomber, Lui faisant verser du Sang nouveau.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P055\",\"n\":55,\"t\":\"Tu vois le terrain encore impr\u00e9gn\u00e9 de son Sang Tu te prosternes \u00e0 terre et tu baises ce Sang et je t'entends dire :\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P056\",\"n\":56,\"t\":\"\u00ab Mes anges, venez vous mettre de garde aupr\u00e8s de ce Sang, afin que pas une goutte ne soit foul\u00e9e aux pieds et profan\u00e9e. \u00bb\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P057\",\"n\":57,\"t\":\"Maman souffrante, laisse-moi te donner la main pour t'aider \u00e0 te relever,\\ncar je te vois agoniser sur le Sang de ton Fils.\\nPendant que tu marches,\\n- partout tu trouves des traces du Sang de J\u00e9sus et\\n- tu te souviens de ses Douleurs.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P058\",\"n\":58,\"t\":\"Finalement, h\u00e2tant le pas, tu t'enfermes au C\u00e9nacle.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P059\",\"n\":59,\"t\":\"Moi aussi je m'enferme au C\u00e9nacle. Mais mon C\u00e9nacle est le C\u0153ur infiniment saint de J\u00e9sus. Et de l'int\u00e9rieur de son C\u0153ur, je veux venir sur tes Genoux en cette heure de d\u00e9solation si am\u00e8re. Mon \u00e2me ne supporte pas de Te laisser seule dans une si grande douleur !\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P060\",\"n\":60,\"t\":\"Maman d\u00e9sol\u00e9e,\\nregarde, moi aussi je suis ton enfant et seule je ne peux, ni ne veux vivre.\\nPrends-moi sur tes genoux et presse-moi dans tes bras maternels.\\nSers-moi de Maman, j'ai besoin d'un guide, d'aide, de soutien.\\nRegarde ma pauvret\u00e9.\\nSur mes plaies, verse une de tes larmes, et quand tu me verras distraite, serre-moi sur ton C\u0153ur maternel et rafra\u00eechis en moi la Vie de J\u00e9sus.\\nM\u00e8re d\u00e9sol\u00e9e, comme je compatis avec toi !\\nTes Douleurs sont effroyables !\\nJe voudrais changer mon \u00eatre en langue et en voix\\n- pour te dire ma compassion.\\nMais, pour tes nombreuses Douleurs, mes commis\u00e9rations sont un n\u00e9ant.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P061\",\"n\":61,\"t\":\"Par cons\u00e9quent, j'appelle les anges et j'invoque la Tr\u00e8s Sainte Trinit\u00e9.\\nJe les implore de mettre autour de toi\\n- leurs harmonies, leurs joies, leur beaut\u00e9,\\npour calmer tes Douleurs intenses et compatir avec toi.\\nQue les trois Personnes Te prennent dans leurs Bras divins et\\nchangent en Amour toutes tes Peines.\\nEt maintenant, \u00f4 M\u00e8re d\u00e9sol\u00e9e, en raison de tout ce que tu as souffert,\\nje Te demande une gr\u00e2ce toute sp\u00e9ciale.\\nJe Te prie, en raison de ta d\u00e9solation am\u00e8re,\\nde venir m'assister au moment de ma mort,\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P062\",\"n\":62,\"t\":\"- quand ma pauvre \u00e2me se trouvera seule, abandonn\u00e9e de tous,\\nparmi mille anxi\u00e9t\u00e9s et mille craintes.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P063\",\"n\":63,\"t\":\"Viens en ce moment pour me tenir compagnie,\\n- comme tant de fois je t'ai tenue compagnie durant ma vie.\\nViens m'assister, assieds-toi \u00e0 mes c\u00f4t\u00e9s et mets l'ennemi en fuite.\\n- Lave mon \u00e2me au moyen de tes larmes,\\n- couvre-moi du Sang de J\u00e9sus,\\n- fais-moi rev\u00eatir ses M\u00e9rites.\\nEmbellis-moi de ses Peines et de ses \u0152uvres.\\nEt en vertu des Peines de J\u00e9sus et des Tiennes,\\n- fais que tous mes p\u00e9ch\u00e9s soient effac\u00e9s par un pardon total.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P064\",\"n\":64,\"t\":\"Quand mon \u00e2me quittera mon corps,\\n- re\u00e7ois-moi dans tes Bras,\\n- mets-moi sous ton Manteau,\\n- cache-moi du regard de l'ennemi.\\nDe ton vol, porte-moi au Ciel et mets-moi dans les Bras de J\u00e9sus.\\nQu'il en soit ainsi, ma ch\u00e8re Maman !\\nJe te prie aussi de rendre la compagnie que je t'ai tenue aujourd'hui\\n\u00e0 tous les moribonds. Pour tous, sers de M\u00e8re.\\nIls sont dans des moments extr\u00eames o\u00f9 ils ont besoin de grands secours.\\nPar cons\u00e9quent, ne refuse \u00e0 personne ton office maternel.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P065\",\"n\":65,\"t\":\"Un dernier mot en te laissant, \u00f4 douce Maman. Je te prie de m'enfermer dans le C\u0153ur infiniment saint de J\u00e9sus. Et pendant que je baise ta Main maternelle, b\u00e9nis-moi. Ainsi soit-il.\"},{\"id\":\"PASSION24.HOUR.24.DESOL.P066\",\"n\":66,\"t\":\"Nos cum prole pia, benedicat Virgo Maria.\"}]}]}],\"prayers\":[{\"prayer_id\":\"PASSION24.PRAYER.BEFORE_EACH_HOUR\",\"title\":\"Pri\u00e8re avant chaque Heure\",\"prayer_type\":\"before_hour\",\"paragraphs\":[{\"id\":\"PASSION24.PRAYER.BEFORE_EACH_HOUR.P001\",\"t\":\"\u00d4 mon Seigneur J\u00e9sus-Christ, prostern\u00e9 devant Toi,\\nje supplie ton C\u0153ur infiniment amoureux de bien vouloir m'admettre\\n- \u00e0 la m\u00e9ditation des Heures douloureuses de ta Passion\\ndurant lesquelles, par Amour pour nous,\\nTu voulus souffrir dans ton Corps adorable et dans ton \u00c2me infiniment sainte,\\njusqu'\u00e0 mourir sur la Croix.\"},{\"id\":\"PASSION24.PRAYER.BEFORE_EACH_HOUR.P002\",\"t\":\"Daigne me donner\\n- ton Aide, ta Gr\u00e2ce, ton Amour,\\n- ainsi qu'une profonde compassion \u00e0 ton endroit et\\n- une profonde compr\u00e9hension de tes Souffrances,\\npendant que je m\u00e9diterai sur la ... (pr\u00e9ciser) Heure.\"},{\"id\":\"PASSION24.PRAYER.BEFORE_EACH_HOUR.P003\",\"t\":\"Et pour les Heures sur lesquelles je ne pourrai pas m\u00e9diter,\\nc'est-\u00e0-dire celles pendant lesquelles je serai contraint\\n- soit de m'appliquer \u00e0 mes devoirs journaliers,\\n- soit de m'adonner au sommeil,\\nje veux T'offrir la volont\u00e9 que j'ai de m\u00e9diter aussi sur elles.\"},{\"id\":\"PASSION24.PRAYER.BEFORE_EACH_HOUR.P004\",\"t\":\"Accepte alors, \u00f4 Seigneur mis\u00e9ricordieux, mon intention d'amour. Et fais en sorte que ces Heures me profitent et profitent \u00e0 beaucoup d'autres comme si je les faisais effectivement et saintement.\"},{\"id\":\"PASSION24.PRAYER.BEFORE_EACH_HOUR.P005\",\"t\":\"Entre temps, je Te rends gr\u00e2ce \u00f4 J\u00e9sus,\\n- Toi qui m'appelles \u00e0 m'unir \u00e0 Toi dans la pri\u00e8re,\\net je me plonge dans tes Pens\u00e9es, tes Paroles, ta Volont\u00e9 et ton Amour,\\n- en implorant l'aide de ta Tr\u00e8s Sainte M\u00e8re et de mon ange gardien.\"},{\"id\":\"PASSION24.PRAYER.BEFORE_EACH_HOUR.P006\",\"t\":\"R\u00e9citer :\"},{\"id\":\"PASSION24.PRAYER.BEFORE_EACH_HOUR.P007\",\"t\":\"un \u2018Je vous salue Marie\u2019 \u00e0 la Tr\u00e8s Sainte Vierge,\\nun \u2018Gloire au P\u00e8re\u2019 \u00e0 son ange gardien,\\nun \u2018De profundis\u2019 (Ps 129) pour les \u00e2mes du Purgatoire,\\n- auxquelles il ne faut pas manquer d'appliquer les indulgences\\nqui seront gagn\u00e9es par la m\u00e9ditation du Myst\u00e8re.\"}]},{\"prayer_id\":\"PASSION24.PRAYER.AFTER_EACH_HOUR\",\"title\":\"Pri\u00e8re \u00e0 la fin de chaque Heure\",\"prayer_type\":\"after_hour\",\"paragraphs\":[{\"id\":\"PASSION24.PRAYER.AFTER_EACH_HOUR.P001\",\"t\":\"Mon aimable J\u00e9sus,\\nTu m'as appel\u00e9 durant cette Heure de ta Passion \u00e0 Te tenir compagnie,\\net je suis venu.\\nIl m'a sembl\u00e9 Te voir prier, r\u00e9parer et souffrir,\\n- et avec les Paroles les plus tendres, plaider pour le salut des \u00e2mes.\"},{\"id\":\"PASSION24.PRAYER.AFTER_EACH_HOUR.P002\",\"t\":\"J'ai cherch\u00e9 \u00e0 Te suivre en tout. Avant de Te laisser, je veux Te dire un \u00ab merci \u00bb et un \u00ab sois b\u00e9ni \u00bb.\"},{\"id\":\"PASSION24.PRAYER.AFTER_EACH_HOUR.P003\",\"t\":\"Oui, \u00f4 J\u00e9sus, merci mille fois. Je Te loue et Te b\u00e9nis pour tout ce que Tu as fait et souffert pour nous tous.\"},{\"id\":\"PASSION24.PRAYER.AFTER_EACH_HOUR.P004\",\"t\":\"Je Te dis merci et je Te b\u00e9nis\\n- pour chaque goutte de ton Sang et chacune de tes Larmes vers\u00e9es,\\n- pour chacune de tes Respirations,\\n- pour chaque Battement de ton C\u0153ur,\\n- pour chacun de tes Pas, de tes Paroles et de tes Regards, et\\n- pour chaque offense que Tu as support\u00e9e pour nous.\"},{\"id\":\"PASSION24.PRAYER.AFTER_EACH_HOUR.P005\",\"t\":\"De gr\u00e2ce, fais en sorte, \u00f4 mon J\u00e9sus, que tout mon \u00eatre T'envoie un flot continu de remerciements et de b\u00e9n\u00e9dictions,\"},{\"id\":\"PASSION24.PRAYER.AFTER_EACH_HOUR.P006\",\"t\":\"de sorte que cela attire sur moi et sur toutes les cr\u00e9atures les flots de tes Gr\u00e2ces et de tes B\u00e9n\u00e9dictions.\"},{\"id\":\"PASSION24.PRAYER.AFTER_EACH_HOUR.P007\",\"t\":\"\u00d4 J\u00e9sus,\\nserre-moi sur ton C\u0153ur avec tes Mains infiniment saintes :\\nmarque toutes les parcelles de mon \u00eatre de ton \u00ab Je te b\u00e9nis \u00bb,\\nde sorte que rien ne sorte de moi\\n- sauf un hymne d'amour ininterrompu pour Toi !\"},{\"id\":\"PASSION24.PRAYER.AFTER_EACH_HOUR.P008\",\"t\":\"Je m'abandonne \u00e0 Toi et je veux Te suivre en tout.\"},{\"id\":\"PASSION24.PRAYER.AFTER_EACH_HOUR.P009\",\"t\":\"Je laisse\\nmes pens\u00e9es en Toi pour qu'elles Te d\u00e9fendent de tes ennemis,\\nmes respirations pour qu'elles Te servent de cort\u00e8ge et Te tiennent compagnie,\\nles battements de mon c\u0153ur\\n- pour Te dire sans cesse \u00ab je T'aime \u00bb et\\n- pour Te d\u00e9dommager de l'amour que ne Te donnent pas les autres\\ncr\u00e9atures ;\\nles gouttes de mon sang\\n- en offrande de r\u00e9paration et\\n- pour Te restituer les honneurs et l'estime dont Te privent tes ennemis,\\nfinalement tout mon \u00eatre pour Te garder.\"},{\"id\":\"PASSION24.PRAYER.AFTER_EACH_HOUR.P010\",\"t\":\"Mon doux Amour, bien que je doive m\u2019occuper de mes t\u00e2ches journali\u00e8res, je reste dans ton C\u0153ur et je crains d'en sortir. Tu me garderas en Toi, n'est-ce pas ?\"},{\"id\":\"PASSION24.PRAYER.AFTER_EACH_HOUR.P011\",\"t\":\"Nos battements de c
