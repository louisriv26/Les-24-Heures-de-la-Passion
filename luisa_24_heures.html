e, Tu Te crées Toi-même sous forme sacramentelle dans ce pain et ce vin.\"}, {\"id\": \"PASSION24.HOUR.04.P033\", \"n\": 33, \"t\": \"Et puis, après T'être communié, Tu communies tes apôtres et ta céleste Maman, qui ne pouvait pas rester sans Te recevoir. Ô Jésus, les Cieux s'inclinent. Tous Te font un acte d'adoration dans ton nouvel état d'annihilation.\"}, {\"id\": \"PASSION24.HOUR.04.P034\", \"n\": 34, \"t\": \"Doux Jésus, ton Amour est content et satisfait. Je vois sur cet autel, dans tes Mains, toutes les Hosties consacrées qui se perpétueront jusqu'à la fin des siècles.\"}, {\"id\": \"PASSION24.HOUR.04.P035\", \"n\": 35, \"t\": \"Mais dans tant et tant d'Hosties, ta douloureuse Passion est déployée.\\nCar beaucoup de créatures répondront aux excès de ton Amour par\\n- des excès d'ingratitude et\\n- d'énormes délits !\"}, {\"id\": \"PASSION24.HOUR.04.P036\", \"n\": 36, \"t\": \"Et moi je veux me trouver toujours avec Toi,\\n- dans chaque tabernacle,\\n- dans chaque ciboire et\\n- dans chaque Hostie consacrée qui existera jusqu'à la fin du monde,\\npour T'offrir\\n- mes actes d'amour et\\n- mes actes de réparation pour les offenses que Tu recevras.\\nMon Jésus, je Te contemple dans la sainte Hostie.\"}, {\"id\": \"PASSION24.HOUR.04.P037\", \"n\": 37, \"t\": \"Comme si j'y voyais ton adorable Personne, je donne un baiser à ton Front majestueux. En Te donnant ce baiser, je sens les élancements des épines.\"}, {\"id\": \"PASSION24.HOUR.04.P038\", \"n\": 38, \"t\": \"Mon Jésus, dans cette Hostie sainte, combien de créatures ne T'épargnent pas\"}, {\"id\": \"PASSION24.HOUR.04.P039\", \"n\": 39, \"t\": \"les épines.\\nElles se rendent devant Toi :\\n- au lieu de Te donner l'hommage de leurs bonnes pensées,\\n- elles Te donnent leurs pensées mauvaises.\"}, {\"id\": \"PASSION24.HOUR.04.P040\", \"n\": 40, \"t\": \"Toi, de nouveau,\\n- Tu baisses la tête comme durant ta Passion et\\n- Tu reçois et tolères les épines de ces pensées mauvaises.\"}, {\"id\": \"PASSION24.HOUR.04.P041\", \"n\": 41, \"t\": \"Mon Amour, je m'approche de Toi, pour partager tes Peines.\\n- Je mets toutes mes pensées dans ton Intelligence\\n- pour repousser ces épines qui t'attristent tant.\"}, {\"id\": \"PASSION24.HOUR.04.P042\", \"n\": 42, \"t\": \"Que chacune de mes pensées défile dans chacune des Tiennes\\n- pour Te faire réparation pour chaque pensée mauvaise, et\\n- ainsi consoler ton Intelligence affligée.\\nJésus, mon Bien, je donne un baiser à tes beaux Yeux.\\nJe vois ton Regard amoureux tourné vers ceux qui vont à ta sainte Présence.\\nTon Regard est anxieux de recevoir leur regard d'amour.\"}, {\"id\": \"PASSION24.HOUR.04.P043\", \"n\": 43, \"t\": \"Mais combien viennent devant Toi.\\n- au lieu de Te regarder et de Te chercher,\\n- ils regardent des choses qui les distraient et ainsi\\n- ils Te privent du plaisir que Tu éprouves dans l'échange de regards d'amour !\"}, {\"id\": \"PASSION24.HOUR.04.P044\", \"n\": 44, \"t\": \"Toi, Tu souffres, et moi, en Te donnant des baisers, je sens mes lèvres baignées de tes Larmes.\"}, {\"id\": \"PASSION24.HOUR.04.P045\", \"n\": 45, \"t\": \"Mon Jésus, ne pleure pas. Je veux mettre mes yeux dans les Tiens\\npour partager tes Peines et pleurer avec Toi.\\nPour réparer les regards distraits des créatures,\\nje garde mon regard toujours fixé sur Toi.\\nJésus, mon Amour, je donne un baiser à tes Oreilles infiniment saintes.\\nJe Te vois attentif à écouter ce que veulent de Toi les créatures,\\nafin de les consoler.\\nMais celles-ci font parvenir à tes Oreilles\\n- des prières mal récitées, remplies de méfiance,\\n- des prières faites par habitude.\\nEt ton Ouïe, dans cette Hostie sainte,\\nest importunée plus que durant ta Passion même.\"}, {\"id\": \"PASSION24.HOUR.04.P046\", \"n\": 46, \"t\": \"Mon Jésus, Je veux prendre toutes les Harmonies du Ciel et les diriger vers tes Oreilles pour réparer.\"}, {\"id\": \"PASSION24.HOUR.04.P047\", \"n\": 47, \"t\": \"Je veux mettre mes oreilles dans les Tiennes,\\n- non seulement pour partager tes Peines,\\n- mais pour T'offrir mon acte continu de réparation et Te consoler.\\nJésus, ma Vie, je donne un baiser à ton Visage infiniment saint.\"}, {\"id\": \"PASSION24.HOUR.04.P048\", \"n\": 48, \"t\": \"Je le vois ensanglanté, livide et gonflé. Des créatures, ô Jésus, viennent devant cette sainte Hostie. Par leurs positions indécentes et leurs conversations mauvaises, il semble qu'elles Te giflent et Te crachent dessus au lieu de Te faire honneur.\"}, {\"id\": \"PASSION24.HOUR.04.P049\", \"n\": 49, \"t\": \"Et Toi, c'est en toute Paix et avec Patience\\nque Tu les reçois et que Tu supportes tout, comme durant ta Passion !\\nJésus,\\nje veux mettre mon visage près du Tien,\\nnon seulement\\n- pour Te donner des baisers et\\n- pour recevoir avec Toi les insultes qui Te viennent des créatures,\\nmais pour partager toutes tes Peines.\"}, {\"id\": \"PASSION24.HOUR.04.P050\", \"n\": 50, \"t\": \"De mes mains, je veux\\n- Te caresser,\\n- T'enlever les crachats et\\n- Te presser sur mon cœur.\\nJe veux faire de tout mon être de nombreux, extrêmement petits morceaux, et\\nje veux les mettre devant Toi comme autant d'âmes qui T'adorent.\"}, {\"id\": \"PASSION24.HOUR.04.P051\", \"n\": 51, \"t\": \"Je veux que tous mes mouvements soient changés en prostrations pour réparer les déshonneurs qui Te viennent des créatures. Mon Jésus, je donne un baiser à ta Bouche infiniment sainte. Je vois que lorsque Tu descends dans le cœur des créatures sous la forme sacramentelle, Tu es obligé de Te poser sur beaucoup de langues mordantes, impures, mauvaises.\"}, {\"id\": \"PASSION24.HOUR.04.P052\", \"n\": 52, \"t\": \"Oh ! comme Tu en es attristé ! Tu Te sens comme intoxiqué par ces langues. C'est encore pire quand Tu descends dans leurs cœurs !\"}, {\"id\": \"PASSION24.HOUR.04.P053\", \"n\": 53, \"t\": \"Jésus, si c'était possible, je voudrais me retrouver dans la bouche de chaque créature, pour changer en louanges toutes les offenses que Tu reçois d'elles de cette manière ! Mon Bien, Tu baises ta Tête infiniment sainte. Je la vois fatiguée, épuisée et toute occupée à tes Activités d'Amour.\"}, {\"id\": \"PASSION24.HOUR.04.P054\", \"n\": 54, \"t\": \"Dis-moi, que fais-Tu ?\"}, {\"id\": \"PASSION24.HOUR.04.P055\", \"n\": 55, \"t\": \"Et Tu me réponds : « Mon enfant, dans cette Hostie, Je travaille du matin au soir, fabriquant des chaînes d'Amour. Quand les âmes viennent chez Moi, Je les enchaîne à mon Cœur.\"}, {\"id\": \"PASSION24.HOUR.04.P056\", \"n\": 56, \"t\": \"Mais sais-tu ce que plusieurs Me font ? Beaucoup, à coups d'efforts, se dégagent et mettent mes chaînes d'Amour en pieces. Comme ces chaînes sont liées à mon Cœur, J'en suis torturé et Je tombe dans le délire.\"}, {\"id\": \"PASSION24.HOUR.04.P057\", \"n\": 57, \"t\": \"De plus, quand elles brisent mes chaînes, ces âmes réduisent mon intense activité à rien. Car elles recherchent les chaînes des créatures. Elles le font même en ma Présence, se servant de Moi pour parvenir à leurs fins.\"}, {\"id\": \"PASSION24.HOUR.04.P058\", \"n\": 58, \"t\": \"Cela M'attriste tant que ça Me donne une fièvre violente qui Me fait\\nM'évanouir et délirer. »\\nComme je Te plains, Jésus ! Ton Amour est mis au pilori !\\nMoi, pour Te dédommager, je Te prie\\n- d'enchaîner mon cœur avec ces chaînes brisées par les créatures,\\n- pour pouvoir Te donner à leur place un retour d'amour.\\nMon Jésus, mon divin Archer, je donne un baiser à ta Poitrine.\\nLe Feu qu'elle contient est si grand que\\n- pour donner un peu d'épanchements à tes Flammes et\\n- pour Te donner un peu de répit dans ton Travail,\\nTu Te mets à jouer avec les âmes qui viennent à Toi,\\nleur décochant des flèches d'Amour qui sortent de ta Poitrine.\"}, {\"id\": \"PASSION24.HOUR.04.P059\", \"n\": 59, \"t\": \"Ton jeu consiste à fabriquer des flèches, des dards, des traits. Quand ils frappent les âmes, Tu jubiles.\"}, {\"id\": \"PASSION24.HOUR.04.P060\", \"n\": 60, \"t\": \"Mais beaucoup, ô Jésus, les repoussent et T'envoient en échange\\n- des flèches de froideur,\\n- des dards de tiédeur et\\n- des traits d'ingratitude.\\nEt Tu en es tellement affligé que Tu pleures amèrement !\"}, {\"id\": \"PASSION24.HOUR.04.P061\", \"n\": 61, \"t\": \"Ô Jésus, voici ma poitrine prête à recevoir\\n- non seulement les flèches qui me sont destinées,\\nmais encore celles que repoussent les autres âmes.\"}, {\"id\": \"PASSION24.HOUR.04.P062\", \"n\": 62, \"t\": \"Ainsi Tu ne seras plus vaincu dans ton jeu d'Amour.\"}, {\"id\": \"PASSION24.HOUR.04.P063\", \"n\": 63, \"t\": \"Et ainsi, je réparerai les froideurs, les tiédeurs et les ingratitudes\\nque Tu reçois de ces âmes.\\nJésus, je donne un baiser à ta Main gauche.\\nJe veux ainsi réparer\\n- pour tous les coups illicites ou\\n- blâmables donnés à ta sainte Présence.\"}, {\"id\": \"PASSION24.HOUR.04.P064\", \"n\": 64, \"t\": \"Je Te prie de me tenir toujours serré sur ton Cœur !\\nGloire au Père, ...\\nÔ Jésus, je baise ta Main droite.\\nJe veux par là\\n- réparer tous les sacrilèges, surtout les messes mal célébrées !\\nCombien de fois, mon Amour, es-Tu contraint de descendre du Ciel\\n- entre des mains et dans des poitrines indignes.\\nBien que Tu en aies la nausée, l'Amour Te contraint d'y rester.\"}, {\"id\": \"PASSION24.HOUR.04.P065\", \"n\": 65, \"t\": \"Il y a même certains de tes ministres qui,\\n- par leurs énormes délits et sacrilèges,\\n- renouvellent ta Passion,\\n- renouvellent le déicide !\\nJésus, cela m'épouvante, rien que d'y penser !\"}, {\"id\": \"PASSION24.HOUR.04.P066\", \"n\": 66, \"t\": \"Tout comme durant ta Passion Tu étais entre les mains des Juifs déicides, Tu es entre ces mains indignes, Toi, l'Agnelet paisible, attendant de nouveau la mort. Mais Tu attends aussi leur conversion. Jésus, combien Tu souffres ! Tu voudrais bien une main pleine d'amour pour Te libérer de ces mains sanguinaires.\"}, {\"id\": \"PASSION24.HOUR.04.P067\", \"n\": 67, \"t\": \"Jésus, quand Tu Te trouveras dans de telles mains,\\n- je Te prie de m'appeler près de Toi et pour réparer\\n- je Te couvrirai de la pureté des anges,\\n- je Te parfumerai de tes Vertus\\npour calmer la nausée que Tu éprouves dans ces mains,\\n- et je T'offrirai mon cœur comme abri et refuge.\"}, {\"id\": \"PASSION24.HOUR.04.P068\", \"n\": 68, \"t\": \"Tandis que Tu seras en moi,\\n- je Te prierai pour les prêtres,\\n- afin que tous soient tes dignes ministres.\\nAmen. Gloire au Père, ...\\nJésus, je donne un baiser à ton Pied gauche.\\nJe veux ainsi réparer pour ceux\"}, {\"id\": \"PASSION24.HOUR.04.P069\", \"n\": 69, \"t\": \"- qui Te reçoivent par habitude et\\n- sans les dispositions requises.\\nGloire au Père, ...\\nÔ Jésus, je donne un baiser à ton Pied droit.\\nCe faisant, je veux réparer pour ceux qui Te reçoivent en T'outrageant.\"}, {\"id\": \"PASSION24.HOUR.04.P070\", \"n\": 70, \"t\": \"De grâce, je T'en prie,\\n- quand ils oseront faire cela,\\n- renouvelle le miracle que Tu fis pour Longin.\"}, {\"id\": \"PASSION24.HOUR.04.P071\", \"n\": 71, \"t\": \"Tu l'as guéri et l'as converti au toucher du Sang qui jaillit de ton Cœur,\\ntranspercé par sa lance,\\nAinsi, à ton toucher sacramentel, convertis\\n- les offenses en actes d'amour et\\n- les offenseurs en personnes repentantes !\\nGloire au Père, ...\\nÔ Jésus, je donne un baiser ton Cœur infiniment doux\\ndans lequel se déversent tant d'offenses.\"}, {\"id\": \"PASSION24.HOUR.04.P072\", \"n\": 72, \"t\": \"Par mon geste, je veux tout réparer, Te donner de l'amour pour tous, et partager toutes tes Peines. Gloire au Père, ... Archer céleste, si quelque offense échappe à ma réparation, je Te prie de m'emprisonner dans ton Cœur et dans ta Volonté, afin que je répare tout.\"}, {\"id\": \"PASSION24.HOUR.04.P073\", \"n\": 73, \"t\": \"Je prierai ta douce Maman\\n- de me garder toujours avec elle,\\n- afin que je répare tout pour tous.\\nNous T'embrasserons ensemble.\\nEn T'embrassant, nous éloignerons de Toi les vagues d'amertume\\nque Tu reçois des créatures.\"}, {\"id\": \"PASSION24.HOUR.04.P074\", \"n\": 74, \"t\": \"Jésus, rappelle-Toi que moi aussi je suis une pauvre âme pécheresse. De grâce renferme-moi dans ton Cœur.\"}, {\"id\": \"PASSION24.HOUR.04.P075\", \"n\": 75, \"t\": \"Par tes chaînes d'Amour\\n- emprisonne-moi et\\n- attache une à une mes pensées, mes affections et mes désirs.\\n- Enchaîne mes mains et mes pieds à ton Cœur,\\nafin que je n'aie d'autres mains et d'autres pieds que les Tiens !\"}, {\"id\": \"PASSION24.HOUR.04.P076\", \"n\": 76, \"t\": \"Mon Amour,\\n- mon cachot sera ton Cœur,\\n- mes chaînes seront formées de ton Amour,\\n- tes Flammes seront ma nourriture,\\n- ton Souffle sera le mien,\\n- les grilles qui m'empêchent de sortir seront ta Volonté infiniment sainte\"}, {\"id\": \"PASSION24.HOUR.04.P077\", \"n\": 77, \"t\": \"Et ainsi :\\n- je ne verrai que des Flammes,\\n- je ne toucherai que du Feu, qui, tandis qu'il me donnera la Vie,\\nme donnera aussi la mort comme celle que Tu subis dans la sainte Hostie.\"}, {\"id\": \"PASSION24.HOUR.04.P078\", \"n\": 78, \"t\": \"Je Te donnerai ma vie, et ainsi,\\n- tandis que je serai prisonnière en Toi,\\n- Toi, tu seras prisonnier en moi.\"}, {\"id\": \"PASSION24.HOUR.04.P079\", \"n\": 79, \"t\": \"Ceci n'est-il pas ton dessein dans ton incarcération dans l'Hostie, où Tu veux être remis en liberté par les âmes qui Te reçoivent, retrouvant la Vie en elles ?\"}, {\"id\": \"PASSION24.HOUR.04.P080\", \"n\": 80, \"t\": \"Et maintenant, bénis-moi et donne le Baiser mystique d'Amour à mon âme, tandis que moi je reste serrée contre Toi en T'embrassant. Gloire au Père, ... Mon doux Cœur, en instituant l'infiniment Saint Sacrement, Tu as entrevu les énormes ingratitudes et offenses des créatures. Mais Tu n'as pourtant pas reculé.\"}, {\"id\": \"PASSION24.HOUR.04.P081\", \"n\": 81, \"t\": \"Blessé et attristé, Tu veux tout noyer dans l'immensité de ton Amour. Tu instruis tes apôtres et Tu précises que ce que Tu viens de faire, ils doivent le faire eux aussi. Ainsi Tu leur donnes le pouvoir de consacrer. Tu leur confères le sacerdoce.\"}, {\"id\": \"PASSION24.HOUR.04.P082\", \"n\": 82, \"t\": \"Ô Jésus, Tu penses à tous et Tu répares pour tous et pour tout. La Cène est terminée. Tu prends avec Toi les apôtres. Tu T'achemines vers le Jardin de Gethsémani. Là ta douloureuse Passion va commencer. Je Te suivrai en toutes choses, mon Jésus, pour Te tenir fidèle compagnie. Triste, Tu avances vers le Jardin.\"}, {\"id\": \"PASSION24.HOUR.04.P083\", \"n\": 83, \"t\": \"Entretemps\\n- je veux réparer pour ces âmes\\nqui sont dissipées et distraites quand elles quittent l'église.\"}, {\"id\": \"PASSION24.HOUR.04.P084\", \"n\": 84, \"t\": \"- je Te prie de donner Lumière et Grâces à ces âmes qui,\\npendant qu'elles pratiquent les choses saintes,\\nn'en reçoivent aucun profit.\"}], \"reflections\": [{\"id\": \"PASSION24.HOUR.04.REF.P001\", \"t\": \"Jésus est caché dans l'Hostie. Il embrasse tous les siècles. Il donne Vie et Lumière à tous.\"}, {\"id\": \"PASSION24.HOUR.04.REF.P002\", \"t\": \"Ainsi, en nous cachant en Jésus,\\nnous donnerons par nos prières et nos réparations Vie et Lumière\\n- à tous, - même aux hérétiques et aux infidèles.\\nCar Jésus n'exclut personne.\\nPour nous rendre semblables à Jésus, nous devons tout cacher en Lui.\\n- nos pensées, nos regards, nos paroles,\\n- nos émotions, nos affections, nos désirs,\\n- nos pas et nos œuvres.\\n- nos prières également.\\nDans son Eucharistie, Jésus embrasse tous les siècles.\\nDe même nous embrasserons tous les siècles avec Lui.\\nSerrés contre Lui, nous serons\\n- la pensée de toute intelligence, la parole de toute langue,\\n- le désir de tout cœur, les pas de tout pied, l'œuvre de tout bras.\"}, {\"id\": \"PASSION24.HOUR.04.REF.P003\", \"t\": \"Ce faisant,\\n- nous détournerons du Cœur de Jésus le mal\\nque les créatures veulent Lui faire,\\n- nous Le presserons de donner le Salut, la Sainteté et l’Amour\\nà toutes les âmes.\\nNotre vie doit être en parfaite conformité avec la Vie de Jésus.\\nNotre âme doit se tenir (par l'intention) dans tous les tabernacles du monde\\n- pour tenir compagnie à Jésus et\\n- lui donner soulagement et réparation continuels.\\nElle doit faire toutes ses actions dans cette intention.\"}, {\"id\": \"PASSION24.HOUR.04.REF.P004\", \"t\": \"Le premier tabernacle est en nous, en notre cœur. Il faut donc prêter grande attention à tout ce que le bon Jésus veut faire en nous. Jésus est dans notre Cœur. Bien des fois, Il nous fait ressentir le besoin de prier.\"}, {\"id\": \"PASSION24.HOUR.04.REF.P005\", \"t\": \"C'est Lui qui veut prier.\\nIl nous veut tout proches de Lui.\\nIl s'identifie presque avec notre voix, nos affections et notre cœur\\npour unifier notre prière à la Sienne !\\nPour faire honneur à la Prière de Jésus, soyons attentifs\\nà Lui prêter tout notre être.\\nIl nous faut être attentifs à tous nos mouvements intérieurs,\\nparce que le bon Jésus\\n- tantôt nous fait souffrir, tantôt nous veut en prière,\\n- tantôt nous met dans tel état d'âme, tantôt dans tel autre,\\nafin que toute sa Vie soit répétée en nous.\\nSupposons que Jésus nous met dans l'occasion de faire preuve de patience.\\nIl reçoit de la part des créatures des offenses telles et si nombreuses\\nqu'Il se sent poussé à envoyer des fléaux pour les frapper.\"}, {\"id\": \"PASSION24.HOUR.04.REF.P006\", \"t\": \"Alors Il nous donne l'occasion de faire preuve de patience. Nous devons L'honorer et supporter tout avec paix.\"}, {\"id\": \"PASSION24.HOUR.04.REF.P007\", \"t\": \"Ainsi notre patience évitera les fléaux que les autres créatures provoquent. Car en nous Il trouve sa propre Patience.\"}, {\"id\": \"PASSION24.HOUR.04.REF.P008\", \"t\": \"Comme il en va de la patience, il en va aussi de toutes les autres vertus. Jésus, dans le sacrement d'Amour, pratique toutes les vertus.\"}, {\"id\": \"PASSION24.HOUR.04.REF.P009\", \"t\": \"Et c'est de Jésus (dans la sainte Hostie) que nous puiserons\\n- la force morale, l'indulgence,\\n- la patience, la tolérance,\\n- l'humilité, l'obéissance, etc.\\nLe bon Jésus nous donne sa Chair en nourriture.\\nNous donnons à Jésus (en guise d'aliment pour Lui,)\\nnotre amour, notre volonté,\\nnos désirs, nos pensées, nos affections.\\nAinsi nous rivaliserons d'Amour avec Lui.\"}, {\"id\": \"PASSION24.HOUR.04.REF.P010\", \"t\": \"Ne laissons entrer en nous rien qui ne soit de Lui. (Laissons entrer en nous seulement ce qui vient de Lui.)\"}, {\"id\": \"PASSION24.HOUR.04.REF.P011\", \"t\": \"Ainsi, en tout ce que nous ferons, tout servira d'aliment à notre bien-aimé Jésus. Notre faculté de penser doit alimenter la Pensée divine.\"}, {\"id\": \"PASSION24.HOUR.04.REF.P012\", \"t\": \"Ainsi, si nous pensons saintement, nous alimentons la Pensée divine.\\n- De même, notre regard doit alimenter le Regard divin.\"}, {\"id\": \"PASSION24.HOUR.04.REF.P013\", \"t\": \"- Nos paroles, nos émotions, nos affections, nos désirs, nos pas, nos œuvres,\\ntout doit servir à alimenter Jésus.\"}, {\"id\": \"PASSION24.HOUR.04.REF.P014\", \"t\": \"Si nous alimentons Jésus de cette manière,\\nnous devons avoir l'intention d'alimenter aussi les créatures en Jésus.\\nJésus, ma douce Vie, quand Tu viens en moi, fais en sorte que\\n- mes émotions, mes désirs,\\n- mes affections, mes pensées, mes paroles,\\nsubissent la Puissance de la Consécration sacramentelle,\\nde sorte qu'elles deviennent autant d'Hosties,\\npour Te donner aux âmes.\"}], \"subsections\": []}, {\"hour_id\": \"PASSION24.HOUR.05\", \"hour_number\": 5, \"display_time\": \"21h à 22h\", \"title\": \"Première Heure de l’Agonie dans le Jardin\", \"short_title\": \"Première Heure de l’Agonie dans le Jardin\", \"source_pages\": [69, 70, 71, 72, 73, 74, 75], \"opening_prayer_ids\": [\"PASSION24.PRAYER.BEFORE_EACH_HOUR\", \"PASSION24.PRAYER.HOLY_HOUR_PREPARATION\"], \"closing_prayer_ids\": [\"PASSION24.PRAYER.HOLY_HOUR_THANKSGIVING\"], \"paragraphs\": [{\"id\": \"PASSION24.HOUR.05.P001\", \"n\": 1, \"t\": \"Mon Jésus, attirée par ton Amour, je viens Te tenir compagnie dans le Jardin. Tu appelles mon cœur blessé.\"}, {\"id\": \"PASSION24.HOUR.05.P002\", \"n\": 2, \"t\": \"Moi j'accours en me disant : « D'où vient cette attirance d'Amour que je ressens ? Ah ! peut-être mon Jésus se trouve dans un tel état d'amertume, qu'Il ressent le besoin de ma compagnie ! » Et je vole vers Toi. En entrant dans ce jardin, je tremble d'horreur. Il fait froid et la nuit est obscure.\"}, {\"id\": \"PASSION24.HOUR.05.P003\", \"n\": 3, \"t\": \"Le mouvement des feuilles est comme une voix plaintive. Il m'annonce la peine, la tristesse et la mort de mon Jésus !\"}, {\"id\": \"PASSION24.HOUR.05.P004\", \"n\": 4, \"t\": \"Les étoiles, par leur doux scintillement, sont comme des yeux qui pleurent. Elles me reprochent mes ingratitudes. Elles sont toutes attentives à regarder. Elles font écho aux Larmes de Jésus\"}, {\"id\": \"PASSION24.HOUR.05.P005\", \"n\": 5, \"t\": \"En tremblant et à tâtons, je cherche Jésus. Je L'appelle : « Jésus, où es-Tu ? Tu M'attires à Toi et Tu ne Te laisses pas voir ? Tu m'appelles et Tu Te caches ? Tout est terreur ici. Tout est épouvante et silence profond ! »\"}, {\"id\": \"PASSION24.HOUR.05.P006\", \"n\": 6, \"t\": \"Je tends l'oreille et j'entends un Souffle pénible. C'est Jésus. Je viens de Le trouver. Mais quel changement terrible ! Ce n'est plus le doux Jésus de la Cène Eucharistique dont le Visage resplendissait d'une beauté ravissante.\"}, {\"id\": \"PASSION24.HOUR.05.P007\", \"n\": 7, \"t\": \"C’est un Jésus triste, d'une tristesse si mortelle qu'elle Le défigure ! Il agonise. Et moi, je me sens troublée en pensant que, peut-être, je n'entendrai plus sa Voix ! J'embrasse ses Pieds.\"}, {\"id\": \"PASSION24.HOUR.05.P008\", \"n\": 8, \"t\": \"Puis je me fais plus hardie, je m'approche de ses Bras. Je mets ma main sur son Front pour Le soutenir et, à voix basse, je Lui dis : « Jésus, Jésus ! »\"}, {\"id\": \"PASSION24.HOUR.05.P009\", \"n\": 9, \"t\": \"Et Lui, interpellé par ma voix, me regarde et Il me dit : « Âme, tu es ici ? Ah ! Je t'attendais. Car la tristesse qui M'opprime le plus, c'est l'abandon total par tous !\"}, {\"id\": \"PASSION24.HOUR.05.P010\", \"n\": 10, \"t\": \"Je t'attendais\\n- pour Te rendre spectatrice de mes Peines et\\n- Te faire partager le Calice d'Amertume\\nque sous peu mon Père céleste M'enverra par l'entremise d'un ange.\"}, {\"id\": \"PASSION24.HOUR.05.P011\", \"n\": 11, \"t\": \"Nous le boirons ensemble. Ce ne sera pas un Calice de réconfort, mais d'intense Amertume ! Je ressens le besoin que quelque âme aimante en boive au moins quelques gouttes.\"}, {\"id\": \"PASSION24.HOUR.05.P012\", \"n\": 12, \"t\": \"Par conséquent, Je t'ai appelée\\n- pour que tu partages mes Peines, et\\n- pour M'assurer de ne pas demeurer seul, dans un total abandon ! »\"}, {\"id\": \"PASSION24.HOUR.05.P013\", \"n\": 13, \"t\": \"« Ah ! oui, ô mon Jésus angoissé,\\n- nous boirons ensemble le Calice de tes Peines, et\\n- je ne Te quitterai pas ! »\\nRassuré, Jésus\\n- entre dans une Agonie mortelle et\\n- souffre des Peines intenses, jamais vues auparavant.\\n« Ô mon Jésus, mon Amour, dis-moi pourquoi\\nTu es si triste, si affligé, et seul dans ce jardin et en cette nuit ? »\\nC'est la dernière nuit de ta Vie mortelle !\"}, {\"id\": \"PASSION24.HOUR.05.P014\", \"n\": 14, \"t\": \"Peu d'Heures Te restent avant de commencer ta Passion ! Ici, j'aurais cru trouver la céleste Maman, Marie Madeleine pleine d'amour, les fidèles apôtres.\"}, {\"id\": \"PASSION24.HOUR.05.P015\", \"n\": 15, \"t\": \"Mais je Te trouve seul et en proie à une tristesse\\n- qui est pour Toi plus qu'une mort cruelle, mais\\n- qui ne Te fait pas mourir !\"}, {\"id\": \"PASSION24.HOUR.05.P016\", \"n\": 16, \"t\": \"Ô mon Bien et mon Tout, Tu ne me réponds pas ? Parle-moi.\\nOn dirait que la Tristesse qui T'opprime est si grande\\nqu'elle T'a fait perdre la parole.\\nTon Regard si investigateur et plein de Lumière est triste.\\nOn dirait que Tu cherches de l'aide et du réconfort.\\n- Ton Visage est pâle et tes Lèvres sont desséchées,\\n- ta Personne divine tremble de la tête aux pieds\\n- ton Cœur bat très fort à la recherche d'âmes.\\nIls manifestent une angoisse telle\\n- qu'on dirait que Tu vas expirer d'un moment à l'autre.\"}, {\"id\": \"PASSION24.HOUR.05.P017\", \"n\": 17, \"t\": \"Tout me dit que Tu Te sens très seul et que Tu recherches ma compagnie.\\nMe voici tout près de Toi, Jésus.\\nMon cœur ne supporte pas de Te voir prostré sur le sol.\\nJe Te prends entre mes bras et Te serre fort sur mon cœur.\\nJe veux compter une à une, tes angoisses et les offenses qu'on Te fait,\\nafin de Te donner pour toutes\\n- du soulagement, des réparations, et de la compassion.\\nMon Jésus, ma Vie, je suis ici avec Toi et je Te serre dans mes bras.\\nJe vois que tes Souffrances s'accroissent.\\nJe sens qu’un Feu circule dans tes Veines. Ton Sang bouille dans tes Veines.\\nOn dirait qu'il va les déchirer et en sortir !\"}, {\"id\": \"PASSION24.HOUR.05.P018\", \"n\": 18, \"t\": \"Dis-moi, mon Amour, qu'as-Tu ? Je ne vois pas de fouets, d'épines, de clous, ni de croix.\"}, {\"id\": \"PASSION24.HOUR.05.P019\", \"n\": 19, \"t\": \"J’appuie la tête sur ton Cœur.\\nJe ressens\\n- que des épines cruelles le transpercent,\\n- que des fouets impitoyables n'épargnent aucune parcelle de ta divine\\nPersonne, ni à l'intérieur ni à l'extérieur.\\nJe vois tes Mains raidies et contorsionnées plus que par des clous.\"}, {\"id\": \"PASSION24.HOUR.05.P020\", \"n\": 20, \"t\": \"Mon doux Bien, dis-moi : « Qu'est-ce donc qui a tant de pouvoir, même dans ton for intérieur, qui Te fait subir autant de tourments et de morts ? » Il me semble que le doux Jésus entrouvre ses Lèvres Il me dit d'une Voix éteinte :\"}, {\"id\": \"PASSION24.HOUR.05.P021\", \"n\": 21, \"t\": \"« Fille, tu veux savoir\\n- ce qui Me tourmente plus que les bourreaux mêmes, et\\n- pourquoi les tourments de ceux-ci ne seront rien,\\ncomparés à ce que Je souffre actuellement ?\\nC'est l'Amour. L'Amour éternel veut la suprématie en tout.\"}, {\"id\": \"PASSION24.HOUR.05.P022\", \"n\": 22, \"t\": \"Il Me fait souffrir tout ensemble et dans mes Fibres les plus profondes, ce que les bourreaux Me feront souffrir peu à peu dans ma Personne.\"}, {\"id\": \"PASSION24.HOUR.05.P023\", \"n\": 23, \"t\": \"Âme, c’est l'Amour qui prédomine en Moi. L'Amour est un clou pour Moi, l'Amour est un fouet pour Moi, l'Amour est une couronne d'épines pour Moi, l'Amour est tout pour Moi, l'Amour est ma Passion éternelle, alors que ce que Je souffre dans mon Humanité est temporaire. Mon enfant, entre dans mon Cœur et viens Te perdre dans mon Amour Seulement dans mon Amour tu comprendras combien Je souffre pour toi et combien Je t'aime. Ainsi tu apprendras à M'aimer et à souffrir par amour ! » Mon Jésus, Tu m'appelles dans ton Cœur pour me faire voir ce que l'Amour Te fait souffrir. Alors j'y entre. Mais que vois-je ?\"}, {\"id\": \"PASSION24.HOUR.05.P024\", \"n\": 24, \"t\": \"Je vois les prodiges de l'Amour :\"}, {\"id\": \"PASSION24.HOUR.05.P025\", \"n\": 25, \"t\": \"- ce n'est pas avec des épines naturelles que l'Amour Te couronne la Tête,\\nmais avec des épines de Feu.\\n- ce n'est pas avec des fouets de cordes qu'Il tourmente ton Corps adorable,\\nmais avec des fouets de Feu.\\n- ce n'est pas avec des clous de fer qu'Il Te perce les Mains et les Pieds,\\nmais avec des clous de Feu.\"}, {\"id\": \"PASSION24.HOUR.05.P026\", \"n\": 26, \"t\": \"Tout ce qui Te pénètre jusque dans la moelle de tes Os est Feu. Toute ton Humanité infiniment sainte est transformée en Feu. L’Amour Te donne des Peines indicibles et mortelles, plus que ta Passion Elle-même.\"}, {\"id\": \"PASSION24.HOUR.05.P027\", \"n\": 27, \"t\": \"Il fait de ton Sang un bain d'Amour pour toutes les âmes\\n- qui veulent se laver de quelque tâche que ce soit et\\n- qui veulent acquérir le droit des fils de l'Amour.\\nJésus, Amour infini,\\nje me sens confuse devant ton Immensité.\\nJe vois que, pour pouvoir entrer dans l'Amour et comprendre ton Amour,\\nje dois être tout Amour !\"}, {\"id\": \"PASSION24.HOUR.05.P028\", \"n\": 28, \"t\": \"Mon Jésus, comme Tu veux ma compagnie et Tu veux que j'entre en Toi, je Te prie de me remplir complètement d'Amour.\"}, {\"id\": \"PASSION24.HOUR.05.P029\", \"n\": 29, \"t\": \"Par conséquent, Jésus,\\nJe Te supplie de couronner\\n- ma tête et chacune de mes pensées de la couronne de l'Amour.\\nJe T'implore de me flageller avec les fouets de l'Amour :\\n- mon âme, mon corps, mes sentiments, mes désirs, mes affections.\\nQue tout soit flagellé et scellé par l'Amour.\\nAmour infini, fais en sorte que tout en moi vive seulement par l'Amour.\\nJésus, centre de tout Amour, je Te supplie\\n- de me clouer les mains et les pieds avec les clous de l'Amour,\\nafin que je devienne Amour, que je comprenne l'Amour.\"}, {\"id\": \"PASSION24.HOUR.05.P030\", \"n\": 30, \"t\": \"Que je sois vêtue par l'Amour, nourrie par l'Amour ! Que l'Amour me tienne toute clouée à Toi. Que rien, tant à l'intérieur qu'à l'extérieur de moi, ne me détache de l'Amour ! »\"}], \"reflections\": [{\"id\": \"PASSION24.HOUR.05.REF.P001\", \"t\": \"Durant cette heure Jésus était abandonné par son Père.\\nIl souffrit un Incendie d'Amour, tel, qu'Il eut le pouvoir\\n- de détruire tous les péchés imaginables et possibles,\\n- d'enflammer de son Amour toutes les créatures, même\\n- de millions et de millions de mondes,\\n- tous les réprouvés de l'enfer,\\nsi seulement ils n'étaient pas éternellement obstinés dans leur iniquité.\\nEntrons en Jésus, pénétrons\\n- dans ses Fibres les plus profondes,\\n- dans ses Pulsations enflammées,\\n- dans son Intelligence embrasée.\\nEmparons-nous de tout cet Amour qui L'incendie.\\nPuis nous nous plongeons dans sa Volonté.\\nNous y trouverons toutes les créatures.\\nNous toucherons le cœur et l'intelligence de chacune avec\\n- l'Amour de Jésus,\\n- ses Désirs,\\n- ses Battements de Cœur et\\n- ses Pensées,\\nainsi nous formerons Jésus en chacune. Ensuite, nous présentons à Jésus\\ntoutes les créatures qui Le portent dans leur cœur.\"}, {\"id\": \"PASSION24.HOUR.05.REF.P002\", \"t\": \"Et nous les mettons autour de Lui en Lui disant : « Jésus, je Te présente toutes les créatures qui Te possèdent dans leur cœur, pour Te donner du soulagement et du réconfort. Je ne connais pas d'autre moyen pour soulager ton Cœur ! » Ce faisant, nous donnerons un vrai soulagement à Jésus. Car il y a tant de flammes qui le brûlent, qu'Il nous dit et nous redit :\"}, {\"id\": \"PASSION24.HOUR.05.REF.P003\", \"t\": \"« Je suis calciné par l'Amour et il n'y a personne qui veut mon Amour. De grâce, soulagez-Moi. Acceptez mon Amour et donnez-Moi de l'amour ! » Pour nous conformer en toute chose à Jésus, nous devons rentrer en nous-mêmes et nous poser cette question : « En tout ce que je fais, est-ce qu’il y a un flux continu d'Amour qui circule entre Dieu et moi ? »\"}, {\"id\": \"PASSION24.HOUR.05.REF.P004\", \"t\": \"Notre vie est habitée par un incessant flux d'Amour nous venant de Dieu.\\n- Quand nous pensons, il y a ce flux d'Amour.\\n- quand nous agissons, il y a ce flux d'Amour,\\n- la parole est Amour, - les battements de notre cœur sont Amour.\"}, {\"id\": \"PASSION24.HOUR.05.REF.P005\", \"t\": \"Nous recevons tout de Dieu.\\n- Nos actions courent-elles vers Dieu avec amour ?\\n- Jésus trouve-t-Il en nous le doux enchantement de son Amour qui,\\nà travers nous, retourne vers Lui, afin que, ravi par cet enchantement,\\nIl surabonde d'un Amour encore plus grand pour nous ?\\nSi en tout ce que nous faisons,\\nnotre amour pour Dieu n'est pas notre premier mobile d'action,\\n- entrons en nous-mêmes et demandons-Lui pardon de Lui avoir fait perdre\\n- le doux enchantement de notre retour d'amour.\\nNous laissons-nous travailler par les Mains divines\\ncomme ce fut le cas pour l'Humanité de Jésus ?\\nTout ce qui nous arrive, sauf le péché,\\nnous devons le considérer comme une Activité divine intense en nous.\"}, {\"id\": \"PASSION24.HOUR.05.REF.P006\", \"t\": \"Si telle n'est pas notre attitude,\\n- nous refusons au Père la gloire qui Lui est due,\\n- nous mettons en fuite la Vie divine en nous, et\\n- nous perdons la sainteté.\"}, {\"id\": \"PASSION24.HOUR.05.REF.P007\", \"t\": \"Tout ce que nous ressentons en nous :\\n- inspirations, - tribulations, - grâces,\\nn'est rien d'autre que l'Activité intense de l'Amour en nous.\"}, {\"id\": \"PASSION24.HOUR.05.REF.P008\", \"t\": \"Voyons-nous les choses de cette manière ? Donnons-nous à Jésus la liberté de travailler en nous ?\"}, {\"id\": \"PASSION24.HOUR.05.REF.P009\", \"t\": \"Ou bien en prenant tout ce qui nous arrive dans un sens humain, regardant tout comme indifférent, repoussons-nous l'Activité intense de Dieu en nous, Le contraignant à se croiser les bras ?\"}, {\"id\": \"PASSION24.HOUR.05.REF.P010\", \"t\": \"Nous abandonnons-nous entre ses Bras comme des morts\\npour recevoir tous les coups de pinceau\\nque le Seigneur nous donnera pour notre sanctification ?\\nMon Amour et mon Tout,\\n- que ton Amour m'inonde de toute part et\\n- brûle en moi tout ce qui n'est pas de Toi.\\nFais en sorte que ce qui est à moi accoure vers Toi,\\npour que Tu puisses brûler tout ce qui pourrait attrister ton Cœur.\\nQue l'Amour me tienne toute clouée à Toi.\\nQue rien, tant à l'intérieur qu'à l'extérieur de moi, ne me détache de l'Amour ! »\"}], \"subsections\": []}, {\"hour_id\": \"PASSION24.HOUR.06\", \"hour_number\": 6, \"display_time\": \"22h à 23h\", \"title\": \"Deuxième Heure de l’Agonie dans le Jardin\", \"short_title\": \"Deuxième Heure de l’Agonie dans le Jardin\", \"source_pages\": [76, 77, 78, 79, 80, 81, 82, 83, 84], \"opening_prayer_ids\": [\"PASSION24.PRAYER.BEFORE_EACH_HOUR\", \"PASSION24.PRAYER.HOLY_HOUR_PREPARATION\"], \"closing_prayer_ids\": [\"PASSION24.PRAYER.HOLY_HOUR_THANKSGIVING\"], \"paragraphs\": [{\"id\": \"PASSION24.HOUR.06.P001\", \"n\": 1, \"t\": \"Mon Jésus, Tu Te trouves déjà depuis une heure dans le Jardin. L’Amour a pris chez Toi la suprématie. Il Te fait souffrir en un seul coup ce que les bourreaux Te feront souffrir tout au long de ton amère Passion.\"}, {\"id\": \"PASSION24.HOUR.06.P002\", \"n\": 2, \"t\": \"L'Amour parvient même à Te faire souffrir ce que les bourreaux ne pourront pas Te faire souffrir, jusque dans les parties les plus profondes de ta Personne divine !\"}, {\"id\": \"PASSION24.HOUR.06.P003\", \"n\": 3, \"t\": \"Mon Jésus, je vois que, même si tes pas sont vacillants, Tu veux marcher.\\nDis-moi, mon Bien, où veux-Tu aller ?\\nAh ! Tu vas retrouver tes bien-aimés disciples.\\nJe veux T'accompagner pour Te soutenir de mes bras si Tu vacilles !\\nEt voici une autre amertume pour ton Cœur ! Tes apôtres dorment.\\nEt toi, toujours compatissant, Tu les appelles. Tu les réveilles.\\nAvec un Amour paternel,\\n- Tu les réprimandes,\\n- Tu leur recommandes de veiller et de prier.\\nPuis Tu retournes dans le Jardin.\\nMais ton Cœur porte une autre Blessure.\\nMon Amour, je vois dans cette Blessure, toutes les blessures\\ndes âmes qui Te sont consacrées et qui\\n- soit à cause de la tentation,\\n- soit par négligence,\\nau lieu de se serrer contre Toi en veillant et en priant, se laissent aller.\"}, {\"id\": \"PASSION24.HOUR.06.P004\", \"n\": 4, \"t\": \"Au lieu de faire des progrès dans l'amour et dans l'union avec Toi, somnolentes, elles s'attiédissent et reculent !\"}, {\"id\": \"PASSION24.HOUR.06.P005\", \"n\": 5, \"t\": \"Amoureux passionné, combien je compatis avec Toi. Je veux réparer toutes leurs ingratitudes ! Ce genre d'offenses attriste le plus ton Cœur adorable. Cette amertume qui T'opprime est si grande, qu'elle Te mène au délire.\"}, {\"id\": \"PASSION24.HOUR.06.P006\", \"n\": 6, \"t\": \"Amour infini, ton Sang, qui bouille dans tes Veines, vainc tout et oublie tout !\\nJe Te vois prosterné par terre et en prière profonde.\\nTu T'offres, Tu répares et, au nom de tous, Tu cherches à glorifier le Père.\\nJésus,\\nje me prosterne avec Toi. Je veux faire ce que Tu fais.\\nMais que vois-je ?\\nJe Te vois chargé de tous les péchés du monde :\\n- nos misères, nos faiblesses, nos délits les plus énormes,\\n- nos ingratitudes les plus noires, nos iniquités les plus épouvantables,\\n- nos cruautés les plus atroces, nos haines,\\n- nos massacres, nos blasphèmes, nos hérésies, nos schismes,\\n- et tout l'abîme des bassesses humaines\\nse présentent devant Toi, T'oppriment, T'écrasent, Te blessent.\"}, {\"id\": \"PASSION24.HOUR.06.P007\", \"n\": 7, \"t\": \"Et Toi, que fais-Tu ? Ton Sang qui bouille dans tes Veines fait face à ces offenses. Tes Veines s'ouvrent. Le Sang sort à l'extérieur, Il baigne tes vêtements et, coule par terre :\"}, {\"id\": \"PASSION24.HOUR.06.P008\", \"n\": 8, \"t\": \"Tu donnes ton Sang pour ces offenses, ta Vie pour contrer la mort. Ô Amour, à quel état je Te vois réduit ! Tu expires !\"}, {\"id\": \"PASSION24.HOUR.06.P009\", \"n\": 9, \"t\": \"Mon Bien, ma douce Vie, de grâce, ne meurs pas ! Dégage ton Visage de cette terre baignée de ton Sang. Viens dans mes bras. Fais en sorte que moi, en T'embrassant, je meure à ta place.\"}, {\"id\": \"PASSION24.HOUR.06.P010\", \"n\": 10, \"t\": \"J'entends ta Voix moribonde dire :\"}, {\"id\": \"PASSION24.HOUR.06.P011\", \"n\": 11, \"t\": \"« Père, si c'est possible, que s'écarte de Moi ce calice. Cependant, non pas ma Volonté, mais la Tienne. » C'est la première fois que j'entends ces mots de ta Bouche. Comme les Accents de ta Voix déchirent mon cœur ! Toutes les révoltes des créatures se présentent devant Toi Ce « Fiat Voluntas Tua » qui devrait être le principe de Vie de toute créature, Tu le vois rejeté par presque toutes. En conséquence, au lieu de trouver la Vie, elles trouvent la mort.\"}, {\"id\": \"PASSION24.HOUR.06.P012\", \"n\": 12, \"t\": \"Et Toi, Tu veux\\n- donner la Vie à toutes et\\n- faire une Réparation solennelle au Père pour leurs révoltes,\\net Tu répètes une deuxième fois :\"}, {\"id\": \"PASSION24.HOUR.06.P013\", \"n\": 13, \"t\": \"« Père, si c'est possible, que s'écarte de Moi ce calice. Ce calice, pour Moi, est très amer. Cependant, non pas ma Volonté, mais la Tienne. »\"}, {\"id\": \"PASSION24.HOUR.06.P014\", \"n\": 14, \"t\": \"Mon Bien, l'amertume qui T’opprime est si grande que Tu en es réduit à la dernière extrémité. Tu agonises, Tu es sur le point de rendre le dernier soupir !\"}, {\"id\": \"PASSION24.HOUR.06.P015\", \"n\": 15, \"t\": \"Jésus, mon Amour, pendant que Tu es entre mes bras, je veux m'unir à Toi, réparer et compatir avec Toi pour tous les manquements qui se font contre ta Volonté infiniment sainte et, Je veux en même temps, Te prier pour qu'en toutes choses, je fasse moi-même toujours ta Volonté !\"}, {\"id\": \"PASSION24.HOUR.06.P016\", \"n\": 16, \"t\": \"Que ta Volonté soit\\n- ma respiration, mon cœur, ma sensibilité,\\n- ma pensée, ma vie et mon triomphe à l'heure de ma mort.\\nJésus,\\nde grâce, ne meurs pas.\\n- Où irai-je sans Toi ? À qui vais-je m'adresser ? Qui m'aidera ?\"}, {\"id\": \"PASSION24.HOUR.06.P017\", \"n\": 17, \"t\": \"Tout sera fini pour moi !\"}, {\"id\": \"PASSION24.HOUR.06.P018\", \"n\": 18, \"t\": \"De grâce, ne me laisse pas, garde-moi toujours avec Toi. Qu'il n'arrive jamais, ne fût-ce qu'un instant, que je sois séparée de Toi ! Laisse-moi Te soulager, réparer pour Toi, compatir avec Toi à la place de tous. Car je vois que tous les péchés, quels qu'ils soient, T’écrasent ! Mon Amour, je donne un baiser à ta Tête infiniment sainte. Mais que vois-je ? Je vois toutes les pensées mauvaises dont Tu ressens l'horrible laideur. Chacune d'elles est une épine qui pique cruellement ta Tête. Jésus, les Juifs ne Te mettront qu'une seule couronne d'épines. Mais les pensées mauvaises de toutes les créatures mettent tellement de couronnes terribles sur ta Tête adorable !\"}, {\"id\": \"PASSION24.HOUR.06.P019\", \"n\": 19, \"t\": \"Jésus,\\nje compatis avec Toi !\\nJe voudrais Te mettre autant de Couronnes de Gloire.\\n- Pour Te soulager et\\n- pour Te donner de la compassion pour tous,\\nje T'offre les intelligences angéliques et ta propre Intelligence.\\nJésus,\\nje donne un baiser à tes Yeux compatissants.\\nJe vois en eux tous les regards méchants des créatures qui font couler sur ton\\nVisage des Larmes de Sang. Je compatis avec Toi !\\nJe voudrais\\n- soulager ta Vue et\\n- disposer devant Toi toutes les délices visuels du Ciel et de la terre.\\nJésus,\\nmon Bien, je donne un baiser à tes Oreilles infiniment saintes.\\nMais qu'entends-je ?\\nJ'entends en elles\\n- l'écho d'horribles blasphèmes,\\n- des cris de vengeance et de malédictions.\"}, {\"id\": \"PASSION24.HOUR.06.P020\", \"n\": 20, \"t\": \"Amour insatiable,\\nje compatis avec Toi et je veux Te consoler et\\nje veux faire résonner à tes Oreilles\\n- toutes les Harmonies du Ciel,\\n- la Voix exquise de ta chère Maman,\\n- les accents embrasés de Marie Madeleine et de toutes les âmes aimantes.\\nJésus, ma Vie,\\nje Te donne un baiser fervent sur ton Visage.\"}, {\"id\": \"PASSION24.HOUR.06.P021\", \"n\": 21, \"t\": \"Ta beauté est sans pareille !\\nPourtant,\\nce Visage que les anges contemplent avec ravissement,\\n- les créatures le giflent et le souillent par des crachats.\"}, {\"id\": \"PASSION24.HOUR.06.P022\", \"n\": 22, \"t\": \"Mon Amour, quelle effronterie !\\nJe voudrais crier assez fort pour mettre ces créatures en fuite !\\nJe compatis avec Toi et pour réparer ces insultes.\\nJe me tourne vers la Très Sainte Trinité pour demander\\n- les Baisers du Père et du Saint-Esprit,\\n- les Caresses divines de leurs Mains créatrices.\"}, {\"id\": \"PASSION24.HOUR.06.P023\", \"n\": 23, \"t\": \"Je m'adresse aussi à ta Maman céleste, afin qu'elle me donne\\n- ses Baisers, les Caresses de ses Mains maternelles,\\n- ses Adorations profondes.\\nJe T'offre tout cela en réparation des offenses\\nqui sont faites à ton Visage infiniment beau et saint !\\nJésus,\\nMon doux Bien, je donne un baiser à ta Bouche infiniment douce.\\nElle est remplie d'amertume\\n- par les horribles blasphèmes,\\n- par la nausée que Te donnent les ivresses et la gourmandise,\\n- par les conversations obscènes,\\n- par les prières mal faites,\\n- par les enseignements pernicieux,\\n- par tout le mal que fait l'homme au moyen de sa langue.\"}, {\"id\": \"PASSION24.HOUR.06.P024\", \"n\": 24, \"t\": \"Jésus,\\nje compatis avec Toi.\\nJe veux enlever l'amertume de ta Bouche en T'offrant\\n- toutes les louanges angéliques et\\n- le bon usage que font de leur langue tant de saints chrétiens.\\nJésus,\\nMon Amour opprimé, je donne un baiser à ton Cou.\\nJe le vois chargé de cordes et de chaînes à cause des attachements\\ncoupables des créatures.\"}, {\"id\": \"PASSION24.HOUR.06.P025\", \"n\": 25, \"t\": \"Je compatis avec Toi. Pour Te soulager, je T'offre l'union indissoluble des trois Personnes divines. Je me fonde au milieu de cette union et je Te tends les bras. Je forme de douces chaînes d'amour autour de ton Cou et j'éloigne de Toi les cordes des attachements coupables qui Te font suffoquer, tandis que je Te serre fort contre mon Cœur,\"}, {\"id\": \"PASSION24.HOUR.06.P026\", \"n\": 26, \"t\": \"Jésus, Force divine, je donne un baiser à tes Épaules infiniment saintes. Je les vois lacérées, leur chair presque arrachée par morceaux à cause des scandales et des mauvais exemples des créatures.\"}, {\"id\": \"PASSION24.HOUR.06.P027\", \"n\": 27, \"t\": \"Je compatis avec Toi. Pour Te soulager je T'offre\\n- tes exemples infiniment saints,\\n- ceux de la Reine Maman, et\\n- ceux de tous les saints.\\nMon Jésus,\\n- je fais courir mes baisers sur chacune de tes Plaies,\\n- j'y enferme les âmes qui, à la suite de scandales,\\nont été arrachées à ton Cœur,\\npour ainsi remettre en état les Chairs de ta sainte Humanité.\\nMon Jésus angoissé, je donne un baiser à ta Poitrine.\\nJe vois ta poitrine blessée\\n- par les froideurs et les tiédeurs des créatures,\\n- par leur manque de réciprocité et leurs ingratitudes.\\nJe compatis avec Toi. Pour Te soulager je T'offre la parfaite correspondance\\nd'Amour des trois Personnes divines.\"}, {\"id\": \"PASSION24.HOUR.06.P028\", \"n\": 28, \"t\": \"Mon Jésus,\\nMoi, je me plonge dans ton Amour.\\n- Je veux Te faire un abri pour Te protéger des nouveaux coups\\nque les créatures Te porteront par leurs péchés.\\n- Je veux blesser ces créatures par ton Amour,\\nafin qu'elles n'osent plus T'offenser.\\n- Je veux verser ton propre Amour sur ta divine Poitrine\\npour la soulager et la guérir.\\nMon Jésus,\\nje donne un baiser à tes Mains créatrices.\\nJe vois toutes les actions mauvaises des créatures qui, comme autant de\\nclous, transpercent tes Mains infiniment saintes.\\nCe n'est pas par trois clous, comme sur la Croix, que Tu es transpercé,\\nmais par autant de clous qu'il y a d'œuvres mauvaises faites par les créatures.\"}, {\"id\": \"PASSION24.HOUR.06.P029\", \"n\": 29, \"t\": \"Je compatis avec Toi. Pour Te soulager je T'offre\\n- toutes les œuvres saintes des martyrs,\\n- leur courage à donner leur sang et leur vie par amour pour Toi.\\nEn somme,\"}, {\"id\": \"PASSION24.HOUR.06.P030\", \"n\": 30, \"t\": \"je veux, ô mon Jésus, T'offrir toutes les bonnes œuvres des créatures pour T'enlever les nombreux clous que constituent leurs œuvres mauvaises. Jésus, je donne un baiser à tes Pieds infiniment saints, infatigables dans la recherche des âmes. En eux, Tu renfermes tous les pas des créatures. Mais Tu sens que beaucoup Te fuient et Tu voudrais les retenir. Par chacun de leurs mauvais pas, Tu Te sens mettre un clou. Et Tu veux Te servir de leurs propres clous pour les clouer à ton Amour. La Souffrance que Tu ressens et l'effort que Tu fais pour les clouer à ton Amour sont si grands que Tu en trembles.\"}, {\"id\": \"PASSION24.HOUR.06.P031\", \"n\": 31, \"t\": \"Mon Dieu et mon Bien, je compatis avec Toi.\\nPour Te consoler je T'offre les pas des bons religieux et des âmes fidèles\\nqui risquent leur vie pour sauver les âmes.\\nJésus,\\nje donne un baiser à ton Cœur !\\nTu continues à agoniser,\\n- non pas tant à cause de ce que Te feront souffrir les Juifs,\\n- mais à cause de la douleur que Te donnent les offenses\\nde toutes les créatures.\\nDurant ces Heures, Tu veux donner\\n- la suprématie à l'Amour,\\n- la deuxième place à tous les péchés pour lesquels\\nTu expies, Tu répares, Tu glorifies le Père et Tu apaises la Justice divine.\\n- la troisième place aux Juifs qui Te feront souffrir ta Passion.\"}, {\"id\": \"PASSION24.HOUR.06.P032\", \"n\": 32, \"t\": \"Ainsi Tu nous montres que la Passion que Te feront souffrir les Juifs\\n- ne sera rien d'autre que le reflet de la double Passion extrêmement amère\\nque Te font souffrir l'Amour et les péchés.\\nC'est pourquoi je vois dans ton Cœur, toutes trois concentrées :\\n- la lance de l'Amour, la lance du péché, et la lance des Juifs.\"}, {\"id\": \"PASSION24.HOUR.06.P033\", \"n\": 33, \"t\": \"Ton Cœur amoureux souffre\\n- des convulsions violentes, des impatiences d'Amour,\\n- des Désirs qui Te consument,\\n- des Pulsations embrasées qui voudraient enflammer tous les cœurs.\"}, {\"id\": \"PASSION24.HOUR.06.P034\", \"n\": 34, \"t\": \"Tu ressens dans ton Cœur la souffrance que Te procurent les créatures qui, par leurs désirs mauvais, par leurs affections et leurs émotions désordonnées, cherchent d'autres amours que le Tien.\"}, {\"id\": \"PASSION24.HOUR.06.P035\", \"n\": 35, \"t\": \"Jésus, combien Tu souffres ! Je Te vois T'évanouir, submergé par les vagues de nos iniquités !\"}, {\"id\": \"PASSION24.HOUR.06.P036\", \"n\": 36, \"t\": \"Je compatis avec Toi.\\nJe veux adoucir l'amertume de ton Cœur triplement transpercé, en T'offrant\\n- les Douceurs éternelles,\\n- l'Amour exquis de ta chère Maman et\\n- celui de tous ceux qui T'aiment vraiment.\\nMon Jésus,\\nfais que mon propre cœur tire sa Vie de ton Cœur,\\nafin qu'il vive seulement de ton Amour.\\nEt qu’en toute offense que Tu recevras, je sois toujours prête à T'offrir\\nsoulagement, réconfort, réparation, actes d'amour, sans interruption.\"}], \"reflections\": [{\"id\": \"PASSION24.HOUR.06.REF.P001\", \"t\": \"Pendant sa deuxième Heure d'Agonie dans le Jardin,\\ntous les péchés de tous les temps se sont présentés devant Jésus. Il a pris sur\\nLui tous ces péchés pour donner au Père Gloire et Réparation complètes.\\nIl éprouva dans son Cœur tous nos états d'âme sans jamais cesser de prier.\\nEt nous, dans nos divers états d'âme - froideurs, duretés, tentations -,\\n- est-ce que nous savons prier sans cesse ?\\n- Sommes-nous constants dans la prière ?\\n- Savons-nous rester avec courage aux pieds de Jésus, Lui donner tout ce que\\nnous souffrons afin qu'Il retrouve en nous sa propre Humanité ?\"}, {\"id\": \"PASSION24.HOUR.06.REF.P002\", \"t\": \"L'Humanité de Jésus, que faisait-elle ?\\nElle glorifiait son Père, elle expiait, elle priait pour le salut des âmes.\\nEt nous, en tout ce que nous faisons, portons-nous ces trois intentions ?\\nMon Jésus,\\n- pour compatir avec Toi et\\n- pour Te soulager de l'accablement total dans lequel Tu Te trouves,\\nje m'élève jusqu'au Ciel et je fais mienne ta propre Divinité.\\nEn Te la présentant, je veux réparer toutes les offenses des créatures.\"}, {\"id\": \"PASSION24.HOUR.06.REF.P003\", \"t\": \"Je T'offre\\n- ta Beauté pour Te consoler de la laideur du péché,\\n- ta Sainteté pour Te consoler de l'horreur de toutes ces âmes\\nqui Te font éprouver le dégoût parce qu'elles sont mortes à la Grâce,\\n- ta Paix pour Te consoler des discordes et des révoltes\\nde toutes les créatures,\\n- tes Harmonies pour dédommager ton Ouïe des propos mauvais\\ndes créatures.\\nMon Jésus,\\nje veux T'offrir autant d'Actes divins réparateurs qu'il y a d'offenses\\nqui T'attaquent comme si elles voulaient Te donner la mort.\\nJe veux projeter ta Divinité sur toutes les créatures,\\nafin que, à ton Contact divin, elles n'osent plus T'offenser.\\nJésus, seulement ainsi, je pourrai compatir avec Toi pour toutes les offenses\\nque Tu reçois des créatures.\"}, {\"id\": \"PASSION24.HOUR.06.REF.P004\", \"t\": \"Ma douce Vie, que mes prières et mes peines s'élèvent toujours vers le Ciel\\n- pour faire pleuvoir sur toutes les créatures ta Lumière et\\n- absorber en moi ta propre Vie.\"}], \"subsections\": []}, {\"hour_id\": \"PASSION24.HOUR.07\", \"hour_number\": 7, \"display_time\": \"23h à 24h\", \"title\": \"Troisième Heure de l’Agonie dans le Jardin\", \"short_title\": \"Troisième Heure de l’Agonie dans le Jardin\", \"source_pages\": [85, 86, 87, 88, 89, 90, 91, 92, 93, 94, 95, 96, 97, 98, 99], \"opening_prayer_ids\": [\"PASSION24.PRAYER.BEFORE_EACH_HOUR\", \"PASSION24.PRAYER.HOLY_HOUR_PREPARATION\"], \"closing_prayer_ids\": [\"PASSION24.PRAYER.HOLY_HOUR_THANKSGIVING\"], \"paragraphs\": [{\"id\": \"PASSION24.HOUR.07.P001\", \"n\": 1, \"t\": \"Mon doux Bien,\\nje Te regarde et je vois que Tu continues à agoniser.\\nTon Sang s'écoule de tout ton Corps et,\\n- ne pouvant plus Te tenir debout,\\n- Tu tombes dans la marre de ton Sang répandu.\"}, {\"id\": \"PASSION24.HOUR.07.P002\", \"n\": 2, \"t\": \"Ô mon Amour, mon cœur se brise à Te voir\\n- si faible et\\n- exténué !\\nTon adorable Visage et tes Mains créatrices\\n- reposent sur le sol et\\n- trempent dans ton propre Sang.\"}, {\"id\": \"PASSION24.HOUR.07.P003\", \"n\": 3, \"t\": \"Aux fleuves d'iniquités provenant des créatures, Tu opposes les fleuves de ton\\nSang précieux pour faire en sorte\\n- que toutes nos fautes soient noyées dans ce Sang et\\n- que chacun profite de ton Pardon.\"}, {\"id\": \"PASSION24.HOUR.07.P004\", \"n\": 4, \"t\": \"Mais, de grâce, ô mon Jésus, relève-Toi, c'est trop ! Mon aimable Jésus semble mourir dans son Sang, mais l'Amour Lui donne une nouvelle Vie. Je Le vois bouger avec peine. Il se lève, et tout trempé de Sang et de boue, il semble qu'Il veuille marcher. Mais, Il n’en a pas la force. C'est à peine s'Il arrive à se traîner.\"}, {\"id\": \"PASSION24.HOUR.07.P005\", \"n\": 5, \"t\": \"Ma douce Vie, laisse-moi Te serrer dans mes bras. Tu vas voir tes chers disciples ? Mais quelle n'est pas ta Souffrance de les trouver de nouveau endormis ! D'une Voix presque éteinte, Tu les interpelles :\"}, {\"id\": \"PASSION24.HOUR.07.P006\", \"n\": 6, \"t\": \"« Mes fils, ne dormez pas, l'heure est proche. Ne voyez-vous pas à quel état Je suis réduit ? De grâce, aidez-Moi, ne M'abandonnez pas en ces Heures si terribles ! » Jésus, Tu vacilles et Tu es sur le point de tomber. Alors Jean étend les bras pour Te soutenir. Tu es tellement méconnaissable. Si ce n'était pas de ta suave Voix, tes disciples ne Te reconnaîtraient pas. Puis, leur recommandant de veiller et de prier, Tu retournes dans le Jardin.\"}, {\"id\": \"PASSION24.HOUR.07.P007\", \"n\": 7, \"t\": \"Je décèle dans ton Cœur une nouvelle Blessure.\\nJ'y vois les fautes de ces âmes\\n- que Tu as comblées de tes Faveurs, Dons et Caresses,\\net qui, durant cette nuit de l'épreuve,\\n- restent comme assoupies et endormies,\\n- perdent ainsi l'esprit de prière et de veille continuelles.\\nMon Jésus,\\nil est pourtant vrai que pour l'âme\\n- qui a goûté à tes Caresses et qui, par la suite en est privée,\\nil lui faut une grande force, presque un miracle, pour résister à l'épreuve.\"}, {\"id\": \"PASSION24.HOUR.07.P008\", \"n\": 8, \"t\": \"Par conséquent :\\nJe compatis avec Toi pour ces âmes dont\\n- les négligences,\\n- les légèretés et\\n- les offenses sont particulièrement amères à ton Cœur.\"}, {\"id\": \"PASSION24.HOUR.07.P009\", \"n\": 9, \"t\": \"Je Te prie,\\n- au cas où elles parviendraient à faire un seul pas qui puisse Te déplaire,\\n- de les entourer de tant de Grâces qu'elles les arrêtent\\nafin qu'elles ne perdent pas l'esprit de prière continuelle !\\nMon doux Jésus,\\nTu retournes dans le Jardin et on a l'impression que Tu n'en peux plus.\\nTu élèves au Ciel ta Face trempée de Sang et de terre, et\\nTu répètes pour la troisième fois :\"}, {\"id\": \"PASSION24.HOUR.07.P010\", \"n\": 10, \"t\": \"« Père, si c'est possible, que s'écarte de Moi ce calice. Père Saint, aide-Moi, J'ai besoin de réconfort.\"}, {\"id\": \"PASSION24.HOUR.07.P011\", \"n\": 11, \"t\": \"Il est vrai qu'à cause des fautes chargées sur mon dos,\\nJe suis\\n- répugnant, repoussant,\\n- le dernier parmi les hommes devant ta Majesté infinie,\\nComme ta Justice est indignée contre Moi !\"}, {\"id\": \"PASSION24.HOUR.07.P012\", \"n\": 12, \"t\": \"Mais regarde-Moi, ô Père. Je suis toujours ton Fils et Je fais un avec Toi. De grâce, aie pitié de Moi. Ô Père, ne Me laisse pas sans réconfort ! » Puis il me semble entendre que Tu appelles à l'aide ta chère Maman :\"}, {\"id\": \"PASSION24.HOUR.07.P013\", \"n\": 13, \"t\": \"« Douce Maman, serre-Moi dans tes Bras comme tu le faisais quand J'étais enfant.\"}, {\"id\": \"PASSION24.HOUR.07.P014\", \"n\": 14, \"t\": \"Donne-Moi ce lait que tu Me donnais alors\\n- pour Me restaurer et adoucir les amertumes de mon Agonie.\\nDonne-Moi ton Cœur, qui était tout mon contentement.\"}, {\"id\": \"PASSION24.HOUR.07.P015\", \"n\": 15, \"t\": \"Maman, Marie Madeleine, chers apôtres, vous tous qui M'aimez,\\n- aidez-Moi,\\n- réconfortez-Moi,\\n- ne Me laissez pas seul en ces derniers moments,\\n- faites cercle autour de Moi,\\n- réconfortez-Moi par votre compagnie et votre amour ! »\\nJésus, mon Amour,\\n- qui pourrait résister en Te voyant à cette extrémité ?\\n- Pourrait-il y avoir un cœur si dur qu'il ne se briserait pas\\nà Te voir ainsi suffoquer dans ton Sang ?\\n- Qui ne fondrait pas en larmes en entendant tes Accents douloureux\\nen quête d'aide et de réconfort ?\"}, {\"id\": \"PASSION24.HOUR.07.P016\", \"n\": 16, \"t\": \"Mon Jésus,\\nje vois le Père qui T'envoie un ange pour Te réconforter et T'aider, afin\\n- que Tu sortes de cet état d'agonie et\\n- que Tu puisses Te remettre Toi-même entre les mains des Juifs.\\nTandis que Tu seras avec l'ange, moi je parcourrai le Ciel et la terre.\"}, {\"id\": \"PASSION24.HOUR.07.P017\", \"n\": 17, \"t\": \"Tu me permettras de prendre ce Sang que Tu as versé, afin que je puisse\\n- le donner à tous les hommes comme gage de salut et\\n- T'apporter en échange et en guise de réconfort,\\nleurs affections, leurs émotions, leurs pensées, leurs pas, leurs œuvres.\\nMaman céleste,\\nje viens à toi pour que nous allions ensemble chez toutes les âmes,\\npour leur donner le Sang de Jésus.\"}, {\"id\": \"PASSION24.HOUR.07.P018\", \"n\": 18, \"t\": \"Douce Maman, Jésus veut du réconfort, et le plus grand réconfort que nous puissions Lui donner est de Lui amener des âmes. Marie Madeleine, accompagne-nous. Tous les anges, venez voir à quel point Jésus est accablé. Il veut de tous du réconfort. Son accablement est si grand qu'Il ne refuse personne. Mon Jésus, Tu bois le calice d'amertume que le Père céleste T'envoie.\"}, {\"id\": \"PASSION24.HOUR.07.P019\", \"n\": 19, \"t\": \"Je T’entends dire :\"}, {\"id\": \"PASSION24.HOUR.07.P020\", \"n\": 20, \"t\": \"« Âmes, âmes, venez ! Soulagez-Moi, prenez place dans mon Humanité. Je vous veux, Je vous désire !\"}, {\"id\": \"PASSION24.HOUR.07.P021\", \"n\": 21, \"t\": \"De grâce, ne faites pas la sourde oreille à mes Appels !\\nNe rendez pas vains\\n- mes Désirs ardents,\\n- mon Sang,\\n- mon Amour,\\n- mes Peines !\\nVenez, âmes, venez ! »\\nJésus, chacun de tes Gémissements est une blessure à mon cœur.\\nJe fais miens ton Sang, ton Vouloir, ton Zèle ardent, ton Amour.\"}, {\"id\": \"PASSION24.HOUR.07.P022\", \"n\": 22, \"t\": \"Parcourant le Ciel et la terre,\\nje veux aller chez toutes les âmes\\n- pour leur donner ton Sang comme gage de salut,\"}, {\"id\": \"PASSION24.HOUR.07.P023\", \"n\": 23, \"t\": \"puis Te les apporter\\n- pour calmer tes Désirs véhéments et adoucir les amertumes de ton Agonie.\\nEt pendant que je le ferai, daigne m'accompagner de ton Regard.\\nMaman, je viens chez toi.\\nJésus veut du réconfort, Il veut des âmes.\\nDonne-moi ta main maternelle.\\nParcourons ensemble le monde entier à la recherche d'âmes.\"}, {\"id\": \"PASSION24.HOUR.07.P024\", \"n\": 24, \"t\": \"Renfermons dans son Sang\\n- les affections, les désirs, les pensées, les actions et les pas\\nde toutes les créatures.\"}, {\"id\": \"PASSION24.HOUR.07.P025\", \"n\": 25, \"t\": \"Remplissons leurs âmes des Flammes de son Cœur,\\nafin qu'elles cèdent et, qu'une fois qu'elles seront\\n- enfermées ainsi dans son Sang et transformées par ses Flammes,\\nnous les conduisions à Lui pour alléger les Peines de son Agonie.\\nMon ange gardien,\\n- précède-moi et va préparer les âmes qui doivent recevoir ce Sang afin\\nqu'aucune goutte ne reste sans son effet puissant.\\nMaman, vite, allons-y. Je vois le Regard de Jésus qui nous suit et nous pousse\\nà activer notre tâche.\"}, {\"id\": \"PASSION24.HOUR.07.P026\", \"n\": 26, \"t\": \"Maman, 1. aux premiers pas nous sommes aux portes des maisons où gisent les infirmes.\"}, {\"id\": \"PASSION24.HOUR.07.P027\", \"n\": 27, \"t\": \"Combien de membres martyrisés !\\nCombien, à cause de l'atrocité de leurs souffrances,\\n- éclatent en blasphèmes et essaient de s'enlever la vie !\\nD'autres sont abandonnés de tous et n'ont personne qui leur donne\\n- une parole de réconfort,\\n- les secours les plus nécessaires et,\\npar conséquent,\\n- ils jurent et\\n- ils désespèrent encore plus.\\nAh ! Maman, j'entends les Sanglots de Jésus.\\nSes plus chères marques d'Amour font souffrir les âmes pour les rendre\\nsemblables à Lui.\\nElles les changent en offenses.\"}, {\"id\": \"PASSION24.HOUR.07.P028\", \"n\": 28, \"t\": \"De grâce, donnons-leur son Sang, afin\\n- qu'Il leur fournisse l'aide nécessaire et\"}, {\"id\": \"PASSION24.HOUR.07.P029\", \"n\": 29, \"t\": \"- que, par sa Lumière, Il leur fasse comprendre le bien\\nqui se trouve dans la souffrance.\\nMaman, mets-toi tout près d'eux.\\nEtant une Mère affectueuse,\\n- touche de tes Mains maternelles leurs membres endoloris,\\n- calme leurs souffrances,\\n- prends-les entre tes Bras et,\\n- de ton Cœur, verse des torrents de Grâces sur toutes leurs peines.\\n- tiens compagnie aux abandonnés,\\n- console les affligés.\\nPour qui manque des moyens nécessaires,\\ndispose des âmes généreuses pour les secourir.\\nPour qui se trouvent soumis à l'atrocité des tourments,\\n- obtiens par tes Prières un répit et du repos, afin que, fortifiés,\\n- ils puissent avec plus de patience supporter ce que Jésus dispose pour eux.\\n2. Cheminons encore et entrons dans les chambres des moribonds.\\nMaman, quelle terreur !\\nCombien d'âmes sont sur le point de tomber en enfer !\\nCombien de gens, après une vie de péchés,\\n- donnent l'ultime douleur au Cœur de Jésus\\n- en accompagnant leur dernier souffle d'un acte de désespoir.\\nIl y a beaucoup de démons autour d'eux.\"}, {\"id\": \"PASSION24.HOUR.07.P030\", \"n\": 30, \"t\": \"Ceux-ci\\n- jettent dans leur cœur la terreur et l'épouvante des Jugements divins,\\n- mènent leurs dernières attaques afin de les amener en enfer.\\nD'autres, liés par les liens de la terre\\nn'arrivent pas à se résigner à faire le dernier pas.\"}, {\"id\": \"PASSION24.HOUR.07.P031\", \"n\": 31, \"t\": \"De grâce, ô Maman,\\n- ce sont leurs derniers moments,\\n- ils ont grand besoin d'aide.\"}, {\"id\": \"PASSION24.HOUR.07.P032\", \"n\": 32, \"t\": \"Tu vois\\n- comme ils tremblent,\\n- comment ils se débattent dans les tourments de l'agonie,\\n- comment ils cherchent de l'aide et de la pitié ?\\nDéjà la terre est disparue pour eux !\"}, {\"id\": \"PASSION24.HOUR.07.P033\", \"n\": 33, \"t\": \"Sainte Maman,\\n- mets ta Main maternelle sur leur front gelé,\\n- accueille leur dernier souffle,\"}, {\"id\": \"PASSION24.HOUR.07.P034\", \"n\": 34, \"t\": \"- donne à chacun le Sang de Jésus et\\n- mets ainsi en fuite les démons.\\n- Dispose-les à recevoir les derniers sacrements\\net à avoir une bonne et sainte mort.\\nEn guise de réconfort, donnons-leur\\n- les Agonies de Jésus,\\n- ses Baisers, ses Larmes, ses Plaies.\"}, {\"id\": \"PASSION24.HOUR.07.P035\", \"n\": 35, \"t\": \"Rompons les liens qui les tiennent liés aux ténèbres. Faisons entendre à tous la Parole du pardon. Mettons-leur tant de confiance dans le cœur qu'ils s'élanceront dans les Bras de Jésus.\"}, {\"id\": \"PASSION24.HOUR.07.P036\", \"n\": 36, \"t\": \"Quand Jésus les jugera, Il les trouvera\\n- couverts de son Sang,\\n- abandonnés entre ses Mains.\\nEt Il leur accordera son Pardon.\\n3. Cheminons encore, Maman. Vois comme la terre est pleine\\nd'âmes qui sont sur le point de tomber dans le péché.\\nIl faudrait un miracle pour empêcher leur chute.\"}, {\"id\": \"PASSION24.HOUR.07.P037\", \"n\": 37, \"t\": \"Par conséquent,\\ndonnons-leur le Sang de Jésus\\n- pour qu'ils trouvent en Lui la force et la grâce\\n- de ne pas tomber dans le péché.\\n4. Allons-y pour un autre pas, Maman. Voici des âmes déjà tombées dans la\\nfaute et qui voudraient une aide pour se relever.\"}, {\"id\": \"PASSION24.HOUR.07.P038\", \"n\": 38, \"t\": \"Jésus les aime, mais\\nIl les regarde, horrifié, parce qu'elles sont souillées.\\nDonnons-leur le Sang de Jésus,\\n- pour qu'elles trouvent la Main qui les relèvera.\\nMaman, ce sont\\n- des âmes qui ont grand besoin de ce Sang,\\n- des âmes mortes à la Grâce.\\nComme leur état est déplorable !\"}, {\"id\": \"PASSION24.HOUR.07.P039\", \"n\": 39, \"t\": \"Le Ciel les regarde et pleure de douleur. La terre les regarde avec dégoût. Tous les éléments sont contre elles et voudraient les détruire, parce qu'elles sont les ennemis du Créateur.\"}, {\"id\": \"PASSION24.HOUR.07.P040\", \"n\": 40, \"t\": \"Maman, le Sang de Jésus donne la Vie.\\nDonnons-le à ces âmes, afin qu'à son contact, elles ressuscitent et\\n- qu'elles ressuscitent plus belles encore, et\\n- qu'ainsi elles fassent sourire tout le Ciel et toute la terre.\\n5. Cheminons encore, Maman. Vois, il y a\\ndes âmes qui portent la marque de la perdition,\\n- qui pèchent et s'enfuient de Jésus,\\n- qui L'offensent et désespèrent de son Pardon.\\nCe sont elles les nouveaux Judas répandus sur la terre et\\n- ils percent le Cœur de Jésus.\\nDonnons-leur le Sang de Jésus, afin\\n- qu'Il annule la marque de la perdition qu'elles portent et\\n- la remplace par celle du salut ;\\n- qu'il mette dans leur cœur une telle confiance et un tel amour après la faute,\\nqu’elles\\n- accourent aux pieds de Jésus et\\n- s'attachent à ses Pieds divins pour ne plus jamais s'en détacher.\\nVois, Maman, il y a des âmes qui courent follement vers la perdition et\\nil n'y a personne pour arrêter leur course.\"}, {\"id\": \"PASSION24.HOUR.07.P041\", \"n\": 41, \"t\": \"Mettons ce Sang sous leurs pieds, afin qu'à son contact elles\\n- reculent et se remettent sur le chemin du salut !\\n6. Poursuivons notre course, Maman.\\nVois, il y a des âmes qui sont bonnes, des âmes innocentes\"}, {\"id\": \"PASSION24.HOUR.07.P042\", \"n\": 42, \"t\": \"Jésus trouve en elles ses complaisances et son repos.\\nMais les créatures sont autour d'elles\\n- avec beaucoup de pièges et de scandales\\n- pour leur arracher cette innocence et\\n- pour changer les complaisances et le repos de Jésus en amertume.\"}, {\"id\": \"PASSION24.HOUR.07.P043\", \"n\": 43, \"t\": \"Scellons l'innocence de ces âmes du Sang de Jésus\\n- comme d'un mur de protection, afin que la faute n'entre pas en elles.\"}, {\"id\": \"PASSION24.HOUR.07.P044\", \"n\": 44, \"t\": \"Que ce Sang\\n- mette en fuite quiconque voudrait les contaminer,\\net qu'il\\n- les conserve sans tache et pures pour la plus grande Joie de Jésus.\\n7. Maman, le Sang de Jésus crie et veut d'autres âmes encore.\\nCourons ensemble.\"}, {\"id\": \"PASSION24.HOUR.07.P045\", \"n\": 45, \"t\": \"Rendons-nous dans les régions des hérétiques et des infidèles.\"}, {\"id\": \"PASSION24.HOUR.07.P046\", \"n\": 46, \"t\": \"Combien de douleurs Jésus ne ressent-Il pas dans ces régions. Lui qui est la Vie de tous, n'a en retour pas même un petit acte d'amour de ces âmes. Il n'est pas connu de ses propres créatures. De grâce, Maman, donnons-leur ce Sang, afin qu'il mette en fuite les ténèbres de l'ignorance et de l'hérésie.\"}, {\"id\": \"PASSION24.HOUR.07.P047\", \"n\": 47, \"t\": \"Maman Marie, fais-leur comprendre qu'ils ont une âme et ouvre-leur le Ciel.\\n- Mettons-les tous dans le Sang de Jésus,\\n- conduisons-les près de Lui comme autant d'enfants orphelins et exilés\\nqui retrouvent leur père.\"}, {\"id\": \"PASSION24.HOUR.07.P048\", \"n\": 48, \"t\": \"Ainsi Jésus se sentira réconforté dans son Agonie. 8. Mais Jésus ne semble pas totalement content. Il veut encore d'autres âmes : les âmes moribondes de ces mêmes régions. Il sent qu'elles s'arrachent de ses Bras pour se diriger vers l'enfer.\"}, {\"id\": \"PASSION24.HOUR.07.P049\", \"n\": 49, \"t\": \"Ces âmes sont sur le point d'expirer et de tomber dans l'abîme, et personne n'est près d'elles pour les aider.\"}, {\"id\": \"PASSION24.HOUR.07.P050\", \"n\": 50, \"t\": \"Et il n'y a plus de temps. Ce sont les derniers moments pour elles.\\nPour que le Sang de Jésus ne soit pas répandu en vain pour elles,\\nvolons vers elles, versons le Sang de Jésus sur leur tête\\n- pour qu'Il leur serve de baptême et\\n- pour qu’Il infuse en elles la Foi, l'Espérance et l'Amour.\\nMaman,\\n- Mets-toi, tout près de ces personnes, supplée à tout ce qui leur manqué.\"}, {\"id\": \"PASSION24.HOUR.07.P051\", \"n\": 51, \"t\": \"Même, montre-toi à elles :\\n- sur ton visage resplendit la Beauté de Jésus ;\\n- tes manières d'agir sont les Siennes et donc,\\n- en Te voyant, elles pourront connaître Jésus.\\nPuis,\\n- presse-les sur ton Cœur maternel,\\n- infuse en elles la Vie de Jésus qui t'habite,\"}, {\"id\": \"PASSION24.HOUR.07.P052\", \"n\": 52, \"t\": \"Dis-leur qu'en tant que leur Mère tu les veux heureuses pour toujours avec toi dans le Ciel. Pendant qu'elles expirent, prends-les dans tes Bras, puis dépose-les dans les Bras de Jésus.\"}, {\"id\": \"PASSION24.HOUR.07.P053\", \"n\": 53, \"t\": \"Si, selon les droits de la Justice,\\nJésus montre qu’Il ne veut pas les recevoir,\\n- rappelle-Lui l'Amour avec lequel Il Te les a confiées sous la Croix,\\n- réclame tes droits de Mère,\\nde sorte qu'à ton amour et à tes prières, Jésus ne saura résister.\"}, {\"id\": \"PASSION24.HOUR.07.P054\", \"n\": 54, \"t\": \"Et tandis qu'Il contentera ton Cœur, Il contentera aussi le Sien.\\n9. Maman, prenons ce Sang et donnons-le à tous :\\n- aux affligés, pour qu'ils en obtiennent du réconfort,\\n- aux pauvres, pour que, résignés, ils vivent leur pauvreté,\\n- à ceux qui subissent la tentation, pour qu'ils obtiennent la victoire,\\n- aux incroyants, pour que triomphe en eux la vertu de foi,\\n- aux blasphémateurs, pour qu'ils changent leurs blasphèmes en bénédictions,\\n- aux prêtres, pour qu'ils comprennent leur mission et soient de dignes\\nministres de Jésus.\"}, {\"id\": \"PASSION24.HOUR.07.P055\", \"n\": 55, \"t\": \"Touche leurs lèvres avec ce Sang,\\nafin qu'ils ne disent aucune parole qui ne rende gloire à Dieu ;\\nTouche leurs pieds, afin qu'ils s'empressent\\nd'aller à la recherche d'âmes à conduire à Jésus.\\nDonnons ce Sang aux gouvernants des peuples, pour qu'ils\\n- soient unis entre eux et\\n- ressentent de la douceur et de l'amour envers leurs sujets.\\n10. Rendons-nous maintenant au Purgatoire.\\nMaman,\\ntu entends les gémissements des âmes qui s'y trouvent ?\\nTu vois\\n- leurs désirs véhéments d'amour,\\n- leurs tortures,\\n- leurs élans incessants vers le Bien suprême ?\\nNous voyons comment Jésus Lui-même veut les purifier plus vite pour les avoir\\navec Lui.\\nIl les attire par son Amour.\\nMais quand elles arrivent en sa divine Présence,\\n- elles ne peuvent pas encore soutenir la Pureté du Regard divin,\\n- elles sont obligées de retomber dans les flammes !\\nMaman,\\n- descendons dans cette prison profonde et,\\n- versant sur ces âmes le Sang de Jésus,\\n- portons-leur la Lumière,\\n- apaisons leurs désirs ardents d'amour,\"}, {\"id\": \"PASSION24.HOUR.07.P056\", \"n\": 56, \"t\": \"- éteignons le feu qui les brûle,\\n- purifions leurs taches.\\nAinsi,\\n- une fois libérées de toute faute,\\n- elles voleront dans les Bras du Bien suprême.\"}, {\"id\": \"PASSION24.HOUR.07.P057\", \"n\": 57, \"t\": \"Donnons le Sang de Jésus aux âmes les plus abandonnées, afin qu'elles trouvent en Lui tous les suffrages que les créatures leur refusent. Maman, donnons ce Sang à toutes. N'en privons aucune, afin qu'elles en reçoivent soulagement et libération. Agis en Reine dans ces régions de larmes et de lamentation. Etends tes Mains maternelles et, une à une, sors-les de ces flammes ardentes, afin qu'elles prennent leur envol vers le Ciel. 11. Maintenant, rendons-nous au Ciel. Plaçons-nous aux portes éternelles.\"}, {\"id\": \"PASSION24.HOUR.07.P058\", \"n\": 58, \"t\": \"Maman, permets, que je Te donne à toi aussi ce Sang précieux pour ta plus grande Gloire. Que ce Sang t'inonde d'une nouvelle Lumière et de nouveaux Contentements. Maman, donne ce Sang à moi aussi. Tu sais combien j'en ai besoin.\"}, {\"id\": \"PASSION24.HOUR.07.P059\", \"n\": 59, \"t\": \"De tes mains maternelles couvre-moi tout entière de ce Sang et purifie ainsi mes taches, guéris mes plaies, enrichis ma pauvreté.\"}, {\"id\": \"PASSION24.HOUR.07.P060\", \"n\": 60, \"t\": \"Fais en sorte\\nque ce Sang circule dans mes veines et m'imprègne de la Vie de Jésus.\\nQu'Il descende dans mon cœur et le transforme en son propre Cœur.\\nQu'Il m'embellisse afin que Jésus trouve en moi tous ses Contentements.\\n12. Enfin, Maman, entrons dans les régions célestes.\\nDonnons ce Sang à tous les saints et à tous les anges, afin qu'ils puissent\\nrecevoir\\n- une plus grande gloire,\\n- éclater en remerciements envers Jésus et\\n- prier pour nous, pour que nous puissions tous les rejoindre.\\n13. Après avoir donné à tous ce Sang, retournons à Jésus.\\nAnges, saints, venez avec nous. Jésus désire tant les âmes.\\nIl veut toutes les faire entrer dans son Humanité\\npour donner les fruits de son Sang à toutes.\"}, {\"id\": \"PASSION24.HOUR.07.P061\", \"n\": 61, \"t\": \"Plaçons-les toutes autour de Lui. Il sentira la Vie revenir en Lui et Il se sentira récompensé de l'Agonie extrême qu'Il a soufferte.\"}, {\"id\": \"PASSION24.HOUR.07.P062\", \"n\": 62, \"t\": \"14. Sainte Maman, maintenant, appelons tous les éléments à Lui tenir compagnie, afin qu'eux aussi honorent Jésus.\"}, {\"id\": \"PASSION24.HOUR.07.P063\", \"n\": 63, \"t\": \"- Ô lumière du soleil,\\nviens dissiper les ténèbres de cette nuit pour réconforter Jésus.\\n- Ô étoiles, avec vos rayons scintillants,\\ndescendez du ciel et venez réconforter Jésus.\\n- Fleurs de la terre, venez avec vos parfums.\\n- Oiseaux, venez avec vos gazouillis.\\n- Tous les éléments de la terre, venez réconforter Jésus.\\n- Viens, ô mer, rafraîchir et laver Jésus.\"}, {\"id\": \"PASSION24.HOUR.07.P064\", \"n\": 64, \"t\": \"Il est notre Créateur, notre Vie, notre Tout. Venez tous Le réconforter, Lui rendre hommage en tant que notre souverain Seigneur.\"}, {\"id\": \"PASSION24.HOUR.07.P065\", \"n\": 65, \"t\": \"Je vois que Jésus ne cherche pas tellement la lumière, les étoiles, les fleurs, les oiseaux. Il veut des âmes, des âmes ! Mon doux Bien, ta chère Maman est tout près de Toi. Repose-Toi entre ses Bras. Elle sera réconfortée elle aussi en Te pressant sur son Sein. Parce qu’elle a pris grande part à ta douloureuse Agonie.\"}, {\"id\": \"PASSION24.HOUR.07.P066\", \"n\": 66, \"t\": \"Il y a également ici Marie Madeleine, Marthe, ainsi que toutes les âmes aimantes de tous les siècles. De grâce, ô Jésus, accepte-les, et dis à toutes une Parole de Pardon et d'Amour. Jésus me dit :\"}, {\"id\": \"PASSION24.HOUR.07.P067\", \"n\": 67, \"t\": \"« Ô mon enfant, combien d'âmes Me fuient et finissent par tomber dans l'éternelle ruine ! Comment pourra se calmer ma Souffrance si une seule âme se perd. J'aime chaque âme, au même titre que J'aime toutes les âmes ensemble ! » Ô Jésus agonisant, ta Vie est sur le point de s'éteindre. J'entends tes gémissements. Tes beaux Yeux sont voilés par la mort toute proche. Tous tes Membres cèdent et Tu sembles ne plus respirer. Mon cœur est brisé de douleur. Je T'embrasse et je Te sens gelé. Je Te secoue et Tu ne donnes pas signe de vie : « Jésus, es-Tu mort ? »\"}, {\"id\": \"PASSION24.HOUR.07.P068\", \"n\": 68, \"t\": \"Maman affligée, anges du Ciel, venez pleurer Jésus, et\"}, {\"id\": \"PASSION24.HOUR.07.P069\", \"n\": 69, \"t\": \"ne permettez pas que je continue de vivre sans Lui. Je ne le peux ! Je Le serre plus fort contre moi et je sens qu'Il fait une autre Respiration. Et puis de nouveau Il ne donne plus signe de vie. Je L'appelle : « Jésus, Jésus, ma Vie, ne meurs pas ! Voilà que j'entends le tapage de tes ennemis qui viennent Te capturer. Qui Te défendra dans l'état où Tu Te trouves ? »\"}, {\"id\": \"PASSION24.HOUR.07.P070\", \"n\": 70, \"t\": \"Mais voici que, Te secouant comme si Tu ressuscitais,\"}, {\"id\": \"PASSION24.HOUR.07.P071\", \"n\": 71, \"t\": \"Tu me regardes et Tu me dis :\"}, {\"id\": \"PASSION24.HOUR.07.P072\", \"n\": 72, \"t\": \"« Ô âme, tu es ici ? Tu as donc été spectatrice des Peines et des nombreuses morts que J'ai subies ?\"}, {\"id\": \"PASSION24.HOUR.07.P073\", \"n\": 73, \"t\": \"Maintenant sache qu'en ces trois si terribles Heures d'Agonie\\ndans le Jardin,\\n- J'ai renfermé en Moi la vie de toutes les créatures et\\n- J'ai souffert toutes leurs peines et leur propres morts,\\ndonnant à chacune ma Vie.\"}, {\"id\": \"PASSION24.HOUR.07.P074\", \"n\": 74, \"t\": \"Mes Agonies soutiendront la leur. Mes Amertumes et ma Mort se changeront pour elles en douceur et en Vie.\"}, {\"id\": \"PASSION24.HOUR.07.P075\", \"n\": 75, \"t\": \"Combien Me coûtent les âmes ! Si seulement elles Me rendaient quelque chose en retour !\"}, {\"id\": \"PASSION24.HOUR.07.P076\", \"n\": 76, \"t\": \"Tu as bien vu qu'alors que Je mourais, Je recommençais à respirer. C'étaient les morts des créatures que Je ressentais en Moi. » Mon Jésus angoissé, puisque Tu as voulu porter en Toi ma mort, je Te prie de venir m'assister au moment de ma mort.\"}, {\"id\": \"PASSION24.HOUR.07.P077\", \"n\": 77, \"t\": \"Je T'ai donné mon cœur comme refuge et repos, mes bras pour Te soutenir. J'ai mis tout mon être à ta disposition. Combien volontiers je me mettrais entre les mains de tes ennemis pour pouvoir mourir à ta place !\"}, {\"id\": \"PASSION24.HOUR.07.P078\", \"n\": 78, \"t\": \"Viens, ô ma Vie, en ce moment, pour me donner ce que je T'ai donné :\\n- ta Compagnie, ton Cœur en guise de lit et de repos,\\n- tes Bras en guise de soutien, ta Respiration pour soulager mes angoisses.\"}, {\"id\": \"PASSION24.HOUR.07.P079\", \"n\": 79, \"t\": \"Ainsi ton Souffle me purifiera de toute tache et me disposera à entrer dans la Béatitude éternelle.\"}, {\"id\": \"PASSION24.HOUR.07.P080\", \"n\": 80, \"t\": \"Donne à mon âme ton Humanité infiniment sainte, de sorte\\n- qu'en me regardant, Tu Te regardes Toi-même, et\\n- qu'ainsi Tu ne trouves en moi rien que Tu puisses réprouver.\"}, {\"id\": \"PASSION24.HOUR.07.P081\", \"n\": 81, \"t\": \"Baigne-moi dans ton Sang, revêts-moi du vêtement blanc de ta Divine Volonté, afin que je puisse ainsi prendre mon envol vers le Ciel.\"}, {\"id\": \"PASSION24.HOUR.07.P082\", \"n\": 82, \"t\": \"Et ce que je Te demande pour moi, fais-le à tous les agonisants.\\n- embrase-les tous du Feu de ton Amour,\\n- sauve-les tous et ne permets pas qu'un seul ne se perde !\\nJésus, mon Bien,\\nque cette Heure Sainte, faite en mémoire de Ta Passion et de Ta Mort,\\n- désarme la colère de Dieu méritée par nos péchés,\\n- fasse descendre d'abondantes Grâces sur la sainte Église,\\n- entraîne la conversion des pécheurs, amène la paix des peuples,\\n- se répercute sur notre sanctification, et\\n- donne un grand soulagement aux âmes du purgatoire.\\nAmen.\"}], \"reflections\": [{\"id\": \"PASSION24.HOUR.07.REF.P001\", \"t\": \"Durant sa troisième Heure dans le Jardin, Jésus demanda l'aide du Ciel. Ses Peines étaient si grandes qu'Il demanda aussi du réconfort à ses disciples.\"}, {\"id\": \"PASSION24.HOUR.07.REF.P002\", \"t\": \"Et nous, en toute circonstance - revers, souffrances, mésaventures, savons-nous demander l'aide au Ciel ?\"}, {\"id\": \"PASSION24.HOUR.07.REF.P003\", \"t\": \"Si nous faisons appel aux créatures, le faisons-nous avec ordre,\\nauprès de ceux qui peuvent nous réconforter saintement ? Sommes-nous\\nrésignés si nous n'avons pas les réconforts que nous espérons.\\nSavons-nous nous servir des lacunes des créatures pour nous abandonner\\ndavantage entre les Mains de Jésus ?\\nJésus fut réconforté par un ange.\\nPouvons-nous dire que nous sommes des anges pour Jésus,\\nen sachant rester près de Lui pour Le réconforter et partager ses amertumes ?\\nMais pour pouvoir vraiment servir d'ange pour Jésus,\\nil est nécessaire d'accepter nos peines\\n- comme nous étant envoyées par Lui, donc comme des Peines divines.\"}, {\"id\": \"PASSION24.HOUR.07.REF.P004\", \"t\": \"Ce n'est qu'alors que nous pourrons réconforter notre Dieu attristé. Si nous prenons nos peines dans un sens humain, nous ne pourrons pas nous en servir pour réconforter l'Homme-Dieu. Par conséquent, nous ne pourrons pas Lui servir d'ange consolateur. Quand nous endurons avec amour et résignation les souffrances que Jésus nous envoie, elles se changent en un nectar exquis pour Lui. Dans toute souffrance, disons-nous : « Jésus m'appelle à faire l'ange auprès de Lui. Il veut mon réconfort et, par conséquent, Il me fait prendre part à ses Souffrances. »\"}, {\"id\": \"PASSION24.HOUR.07.REF.P005\", \"t\": \"Jésus, mon Amour,\\n- dans mes souffrances je cherche ton Cœur en guise de repos.\\nPour tes Souffrances je veux Te faire un abri avec mon Cœur\\npour que nous partagions nos souffrances.\\nQue je sois ton ange consolateur !\\nTerminer par la prière de remerciement de l'Heure Sainte.\"}], \"subsections\": []}, {\"hour_id\": \"PASSION24.HOUR.08\", \"hour_number\": 8, \"display_time\": \"24h à 1h\", \"title\": \"L’arrestation de Jésus dans le Jardin des Oliviers\", \"short_title\": \"L’arrestation de Jésus dans le Jardin des Oliviers\", \"source_pages\": [100, 101, 102, 103, 104], \"opening_prayer_ids
