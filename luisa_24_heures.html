insi que toutes les \u00e2mes aimantes de tous les si\u00e8cles. De gr\u00e2ce, \u00f4 J\u00e9sus, accepte-les, et dis \u00e0 toutes une Parole de Pardon et d'Amour. J\u00e9sus me dit :\"},{\"id\":\"PASSION24.HOUR.07.P067\",\"n\":67,\"t\":\"\u00ab \u00d4 mon enfant, combien d'\u00e2mes Me fuient et finissent par tomber dans l'\u00e9ternelle ruine ! Comment pourra se calmer ma Souffrance si une seule \u00e2me se perd. J'aime chaque \u00e2me, au m\u00eame titre que J'aime toutes les \u00e2mes ensemble ! \u00bb \u00d4 J\u00e9sus agonisant, ta Vie est sur le point de s'\u00e9teindre. J'entends tes g\u00e9missements. Tes beaux Yeux sont voil\u00e9s par la mort toute proche. Tous tes Membres c\u00e8dent et Tu sembles ne plus respirer. Mon c\u0153ur est bris\u00e9 de douleur. Je T'embrasse et je Te sens gel\u00e9. Je Te secoue et Tu ne donnes pas signe de vie : \u00ab J\u00e9sus, es-Tu mort ? \u00bb\"},{\"id\":\"PASSION24.HOUR.07.P068\",\"n\":68,\"t\":\"Maman afflig\u00e9e, anges du Ciel, venez pleurer J\u00e9sus, et\"},{\"id\":\"PASSION24.HOUR.07.P069\",\"n\":69,\"t\":\"ne permettez pas que je continue de vivre sans Lui. Je ne le peux ! Je Le serre plus fort contre moi et je sens qu'Il fait une autre Respiration. Et puis de nouveau Il ne donne plus signe de vie. Je L'appelle : \u00ab J\u00e9sus, J\u00e9sus, ma Vie, ne meurs pas ! Voil\u00e0 que j'entends le tapage de tes ennemis qui viennent Te capturer. Qui Te d\u00e9fendra dans l'\u00e9tat o\u00f9 Tu Te trouves ? \u00bb\"},{\"id\":\"PASSION24.HOUR.07.P070\",\"n\":70,\"t\":\"Mais voici que, Te secouant comme si Tu ressuscitais,\"},{\"id\":\"PASSION24.HOUR.07.P071\",\"n\":71,\"t\":\"Tu me regardes et Tu me dis :\"},{\"id\":\"PASSION24.HOUR.07.P072\",\"n\":72,\"t\":\"\u00ab \u00d4 \u00e2me, tu es ici ? Tu as donc \u00e9t\u00e9 spectatrice des Peines et des nombreuses morts que J'ai subies ?\"},{\"id\":\"PASSION24.HOUR.07.P073\",\"n\":73,\"t\":\"Maintenant sache qu'en ces trois si terribles Heures d'Agonie\\ndans le Jardin,\\n- J'ai renferm\u00e9 en Moi la vie de toutes les cr\u00e9atures et\\n- J'ai souffert toutes leurs peines et leur propres morts,\\ndonnant \u00e0 chacune ma Vie.\"},{\"id\":\"PASSION24.HOUR.07.P074\",\"n\":74,\"t\":\"Mes Agonies soutiendront la leur. Mes Amertumes et ma Mort se changeront pour elles en douceur et en Vie.\"},{\"id\":\"PASSION24.HOUR.07.P075\",\"n\":75,\"t\":\"Combien Me co\u00fbtent les \u00e2mes ! Si seulement elles Me rendaient quelque chose en retour !\"},{\"id\":\"PASSION24.HOUR.07.P076\",\"n\":76,\"t\":\"Tu as bien vu qu'alors que Je mourais, Je recommen\u00e7ais \u00e0 respirer. C'\u00e9taient les morts des cr\u00e9atures que Je ressentais en Moi. \u00bb Mon J\u00e9sus angoiss\u00e9, puisque Tu as voulu porter en Toi ma mort, je Te prie de venir m'assister au moment de ma mort.\"},{\"id\":\"PASSION24.HOUR.07.P077\",\"n\":77,\"t\":\"Je T'ai donn\u00e9 mon c\u0153ur comme refuge et repos, mes bras pour Te soutenir. J'ai mis tout mon \u00eatre \u00e0 ta disposition. Combien volontiers je me mettrais entre les mains de tes ennemis pour pouvoir mourir \u00e0 ta place !\"},{\"id\":\"PASSION24.HOUR.07.P078\",\"n\":78,\"t\":\"Viens, \u00f4 ma Vie, en ce moment, pour me donner ce que je T'ai donn\u00e9 :\\n- ta Compagnie, ton C\u0153ur en guise de lit et de repos,\\n- tes Bras en guise de soutien, ta Respiration pour soulager mes angoisses.\"},{\"id\":\"PASSION24.HOUR.07.P079\",\"n\":79,\"t\":\"Ainsi ton Souffle me purifiera de toute tache et me disposera \u00e0 entrer dans la B\u00e9atitude \u00e9ternelle.\"},{\"id\":\"PASSION24.HOUR.07.P080\",\"n\":80,\"t\":\"Donne \u00e0 mon \u00e2me ton Humanit\u00e9 infiniment sainte, de sorte\\n- qu'en me regardant, Tu Te regardes Toi-m\u00eame, et\\n- qu'ainsi Tu ne trouves en moi rien que Tu puisses r\u00e9prouver.\"},{\"id\":\"PASSION24.HOUR.07.P081\",\"n\":81,\"t\":\"Baigne-moi dans ton Sang, rev\u00eats-moi du v\u00eatement blanc de ta Divine Volont\u00e9, afin que je puisse ainsi prendre mon envol vers le Ciel.\"},{\"id\":\"PASSION24.HOUR.07.P082\",\"n\":82,\"t\":\"Et ce que je Te demande pour moi, fais-le \u00e0 tous les agonisants.\\n- embrase-les tous du Feu de ton Amour,\\n- sauve-les tous et ne permets pas qu'un seul ne se perde !\\nJ\u00e9sus, mon Bien,\\nque cette Heure Sainte, faite en m\u00e9moire de Ta Passion et de Ta Mort,\\n- d\u00e9sarme la col\u00e8re de Dieu m\u00e9rit\u00e9e par nos p\u00e9ch\u00e9s,\\n- fasse descendre d'abondantes Gr\u00e2ces sur la sainte \u00c9glise,\\n- entra\u00eene la conversion des p\u00e9cheurs, am\u00e8ne la paix des peuples,\\n- se r\u00e9percute sur notre sanctification, et\\n- donne un grand soulagement aux \u00e2mes du purgatoire.\\nAmen.\"}],\"reflections\":[{\"id\":\"PASSION24.HOUR.07.REF.P001\",\"t\":\"Durant sa troisi\u00e8me Heure dans le Jardin, J\u00e9sus demanda l'aide du Ciel. Ses Peines \u00e9taient si grandes qu'Il demanda aussi du r\u00e9confort \u00e0 ses disciples.\"},{\"id\":\"PASSION24.HOUR.07.REF.P002\",\"t\":\"Et nous, en toute circonstance - revers, souffrances, m\u00e9saventures, savons-nous demander l'aide au Ciel ?\"},{\"id\":\"PASSION24.HOUR.07.REF.P003\",\"t\":\"Si nous faisons appel aux cr\u00e9atures, le faisons-nous avec ordre,\\naupr\u00e8s de ceux qui peuvent nous r\u00e9conforter saintement ? Sommes-nous\\nr\u00e9sign\u00e9s si nous n'avons pas les r\u00e9conforts que nous esp\u00e9rons.\\nSavons-nous nous servir des lacunes des cr\u00e9atures pour nous abandonner\\ndavantage entre les Mains de J\u00e9sus ?\\nJ\u00e9sus fut r\u00e9confort\u00e9 par un ange.\\nPouvons-nous dire que nous sommes des anges pour J\u00e9sus,\\nen sachant rester pr\u00e8s de Lui pour Le r\u00e9conforter et partager ses amertumes ?\\nMais pour pouvoir vraiment servir d'ange pour J\u00e9sus,\\nil est n\u00e9cessaire d'accepter nos peines\\n- comme nous \u00e9tant envoy\u00e9es par Lui, donc comme des Peines divines.\"},{\"id\":\"PASSION24.HOUR.07.REF.P004\",\"t\":\"Ce n'est qu'alors que nous pourrons r\u00e9conforter notre Dieu attrist\u00e9. Si nous prenons nos peines dans un sens humain, nous ne pourrons pas nous en servir pour r\u00e9conforter l'Homme-Dieu. Par cons\u00e9quent, nous ne pourrons pas Lui servir d'ange consolateur. Quand nous endurons avec amour et r\u00e9signation les souffrances que J\u00e9sus nous envoie, elles se changent en un nectar exquis pour Lui. Dans toute souffrance, disons-nous : \u00ab J\u00e9sus m'appelle \u00e0 faire l'ange aupr\u00e8s de Lui. Il veut mon r\u00e9confort et, par cons\u00e9quent, Il me fait prendre part \u00e0 ses Souffrances. \u00bb\"},{\"id\":\"PASSION24.HOUR.07.REF.P005\",\"t\":\"J\u00e9sus, mon Amour,\\n- dans mes souffrances je cherche ton C\u0153ur en guise de repos.\\nPour tes Souffrances je veux Te faire un abri avec mon C\u0153ur\\npour que nous partagions nos souffrances.\\nQue je sois ton ange consolateur !\\nTerminer par la pri\u00e8re de remerciement de l'Heure Sainte.\"}],\"subsections\":[]},{\"hour_id\":\"PASSION24.HOUR.08\",\"hour_number\":8,\"display_time\":\"24h \u00e0 1h\",\"title\":\"L\u2019arrestation de J\u00e9sus dans le Jardin des Oliviers\",\"short_title\":\"L\u2019arrestation de J\u00e9sus dans le Jardin des Oliviers\",\"source_pages\":[100,101,102,103,104],\"opening_prayer_ids\":[\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"],\"closing_prayer_ids\":[\"PASSION24.PRAYER.AFTER_EACH_HOUR\"],\"paragraphs\":[{\"id\":\"PASSION24.HOUR.08.P001\",\"n\":1,\"t\":\"Mon J\u00e9sus, nous voil\u00e0 rendus \u00e0 minuit. Je sens que tes ennemis s'approchent.\"},{\"id\":\"PASSION24.HOUR.08.P002\",\"n\":2,\"t\":\"Et Toi, Tu T'arranges et essuies le Sang qui couvre ton Visage Fortifi\u00e9 par les r\u00e9conforts re\u00e7us, Tu vas de nouveau voir tes disciples. Tu les appelles, les avertis, et les rassembles aupr\u00e8s de Toi. Et Tu vas \u00e0 la rencontre de tes ennemis.\"},{\"id\":\"PASSION24.HOUR.08.P003\",\"n\":3,\"t\":\"Par ta promptitude, Tu r\u00e9pares ma lenteur et ma nonchalance \u00e0 agir et \u00e0 souffrir pour Toi.\"},{\"id\":\"PASSION24.HOUR.08.P004\",\"n\":4,\"t\":\"Mais, mon doux Bien, quelle sc\u00e8ne \u00e9mouvante je vois : Le premier qui se pr\u00e9sente est le perfide Judas. Il s'approche de Toi. Il met ses bras autour de ton Cou, il Te salue et Te donne le baiser. Et Toi, Amour infini, Tu ne d\u00e9daignes pas de donner un baiser \u00e0 ses l\u00e8vres infernales : Tu l'embrasses et m\u00eame Tu le serres sur ton C\u0153ur Tu lui donnes un nouveau signe d'Amour pour l\u2019arracher \u00e0 l'enfer. Mon J\u00e9sus, comment est-ce possible qu'il ne T'aime pas ? La tendresse de ton Amour est telle qu'elle devrait amener tout c\u0153ur \u00e0 T'aimer. Et pourtant Tu n'es pas aim\u00e9 !\"},{\"id\":\"PASSION24.HOUR.08.P005\",\"n\":5,\"t\":\"Par ce baiser de Judas, Tu r\u00e9pares les trahisons et les tromperies ayant l'apparence de l'amiti\u00e9 et de la saintet\u00e9, surtout celles provenant des \u00e2mes consacr\u00e9es.\"},{\"id\":\"PASSION24.HOUR.08.P006\",\"n\":6,\"t\":\"Par tes Pri\u00e8res,\\nTu obtiens le Pardon pour n'importe quel p\u00e9cheur qui, vraiment contrit,\\na recours \u00e0 ton C\u0153ur infiniment saint.\\nMon doux Bien, je serai \u00e0 tes c\u00f4t\u00e9s\\n- pour Te d\u00e9fendre, pour apprendre tes Enseignements et\\n- pour compter une \u00e0 une tes Paroles.\\nAh ! comme elle m'est douce au c\u0153ur, la Parole que Tu adressas \u00e0 Judas :\\n\u00ab Mon ami, pourquoi es-tu venu ici ? \u00bb\\nOn dirait que c'est \u00e0 moi aussi que Tu adresses cette Parole,\\n- non en m'appelant \u2018ami\u2019, mais en m'appelant du doux nom d'\u2018enfant\u2019\\n\u00ab Mon enfant, pourquoi es-tu venue ici ? \u00bb\\nEt je veux Te r\u00e9pondre : \u00ab J\u00e9sus, je viens pour T'aimer. \u00bb\"},{\"id\":\"PASSION24.HOUR.08.P007\",\"n\":7,\"t\":\"Tu me dis : \u00ab Pourquoi es-tu venue ici ? \u00bb quand je me r\u00e9veille le matin ou quand je Te prie. Tu me r\u00e9p\u00e8tes : \u00ab Pourquoi es-tu venue ici ? \u00bb \u00e0 travers la sainte Hostie, quand je viens Te recevoir dans mon c\u0153ur. Quel beau rappel pour moi !\"},{\"id\":\"PASSION24.HOUR.08.P008\",\"n\":8,\"t\":\"Mais combien, \u00e0 ton \u00ab Pourquoi es-tu venu ici ? \u00bb r\u00e9pondent : \u00ab Je viens pour Toffenser ! \u00bb\"},{\"id\":\"PASSION24.HOUR.08.P009\",\"n\":9,\"t\":\"D'autres, feignant de ne pas T'entendre,\\n- s'adonnent \u00e0 toutes sortes de p\u00e9ch\u00e9s et\\n- ils r\u00e9pondent par leur descente en enfer !\"},{\"id\":\"PASSION24.HOUR.08.P010\",\"n\":10,\"t\":\"Combien je compatis avec Toi, \u00f4 mon J\u00e9sus !\\nJe voudrais prendre les m\u00eames cordes\\n- avec lesquelles tes ennemis sont sur le point de Te lier\\n- pour lier ces \u00e2mes et T'\u00e9pargner cette Souffrance.\\nMais j'entends ta Voix infiniment tendre qui,\\npendant que Tu vas \u00e0 la rencontre de tes ennemis,\\nleur dit : \u00ab Qui cherchez-vous ? \u00bb\"},{\"id\":\"PASSION24.HOUR.08.P011\",\"n\":11,\"t\":\"Et eux Te r\u00e9pondent : \u00ab J\u00e9sus de Nazareth. \u00bb\"},{\"id\":\"PASSION24.HOUR.08.P012\",\"n\":12,\"t\":\"Alors Tu leur dis : \u00ab Me voici ! \u00bb Par ces simples paroles, Tu dis tout. Tu Te fais conna\u00eetre pour ce que Tu es. Tant et si bien que tes ennemis tremblent et tombent \u00e0 la renverse, comme morts.\"},{\"id\":\"PASSION24.HOUR.08.P013\",\"n\":13,\"t\":\"Et toi, \u00f4 Amour, c'est par un autre \u00ab Me voici ! \u00bb\\n- que Tu les rappelles \u00e0 la Vie et\\n- que, de ta propre initiative, Tu Te places entre leurs mains.\\nEt eux, perfides et ingrats,\\n- au lieu de s'humilier et de trembler \u00e0 tes pieds pour Te demander pardon,\\nils abusent de ta Bont\u00e9 et, ils m\u00e9prisent tes Gr\u00e2ces et tes Prodiges,\\nils Te mettent les Mains dans le dos et, avec des cordes et des cha\u00eenes,\\n- Te lient, Te serrent,\\n- Te jettent par terre, Te foulent aux pieds,\\n- Te tirent par les Cheveux.\\nEt Toi, avec une patience inou\u00efe, Tu Te tais, Tu souffres et\\nTu r\u00e9pares les offenses qui, malgr\u00e9 tes Miracles, sont faites obstin\u00e9ment.\\nPar les cordes et les cha\u00eenes que Tu supportes,\\nTu brises les cha\u00eenes de nos fautes et\\nTu nous attaches par la douce cha\u00eene de l'Amour.\"},{\"id\":\"PASSION24.HOUR.08.P014\",\"n\":14,\"t\":\"Avec Amour Tu corriges Pierre qui veut Te d\u00e9fendre en coupant l'oreille de Malchus. Ainsi, Tu r\u00e9pares les bonnes \u0153uvres qui ne sont pas faites selon la sainte prudence. Tu r\u00e9pares aussi pour ceux qui, par exc\u00e8s de z\u00e8le, tombent dans la faute.\"},{\"id\":\"PASSION24.HOUR.08.P015\",\"n\":15,\"t\":\"Mon J\u00e9sus\\nTu es infiniment patient. Ces cordes et ces cha\u00eenes ajoutent quelque chose de\\nplus beau \u00e0 ta Personne divine :\\n- ton Front devient plus serein,\\ntellement qu'il attire l'attention de tes ennemis.\\n- tes Yeux brillent d'une plus grande Lumi\u00e8re.\\n- ton Visage d\u00e9gage une Paix et une Douceur supr\u00eames,\\ncapables de s\u00e9duire tes bourreaux.\\n\u00d4 Amour encha\u00een\u00e9, est-il possible\\nque Tu sois li\u00e9 pour moi et que moi, ta cr\u00e9ature, je reste sans cha\u00eenes ?\\nNon, je T'en prie, lie-moi avec tes propres cha\u00eenes.\\nPar cons\u00e9quent, je T'en prie,\\ntandis que je baise tes Mains adorables, lie\\n- mes pens\u00e9es, mes yeux, mes oreilles, ma langue,\\n- mon c\u0153ur, mes affections et tout moi-m\u00eame.\"},{\"id\":\"PASSION24.HOUR.08.P016\",\"n\":16,\"t\":\"En m\u00eame temps, lie toutes les cr\u00e9atures, afin\\n- qu'elles ressentent les douceurs de tes Cha\u00eenes amoureuses et\\n- qu'elles ne T'offensent plus.\\nMon J\u00e9sus infiniment tendre,\\n- Tu T'es remis entre les mains de tes ennemis,\\n- Tu leur accordes le pouvoir de faire de Toi ce qu'ils veulent.\"},{\"id\":\"PASSION24.HOUR.08.P017\",\"n\":17,\"t\":\"Mon J\u00e9sus,\\n- moi, je me remets entre tes Mains,\\n- afin que Tu puisses librement faire de moi ce qu'il Te plaira.\\nJe veux\\n- suivre ta Volont\u00e9,\\n- T'accompagner dans tes R\u00e9parations,\\n- souffrir tes Peines.\\nJe veux \u00eatre toujours pr\u00e8s de Toi pour qu'il n'y ait pas\\n- d'offense que je ne r\u00e9pare,\\n- d'amertume que je n'adoucisse,\\n- de crachats et de gifles que Tu re\u00e7ois,\\nqui ne soient pas suivis de mes baisers et de mes caresses.\\nEt lors de tes chutes, mes mains seront toujours pr\u00eates \u00e0 Te relever.\\nJe veux \u00eatre toujours avec Toi.\\nJe ne veux pas Te laisser seul, m\u00eame pas pour un instant.\\nEt pour en \u00eatre certaine mets-moi \u00e0 l'int\u00e9rieur de Toi.\"},{\"id\":\"PASSION24.HOUR.08.P018\",\"n\":18,\"t\":\"Ainsi je serai dans ton Intelligence, dans tes Regards, dans ton C\u0153ur, dans tout Toi-m\u00eame. Et ce que Tu feras, je le ferai aussi.\"},{\"id\":\"PASSION24.HOUR.08.P019\",\"n\":19,\"t\":\"Mon doux Bien, il est d\u00e9j\u00e0 une heure du matin !\"},{\"id\":\"PASSION24.HOUR.08.P020\",\"n\":20,\"t\":\"Mon intelligence commence \u00e0 s'assoupir.\\nJe ferai ce que je pourrai pour rester \u00e9veill\u00e9e.\\nSi le sommeil me surprend, je me d\u00e9poserai en Toi pour Te suivre\\nen tout ce que Tu feras. Et m\u00eame, Tu agiras Toi-m\u00eame pour moi.\\nMon J\u00e9sus, \u00e0 partir de maintenant, je Te laisse\\nmes pens\u00e9es pour Te d\u00e9fendre de tes ennemis,\\nmes respirations en guise de cort\u00e8ge et de compagnie,\\nmes battements de c\u0153ur\\n- pour Te dire sans cesse \u00ab je T'aime ! \u00bb et\\n- pour Te d\u00e9dommager de l'amour que les autres ne Te donnent pas ;\\nles gouttes de mon sang\\n- pour r\u00e9parer et\\n- pour Te restituer les honneurs et l'estime que T'enl\u00e8veront tes ennemis\\npar leurs insultes, leurs crachats et leurs gifles.\\net tout mon \u00eatre en guise de garde.\\nMon J\u00e9sus,\\nde gr\u00e2ce, embrasse-moi et b\u00e9nis-moi.\\nEt si Tu veux que je sommeille, fais-moi dormir dans ton adorable C\u0153ur,\\nafin que par tes Battements acc\u00e9l\u00e9r\u00e9s par l'Amour et la Souffrance,\\nje puisse \u00eatre r\u00e9veill\u00e9e rapidement pour poursuivre mon accompagnement !\"}],\"reflections\":[{\"id\":\"PASSION24.HOUR.08.REF.P001\",\"t\":\"C'est promptement que J\u00e9sus se remit entre les mains de ses ennemis, en conformit\u00e9 avec la Volont\u00e9 du P\u00e8re. Lors des tromperies des cr\u00e9atures, de leurs trahisons, sommes-nous pr\u00eats \u00e0 pardonner comme J\u00e9sus a pardonn\u00e9 ?\"},{\"id\":\"PASSION24.HOUR.08.REF.P002\",\"t\":\"Tout le mal que nous recevons des cr\u00e9atures, l'acceptons-nous comme provenant des Mains de Dieu ? Sommes-nous pr\u00eats \u00e0 faire tout ce que J\u00e9sus attend de nous ?\"},{\"id\":\"PASSION24.HOUR.08.REF.P003\",\"t\":\"Quand nous subissons des croix, des exc\u00e8s de fatigue, est-ce que notre patience imite celle de J\u00e9sus ?\"},{\"id\":\"PASSION24.HOUR.08.REF.P004\",\"t\":\"Mon J\u00e9sus encha\u00een\u00e9, que tes cha\u00eenes lient mon c\u0153ur et le rendent ferme et prompt \u00e0 souffrir tout ce que Tu veux !\"}],\"subsections\":[]},{\"hour_id\":\"PASSION24.HOUR.09\",\"hour_number\":9,\"display_time\":\"1h \u00e0 2h\",\"title\":\"J\u00e9sus est pr\u00e9cipit\u00e9 dans le torrent du C\u00e9dron\",\"short_title\":\"J\u00e9sus est pr\u00e9cipit\u00e9 dans le torrent du C\u00e9dron\",\"source_pages\":[105,106,107,108],\"opening_prayer_ids\":[\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"],\"closing_prayer_ids\":[\"PASSION24.PRAYER.AFTER_EACH_HOUR\"],\"paragraphs\":[{\"id\":\"PASSION24.HOUR.09.P001\",\"n\":1,\"t\":\"Mon bien-aim\u00e9 J\u00e9sus, mon pauvre esprit oscille entre l\u2019\u00e9tat de veille et celui de sommeil. Comment pourrais-je m'abandonner au sommeil, quand je vois que tous Te quittent et Te fuient ?\"},{\"id\":\"PASSION24.HOUR.09.P002\",\"n\":2,\"t\":\"Les ap\u00f4tres eux-m\u00eames,\\n- le fervent Pierre, qui vient de dire qu'il voulait donner sa vie pour Toi,\\n- le disciple bien-aim\u00e9 qu'avec tant d'amour Tu as fait reposer sur ton c\u0153ur,\\nah, tous T'abandonnent et Te laissent \u00e0 la merci de tes cruels ennemis !\\nMon J\u00e9sus, Tu es seul !\\nTes Yeux infiniment purs regardent autour d\u2019eux\"},{\"id\":\"PASSION24.HOUR.09.P003\",\"n\":3,\"t\":\"pour voir s'il n'y aurait pas au moins un des Tiens qui Te suive pour Te t\u00e9moigner de l'amour et Te d\u00e9fendre.\"},{\"id\":\"PASSION24.HOUR.09.P004\",\"n\":4,\"t\":\"Et comme personne ne T'est rest\u00e9 fid\u00e8le, ton C\u0153ur se serre et pleure.\\nTu ressens plus de Souffrance\\n- \u00e0 cause de l'abandon de tes amis les plus fid\u00e8les\\n- qu'\u00e0 cause de ce que tes ennemis sont en train de Te faire subir.\\nMon J\u00e9sus, ne pleure pas, plut\u00f4t laisse-moi pleurer avec Toi.\"},{\"id\":\"PASSION24.HOUR.09.P005\",\"n\":5,\"t\":\"Et l'adorable J\u00e9sus semble me dire :\\n\u00ab Ah ! mon enfant,\\npleurons ensemble le destin de tant d'\u00e2mes consacr\u00e9es qui,\\n- en raison de petites \u00e9preuves ou d'incidents de la vie,\\nne s'occupent plus de Moi et Me laissent seul.\"},{\"id\":\"PASSION24.HOUR.09.P006\",\"n\":6,\"t\":\"Pleurons pour tant d'autres \u00e2mes, timides et viles qui, par manque de courage et de confiance, M'abandonnent.\"},{\"id\":\"PASSION24.HOUR.09.P007\",\"n\":7,\"t\":\"Pleurons aussi pour tant d'autres qui,\\n- ne trouvent pas leur compte dans les choses saintes,\\n- ne s'occupent pas de Moi.\"},{\"id\":\"PASSION24.HOUR.09.P008\",\"n\":8,\"t\":\"Pleurons pour tant de pr\u00eatres qui pr\u00eachent, c\u00e9l\u00e8brent, confessent pour leur gloire personnelle. Ils montrent qu\u2019ils sont autour de Moi, mais Me laissent seul !\"},{\"id\":\"PASSION24.HOUR.09.P009\",\"n\":9,\"t\":\"Ah ! mon enfant, comme il est dur pour Moi cet abandon ! Je t'en prie, r\u00e9pare ma cruelle Souffrance par la promesse de ne jamais Me laisser seul. \u00bb Oui, mon J\u00e9sus, avec l'aide de ta Gr\u00e2ce et en m'identifiant \u00e0 ta Divine Volont\u00e9 je Te promets de ne jamais Te laisser seul.\"},{\"id\":\"PASSION24.HOUR.09.P010\",\"n\":10,\"t\":\"Mais J\u00e9sus, tandis que Tu pleures l'abandon de ceux qui Te sont chers, tes ennemis ne T'\u00e9pargnent aucun outrage.\"},{\"id\":\"PASSION24.HOUR.09.P011\",\"n\":11,\"t\":\"Alors que Tu es li\u00e9 et serr\u00e9, au point de ne pouvoir faire un pas par Toi-m\u00eame,\\n- ils Te foulent aux pieds et\\n- ils Te tra\u00eenent par des voies pleines de pierres et d'\u00e9pines,\\nsi bien que chacun de tes Mouvements T'am\u00e8ne\\n- \u00e0 Te heurter \u00e0 des pierres ou\\n- \u00e0 \u00eatre piqu\u00e9 par des \u00e9pines.\"},{\"id\":\"PASSION24.HOUR.09.P012\",\"n\":12,\"t\":\"Mon J\u00e9sus, je vois que pendant qu'ils Te tra\u00eenent, Tu laisses derri\u00e8re Toi\\n- des traces de ton Sang pr\u00e9cieux ou\\n- quelques-uns de tes Cheveux blonds qu'ils T'arrachent de la T\u00eate !\"},{\"id\":\"PASSION24.HOUR.09.P013\",\"n\":13,\"t\":\"Ma Vie et mon Tout, permets-moi de recueillir ces Cheveux,\\nafin que je puisse en lier les pas des cr\u00e9atures\\n- qui, m\u00eame la nuit, ne T'\u00e9pargnent pas, que dis-je,\\nqui se servent de la nuit pour T'offenser davantage,\\n- soit pour des rendez-vous, soit pour des plaisirs,\\n- soit pour accomplir des vols sacril\u00e8ges !\\nMon J\u00e9sus, je m'unis \u00e0 Toi pour r\u00e9parer ces offenses.\\nNous voici rendus au torrent du C\u00e9dron.\\nLes perfides Juifs se pr\u00e9parent \u00e0 Te pr\u00e9cipiter dans ce torrent.\\nIls Te font Te heurter avec tant de violence contre une pierre\\nqu'il sort de ta Bouche du Sang pr\u00e9cieux dont reste marqu\u00e9e cette pierre !\"},{\"id\":\"PASSION24.HOUR.09.P014\",\"n\":14,\"t\":\"Puis, Te poussant,\\nils Te plongent au fond de ces eaux putrides, de sorte qu'elles entrent\\n- dans tes Oreilles, dans ta Bouche et dans tes Narines.\"},{\"id\":\"PASSION24.HOUR.09.P015\",\"n\":15,\"t\":\"\u00d4 mon Amour, Tu es inond\u00e9 de ces eaux\\n- putrides, naus\u00e9abondes et froides.\\nTel est l'\u00e9tat lamentable des cr\u00e9atures quand elles commettent le p\u00e9ch\u00e9 :\\nElles se couvrent d'un manteau de salet\u00e9s r\u00e9pugnantes,\\n- \u00e0 en d\u00e9go\u00fbter le Ciel et la terre,\\nattirant ainsi les foudres de la Justice divine !\\nOh ! Vie de ma vie, pourrais-Tu nous manifester un Amour plus grand ?\\nTu permets que tes ennemis Te jettent dans ce torrent\\n- pour nous d\u00e9partir de ce manteau de salet\u00e9s r\u00e9pugnantes,\"},{\"id\":\"PASSION24.HOUR.09.P016\",\"n\":16,\"t\":\"et tout cela Tu le souffres\\npour r\u00e9parer les sacril\u00e8ges et les froideurs des \u00e2mes\\n- qui Te re\u00e7oivent de mani\u00e8re sacril\u00e8ge et\\n- qui T'obligent \u00e0 entrer dans leur c\u0153ur\\no\u00f9 Tu \u00e9prouves la naus\u00e9e plus que dans ce torrent !\"},{\"id\":\"PASSION24.HOUR.09.P017\",\"n\":17,\"t\":\"Tu permets encore que ces eaux p\u00e9n\u00e8trent jusqu'\u00e0 tes visc\u00e8res,\\n\u00e0 tel point que tes ennemis, craignant que Tu Te noies, T'en ressortent,\\n- afin de Te r\u00e9server pour de plus grands tourments.\\nTon \u00e9tat est tellement r\u00e9pugnant,\\nqu'eux-m\u00eames ont la naus\u00e9e rien qu'\u00e0 Te toucher.\\nMon tendre J\u00e9sus, Te voil\u00e0 hors du torrent. Mon c\u0153ur ne supporte pas de Te\\nvoir ainsi recouvert de ces eaux naus\u00e9abondes.\"},{\"id\":\"PASSION24.HOUR.09.P018\",\"n\":18,\"t\":\"Je vois que Tu trembles de la t\u00eate aux pieds \u00e0 cause du froid. Tu regardes autour de Toi, cherchant au moins une personne qui voudrait Te s\u00e9cher, Te laver et Te r\u00e9chauffer. Mais en vain.\"},{\"id\":\"PASSION24.HOUR.09.P019\",\"n\":19,\"t\":\"Personne ne s\u2019attendrit sur ta situation. Tes ennemis se moquent de Toi et Te raillent. Les Tiens T\u2019ont abandonn\u00e9. Ta douce Maman est loin, car c\u2019est ainsi que le veut le P\u00e8re ! J\u00e9sus, me voici. Viens dans mes bras. Je veux tant pleurer que je Te ferai un bain pour Te nettoyer. Je veux de mes mains replacer tes Cheveux en broussaille.\"},{\"id\":\"PASSION24.HOUR.09.P020\",\"n\":20,\"t\":\"Mon Amour,\\nje veux T\u2019enfermer dans mon c\u0153ur pour\\n- Te r\u00e9chauffer de la chaleur de mes affections,\\n- Te parfumer de mes d\u00e9sirs saints,\\n- r\u00e9parer toutes ces offenses que Tu re\u00e7ois, et\\n- joindre ma vie \u00e0 la Tienne pour sauver toutes les \u00e2mes.\"},{\"id\":\"PASSION24.HOUR.09.P021\",\"n\":21,\"t\":\"Je veux T\u2019offrir mon c\u0153ur comme un lieu de repos\\n- pour Te d\u00e9dommager des Peines souffertes jusqu\u2019ici.\\nPuis nous reprendrons ensemble le chemin de ta Passion.\"}],\"reflections\":[{\"id\":\"PASSION24.HOUR.09.REF.P001\",\"t\":\"Durant cette Heure, J\u00e9sus se livra \u00e0 ses ennemis. Ils L\u2019ont jet\u00e9 dans le torrent du C\u00e9dron. J\u00e9sus les regardait avec Amour, supportant tout par Amour pour eux.\"},{\"id\":\"PASSION24.HOUR.09.REF.P002\",\"t\":\"Et nous, savons-nous nous livrer \u00e0 la Volont\u00e9 de Dieu ?\\nDans nos faiblesses et nos chutes,\\nsommes-nous pr\u00eats \u00e0 nous relever pour nous jeter dans les Bras de J\u00e9sus ?\\nJ\u00e9sus fut jet\u00e9 dans le torrent du C\u00e9dron, \u00e9prouvant\\nde la suffocation, de la naus\u00e9e et du d\u00e9go\u00fbt.\\nEt nous, abhorrons-nous toute ombre de p\u00e9ch\u00e9 ?\\nSommes-nous pr\u00eats \u00e0 donner \u00e0 J\u00e9sus un asile dans notre c\u0153ur,\\n- pour Lui faire oublier la naus\u00e9e que les \u00e2mes Lui donnent par le p\u00e9ch\u00e9 et\\n- pour Le d\u00e9dommager de celle que nous Lui avons donn\u00e9e nous-m\u00eames ?\\nMon J\u00e9sus tortur\u00e9, ne m\u2019\u00e9pargne en rien, et fais en sorte que je puisse \u00eatre\\nl\u2019objet de tes Vis\u00e9es divines et amoureuses !\"}],\"subsections\":[]},{\"hour_id\":\"PASSION24.HOUR.10\",\"hour_number\":10,\"display_time\":\"2h \u00e0 3h\",\"title\":\"J\u00e9sus est pr\u00e9sent\u00e9 \u00e0 Anne\",\"short_title\":\"J\u00e9sus est pr\u00e9sent\u00e9 \u00e0 Anne\",\"source_pages\":[109,110,111],\"opening_prayer_ids\":[\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"],\"closing_prayer_ids\":[\"PASSION24.PRAYER.AFTER_EACH_HOUR\"],\"paragraphs\":[{\"id\":\"PASSION24.HOUR.10.P001\",\"n\":1,\"t\":\"J\u00e9sus, Sentinelle divine, je dors et Toi, Tu ne veux pas rester seul. Ainsi Tu me r\u00e9veilles et Tu me laisses \u00eatre pr\u00e9sent avec Toi chez Anne.\"},{\"id\":\"PASSION24.HOUR.10.P002\",\"n\":2,\"t\":\"Il T'interroge sur ta Doctrine et tes disciples. Et toi, \u00f4 J\u00e9sus, pour d\u00e9fendre la Gloire du P\u00e8re, Tu r\u00e9ponds d'une Voix sonore et digne : \u00ab J'ai parl\u00e9 en public, et tous ceux qui sont ici M'ont entendu ! \u00bb \u00c0 ces Paroles, tous tremblent. Perfidement, un serviteur s'approche de Toi. D\u2019une main ferr\u00e9e, il Te donne une gifle si forte qu'elle Te fait chanceler et rend livide ton doux Visage !\"},{\"id\":\"PASSION24.HOUR.10.P003\",\"n\":3,\"t\":\"Ma douce Vie, maintenant je comprends pourquoi Tu m'as r\u00e9veill\u00e9e.\"},{\"id\":\"PASSION24.HOUR.10.P004\",\"n\":4,\"t\":\"Tu avais raison ! En fait, qui T'aurait soutenu quand Tu \u00e9tais sur le point de tomber ?\"},{\"id\":\"PASSION24.HOUR.10.P005\",\"n\":5,\"t\":\"Tandis que tes ennemis \u00e9clatent d'un rire satanique, sifflent et battent des mains, applaudissant \u00e0 cet acte si injuste, Toi, chancelant, Tu n'as personne sur qui T'appuyer.\"},{\"id\":\"PASSION24.HOUR.10.P006\",\"n\":6,\"t\":\"Mon J\u00e9sus, je T'embrasse.\\nEt je fais de mon \u00eatre un mur de protection pour Toi.\\nJe m'offre \u00e0 Toi pour supporter toute peine par amour pour Toi !\\nJe compatis avec Toi pour cet outrage.\\nEt avec Toi je r\u00e9pare les timidit\u00e9s\\n- de tant d'\u00e2mes qui se d\u00e9couragent facilement,\\n- de celles qui, ayant peur, ne disent pas la v\u00e9rit\u00e9,\\n- de celles qui manquent de respect pour les pr\u00eatres,\\n- de celles qui s'expriment par des murmures.\\nMon J\u00e9sus afflig\u00e9, Anne T'envoie \u00e0 Ca\u00efphe. Je vois que, pendant le\\nd\u00e9placement, tes ennemis Te font tomber dans un escalier.\"},{\"id\":\"PASSION24.HOUR.10.P007\",\"n\":7,\"t\":\"Toi, mon Amour, par cette chute, Tu r\u00e9pares pour ceux qui, profitant des t\u00e9n\u00e8bres de la nuit, tombent dans la faute. J\u00e9sus, je veux unir mes r\u00e9parations aux Tiennes. Pendant que Tu Te rendras chez Ca\u00efphe, je T'enverrai mon affection pour Te d\u00e9fendre de tes ennemis. Entretemps je dormirai.\"},{\"id\":\"PASSION24.HOUR.10.P008\",\"n\":8,\"t\":\"Et Toi, continue \u00e0 \u00eatre ma sentinelle d'Amour. R\u00e9veille-moi quand ton Amour Te poussera \u00e0 m'appeler \u00e0 Te tenir compagnie. Donne-moi ton doux Baiser. Moi, je donne un baiser \u00e0 ton C\u0153ur bien-aim\u00e9 et je ferme les yeux. Je prends le sommeil qu'exige ma nature.\"}],\"reflections\":[{\"id\":\"PASSION24.HOUR.10.REF.P001\",\"t\":\"J\u00e9sus est interrog\u00e9 par Anne sur sa Doctrine et ses disciples. Pour glorifier le P\u00e8re, Il r\u00e9pond quant \u00e0 sa Doctrine. Mais Il ne parle pas de ses disciples pour ne pas manquer \u00e0 la charit\u00e9.\"},{\"id\":\"PASSION24.HOUR.10.REF.P002\",\"t\":\"Et nous, quand il s'agit de glorifier le Seigneur, sommes-nous intr\u00e9pides et courageux, ou bien nous laissons-nous vaincre par le respect humain ?\"},{\"id\":\"PASSION24.HOUR.10.REF.P003\",\"t\":\"Nous devons toujours dire la v\u00e9rit\u00e9, m\u00eame devant des personnes importantes !\"},{\"id\":\"PASSION24.HOUR.10.REF.P004\",\"t\":\"Quand nous parlons, cherchons-nous toujours la Gloire de Dieu ?\\nEt pour exalter cette Gloire de Dieu,\\n- supportons-nous tout avec patience comme J\u00e9sus ?\\nSavons-nous toujours \u00e9viter de parler en mal du prochain ?\\nSavons-nous l'excuser si nous entendons d'autres gens qui en disent du mal ?\\nJ\u00e9sus veille sur notre C\u0153ur.\\nEt nous, savons-nous nous surveiller en toutes choses,\\nafin que\\n- nos regards, nos paroles, nos affections,\\n- nos \u00e9motions, nos pens\u00e9es et nos d\u00e9sirs,\\nsoient autant de sentinelles autour de J\u00e9sus\\n- pour veiller sur son C\u0153ur et tout r\u00e9parer ?\"},{\"id\":\"PASSION24.HOUR.10.REF.P005\",\"t\":\"Et quand J\u00e9sus nous appelle, sommes-nous pr\u00eats \u00e0 r\u00e9pondre ?\"},{\"id\":\"PASSION24.HOUR.10.REF.P006\",\"t\":\"Les Appels de Dieu peuvent se faire entendre de nombreuses mani\u00e8res :\\n- par les inspirations, la lecture de bons livres, par les exemples re\u00e7us,\\n- par les attraits de la Gr\u00e2ce, et m\u00eame par les intemp\u00e9ries.\\nMon J\u00e9sus,\\n- que ta douce Voix r\u00e9sonne toujours dans mon c\u0153ur et\\n- que tout ce qui m'entoure soit une voix continuelle m'appelant \u00e0 T'aimer !\"},{\"id\":\"PASSION24.HOUR.10.REF.P007\",\"t\":\"Que l'harmonie de ta Voix divine m'emp\u00eache de pr\u00eater attention \u00e0 toute autre voix qui pourrait me distraire de Toi !\"}],\"subsections\":[]},{\"hour_id\":\"PASSION24.HOUR.11\",\"hour_number\":11,\"display_time\":\"3h \u00e0 4h\",\"title\":\"Chez Ca\u00efphe, J\u00e9sus est accus\u00e9 par de faux t\u00e9moins\",\"short_title\":\"Chez Ca\u00efphe, J\u00e9sus est accus\u00e9 par de faux t\u00e9moins\",\"source_pages\":[112,113,114,115,116,117],\"opening_prayer_ids\":[\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"],\"closing_prayer_ids\":[\"PASSION24.PRAYER.AFTER_EACH_HOUR\"],\"paragraphs\":[{\"id\":\"PASSION24.HOUR.11.P001\",\"n\":1,\"t\":\"\u00d4 mon Bien afflig\u00e9 et abandonn\u00e9, ma faible nature dort. Cependant mon sommeil est tr\u00e8s souvent interrompu par les serrements d'Amour et par les Souffrance de ton divin C\u0153ur.\"},{\"id\":\"PASSION24.HOUR.11.P002\",\"n\":2,\"t\":\"Pendant que je suis entre l'\u00e9tat de veille et celui de sommeil et j'entends les coups que Te portent tes ennemis.\"},{\"id\":\"PASSION24.HOUR.11.P003\",\"n\":3,\"t\":\"Mon pauvre J\u00e9sus, abandonn\u00e9 de tous, il n'y a personne qui prenne ta d\u00e9fense ? Je T'offre ma vie pour Te servir d'appui quand ils Te feront heurter quelque chose.\"},{\"id\":\"PASSION24.HOUR.11.P004\",\"n\":4,\"t\":\"Entre temps, je m'assoupis de nouveau.\\nMais un autre serrement d'Amour de ton C\u0153ur divin me reveille.\\nJe sens mes oreilles devenir sourdes \u00e0 cause\\n- des gens qui arrivent, des chuchotements, des cris et des insultes.\\nMon Amour,\\npourquoi sont-ils tous contre Toi ? Qu'as-Tu fait pour que, comme autant de\\nloups affam\u00e9s, ils veuillent Te mettre en pi\u00e8ces ?\"},{\"id\":\"PASSION24.HOUR.11.P005\",\"n\":5,\"t\":\"Je sens mon sang se geler dans mes veines \u00e0 voir les pr\u00e9paratifs de tes ennemis. Je tremble et me sens triste. Je pense \u00e0 la mani\u00e8re que j'utiliserai pour Te d\u00e9fendre. Et J\u00e9sus semble me dire : \u00ab Mon enfant, Je n'ai pas encore tout fait ! L'Amour comporte tous les sacrifices. l'Amour est d'un co\u00fbt incommensurable. Nous n\u2019en sommes encore qu\u2019au d\u00e9but.\"},{\"id\":\"PASSION24.HOUR.11.P006\",\"n\":6,\"t\":\"Toi, reste dans mon C\u0153ur : observe tout, aime-Moi, tais-toi et apprends.\"},{\"id\":\"PASSION24.HOUR.11.P007\",\"n\":7,\"t\":\"Et que ton sang, gel\u00e9 de compassion, circule dans mes Veines pour restaurer mon Sang qui est en Feu.\"},{\"id\":\"PASSION24.HOUR.11.P008\",\"n\":8,\"t\":\"Fais en sorte que ton tremblement parcourt mes Membres,\\nafin qu'identifi\u00e9e \u00e0 Moi\\n- tu puisses te fortifier et te r\u00e9chauffer,\\n- pour ressentir une partie de mes Peines.\"},{\"id\":\"PASSION24.HOUR.11.P009\",\"n\":9,\"t\":\"Tu acquerras la force en Me voyant souffrir \u00e0 ce point. Ce sera la plus belle d\u00e9fense que tu puisses M'accorder. Sois fid\u00e8le et attentive ! \u00bb Mon doux Amour, le vacarme de tes ennemis est si consid\u00e9rable qu'il m\u2019emp\u00eache de prendre un peu de sommeil. Les coups deviennent plus violents. J'entends le bruit des cha\u00eenes avec lesquelles ils T\u2019ont attach\u00e9 si fermement que de tes Poignets jaillit du Sang, lequel marque ces rues.\"},{\"id\":\"PASSION24.HOUR.11.P010\",\"n\":10,\"t\":\"Rappelle-Toi que mon sang est dans le Tien.\\nPendant que Tu verses le Tien, le mien T\u2019y donne un baiser, T\u2019adore et r\u00e9pare,\\n- pour que ton Sang soit Lumi\u00e8re pour tous ceux qui T\u2019offensent dans la nuit.\\n- pour qu'il soit un aimant pour attirer tous les c\u0153urs \u00e0 Toi.\"},{\"id\":\"PASSION24.HOUR.11.P011\",\"n\":11,\"t\":\"Mon Amour et mon Tout, pendant qu'ils Te tra\u00eenent, l'air est alourdi de cris et de sifflements. Et Tu arrives chez Ca\u00efphe. Tu es paisible, modeste et humble. Ta Douceur et ta Patience sont telles qu'elles terrorisent tes ennemis m\u00eames. Et Ca\u00efphe devient furieux. Il semble vouloir Te d\u00e9vorer. Ah ! comme l'innocence et le p\u00e9ch\u00e9 se d\u00e9partagent facilement ! Mon Amour, Tu es devant Ca\u00efphe comme un coupable en train d'\u00eatre condamn\u00e9. Ca\u00efphe demande aux t\u00e9moins quels sont tes d\u00e9lits. Ah ! il aurait mieux fait d'implorer ton pardon ! L'un T\u2019accuse d'une chose, un autre d'une autre. On dit des b\u00eatises et on se contredit.\"},{\"id\":\"PASSION24.HOUR.11.P012\",\"n\":12,\"t\":\"Et tandis qu'on T\u2019accuse,\\ndes soldats\\n- Te tirent les Cheveux,\\n- Te giflent de mani\u00e8re si horrible qu'ils font r\u00e9sonner toute la salle.\\nIls Te maltraitent, Te battent, Te piquent.\\nMais quand Tu les regardes,\\nla Lumi\u00e8re de tes Yeux leur descend dans le c\u0153ur.\\nEt comme ils ne peuvent pas le supporter, ils s'\u00e9loignent de Toi.\\nD'autres soldats prennent la rel\u00e8ve.\\nEt Toi, au milieu de tant d'accusations et d'outrages, Tu gardes le silence.\\nTon C\u0153ur bat si fort qu'il semble sur le point d'\u00e9clater.\\nTu re\u00e7ois les brutalit\u00e9s de tes ennemis avec beaucoup d'Amour.\\nTu les offres pour notre salut.\"},{\"id\":\"PASSION24.HOUR.11.P013\",\"n\":13,\"t\":\"Ainsi, dans le plus grand calme,\\nton C\u0153ur r\u00e9pare\\n- les calomnies, - les haines, - les faux t\u00e9moignages,\\n- le mal fait avec pr\u00e9m\u00e9ditation aux innocents.\"},{\"id\":\"PASSION24.HOUR.11.P014\",\"n\":14,\"t\":\"Il r\u00e9pare\\n- les offenses faites \u00e0 l'instigation des chefs, et\\n- les fautes commises par les \u00e2mes consacr\u00e9es.\\nJe sens qu'une souffrance nouvelle afflige ton C\u0153ur.\\nDis-moi ce que c'est, \u00f4 J\u00e9sus. Fais-moi participer \u00e0 tout !\\nJ\u00e9sus semble me dire :\"},{\"id\":\"PASSION24.HOUR.11.P015\",\"n\":15,\"t\":\"\u00ab Mon enfant, tu veux le savoir ? J'entends la voix de Pierre\\n- qui pr\u00e9tend ne pas Me conna\u00eetre, qui le jure, et le jure encore.\"},{\"id\":\"PASSION24.HOUR.11.P016\",\"n\":16,\"t\":\"Ah ! Pierre, tu ne Me connais pas ? Tu ne Te souviens pas de tous les Bienfaits dont Je T\u2019ai combl\u00e9 ? Si les autres me font mourir de peines, toi, tu Me fais mourir de douleur ! Comme tu as mal fait de T\u2019exposer aux occasions en Me suivant de loin ! \u00bb Mon Bien reni\u00e9, comme elles se reconnaissent vite les offenses de ceux qui Te sont les plus chers !\"},{\"id\":\"PASSION24.HOUR.11.P017\",\"n\":17,\"t\":\"J\u00e9sus, je veux faire passer les battements de mon c\u0153ur dans les Tiens pour adoucir tes tortures. Et mes battements de c\u0153ur te jurent fid\u00e9lit\u00e9, amour, et jurent mille fois que je Te connais.\"},{\"id\":\"PASSION24.HOUR.11.P018\",\"n\":18,\"t\":\"Mais ton C\u0153ur ne se calme pas : Tu cherches \u00e0 voir Pierre. \u00c0 tes Regards d'Amour, aux Larmes que Tu verses \u00e0 cause de son reniement, Pierre s'\u00e9meut, pleure et s'\u00e9loigne.\"},{\"id\":\"PASSION24.HOUR.11.P019\",\"n\":19,\"t\":\"Et Toi, l'ayant plac\u00e9 \u00e0 l'abri,\\n- Tu Te calmes et Tu r\u00e9pares les offenses des \u00e2mes consacr\u00e9es.\\n- Tu r\u00e9pares pour les \u00e2mes qui se mettent volontairement\\ndans les occasions de p\u00e9ch\u00e9.\\nMais tes ennemis continuent de T\u2019accuser.\\nVoyant que Tu ne r\u00e9ponds rien \u00e0 leurs accusations,\\nCa\u00efphe Te dit :\\n\u00ab Je Te conjure par le Dieu vivant, dis-moi : es-Tu vraiment le Fils de Dieu ? \u00bb\"},{\"id\":\"PASSION24.HOUR.11.P020\",\"n\":20,\"t\":\"Alors Toi, mon Amour, ayant toujours \u00e0 c\u0153ur la V\u00e9rit\u00e9 et la Gloire de ton P\u00e8re,\"},{\"id\":\"PASSION24.HOUR.11.P021\",\"n\":21,\"t\":\"Tu r\u00e9ponds avec une Voix sonore et majestueuse telle\\n- que tous en restent frapp\u00e9s et\\n- que les d\u00e9mons m\u00eames s'enfoncent dans l'ab\u00eeme :\\n\u00ab C'est toi qui le dis ; Je suis le Fils de Dieu.\\nUn jour Je descendrai sur les nu\u00e9es du Ciel\\npour juger toutes les nations. \u00bb\\n\u00c0 ces Paroles solennelles, tous font silence et frissonnent d'\u00e9pouvante.\\nApr\u00e8s quelques instants de sa propre \u00e9pouvante, Ca\u00efphe,\\nfurieux comme une b\u00eate f\u00e9roce, dit \u00e0 tous :\\n\u00ab \u00c0 quoi bon les t\u00e9moins maintenant ?\\nIl vient de prof\u00e9rer un grand blasph\u00e8me.\\nQu'attendons-nous de plus pour le condamner ? Il est coupable de mort ! \u00bb\"},{\"id\":\"PASSION24.HOUR.11.P022\",\"n\":22,\"t\":\"Pour donner plus d'emphase \u00e0 ses paroles sacril\u00e8ges,\\n- il d\u00e9chire ses v\u00eatements avec tant de courroux que\\n- tous (comme s'ils ne formaient qu'une seule personne) hurlent :\\n\u00ab Il est coupable de mort ! Il est coupable de mort ! \u00bb\"},{\"id\":\"PASSION24.HOUR.11.P023\",\"n\":23,\"t\":\"Ils foncent sur Toi et, \u00e0 qui mieux mieux. Ils Te distribuent coups de poing, coups de pied, gifles et crachats au Visage.\"},{\"id\":\"PASSION24.HOUR.11.P024\",\"n\":24,\"t\":\"Mon Bien, les Tourments qu'ils Te donnent, sont tels que la terre et le Ciel en sont boulevers\u00e9s ! Mon Amour et ma Vie, pendant ces terribles moments, mon c\u0153ur est lac\u00e9r\u00e9 par la douleur !\"},{\"id\":\"PASSION24.HOUR.11.P025\",\"n\":25,\"t\":\"De gr\u00e2ce, permets-moi\\n- de rentrer dans ton C\u0153ur afflig\u00e9 et\\n- d'affronter ces outrages \u00e0 ta place !\"},{\"id\":\"PASSION24.HOUR.11.P026\",\"n\":26,\"t\":\"Ah ! si cela m\u2019\u00e9tait possible,\\nje voudrais Te faire T\u2019\u00e9chapper des mains de tes ennemis.\\nMais Toi, Tu ne veux pas, car cela est exig\u00e9 pour le salut de tous.\\nEt je suis oblig\u00e9e de me r\u00e9signer !\\nMon doux Amour,\\n- laisse-moi Te remettre en \u00e9tat,\\n- arranger tes Cheveux,\\n- enlever les crachats et le Sang qui couvrent ton Visage, et\\n- m'enfermer dans ton C\u0153ur,\"},{\"id\":\"PASSION24.HOUR.11.P027\",\"n\":27,\"t\":\"Car je vois que Ca\u00efphe veut quitter la pi\u00e8ce et Te remettre entre les mains des soldats. Mon J\u00e9sus, je T\u2019adore. B\u00e9nis-moi, donne-moi le Baiser mystique de l'Amour. Je m'enferme dans la fournaise de ton C\u0153ur divin pour prendre un peu de sommeil.\"},{\"id\":\"PASSION24.HOUR.11.P028\",\"n\":28,\"t\":\"J'appuie ma t\u00eate sur ton C\u0153ur,\\n- afin que par mes respirations, je Te donne des baisers\\n- et que, d'apr\u00e8s la diversit\u00e9 des Battements de ton C\u0153ur,\\nje puisse me rendre compte si Tu souffres ou si Tu Te reposes.\\nJ\u00e9sus, je T\u2019embrasse, je me serre fort contre ton C\u0153ur, et je m'endors.\"}],\"reflections\":[{\"id\":\"PASSION24.HOUR.11.REF.P001\",\"t\":\"Devant Ca\u00efphe, J\u00e9sus est accus\u00e9 injustement et soumis \u00e0 des tortures inou\u00efes. Interrog\u00e9, Il dit toujours la v\u00e9rit\u00e9.\"},{\"id\":\"PASSION24.HOUR.11.REF.P002\",\"t\":\"Et nous, quand le Seigneur permet qu'on nous calomnie ou qu'on nous accuse injustement, nous r\u00e9fugions-nous uniquement en Dieu, Lui qui conna\u00eet notre innocence ? Ou bien mendions-nous l'estime et les honneurs des cr\u00e9atures ?\"},{\"id\":\"PASSION24.HOUR.11.REF.P003\",\"t\":\"Nos l\u00e8vres disent-elles toujours la v\u00e9rit\u00e9 ? Sommes-nous ennemis de toute ruse ou de tout mensonge ? Supportons-nous avec patience les d\u00e9risions et les confusions provenant des cr\u00e9atures ? Sommes-nous pr\u00eats \u00e0 donner notre vie pour le salut de ces cr\u00e9atures ? Mon doux J\u00e9sus, comme je suis diff\u00e9rente de Toi ! De gr\u00e2ce, fais en sorte que mes l\u00e8vres disent toujours la v\u00e9rit\u00e9 de mani\u00e8re \u00e0 atteindre le c\u0153ur de ceux qui m'\u00e9coutent pour les conduire \u00e0 Toi !\"}],\"subsections\":[]},{\"hour_id\":\"PASSION24.HOUR.12\",\"hour_number\":12,\"display_time\":\"4h \u00e0 5h\",\"title\":\"J\u00e9sus est parmi les soldats\",\"short_title\":\"J\u00e9sus est parmi les soldats\",\"source_pages\":[118,119,120],\"opening_prayer_ids\":[\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"],\"closing_prayer_ids\":[\"PASSION24.PRAYER.AFTER_EACH_HOUR\"],\"paragraphs\":[{\"id\":\"PASSION24.HOUR.12.P001\",\"n\":1,\"t\":\"Ma douce Vie, tandis que je dors serr\u00e9e contre Toi, souvent je me sens piqu\u00e9e par les \u00e9pines qui transpercent ton C\u0153ur.\"},{\"id\":\"PASSION24.HOUR.12.P002\",\"n\":2,\"t\":\"Et comme Tu veux une \u00e2me aimante pr\u00e8s de Toi pour qu'elle note toutes tes Peines et compatisse avec Toi, je me serre plus fortement contre Toi et, sentant ainsi davantage les piq\u00fbres, je me r\u00e9veille.\"},{\"id\":\"PASSION24.HOUR.12.P003\",\"n\":3,\"t\":\"Mais, que vois-je et qu'entends-je ? Je voudrais Te cacher dans mon C\u0153ur pour m'exposer \u00e0 ta place et recevoir tes insultes et tes humiliations ! Seul un Amour comme le Tien peut supporter tant d'outrages !\"},{\"id\":\"PASSION24.HOUR.12.P004\",\"n\":4,\"t\":\"\u00d4 mon J\u00e9sus infiniment patient, que peut-on esp\u00e9rer de gens aussi barbares ? Je vois que tes ennemis se jouent de Toi.\"},{\"id\":\"PASSION24.HOUR.12.P005\",\"n\":5,\"t\":\"Tandis que Tu verses des fleuves de Larmes pour notre salut, ces gens Te couvrent le Visage de crachats, tellement que la Lumi\u00e8re de tes beaux Yeux en est voil\u00e9e.\"},{\"id\":\"PASSION24.HOUR.12.P006\",\"n\":6,\"t\":\"Et ne supportant pas l'\u00e9clat de tes Regards divins,\\nils Te couvrent d'encore plus de crachats.\\nMais ils ne peuvent masquer ta divine Majest\u00e9.\\nTon infinie Douceur ressort de plus en plus !\\nIls ont honte d'eux-m\u00eames\\nEt pour se sentir plus libres, ils Te bandent les Yeux avec une vile guenille,\\nde mani\u00e8re \u00e0 pouvoir se d\u00e9cha\u00eener plus \u00e0 leur aise sur ta Personne adorable.\\nIls Te battent sans piti\u00e9,\\n- Te tra\u00eenent,\\n- Te foulent aux pieds, et\\n- Te r\u00e9p\u00e8tent leurs coups de poing et leurs gifles au Visage.\\nIls T\u2019\u00e9gratignent, Te tirent les Cheveux et la Barbe.\\nEt ils Te projettent d'un endroit \u00e0 l'autre.\\nJ\u00e9sus, mon Amour, mon c\u0153ur ne supporte pas de Te voir ainsi maltrait\u00e9 !\\nTu veux que je note tout.\\nMais j'ai des frissons et je voudrais me couvrir les yeux pour ne pas voir ces\\nhorreurs. Mais l'Amour m'oblige \u00e0 continuer de Te regarder !\\nJ'observe que Tu ne dis pas un seul mot pour Te defendre.\\nTu es entre les mains de ces soldats comme un vulgaire chiffon\\ndont on peut faire ce qu'on veut.\\nOn Te projette par terre et on T\u2019\u00e9crase sous les pieds avec une furie infernale.\\n\u00c0 tel point que j'ai peur que Tu meures sous ces pieds impitoyables.\\nMon Bien et mon Tout, la souffrance est extr\u00eame de voir ce qu'on Te fait.\\nEt je voudrais pousser des cris si forts qu'ils parviennent l\u00e0-haut, au Ciel et\\nappellent le P\u00e8re, le Saint-Esprit et tous les anges\\n- \u00e0 venir Te r\u00e9conforter et T\u2019aider.\"},{\"id\":\"PASSION24.HOUR.12.P007\",\"n\":7,\"t\":\"Et ici, sur la terre, je veux appeler ta douce Maman et toutes les \u00e2mes\\naimantes \u00e0 faire cercle autour de Toi, afin d'emp\u00eacher ces soldats insolents de\\nT\u2019insulter et de Te tourmenter davantage.\\nAvec Toi, J\u00e9sus, je veux r\u00e9parer\\n- les p\u00e9ch\u00e9s nocturnes, surtout ceux qui sont commis par les sectaires\\nsur ta Pr\u00e9sence sacramentelle.\"},{\"id\":\"PASSION24.HOUR.12.P008\",\"n\":8,\"t\":\"- aussi toutes les offenses des \u00e2mes qui ne Te restent pas fid\u00e8les\\nquand elles sont dans la nuit de l'\u00e9preuve.\\nMon Bien tyrannis\u00e9,\\nje vois, que les soldats fatigu\u00e9s et ivres veulent se reposer.\\nMais mon c\u0153ur bris\u00e9 \u00e0 la vue de tant de Souffrances,\\nne veut pas rester seul avec Toi.\\nIl ressent le besoin d'une autre compagnie.\"},{\"id\":\"PASSION24.HOUR.12.P009\",\"n\":9,\"t\":\"Douce Maman, sois avec nous sans cesse. Je serre fort ta Main maternelle et je la baise. Daigne me fortifier de ta b\u00e9n\u00e9diction. Embrassons ensemble J\u00e9sus et posons nos t\u00eates sur son C\u0153ur adorable pour Le consoler.\"},{\"id\":\"PASSION24.HOUR.12.P010\",\"n\":10,\"t\":\"J\u00e9sus, c'est avec ta Maman que je T\u2019embrasse. B\u00e9nis-nous et, avec elle, nous prendrons le sommeil de l'Amour dans ton C\u0153ur adorable.\"}],\"reflections\":[{\"id\":\"PASSION24.HOUR.12.REF.P001\",\"t\":\"Durant cette Heure, J\u00e9sus se trouve parmi les soldats\\n- avec un courage imperturbable, une constance de fer.\\nEn tant que Dieu, Il souffre tous les outrages que les soldats Lui font, et\\nIl les regarde avec tant d'Amour\\nqu'Il semble les inviter \u00e0 Lui donner plus de Souffrances encore.\"},{\"id\":\"PASSION24.HOUR.12.REF.P002\",\"t\":\"Et nous, dans nos souffrances,\\n- sommes-nous constants, ou bien nous lamentons-nous,\\n- nous ennuyons-nous, perdons-nous la paix,\\ncette paix du c\u0153ur n\u00e9cessaire pour que J\u00e9sus\\npuisse trouver en nous une heureuse demeure ?\\nLa constance est une vertu montrant que Dieu r\u00e8gne vraiment en nous.\\n- Elle nous rend fermes dans l'\u00e9preuve, non pas avec des hauts et des bas.\\n- Et elle nous am\u00e8ne la paix.\\nSi nous sommes inconstants, notre champ d'action est petit et\\nl'action de J\u00e9sus en nous ne peut qu'\u00eatre limit\u00e9e.\\nJ\u00e9sus regardait avec Amour ceux qui le maltraitaient.\\nNous, regardons-nous avec amour ceux qui nous offensent ?\\nEt cet amour est-il assez grand pour que ces personnes soient attir\u00e9es\\n\u00e0 se convertir \u00e0 J\u00e9sus ?\\nMon J\u00e9sus, Amour sans limite, donne-moi ton Amour\\nafin que chacune de mes peines rapproche des \u00e2mes de Toi.\"}],\"subsections\":[]},{\"hour_id\":\"PASSION24.HOUR.13\",\"hour_number\":13,\"display_time\":\"5h \u00e0 6h\",\"title\":\"L\u2019emprisonnement de J\u00e9sus\",\"short_title\":\"L\u2019emprisonnement de J\u00e9sus\",\"source_pages\":[121,122,123,124,125,126,127],\"opening_prayer_ids\":[\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"],\"closing_prayer_ids\":[\"PASSION24.PRAYER.AFTER_EACH_HOUR\"],\"paragraphs\":[{\"id\":\"PASSION24.HOUR.13.P001\",\"n\":1,\"t\":\"Mon J\u00e9sus, doux Prisonnier, je me suis r\u00e9veill\u00e9e et je ne Te trouve pas. J'ai le c\u0153ur qui bat fort. Je br\u00fble du d\u00e9sir d'aimer. Dis-moi o\u00f9 Tu es. Mon ange, am\u00e8ne-moi chez Ca\u00efphe. Je me prom\u00e8ne partout, je fouille partout, et je ne trouve pas J\u00e9sus ! Mon Amour, vite, am\u00e8ne-moi \u00e0 Toi, afin que je puisse me jeter dans tes Bras. Je d\u00e9couvre qu'ils T\u2019ont mis en prison. Mon c\u0153ur exulte de joie de Te retrouver.\"},{\"id\":\"PASSION24.HOUR.13.P002\",\"n\":2,\"t\":\"Mais il est bless\u00e9 de douleur en voyant l'\u00e9tat dans lequel ils T\u2019ont r\u00e9duit. Je Te vois : les Mains li\u00e9es \u00e0 une colonne, - les Pieds serr\u00e9s et li\u00e9s, ton saint Visage gonfl\u00e9 et ensanglant\u00e9 \u00e0 cause des gifles et des coups re\u00e7us.\"},{\"id\":\"PASSION24.HOUR.13.P003\",\"n\":3,\"t\":\"Tes Yeux sont livides, Tes Pupilles sont fatigu\u00e9es et m\u00e9lancoliques \u00e0 cause de tout ce qu'on T\u2019a fait subir et du manque de sommeil. Tes Cheveux sont en d\u00e9sordre, ta divine Personne a mal partout. Et Tu ne peux pas T\u2019aider et Te nettoyer car Tu es attach\u00e9.\"},{\"id\":\"PASSION24.HOUR.13.P004\",\"n\":4,\"t\":\"Et moi, en sanglots, je T\u2019embrasse les Pieds et je Te dis : \u00ab Comme Tu es mal en point, mon Amour ! \u00bb\"},{\"id\":\"PASSION24.HOUR.13.P005\",\"n\":5,\"t\":\"Tu me r\u00e9ponds :\\n\u00ab Viens, \u00f4 \u00e2me.\\nSois attentive \u00e0 tout ce que tu Me vois faire pour le faire avec Moi,\\nafin que Je puisse continuer ma Vie en toi. \u00bb\\nMon J\u00e9sus, \u00e0 ma stupeur, je vois qu'au lieu de Te pr\u00e9occuper de tes Peines,\\n- Tu penses - avec un Amour indicible - \u00e0 glorifier le P\u00e8re\\npour Le d\u00e9dommager de nos n\u00e9gligences envers Lui, et\\n- Tu appelles toutes les \u00e2mes autour de Toi\\npour prendre tous leurs maux sur Toi et leur donner tous tes Biens.\\nNous sommes d\u00e9j\u00e0 au point du jour.\\nIl me semble entendre ta Voix infiniment douce dire :\"},{\"id\":\"PASSION24.HOUR.13.P006\",\"n\":6,\"t\":\"\u00ab P\u00e8re saint, Je Te rends gr\u00e2ce pour tout ce que J'ai souffert et pour ce qu'il Me reste encore \u00e0 souffrir.\"},{\"id\":\"PASSION24.HOUR.13.P007\",\"n\":7,\"t\":\"Comme cette aube appelle le jour,\\n- que l'aube de ta Gr\u00e2ce se manifeste dans tous les c\u0153urs.\\n- que Moi, le Soleil divin,\\nJe surgisse dans tous les c\u0153urs et r\u00e8gne en tous.\"},{\"id\":\"PASSION24.HOUR.13.P008\",\"n\":8,\"t\":\"Tu vois, \u00f4 P\u00e8re, toutes ces \u00e2mes.\\nJe r\u00e9ponds de toutes :\\n- leurs pens\u00e9es, leurs paroles,\\n- leurs \u0153uvres et leurs omissions,\\nau co\u00fbt de mon Sang et de ma Mort ! \u00bb\\nMon J\u00e9sus, Amour infini,\\nje m'unis \u00e0 ta Pri\u00e8re en Te remerciant\\npour ce que Tu m'as fait souffrir et pour ce qu'il me reste \u00e0 souffrir \u00e0 tes c\u00f4t\u00e9s.\"},{\"id\":\"PASSION24.HOUR.13.P009\",\"n\":9,\"t\":\"Je Te prie de faire poindre dans tous les c\u0153urs l'aube de ta Gr\u00e2ce. Mais je vois, mon doux J\u00e9sus, que Tu r\u00e9pares pour les premi\u00e8res\"},{\"id\":\"PASSION24.HOUR.13.P010\",\"n\":10,\"t\":\"pens\u00e9es, affections et paroles, qui au petit jour, ne Te sont pas offertes. Tu les appelles, puisqu'elles Te sont dues. Tu r\u00e9pares pour donner au P\u00e8re la Gloire qui Lui est due. Mon J\u00e9sus, Ma\u00eetre divin, dans cette prison nous avons une heure de libre et nous sommes seuls. Je veux faire non seulement ce que Tu fais.\"},{\"id\":\"PASSION24.HOUR.13.P011\",\"n\":11,\"t\":\"Je veux\\n- Te nettoyer,\\n- T\u2019arranger les Cheveux et\\n- me fondre en Toi.\"},{\"id\":\"PASSION24.HOUR.13.P012\",\"n\":12,\"t\":\"Par cons\u00e9quent, je m'approche de ta T\u00eate infiniment sainte et, en T'arrangeant les Cheveux, je veux r\u00e9parer pour les intelligences d\u00e9natur\u00e9es, qui n'ont pas une seule pens\u00e9e pour Toi.\"},{\"id\":\"PASSION24.HOUR.13.P013\",\"n\":13,\"t\":\"Et, me fondant dans ton Intelligence,\\nje veux adorer toutes tes Pens\u00e9es, pour en tirer assez de r\u00e9parations\\n- pour toutes les pens\u00e9es mauvaises des cr\u00e9atures,\\n- pour toutes les lumi\u00e8res et les inspirations qu'elles repoussent.\"},{\"id\":\"PASSION24.HOUR.13.P014\",\"n\":14,\"t\":\"Je voudrais que toutes les pens\u00e9es des cr\u00e9atures\\nne fassent qu'un avec les Tiennes, pour Te donner\\n- une vraie r\u00e9paration et une gloire parfaite.\\nMon J\u00e9sus afflig\u00e9, je baise tes Yeux m\u00e9lancoliques et remplis de Larmes.\\nComme tes Mains sont li\u00e9es \u00e0 la colonne, Tu ne peux\\nni Te s\u00e9cher, ni T\u2019enlever les crachats avec lesquels T\u2019ont souill\u00e9 tes ennemis.\\nEt comme la position dans laquelle ils T\u2019ont li\u00e9 est torturante,\\nne peux fermer tes Yeux fatigu\u00e9s pour prendre un peu de repos.\"},{\"id\":\"PASSION24.HOUR.13.P015\",\"n\":15,\"t\":\"Mon Amour, combien volontiers je voudrais Te servir de lit avec mes bras pour Te donner du repos !\"},{\"id\":\"PASSION24.HOUR.13.P016\",\"n\":16,\"t\":\"Je veux essuyer tes Yeux,\\n- Te demander pardon, et r\u00e9parer\\npour les nombreuses fois que nous n'avons pas eu l'intention\\n- de Te plaire et de Te regarder\\npour voir\\n- ce que Tu voulais de nous,\\n- ce que nous devions faire, et\\n- o\u00f9 Tu voulais que nous allions.\"},{\"id\":\"PASSION24.HOUR.13.P017\",\"n\":17,\"t\":\"Et je veux fondre mes yeux et ceux de toutes les cr\u00e9atures dans les Tiens,\\npour pouvoir r\u00e9parer par tes propres Yeux\\ntout le mal que nous avons fait au moyen de notre vue.\\nMon J\u00e9sus compatissant, je baise tes Oreilles infiniment saintes.\\nElles sont fatigu\u00e9es\\n- par les insultes de toute la nuit, et\\n- plus encore par l'\u00e9cho des offenses de toutes les cr\u00e9atures.\"},{\"id\":\"PASSION24.HOUR.13.P018\",\"n\":18,\"t\":\"Je Te demande pardon et\\nje veux r\u00e9parer pour toutes les fois que Tu nous as appel\u00e9s et\\n- que nous avons \u00e9t\u00e9 sourds \u00e0 ta Voix, ou\\n- que nous avons feint de ne pas T\u2019entendre.\"},{\"id\":\"PASSION24.HOUR.13.P019\",\"n\":19,\"t\":\"Et Toi, mon Bien si patient, Tu as r\u00e9p\u00e9t\u00e9 tes Appels, mais en vain.\\nJe veux fondre mes oreilles et celles de toutes les cr\u00e9atures dans les Tiennes,\\n- pour faire une r\u00e9paration continuelle et compl\u00e8te, et\\n- pour que les cr\u00e9atures \u00e9coutent tes divines Paroles et\\nles mettent en pratique.\\nMon J\u00e9sus plein d'Amour, je baise ton Visage infiniment saint,\\ndevenu livide \u00e0 cause des gifles.\"},{\"id\":\"PASSION24.HOUR.13.P020\",\"n\":20,\"t\":\"Je Te demande pardon et je r\u00e9pare pour toutes les fois que Tu nous as appel\u00e9s \u00e0 \u00eatre tes victimes de r\u00e9paration, alors que nous, nous unissant \u00e0 tes ennemis, nous T\u2019avons gifl\u00e9 et crach\u00e9 dessus !\"},{\"id\":\"PASSION24.HOUR.13.P021\",\"n\":21,\"t\":\"Mon J\u00e9sus, je veux fondre mon visage dans le Tien,\\n- pour Te restituer ta Beaut\u00e9 originale et\\n- pour Te donner r\u00e9paration enti\u00e8re pour tous les m\u00e9pris\\nque tes ennemis ont dirig\u00e9 contre ta divine Majest\u00e9.\\nMon Bien si attrist\u00e9, je baise ta Bouche infiniment douce,\\n- endolorie \u00e0 cause des coups de poing, et\\n- br\u00fbl\u00e9e par l'Amour.\"},{\"id\":\"PASSION24.HOUR.13.P022\",\"n\":22,\"t\":\"Je veux, au moyen\\n- de ma langue et\\n- de celle de toutes les cr\u00e9atures unies \u00e0 ta propre Langue,\\nr\u00e9parer toutes les conversations mauvaises des cr\u00e9atures.\"},{\"id\":\"PASSION24.HOUR.13.P023\",\"n\":23,\"t\":\"Je veux, mon J\u00e9sus assoiff\u00e9,\\nunir toutes les voix des cr\u00e9atures \u00e0 la Tienne,\\n- pour \u00e9touffer les voix du p\u00e9ch\u00e9 et\\n- pour les changer en voix de louange et d'amour.\"},{\"id\":\"PASSION24.HOUR.13.P024\",\"n\":24,\"t\":\"Mon J\u00e9sus encha\u00een\u00e9, je baise ton Cou charg\u00e9 de lourdes cha\u00eenes et de cordes, lesquelles, encerclant ta Poitrine, tes \u00c9paules et tes Bras, te tiennent serr\u00e9 contre la colonne.\"},{\"id\":\"PASSION24.HOUR.13.P025\",\"n\":25,\"t\":\"Tes Mains sont gonfl\u00e9es et noircies \u00e0 cause de ces liens serr\u00e9s.\\nElles laissent couler du Sang.\\nJ\u00e9sus li\u00e9, de gr\u00e2ce, permets-moi de Te d\u00e9lier.\\nSi Tu aimes \u00eatre li\u00e9, permets-moi de Te lier avec les cha\u00eenes de l'amour\\nqui, \u00e9tant douces, all\u00e9geront tes Peines.\\nEt tandis que je Te d\u00e9lie, je veux m'unir \u00e0 Toi\\n- pour r\u00e9parer avec Toi les attachements mauvais de tous et\\n- pour donner \u00e0 tous les cha\u00eenes de l'Amour.\"},{\"id\":\"PASSION24.HOUR.13.P026\",\"n\":26,\"t\":\"Ainsi, nous emplirons les poitrines des cr\u00e9atures de ton Feu. Celui-ci a tant de force que Tu ne peux le contenir.\"},{\"id\":\"PASSION24.HOUR.13.P027\",\"n\":27,\"t\":\"Nous r\u00e9parerons\\n- toutes les froideurs, tous les plaisirs illicites et l'amour du confort,\\npour donner \u00e0 tous l'esprit de sacrifice et l'amour de la souffrance.\\nJe veux me fondre en tes Mains\\npour r\u00e9parer\\n- les \u0153uvres mauvaises, les miennes et celles de tous, et\\n- le bien mal fait ou fait avec pr\u00e9somption,\\npour donner \u00e0 tous le parfum de tes \u0152uvres.\"},{\"id\":\"PASSION24.HOUR.13.P028\",\"n\":28,\"t\":\"Je veux me fondre en tes Pieds et, pour r\u00e9parer,\\n- y enfermer tous les pas des cr\u00e9atures pour qu'elles cheminent \u00e0 ta suite.\\nMa douce Vie, permets que, me fondant en ton C\u0153ur,\\nJ'y renferme toutes les affections, les sentiments et les d\u00e9sirs des cr\u00e9atures,\\npour les r\u00e9parer avec Toi.\"},{\"id\":\"PASSION24.HOUR.13.P029\",\"n\":29,\"t\":\"Je donne \u00e0 tous tes Affections, tes Sentiments et tes D\u00e9sirs, afin que plus personne ne T\u2019offense. Et maintenant j'entends un bruit de clefs. Ce sont tes ennemis qui viennent Te prendre. J\u00e9sus, je tremble, je sens mon sang se glacer. Sous peu Tu seras de nouveau entre leurs mains. Qu'adviendra-t-il de Toi ?\"},{\"id\":\"PASSION24.HOUR.13.P030\",\"n\":30,\"t\":\"Ah ! il me semble entendre le bruit des clefs des saints tabernacles !\\nParfois ce sont des mains indignes\\n- qui viennent les ouvrir, et m\u00eame\\n- pour Te faire descendre dans des c\u0153urs sacril\u00e8ges !\"},{\"id\":\"PASSION24.HOUR.13.P031\",\"n\":31,\"t\":\"Combien de fois Te conduit-on\\n- dehors dans les rues, en procession ou\\n- pour donner le saint viatique,\\no\u00f9 Tu rencontres des personnes qui Te m\u00e9prisent et T\u2019outragent !\"},{\"id\":\"PASSION24.HOUR.13.P032\",\"n\":32,\"t\":\"Mon J\u00e9sus prisonnier,\\nje veux me trouver dans toutes tes prisons d'Amour\\n- pour \u00eatre spectatrice quand tes ministres Te lib\u00e8rent,\\n- pour Te tenir compagnie et\\n- pour r\u00e9parer les offenses que tu peux y recevoir !\"},{\"id\":\"PASSION24.HOUR.13.P033\",\"n\":33,\"t\":\"Mon J\u00e9sus, tes ennemis sont tout pr\u00e8s. Tu es en train de saluer le soleil levant, le dernier que Tu verras en tes jours mortels.\"},{\"id\":\"PASSION24.HOUR.13.P034\",\"n\":34,\"t\":\"Tandis qu'ils Te detachent, Te voyant tout majestueux et le Regard rempli d'Amour, ils Te d\u00e9cochent au Visage des gifles si fortes qu'elles font rougir tes divines Joues. Mon Amour, avant que Tu ne quittes la prison, je Te prie de me b\u00e9nir, pour que je re\u00e7oive assez de force pour Te suivre durant le reste de ta Passion.\"}],\"reflections\":[{\"id\":\"PASSION24.HOUR.13.REF.P001\",\"t\":\"J\u00e9sus, prisonnier, li\u00e9 \u00e0 une colonne et immobilis\u00e9,\\nest souill\u00e9 de crachats et de boue.\\nIl cherche notre \u00e2me pour qu'elle Lui tienne compagnie.\\nEt nous, sommes-nous contents d'\u00eatre seuls avec J\u00e9sus.\\nOu bien pr\u00e9f\u00e9rons-nous la compagnie des cr\u00e9atures ?\\nNotre respiration et nos battements de c\u0153ur sont-ils toujours pour J\u00e9sus ?\\nPour que nous soyons semblables \u00e0 Lui,\\nJ\u00e9sus lie notre \u00e2me au moyen\\n- des aridit\u00e9s,\\n- des oppressions,\\n- des souffrances et\\n- d'autres mortifications.\\nEt nous, sommes-nous contents de nous faire lier par J\u00e9sus dans la prison\\no\u00f9 son Amour nous place, c'est-\u00e0-dire l'obscurit\u00e9, les oppressions, etc. ?\\nJ\u00e9sus est en prison.\\nAvons-nous la force et la promptitude de nous emprisonner avec Lui\\npar amour pour Lui ?\"},{\"id\":\"PASSION24.HOUR.13.REF.P002\",\"t\":\"J\u00e9sus d\u00e9sire ardemment notre \u00e2me pour se sentir d\u00e9li\u00e9 et soutenu dans la douloureuse position dans laquelle Il se trouve.\"},{\"id\":\"PASSION24.HOUR.13.REF.P003\",\"t\":\"Et nous, d\u00e9sirons-nous ardemment\\n- que seul J\u00e9sus vienne nous tenir compagnie,\\n- qu'Il nous d\u00e9lie des cha\u00eenes des passions et\\n- qu\u2019Il nous lie \u00e0 son C\u0153ur au moyen de cha\u00eenes plus fortes.\"},{\"id\":\"PASSION24.HOUR.13.REF.P004\",\"t\":\"Mettons-nous nos peines autour de J\u00e9sus souffrant\\n- pour \u00e9loigner de Lui les crachats et la boue que les p\u00e9cheurs Lui envoient ?\\nDans sa prison, J\u00e9sus prie.\\nNotre pri\u00e8re est-elle constante avec Lui et comme Lui ?\\nMon J\u00e9sus encha\u00een\u00e9, Tu T\u2019es laiss\u00e9 emprisonner par Amour pour moi.\\nJe Te prie d\u2019emprisonner en Toi\\n- mon intelligence,\\n- ma langue,\\n- mon c\u0153ur,\\n- tout moi-m\u00eame,\\npour que je n'aie aucune libert\u00e9 et que Tu aies le contr\u00f4le absolu sur moi.\"}],\"subsections\":[]},{\"hour_id\":\"PASSION24.HOUR.14\",\"hour_number\":14,\"display_time\":\"6h \u00e0 7h\",\"title\":\"J\u00e9sus est ramen\u00e9 chez Ca\u00efphe, puis conduit chez Pilate\",\"short_title\":\"J\u00e9sus est ramen\u00e9 chez Ca\u00efphe, puis conduit chez Pilate\",\"source_pages\":[128,129,130],\"opening_prayer_ids\":[\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"],\"closing_prayer_ids\":[\"PASSION24.PRAYER.AFTER_EACH_HOUR\"],\"paragraphs\":[{\"id\":\"PASSION24.HOUR.14.P001\",\"n\":1,\"t\":\"Mon J\u00e9sus afflig\u00e9, on T\u2019a maintenant sorti de prison. Tu es si ext\u00e9nu\u00e9 que Tu vacilles \u00e0 chacun de tes Pas. Permets que je me tienne pr\u00e8s de Toi pour Te soutenir quand Tu seras sur le point de tomber. Je vois que les soldats Te pr\u00e9sentent de nouveau devant Ca\u00efphe.\"},{\"id\":\"PASSION24.HOUR.14.P002\",\"n\":2,\"t\":\"Et Toi, mon J\u00e9sus, Tu apparais parmi eux comme un Soleil. Et malgr\u00e9 que Tu sois d\u00e9figur\u00e9, Tu rayonnes de Lumi\u00e8re.\"},{\"id\":\"PASSION24.HOUR.14.P003\",\"n\":3,\"t\":\"Je m'aper\u00e7ois que Ca\u00efphe jubile de Te voir si mal en point. Devant ta Lumi\u00e8re, il devient encore plus aveugle. Dans sa fureur il recommence \u00e0 T\u2019interroger : \u00ab Donc, Tu es le Fils de Dieu ? \u00bb\"},{\"id\":\"PASSION24.HOUR.14.P004\",\"n\":4,\"t\":\"Et Toi, mon Amour, avec majest\u00e9, mais de ton Accent habituel, doux et \u00e9mouvant, Tu r\u00e9ponds : \u00ab Oui, Je suis le Fils de Dieu ! \u00bb\"},{\"id\":\"PASSION24.HOUR.14.P005\",\"n\":5,\"t\":\"Ces hommes iniques ressentent en eux toute la Force de ces Paroles. Ils \u00e9touffent en eux tout bon sentiment et ils crient d'une voix unanime : \u00ab Il est coupable de mort ! Il est coupable de mort. \u00bb Ca\u00efphe confirme la sentence de mort et T\u2019envoie \u00e0 Pilate.\"},{\"id\":\"PASSION24.HOUR.14.P006\",\"n\":6,\"t\":\"Toi, mon J\u00e9sus condamn\u00e9,\\nTu acceptes cette sentence du Pontife inique avec Amour et r\u00e9signation.\\nTu r\u00e9pares ainsi les p\u00e9ch\u00e9s commis d\u00e9lib\u00e9r\u00e9ment et avec malice,\\nles p\u00e9ch\u00e9s de ceux qui,\\n- au lieu de s'affliger du mal,\\n- jubilent et exultent du p\u00e9ch\u00e9 m\u00eame,\\nCeci les conduit \u00e0 la c\u00e9cit\u00e9 et au rejet de toute Lumi\u00e8re et de toute Gr\u00e2ce.\\nMa Vie, tes R\u00e9parations et tes Pri\u00e8res font \u00e9cho dans mon C\u0153ur.\\nJe veux r\u00e9parer et prier avec Toi.\"},{\"id\":\"PASSION24.HOUR.14.P007\",\"n\":7,\"t\":\"Mon doux Amour, je vois qu'en Te voyant condamn\u00e9 \u00e0 mort par Ca\u00efphe, les soldats ont perdu toute piti\u00e9. Ils T\u2019ajoutent des cordes et des cha\u00eenes. Ils Te serrent si fort qu'ils T\u2019enl\u00e8vent presque toute possibilit\u00e9 de mouvement. IIs Te poussent et Te tra\u00eenent pour Te faire sortir du palais. Des foules T\u2019attendent, mais il n'y a personne pour Te d\u00e9fendre. Toi, mon Soleil divin, Tu sors parmi eux pour les \u00e9clairer de ta Lumi\u00e8re. En faisant ces Pas, Tu veux renfermer dans les Tiens tous les pas des cr\u00e9atures. Tu pries et Tu r\u00e9pares pour ceux qui font leurs pas pour agir dans le mal, pour se venger, pour tuer, pour trahir, pour voler, etc. Et pour emp\u00eacher tant de mal, Tu pries, Tu r\u00e9pares et Tu T\u2019offres au P\u00e8re. \u00d4 J\u00e9sus, je vois qu'en descendant du palais de Ca\u00efphe Tu rencontres celle qui est ton Soleil, Marie, ta douce Maman. Vos Regards se rencontrent. Bien que vous soyez heureux de vous voir, des Douleurs particuli\u00e8res transpercent vos C\u0153urs :\"},{\"id\":\"PASSION24.HOUR.14.P008\",\"n\":8,\"t\":\"C\u2019est pour Toi la Douleur de voir ta Maman afflig\u00e9e, p\u00e2le et accabl\u00e9e par le deuil. C'est sa Douleur de Te voir Toi, Soleil divin, \u00e9clips\u00e9 par tant d'opprobres et tout couvert de Sang.\"},{\"id\":\"PASSION24.HOUR.14.P009\",\"n\":9,\"t\":\"Vous vivez aussi la Douleur de ne pouvoir \u00e9changer ne serait-ce qu'une parole. Vos C\u0153urs, cependant, se communiquent tout, se fondant l'un dans l'autre.\"},{\"id\":\"PASSION24.HOUR.14.P010\",\"n\":10,\"t\":\"Mais vous cessez rapidement de vous regarder, car les soldats Te poussent, \u00f4 mon J\u00e9sus. Et ainsi bouscul\u00e9 et tra\u00een\u00e9, Tu arrives chez le gouverneur romain Pilate.\"},{\"id\":\"PASSION24.HOUR.14.P011\",\"n\":11,\"t\":\"Mon J\u00e9sus, je m'unis \u00e0 ta Maman afflig\u00e9e pour Te suivre, en me fondant en Toi avec elle. Et Toi, me jetant un Regard d'Amour, Tu me b\u00e9nis !\"}],\"reflections\":[{\"id\":\"PASSION24.HOUR.14.REF.P001\",\"t\":\"J\u00e9sus sort \u00e0 la lumi\u00e8re du jour et on L'am\u00e8ne devant Ca\u00efphe. L\u00e0, avec fermet\u00e9, Il confirme qu'Il est le Fils de Dieu.\"},{\"id\":\"PASSION24.HOUR.14.REF.P002\",\"t\":\"Et nous, quand nous sortons, nous laissons-nous conduire par J\u00e9sus ? Sommes-nous des t\u00e9moins de la V\u00e9rit\u00e9 ? Notre comportement est-il un exemple pour les autres ? Nos pas conduisent-ils les \u00e2mes \u00e0 J\u00e9sus ?\"},{\"id\":\"PASSION24.HOUR.14.REF.P003\",\"t\":\"Mon J\u00e9sus, Saintet\u00e9 absolue, guide-moi. Fais en sorte que tout mon \u00eatre, y compris mon comportement ext\u00e9rieur, manifeste en moi ta Vie divine.\"}],\"subsections\":[]},{\"hour_id\":\"PASSION24.HOUR.15\",\"hour_number\":15,\"display_time\":\"7h \u00e0 8h\",\"title\":\"J\u00e9sus est devant Pilate, puis devant H\u00e9rode\",\"short_title\":\"J\u00e9sus est devant Pilate, puis devant H\u00e9rode\",\"source_pages\":[131,132,133,134,135],\"opening_prayer_ids\":[\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"],\"closing_prayer_ids\":[\"PASSION24.PRAYER.AFTER_EACH_HOUR\"],\"paragraphs\":[{\"id\":\"PASSION24.HOUR.15.P001\",\"n\":1,\"t\":\"Mon Bien encha\u00een\u00e9, tes ennemis unis aux pr\u00eatres Te pr\u00e9sentent \u00e0 Pilate. Ils restent \u00e0 l'ext\u00e9rieur, dans l'atrium, pour ne pas \u00eatre souill\u00e9s. Ils doivent demain f\u00eater la P\u00e2que et ils ne veulent pas affecter leur \u2018saintet\u00e9\u2019 et leur \u2018rectitude\u2019.\"},{\"id\":\"PASSION24.HOUR.15.P002\",\"n\":2,\"t\":\"Toi, mon Amour, \u00e0 travers leur malice,\\nTu r\u00e9pares toutes les hypocrisies des gens d'\u00c9glise.\\nJe veux r\u00e9parer avec Toi.\\nTu Te pr\u00e9occupes de leur bien.\\nEux, au contraire,\\n- commencent \u00e0 T\u2019accuser aupr\u00e8s du tribun,\\n- vomissant contre Toi tout le venin qu'ils portent dans leur c\u0153ur.\"},{\"id\":\"PASSION24.HOUR.15.P003\",\"n\":3,\"t\":\"Mais,\\n- pas satisfait des accusations qu'ils portent contre Toi et\\n- pour pouvoir mieux \u00e9tayer son jugement,\\nPilate T\u2019appelle \u00e0 l'\u00e9cart, et examine ta situation en priv\u00e9.\"},{\"id\":\"PASSION24.HOUR.15.P004\",\"n\":4,\"t\":\"Il Te demande : \u00ab Es-Tu le roi des Juifs ? \u00bb Et Toi, mon vrai Roi J\u00e9sus, Tu r\u00e9ponds :\"},{\"id\":\"PASSION24.HOUR.15.P005\",\"n\":5,\"t\":\"\u00ab Mon R\u00e8gne n'est pas de ce monde. Si mon R\u00e8gne \u00e9tait de ce monde, mes ministres feraient tous leurs efforts pour que Je ne sois pas remis au pouvoir des Juifs. \u00bb Pilate est surpris et touch\u00e9 par la suavit\u00e9 et la dignit\u00e9 de tes Paroles, et il Te dit : \u00ab Comment, Tu es roi ? \u00bb\"},{\"id\":\"PASSION24.HOUR.15.P006\",\"n\":6,\"t\":\"Et Tu reprends : \u00ab Je le suis, et Je suis venu dans le monde pour enseigner la V\u00e9rit\u00e9. \u00bb\"},{\"id\":\"PASSION24.HOUR.15.P007\",\"n\":7,\"t\":\"Pilate Te demande ce que c'est, la V\u00e9rit\u00e9, mais il n'attend pas la r\u00e9ponse. Convaincu de ton innocence, il sort sur la terrasse et il dit : \u00ab Moi, je ne trouve aucune faute en cet homme. \u00bb\"},{\"id\":\"PASSION24.HOUR.15.P008\",\"n\":8,\"t\":\"Les Juifs, enrag\u00e9s, T\u2019accusent de beaucoup d'autres choses.\\nToi, Tu Te tais et ne Te d\u00e9fends pas.\\nAinsi,\\n- Tu r\u00e9pares les faiblesses des juges quand ils font face aux personnes\\nviolentes,\\n- Tu pries pour les innocents opprim\u00e9s et abandonn\u00e9s.\"},{\"id\":\"PASSION24.HOUR.15.P009\",\"n\":9,\"t\":\"Voyant la fureur de tes ennemis et pour se tirer une \u00e9pine du pied, Pilate T\u2019envoie chez H\u00e9rode.\"},{\"id\":\"PASSION24.HOUR.15.P010\",\"n\":10,\"t\":\"J\u00e9sus est devant H\u00e9rode\"},{\"id\":\"PASSION24.HOUR.15.P011\",\"n\":11,\"t\":\"Mon Roi divin, je veux\\n- participer \u00e0 tes Pri\u00e8res et tes R\u00e9parations, et\\n- T\u2019accompagner jusque chez H\u00e9rode.\\nJe vois que, furieux, tes ennemis voudraient Te d\u00e9vorer.\\nIls Te conduisent chez H\u00e9rode parmi les insultes et les moqueries.\"},{\"id\":\"PASSION24.HOUR.15.P012\",\"n\":12,\"t\":\"H\u00e9rode, content de Te voir, Te pose beaucoup de questions. Toi, Tu ne r\u00e9ponds rien. Tu ne le regardes m\u00eame pas.\"},{\"id\":\"PASSION24.HOUR.15.P013\",\"n\":13,\"t\":\"Il est irrit\u00e9\\n- parce que ses curiosit\u00e9s ne sont pas satisfaites, et\\n- en se sentant humili\u00e9 par ton silence.\\nIl proclame devant tous que Tu es un fou.\\nIl ordonne que Tu sois trait\u00e9 comme un fou.\\nAinsi\\n- il Te fait rev\u00eatir d'un v\u00eatement blanc et\\n- il Te met entre les mains des soldats, afin qu'ils Te bafouent le plus possible.\"},{\"id\":\"PASSION24.HOUR.15.P014\",\"n\":14,\"t\":\"Mon innocent J\u00e9sus, personne ne trouve de faute en Toi.\\nSeuls les Juifs en trouvent, parce que leur religiosit\u00e9\\n- est affect\u00e9e et\\n- emp\u00eache la Lumi\u00e8re de la V\u00e9rit\u00e9 de resplendir dans leur intelligence.\\nMon J\u00e9sus, Sagesse infinie,\\nquelles Souffrances d\u2019\u00eatre d\u00e9clar\u00e9 fou par H\u00e9rode !\"},{\"id\":\"PASSION24.HOUR.15.P015\",\"n\":15,\"t\":\"Les soldats T\u2019abusent de Toi : ils\\n- Te jettent par terre, Te foulent aux pieds,\\n- Te souillent de crachats, Te bafouent,\\n- Te battent \u00e0 coups de b\u00e2ton.\"},{\"id\":\"PASSION24.HOUR.15.P016\",\"n\":16,\"t\":\"Les peines, les humiliations et les opprobres que Tu re\u00e7ois sont tels et si nombreux, que les anges pleurent et se couvrent le visage de leurs ailes pour ne pas Te voir si brutalis\u00e9. Moi aussi, \u00f4 mon doux J\u00e9sus, je veux T\u2019appeler fou, mais fou d'Amour.\"},{\"id\":\"PASSION24.HOUR.15.P017\",\"n\":17,\"t\":\"Elle est si grande ta folie d'Amour,\\nqu'au lieu de Te froisser de tout ce qu'on Te fait,\\nTu pries et r\u00e9pares\\n- pour les rois qui \u00e9tablissent leur r\u00e8gne en ruinant des peuples,\\n- pour les nombreux massacres qu'ils font,\\n- pour le sang qu'ils font couler par caprice,\\n- pour leurs p\u00e9ch\u00e9s de curiosit\u00e9,\\n- pour les fautes commises dans les cours et dans les arm\u00e9es.\\nMon J\u00e9sus, quel spectacle \u00e9mouvant de Te voir prier et r\u00e9parer\\navec mansu\u00e9tude et fid\u00e9lit\u00e9 au milieu de tant d'outrages !\\nTes Pri\u00e8res se r\u00e9percutent dans mon c\u0153ur.\\nMaintenant, laisse-moi, J\u00e9sus,\\n- me tenir pr\u00e8s de Toi,\\n- prendre part \u00e0 tes Peines et\\n- Te consoler par mon amour.\"},{\"id\":\"PASSION24.HOUR.15.P018\",\"n\":18,\"t\":\"Pour \u00e9loigner de Toi tes ennemis et Te r\u00e9conforter,\\nlaisse-moi Te prendre entre mes bras.\\nMon J\u00e9sus,\\nje donne un baiser \u00e0 ton Front infiniment saint.\\n- Par toutes les Peines que Tu subis, purifie mes pens\u00e9es.\\nJe donne un baiser \u00e0 tes Yeux \u00e9tincelants de Lumi\u00e8re. Que cette Lumi\u00e8re\\nm'entoure et p\u00e9n\u00e8tre mes pens\u00e9es, regards, mes paroles et mon c\u0153ur.\"},{\"id\":\"PASSION24.HOUR.15.P019\",\"n\":19,\"t\":\"Je donne un baiser \u00e0 tes Oreilles infiniment saintes. Sanctifie mes oreilles.\\nJe donne un baiser ton doux et saint Visage.\\nFais-moi m'\u00e9prendre de ta Beaut\u00e9, moi et toutes les cr\u00e9atures,\\n- pour Te d\u00e9dommager de toutes les insultes et les moqueries\\nque Tu re\u00e7ois au palais d'H\u00e9rode.\"},{\"id\":\"PASSION24.HOUR.15.P020\",\"n\":20,\"t\":\"Je donne un baiser \u00e0 ta sainte Bouche. Donne-moi la Gr\u00e2ce de ne jamais dire des paroles qui pourraient offenser ta divine Personne. Je veux r\u00e9parer toutes les offenses que Te font les autres. J'\u00e9tends tes Bras divins et je Te serre fort sur mon c\u0153ur. Je Te prie de bien vouloir imprimer ton Image dans mon intelligence, mon c\u0153ur, mes \u0153uvres, dans tout.\"},{\"id\":\"PASSION24.HOUR.15.P021\",\"n\":21,\"t\":\"Je donne un baiser \u00e0 ta Main droite. Distribue tes Gr\u00e2ces efficaces pour la conversion des p\u00e9cheurs. Donne \u00e0 tous les fruits salutaires de tes Actes infiniment saints. Je donne un baiser \u00e0 ta Main gauche. Imprime en moi tes Vertus et surtout ta Charit\u00e9.\"},{\"id\":\"PASSION24.HOUR.15.P022\",\"n\":22,\"t\":\"Je donne un baiser \u00e0 ton Pied gauche. Donne-moi la connaissance de moi-m\u00eame. Je donne un baiser \u00e0 ton Pied droit. Donne-moi la Gr\u00e2ce d'ob\u00e9ir avec promptitude.\"},{\"id\":\"PASSION24.HOUR.15.P023\",\"n\":23,\"t\":\"Je donne un baiser \u00e0 ton C\u0153ur infiniment pur. Consume-moi dans les Flammes ardentes de ton Amour ! Mon doux Amour, je vois que ces sinistres individus ne Te donnent aucun r\u00e9pit et qu'H\u00e9rode Te renvoie \u00e0 Pilate. Si ta premi\u00e8re venue chez Pilate fut douloureuse, ta seconde l'est plus encore. Parce que je vois que les Juifs sont plus enrag\u00e9s qu'avant, et que c'est \u00e0 tout prix qu'ils ont r\u00e9solu de Te faire mourir.\"},{\"id\":\"PASSION24.HOUR.15.P024\",\"n\":24,\"t\":\"Par cons\u00e9quent, avant que Tu ne sortes du palais d'H\u00e9rode, je veux Te serrer sur mon c\u0153ur pour Te t\u00e9moigner mon amour.\"},{\"id\":\"PASSION24.HOUR.15.P025\",\"n\":25,\"t\":\"Et Toi, fortifie-moi par ton Baiser mystique et par ta B\u00e9n\u00e9diction. Je Te suivrai jusque devant Pilate.\"}],\"reflections\":[{\"id\":\"PASSION24.HOUR.15.REF.P001\",\"t\":\"J\u00e9sus est pr\u00e9sent\u00e9 \u00e0 Pilate au milieu de tant d'insultes et de m\u00e9pris. Il reste toujours doux. Il ne d\u00e9daigne personne et chez tous Il cherche \u00e0 faire resplendir la Lumi\u00e8re de la V\u00e9rit\u00e9.\"},{\"id\":\"PASSION24.HOUR.15.REF.P002\",\"t\":\"Et nous, cherchons-nous \u00e0 vaincre notre mauvaise humeur si quelqu'un ne nous t\u00e9moigne pas d'amiti\u00e9 ?\"},{\"id\":\"PASSION24.HOUR.15.REF.P003\",\"t\":\"Quand nous avons affaire aux cr\u00e9atures, cherchons-nous toujours\\n- \u00e0 faire conna\u00eetre J\u00e9sus et\\n- \u00e0 faire resplendir pour elles la Lumi\u00e8re de sa V\u00e9rit\u00e9 ?\"},{\"id\":\"PASSION24.HOUR.15.REF.P004\",\"t\":\"\u00d4 J\u00e9sus, ma douce Vie, mets sur mes l\u00e8vres tes Paroles et fais que je parle toujours avec ta Langue. Devant H\u00e9rode, J\u00e9sus se tait quand on l'habille comme un fou. Il souffre des Peines inou\u00efes.\"},{\"id\":\"PASSION24.HOUR.15.REF.P005\",\"t\":\"Et nous, quand nous sommes calomni\u00e9s, bafou\u00e9s, insult\u00e9s, raill\u00e9s, pensons-nous que le Seigneur veut nous faire ressembler \u00e0 Lui ?\"},{\"id\":\"PASSION24.HOUR.15.REF.P006\",\"t\":\"Dans nos peines, ou lorsque les autres nous m\u00e9prisent,\\n- ou en tout ce que notre pauvre c\u0153ur peut ressentir,\\npensons-nous que c'est J\u00e9sus qui, par sa Touche divine,\\n- nous donne ces souffrances et - nous transforme en Lui-m\u00eame ?\\nEt quand la souffrance recommence pour nous,\\npensons-nous que J\u00e9sus, nous visitant de nouveau, - nous donne une autre\\n\u00e9treinte pour pouvoir nous faire ressembler tout \u00e0 fait \u00e0 Lui ?\\n\u00c0 l'exemple de J\u00e9sus, avons-nous la ma\u00eetrise de nous-m\u00eames ?\\nAu lieu de r\u00e9pliquer lors des contrari\u00e9t\u00e9s, savons-nous nous taire ?\\nNous laissons-nous vaincre par la curiosit\u00e9 ?\\nMon Amour et mon Tout,\\nsois le seul \u00e0 prendre la ma\u00eetrise de mon c\u0153ur, et tiens-le entre tes Mains,\\nafin que dans mes rencontres, je puisse reproduire en moi ta grande Patience.\"}],\"subsections\":[]},{\"hour_id\":\"PASSION24.HOUR.16\",\"hour_number\":16,\"display_time\":\"8h \u00e0 9h\",\"title\":\"Barabbas est pr\u00e9f\u00e9r\u00e9 \u00e0 J\u00e9sus \u2013 La flagellation\",\"short_title\":\"Barabbas est pr\u00e9f\u00e9r\u00e9 \u00e0 J\u00e9sus \u2013 La flagellation\",\"source_pages\":[136,137,138,139,140,141,142],\"opening_prayer_ids\":[\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"],\"closing_prayer_ids\":[\"PASSION24.PRAYER.AFTER_EACH_HOUR\"],\"paragraphs\":[{\"id\":\"PASSION24.HOUR.16.P001\",\"n\":1,\"t\":\"Mon J\u00e9sus tourment\u00e9, mon pauvre c\u0153ur Te suit au milieu de tes anxi\u00e9t\u00e9s et de tes peines.\"},{\"id\":\"PASSION24.HOUR.16.P002\",\"n\":2,\"t\":\"Te voyant v\u00eatu comme un fou et sachant que Tu es la Sagesse infinie qui\\ndonne le discernement \u00e0 tous, mon c\u0153ur tombe en d\u00e9lire et dit :\\n\u00ab Comment ! J\u00e9sus fou ? J\u00e9sus malfaiteur ? \u00bb\\nMon J\u00e9sus, Saintet\u00e9 sans pareille, Te voil\u00e0 de nouveau devant Pilate.\\nEt lui, Il Te voit\\n- si mal en point,\\n- v\u00eatu comme un fou.\\nIl constate que Tu n'as pas \u00e9t\u00e9 condamn\u00e9 par H\u00e9rode.\"},{\"id\":\"PASSION24.HOUR.16.P003\",\"n\":3,\"t\":\"Alors il est encore plus indign\u00e9 contre les Juifs. Il se convainc davantage de ton innocence et il ne veut pas Te condamner.\"},{\"id\":\"PASSION24.HOUR.16.P004\",\"n\":4,\"t\":\"Il veut toutefois donner quelque satisfaction aux Juifs\\n- pour apaiser leur haine et la soif ardente qu'ils ont de ton Sang.\\nIl Te pr\u00e9sente aux c\u00f4t\u00e9s de Barabbas. Mais les Juifs crient :\\n\u00ab Nous ne voulons pas que J\u00e9sus soit lib\u00e9r\u00e9, mais Barabbas.\\nQue J\u00e9sus de Nazareth soit crucifi\u00e9 ! \u00bb\\n\u00d4 comble de l'ingratitude humaine !\\nUn peuple auquel Tu as fait tant de bien,\\n- Te fait maintenant passer apr\u00e8s un grand malfaiteur et\\n- Te condamne au supplice de la croix !\"},{\"id\":\"PASSION24.HOUR.16.P005\",\"n\":5,\"t\":\"Ne sachant que faire pour les calmer, Pilate Te condamne \u00e0 la Flagellation ! Mon J\u00e9sus, mon c\u0153ur se brise en voyant qu'on a pr\u00e9f\u00e9r\u00e
