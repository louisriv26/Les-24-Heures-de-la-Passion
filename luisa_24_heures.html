\u0153ur s'entendront l'un l'autre et se confondront,\\nde sorte qu'ils me donneront\\n- vie, amour, et union \u00e9troite et ins\u00e9parable avec Toi.\"},{\"id\":\"PASSION24.PRAYER.AFTER_EACH_HOUR.P012\",\"t\":\"Mon J\u00e9sus, si Tu vois que je suis sur le point de Te fuir, que tes Battements de C\u0153ur s'acc\u00e9l\u00e8rent dans mon c\u0153ur, que tes Mains me pressent plus fortement sur ton C\u0153ur, que tes Yeux me regardent et me jettent des fl\u00e8ches de feu, afin que, Te ressentant, je me laisse tout de suite gagner \u00e0 rester avec Toi.\"},{\"id\":\"PASSION24.PRAYER.AFTER_EACH_HOUR.P013\",\"t\":\"Je T'en prie, \u00f4 mon J\u00e9sus, donne-moi le Baiser de l'Amour divin et b\u00e9nis-moi. Et moi, je baise ton C\u0153ur infiniment doux et je reste en Toi. Que la b\u00e9n\u00e9diction de Dieu, le Tout-Puissant, P\u00e8re et Fils et Esprit-Saint, descende sur moi et y demeure \u00e0 jamais. Amen.\"}]},{\"prayer_id\":\"PASSION24.PRAYER.HOLY_HOUR_PREPARATION\",\"title\":\"Oraison pr\u00e9paratoire \u00e0 l\u2019Heure Sainte\",\"prayer_type\":\"holy_hour_preparation\",\"paragraphs\":[{\"id\":\"PASSION24.PRAYER.HOLY_HOUR_PREPARATION.P001\",\"t\":\"Oraison pr\u00e9paratoire \u00e0 l'Heure Sainte\"},{\"id\":\"PASSION24.PRAYER.HOLY_HOUR_PREPARATION.P002\",\"t\":\"\u00d4 J\u00e9sus, mon divin R\u00e9dempteur, daigne m'admettre aux c\u00f4t\u00e9s de tes trois chers ap\u00f4tres, pour assister \u00e0 ton Agonie dans le Jardin des Oliviers !\"},{\"id\":\"PASSION24.PRAYER.HOLY_HOUR_PREPARATION.P003\",\"t\":\"Bien averti par le doux reproche que tu fis \u00e0 Pierre et aux deux autres qui dormaient, je veux veiller une heure avec Toi. Fais-moi ressentir au moins une Blessure de ton C\u0153ur agonisant, un Souffle de ta Respiration perturb\u00e9e.\"},{\"id\":\"PASSION24.PRAYER.HOLY_HOUR_PREPARATION.P004\",\"t\":\"Je veux fixer mon regard sur ton divin Visage et le contempler quand il p\u00e2lit, quand il s'\u00e9meut, quand il ressent une grande angoisse, quand il s'incline jusqu'\u00e0 terre !\"},{\"id\":\"PASSION24.PRAYER.HOLY_HOUR_PREPARATION.P005\",\"t\":\"Je vois, \u00f4 mon J\u00e9sus, ta divine Personne vaciller et tomber, tant\u00f4t d'un c\u00f4t\u00e9,\"},{\"id\":\"PASSION24.PRAYER.HOLY_HOUR_PREPARATION.P006\",\"t\":\"tant\u00f4t de l'autre. Je Te vois joindre les Mains.\"},{\"id\":\"PASSION24.PRAYER.HOLY_HOUR_PREPARATION.P007\",\"t\":\"J'entends les g\u00e9missements d'Amour et de Souffrance que Tu \u00e9l\u00e8ves vers le Ciel ! \u00d4 mon J\u00e9sus, agonisant dans ce sombre Jardin, pendant cette heure o\u00f9 je Te tiendrai compagnie, fais couler sur moi quelques gouttes du Sang infiniment adorable qui s'\u00e9coule de tous tes Membres !\"},{\"id\":\"PASSION24.PRAYER.HOLY_HOUR_PREPARATION.P008\",\"t\":\"De gr\u00e2ce, \u00f4 mon bien-aim\u00e9 R\u00e9dempteur,\\nque je boive au moins une gorg\u00e9e de ton amer calice,\\nque je ressente quelques-unes des Peines de ton divin C\u0153ur, et\\nque je sente mon c\u0153ur se briser par le repentir d'avoir offens\u00e9 mon Seigneur\\n- qui, pour moi, en est r\u00e9duit \u00e0 cette Agonie terrible !\\n\u00d4 mon J\u00e9sus, donne-moi la Gr\u00e2ce de souffrir et de pleurer avec Toi pendant au\\nmoins une heure dans ce Jardin !\"},{\"id\":\"PASSION24.PRAYER.HOLY_HOUR_PREPARATION.P009\",\"t\":\"\u00d4 Marie, M\u00e8re afflig\u00e9e, fais-moi ressentir la compassion de ton C\u0153ur transperc\u00e9 envers J\u00e9sus agonisant. Amen.\"}]},{\"prayer_id\":\"PASSION24.PRAYER.HOLY_HOUR_THANKSGIVING\",\"title\":\"Pri\u00e8re de remerciement pour l\u2019Heure Sainte\",\"prayer_type\":\"holy_hour_thanksgiving\",\"paragraphs\":[{\"id\":\"PASSION24.PRAYER.HOLY_HOUR_THANKSGIVING.P001\",\"t\":\"Je Te rends gr\u00e2ce, \u00f4 mon infiniment doux Seigneur, d'avoir daign\u00e9 m'admettre en ta sainte Compagnie pendant au moins une heure de ta terrible Agonie dans le Jardin.\"},{\"id\":\"PASSION24.PRAYER.HOLY_HOUR_THANKSGIVING.P002\",\"t\":\"Ce fut sans doute pour Toi un r\u00e9confort m\u00e9diocre, mais l'Amour infini de ton C\u0153ur compatissant Te fait trouver du soulagement m\u00eame dans le plus petit acte de compassion envers Toi !\"},{\"id\":\"PASSION24.PRAYER.HOLY_HOUR_THANKSGIVING.P003\",\"t\":\"Ah ! la vue de ton adorable Personne\\n- tremblante, abattue, humili\u00e9e, effondr\u00e9e dans la poussi\u00e8re,\\n- toute couverte de sueur de Sang dans la sombre horreur du Jardin\\nne me sortira plus de l'esprit !\"},{\"id\":\"PASSION24.PRAYER.HOLY_HOUR_THANKSGIVING.P004\",\"t\":\"Et j'ai \u00e9prouv\u00e9, \u00f4 J\u00e9sus, que d'\u00eatre avec Toi souffrant, de go\u00fbter ne serait-ce qu'une goutte de l'amertume angoissante de ton divin C\u0153ur, est le plus grand destin qu'on puisse avoir sur cette terre ! \u00d4 J\u00e9sus, c'est avec g\u00e9n\u00e9rosit\u00e9 que je renonce aux choses terrestres et trompeuses. Je ne veux que Toi, mon Seigneur opprim\u00e9, souffrant, afflig\u00e9 ! Du Jardin jusqu'au Calvaire je veux Te tenir compagnie avec fid\u00e9lit\u00e9 et douceur.\"},{\"id\":\"PASSION24.PRAYER.HOLY_HOUR_THANKSGIVING.P005\",\"t\":\"\u00d4 J\u00e9sus, fais en sorte que je sois captur\u00e9e avec Toi, tra\u00een\u00e9e avec Toi aux tribunaux. Fais que je partage les outrages, les insultes, les crachats et les gifles dont tes ennemis Te couvriront.\"},{\"id\":\"PASSION24.PRAYER.HOLY_HOUR_THANKSGIVING.P006\",\"t\":\"Conduis-moi avec Toi de Pilate \u00e0 H\u00e9rode et de H\u00e9rode \u00e0 Pilate.\\nLie-moi avec Toi \u00e0 la colonne\\net fais-moi ressentir une partie de tes coups de fouet.\\nDonne-moi quelques-unes de tes \u00e9pines, J\u00e9sus,\\n- pour qu\u2019elles me transpercent.\"},{\"id\":\"PASSION24.PRAYER.HOLY_HOUR_THANKSGIVING.P007\",\"t\":\"Fais en sorte qu'avec Toi je sois condamn\u00e9e \u00e0 mourir crucifi\u00e9e,\\n- Toi en tant que victime d'Amour pour moi,\\n- et moi en tant que victime expiatrice pour mes p\u00e9ch\u00e9s !\\nDonne-moi le destin du Cyr\u00e9n\u00e9en pour T'accompagner jusqu'au Calvaire.\\nL\u00e0, fais en sorte qu'avec Toi je sois clou\u00e9e sur la Croix,\\nque j'y agonise et y meure avec Toi.\"},{\"id\":\"PASSION24.PRAYER.HOLY_HOUR_THANKSGIVING.P008\",\"t\":\"\u00d4 M\u00e8re afflig\u00e9e,\\nqui m'as aid\u00e9e \u00e0 compatir avec J\u00e9sus agonisant dans le Jardin,\\naide-moi\\n- \u00e0 \u00eatre crucifi\u00e9e avec toi sur la Croix de J\u00e9sus, et\\n- de savoir Lui offrir les r\u00e9parations\\navec les m\u00e9rites m\u00eames de sa Passion et de sa Mort sur la Croix.\\nAmen.\"}]},{\"prayer_id\":\"PASSION24.PRAYER.DE_PROFUNDIS\",\"title\":\"De profundis / Psaume 129 (AELF)\",\"prayer_type\":\"psalm\",\"paragraphs\":[{\"id\":\"PASSION24.PRAYER.DE_PROFUNDIS.P001\",\"t\":\"Psaume 129 \u2014 De profundis (AELF)\"},{\"id\":\"PASSION24.PRAYER.DE_PROFUNDIS.P002\",\"t\":\"01 Des profondeurs je crie vers toi, Seigneur,\\n02 Seigneur, \u00e9coute mon appel !\\nQue ton oreille se fasse attentive\\nau cri de ma pri\u00e8re !\\n03 Si tu retiens les fautes, Seigneur,\\nSeigneur, qui subsistera ?\\n04 Mais pr\u00e8s de toi se trouve le pardon\\npour que l\u2019homme te craigne.\"},{\"id\":\"PASSION24.PRAYER.DE_PROFUNDIS.P003\",\"t\":\"05 J\u2019esp\u00e8re le Seigneur de toute mon \u00e2me ;\\nje l\u2019esp\u00e8re, et j\u2019attends sa parole.\\n06 Mon \u00e2me attend le Seigneur\\nplus qu\u2019un veilleur ne guette l\u2019aurore.\\nPlus qu\u2019un veilleur ne guette l\u2019aurore,\\n07 attends le Seigneur, Isra\u00ebl.\\nOui, pr\u00e8s du Seigneur, est l\u2019amour ;\\npr\u00e8s de lui, abonde le rachat.\\n08 C\u2019est lui qui rach\u00e8tera Isra\u00ebl\\nde toutes ses fautes.\"},{\"id\":\"PASSION24.PRAYER.DE_PROFUNDIS.P004\",\"t\":\"Gloire au P\u00e8re, au Fils et au Saint-Esprit, maintenant et toujours et pour les si\u00e8cles des si\u00e8cles. Amen\"}]}],\"sections\":[{\"section_id\":\"PASSION24.SECTION.INTRODUCTION\",\"segment_type\":\"INTRODUCTION\",\"title\":\"Introduction\",\"display_text\":\"INTRODUCTION\\n\\nAvec toute la r\u00e9serve n\u00e9cessaire, dans la soumission la plus parfaite au jugement de la sainte \u00c9glise, sans faire appel \u00e0 une autre foi que la foi humaine et conform\u00e9ment au d\u00e9cret du Pape Urbain VIII, nous transcrivons ici des r\u00e9v\u00e9lations priv\u00e9es que Notre-Seigneur J\u00e9sus-Christ a faites \u00e0 la servante de Dieu Luisa Piccarreta, \u00e0 qui il inspira cet ouvrage.\\n\\nCitons ici une lettre envoy\u00e9e par Luisa au R\u00e9v\u00e9rend Canon Di Francia :\\n\\n\u00ab Mon tr\u00e8s R\u00e9v\u00e9rend P\u00e8re,\\n\\nEnfin, voici que je vous remets le texte des Heures de la Passion. Je l'ai \u00e9crit tout \u00e0 la gloire de Notre-Seigneur. Je joins \u00e0 la pr\u00e9sente un autre feuillet qui mentionne l'affection toute particuli\u00e8re et les belles promesses de J\u00e9sus envers ceux qui pratiqueront ces Heures.\\n\\nJe crois que si celui qui les m\u00e9dite est un p\u00e9cheur, il se convertira, s'il est imparfait, il deviendra parfait, s'il est saint, il deviendra plus saint, s'il est tent\u00e9, il trouvera la victoire, s'il est souffrant, il trouvera la force, le rem\u00e8de, le r\u00e9confort ; et si son \u00e2me est faible et pauvre, il trouvera un aliment spirituel et un miroir o\u00f9 il pourra se regarder continuellement pour s'embellir et se rendre semblable \u00e0 J\u00e9sus notre mod\u00e8le.\\n\\nLe contentement qu'\u00e9prouve J\u00e9sus lorsqu'on m\u00e9dite ces Heures est si grand qu'Il voudrait qu'il y en ait au moins une copie dans chaque village ou cit\u00e9 pour qu'on puisse en faire la m\u00e9ditation.\\n\\n\u00c0 travers ces m\u00e9ditations, J\u00e9sus entend sa propre voix et ses propres Pri\u00e8res telles qu'Il les adressait \u00e0 son P\u00e8re durant les 24 Heures de sa Passion.\\n\\nEt si un assez grand nombre d'\u00e2mes s'y adonnent dans chaque village ou cit\u00e9, il semble que J\u00e9sus me fait savoir que la Justice divine en sera partiellement apais\u00e9e. Et, en cette triste \u00e9poque de calamit\u00e9s et d'effusion de sang,\\n\\nces fl\u00e9aux seront partiellement arr\u00eat\u00e9s.\\n\\nFaites appel \u00e0 tous, R\u00e9v\u00e9rend P\u00e8re, et propagez ce petit ouvrage que mon aimable J\u00e9sus m'a demand\u00e9 de r\u00e9diger.\\n\\nJe vous dis aussi que le but de ces \u00e9crits\\n- n'est pas tant de raconter l'histoire de la Passion de Notre-Seigneur\\ncar il y a beaucoup de livres qui traitent de ce sujet et il ne serait pas\\nn\u00e9cessaire d'en \u00e9crire un autre,\\n\\nc\u2019est d'inciter le lecteur \u00e0 la r\u00e9paration, ce que nous avons fait en adjoignant aux divers points de la Passion des suggestions \u00e0 ce sujet.\\n\\nPar exemple,\\n- dans certains passages, on b\u00e9nit J\u00e9sus,\\n- dans d'autres, on compatit avec Lui,\\n- dans d'autres, on Le loue,\\n- dans d'autres on Le r\u00e9conforte,\\n- dans d'autres on rach\u00e8te \u00e0 ses c\u00f4t\u00e9s,\\n- dans d'autres on prie, on demande, on supplie.\\n\\nPar cons\u00e9quent, je vous laisse le soin, R\u00e9v\u00e9rend P\u00e8re, de faire conna\u00eetre le but de ces \u00c9crits dans une pr\u00e9face. \u00bb\"},{\"section_id\":\"PASSION24.SECTION.BENEFITS\",\"segment_type\":\"BENEFITS_AND_PROMISES\",\"title\":\"Promesses et bienfaits\",\"display_text\":\"L'affection toute particuli\u00e8re et les belles promesses de J\u00e9sus envers ceux qui pratiqueront ces Heures.\\n\\nLe feuillet dont il est question plus haut contient quelques passages de Paroles que Notre-Seigneur a dites \u00e0 Luisa.\\n\\nLDC 7 - 9 novembre 1906 - L\u2019\u00e2me qui m\u00e9dite souvent ma Passion me donne beaucoup de r\u00e9confort.\\n\\nLorsqu'une \u00e2me m\u00e9dite sur la Passion\\n- que Je souffris dans mon \u00e2me et mon corps\\n- avec tant d'Amour et de Souffrances infinies,\\net lorsqu'elle s'afflige et compatit avec Moi,\\n\\ncela m'est tellement agr\u00e9able que Je me sens comme d\u00e9dommag\u00e9 de toutes\\nles tortures et les ignominies que J'ai subies,\\n- non seulement dans ma Passion,\\n- mais \u00e0 partir du moment de mon Incarnation\\njusqu' \u00e0 mon dernier souffle sur la Croix.\\n\\nL'\u00e2me qui m\u00e9dite souvent sur ma Passion me r\u00e9conforte de diverses fa\u00e7ons :\\n\\nSi, durant ma Passion, on Me lia avec des cordes et des cha\u00eenes, l'\u00e2me qui Me consid\u00e8re ainsi attach\u00e9 et compatit avec Moi, Me d\u00e9lie et Me rend la libert\u00e9.\\n\\nSi les hommes d'armes Me m\u00e9pris\u00e8rent, Me crach\u00e8rent dessus\\n- et Me d\u00e9shonor\u00e8rent,\\nL'\u00e2me compatissante Me donne de l'estime,\\n- Me lave de ces crachats et M'honore.\\n\\nSi mes bourreaux Me d\u00e9v\u00eatirent et Me flagell\u00e8rent, l'\u00e2me compatissante Me gu\u00e9rit et M'habille.\\n\\nSi on Me couronna d'\u00e9pines, si on Me traita comme un roi de plaisanterie, si on Me remplit la bouche de fiel et Me crucifia,\\n\\nL'\u00e2me qui consid\u00e8re avec compassion toutes ces souffrances,\\n- Me couronne de Gloire, M'honore comme son Roi,\\n- Me remplit la bouche de douceur,\\n- Me d\u00e9cloue de la Croix et\\n- Me fait ressusciter dans son c\u0153ur.\\nEt, en \u00e9change\\n- de sa m\u00e9ditation amoureuse et\\n- de sa consid\u00e9ration pour mes peines,\\nJe donne \u00e0 cette \u00e2me une vie de gr\u00e2ces renouvel\u00e9e.\\n\\nTandis qu'elle M'attire \u00e0 elle\\n- par la contemplation de mes Souffrances et par sa compassion,\\nJe l'attire \u00e0 Moi et Je Me donne \u00e0 elle comme Aliment spirituel.\\n\\nTandis qu'elle se nourrit\\n- de mes Plaies, de mes Opprobres et des Agonies de mon C\u0153ur,\\nJe me nourris\\n- de son \u00e2me en l\u2019absorbant en Moi-m\u00eame dans l'Amour.\\n\\nVoil\u00e0 pourquoi la m\u00e9ditation d\u00e9vote et fr\u00e9quente de ma Passion M'est si agr\u00e9able. \u00bb\\n\\nLDC 11 - 10 avril 1913 - M\u00e9diter sur ma Passion fait na\u00eetre dans le c\u0153ur une source salutaire.\\n\\n\u00ab Celui qui pense souvent \u00e0 ma Passion fait na\u00eetre dans son c\u0153ur comme une source salutaire. Plus l'\u00e2me s'applique \u00e0 r\u00e9fl\u00e9chir et \u00e0 m\u00e9diter sur ma douloureuse Passion, plus le d\u00e9bit de cette source augmente.\\n\\nLes eaux qui coulent d'une fontaine sont des eaux pour tous,\\nDe m\u00eame, cette source de salut, qui se forme dans le c\u0153ur de celui qui m\u00e9dite\\nsur ma Passion, sert\\n- \u00e0 ma Gloire,\\n- au bien personnel de cette \u00e2me et\\n- au profit de beaucoup d'autres \u00e2mes. \u00bb\\n\\nLDC 11 - 10 avril 1913 - Luisa demande \u00e0 J\u00e9sus ce qu\u2019Il va donner en \u00e9change de cette m\u00e9ditation.\\n\\nLuisa demanda \u00e0 J\u00e9sus : \u00ab Dis-moi, \u00d4 mon Bien, que donneras-Tu en \u00e9change aux \u00e2mes qui m\u00e9diteront les Heures de ta Passion comme Tu me l'as enseign\u00e9 ? \u00bb\\n\\nNotre-Seigneur r\u00e9pondit : \u00ab Ma fille, ces Heures, Je ne les consid\u00e9rerai pas comme des choses provenant de vous, mais comme si c'\u00e9tait Moi qui les faisais.\\n\\n\u00c0 ceux qui les m\u00e9diteront, Je donnerai mes M\u00e9rites\\n- comme si Je souffrais la Passion durant ce temps qu'ils les m\u00e9ditent.\\n\\nLes effets\\n- que produisait ma Passion quand Je l'endurais, et\\n- qu'elle peut produire \u00e0 toute \u00e9poque,\\nseront renouvel\u00e9s dans les \u00e2mes qui m\u00e9diteront sur ces Heures,\\nselon la qualit\u00e9 de leurs dispositions int\u00e9rieures.\\n\\nIl n 'y a pas de r\u00e9compense plus grande que celle-l\u00e0 qu'on puisse recevoir en cette vie terrestre.\\n\\nAu Paradis, Je mettrai ces \u00e2mes en ma Pr\u00e9sence divine, devant ma Face,\\nJe les darderai de fl\u00e8ches d'Amour et de contentements \u00e9ternels.\\nEt, elles-m\u00eames, enivr\u00e9es de mon Amour,\\n- me r\u00e9pondront en dardant mon C\u0153ur de toute la capacit\u00e9 d'amour\\nqu'aura leur \u00e2me dans la b\u00e9atitude c\u00e9leste.\\n\\nCeci constituera un doux enchantement pour tous les bienheureux du Ciel (c'est-\u00e0-dire toutes les cr\u00e9atures qui jouissent de la vue parfaite de Dieu). \u00bb\\n\\nLDC 11 - 6 septembre 1913 - Les Heures de la Passion sont issues du tr\u00e9fonds du C\u0153ur de J\u00e9sus.\\n\\nJe pensais aux Heures de la Passion et au fait qu'elles sont sans indulgences. Ceci fait que ceux qui les font ne gagnent rien, alors qu'il existe de nombreuses pri\u00e8res enrichies d'indulgences.\\n\\nAvec beaucoup de gentillesse, mon toujours aimable J\u00e9sus me dit :\\n\\n\u00ab Ma fille, on peut gagner quelques choses par les pri\u00e8res indulgenci\u00e9es.\\n\\nMais les Heures de ma Passion,\\n- qui sont mes propres pri\u00e8res et\\n- qui d\u00e9bordent d'Amour,\\nviennent du tr\u00e9fonds de mon C\u0153ur.\\n\\nAurais-tu oubli\u00e9\\n- combien de temps Nous avons mis pour les composer et\\n- que, par elles, des ch\u00e2timents se sont chang\u00e9s en gr\u00e2ces sur toute la terre ?\\n\\nMa satisfaction par rapport \u00e0 ces pri\u00e8res est telle que,\\n- plut\u00f4t que des indulgences,\\nJe donne \u00e0 l'\u00e2me une surabondance d'Amour\\naccompagn\u00e9e de gr\u00e2ces d'un prix incalculable.\\n\\nQuand elles sont faites dans un Amour pur,\\n- elles permettent \u00e0 mon Amour de se d\u00e9verser.\\nEt cela n'est pas banal que la cr\u00e9ature puisse\\n- donner du soulagement \u00e0 son Cr\u00e9ateur et\\n- lui permettre de d\u00e9verser son Amour. \u00bb\\n\\nLDC 11 - 6 septembre 1913 - M\u00eame s'il n'y avait qu'une seule \u00e2me qui les m\u00e9ditait, tu devrais \u00eatre contente.\\n\\nLuisa raconte ceci :\\nUne autre fois, j'\u00e9tais en train de me plaindre aupr\u00e8s de J\u00e9sus\\n- sur le fait que, apr\u00e8s tant de sacrifices \u00e0 \u00e9crire ces Heures de la Passion,\\nil y avait si peu d'\u00e2mes qui les m\u00e9ditaient.\\n\\nJ\u00e9sus me dit : \u00ab Ne te plains pas, o fille. M\u00eame s'il n'y avait qu'une seule \u00e2me qui les m\u00e9ditait, tu devrais \u00eatre contente.\\n\\nEst-ce que Moi, Je n'aurais pas souffert ma douloureuse Passion et ma Mort en Croix m\u00eame pour une seule \u00e2me ? Tu dois agir ainsi toi aussi.\\n\\nIl ne faut jamais omettre le bien parce que peu de personnes en profiteraient.\\n\\nMa Passion et ma Mort firent acqu\u00e9rir \u00e0 ma sainte Humanit\u00e9 les m\u00e9rites\\n- comme si tous allaient \u00eatre sauv\u00e9s,\\ntelle \u00e9tant ma Volont\u00e9 et le but de toutes mes Souffrances et de ma Mort.\\n\\nAinsi toi, selon que ta volont\u00e9 aura voulu faire du bien \u00e0 tous dans ma Volont\u00e9, tu seras r\u00e9compens\u00e9e de ton travail dans cette m\u00eame proportion.\\n\\nTout le mal reviendra \u00e0 ceux qui ne les mettront pas en pratique,\\n- soit \u00e0 cause de leur nature infirme,\\n- soit \u00e0 la suite de suggestions diaboliques. \u00bb\\n\\nLDC 11 - 6 septembre 1913 - Cet exercice pieux de r\u00e9paration est vraiment sorti de mon C\u0153ur.\\n\\nUne autre fois, J\u00e9sus dit \u00e0 Luisa :\\n\u00ab Les Heures de ma Passion furent remplies\\n- de mes Pri\u00e8res, de mes R\u00e9parations et de mon Amour.\\nCet exercice pieux de r\u00e9paration fait dans la m\u00e9ditation de ces Heures\\n- est vraiment sorti de mon C\u0153ur.\\n\\nAh ! combien de fois, gr\u00e2ce \u00e0 ces m\u00e9ditations pratiqu\u00e9es secr\u00e8tement dans toute mon \u00c9glise par tant d'\u00e2mes qui m'\u00e9taient ch\u00e8res, n'ai-Je pas chang\u00e9 des fl\u00e9aux en gr\u00e2ces pour toute la terre !\\n\\nCes m\u00e9ditations ont un prix incalculable.\\nSi les exercices pieux que tu as pratiqu\u00e9s et que tu as mis par \u00e9crit\\n- sont pratiqu\u00e9s par d'autres avec amour,\\nmon Amour y trouvera son \u00e9panchement et son r\u00e9confort.\\n\\nEt sache, \u00d4 fille, que ce n'est pas peu de choses que la cr\u00e9ature donne\\n- du soulagement et\\n- de l'\u00e9panchement \u00e0 l'Amour de son Cr\u00e9ateur. \u00bb\\nLDC 11 - 6 septembre 1913 - Je souhaite la m\u00e9ditation de ces Heures\\ndans chaque cit\u00e9 ou village.\\n\\nNotre-Seigneur donna aussi \u00e0 Luisa ces Paroles expressives qui r\u00e9sonn\u00e8rent au plus profond de son \u00e2me contemplative :\\n\\n\u00ab Oh ! combien J\u2019aimerais que dans chaque cit\u00e9 ou village il se trouve, ne f\u00fbt-ce qu'une \u00e2me, qui s'applique \u00e0 m\u00e9diter ces Heures de ma Passion !\\n\\nAlors, Je m'entendrais Moi-m\u00eame dans chaque cit\u00e9 ou village. Et ma Justice qui en cette \u00e9poque, est tr\u00e8s indign\u00e9e, serait en partie apais\u00e9e ! \u00bb\\n\\nLDC 11 - 14 octobre 1914 - Luisa demanda \u00e0 J\u00e9sus si ce petit ouvrage Lui serait agr\u00e9able et dans quelle mesure.\\n\\nLuisa se r\u00e9pandait en compassion et en amour envers J\u00e9sus souffrant, du Jeudi Saint \u00e0 17h jusqu'au Vendredi Saint \u00e0 17h, alors que tout se termine par la s\u00e9pulture de son Corps adorable.\\n\\nApr\u00e8s avoir mis par \u00e9crit ces Heures de la Passion, elle demanda, avec une confiance sp\u00e9ciale que son \u00c9poux c\u00e9leste lui a donn\u00e9e, si ce petit ouvrage Lui serait agr\u00e9able et dans quelle mesure.\\n\\nJ\u00e9sus lui r\u00e9pondit :\\n\u00ab En \u00e9change du fait que tu as \u00e9crit ces Heures de ma Passion,\\npour chaque mot que tu as \u00e9crit\\n- Je donnerai un baiser \u00e0 ton \u00e2me et\\n- Je t'accorderai une \u00e2me. \u00bb\\n\\nEt Luisa reprit : \u00ab Seigneur, c'est ce que Tu me donneras \u00e0 moi, mais le donneras-Tu \u00e9galement \u00e0 quiconque m\u00e9ditera ces Heures ? \u00bb\\n\\n\u00ab Oui, r\u00e9pondit Notre-Seigneur,\\n- \u00e0 chacun Je donnerai une \u00e2me, \u00e0 chaque mot,\\n- \u00e0 condition qu'il les m\u00e9dite uni \u00e0 Moi et dans ma propre Volont\u00e9\\ncar l'efficacit\u00e9 de la m\u00e9ditation de ces Heures sera proportionnelle\\n- \u00e0 l'union plus ou moins grande qu'on aura avec Moi.\\nSi l'\u00e2me les fait dans ma Volont\u00e9,\\n- elle se cachera avec Moi dans cette Volont\u00e9.\\nEt quand ma Volont\u00e9 se met \u00e0 agir, Je peux faire tout le bien que Je veux,\\n- m\u00eame pour un seul mot, et ce, autant de fois qu'on m\u00e9ditera ainsi. \u00bb\\n\\nLDC 11 - 14 octobre 1914 - La Valeur des Heures de la Passion.\\n\\nQuant \u00e0 la Valeur de ces Heures, Notre-Seigneur a parl\u00e9 ainsi :\\n\\nCette m\u00e9ditation est pr\u00e9f\u00e9rable \u00e0 beaucoup d\u2019autres exercices. Car cette m\u00e9ditation n'est rien d'autre qu'un renouvellement et une augmentation continus\\n\\n- des M\u00e9rites\\n- de tout ce que J'ai fait et souffert au cours de ma Vie mortelle, et\\n- de ce que J'ai fait et que Je fais continuellement dans ma sainte Eucharistie.\\n\\nQuand Je vois une \u00e2me m\u00e9diter ces Heures,\\n- J\u2019entends ma propre Voix, mes propres Pri\u00e8res,\\n- Je vois ma propre Volont\u00e9 en cette \u00e2me,\\nc'est-\u00e0-dire la volont\u00e9 de vouloir le bien de tous et de r\u00e9parer pour tous.\\n\\nEt Je Me sens attir\u00e9 \u00e0 demeurer en cette \u00e2me.\\n\\nLDC 11 - 4 novembre 1914 - La satisfaction que causent \u00e0 J\u00e9sus les Heures de la Passion.\\n\\nJe faisais les Heures de la Passion et, tout heureux, J\u00e9sus me dit : \u00ab Ma fille, si tu savais quelle grande satisfaction Je ressens en te voyant refaire ces Heures de ma Passion encore et encore, tu en serais tr\u00e8s heureuse.\\n\\nIl est vrai que mes saints ont m\u00e9dit\u00e9 ma Passion et ayant compris \u00e0 quel point\\nJ'ai souffert, ils ont vers\u00e9 des larmes de compassion.\\n- jusqu'\u00e0 se sentir consum\u00e9s d'amour pour mes Souffrances.\\n\\nCependant,\\nil ne s'agissait pas de cette mani\u00e8re toujours r\u00e9p\u00e9t\u00e9e et dans cet ordre.\\nTu es la premi\u00e8re \u00e0 Me donner ce plaisir si grand et si sp\u00e9cial\\n- de revivre int\u00e9rieurement, Heure apr\u00e8s Heure,\\nma Vie et tout ce que J'ai souffert.\\nJe Me sens si attir\u00e9 par cela que, Heure apr\u00e8s Heure,\\nJe te donne cette nourriture et Je la mange avec toi,\\n- faisant avec toi ce que tu fais.\\n\\nSache que Je te r\u00e9compenserai abondamment de Lumi\u00e8re et de Gr\u00e2ces nouvelles. M\u00eame apr\u00e8s ta mort, chaque fois que des \u00e2mes sur la terre feront ces Heures, au Ciel Je te v\u00eatirai de Lumi\u00e8re et de Gloire nouvelles. \u00bb\\n\\nLDC 11 - 6 novembre 1914 - L'\u00e2me qui fait les Heures de la Passion devient cor\u00e9demptrice.\\n\\nPendant que, suivant mon habitude, je faisais les Heures de la Passion, mon aimable J\u00e9sus me dit :\\n\\n\u00ab Ma fille,\\nle monde renouvelle sans cesse ma Passion.\\nPuisque mon immensit\u00e9 enveloppe toutes les cr\u00e9atures,\\n- tant int\u00e9rieurement qu'ext\u00e9rieurement,\\n\\nJe suis forc\u00e9, \u00e0 leur contact, de recevoir\\n- clous, \u00e9pines, coups de fouet,\\n- m\u00e9pris, crachats et tout le reste\\ndont J'\u00e9tais accabl\u00e9 pendant ma Passion, et m\u00eame plus.\\n\\nCependant, au contact des \u00e2mes qui font les Heures de ma Passion,\\nJe sens\\n- que les clous s'enl\u00e8vent, que les \u00e9pines sont d\u00e9truites,\\n- que mes blessures sont soulag\u00e9es et que les crachats disparaissent.\\n\\nJe Me sens d\u00e9dommag\u00e9 pour le mal que les autres cr\u00e9atures Me font. Et, sentant que ces \u00e2mes ne Me font aucun mal, mais plut\u00f4t du bien, Je M'appuie sur elles. \u00bb\\n\\nJ\u00e9sus b\u00e9ni ajouta :\\n\u00ab Ma fille, sache qu'en faisant ces Heures, l'\u00e2me s'empare\\n- de mes Pens\u00e9es, de mes R\u00e9parations, de mes Pri\u00e8res,\\n- de mes d\u00e9sirs, de mes affections et m\u00eame\\n- de mes fibres les plus intimes.\\nEt elle les fait siens.\\n\\nS'\u00e9levant entre le Ciel et la terre, elle remplit la fonction de co-r\u00e9demptrice et elle dit \u00e0 ma suite : \\\"Me voici, je veux r\u00e9parer pour tous, implorer pour tous et r\u00e9pondre de tous.\\\" \u00bb\\n\\nLDC 11 - 14 ao\u00fbt 1915 - La Passion de J\u00e9sus, ses Plaies, son Sang et tout ce qu'Il a fait et souffert op\u00e8rent sans cesse.\\n\\n\u00ab Ma fille,\\n\\nma Passion, mes Plaies, mon Sang, et tout ce que J'ai fait et souffert op\u00e8rent sans cesse comme si tout se passait actuellement.\\n\\nIls servent de supports\\n- sur lesquels Je peux M'appuyer et\\n- sur lesquels les \u00e2mes peuvent s'appuyer\\npour ne pas tomber dans le p\u00e9ch\u00e9 et pour \u00eatre sauv\u00e9es.\\n\\nEn ces temps de ch\u00e2timents, Je suis comme une personne\\n\\n- suspendue dans les airs et\\n- qui re\u00e7oit des coups continuellement :\\n\\nla Justice Me frappe \u00e0 partir du Ciel et les cr\u00e9atures, par le p\u00e9ch\u00e9, Me frappent \u00e0 partir de la terre.\\n\\nPlus l'\u00e2me reste aupr\u00e8s de Moi,\\n- baisant mes Plaies,\\n- faisant r\u00e9paration et\\n- offrant mon Sang,\\nen un mot, refaisant tout ce que J'ai fait durant ma Vie et ma Passion,\\n\\nplus elle forme des supports\\n- sur lesquels Je peux M'appuyer pour ne pas tomber, et\\n\\nplus le cercle s'agrandit o\u00f9 les \u00e2mes peuvent trouver appui\\n- pour ne pas tomber dans le p\u00e9ch\u00e9 et\\n- pour \u00eatre sauv\u00e9es.\\n\\nNe te lasse pas, ma fille,\\n- de te tenir aupr\u00e8s de Moi et\\n- de parcourir mes Plaies encore et encore.\\n\\nJe te donnerai\\n- les pens\u00e9es,\\n- les affections et\\n- les mots\\npour que tu puisses rester aupr\u00e8s de Moi.\\n\\nSois-Moi fid\u00e8le. Parce que le temps est court. Et parce que, irrit\u00e9e par les cr\u00e9atures, la Justice veut d\u00e9ployer sa fureur. Il est n\u00e9cessaire que les supports se multiplient. Ne cesse pas de travailler. \u00bb\\n\\nLDC 11 - 23 avril 1916 - Chaque pens\u00e9e sur la Passion de J\u00e9sus produit dans l'\u00e2me de la Lumi\u00e8re qui se transformera en Joie \u00e9ternelle.\\n\\nPendant que je me trouvais dans mon \u00e9tat habituel, mon aimable J\u00e9sus se montra tout inond\u00e9 de Lumi\u00e8re.\\n\\nCette Lumi\u00e8re \u00e9manait de sa tr\u00e8s sainte Humanit\u00e9 et Lui conf\u00e9rait une tr\u00e8s grande beaut\u00e9. Je fus surprise et Il me dit :\\n\\n\u00ab Ma fille,\\n- chaque douleur que J'ai subie dans mon Humanit\u00e9,\\n- chaque goutte de Sang que J\u2019ai vers\u00e9e,\\n- chaque Blessure, chaque Pri\u00e8re, chaque Parole, chaque Action, chaque Pas,\\netc., produisaient de la Lumi\u00e8re dans mon Humanit\u00e9.\\n\\nEt cette Lumi\u00e8re M'embellissait au point que tous les bienheureux du Ciel en \u00e9taient ravis.\\n\\nEn ce qui concerne les \u00e2mes,\\n- chaque pens\u00e9e qu'elles ont sur ma Passion,\\n- chaque acte de compassion qu'elles effectuent,\\n- chaque acte de r\u00e9paration, etc.\\nfait descendre en elles de la Lumi\u00e8re \u00e9manant de mon Humanit\u00e9 et qui les\\nembellit.\\n\\nChaque pens\u00e9e sur ma Passion est un ajout de Lumi\u00e8re qui se transformera en Joie \u00e9ternelle. \u00bb\\n\\nLDC 11 - 13 octobre 1916 - Les anges entourent les \u00e2mes qui font les Heures de la Passion. Ces Heures sont pour J\u00e9sus d'agr\u00e9ables petites douceurs.\\n\\nJ'\u00e9tais \u00e0 faire les Heures de la Passion et J\u00e9sus b\u00e9ni me dit : \u00ab Ma fille, pendant ma Vie terrestre, des milliers et des milliers d'anges accompagnaient mon Humanit\u00e9.\\n\\nIls recueillaient tout ce que Je faisais : mes Pas, mes Travaux, mes Paroles,\\nmes Soupirs, mes Peines, les gouttes de mon Sang, etc.\\n- Ils Me donnaient des honneurs.\\n- Ils ob\u00e9issaient \u00e0 tous mes d\u00e9sirs.\\n- Et ils montaient au Ciel et en redescendaient\\npour apporter au P\u00e8re tout ce que Je faisais.\\nCes anges ont une mission particuli\u00e8re :\\nQuand une \u00e2me se rem\u00e9more ma Vie, ma Passion, mon Sang, mes Plaies,\\nmes Pri\u00e8res, etc.,\\n- ils viennent aupr\u00e8s de cette \u00e2me et\\n- ils recueillent ses paroles, ses pri\u00e8res, ses actes de compassion, ses larmes,\\n\\nses offrandes, etc.,\\n- ils les unissent aux Miens et les apportent devant ma majest\u00e9 pour renouveler\\nma Gloire.\\n\\nAvec r\u00e9v\u00e9rence, ils \u00e9coutent ce que les \u00e2mes disent et ils prient avec elles.\\n\\nPar cons\u00e9quent, avec quelle attention et quel respect les \u00e2mes doivent-elles faire les Heures de la Passion, sachant que les anges sont suspendus \u00e0 leurs l\u00e8vres pour r\u00e9p\u00e9ter ce qu'elles disent ! \u00bb Il ajouta : \u00ab Au milieu de tant d'amertume que me donnent les cr\u00e9atures, ces Heures sont pour Moi d'agr\u00e9ables petites douceurs, m\u00eame si elles sont trop peu nombreuses, vu toute l'amertume que Je re\u00e7ois des cr\u00e9atures.\\n\\nPar cons\u00e9quent, fais conna\u00eetre ces Heures autant que tu peux. \u00bb\\n\\nLDC 11 - 14 Octobre 1914 - La Valeur des Heures de la Passion et les r\u00e9compenses qui y sont attach\u00e9es.\\n\\nPendant que j'\u00e9crivais les Heures de la Passion, je me disais : \u00ab Que de sacrifices il me faut faire pour \u00e9crire ces Heures b\u00e9nies de la Passion, surtout quand je dois mentionner certaines choses int\u00e9rieures qui se sont pass\u00e9es entre moi et J\u00e9sus ! Quelle r\u00e9compense me donnera-t-Il ? \u00bb\\n\\nD'une voix tendre et douce, Il me dit : \u00ab Ma fille, pour chaque mot que tu as \u00e9crit, Je te donnerai un baiser, une \u00e2me. \u00bb\\n\\nJe repris : \u00ab Mon Amour, cela est pour moi, mais que donneras-Tu \u00e0 ceux qui les feront ? \u00bb\\n\\nIl me dit : \u00ab S'ils les font avec Moi dans ma Volont\u00e9, Je leur donnerai aussi une \u00e2me pour chaque mot qu'ils r\u00e9citeront. En fait, l'effet sera petit ou grand suivant la grandeur de leur union avec Moi. En les faisant dans ma Volont\u00e9, la cr\u00e9ature se cache en Elle. Comme c'est ma Volont\u00e9 qui agit, Je peux produire tous les biens que Je veux, m\u00eame \u00e0 travers un seul Mot. \u00bb\\n\\nUne autre fois, Je me plaignais \u00e0 J\u00e9sus en constatant qu'apr\u00e8s tant de sacrifices pour \u00e9crire ces Heures, tr\u00e8s peu d'\u00e2mes les font.\\n\\nIl me dit : \u00ab Ma fille, ne te plains pas. M\u00eame s'il n'y avait qu'une seule \u00e2me qui les faisait, tu devrais \u00eatre contente. N'aurais-Je pas souffert ma Passion au complet m\u00eame s'il n'y avait eu qu'une \u00e2me qui allait \u00eatre sauv\u00e9e ? De m\u00eame pour toi.\\n\\nOn ne doit pas omettre de faire le bien sous pr\u00e9texte que peu de gens en profiteront. Le dommage sera du c\u00f4t\u00e9 de ceux qui ne voudront pas en profiter.\\n\\nMa Passion fit acqu\u00e9rir \u00e0 mon Humanit\u00e9 le m\u00e9rite n\u00e9cessaire pour que tous soient sauv\u00e9s, m\u00eame si certains ne veulent pas en profiter.\\n\\nLa m\u00eame chose pour toi : tu seras r\u00e9compens\u00e9e dans la proportion o\u00f9 ta\\nvolont\u00e9 aura \u00e9t\u00e9 identifi\u00e9e \u00e0 la Mienne et aura voulu le bien de tous.\\nTout le dommage est du c\u00f4t\u00e9 de ceux qui,\\nbien qu'ils en soient capables, ne les font pas.\\nCes Heures sont tr\u00e8s pr\u00e9cieuses parce qu'elles ne sont rien d'autre\\n- que la r\u00e9p\u00e9tition de ce que J'ai fait au cours de ma Vie mortelle et\\n- que Je continue de faire dans le tr\u00e8s saint Sacrement.\\n\\nQuand J'entends ces Heures, J'entends ma propre Voix, mes propres Pri\u00e8res.\\n\\nDans l'\u00e2me qui fait ces Heures, Je vois ma Volont\u00e9 voulant\\n- le bien de tous et\\n- la r\u00e9paration pour tous\\nEt Je me sens attir\u00e9 \u00e0 venir habiter en cette \u00e2me pour y faire ce qu'elle fait.\\n\\nOh ! comme J'aimerais que, dans chaque ville, il y ait au moins une \u00e2me qui fasse les Heures de ma Passion ! Je m'entendrais ainsi dans chaque ville. Et ma Justice, si indign\u00e9e en ces temps, serait en partie apais\u00e9e. \u00bb Un jour, alors que j'en \u00e9tais \u00e0 l'Heure o\u00f9 la c\u00e9leste Maman participa \u00e0 l'ensevelissement de J\u00e9sus, je me tenais pr\u00e8s d'elle pour la consoler.\\n\\nEn fait, je ne faisais g\u00e9n\u00e9ralement pas cette Heure et j'h\u00e9sitais \u00e0 la faire.\\n\\nSur un ton suppliant et plein d'amour, J\u00e9sus b\u00e9ni me dit :\\n\\n\u00ab Ma fille, Je ne veux pas que tu omettes cette Heure-l\u00e0.\\nTu la feras\\n- par amour pour Moi et\\n- en l'honneur de ma Maman.\\n\\nSache que chaque fois que tu la fais,\\n- ma Maman se sent comme si elle revivait sa vie terrestre et\\n- elle re\u00e7oit la gloire et l'amour qu'elle me donnait.\\n\\nQuant \u00e0 Moi, Je ressens\\n- sa tendresse maternelle, son amour\\n- et toute la gloire qu'elle me donnait.\\nDe plus, Je te consid\u00e8re comme une m\u00e8re. \u00bb\\nEnsuite, Il m'embrassa et me dit avec une grande douceur :\\n\u00ab Ma maman, maman ! \u00bb,\\nEt Il me murmura tout ce que sa douce Maman fit et souffrit durant cette Heure.\\n\\n\u00c0 partir de cet instant, aid\u00e9 de sa gr\u00e2ce, je n'ai plus jamais omis cette Heure.\\n\\nLDC 11 - 4 novembre 1914 - La satisfaction que causent \u00e0 J\u00e9sus les Heures de la Passion.\\n\\nJe faisais les Heures de la Passion et, tout heureux, J\u00e9sus me dit :\\n\\n\u00ab Ma fille, si tu savais quelle grande satisfaction Je ressens\\n- en te voyant refaire ces Heures de ma Passion encore et encore,\\ntu en serais tr\u00e8s heureuse.\\n\\nIl est vrai que mes saints ont m\u00e9dit\u00e9 ma Passion et ayant compris \u00e0 quel point\\nJ'ai souffert, ils ont vers\u00e9 des larmes de compassion jusqu'\u00e0 se sentir consum\u00e9s d'amour pour mes souffrances.\\n\\nCependant,\\nil ne s'agissait pas de cette mani\u00e8re toujours r\u00e9p\u00e9t\u00e9e et dans cet ordre.\\nTu es la premi\u00e8re \u00e0 Me donner ce plaisir si grand et si sp\u00e9cial\\n- de revivre int\u00e9rieurement, Heure apr\u00e8s Heure,\\nma Vie et tout ce que J'ai souffert.\\n\\nJe me sens si attir\u00e9 par cela que, Heure apr\u00e8s Heure,\\nJe te donne cette nourriture et Je la mange avec toi,\\n- faisant avec toi ce que tu fais.\\n\\nSache que Je te r\u00e9compenserai abondamment\\n- de Lumi\u00e8re et de Gr\u00e2ces nouvelles.\\n\\nM\u00eame apr\u00e8s ta mort, chaque fois que des \u00e2mes sur la terre feront ces Heures, au Ciel Je te v\u00eatirai de Lumi\u00e8re et de Gloire nouvelles. \u00bb\\n\\nLDC 11 - 6 novembre 1914 - L'\u00e2me qui fait les Heures de la Passion devient cor\u00e9demptrice.\\n\\nPendant que, suivant mon habitude, je faisais les Heures de la Passion, mon aimable J\u00e9sus me dit :\\n\\n\u00ab Ma fille,\\nle monde renouvelle sans cesse ma Passion.\\nPuisque mon immensit\u00e9 enveloppe toutes les cr\u00e9atures,\\n- tant int\u00e9rieurement qu'ext\u00e9rieurement,\\nJe suis forc\u00e9, \u00e0 leur contact, de recevoir\\n- clous, \u00e9pines, coups de fouet,\\n- m\u00e9pris, crachats et tout le reste\\ndont J'\u00e9tais accabl\u00e9 pendant ma Passion, et m\u00eame plus.\\n\\nCependant, au contact des \u00e2mes qui font les Heures de ma Passion,\\nJe sens\\n- que les clous s'enl\u00e8vent, que les \u00e9pines sont d\u00e9truites,\\n- que mes blessures sont soulag\u00e9es et que les crachats disparaissent.\\n\\nJe Me sens d\u00e9dommag\u00e9 pour le mal que les autres cr\u00e9atures me font. Et, sentant que ces \u00e2mes ne Me font aucun mal, mais plut\u00f4t du bien, Je M'appuie sur elles. \u00bb J\u00e9sus b\u00e9ni ajouta :\\n\\n\u00ab Ma fille, sache qu'en faisant ces Heures,\\nl'\u00e2me s'empare\\n- de mes Pens\u00e9es, de mes R\u00e9parations, de mes Pri\u00e8res,\\n- de mes d\u00e9sirs, de mes affections et m\u00eame\\n- de mes fibres les plus intimes.\\nEt elle les fait siens.\\n\\nS'\u00e9levant entre le Ciel et la terre, elle remplit la fonction de co-r\u00e9demptrice et elle dit \u00e0 ma suite :\\n\\n\\\"Me voici, je veux r\u00e9parer pour tous, implorer pour tous et r\u00e9pondre de tous.\\\" \u00bb\\n\\nLDC 11 - 9 d\u00e9cembre 1916 - J\u00e9sus veut des \u00e2mes qui soient d'autres Lui-m\u00eame.\\n\\nJ'\u00e9tais afflig\u00e9e \u00e0 cause de la privation de mon doux J\u00e9sus. Quand Il vient, je ressens un peu de soulagement. Mais je deviens vite plus afflig\u00e9e en le voyant plus afflig\u00e9 que moi.\\n\\nIl n'est pas question qu'Il s'apaise\\n- puisque les cr\u00e9atures le forcent \u00e0 envoyer encore plus de fl\u00e9aux.\\nPendant qu\u2019Il s\u00e9vit, Il pleure sur le sort de l'humanit\u00e9.\\nEt Il se cache au tr\u00e9fonds de mon c\u0153ur\\ncomme s'Il ne voulait pas voir les souffrances de ses cr\u00e9atures.\\n\\nCes temps sont invivables, mais il semble que ce n'est que le commencement. Comme j'\u00e9tais tr\u00e8s afflig\u00e9e \u00e0 cause de mon p\u00e9nible sort, celui d'\u00eatre si souvent sans J\u00e9sus, Il vint et, entourant mon cou d'un de ses bras, Il me dit :\\n\\n\u00ab Ma fille, n'augmente pas mes souffrances en t'affligeant de la sorte.\\nJ'en ai d\u00e9j\u00e0 beaucoup trop. Je n'attends pas cela de toi.\\nJ'attends de toi que tu t'appropries\\n- mes Peines,\\n- mes Pri\u00e8res et\\n- tout Moi-m\u00eame\\nDe sorte que Je puisse trouver en toi un autre Moi-m\u00eame.\\n\\nEn ces temps, Je veux de grandes satisfactions. Et seulement ceux qui sont d'autres Moi-m\u00eame peuvent r\u00e9pondre \u00e0 cette attente.\\n\\nCe que le P\u00e8re trouvait en Moi :\\n- Gloire, D\u00e9lices, Amour,\\n\\n- satisfactions compl\u00e8tes pour le bien de tous\\nIl le trouve en ces \u00e2mes.\\n\\nTu dois avoir ces intentions\\n- \u00e0 chaque Heure de la Passion que tu fais,\\n- \u00e0 chacune de tes actions,\\ntout le temps.\\n\\nSi Je ne trouve pas ces satisfactions, ah ! ce sera le d\u00e9sastre : les fl\u00e9aux vont se r\u00e9pandre par torrents. Ah ! Ma fille ! Ah ! Ma fille ! \u00bb Puis Il disparut.\\n\\nBienfaits de la m\u00e9ditation des Heures de la Passion\\n\\nLDC 11 - 2 f\u00e9vrier 1917 - Le monde est devenu d\u00e9s\u00e9quilibr\u00e9 parce qu'il a perdu la pens\u00e9e de la Passion.\\n\\n\u00c9tant dans mon \u00e9tat habituel, je me suis retrouv\u00e9e hors de mon corps. J'ai vu mon aimable J\u00e9sus ruisselant de Sang et couvert d'une horrible couronne d'\u00e9pines.\\n\\nMe regardant avec difficult\u00e9 \u00e0 travers les \u00e9pines, Il me dit : \u00ab Ma fille, le monde est devenu d\u00e9s\u00e9quilibr\u00e9 parce qu'il a perdu la pens\u00e9e de ma Passion. Dans la noirceur, il n'a pas trouv\u00e9 la Lumi\u00e8re de ma Passion qui\\n\\nl'aurait \u00e9clair\u00e9. Cette Lumi\u00e8re lui aurait fait conna\u00eetre\\n- mon Amour et combien les \u00e2mes M'ont co\u00fbt\u00e9.\\n\\nIl se serait mis \u00e0 aimer Celui qui l'a tant aim\u00e9. Et la Lumi\u00e8re de ma Passion l'aurait guid\u00e9 et mis sur ses gardes au milieu des dangers.\\n\\nDans la faiblesse,\\n- il n'a pas trouv\u00e9 la Force de ma Passion qui l'aurait soutenu.\\nDans l'impatience,\\n- il n'a pas trouv\u00e9 le miroir de ma Patience\\nqui lui aurait infus\u00e9 le calme et la r\u00e9signation.\\nEt, \u00e0 la vue de ma Patience,\\n- il se serait senti g\u00ean\u00e9 et\\n- il se serait fait un devoir de se dominer.\\nDans les souffrances, il n'a pas trouv\u00e9 le r\u00e9confort des Souffrances d'un Dieu\\nqui lui aurait infus\u00e9 l'amour de la souffrance.\\nDans le p\u00e9ch\u00e9, il n'a pas trouv\u00e9 ma Saintet\u00e9\\n- qui lui aurait infus\u00e9 la haine du p\u00e9ch\u00e9.\\nAh ! L\u2019homme a abus\u00e9 de tout.\\nParce que, sur tous les points, il s'est \u00e9loign\u00e9 de Celui qui aurait pu l'aider.\\n\\nVoil\u00e0 pourquoi le monde est devenu d\u00e9s\u00e9quilibr\u00e9. Il s'est comport\u00e9\\n- comme un enfant qui ne veut plus reconna\u00eetre sa m\u00e8re, ou\\n- comme un disciple qui, reniant son ma\u00eetre, ne veut plus entendre ses\\nenseignements.\\n\\nQu'est-ce qui va arriver \u00e0 cet enfant et \u00e0 ce disciple ? Ils seront la honte de la soci\u00e9t\u00e9. Tel est devenu l'homme. Ah ! Il va de mal en pis et Je pleure sur lui avec des larmes de Sang ! \u00bb\\n\\nLDC 12 - 16 mai 1917 - Les avantages que l\u2019on trouve \u00e0 se fondre en J\u00e9sus. Les \u201cHeures de la Passion\u201d mettent la R\u00e9demption en action.\\n\\nMe trouvant dans mon \u00e9tat habituel, je me fondais totalement en mon doux J\u00e9sus. Et je me d\u00e9versais dans toutes les cr\u00e9atures dans le but de les remplir de Lui.\\n\\nMon aimable J\u00e9sus me dit :\\n\\n\u00ab Ma fille, chaque fois que la cr\u00e9ature se fond en Moi,\\nelle communique les influences divines \u00e0 toutes les cr\u00e9atures\\nqui, selon leurs besoins, sont ainsi visit\u00e9es :\\n- ceux qui sont faibles ressentent la force ;\\n- ceux qui sont obstin\u00e9s dans le p\u00e9ch\u00e9 re\u00e7oivent la lumi\u00e8re ;\\n- ceux qui souffrent re\u00e7oivent le r\u00e9confort ;\\net ainsi de suite. \u00bb\\n\\nApr\u00e8s cela, je me suis retrouv\u00e9e hors de mon corps au milieu de beaucoup d\u2019\u00e2mes. Il me semblait que c\u2019\u00e9tait des \u00e2mes du purgatoire et des saints. Ces \u00e2mes me parlaient d\u2019une personne morte r\u00e9cemment que je connaissais.\\n\\nElles me disaient : \u00ab Comme elle est contente que les \u00e2mes qui portent l\u2019empreinte des \u201cHeures de la Passion\u201d ne passent pas par le purgatoire ! Escort\u00e9es par ces Heures, elles prennent position dans un endroit s\u00e9curitaire. De plus, il n\u2019est pas une \u00e2me qui vole au Paradis qui ne soit accompagn\u00e9e des \u201c Heures de la Passion \u201d.\\n\\nCes Heures r\u00e9pandent continuellement la ros\u00e9e du Ciel\\n- sur la terre,\\n- dans le purgatoire et\\n- m\u00eame dans le Ciel. \u00bb\\n\\nEn entendant cela je me disais :\\n\u00ab Peut-\u00eatre que pour tenir parole\\n- \u00e0 savoir que pour chaque mot des \u201c Heures de la Passion \u201d,\\nJ\u00e9sus sauverait une \u00e2me -\\nmon bien-aim\u00e9 J\u00e9sus accorde qu\u2019il n\u2019y ait pas d\u2019\u00e2mes sauv\u00e9es\\nqui ne le soient par l\u2019interm\u00e9diaire de ces Heures. \u00bb\\nApr\u00e8s, je suis revenue dans mon corps.\\nAyant trouv\u00e9 mon doux J\u00e9sus, je lui ai demand\u00e9 si cela \u00e9tait vrai.\\n\\nIl me dit :\\n\u00ab Ces Heures mettent en harmonie le Ciel et la terre et M\u2019emp\u00eachent de\\nd\u00e9truire le monde.\\nJe sens mon Sang, mes Plaies, mon Amour et tout ce que J\u2019ai fait\\n- mis en circulation et\\n- se r\u00e9pandre sur tout pour tout sauver.\\n\\nQuand on m\u00e9dite ces Heures de la Passion, Je sens mon Sang, mes Plaies et mes anxi\u00e9t\u00e9s pour le salut des \u00e2mes mis en motion.\\n\\nJe sens ma Vie se r\u00e9p\u00e9ter. Comment les cr\u00e9atures peuvent-elles obtenir quelque bien\\n\\nsi ce n\u2019est par le truchement de ces Heures ?\\n\\nPourquoi en doutes-tu ? La chose n\u2019est pas la tienne mais la Mienne. Tu as \u00e9t\u00e9 le faible instrument. \u00bb\\n\\nLDC 12 - 12 juillet 1918 - Les fruits de la Passion de J\u00e9sus.\\n\\nJe priais pour une \u00e2me mourante avec un peu de crainte et d\u2019anxi\u00e9t\u00e9.\\nMon aimable J\u00e9sus vint et Il me dit :\\n\u00ab Ma fille, pourquoi crains-tu ?\\nQuand une \u00e2me m\u00e9dite sur ma Passion,\\n- se rappelant mes souffrances\\n- en entretenant des pens\u00e9es de compassion et de r\u00e9paration,\\ndes chemins s\u2019ouvrent entre elle et Moi\\net des Beaut\u00e9s vari\u00e9es viennent orner son \u00e2me.\\n\\nCette \u00e2me a fait les \u201c Heures de ma Passion \u201d.\\nEt Je la recevrai comme une fille de ma Passion,\\n- rev\u00eatue de mon Sang et orn\u00e9e de mes Plaies.\\nCette fleur fut cultiv\u00e9e dans ton c\u0153ur\\nEt Je la b\u00e9nis et la re\u00e7ois dans mon C\u0153ur comme une fleur de pr\u00e9dilection. \u00bb\\n\\nPendant qu\u2019Il disait cela, une fleur partit de mon c\u0153ur et s\u2019envola vers J\u00e9sus.\\n\\nLDC 13 - 21 octobre 1921 - Les Bienfaits de la m\u00e9ditation des Heures de la Passion.\\n\\nEn d\u00e9pit de tous les bienfaits de ma Passion, on voit\\n- tant d\u2019\u00e2mes faibles, aveugles, sourdes, muettes et boiteuses,\\n- en somme, de d\u00e9go\u00fbtants cadavres vivants.\\n\\nPourquoi ? On oublie ma Passion.\\n\\nAlors que mes Souffrances, mes Plaies et mon Sang offrent\\n- une Force pour surmonter la faiblesse,\\n- une Lumi\u00e8re pour donner la vue aux aveugles,\\n- une Langue pour d\u00e9lier les langues des muets et ouvrir les oreilles des\\nsourds,\\n- une Voie pour guider les faibles,\\n- la Vie pour ressusciter les morts.\\n\\nTous les rem\u00e8des dont l\u2019humanit\u00e9 a tant besoin peuvent \u00eatre trouv\u00e9s dans ma Vie et ma Passion.\\n\\nLDC 13 - 21 octobre 1921 - La haute Valeur de la m\u00e9ditation des 24 Heures de la Passion.\\n\\nChaque fois\\n- que l\u2019\u00e2me pense \u00e0 ma Passion,\\n- qu\u2019elle se souvient de ce que J\u2019ai souffert ou\\n- qu\u2019elle sent de la compassion pour Moi,\\nl\u2019application de mes Souffrances est renouvel\u00e9e en elle.\\n\\nMon Sang surgit pour l\u2019inonder.\\nMes Plaies\\n- la gu\u00e9rissent si elle est bless\u00e9e ou\\n- l\u2019embellissent si elle est en sant\u00e9\\nTous mes M\u00e9rites l\u2019enrichissent.\\n\\nTout ce qui est n\u00e9cessaire, c\u2019est que l\u2019\u00e2me le d\u00e9sire.\\n\\nAussi souvent que l\u2019\u00e2me le d\u00e9sire, elle re\u00e7oit les Fruits de ma Vie. Si elle se souvient de ma Passion vingt, cent, ou mille fois, autant de fois elle jouira de ses Effets.\"},{\"section_id\":\"PASSION24.SECTION.PRACTICE_METHODS\",\"segment_type\":\"PRACTICE_METHODS\",\"title\":\"M\u00e9thodes de pratique\",\"display_text\":\"M\u00e9thodes pour la pratique des Heures de la Passion\\n\\nLa pratique de la d\u00e9votion des Heures douloureuses\\n- pourra sembler malais\u00e9e, sinon impossible.\\nComment pourrait-on passer tous ses jours \u00e0 m\u00e9diter durant 24 Heures,\\nde 17h aujourd'hui \u00e0 17h demain, et puis recommencer demain ?\\n\\nIl est \u00e9vident que cela est humainement impossible.\\nGr\u00e2ce \u00e0 un secours sp\u00e9cial de la Gr\u00e2ce divine,\\nLuisa a fait cette m\u00e9ditation continue pendant maintes ann\u00e9es.\\nQuant \u00e0 nous, la m\u00e9ditation des 24 Heures de la Passion,\\n- de la Mort et de la S\u00e9pulture de Notre-Seigneur,\\npeut se faire de diverses mani\u00e8res,\\n\\n- selon les conditions et les circonstances.\\n\\nVoici trois suggestions :\\n\\nPremi\u00e8re mani\u00e8re :\\npenser \u00e0 la Passion au moins \u00e0 chaque Heure de la journ\u00e9e et de la nuit.\\nLa premi\u00e8re mani\u00e8re s'adresse aux personnes\\n- qui vivent une vie plut\u00f4t retir\u00e9e et contemplative,\\nsoit au monast\u00e8re, soit \u00e0 la maison.\\nCes personnes sont certainement peu nombreuses.\\n\\nLa m\u00e9thode consiste \u00e0 d'abord lire ce Livre des Heures en entier, un passage \u00e0 la fois, en quelques jours, comme on le peut et en m\u00e9ditant.\\n\\nC\u2019est bien de se former une id\u00e9e d'ensemble. Puis la personne, chaque fois que l'heure sonne, peut se rendre pr\u00e9sents \u00e0 l'esprit le titre et le contenu de cette Heure.\\n\\nEt si, vu ses occupations, elle ne peut faire plus, elle t\u00e2chera au moins\\n- d'avoir pr\u00e9sent \u00e0 l'esprit le myst\u00e8re concern\u00e9,\\n- de se recueillir en esprit et\\n- de faire monter quelques ferventes pri\u00e8res int\u00e9rieures.\\n\\nPour cela, il sera utile\\n- d\u2019apprendre par c\u0153ur la table des 24 Heures avec les myst\u00e8res de l\u2019Heure.\\n- d'avoir \u00e0 la port\u00e9e des yeux une liste de ces Heures.\\nSi possible, on lira le texte du Myst\u00e8re correspondant dans le livre.\\n\\nChaque fois que l\u2019\u00e2me le d\u00e9sire et qu\u2019elle est attentive et pers\u00e9v\u00e9rante, l'aide de la Gr\u00e2ce divine sera toujours pr\u00e9sente.\\n\\nNous pouvons faire ainsi pendant la journ\u00e9e.\\nMais, durant la nuit,\\n- normalement le sommeil est indispensable (au moins cinq ou six heures).\\n\\nLa personne d\u00e9vote pourra, avant d'aller au lit, lire une ou deux Heures\\nd'avance - dont la lecture ne d\u00e9passera pas soixante minutes.\\nQuant aux autres Heures de la nuit,\\n- nous pouvons en lire au moins les titres,\\n\\n- puis former l'intention que,\\npendant que l'on dormira, nous voulons les m\u00e9diter en esprit.\\n\\nNotre-Seigneur, dans sa Bont\u00e9 infinie,\\n- agr\u00e9e cette intention comme si elle \u00e9tait l'action elle-m\u00eame.\\n\\nDeuxi\u00e8me mani\u00e8re : consacrer une heure par jour \u00e0 la lecture et \u00e0 la m\u00e9ditation de la Passion de Notre-Seigneur.\\n\\nLes gens qui, durant la journ\u00e9e, sont occup\u00e9s \u00e0 de multiples affaires,\\n- domestiques ou autres,\\npourraient mettre en pratique cet exercice pieux\\n- d'une autre mani\u00e8re mieux adapt\u00e9e \u00e0 leur situation.\\nNous admettons qu'ils veulent consacrer au moins une heure par jour \u00e0 la\\nlecture et \u00e0 la m\u00e9ditation de la Passion de Notre-Seigneur,\\nIls peuvent le faire aussi en deux \u00e9tapes :\\nc'est-\u00e0-dire une demi-heure le matin et une demi-heure en soir\u00e9e.\\n\\nIls commencent \u00e0 la premi\u00e8re page de ces Heures. Ils en lisent et en m\u00e9ditent un certain nombre de pages (pendant une trentaine de minutes). Et puis, le soir, durant la deuxi\u00e8me demi-heure, ils poursuivent.\\n\\nIls proc\u00e8dent ainsi chaque jour, allant toujours de l'avant, jusqu'\u00e0 ce qu'apr\u00e8s un certain nombre de jours, ils aient parcouru tout le livre. Alors, ils recommencent au d\u00e9but pour le refaire au complet. Et puis encore une fois. Ils continuent ainsi pendant un certain nombre de mois.\\n\\nQuand ils ont une bonne id\u00e9e d'ensemble de toutes les Heures,\\nils peuvent tr\u00e8s bien continuer \u00e0 faire leur m\u00e9ditation habituelle de\\n- trente minutes le matin et\\n- de trente minutes le soir\\nen variant les myst\u00e8res comme d'habitude.\\n\\nMais ils peuvent aller plus loin.\\nDurant les autres heures de la journ\u00e9e, ils peuvent\\n- lire les titres ou y penser, et\\n- former l'intention de vouloir m\u00e9diter ces myst\u00e8res d'heure en heure,\\n\\nc'est-\u00e0-dire m\u00eame au milieu de leurs occupations.\\n\\nAvant le sommeil de la nuit, ils forment l'intention de m\u00e9diter\\n- sur les myst\u00e8res correspondants pendant qu'ils dormiront,\\nayant lu auparavant seulement les titres.\\n\\nCependant, le vendredi, il serait pr\u00e9f\u00e9rable de m\u00e9diter sur\\n- la Crucifixion (Heure 19) et\\n- les trois Heures d'Agonie sur la Croix. (Heure 20-21-22)\\n\\nIl est bien entendu que ces m\u00e9ditations, comme toute oraison mentale, doivent\\n\u00eatre accompagn\u00e9es\\n- d'une pr\u00e9paration,\\n- puis d'affections, d'actes d'amour et d'autres choses semblables,\\nsans omettre de faire les remerciements \u00e0 la fin.\\n\\nTroisi\u00e8me mani\u00e8re : 24 personnes m\u00e9ditent chacun une Heure par jour. Il y a une m\u00e9thode qui permet de m\u00e9diter toutes les Heures chaque jour. 24 personnes peuvent s'associer pour faire cet exercice. Chacune prend une heure.\\n\\nCelles \u00e0 qui revient une heure de la nuit pourraient\\n- la faire d'avance, en soir\u00e9e, et\\n- puis former l'intention de la r\u00e9p\u00e9ter \u00e0 l'heure correspondante,\\nm\u00eame durant le sommeil.\\n\\nMais si on pouvait trouver huit personnes ferventes,\\n- toutes dispos\u00e9es \u00e0 faire une heure de veille durant la nuit\\npar amour pour J\u00e9sus,\\n- Lui qui passa toutes ses nuits \u00e0 prier pour nous,\\nalors, de 22h \u00e0 6h, ces huit personnes feraient chacune l'Heure assign\u00e9e.\\n\\nAinsi, toutes les 24 Heures seraient mises en pratique de mani\u00e8re\\nininterrompue,\\n- au grand plaisir de Notre-Seigneur et\\n- au grand profit des 24 personnes qui les feraient, et\\n- pour le bien de toute I'\u00c9glise militante, de toute l'\u00c9glise souffrante, et\\n- pour la gloire de l'\u00c9glise triomphante.\\n\\nAvec un peu de bonne volont\u00e9, cette mani\u00e8re de faire pourrait \u00eatre pratiqu\u00e9e\\nchez les communaut\u00e9s religieuses contemplatives\\n- qui en recevraient des b\u00e9n\u00e9dictions sp\u00e9ciales de Dieu.\\n\\nLes 24 Heures de la Passion de Notre-Seigneur J\u00e9sus-Christ De 17h \u00e0 18h : J\u00e9sus fait ses adieux \u00e0 sa M\u00e8re. De 18h \u00e0 19h : J\u00e9sus se s\u00e9pare de sa Tr\u00e8s Sainte M\u00e8re et se rend au C\u00e9nacle. De 19h \u00e0 20h : La c\u00e8ne l\u00e9gale. De 20h \u00e0 21h : Le lavement des pieds - La C\u00e8ne Eucharistique. De 21h \u00e0 22h : Premi\u00e8re Heure d'Agonie dans le Jardin. De 22h \u00e0 23h : Deuxi\u00e8me Heure d'Agonie dans le Jardin. De 23h \u00e0 24h : Troisi\u00e8me Heure d'Agonie dans le Jardin. De 24h \u00e0 1h : L'arrestation de J\u00e9sus dans le Jardin des Oliviers. De 1h \u00e0 2h : J\u00e9sus est pr\u00e9cipit\u00e9 dans le torrent du C\u00e9dron.\\n\\nDe 2h \u00e0 3h : J\u00e9sus est pr\u00e9sent\u00e9 \u00e0 Anne. De 3h \u00e0 4h : Chez Ca\u00efphe, J\u00e9sus accus\u00e9 par de faux t\u00e9moins. De 4h \u00e0 5h : J\u00e9sus est parmi les soldats. De 5h \u00e0 6h : L'emprisonnement de J\u00e9sus. De 6h \u00e0 7h : J\u00e9sus est ramen\u00e9 chez Ca\u00efphe, puis conduit chez Pilate. De 7h \u00e0 8h : J\u00e9sus est devant Pilate, puis devant H\u00e9rode. De 8h \u00e0 9h : Barabbas est pr\u00e9f\u00e9r\u00e9 \u00e0 J\u00e9sus - La flagellation. De 9h \u00e0 10h : Le couronnement d'\u00e9pines - La condamnation \u00e0 mort. De 10h \u00e0 11h : J\u00e9sus est charg\u00e9 de sa Croix et conduit au Calvaire o\u00f9 on le d\u00e9pouille de ses v\u00eatements. De 11h \u00e0 midi : La crucifixion. De midi \u00e0 13h : Premi\u00e8re heure d'Agonie sur la Croix. De 13h \u00e0 14h : Deuxi\u00e8me heure d'Agonie sur la Croix. De 14h \u00e0 15h : Troisi\u00e8me heure d'Agonie sur la Croix. La Mort de J\u00e9sus. De 15h \u00e0 16h : J\u00e9sus transperc\u00e9 par la lance - Sa d\u00e9position. De 16h \u00e0 17h : La s\u00e9pulture de J\u00e9sus. La D\u00e9solation de la Vierge Marie Pri\u00e8re avant chaque Heure\"},{\"section_id\":\"PASSION24.SECTION.GETHSEMANI\",\"segment_type\":\"GETHSEMANI_SPECIAL\",\"title\":\"Les trois Heures de Geths\u00e9mani\",\"display_text\":\"R\u00e8gle sp\u00e9ciale : les Heures 5, 6 et 7 utilisent l\u2019oraison pr\u00e9paratoire et la pri\u00e8re de remerciement de l\u2019Heure Sainte.\"}]}");

// Fast hash for highlight integrity — detects corpus text changes
function paraHash(str) {
  let h = 5381;
  for (let i = 0; i < str.length; i++) h = (h * 33 ^ str.charCodeAt(i)) | 0;
  return (h >>> 0).toString(36);
}

const SafeStorage = {
  get(key, fallback=null) {
    try { const v=localStorage.getItem(key); return v===null?fallback:v; }
    catch(e){ return fallback; }
  },
  set(key, value) { try { localStorage.setItem(key, value); } catch(e){} },
  remove(key)     { try { localStorage.removeItem(key); } catch(e){} }
};
const CORPUS_VERSION='2021-GE-LumenLuminis';

const FONT_PRESETS = [
  { reading: 16, ui: 14, nav: 14, eyebrow: 11, title: 18, modal: 15 },

];

// ── Persistence ──
function saveState() {
  try {
    localStorage.setItem('lp24_schema', STORAGE_SCHEMA_VERSION);
    localStorage.setItem('lp24_read', JSON.stringify([...state.readHours]));
    localStorage.setItem('lp24_favs', JSON.stringify(state.favorites));
    localStorage.setItem('lp24_hl', JSON.stringify([...state.highlights]));
    localStorage.setItem('lp24_thl', JSON.stringify(state.textHighlights));
    localStorage.setItem('lp24_tabs', JSON.stringify(state.hourTabs));
    localStorage.setItem('lp24_pos', JSON.stringify(state.lastParas));
    localStorage.setItem('lp24_font', state.fontSize);
    localStorage.setItem('lp24_theme', state.theme);
    if (state.currentHour) localStorage.setItem('lp24_lastHour', state.currentHour);
  } catch(e) {}
}
function loadState() {
  try {
    const storedSchema=parseInt(localStorage.getItem('lp24_schema')||'1');
    if(storedSchema<STORAGE_SCHEMA_VERSION){localStorage.removeItem('lp24_thl');}
    const r = localStorage.getItem('lp24_read'); if (r) state.readHours = new Set(JSON.parse(r));
    const f = localStorage.getItem('lp24_favs');
    if (f) {
      const favData = JSON.parse(f);
      Object.values(favData).forEach(fav => {
        if (!fav.type) {
          fav.type = fav.id && fav.id.includes('.REF.') ? 'reflection' :
                     fav.id && fav.id.includes('.DESOL.') ? 'subsection' : 'meditation';
        }
      });
      state.favorites = favData;
    }
    const h = localStorage.getItem('lp24_hl'); if (h) state.highlights = new Set(JSON.parse(h));
    const thl = localStorage.getItem('lp24_thl'); if (thl) { try { state.textHighlights = JSON.parse(thl); } catch(e) {} }
    const tabs=localStorage.getItem('lp24_tabs'); if(tabs){try{state.hourTabs=JSON.parse(tabs);}catch(e){}}
    const pos=localStorage.getItem('lp24_pos');   if(pos){try{state.lastParas=JSON.parse(pos);}catch(e){}}
    const fs = localStorage.getItem('lp24_font'); if (fs !== null) state.fontSize = parseInt(fs);
    const th = localStorage.getItem('lp24_theme'); if (th) state.theme = th;
  } catch(e) {}
  state.studyMode = SafeStorage.get('lp24_mode','0') === '1';
  applyFontSize(); applyTheme();
}

// ── Theme & Font ──
function toggleTheme() { state.theme = state.theme === 'light' ? 'dark' : 'light'; applyTheme(); saveState(); }
function applyTheme() { document.documentElement.setAttribute('data-theme', state.theme); }
function toggleFontPanel() { document.getElementById('fontPanel').classList.toggle('open'); }
function changeFontSize(s) { state.fontSize = s; applyFontSize(); saveState(); document.getElementById('fontPanel').classList.remove('open'); }
function applyFontSize() {
  const preset = FONT_PRESETS[state.fontSize] || FONT_PRESETS[1];
  const root = document.documentElement;
  root.style.setProperty('--reading-size', preset.reading + 'px');
  root.style.setProperty('--ui-size',      preset.ui      + 'px');
  root.style.setProperty('--nav-size',     preset.nav     + 'px');
  root.style.setProperty('--eyebrow-size', preset.eyebrow + 'px');
  root.style.setProperty('--title-size',   preset.title   + 'px');
  root.style.setProperty('--modal-size',   preset.modal   + 'px');
}

// ── Sidebar ──
function buildSidebar() {
  const isActiveHour=(n)=>state.currentHour===n&&state.view==='reader';
  const isActivePrayer=(id)=>state.currentPrayer===id&&state.view==='prayer';
  const isActiveSection=(id)=>state.currentSection===id&&state.view==='section';
  document.getElementById('sideHours').innerHTML = CORPUS.hours.map(h => `
    <button class="sidebar-item ${isActiveHour(h.hour_number)?'active':''}"
      onclick="openHour(${h.hour_number}); closeSidebar()">
      <span class="hour-num">${h.hour_number}</span>
      <span>${h.title}<span class="hour-time">${h.display_time}</span></span>
    </button>`).join('');
  document.getElementById('sidePrayers').innerHTML = CORPUS.prayers.map(p => `
    <button class="sidebar-item ${isActivePrayer(p.prayer_id)?'active':''}"
      onclick="openPrayer('${p.prayer_id}'); closeSidebar()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      ${p.title}
    </button>`).join('');
  document.getElementById('sideSections').innerHTML = CORPUS.sections.map(s => `
    <button class="sidebar-item ${isActiveSection(s.section_id)?'active':''}"
      onclick="openSection('${s.section_id}'); closeSidebar()">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      ${s.title}
    </button>`).join('');
}
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); document.getElementById('sidebarOverlay').classList.toggle('open'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('open'); }

// ── Prayer Modal ──
function renderPrayerParagraph(pr, p, modal = false) {
  const txt = p.t || '';
  const paraClass = modal ? 'prayer-modal-para' : 'block-paragraph';
  if (pr.prayer_id === 'PASSION24.PRAYER.DE_PROFUNDIS') {
    if (/^Psaume\s+129/i.test(txt)) return `<div class="psalm-title">${escHtml(txt)}</div>`;
    const lines = txt.split('\n');
    const rendered = lines.map(line => {
      const m = line.match(/^(\d{2})\s+(.*)$/);
      if (m) return `<div class="psalm-verse"><span class="psalm-num">${escHtml(m[1])}</span><span class="psalm-line">${escHtml(m[2])}</span></div>`;
      return `<div class="psalm-verse"><span class="psalm-num" aria-hidden="true"></span><span class="psalm-line">${escHtml(line)}</span></div>`;
    }).join('');
    return `<div class="psalm-stanza">${rendered}</div>`;
  }
  return `<p class="${paraClass}">${escHtml(txt)}</p>`;
}
let _prayerModalTrigger = null;
function openPrayerModal(prayerId, isHoly = false) {
  const pr = PRAYERS[prayerId];
  if (!pr) return;
  _prayerModalTrigger = document.activeElement;
  document.getElementById('prayerModalEyebrow').textContent = isHoly ? 'Heure Sainte — Gethsémani' : 'Prière';
  document.getElementById('prayerModalTitle').textContent = pr.title;
  document.getElementById('prayerModalBody').innerHTML =
    pr.paragraphs.map(p => renderPrayerParagraph(pr, p, true)).join('');
  document.getElementById('prayerOverlay').classList.add('open');
  const modal = document.getElementById('prayerModal');
  modal.style.display = 'flex';
  modal.style.flexDirection = 'column';
  document.getElementById('prayerModalBody').scrollTop = 0;
  document.body.style.overflow = 'hidden';
  requestAnimationFrame(() => modal.focus());
}
function closePrayerModal() {
  document.getElementById('prayerOverlay').classList.remove('open');
  document.getElementById('prayerModal').style.display = 'none';
  document.body.style.overflow = '';
  if (_prayerModalTrigger && typeof _prayerModalTrigger.focus === 'function') {
    _prayerModalTrigger.focus(); _prayerModalTrigger = null;
  }
}
// Global keyboard handler
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closePrayerModal();
    document.getElementById('fontPanel').classList.remove('open');
    document.getElementById('favPanel').classList.remove('open');
    closeMobileActionBar();
  }
});
// Click-outside-to-close for font panel and fav panel
document.addEventListener('click', e => {
  const fp = document.getElementById('fontPanel');
  const fav = document.getElementById('favPanel');
  if (fp && fp.classList.contains('open') && !fp.contains(e.target) && !e.target.closest('[onclick*="toggleFontPanel"]')) {
    fp.classList.remove('open');
  }
  if (fav && fav.classList.contains('open') && !fav.contains(e.target) && !e.target.closest('[onclick*="toggleFavPanel"]')) {
    fav.classList.remove('open');
  }
});

// ── Build prayer button rows ──
function buildOpeningButtons(hour) {
  const isGeth = GETHSEMANI_HOURS.has(hour.hour_number);
  const openIds = hour.opening_prayer_ids || [];
  if (!openIds.length) return '';

  const buttons = openIds.map(id => {
    const pr = PRAYERS[id];
    if (!pr) return '';
    const isHoly = id === 'PASSION24.PRAYER.HOLY_HOUR_PREPARATION';
    const cls = isHoly ? 'prayer-trigger-btn holy' : 'prayer-trigger-btn';
    const icon = isHoly
      ? `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`
      : `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`;
    return `<button class="${cls}" onclick="openPrayerModal('${id}', ${isHoly})">${icon} ${escHtml(pr.title)}</button>`;
  }).join('');

  return `<div class="prayer-buttons-row">${buttons}</div>`;
}

function buildClosingButtons(hour) {
  const isGeth = GETHSEMANI_HOURS.has(hour.hour_number);
  let closeIds = [...(hour.closing_prayer_ids || [])];

  // Gethsemani hours: add standard closing after special one
  if (isGeth && !closeIds.includes('PASSION24.PRAYER.AFTER_EACH_HOUR')) {
    closeIds.push('PASSION24.PRAYER.AFTER_EACH_HOUR');
  }
  if (!closeIds.length) return '';

  const buttons = closeIds.map(id => {
    const pr = PRAYERS[id];
    if (!pr) return '';
    const isHoly = id === 'PASSION24.PRAYER.HOLY_HOUR_THANKSGIVING';
    const cls = isHoly ? 'prayer-trigger-btn holy' : 'prayer-trigger-btn';
    const icon = isHoly
      ? `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>`
      : `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>`;
    return `<button class="${cls}" onclick="openPrayerModal('${id}', ${isHoly})">${icon} ${escHtml(pr.title)}</button>`;
  }).join('');

  return `<div class="prayer-buttons-row closing">${buttons}</div>`;
}

// ── History ──
function pushHistory(v, d) {
  state.history.push({view: v, data: d});
  document.getElementById('backBtn').style.display = 'flex';
}
function goBack() {
  if (!state.history.length) return;
  const prev = state.history.pop();
  document.getElementById('backBtn').style.display = state.history.length ? 'flex' : 'none';
  if (prev.view === 'home') { state.view = 'home'; renderHome(); }
  else if (prev.view === 'reader') { state.currentHour = prev.data; renderReader(CORPUS.hours.find(h => h.hour_number === prev.data), false); }
  else if (prev.view === 'section') { state.currentSection = prev.data; openSection(prev.data, false); }
  else if (prev.view === 'prayer') { state.currentPrayer = prev.data; openPrayer(prev.data, false); }
  else if (prev.view === 'provenance' || prev.view === 'help') { showHelp(); }
  else if (prev.view === 'search') { showSearchView(); }
  buildSidebar();
}

  state.view = 'home'; state.currentHour = null; state.currentSection = null; state.currentPrayer = null;

  document.getElementById('progressWrap').style.display = 'none';

}

// ── Reader ──
function openHour(n, push = true) {
  const h = CORPUS.hours.find(x => x.hour_number === n);
  if (!h) return;
  if (push) pushHistory(state.view, state.currentHour);
  state.view = 'reader'; state.currentHour = n;
  state.activeTab = state.hourTabs[n] || 'meditation';
  SafeStorage.set('lp24_lastHour', n);
  renderReader(h); buildSidebar();
  document.getElementById('progressWrap').style.display = 'block';
  setBottomNav('none');
  const _savedPara=state.lastParas[n];
  if(_savedPara){ setTimeout(()=>{ const el=document.getElementById(_savedPara); if(el) smoothScrollTo(el, {behavior:'smooth',block:'start'}); },80); }
}
function renderReader(hour, scroll = true) {
  if (typeof hour === 'number') hour = CORPUS.hours.find(h => h.hour_number === hour);
  const hasRefl = hour.reflections && hour.reflections.length > 0;
  const hasSub = hour.subsections && hour.subsections.length > 0;
  const isRead = state.readHours.has(hour.hour_number);
  const prev = CORPUS.hours.find(h => h.hour_number === hour.hour_number - 1);
  const next = CORPUS.hours.find(h => h.hour_number === hour.hour_number + 1);

  const openingBtns = buildOpeningButtons(hour);
  const closingBtns = buildClosingButtons(hour);

  const tabsHtml = hasRefl ? `
    <div class="tabs">
      <button class="tab-btn ${state.activeTab==='meditation'?'active':''}" onclick="switchTab('meditation')">
        Méditation<span class="tab-count">(${hour.paragraphs.length})</span>
      </button>
      <button class="tab-btn ${state.activeTab==='reflections'?'active':''}" onclick="switchTab('reflections')">
        Réflexions et pratiques<span class="tab-count">(${hour.reflections.length})</span>
      </button>
    </div>` : '';

  const medHtml = hour.paragraphs.length > 0
    ? hour.paragraphs.map(p => buildParaBlock(p, hour.hour_number)).join('')
    : `<p style="font-style:italic;color:var(--ink4);font-family:var(--font-ui);padding:1.5rem 0">Texte en préparation.</p>`;

  const refHtml = hasRefl ? `
    <div class="reflections-wrap">
      <div class="reflections-label">Réflexions et pratiques</div>
      ${hour.reflections.map((p, i) => `
      <div class="ref-para-block" id="${p.id}">
        <div class="ref-para-num">${i + 1}</div>
        <div class="ref-para para-text" data-para-id="${p.id}">${renderParaText(p.t, p.id)}</div>
        <div class="para-actions ref-actions">
          <button class="para-action-btn ${state.favorites[p.id]?'favorited':''}" onclick="toggleFavorite('${p.id}',${hour.hour_number})" title="Favori" aria-label="Ajouter aux favoris">★</button>
          <button class="para-action-btn" onclick="toggleHighlight('${p.id}')" title="Marquer le paragraphe" aria-label="Marquer ce paragraphe">◈</button>
          <button class="para-action-btn" onclick="copyReflection('${p.id}',${hour.hour_number})" title="Copier" aria-label="Copier la citation">⎘</button>
        </div>
      </div>`).join('')}
    </div>` : '';

  let subHtml = '';
  if (hasSub) {
    let subOffset = hour.paragraphs.length;
    hour.subsections.forEach(sub => {
      subHtml += `<h3 class="subsection-heading">${escHtml(sub.title)}</h3>`;
      subHtml += sub.paragraphs.map((p, i) => buildParaBlock({...p, n: subOffset + i + 1}, hour.hour_number)).join('');
    });
  }

  document.getElementById('content').innerHTML = `
  <div class="reader-screen">
    <div class="reader-header">
      <div class="reader-eyebrow">${hour.hour_number}e Heure · Les 24 Heures de la Passion</div>
      <h2 class="reader-title">${escHtml(hour.title)}</h2>
      <div class="reader-time">${hour.display_time}</div>
          </div>

    ${openingBtns}
    ${tabsHtml}

    <div id="meditationContent" style="display:${!hasRefl||state.activeTab==='meditation'?'block':'none'}">
      ${medHtml}${subHtml}
    </div>
    <div id="reflectionsContent" style="display:${hasRefl&&state.activeTab==='reflections'?'block':'none'}">
      ${refHtml}
    </div>

    ${closingBtns}

    <div class="hour-nav">
      <button class="nav-btn" onclick="openHour(${prev?prev.hour_number:-1})" ${!prev?'disabled':''}>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
        <span><span class="nav-label">Précédente</span>${prev?escHtml(prev.short_title.slice(0,28)):''}</span>
      </button>
      <button class="mark-read-btn ${isRead?'done':''}" onclick="toggleRead(${hour.hour_number})" id="markReadBtn">
        ${isRead?'✓ Lue':'Marquer lue'}
      </button>
      <button class="nav-btn" onclick="openHour(${next?next.hour_number:-1})" ${!next?'disabled':''}>
        <span><span class="nav-label">Suivante</span>${next?escHtml(next.short_title.slice(0,28)):''}</span>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </div>`;

  if (scroll) document.getElementById('content').scrollTop = 0;
  buildSidebar();
}

function buildParaBlock(p, hourNum) {
  const isFav = !!state.favorites[p.id];
  const isHl = state.highlights.has(p.id);
  return `
  <div class="para-block ${isHl?'highlighted':''} ${isFav?'favorited':''}" id="${p.id}"
    ontouchstart="startLongPress('${p.id}',${hourNum},event)" ontouchend="cancelLongPress()" ontouchmove="cancelLongPress()">
    <span class="para-num">${p.n}${(()=>{const sp=SPEECH_DATA[p.id];if(!sp)return '';const j=sp.some(s=>s.speaker==='JESUS');const m=sp.some(s=>s.speaker==='MARY');return(j?'<span class="speaker-badge badge-jesus" title="Paroles de Jésus">✝ Jésus</span>':'')+( m?'<span class="speaker-badge badge-mary" title="Paroles de Marie">✦ Marie</span>':'');})()
    }</span>
    <div class="para-text">${renderParaText(p.t, p.id)}</div>
    <div class="para-actions">
      <button class="para-action-btn ${isFav?'favorited':''}" onclick="toggleFavorite('${p.id}',${hourNum})" title="Favori" aria-label="Ajouter aux favoris">★</button>
      <button class="para-action-btn" onclick="toggleHighlight('${p.id}')" title="Marquer le paragraphe" aria-label="Marquer ce paragraphe">◈</button>
      <button class="para-action-btn" onclick="copyPara('${p.id}',${hourNum})" title="Copier" aria-label="Copier la citation">⎘</button>
    </div>
  </div>`;
}

let _lpTimer = null;
function startLongPress(paraId, hourNum, e) {
  _lpTimer = setTimeout(() => {
    if (navigator.vibrate) navigator.vibrate(40);
    showMobileActionBar(paraId, hourNum);
  }, 480);
}
function cancelLongPress() { clearTimeout(_lpTimer); _lpTimer = null; }
function showMobileActionBar(paraId, hourNum) {
  (function(){var _m=document.getElementById('mobileActionBar');if(_m)_m.remove();})();
  const isFav = !!state.favorites[paraId];
  const isHl = state.highlights.has(paraId);
  const num = paraId.split('.').pop();
  const bar = document.createElement('div');
  bar.id = 'mobileActionBar';
  bar.className = 'mobile-action-bar';
  bar.innerHTML = `
    <div class="mob-bar-label">Paragraphe ${num}</div>
    <div class="mob-bar-actions">
      <button class="mob-bar-btn ${isFav?'active':''}" onclick="toggleFavorite('${paraId}',${hourNum});closeMobileActionBar()">
        <span class="mob-btn-icon">★</span><span class="mob-btn-label">${isFav?'Favori retiré':'Favori'}</span>
      </button>
      <button class="mob-bar-btn" onclick="openMobileHighlight('${paraId}');closeMobileActionBar()">
        <span class="mob-btn-icon">◐</span><span class="mob-btn-label">Surligner</span>
      </button>
      <button class="mob-bar-btn" onclick="copyPara('${paraId}',${hourNum});closeMobileActionBar()">
        <span class="mob-btn-icon">⎘</span><span class="mob-btn-label">Copier</span>
      </button>
      <button class="mob-bar-btn mob-bar-close" onclick="closeMobileActionBar()">
        <span class="mob-btn-icon">✕</span><span class="mob-btn-label">Fermer</span>
      </button>
    </div>`;
  document.body.appendChild(bar);
  requestAnimationFrame(() => bar.classList.add('visible'));
}
function closeMobileActionBar() {
  const bar = document.getElementById('mobileActionBar');
  if (!bar) return;
  bar.classList.remove('visible');
  setTimeout(() => bar.remove(), 250);
}

function switchTab(tab, preserveScroll = false) {
  state.activeTab = tab;
  if (state.currentHour) { state.hourTabs[state.currentHour]=tab; saveState(); }
  const med = document.getElementById('meditationContent');
  const ref = document.getElementById('reflectionsContent');
  if (med) med.style.display = tab === 'meditation' ? 'block' : 'none';
  if (ref) ref.style.display = tab === 'reflections' ? 'block' : 'none';
  document.querySelectorAll('.tab-btn').forEach((btn, i) => {
    btn.classList.toggle('active', (i===0&&tab==='meditation')||(i===1&&tab==='reflections'));
  });
  if (!preserveScroll) document.getElementById('content').scrollTop = 0;
}
