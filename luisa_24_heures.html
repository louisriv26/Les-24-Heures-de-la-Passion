", \"n\": 6, \"t\": \"Jésus est couronné d’épines Mon Amour, si Tu ne me soutiens pas de ton Regard, je ne pourrai pas continuer à Te voir ainsi torturé. Je sens des frissons dans mes os. J'ai le cœur qui bat. Je me sens mourir : « Jésus, Jésus, aide-moi ! »\"}, {\"id\": \"PASSION24.HOUR.17.P007\", \"n\": 7, \"t\": \"Et Toi, Tu sembles me dire :\"}, {\"id\": \"PASSION24.HOUR.17.P008\", \"n\": 8, \"t\": \"« Mon enfant, courage,\\n- ne perds rien de ce que Je souffre,\\n- sois attentive à mes Enseignements.\"}, {\"id\": \"PASSION24.HOUR.17.P009\", \"n\": 9, \"t\": \"Je dois refaire l'homme en toutes choses. Ses fautes l'ont couronné d'opprobres et de confusion, si bien qu'il ne peut paraître devant ma Majesté. Ses fautes l'ont déshonoré en lui faisant perdre tout droit aux honneurs et à la gloire.\"}, {\"id\": \"PASSION24.HOUR.17.P010\", \"n\": 10, \"t\": \"Par conséquent, Je veux être couronné d'épines pour\\n- remettre sa couronne sur son front et\\n- lui restituer tous ses droits, son honneur et sa gloire.\"}, {\"id\": \"PASSION24.HOUR.17.P011\", \"n\": 11, \"t\": \"Mes épines seront devant mon Père\\n- réparations et disculpation pour ses nombreux péchés\\ndans ses pensées, surtout pour son orgueil.\"}, {\"id\": \"PASSION24.HOUR.17.P012\", \"n\": 12, \"t\": \"Mes épines seront\\n- des Sources de Lumière pour chaque intelligence créée,\\n- des Voix de supplication pour qu'elles ne M’offensent plus.\"}, {\"id\": \"PASSION24.HOUR.17.P013\", \"n\": 13, \"t\": \"Toi, unis-toi à Moi, prie et répare avec Moi. »\\nPoursuivant dans leurs cruautés, tes ennemis\\n- Te font asseoir,\\n- déposent sur Toi une guenille de pourpre,\\n- prennent une couronne d'épines qu'ils viennent de fabriquer,\"}, {\"id\": \"PASSION24.HOUR.17.P014\", \"n\": 14, \"t\": \"et avec une furie infernale, la placent sur ta Tête adorable. Puis, à coups de bâton, ils Te font pénétrer les épines dans la Tête.\"}, {\"id\": \"PASSION24.HOUR.17.P015\", \"n\": 15, \"t\": \"Les épines\\n- parviennent à tes Yeux et à tes Oreilles,\\n- pénètrent ton Crâne jusque derrière ta Nuque.\"}, {\"id\": \"PASSION24.HOUR.17.P016\", \"n\": 16, \"t\": \"Mon Amour, quel Supplice, quelles Souffrances incommensurables ! Combien de Morts cruelles ne subis-Tu pas ! Le Sang coule sur ton Visage : on ne voit que du Sang.\"}, {\"id\": \"PASSION24.HOUR.17.P017\", \"n\": 17, \"t\": \"Mais sous ces épines et ce Sang, on voit ton Visage infiniment saint\\n- rayonnant la Douceur, la Paix et l'Amour.\\nPoursuivant avec leurs moqueries, tes bourreaux\\n- Te mettent un roseau à la Main en guise de sceptre et\\n- commencent leurs sarcasmes.\\nIls Te saluent comme Roi des Juifs, battent ta couronne et Te giflent.\"}, {\"id\": \"PASSION24.HOUR.17.P018\", \"n\": 18, \"t\": \"Et Toi, Tu Te tais et répares les ambitions de ceux\\n- qui aspirent à régner,\\n- qui recherchent les dignités,\\n- qui, se trouvant en autorité et ne se comportant pas bien,\\ncausent la ruine des peuples et des âmes sur lesquelles ils ont autorité !\"}, {\"id\": \"PASSION24.HOUR.17.P019\", \"n\": 19, \"t\": \"Au moyen de ce roseau que Tu tiens dans ta Main, doux Jésus,\\nTu répares beaucoup d'œuvres,\\n- peut-être bonnes en soi,\\n- mais vides d'esprit intérieur et\\n- faites même dans des intentions mauvaises.\"}, {\"id\": \"PASSION24.HOUR.17.P020\", \"n\": 20, \"t\": \"Par les insultes et les moqueries que Tu subis, Tu répares pour ceux\\n- qui profanent et ridiculisent les choses saintes.\"}, {\"id\": \"PASSION24.HOUR.17.P021\", \"n\": 21, \"t\": \"Mon Roi Jésus, tes ennemis continuent leurs insultes.\\nIl y a tellement de Sang qui coule de ta Tête qu'il\\n- en parvient jusque dans ta Bouche,\\n- T’empêchant de me faire entendre clairement ta Voix.\"}, {\"id\": \"PASSION24.HOUR.17.P022\", \"n\": 22, \"t\": \"Jésus, je veux mettre ma tête sous ces épines, afin de ressentir leurs piqûres.\\nJésus, comme il est bon d'être avec Toi, même au milieu de mille tourments !\\nEt Tu sembles me dire :\\n« Mon enfant, ces épines disent\\n- que Je veux être Roi de chaque cœur,\\n- que c'est à Moi que revient toute domination.\\nToi, prends ces épines et pique-toi le Cœur.\"}, {\"id\": \"PASSION24.HOUR.17.P023\", \"n\": 23, \"t\": \"Fais-en sortir tout ce qui ne M’appartient pas. Laisse une épine dans ton cœur comme rappel que c'est Moi ton Roi, pour empêcher que quelque chose d'autre y entre.\"}, {\"id\": \"PASSION24.HOUR.17.P024\", \"n\": 24, \"t\": \"Va chez tous les cœurs et, en les piquant,\\nfais-en sortir toute fumée d'orgueil, pourriture, et\\nconstitue-Moi Roi de tous. »\\nMon Amour,\\nje Te prie de me piquer\\n- les oreilles de tes épines, afin qu'elles puissent n'entendre que ta Voix,\\n- mes yeux pour qu'ils ne regardent que Toi,\\n- ma bouche pour que ma langue reste\\nmuette par rapport à tout ce qui pourrait T’offenser et\\nlibre pour Te louer et Te bénir en toutes choses.\"}, {\"id\": \"PASSION24.HOUR.17.P025\", \"n\": 25, \"t\": \"Mon Roi, entoure-moi d'épines, et que ces épines me gardent toute attentive à Toi. Jésus, je vois que tes ennemis Te conduisent à Pilate, qui va Te condamner à mort ! Je veux essuyer ton Sang et lui donner un baiser.\"}, {\"id\": \"PASSION24.HOUR.17.P026\", \"n\": 26, \"t\": \"Mon Amour, aide-moi à continuer de T’accompagner sur ton Chemin Douloureux.\"}, {\"id\": \"PASSION24.HOUR.17.P027\", \"n\": 27, \"t\": \"Jésus est de nouveau envoyé à Pilate\"}, {\"id\": \"PASSION24.HOUR.17.P028\", \"n\": 28, \"t\": \"Mon Jésus couronné, mon cœur, qui a été blessé par ton Amour et transpercé par tes épines, ne peut vivre sans Toi. Te voilà maintenant devant Pilate. Quel spectacle émouvant ! Les Cieux sont saisis d'horreur et l'enfer tremble de peur et de rage !\"}, {\"id\": \"PASSION24.HOUR.17.P029\", \"n\": 29, \"t\": \"Ô ma Vie, je ne peux supporter de Te voir dans un tel état. L'attirance de ton Amour m'amène à Te regarder quand même, afin que je comprenne bien tes Souffrances. À travers mes larmes et mes soupirs d'amour, je Te contemple. Mon Jésus, Tu es presque nu. Au lieu de tes vêtements, Tu es revêtu de Sang.\"}, {\"id\": \"PASSION24.HOUR.17.P030\", \"n\": 30, \"t\": \"Tes Chairs sont déchirées, tes Os sont dénudés, et ton Visage infiniment saint est méconnaissable. Les épines enfoncées dans ta Tête T’arrivent jusqu'aux Yeux et au Visage. Ton Sang précieux s'écoule jusqu'à terre. Mon Jésus, je ne Te reconnais plus. Comme Tu es mal en point ! Tu es parvenu aux excès les plus profonds des humiliations et des tourments !\"}, {\"id\": \"PASSION24.HOUR.17.P031\", \"n\": 31, \"t\": \"Je ne peux plus supporter cette vue si pénible. Je me sens mourir ! Je voudrais Te soustraire de la présence de Pilate pour T'enfermer dans mon cœur et Te donner du repos.\"}, {\"id\": \"PASSION24.HOUR.17.P032\", \"n\": 32, \"t\": \"Je voudrais guérir tes Plaies par mon amour. Je voudrais inonder de ton Sang le monde entier pour atteindre toutes les âmes et Te les amener comme tes conquêtes ! Ô patient Jésus, c'est avec difficulté qu'à travers les épines\"}, {\"id\": \"PASSION24.HOUR.17.P033\", \"n\": 33, \"t\": \"Tu me regardes et Tu me dis :\"}, {\"id\": \"PASSION24.HOUR.17.P034\", \"n\": 34, \"t\": \"« Mon enfant, viens entre mes Bras, appuie ta tête sur ma Poitrine. Tu percevras des Souffrances plus intenses et plus cruelles.\"}, {\"id\": \"PASSION24.HOUR.17.P035\", \"n\": 35, \"t\": \"Car ce que tu vois à l'extérieur de mon Humanité n'est que l'écho de mes Peines intérieures.\"}, {\"id\": \"PASSION24.HOUR.17.P036\", \"n\": 36, \"t\": \"Prête attention aux Battements de mon Cœur\"}, {\"id\": \"PASSION24.HOUR.17.P037\", \"n\": 37, \"t\": \"Tu comprendras que Je répare\\n- les injustices de ceux qui commandent,\\n- les oppressions qu'ils exercent sur les pauvres et les innocents,\\n- leur orgueil qui,\\npour obtenir des dignités, des fonctions ou la richesse, ne se gêne pas\\n- de désobéir aux lois élémentaires de leur conscience et\\n- d'écorcher leur prochain,\\nfermant leurs yeux à la Lumière de la Vérité.\\nPar ces épines, Je veux briser leur orgueil.\"}, {\"id\": \"PASSION24.HOUR.17.P038\", \"n\": 38, \"t\": \"Par les trous qu'elles font dans ma Tête, Je veux me frayer un chemin dans leur intelligence, pour tout y réorganiser selon la Lumière de la Vérité.\"}, {\"id\": \"PASSION24.HOUR.17.P039\", \"n\": 39, \"t\": \"En étant ainsi humilié devant ce juge injuste,\"}, {\"id\": \"PASSION24.HOUR.17.P040\", \"n\": 40, \"t\": \"Je veux faire comprendre à tous que la seule vertu est celle qui rend l'homme maître de lui-même.\"}, {\"id\": \"PASSION24.HOUR.17.P041\", \"n\": 41, \"t\": \"Et J'enseigne à ceux qui commandent que la vertu unie au savoir honnête est la seule qui rend apte à gouverner et diriger les autres. Tandis que les dignités sans la vertu sont des choses dangereuses et à déplorer. Mon enfant, fais écho à mes Réparations et continue à contempler mes Peines. » Mon Amour, je vois que,\"}, {\"id\": \"PASSION24.HOUR.17.P042\", \"n\": 42, \"t\": \"- Te voyant si mal en point, Pilate frissonne.\\nImpressionné, il s'exclame :\\n« Est-il possible qu'il y ait tant de cruauté dans des poitrines humaines ?\\nAh ! ce n'était pas ce que je voulais quand je L'ai condamné à être battu ! »\"}, {\"id\": \"PASSION24.HOUR.17.P043\", \"n\": 43, \"t\": \"Il veut Te libérer d'entre les mains de tes ennemis.\\nTout humble et en détournant de Toi son regard,\\n- car il ne peut supporter la vue de ton horrible état,\\nil recommence à T'interroger :\"}, {\"id\": \"PASSION24.HOUR.17.P044\", \"n\": 44, \"t\": \"« Mais dis-moi, qu'as-Tu fait ? Ton peuple T'a remis entre mes mains : dis-moi, es-Tu roi ? Quel est ton royaume ? » Comme Tu ne réponds pas à ses questions, Pilate ajoute : « Ne sais-Tu pas qu'il est en mon pouvoir de Te libérer ou de Te condamner ? »\"}, {\"id\": \"PASSION24.HOUR.17.P045\", \"n\": 45, \"t\": \"Alors, mon Amour, Tu veux faire resplendir dans l'intelligence de Pilate la Lumière de ta Vérité, et Tu réponds : « Tu n'aurais sur Moi aucun pouvoir s'il ne te venait d'en haut. Cependant, ceux qui M’ont remis entre tes mains ont commis un péché plus grave que le tien. »\"}, {\"id\": \"PASSION24.HOUR.17.P046\", \"n\": 46, \"t\": \"Jésus est présenté comme « Ecce Homo » Alors, ému par la douceur de ta Voix, Pilate décide, le cœur tourmenté, de Te montrer au peuple à partir de sa loge.\"}, {\"id\": \"PASSION24.HOUR.17.P047\", \"n\": 47, \"t\": \"Il espère\\n- que les Juifs seraient pris de compassion en Te voyant si défiguré, et\\n- qu'il pourrait ainsi Te libérer.\\nMon Jésus attristé,\\nTu marches avec difficulté, courbé sous cette horrible couronne d'épines.\\nTon Sang marque tes Pas. En arrivant dehors, Tu vois la foule en tumulte qui,\\nanxieuse, attend ta condamnation.\"}, {\"id\": \"PASSION24.HOUR.17.P048\", \"n\": 48, \"t\": \"Pilate impose le silence\\n- pour ramener tout le monde à l'attention et\\n- pour se faire entendre de tous.\"}, {\"id\": \"PASSION24.HOUR.17.P049\", \"n\": 49, \"t\": \"Il prend avec dégoût les deux lambeaux de la pourpre\\n- qui Te couvre la Poitrine et les Épaules,\\nla soulève, afin que tous voient le piteux état dans lequel Tu Te trouves.\"}, {\"id\": \"PASSION24.HOUR.17.P050\", \"n\": 50, \"t\": \"À voix haute il dit : « Ecce Homo ! Regardez-Le, Il n'a plus l'apparence d'un homme. Observez ses Plaies, on ne Le reconnaît plus. S'Il a fait du mal, Il a déjà souffert assez, même trop Moi, je regrette de L'avoir fait tant souffrir, laissons-Le donc libre ! » À ces paroles, il se fait un silence profond au Ciel, sur terre et en enfer !\"}, {\"id\": \"PASSION24.HOUR.17.P051\", \"n\": 51, \"t\": \"Puis, comme d'une seule voix, j'entends le cri de tous : « Crucifie-Le, crucifie-Le ! Nous Le voulons mort ! »\"}, {\"id\": \"PASSION24.HOUR.17.P052\", \"n\": 52, \"t\": \"Jésus, mon Amour, laisse-moi Te soutenir, car je vois que Tu vacilles sous tant d'accablement. Jésus, ma Vie, je vois que Tu trembles. Ce cri de condamnation à mort pénètre ton Cœur.\"}, {\"id\": \"PASSION24.HOUR.17.P053\", \"n\": 53, \"t\": \"Et dans ces voix Tu perçois la Voix de ton cher Père qui dit : « Mon Fils, Je Te veux mort, et mort crucifié ! »\"}, {\"id\": \"PASSION24.HOUR.17.P054\", \"n\": 54, \"t\": \"Tu entends aussi ta Maman qui, malgré qu'elle en soit navrée, fait écho à ton cher Père et dit : « Fils, je Te veux mort ! »\"}, {\"id\": \"PASSION24.HOUR.17.P055\", \"n\": 55, \"t\": \"Les anges, les saints, l'enfer, tous, d'une voix unanime, crient : « Crucifie-Le, crucifie-Le. » Si bien qu'il n'y a aucune âme qui vive qui ne Te veuille mort.\"}, {\"id\": \"PASSION24.HOUR.17.P056\", \"n\": 56, \"t\": \"Et, à ma plus grande horreur, moi aussi je me sens contrainte par une force suprême à crier : « Crucifie-Le ! »\"}, {\"id\": \"PASSION24.HOUR.17.P057\", \"n\": 57, \"t\": \"Mon Jésus, pardonne à la misérable pécheresse que je suis de Te vouloir mort ! Je Te prie de me faire mourir avec Toi. Et Toi, ô mon Jésus torturé, il semble que, ému par ma souffrance, Tu me dises :\"}, {\"id\": \"PASSION24.HOUR.17.P058\", \"n\": 58, \"t\": \"« Mon enfant, serre-toi sur mon Cœur. Prends part à mes Peines et à mes Réparations. Le moment est solennel : ou bien c'est ma Mort, ou bien c'est la mort de toutes les créatures. En ce moment, deux courants se déversent dans mon Cœur.\"}, {\"id\": \"PASSION24.HOUR.17.P059\", \"n\": 59, \"t\": \"Dans l'un il y a les âmes qui, si elles Me veulent mort, c'est parce qu'elles veulent trouver en Moi la Vie.\"}, {\"id\": \"PASSION24.HOUR.17.P060\", \"n\": 60, \"t\": \"Ainsi, comme J'accepte la mort à leur place, elles sont libérées de la condamnation éternelle et les portes du Ciel s'ouvrent à elles.\"}, {\"id\": \"PASSION24.HOUR.17.P061\", \"n\": 61, \"t\": \"Dans l'autre courant, il y a les âmes qui Me veulent mort par haine et pour la confirmation de leur condamnation. Mon Cœur en est lacéré et ressent la mort de chacune et les peines mêmes de l'enfer où elles se dirigent !\"}, {\"id\": \"PASSION24.HOUR.17.P062\", \"n\": 62, \"t\": \"Ah ! mon Cœur ne supporte pas ces Souffrances cruelles et Me fait répéter : pourquoi tant de Sang versé en vain ? Pourquoi mes Peines seront-elles inutiles pour tant d'âmes ?\"}, {\"id\": \"PASSION24.HOUR.17.P063\", \"n\": 63, \"t\": \"Mon enfant, soutiens-Moi, Je n'en peux plus.\\nPrends part à mes Peines.\\nQue ta vie soit une offrande continuelle\\n- pour sauver les âmes,\\n- pour adoucir mes tortures ! »\\nMon Jésus, tes Peines sont les miennes.\\nEt je veux participer à tes Réparations.\"}, {\"id\": \"PASSION24.HOUR.17.P064\", \"n\": 64, \"t\": \"Je vois qu'aux cris de la foule, Pilate est stupéfait. Il se hâte de dire : « Comment, dois-je crucifier votre Roi ? Moi, je ne trouve pas de faute en Lui pour Le condamner. »\"}, {\"id\": \"PASSION24.HOUR.17.P065\", \"n\": 65, \"t\": \"Et les Juifs crient en assourdissant l'air : « Nous n'avons pas d'autre roi que César. Si tu ne Le condamnes pas, tu n'es pas l'ami de César. Crucifie-Le ! Crucifie-Le ! »\"}, {\"id\": \"PASSION24.HOUR.17.P066\", \"n\": 66, \"t\": \"Jésus est condamné à mort\"}, {\"id\": \"PASSION24.HOUR.17.P067\", \"n\": 67, \"t\": \"Pilate, ne sachant que faire et craignant d'être déposé, se fait apporter une bassine d'eau et, se lavant les mains, il dit : « Moi, je suis innocent du Sang de ce juste. » Et il Te livre à la crucifixion.\"}, {\"id\": \"PASSION24.HOUR.17.P068\", \"n\": 68, \"t\": \"Mais les Juifs ajoutent : « Que son Sang retombe sur nous et sur nos enfants ! » Et, Te voyant condamné, ils font la fête, battent des mains, sifflent, hurlent.\"}, {\"id\": \"PASSION24.HOUR.17.P069\", \"n\": 69, \"t\": \"Et Toi, ô Jésus, Tu répares\\npour ceux qui se trouvent dans les hauts rangs de la société et\\nqui, mus par une vaine crainte et pour ne pas perdre leur poste,\\n- désobéissent aux lois les plus sacrées,\\n- ne se préoccupent pas de la ruine de peuples entiers,\\n- favorisent les impies et condamnent les innocents.\"}, {\"id\": \"PASSION24.HOUR.17.P070\", \"n\": 70, \"t\": \"Tu répares aussi pour ceux, qui, après leur faute, incitent diaboliquement la Colère divine à les punir.\"}, {\"id\": \"PASSION24.HOUR.17.P071\", \"n\": 71, \"t\": \"Tandis que Tu répares tout cela, ton Cœur saigne\\nà cause de la Souffrance de voir ton peuple choisi\\n- marqué de la malédiction du Ciel qu'il vient lui-même d'appeler,\\n- la scellant de ton Sang qu'ils ont appelé sur leur propre tête !\"}, {\"id\": \"PASSION24.HOUR.17.P072\", \"n\": 72, \"t\": \"Ah ! ton Cœur s'évanouit. Laisse-moi Te soutenir, partageant tes Réparations et tes Peines.\"}, {\"id\": \"PASSION24.HOUR.17.P073\", \"n\": 73, \"t\": \"Mais ton Amour Te pousse plus avant. Impatient, Tu cherches la Croix !\"}, {\"id\": \"PASSION24.HOUR.17.P074\", \"n\": 74, \"t\": \"Ma Vie, je Te suivrai, mais, pour l'instant, repose-toi dans mes bras. Après, nous nous rendrons ensemble au Calvaire. Reste en moi et bénis-moi.\"}], \"reflections\": [{\"id\": \"PASSION24.HOUR.17.REF.P001\", \"t\": \"Jésus est couronné d'épines. Il est traité comme un roi de plaisanterie. Il est soumis à des insultes et des Peines inouïes. Il répare ainsi nos péchés d'orgueil. Et nous, évitons-nous les pensées d'orgueil ?\"}, {\"id\": \"PASSION24.HOUR.17.REF.P002\", \"t\": \"Savons-nous attribuer à Dieu le bien que nous faisons ? Savons-nous nous estimer inférieurs aux autres ? Savons-nous garder notre intelligence exempte de pensées frivoles ?\"}, {\"id\": \"PASSION24.HOUR.17.REF.P003\", \"t\": \"Souvent nous ne sommes pas réceptifs à la Grâce, parce que nous gardons notre intelligence occupée par des pensées frivoles. Et alors, comme notre intelligence n'est pas toute remplie de Dieu, le démon trouve la voie libre pour nous importuner. C'est un peu comme si c'était nous-mêmes qui fomentions nos tentations.\"}, {\"id\": \"PASSION24.HOUR.17.REF.P004\", \"t\": \"Quand notre intelligence est remplie de Dieu, alors,\\n- ne trouvant pas en nous d'endroit où diriger ses tentations,\\nle démon s'éloigne confus.\"}, {\"id\": \"PASSION24.HOUR.17.REF.P005\", \"t\": \"Les pensées saintes ont tant de force contre le démon que,\\n- quand il veut s'approcher de nous,\\nces pensées, comme autant d'épées, le blessent et le font s'éloigner.\\nC'est donc à tort que nous nous lamentons quand notre intelligence est\\nimportunée par l'ennemi.\\nNotre manque de vigilance qui l'incite à nous attaquer.\\nC'est comme s'il espionnait notre intelligence pour y déceler des points faibles\\net monter à l'assaut.\"}, {\"id\": \"PASSION24.HOUR.17.REF.P006\", \"t\": \"Alors, au lieu de soulager Jésus\\n- par nos saintes pensées et Lui enlever ses épines,\\nnous les Lui pressons sur la Tête.\\nLa Grâce ne peut présenter à notre intelligence de saintes inspirations.\\nSouvent nous faisons pire. Quand nous sentons le poids des tentations,\\nau lieu de les présenter à Jésus pour les faire brûler au Feu de son Amour,\\n- nous nous inquiétons, nous nous attristons, nous faisons des calculs.\"}, {\"id\": \"PASSION24.HOUR.17.REF.P007\", \"t\": \"Ainsi non seulement notre intelligence est occupée par les mauvaises pensées, mais encore notre être tout entier en est imprégné. Et il faut presque un miracle de Jésus pour nous en libérer.\"}, {\"id\": \"PASSION24.HOUR.17.REF.P008\", \"t\": \"C'est comme si, à travers ses épines, Jésus nous regarde et nous dise :\"}, {\"id\": \"PASSION24.HOUR.17.REF.P009\", \"t\": \"« Ah ! mon enfant, c'est toi-même qui ne veux pas être proche de Moi. Si seulement tu étais venu tout de suite à Moi, Je t'aurais aidé à Te libérer des vexations de l'ennemi et tu ne M’aurais pas fait soupirer après toi.\"}, {\"id\": \"PASSION24.HOUR.17.REF.P010\", \"t\": \"Je cherchais ta coopération pour Me libérer d'épines. Mais c'est en vain que Je t'ai attendu, parce que tu étais occupé par le travail intense que ton ennemi t'avait donné.\"}, {\"id\": \"PASSION24.HOUR.17.REF.P011\", \"t\": \"Oh ! comme tu serais moins tenté si tout de suite tu venais dans mes Bras. Alors l'ennemi Me craindrait Moi-même, plutôt que toi Et c'est tout de suite qu'il Te laisserait. »\"}, {\"id\": \"PASSION24.HOUR.17.REF.P012\", \"t\": \"Jésus, que tes épines\\n- enferment mes pensées dans ton Intelligence et\\n- empêchent l'ennemi de m'accabler de tentations.\\nQuand Jésus se fait entendre dans notre intelligence et notre cœur,\\nrépondons-nous à ses Inspirations ou les oublions-nous rapidement ?\\nJésus est traité comme un roi de plaisanterie.\\nEt nous, savons-nous respecter les choses saintes ?\\nDevant elles, savons-nous user de la révérence qui convient,\\ncomme si nous touchions à Jésus-Christ Lui-même ?\\nMon Jésus couronné d'épines, fais que je ressente tes épines,\\nafin que par leurs piqûres\\n- je comprenne combien Tu souffres et\\n- que je sache Te considérer comme mon Roi.\\nDebout dans la loge de Pilate,\\nJésus est condamné à mort par ce peuple\\nqu'Il a tant aimé et auquel il a fait tant de bien.\"}, {\"id\": \"PASSION24.HOUR.17.REF.P013\", \"t\": \"Pour nous donner la Vie, Jésus accepte de mourir à notre place.\\nEt nous, sommes-nous prêts à accepter quelques peines\\n- pour que Jésus ne soit pas offensé et souffre moins ?\"}, {\"id\": \"PASSION24.HOUR.17.REF.P014\", \"t\": \"Jésus souffrit extrêmement dans son Humanité. Nous, qui devons continuer sa Vie sur terre, nous devons, au moyen de nos peines, Le payer de retour. Savons-nous compatir aux peines que Jésus souffre à la vue des nombreuses âmes qui sont arrachées à son Cœur ? Les Juifs veulent que Jésus meure crucifié comme un infâme, afin que son Nom soit effacé de la face de la terre. Et nous, voulons-nous vraiment que Jésus vive sur la terre ?\"}, {\"id\": \"PASSION24.HOUR.17.REF.P015\", \"t\": \"Par nos actions, nos exemples et nos pas, nous devons répandre les\"}, {\"id\": \"PASSION24.HOUR.17.REF.P016\", \"t\": \"empreintes divines dans le monde pour que Jésus soit connu de tous.\\nPar notre agir, nous devons faire en sorte\\n- que notre vie soit un écho de sa Vie, et\\n- que cet écho se fasse entendre d'un bout à l'autre de la terre.\"}, {\"id\": \"PASSION24.HOUR.17.REF.P017\", \"t\": \"Sommes-nous prêts à donner notre vie\\n- pour que notre bien-aimé Jésus soit dédommagé\\nde toutes les offenses qui Lui sont faites,\\nOu bien imitons-nous les Juifs en criant avec eux : « Qu'Il soit crucifié ! »\\nMon Jésus condamné,\\nje veux, par amour pour Toi, partager ta Condamnation.\"}, {\"id\": \"PASSION24.HOUR.17.REF.P018\", \"t\": \"Et pour Te consoler, je veux continuellement\\n- déverser mon amour en Toi et\\n- Te déverser dans le cœur de toutes les créatures\\npour communiquer ta Vie à tous.\"}], \"subsections\": []}, {\"hour_id\": \"PASSION24.HOUR.18\", \"hour_number\": 18, \"display_time\": \"10h à 11h\", \"title\": \"Jésus est chargé de sa Croix et conduit au Calvaire\", \"short_title\": \"Jésus est chargé de sa Croix et conduit au Calvaire\", \"source_pages\": [155, 156, 157, 158, 159, 160, 161, 162, 163, 164, 165, 166, 167, 168], \"opening_prayer_ids\": [\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"], \"closing_prayer_ids\": [\"PASSION24.PRAYER.AFTER_EACH_HOUR\"], \"paragraphs\": [{\"id\": \"PASSION24.HOUR.18.P001\", \"n\": 1, \"t\": \"Mon Jésus, Amour insatiable, je vois que Tu ne Te donnes pas un instant de répit. Je ressens tes Désirs ardents d'Amour. Ton Cœur bat fort. A chaque Battement, je ressens tes éclatements et tes violences d'Amour. Ne pouvant contenir le Feu qui Te consume, Tu Te fatigues, Tu gémis, Tu soupires.\"}, {\"id\": \"PASSION24.HOUR.18.P002\", \"n\": 2, \"t\": \"A chacun de tes gémissements, je T'entends dire : « Croix ! » Chaque goutte de ton Sang proclame : « Croix ! »\"}, {\"id\": \"PASSION24.HOUR.18.P003\", \"n\": 3, \"t\": \"Toutes tes Peines, dans lesquelles Tu Te noies comme dans une mer immense, répètent : « Croix ! »\"}, {\"id\": \"PASSION24.HOUR.18.P004\", \"n\": 4, \"t\": \"Tu T'exclames :\"}, {\"id\": \"PASSION24.HOUR.18.P005\", \"n\": 5, \"t\": \"« Ô Croix bien-aimée et si ardemment désirée, toi seule sauveras mes enfants. En Toi Je concentre tout mon Amour ! »\"}, {\"id\": \"PASSION24.HOUR.18.P006\", \"n\": 6, \"t\": \"Jésus est couronné d’épines pour la deuxième fois Tes ennemis Te font rentrer dans le prétoire. Ils veulent Te faire endosser tes vêtements et ils T'enlèvent la pourpre dont Tu es couvert. Mais quelle Souffrance !\"}, {\"id\": \"PASSION24.HOUR.18.P007\", \"n\": 7, \"t\": \"Il me serait plus facile de mourir que de Te voir tant souffrir ! Le vêtement s'accroche à ta couronne d'épines et ils ne peuvent l'enlever. Alors, avec une cruauté inhumaine, ils arrachent d'un seul coup et le vêtement et la couronne. Ce coup cruel brise plusieurs épines qui demeurent enfoncées dans ta Tête. Et ton Sang coule abondamment. Tu gémis sous la douleur. Mais, ne se souciant pas de tes tortures, tes ennemis T'enfilent ton vêtement, et de nouveau Te remettent la couronne.\"}, {\"id\": \"PASSION24.HOUR.18.P008\", \"n\": 8, \"t\": \"Et comme ils la pressent fortement sur ta Tête, les épines Te parviennent jusqu'aux Yeux et aux Oreilles. Si bien qu'il n'y a aucune partie de ta Tête infiniment sainte qui n'en ressente les douleurs.\"}, {\"id\": \"PASSION24.HOUR.18.P009\", \"n\": 9, \"t\": \"Ta Souffrance est si grande que Tu vacilles, Tu trembles de la tête aux pieds, Tu es sur le point de mourir. De tes Yeux languissants et pleins de Sang, Tu me regardes avec difficulté pour me demander de l'aide dans cette détresse extrême. Mon Jésus, Roi des Douleurs, laisse-moi Te soutenir et Te serrer sur mon cœur.\"}, {\"id\": \"PASSION24.HOUR.18.P010\", \"n\": 10, \"t\": \"Je voudrais prendre le Feu qui Te dévore pour\\n- réduire en cendres tes ennemis et Te mettre à l'abri.\\nMais toi, Tu ne veux pas, parce que tes Désirs de la Croix se font plus ardents.\\nTu veux T'immoler sur elle immédiatement pour tous, même pour tes ennemis !\"}, {\"id\": \"PASSION24.HOUR.18.P011\", \"n\": 11, \"t\": \"Mais tandis que je me serre sur ton Cœur et que Toi Tu Te serres sur le mien, Tu me dis :\"}, {\"id\": \"PASSION24.HOUR.18.P012\", \"n\": 12, \"t\": \"« Mon enfant, laisse-Moi donner libre cours à mon Amour Avec Moi, répare pour ceux qui, tout en faisant le bien, Me déshonorent. Ces Juifs Me font reprendre mes vêtements pour Me déconsidérer davantage devant le peuple, afin de le convaincre que Je suis un malfaiteur.\"}, {\"id\": \"PASSION24.HOUR.18.P013\", \"n\": 13, \"t\": \"Apparemment, l'action de Me vêtir est bonne mais,\\ndans leur cœur, elle est mauvaise.\\nCombien de gens\\n- font de bonnes œuvres,\\n- administrent les sacrements ou les fréquentent,\\nmais à des fins humaines, sinon carrément mauvaises.\\nLe bien, quand il est mal fait, porte à la dureté.\"}, {\"id\": \"PASSION24.HOUR.18.P014\", \"n\": 14, \"t\": \"Je veux être couronné une deuxième fois,\\navec des souffrances plus cruelles qu'à la première,\\n- pour briser cette dureté, et pour ainsi attirer les hommes à Moi.\"}, {\"id\": \"PASSION24.HOUR.18.P015\", \"n\": 15, \"t\": \"Ah ! mon enfant, ce deuxième couronnement M’est bien plus douloureux que le premier. Je sens ma Tête comme si elle nageait dans les épines. A chaque mouvement que Je fais ou à chaque choc qu'on Me donne, ce sont autant de morts cruelles que Je vis.\"}, {\"id\": \"PASSION24.HOUR.18.P016\", \"n\": 16, \"t\": \"Je répare ainsi pour ceux qui,\\nau lieu de penser à leur propre sanctification,\\n- se dissipent et rejettent ma Grâce,\\ntandis que Moi, Je gémis et désire ardemment leur salut.\"}, {\"id\": \"PASSION24.HOUR.18.P017\", \"n\": 17, \"t\": \"Ah ! Je fais tout pour aimer les créatures et celles-ci font tout pour M’offenser !\"}, {\"id\": \"PASSION24.HOUR.18.P018\", \"n\": 18, \"t\": \"Toi au moins, ne Me laisse pas seul dans mes Peines et dans mes Réparations ! »\"}, {\"id\": \"PASSION24.HOUR.18.P019\", \"n\": 19, \"t\": \"Jésus reçoit la Croix sur ses saintes Epaules Mon Bien torturé, avec Toi je répare, avec Toi je souffre.\"}, {\"id\": \"PASSION24.HOUR.18.P020\", \"n\": 20, \"t\": \"Là je vois que tes ennemis Te font tomber dans un escalier.\"}, {\"id\": \"PASSION24.HOUR.18.P021\", \"n\": 21, \"t\": \"Et après, fiévreusement, ils Te font arriver à la Croix, toute prête, qu'avec de si ardents Désirs Tu cherches.\"}, {\"id\": \"PASSION24.HOUR.18.P022\", \"n\": 22, \"t\": \"C'est avec Amour que Tu la regardes D'un Pas assuré, Tu T'approches pour T'en emparer. Mais d'abord, Tu lui donnes un Baiser.\"}, {\"id\": \"PASSION24.HOUR.18.P023\", \"n\": 23, \"t\": \"Et tandis que ton Humanité infiniment sainte frissonne de joie, Tu la regardes et en mesures la longueur et la largeur. Tu en établis une portion pour chaque créature. Tu en dotes suffisamment pour chacune, afin de la lier à la Divinité par le lien du mariage et pour la rendre héritière du Royaume des Cieux.\"}, {\"id\": \"PASSION24.HOUR.18.P024\", \"n\": 24, \"t\": \"Puis, ne pouvant contenir l'Amour avec lequel Tu nous aimes, Tu recommences à lui donner des Baisers et Tu lui dis : « Croix adorée, enfin Je t'embrasse. Tu es le désir ardent de mon Cœur, le martyre de mon Amour. Tu as tardé jusqu'à maintenant, tandis que c'était toujours vers toi que mes Pas se dirigeaient.\"}, {\"id\": \"PASSION24.HOUR.18.P025\", \"n\": 25, \"t\": \"Sainte Croix, c'est toi le but de mon existence ici-bas.\\nEn toi Je concentre tout mon être, en toi Je place tous mes enfants.\\nTu seras leur vie, leur lumière, leur défense, leur gardien et leur force.\\nTu les secourras en toutes choses\\nTu me les amèneras glorieux au Ciel.\\nÔ Croix, chaire de Sagesse,\\n- toi seule enseigneras la vraie sainteté,\\n- toi seule formeras les héros, les athlètes, les martyrs, les saints.\\nBelle Croix, c'est toi mon Trône.\"}, {\"id\": \"PASSION24.HOUR.18.P026\", \"n\": 26, \"t\": \"Tandis que Je dois quitter cette terre, toi, tu seras toujours à Moi. Je te donne en dot toutes les âmes. Garde-les-Moi, sauve-les-Moi. Je te les confie ! » Anxieux, Tu Te la fais placer sur tes Épaules infiniment saintes. Ah ! mon Jésus, ta Croix est trop légère pour ton Amour. Mais à son poids s'ajoute celui de nos fautes, aussi lourd que toute la terre. Mon Bien, Tu Te sens écrasé sous le poids de tant de fautes.\"}, {\"id\": \"PASSION24.HOUR.18.P027\", \"n\": 27, \"t\": \"Ton Âme frémit d'horreur à leur vue et elle ressent la peine de chacune. Ta Sainteté est secouée devant tant de laideur.\"}, {\"id\": \"PASSION24.HOUR.18.P028\", \"n\": 28, \"t\": \"Par conséquent, en recevant la Croix sur tes Épaules,\"}, {\"id\": \"PASSION24.HOUR.18.P029\", \"n\": 29, \"t\": \"Tu vacilles. Le souffle Te manque. Et de ton Humanité infiniment sainte coule une Sueur mortelle. Mon Amour, mon âme ne supporte pas de Te laisser seul. Je veux partager avec Toi le poids de ta Croix.\"}, {\"id\": \"PASSION24.HOUR.18.P030\", \"n\": 30, \"t\": \"Pour soulever le poids de nos fautes, je me serre contre tes Pieds.\\nJe veux Te donner au nom de toutes les créatures\\n- de l'amour pour quiconque ne T'aime pas,\\n- des louanges pour quiconque Te méprise,\\n- des bénédictions, des remerciements, de l'obéissance pour tous.\"}, {\"id\": \"PASSION24.HOUR.18.P031\", \"n\": 31, \"t\": \"Mon Jésus, pour toutes les offenses que Tu recevras, je veux T'offrir ma\\npersonne pour réparer.\\nJe veux faire les actes opposés aux offenses que les créatures Te font.\\nJe veux Te consoler par mes baisers et mes actes d'amour continuels.\\nMais je sais fort bien\\n- que je suis trop misérable et\\n- que j'ai besoin de Toi pour pouvoir réparer vraiment.\"}, {\"id\": \"PASSION24.HOUR.18.P032\", \"n\": 32, \"t\": \"Par conséquent,\\nje m'unis à ton Humanité infiniment sainte,\\nj'unis mes pensées aux Tiennes\\n- pour réparer mes pensées mauvaises\\net celles de tous,\\nj'unis mes yeux aux Tiens\\n- pour réparer les regards mauvais,\\nj’unis ma bouche à la Tienne\\n- pour réparer les blasphèmes et les conversations mauvaises,\\nj’unis mon cœur au Tien\\n- pour réparer les tendances, les affections et les désirs mauvais\"}, {\"id\": \"PASSION24.HOUR.18.P033\", \"n\": 33, \"t\": \"En un mot, je veux réparer tout ce que répare ton Humanité infiniment sainte\\nen m'unissant\\n- à ton Amour infini et\\n- au bien immense que Tu fais à tous.\"}, {\"id\": \"PASSION24.HOUR.18.P034\", \"n\": 34, \"t\": \"Mais je ne suis pas encore contente.\\n- je veux m'unir à ta Divinité,\\n- je veux perdre mon néant dans ta Divinité.\\nEt ainsi, je pourrai tout Te donner.\"}, {\"id\": \"PASSION24.HOUR.18.P035\", \"n\": 35, \"t\": \"Je Te donne ton Amour pour éponger tes amertumes. Je te donne ton Cœur en réparation\"}, {\"id\": \"PASSION24.HOUR.18.P036\", \"n\": 36, \"t\": \"- de nos froideurs,\\n- de nos manques de réciprocité,\\n- de nos ingratitudes et\\n- de notre manque d'amour.\"}, {\"id\": \"PASSION24.HOUR.18.P037\", \"n\": 37, \"t\": \"Je Te donne\\ntes Harmonies\\n- pour Te dédommager des outrages que Tu reçois par les blasphèmes.\\nta Beauté pour Te dédommager de la laideur de notre âme\\n- quand elle est souillée par le péché.\\nta Pureté pour Te dédommager de nos manques de droiture d'intention\\net de la boue qui couvre tant d'âmes.\\nton Ardeur pour brûler tous les péchés et réchauffer tous les cœurs,\\nafin que tous t'aiment, et que personne ne t'offense plus.\"}, {\"id\": \"PASSION24.HOUR.18.P038\", \"n\": 38, \"t\": \"En somme, je Te donne tout ce que Tu es pour Te donner une satisfaction totale, un Amour éternel et infini.\"}, {\"id\": \"PASSION24.HOUR.18.P039\", \"n\": 39, \"t\": \"Le Chemin au Calvaire Mon Jésus infiniment patient, Tu fais tes premiers Pas sous le poids immense de la Croix. Moi j'unis mes pas aux Tiens.\"}, {\"id\": \"PASSION24.HOUR.18.P040\", \"n\": 40, \"t\": \"Et quand, faible, saigné à blanc et vacillant, Tu seras sur le point de tomber,\\n- je serai à ton côté pour Te soutenir.\\n- je Te prêterai mes épaules pour partager avec Toi le poids de la Croix.\\nNe me dédaigne pas, mais accepte-moi comme ta fidèle compagne.\\nÔ Jésus, je vois que Tu répares pour tous ceux\\n- qui ne portent pas avec résignation leur croix,\\n- qui jurent, s'irritent, se suicident ou font des meurtres.\\nTu implores pour tous la résignation à leur propre croix.\"}, {\"id\": \"PASSION24.HOUR.18.P041\", \"n\": 41, \"t\": \"Jésus tombe pour la première fois\"}, {\"id\": \"PASSION24.HOUR.18.P042\", \"n\": 42, \"t\": \"Mais Tu Te sens écrasé sous ta Croix.\\nTu en es à tes premiers Pas avec elle, et déjà Tu tombes sous son poids.\\nEt, en tombant,\\n- Tu heurtes des pierres,\\n- les épines s'enfoncent davantage dans ta Tête, et\\n- toutes tes Plaies s'aggravent et laissent couler du Sang neuf.\"}, {\"id\": \"PASSION24.HOUR.18.P043\", \"n\": 43, \"t\": \"Et comme Tu n'as pas la force de Te relever, tes ennemis, irrités, cherchent à Te remettre sur pied par des coups de pied et des bousculades. Mon Amour tombé sous la Croix, laisse-moi T'aider à Te remettre sur pieds. Je T'embrasse, j'essuie ton Sang. Je veux réparer pour ceux qui pèchent par ignorance ou fragilité. Je Te prie d'aider ces âmes.\"}, {\"id\": \"PASSION24.HOUR.18.P044\", \"n\": 44, \"t\": \"Jésus rencontre sa très Sainte Mère Jésus, ma Vie, à travers des souffrances inouïes, tes ennemis sont arrivés à Te remettre sur pied.\"}, {\"id\": \"PASSION24.HOUR.18.P045\", \"n\": 45, \"t\": \"Tandis que Tu marches en chancelant, j'entends ton Souffle haletant. Ton Cœur bat plus fort et de nouvelles Peines Te transpercent. Tu secoues la Tête pour Te débarrasser les Yeux du Sang qui les remplit Anxieux, Tu regardes. Ah ! mon Jésus, j'ai tout compris :\"}, {\"id\": \"PASSION24.HOUR.18.P046\", \"n\": 46, \"t\": \"Ta Maman qui, comme une colombe plaintive, cherche à Te rencontrer,\\nElle veut Te dire une dernière parole et recevoir un dernier Regard de Toi.\\nTu la vois qui, pénétrant dans la foule, veut à tout prix\\n- Te voir,\\n- T'embrasser et\\n- Te faire un dernier adieu.\\nEt Tu ressens son Cœur lacéré.\"}, {\"id\": \"PASSION24.HOUR.18.P047\", \"n\": 47, \"t\": \"Tu es affligé de voir sa pâleur mortelle et toutes tes Peines qui, en vertu de son Amour pour Toi, sont reproduites en elle.\"}, {\"id\": \"PASSION24.HOUR.18.P048\", \"n\": 48, \"t\": \"Si elle vit, c'est un pur miracle de ton Omnipotence. Tu fais des pas pour la rencontrer, Mais c'est à grand peine que Vous pouvez échanger un Regard ! Quels transpercements dans vos deux Cœurs ! Les soldats s'en aperçoivent. Par des bousculades, ils empêchent que la Maman et le Fils communiquent leur dernier adieu.\"}, {\"id\": \"PASSION24.HOUR.18.P049\", \"n\": 49, \"t\": \"Jésus tombe pour la deuxième fois Vos Souffrances réciproques sont telles que, pétrifiée de Douleur, ta Maman est sur le point de succomber. Le fidèle Jean et les saintes femmes la soutiennent.\"}, {\"id\": \"PASSION24.HOUR.18.P050\", \"n\": 50, \"t\": \"Toi, de nouveau, Tu tombes sous le poids de la Croix.\"}, {\"id\": \"PASSION24.HOUR.18.P051\", \"n\": 51, \"t\": \"Alors, ce que ta Maman ne peut faire au moyen de son Corps parce qu'on l'en empêche, elle le fait au moyen de son Âme :\"}, {\"id\": \"PASSION24.HOUR.18.P052\", \"n\": 52, \"t\": \"Elle entre en Toi,\\nElle fait sien le Vouloir de l'Éternel\\nElle s'associe à toutes tes Peines, et\\n- elle Te fait office de Maman,\\n- elle Te donne des Baisers, Te refait, Te soulage, et\\n- elle verse en toutes tes Plaies le baume de son Amour endolori !\\nMon Jésus accablé de Douleurs, je m'unis à ta Maman affligée.\\nJe veux faire miennes toutes tes Peines.\"}, {\"id\": \"PASSION24.HOUR.18.P053\", \"n\": 53, \"t\": \"Dans chaque goutte de ton Sang et dans chacune de tes Plaies,\\nje veux Te servir de maman.\\nAvec elle, et avec Toi-même, je veux réparer pour ceux\\n- qui font des rencontres dangereuses,\\n- qui s'exposent aux occasions de péché.\\nMon Jésus, étant tombé de nouveau sous la Croix, Tu gémis.\\nLes soldats craignent que Tu meures avant le temps\\n- sous le poids de tant de souffrances et\\n- par la perte de tant de Sang.\\nNéanmoins, c'est à coups de fouets et à coups de pieds,\\navec beaucoup de mal, qu’ils parviennent à Te ramener sur tes pieds.\"}, {\"id\": \"PASSION24.HOUR.18.P054\", \"n\": 54, \"t\": \"Toi Tu répares\\n- les chutes répétées dans le péché,\\n- les fautes graves commises par les diverses classes de personnes.\\nTu pries pour la conversion des pécheurs obstinés.\"}, {\"id\": \"PASSION24.HOUR.18.P055\", \"n\": 55, \"t\": \"La Plaie profonde de l’Epaule de Jésus Mon Amour, tandis que je T'accompagne dans tes Réparations, je vois que Tu suffoques sous le poids énorme de la Croix. Tu trembles de partout. Les épines, à cause des chocs incessants que Tu reçois, pénètrent de plus en plus dans ta Tête.\"}, {\"id\": \"PASSION24.HOUR.18.P056\", \"n\": 56, \"t\": \"La lourde Croix s'enfonce de plus en plus dans ton Épaule. Elle y fait une Plaie si profonde qu'elle en découvre les Os.\"}, {\"id\": \"PASSION24.HOUR.18.P057\", \"n\": 57, \"t\": \"À chacun de tes Pas, il semble que Tu meures Ceci Te met dans la quasi-impossibilité d'aller de l'avant.\"}, {\"id\": \"PASSION24.HOUR.18.P058\", \"n\": 58, \"t\": \"Mais ton Amour, qui peut tout, T'en donne la force. Et alors que la Croix pénètre dans ton Épaule, Tu répares pour les péchés cachés.\"}, {\"id\": \"PASSION24.HOUR.18.P059\", \"n\": 59, \"t\": \"Le Cyrénéen est obligé de porter la Croix de Jésus\"}, {\"id\": \"PASSION24.HOUR.18.P060\", \"n\": 60, \"t\": \"Mon Jésus,\\n- laisse-moi mettre mon épaule sous la Croix pour Te soulager,\\n- et laisse-moi réparer avec Toi les péchés secrets.\\nDe crainte que Tu ne meures sous la Croix, tes ennemis\\nobligent le Cyrénéen à T'aider à la porter.\\nIl le fait de mauvais gré, en maugréant.\\nCe n'est pas par amour qu'il T'aide, mais parce qu'on l'y oblige.\\nDans ton Cœur se répercutent toutes les lamentations de ceux qui manquent\\nde résignation dans la souffrance.\\nTu répares leurs révoltes, leurs colères, et leur mépris de la souffrance.\"}, {\"id\": \"PASSION24.HOUR.18.P061\", \"n\": 61, \"t\": \"Mais Tu es affligé bien davantage quand Tu vois que tes âmes consacrées Te\\nfuient, celles que Tu appelles comme compagnes et aides dans ta Souffrance.\\nSi Tu les serres sur Toi avec douleur, elles se dégagent pour aller à la\\nrecherche des plaisirs.\\nEt ainsi elles Te laissent seul à souffrir !\\nMon Jésus, tandis que je répare avec Toi,\\nje Te prie de me serrer dans tes Bras.\\nFais-le si fortement qu'il n'y ait aucune Peine que Tu souffres et\\nà laquelle je ne prenne part, afin que\\n- je sois transformée par ces peines et que\\n- je Te dédommage pour l'abandon de toutes les créatures.\"}, {\"id\": \"PASSION24.HOUR.18.P062\", \"n\": 62, \"t\": \"Véronique essuie le Visage de Jésus\"}, {\"id\": \"PASSION24.HOUR.18.P063\", \"n\": 63, \"t\": \"Mon Jésus, c'est à grand peine que, tout courbé, Tu avances. Mais je vois que Tu t'arrêtes et cherches du Regard. Mon Cœur, qu'est-ce c'est ? Que veux-Tu ?\"}, {\"id\": \"PASSION24.HOUR.18.P064\", \"n\": 64, \"t\": \"Ah ! c'est Véronique qui, ne craignant rien, s'amène avec courage et essuie ton Visage tout couvert de Sang. Et Toi, en signe d'approbation, Tu laisses imprimée sur son linge ta sainte Face.\"}, {\"id\": \"PASSION24.HOUR.18.P065\", \"n\": 65, \"t\": \"Mon généreux Jésus, moi aussi je veux essuyer ta sainte Face. Non pas avec un linge, mais je veux m'offrir tout moi-même pour Te soulager.\"}, {\"id\": \"PASSION24.HOUR.18.P066\", \"n\": 66, \"t\": \"Je veux entrer dans ton For intérieur.\\nJe veux Te donner, ô Jésus,\\n- battement de cœur pour Battement de Cœur,\\n- souffle pour Souffle, affection pour Affection, désir pour Désir.\"}, {\"id\": \"PASSION24.HOUR.18.P067\", \"n\": 67, \"t\": \"J'entends me plonger dans ton Intelligence infiniment sainte. Faisant défiler dans l'immensité de ta Volonté tous ces Battements de Cœur, Souffles, et Désirs, je veux les multiplier à l'infini.\"}, {\"id\": \"PASSION24.HOUR.18.P068\", \"n\": 68, \"t\": \"Je veux, ô mon Jésus, former des vagues de saints battements de cœur, afin\\n- qu'aucun battement mauvais ne se répercute dans ton Cœur et\\n- qu'ainsi soient adoucies tes Amertumes intérieures.\"}, {\"id\": \"PASSION24.HOUR.18.P069\", \"n\": 69, \"t\": \"Je veux former des vagues de saintes affections et de saints désirs pour éloigner de Toi toute affection mauvaise et tout désir mauvais qui pourraient attrister ton Cœur.\"}, {\"id\": \"PASSION24.HOUR.18.P070\", \"n\": 70, \"t\": \"Je veux, ô mon Jésus, former des vagues de saintes pensées, pour éloigner de Toi toute pensée qui pourrait Te déplaire.\"}, {\"id\": \"PASSION24.HOUR.18.P071\", \"n\": 71, \"t\": \"Je serai très attentive, ô Jésus, afin que rien ne T'afflige davantage et n'ajoute à tes Peines intérieures.\"}, {\"id\": \"PASSION24.HOUR.18.P072\", \"n\": 72, \"t\": \"Ô Jésus, que tout mon for intérieur nage dans l'immensité du Tien. Ainsi je pourrai y trouver assez d'Amour et assez de Volonté pour faire en sorte que rien qui Te déplaise puisse entrer en Toi.\"}, {\"id\": \"PASSION24.HOUR.18.P073\", \"n\": 73, \"t\": \"Ô mon Jésus, je Te prie de sceller\\n- mes pensées dans les Tiennes, ma volonté dans la Tienne,\\n- mes désirs dans les Tiens, mes affections dans les Tiennes,\\n- mes sentiments dans les Tiens,\\nafin qu'une fois scellés, ils ne trouvent vie qu'en Toi.\"}, {\"id\": \"PASSION24.HOUR.18.P074\", \"n\": 74, \"t\": \"Je Te prie encore, ô mon Jésus, d'accepter mon pauvre corps que je veux\\n- réduire en pièces par amour pour Toi,\\n- réduire en parcelles extrêmement petites,\\npour les déposer sur chacune de tes Plaies.\\nSur cette Plaie reliée aux nombreux blasphèmes des créatures,\\nje mets, ô Jésus, une parcelle de mon corps pour qu'elle Te dise toujours :\\n« je Te bénis ! »\"}, {\"id\": \"PASSION24.HOUR.18.P075\", \"n\": 75, \"t\": \"Sur cette Plaie reliée aux ingratitudes humaines,\"}, {\"id\": \"PASSION24.HOUR.18.P076\", \"n\": 76, \"t\": \"je mets une parcelle de mon corps pour Te témoigner ma gratitude. Sur cette Plaie qui Te fait tant souffrir à cause des froideurs et du manque d'amour de mes frères et sœurs humains, je mets beaucoup de parcelles de ma chair, pour qu'elles Te disent toujours : « je T'aime, je T'aime, je T'aime ! »\"}, {\"id\": \"PASSION24.HOUR.18.P077\", \"n\": 77, \"t\": \"Sur cette Plaie reliée aux nombreuses irrévérences envers ta Personne infiniment sainte, je mets une parcelle de moi-même, pour qu'elle Te dise toujours : « je T'adore, je T'adore, je T'adore ! » Ô mon Jésus, c'est en toutes tes Plaies que je veux me diffuser. En tes Plaies envenimées par les nombreuses incrédulités, je veux que des parcelles de mon corps Te disent toujours : « Je crois, je crois en Toi, ô mon Jésus, ô mon Dieu, et en ta sainte Église. Je suis prête à donner ma vie pour témoigner de ma Foi ! »\"}, {\"id\": \"PASSION24.HOUR.18.P078\", \"n\": 78, \"t\": \"Ô mon Jésus, je me plonge dans l'immensité de ta Volonté. En la faisant mienne, je veux enfermer l'âme de chaque créature dans la Puissance de ta Volonté infiniment sainte. Jésus, il me reste encore mon sang que je veux verser comme un baume guérissant sur tes Plaies, pour Te soulager et Te guérir complètement.\"}, {\"id\": \"PASSION24.HOUR.18.P079\", \"n\": 79, \"t\": \"Je veux encore, ô Jésus, faire défiler mes pensées dans le cœur des pécheurs, pour les gronder continuellement, afin qu'ils n'osent plus T'offenser.\"}, {\"id\": \"PASSION24.HOUR.18.P080\", \"n\": 80, \"t\": \"Par ton propre Sang, fais en sorte que tous cèdent devant mes humbles\\nprières. Ainsi je pourrai les amener tous à ton Cœur !\\nIl y a une autre Grâce, ô mon Jésus, que je Te demande : c'est\\n- qu'en tout ce que je vois, touche et sens,\\nce soit toujours Toi que je vois, touche et sente.\\n- que ton Image et ton Nom infiniment saints\\nsoient gravés dans chaque parcelle de mon être.\\nVoyant d'un mauvais oeil le geste de Véronique,\\ntes ennemis Te fouettent, Te poussent et Te remettent en marche.\"}, {\"id\": \"PASSION24.HOUR.18.P081\", \"n\": 81, \"t\": \"Jésus console les saintes Femmes\"}, {\"id\": \"PASSION24.HOUR.18.P082\", \"n\": 82, \"t\": \"Mais quelques Pas plus loin, Tu T'arrêtes encore.\"}, {\"id\": \"PASSION24.HOUR.18.P083\", \"n\": 83, \"t\": \"Même sous le poids de tant de Peines, ton Amour ne cesse pas d'être actif :\\n- voyant les saintes femmes qui pleurent à cause de tes Peines,\\nTu T'oublies Toi-même.\\nEt Tu les consoles en leur disant :\\n« Filles, ne pleurez pas sur mes Peines,\\nmais sur vos péchés et sur vos enfants. »\"}, {\"id\": \"PASSION24.HOUR.18.P084\", \"n\": 84, \"t\": \"Quel enseignement sublime Tu nous donnes, ô Jésus ! Comme elle est douce, ta Parole ! Mon Jésus, avec Toi je répare les manques de charité. Je Te demande la Grâce de m'oublier moi-même, pour que je ne me rappelle que de Toi.\"}, {\"id\": \"PASSION24.HOUR.18.P085\", \"n\": 85, \"t\": \"Jésus tombe pour la troisième fois Mais, T'entendant parler, tes ennemis entrent en fureur. Ils Te tirent avec les cordes. Ils Te poussent avec tant de rage qu'ils Te font tomber. Et, en tombant, Tu heurtes des pierres. Le poids de la Croix T'écrase et Tu Te sens mourir !\"}, {\"id\": \"PASSION24.HOUR.18.P086\", \"n\": 86, \"t\": \"Laisse-moi Te soutenir et protéger de mes mains ton Visage infiniment saint. Je vois que Tu touches le sol et suffoques dans ton Sang.\"}, {\"id\": \"PASSION24.HOUR.18.P087\", \"n\": 87, \"t\": \"Voulant Te remettre sur pied, tes ennemis\\n- tirent avec les cordes et par les Cheveux et\\n- Te donnent des coups de pied.\\nMais tout cela est en vain.\\nTu meurs, mon Jésus ! Quelle peine ! Mon cœur se brise de douleur !\\nC'est presque en Te traînant qu'ils Te conduisent au Calvaire.\\nTandis qu'ils Te traînent,\\nTu répares toutes les offenses des âmes consacrées qui Te sont d'un grand\\npoids, de sorte que tous tes efforts pour Te relever sont inutiles !\"}, {\"id\": \"PASSION24.HOUR.18.P088\", \"n\": 88, \"t\": \"Et c'est ainsi que, traîné et foulé aux pieds, Tu parviens au Calvaire, laissant sur ton passage une trace rouge de ton Sang précieux. Mais ici, de nouvelles souffrances T'attendent.\"}, {\"id\": \"PASSION24.HOUR.18.P089\", \"n\": 89, \"t\": \"De nouveau, les soldats T'arrachent tes vêtements et ta couronne d'épines. Ah ! Tu gémis en Te sentant arracher les épines de la Tête.\"}, {\"id\": \"PASSION24.HOUR.18.P090\", \"n\": 90, \"t\": \"Et tandis qu'ils T'arrachent tes vêtements, ils arrachent aussi les Chairs lacérées qui y sont collées. Tes Plaies se déchirent, et c'est à ruisseaux que ton Sang coule. Elle est si grande ta Souffrance que, presque mort, Tu T'écroules. Mais personne n'a pitié de Toi, ô mon Bien ! Au contraire, dans une fureur bestiale, ils Te remettent la couronne d'épines en la frappant fortement. À cause de toutes tes lacérations et du coup sec qu'ils donnent à tes Cheveux amassés dans le Sang coagulé, ta torture est extrême. Seuls les anges pourraient dire ce que Tu souffres, tandis que, horrifiés, ils détournent leurs regards et pleurent. Mon Jésus dépouillé, permets-moi de Te serrer sur mon cœur pour Te réchauffer, car je vois que Tu trembles et qu'une Sueur glacée de mort envahit ton Humanité.\"}, {\"id\": \"PASSION24.HOUR.18.P091\", \"n\": 91, \"t\": \"Comme je voudrais Te donner ma vie et tout mon sang\\npour remplacer le Tien, que Tu as répandu pour me donner la Vie.\\nComme s'Il me regardait de ses Yeux moribonds, Jésus semble me dire :\\n« Mon enfant, combien Me coûtent les âmes ! C'est ici le lieu\\noù Je les attends toutes pour les sauver,\\noù Je veux réparer les péchés de ceux\\n- qui vont jusqu'à se dégrader au-dessous des bêtes et\\n- qui s'obstinent tellement à M’offenser\\nqu'ils en viennent à ne plus pouvoir vivre sans pécher.\"}, {\"id\": \"PASSION24.HOUR.18.P092\", \"n\": 92, \"t\": \"Leur raison est devenue aveugle et ils pèchent comme des fous.\\nVoilà pourquoi une troisième fois, on Me couronne d'épines.\\nEt par mon dépouillement, Je répare\\n- pour ceux qui revêtent des vêtements indécents,\\n- pour les péchés contre la modestie, et\\n- pour ceux qui sont tellement liés aux richesses,\\naux honneurs et aux plaisirs, qu'ils s'en font des dieux.\"}, {\"id\": \"PASSION24.HOUR.18.P093\", \"n\": 93, \"t\": \"Ah ! oui ! chacune de ces offenses est une mort que Je ressens.\\nSi Je ne meurs pas, c'est parce que la Volonté de mon Père Éternel le\\nveut ainsi ! »\\nMon Bien dénudé, tandis qu'avec Toi je répare, je Te prie\\n- qu'au moyen de tes Mains infiniment saintes Tu me dépouilles de tout\\n- que Tu ne permettes à aucune affection mauvaise d'entrer dans mon cœur.\\nVeille sur lui, entoure-le de tes Peines, remplis-le de ton Amour.\"}, {\"id\": \"PASSION24.HOUR.18.P094\", \"n\": 94, \"t\": \"Que ma vie ne soit rien d'autre que la répétition de la Tienne. Confirme par ta bénédiction mon dépouillement. Donne-moi la force d'assister à ta douloureuse Crucifixion. Que je sois crucifiée avec Toi !\"}], \"reflections\": [{\"id\": \"PASSION24.HOUR.18.REF.P001\", \"t\": \"Jésus porte sa Croix. Son Amour pour la Croix et son Désir anxieux de mourir sur elle pour sauver les âmes, sont immenses !\"}, {\"id\": \"PASSION24.HOUR.18.REF.P002\", \"t\": \"Et nous, comme Jésus, aimons-nous la souffrance ?\\nPouvons-nous dire\\n- que nos sentiments font écho à ses Sentiments divins,\\n- que nous aussi, nous désirons notre croix ?\\nQuand nous souffrons, avons-nous l'intention de nous faire les compagnons de\\nJésus pour alléger sa Croix ? Comment L'accompagnons-nous ?\\nEt dans les insultes qu'Il reçoit, sommes-nous toujours prêts\\nà Lui donner nos petites souffrances en soulagement des Siennes ?\\nQuand nous agissons, quand nous prions et\\nquand, sous le poids de peines intérieures,\\nnous ressentons de la difficulté dans nos souffrances,\\nsavons-nous les présenter à Jésus, afin que,\\ncomme un voile essuyant ses Sueurs et son Sang, Il soit fortifié ?\"}, {\"id\": \"PASSION24.HOUR.18.REF.P003\", \"t\": \"Ô mon Jésus, appelle-moi toujours près de Toi, et sois toujours près de moi, pour que je Te réconforte toujours au moyen de mes souffrances.\"}], \"subsections\": []}, {\"hour_id\": \"PASSION24.HOUR.19\", \"hour_number\": 19, \"display_time\": \"11h à midi\", \"title\": \"La Crucifixion\", \"short_title\": \"La Crucifixion\", \"source_pages\": [169, 170, 171, 172, 173, 174, 175, 176, 177, 178, 179, 180, 181, 182, 183, 184, 185, 186, 187, 188, 189, 190, 191, 192, 193, 194], \"opening_prayer_ids\": [\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"], \"closing_prayer_ids\": [\"PASSION24.PRAYER.AFTER_EACH_HOUR\"], \"paragraphs\": [{\"id\": \"PASSION24.HOUR.19.P001\", \"n\": 1, \"t\": \"Jésus, mon Amour, fatigués, mais non rassasiés de Te tourmenter, tes ennemis Te dépouillent de tes vêtements pour Te crucifier.\"}, {\"id\": \"PASSION24.HOUR.19.P002\", \"n\": 2, \"t\": \"Ton Corps infiniment saint est si lacéré que Tu as l'air d'un agneau écorché. Je vois que Tu trembles de tous tes membres, tandis que tes ennemis préparent la Croix pour Toi. Ne pouvant tenir debout, Tu tombes à terre sur cette montagne.\"}, {\"id\": \"PASSION24.HOUR.19.P003\", \"n\": 3, \"t\": \"Mon Bien et mon Tout, mon cœur se serre de douleur en Te regardant, voyant que le sang coule de toutes les parties de ton Corps très saint, tout blessé de la tête aux pieds.\"}, {\"id\": \"PASSION24.HOUR.19.P004\", \"n\": 4, \"t\": \"Jésus est couronné d’épines pour la troisième fois\\nMais, ô indicible Souffrance,\\n- en T'enlevant tes vêtements,\\n- ils T'ont arraché une autre fois ta couronne d'épines.\"}, {\"id\": \"PASSION24.HOUR.19.P005\", \"n\": 5, \"t\": \"Puis, pour la troisième fois, ils Te l'ont enfoncée sur la tête,\\n- Te faisant éprouver des souffrances inouïes,\\n- ajoutant aux blessures précédentes d'autres encore plus douloureuses.\"}, {\"id\": \"PASSION24.HOUR.19.P006\", \"n\": 6, \"t\": \"Ah ! mon Jésus, lors de ce troisième couronnement d'épines, Tu répares la perfidie de l'homme et son obstination dans le péché ! Mon Jésus, si l'Amour ne T'avait pas soutenu, Tu serais certainement mort à cause de l'âpreté de la souffrance que Tu as endurée lors de ce troisième couronnement d'épines.\"}, {\"id\": \"PASSION24.HOUR.19.P007\", \"n\": 7, \"t\": \"Mais je vois que Tu ne peux plus résister à la souffrance et, les yeux couverts de sang, Tu regardes pour voir s'il n'y aurait pas quelqu'un qui veuille Te soutenir dans tant de souffrances et de confusion. Mon doux Bien, ma chère Vie, ici Tu n'es pas seul comme la nuit dernière. Il y a ta Maman affligée, qui, le Cœur transpercé par une intense souffrance, subit autant de morts que Tu souffres de peines !\"}, {\"id\": \"PASSION24.HOUR.19.P008\", \"n\": 8, \"t\": \"Il y a aussi Marie Madeleine remplie d'amour et le fidèle Jean qui, à la vue de tes Souffrances, restent muets de douleur.\"}, {\"id\": \"PASSION24.HOUR.19.P009\", \"n\": 9, \"t\": \"Dis-moi, mon Amour, qui veux-Tu pour Te soutenir dans tant de souffrances ?\\nDe grâce, permets que je vienne, moi qui,\\nplus que tous, ressens le besoin d'être près de Toi en ces moments.\\nTa chère Maman et les autres me cèdent la place.\\nEt voilà, ô Jésus, que je m'approche de Toi.\\nJe T'embrasse et je Te prie\\n- d'appuyer ta Tête sur mon épaule\\n- et de me faire ressentir les blessures de tes épines en réparation\\nde toutes les offenses commises dans les pensées des créatures.\"}, {\"id\": \"PASSION24.HOUR.19.P010\", \"n\": 10, \"t\": \"Mon Amour, de grâce, serre-moi sur Toi. Je veux baiser une par une les gouttes de Sang qui coulent sur ton saint Visage. Que chacune de ces gouttes soit une Lumière pour chaque intelligence créée, afin qu'aucune ne T'offense par des pensées mauvaises.\"}, {\"id\": \"PASSION24.HOUR.19.P011\", \"n\": 11, \"t\": \"Entre temps, mon Jésus, Tu regardes la Croix que tes ennemis sont en train de Te préparer. Tu entends les coups de marteau par lesquels ils font les trous pour enfoncer les clous qui Te tiendront crucifié.\"}, {\"id\": \"PASSION24.HOUR.19.P012\", \"n\": 12, \"t\": \"Et ton Cœur bat très fort, tressaillant d'ivresse divine. Il désire ardemment que Tu T'étendes sur ce lit de douleur, pour sceller de ta Mort le salut de nos âmes.\"}, {\"id\": \"PASSION24.HOUR.19.P013\", \"n\": 13, \"t\": \"Et je T’entends dire :\"}, {\"id\": \"PASSION24.HOUR.19.P014\", \"n\": 14, \"t\": \"« Mon amour, chère Croix, mon Lit précieux, Tu as été mon Martyre dans la vie, et maintenant tu es mon Repos.\"}, {\"id\": \"PASSION24.HOUR.19.P015\", \"n\": 15, \"t\": \"Reçois-Moi bientôt dans tes bras Je suis impatiente d'attendre. Sainte Croix, sur toi Je viens tout accomplir.\"}, {\"id\": \"PASSION24.HOUR.19.P016\", \"n\": 16, \"t\": \"Vite, Croix ! Accomplis les ardents Désirs qui Me consument de donner la Vie aux âmes. Et ces vies seront scellées par toi, ô Croix. Oh, ne tarde pas plus longtemps ! J'attends avec impatience de Me reposer sur toi pour ouvrir le Paradis à tous mes enfants et fermer l'enfer. Ô Croix, il est vrai que tu es mon Martyre, mais sous peu tu seras aussi ma Victoire et mon Triomphe complet.\"}, {\"id\": \"PASSION24.HOUR.19.P017\", \"n\": 17, \"t\": \"Et par toi Je donnerai de copieux Héritages, Victoires, Triomphes et Couronnes à mes enfants. » Mais, qui peut dire tout ce que mon doux Jésus a dit sur la Croix ? Et tandis que Jésus parle ainsi, ses bourreaux Lui ordonnent de s'étendre sur la Croix. Il leur obéit promptement, réparant ainsi nos désobéissances.\"}, {\"id\": \"PASSION24.HOUR.19.P018\", \"n\": 18, \"t\": \"Mon Amour, avant que Tu T'étendes sur la Croix, permets-moi\\n- de Te serrer plus fort sur mon cœur et\\n- de baiser tes blessures sanglantes.\"}, {\"id\": \"PASSION24.HOUR.19.P019\", \"n\": 19, \"t\": \"Écoute, ô Jésus, je ne veux pas Te laisser. Avec Toi je veux m'étendre sur la Croix et y rester clouée avec Toi.\"}, {\"id\": \"PASSION24.HOUR.19.P020\", \"n\": 20, \"t\": \"L'Amour vrai ne supporte pas la séparation. Pardonne la hardiesse de mon amour et concède-moi de rester crucifiée avec Toi.\"}, {\"id\": \"PASSION24.HOUR.19.P021\", \"n\": 21, \"t\": \"Tu vois, mon tendre Amour, que je ne suis pas la seule qui Te demande cela.\\nIl y a aussi\\n- ta Maman affligée, de même que\\n- l'inséparable Marie Madeleine et\\n- le bien-aimé Jean.\"}, {\"id\": \"PASSION24.HOUR.19.P022\", \"n\": 22, \"t\": \"Tous, nous Te disons qu'il sera plus supportable de rester cloués avec Toi sur ta Croix que de Te voir crucifié seul !\"}, {\"id\": \"PASSION24.HOUR.19.P023\", \"n\": 23, \"t\": \"Par conséquent, avec Toi je m'offre au Père éternel, identifiée\\n- avec ta Volonté,\\n- avec ton Cœur,\\n- avec tes réparations et\\n- avec toutes tes souffrances.\\nAh ! Il semble que mon adorable Jésus me dise :\"}, {\"id\": \"PASSION24.HOUR.19.P024\", \"n\": 24, \"t\": \"« Mon enfant, tu as devancé mon Amour. Voici ma Volonté : que tous ceux qui M’aiment soient crucifiés avec Moi.\"}, {\"id\": \"PASSION24.HOUR.19.P025\", \"n\": 25, \"t\": \"Ah ! viens donc t'étendre avec Moi sur la Croix et Je Te donnerai la Vie par ma Vie. Tu seras la bien-aimée de mon Cœur ! »\"}, {\"id\": \"PASSION24.HOUR.19.P026\", \"n\": 26, \"t\": \"La Crucifixion\"}, {\"id\": \"PASSION24.HOUR.19.P027\", \"n\": 27, \"t\": \"Et voici, mon doux Bien, que Tu T'étends sur la Croix.\"}, {\"id\": \"PASSION24.HOUR.19.P028\", \"n\": 28, \"t\": \"Tu regardes avec Amour et avec douceur tes bourreaux\\n- qui ont à la main les clous et les marteaux pour Te clouer.\\nEt Tu leur fais une douce invitation pour réclamer ta Crucifixion.\"}, {\"id\": \"PASSION24.HOUR.19.P029\", \"n\": 29, \"t\": \"Avec une férocité inhumaine, ils\\n- Te prennent la Main droite,\\n- fixent le clou sur la Paume, et\\n- enfoncent le clou à coups de marteau dans ta sainte Main, et\\n- font sortir ce clou du côté opposé de la Croix.\"}, {\"id\": \"PASSION24.HOUR.19.P030\", \"n\": 30, \"t\": \"Elle est si grande ta Douleur que Tu en trembles.\"}, {\"id\": \"PASSION24.HOUR.19.P031\", \"n\": 31, \"t\": \"La Lumière de tes beaux Yeux s'éclipse.\\nTon Visage infiniment saint pâlit et a l'air de celui d'un mort.\\nSainte Main droite de mon Jésus,\\n- je Te donne un baiser, je compatis avec Toi,\\n- je T'adore, et je Te remercie pour moi et pour tous.\"}, {\"id\": \"PASSION24.HOUR.19.P032\", \"n\": 32, \"t\": \"Je Te demande autant d'âmes que Tu reçois de coups,\\n- pour que Tu les libères de la condamnation éternelle.\\nJe te prie de laver dans ton Sang infiniment précieux\\n- autant d'âmes que Tu verses de gouttes de Sang.\"}, {\"id\": \"PASSION24.HOUR.19.P033\", \"n\": 33, \"t\": \"Ô mon Jésus, en raison de la douleur cruelle que Tu souffres, je Te prie d'ouvrir le Ciel à tous et de bénir toutes les créatures.\"}, {\"id\": \"PASSION24.HOUR.19.P034\", \"n\": 34, \"t\": \"Que ta Bénédiction appelle\\n- à la conversion tous les pécheurs et\\n- à la lumière de la foi tous les hérétiques et les infidèles.\\nÔ Jésus, ma douce Vie, ton Tourment ne fait que commencer.\\nTes bourreaux ont fini de Te clouer la Main droite.\"}, {\"id\": \"PASSION24.HOUR.19.P035\", \"n\": 35, \"t\": \"Avec une cruauté inouïe ils prennent ta Main gauche et ils la tirent si violemment pour la faire parvenir au trou déjà foré que les Articulations de tes Bras et de tes Epaules en sont disloquées.\"}, {\"id\": \"PASSION24.HOUR.19.P036\", \"n\": 36, \"t\": \"À cause de la force de cette douleur,\\n- même tes Jambes deviennent raides et convulsives.\\nPuis, avec férocité, comme pour ta Main droite, ils la clouent sur la Croix.\\nÔ Main gauche de mon Jésus,\\n- Je Te donne un baiser, je compatis avec Toi.\\n- Je T'adore, je Te remercie.\\nJe Te prie, en raison\\n- des coups que Tu reçois et\\n- des cruelles douleurs que Tu subis,\\nde permettre en ce moment aux âmes du Purgatoire d'être libérées.\"}, {\"id\": \"PASSION24.HOUR.19.P037\", \"n\": 37, \"t\": \"Oui, ô Jésus, en raison du sang que Tu verses de cette main,\\nje Te prie d'éteindre les flammes qui brûlent ces âmes.\\nQue ce Sang\\n- les rafraîchisse et les soulage, et\\n- leur soit un bain salutaire pour\\nles purifier de toute tache et les disposer à la vision béatifique.\\nMon Amour et mon Tout, en raison de cette douleur cuisante, je Te prie\\n- de fermer l'enfer à toutes les âmes et\"}, {\"id\": \"PASSION24.HOUR.19.P038\", \"n\": 38, \"t\": \"- de retenir les foudres de la Justice divine irritée par nos fautes !\"}, {\"id\": \"PASSION24.HOUR.19.P039\", \"n\": 39, \"t\": \"Fais en sorte, ô Jésus,\\n- que cette Justice divine se calme,\\n- qu'Elle ne fasse pas pleuvoir les fléaux divins sur notre terre, et\\n- que s'ouvrent les trésors de la Miséricorde divine au profit de tous.\"}, {\"id\": \"PASSION24.HOUR.19.P040\", \"n\": 40, \"t\": \"Mon Jésus,\\nentre tes Bras, je place le monde et toutes les générations humaines.\\nJe Te prie, ô mon doux Amour, par ton Sang versé,\\n- de ne refuser le pardon à personne\\n- et d'accorder à chacun le Salut de son âme.\\nN'exclus personne, ô Jésus !\\nMon Amour, Jésus, tes ennemis poursuivent dans leurs atrocités.\\nAvec une férocité diabolique, ils prennent tes Pieds infiniment saints,\\ncontractés par la grande douleur éprouvée lors du clouage des Mains.\\nIls les tirent tant qu'en sont disloqués\\n- tes Genoux, tes Côtes et tous les Os de ta Poitrine.\"}, {\"id\": \"PASSION24.HOUR.19.P041\", \"n\": 41, \"t\": \"Mon cœur ne résiste pas, mon cher Bien. Je vois\\n- tes beaux Yeux éclipsés et voilés par le Sang.\\n- tes Lèvres livides se contorsionnent,\\n- tes Joues se creusent, tes Dents s'entrechoquent,\\n- tandis que ta Poitrine halète.\"}, {\"id\": \"PASSION24.HOUR.19.P042\", \"n\": 42, \"t\": \"Oh ! mon Amour, combien volontiers je prendrais ta place pour T'épargner tant\\nde souffrance ! Je veux, sur tous tes Membres, Te donner pour tous\\n- un baume, un baiser, un réconfort, une réparation.\\nMon Jésus,\\nils Te mettent un Pied sur l'autre et ils y enfoncent un clou sans pointe.\"}, {\"id\": \"PASSION24.HOUR.19.P043\", \"n\": 43, \"t\": \"Saints Pieds de mon Jésus,\\n- je Vous donne un baiser,\\n- je Vous adore,\\n- je Vous remercie et\\n- je Vous prie,\\nen raison des douleurs extrêmes que Vous souffrez et du Sang que Vous\\nversez,\\nde renfermer toutes les âmes dans vos Plaies infiniment saintes.\\nÔ Jésus, ne dédaigne personne !\\nQue tes clous\\n- clouent nos puissances, pour qu'elles ne s'éloignent pas de Toi,\\n- qu'ils clouent notre cœur, afin qu'il soit toujours fixé au Tien,\"}, {\"id\": \"PASSION24.HOUR.19.P044\", \"n\": 44, \"t\": \"- qu'ils clouent tous nos sentiments,\\nafin qu'ils n'adhèrent à aucun goût qui ne vienne de Toi.\"}, {\"id\": \"PASSION24.HOUR.19.P045\", \"n\": 45, \"t\": \"Ô mon Jésus crucifié, je Te vois tout ensanglanté comme si Tu avais nagé dans un bain de sang. Ce sang réclame continuellement des âmes. Par la puissance de ce Sang, ô Jésus, je Te demande qu'aucune âme ne s'enfuie de Toi ! Ô Jésus, je m'approche de ton Cœur torturé. Je vois que Tu n'en peux plus. Mais l'Amour crie encore plus fort : « Souffrances, Souffrances, encore des Souffrances ! »\"}, {\"id\": \"PASSION24.HOUR.19.P046\", \"n\": 46, \"t\": \"Mon Jésus,\\n- je T'embrasse,\\n- je compatis avec Toi,\\n- je T'adore et\\n- je Te remercie\\npour moi et pour tous.\\nJésus, je veux appuyer ma tête sur ton Cœur\\npour ressentir ce que Tu souffres durant ta douloureuse Crucifixion.\"}, {\"id\": \"PASSION24.HOUR.19.P047\", \"n\": 47, \"t\": \"Ah ! s'il n'avait pas déjà été décrété qu'une lance Te transpercera le Cœur,\\nles Flammes de ton Amour se frayeraient un chemin et le feraient éclater !\\nCes Flammes appellent les âmes remplies d'amour\\n- à établir leur demeure dans ton Cœur.\"}, {\"id\": \"PASSION24.HOUR.19.P048\", \"n\": 48, \"t\": \"Ô Jésus, par ton Sang infiniment précieux, je Te demande la sainteté pour ces âmes. De grâce, ne les laisse jamais quitter ton Cœur. Multiplie les vocations des âmes victimes, pour qu'elles continuent ta Vie sur la terre.\"}, {\"id\": \"PASSION24.HOUR.19.P049\", \"n\": 49, \"t\": \"Ô Jésus, que les Flammes de ton Cœur me brûlent et me consument, que ton Sang m'embellisse, que ton Amour me tienne toujours clouée à la Croix pour la souffrance et la réparation. Ô mon Jésus, les bourreaux T'ont cloué les mains et les pieds. Maintenant ils retournent la Croix pour river les clous. Ainsi ils contraignent ton adorable Visage à toucher le sol. Et Toi, Tu donnes un baiser à ce sol ensanglanté de ton Sang.\"}, {\"id\": \"PASSION24.HOUR.19.P050\", \"n\": 50, \"t\": \"Par ce baiser, Tu embrasses toutes les âmes et les lies à ton Amour,\"}, {\"id\": \"PASSION24.HOUR.19.P051\", \"n\": 51, \"t\": \"scellant leur salut.\"}, {\"id\": \"PASSION24.HOUR.19.P052\", \"n\": 52, \"t\": \"Ô Jésus, laisse-moi prendre ta place.\\nTandis que les bourreaux rivent les clous, fais en sorte que ces coups\\n- me blessent aussi et\\n- me clouent tout entière à ton Amour.\\nMon Jésus, les épines s'enfoncent de plus en plus dans ta tête.\\nJe veux T'offrir toutes mes pensées, afin que, comme des baisers affectueux,\\n- elles Te consolent et\\n- elles adoucissent l'amertume de tes épines.\"}, {\"id\": \"PASSION24.HOUR.19.P053\", \"n\": 53, \"t\": \"Ta Langue est presque attachée à ton Palais à cause de l'amertume\\n- du fiel et de ta Soif ardente.\\nPour étancher ta Soif, ô mon Jésus,\\nTu voudrais que tous les cœurs des créatures débordent d'amour.\\nMais, comme Tu ne reçois pas cet amour, Tu brûles de plus en plus.\"}, {\"id\": \"PASSION24.HOUR.19.P054\", \"n\": 54, \"t\": \"Mon doux Amour, je veux T'envoyer des fleuves d'amour,\\npour amoindrir l'amertume du fiel et de ta Soif ardente.\\nÔ Jésus, je vois qu'à chaque Mouvement que Tu fais,\\n- les plaies de tes Mains se déchirent davantage et\\n- la douleur devient plus intense.\"}, {\"id\": \"PASSION24.HOUR.19.P055\", \"n\": 55, \"t\": \"Mon cher Bien, pour Te dédommager de cette souffrance et Te calmer, je T'offre les œuvres saintes de toutes les créatures.\"}, {\"id\": \"PASSION24.HOUR.19.P056\", \"n\": 56, \"t\": \"Ô Jésus, combien Tu souffres dans tes Pieds infiniment saints ! Tous les Mouvements de ton Corps infiniment sacré semblent se répercuter en eux. Il n'y a personne près de Toi pour Te soutenir et adoucir quelque peu l'âpreté de tes Souffrances !\"}, {\"id\": \"PASSION24.HOUR.19.P057\", \"n\": 57, \"t\": \"Ma douce Vie, je voudrais\\n- réunir les pas des créatures de toutes les générations et\\n- Te les envoyer tous,\\npour qu'ils viennent Te consoler dans tes dures Peines.\\nÔ mon Jésus, comme ton pauvre Cœur est torturé !\\nComment Te réconforter dans tant de souffrances ?\"}, {\"id\": \"PASSION24.HOUR.19.P058\", \"n\": 58, \"t\": \"Je m'immergerai en Toi, j'immergerai mon cœur dans le Tien.\\nJ’immergerai mes désirs dans les Tiens.\\nJ'unirai mon amour au Tien, afin que, par ton Feu, sois\\n- brûlé le cœur de toutes les créatures et\"}, {\"id\": \"PASSION24.HOUR.19.P059\", \"n\": 59, \"t\": \"- détruits tous les amours profanes.\"}, {\"id\": \"PASSION24.HOUR.19.P060\", \"n\": 60, \"t\": \"Ton Cœur sacré en sera réconforté.\\nMoi, à partir de maintenant, je promets\\n- de rester toujours clouée à ton Cœur infiniment amoureux\\npar les clous de tes Désirs, de ton Amour et de ta Volonté.\"}, {\"id\": \"PASSION24.HOUR.19.P061\", \"n\": 61, \"t\": \"Ô mon Jésus, je veux être crucifiée en Toi.\\nNe permets pas que je me décloue le moindrement, afin que je puisse\\n- T'aimer et réparer pour tous et\\n- calmer la souffrance que Te procurent les créatures par leurs fautes.\"}, {\"id\": \"PASSION24.HOUR.19.P062\", \"n\": 62, \"t\": \"Jésus est cloué à la Croix\"}, {\"id\": \"PASSION24.HOUR.19.P063\", \"n\": 63, \"t\": \"Mon bon Jésus, je vois que tes ennemis\\n- soulèvent le lourd bois de la Croix et\\n- le laissent tomber dans le trou prévu à cet effet.\\nEt Toi, mon doux Amour, Tu es suspendu entre Ciel et terre.\"}, {\"id\": \"PASSION24.HOUR.19.P064\", \"n\": 64, \"t\": \"En ce moment solennel, Tu Te tournes vers le Père et d'une voix faible Tu Lui dis :\"}, {\"id\": \"PASSION24.HOUR.19.P065\", \"n\": 65, \"t\": \"« Père saint, Me voici chargé de tous les péchés du monde. Il n'y a pas de faute qui n'ait été versée sur Moi. Par conséquent, ne décharge plus sur les hommes les fléaux de ta Justice divine, mais fais-le sur Moi, ton Fils.\"}, {\"id\": \"PASSION24.HOUR.19.P066\", \"n\": 66, \"t\": \"Ô Père, permets-Moi\\n- de lier toutes les âmes à cette Croix et,\\n- par mon Sang et mes Plaies, d'obtenir le pardon pour toutes.\\nÔ Père, vois à quel état Je suis réduit !\\nEn raison de cette Croix, en vertu de ces Souffrances,\\ninduis en tous une véritable conversion, la Paix, le Pardon et la Sainteté. »\"}, {\"id\": \"PASSION24.HOUR.19.P067\", \"n\": 67, \"t\": \"Prière pour désarmer la Justice Divine Jésus, pendant que Tu es pends, transpercé, sur la Croix, ton Âme n'est plus sur la terre, mais au Ciel avec ton divin Père, pour défendre et plaider la cause de nos âmes.\"}, {\"id\": \"PASSION24.HOUR.19.P068\", \"n\": 68, \"t\": \"Mon Amour crucifié, je souhaite moi aussi Te suivre devant le trône de l'Éternel, et désarmer avec Toi la Justice divine. Je fais mienne ta très sainte Humanité, unie à ta Volonté, et avec Toi, je veux faire ce que Tu fais.\"}, {\"id\": \"PASSION24.HOUR.19.P069\", \"n\": 69, \"t\": \"Permets, ma Vie, que\\n- mes pensées s'écoulent en Toi,\\n- mon amour, ma volonté et mes désirs s’écoulent en Toi,\\n- mon élan s'écoule dans ton Cœur et tout mon être en Toi,\\nafin que rien ne m'échappe et que je puisse répéter,\\n- acte par acte,\\n- mot par mot,\\ntout ce que Tu fais.\\nMon Bien crucifié, Je vois, que Toi,\\n- voyant ton divin Père être outragé par les créatures,\\nTu Te prosternes devant Lui, et Tu caches toutes les créatures dans ta très\\nsainte Humanité.\\nTu nous mets en sûreté, afin que le Père, nous regardant en Toi,\\n- à cause de Toi,\\nne chasse pas la créature hors de Lui-même.\"}, {\"id\": \"PASSION24.HOUR.19.P070\", \"n\": 70, \"t\": \"Et s'Il la regarde avec dédain, c'est parce que tant d'âmes\\n- ont contrefait la belle Image créée par Lui,\\n- n'ont pensé qu'à L'offenser.\"}, {\"id\": \"PASSION24.HOUR.19.P071\", \"n\": 71, \"t\": \"Et de leur intelligence, qui était censée s'occuper de Le comprendre, ils font un réceptacle où se nichent tous leurs défauts. Et Toi, ô mon Jésus, pour L'apaiser, Tu attires l'attention du divin Père pour qu'Il regarde ta Tête très sainte, percée d'épines dans des douleurs atroces.\"}, {\"id\": \"PASSION24.HOUR.19.P072\", \"n\": 72, \"t\": \"Ainsi vous gardez comme clouées dans votre Esprit toutes les intelligences des créatures. Pour chacune desquelles vous offrez une expiation pour satisfaire la Justice Divine.\"}, {\"id\": \"PASSION24.HOUR.19.P073\", \"n\": 73, \"t\": \"Oh, comme ces épines excusent toutes les mauvaises pensées des créatures, comme des voix pitoyables devant la Divine Majesté ! Mon Jésus, mes pensées ne font qu'un avec les Tiennes.\"}, {\"id\": \"PASSION24.HOUR.19.P074\", \"n\": 74, \"t\": \"C'est pourquoi, avec Toi, je prie, j'implore, j'excuse et je répare devant la divine Majesté tout le mal commis par les créatures avec leur intelligence.\"}, {\"id\": \"PASSION24.HOUR.19.P075\", \"n\": 75, \"t\": \"Permets-moi\\n- de prendre tes épines et ta propre Intelligence et\\n- d'aller avec Toi vers toutes les créatures,\\npour attacher ton Intelligence à la leur.\"}, {\"id\": \"PASSION24.HOUR.19.P076\", \"n\": 76, \"t\": \"Je veux leur rendre leur intelligence, telle que Tu l'as créée à l'origine,\\n- avec la Sainteté qui est la tienne.\\nJe veux\\n- réordonner par la sainteté de tes Pensées\\ntoutes les pensées des créatures en Toi, et\\n- percer de tes épines tous les esprits des créatures,\\npour Te rendre la Domination et le Règne sur tous.\"}, {\"id\": \"PASSION24.HOUR.19.P077\", \"n\": 77, \"t\": \"Ô Jésus, Toi seul es le Maître\\n- de toute pensée,\\n- de toute affection et\\n- de tous les peuples.\\nRègle tout.\\nC'est seulement ainsi que la face de la terre, qui est horrifiée et effrayée,\\nsera changée.\\nJésus crucifié,\\nTu vois que le divin Père, indigné, regarde les pauvres créatures.\\nIl les trouve toutes souillées de culpabilité et couvertes des plus vilaines\\nsaletés, à en dégoûter le Ciel tout entier.\"}, {\"id\": \"PASSION24.HOUR.19.P078\", \"n\": 78, \"t\": \"Oh ! comme la Pureté du Regard divin est frappée Il ne reconnait presque plus la pauvre créature comme l'Œuvre de ses Mains très saintes ! En effet, les créatures semblent être autant de monstres qui occupent la terre, et elles attirent le mépris du Regard paternel. Mais Toi, ô mon Jésus, Tu cherches à L'apaiser en échangeant ses Yeux avec les Tiens. Et Tu les Lui fais voir couverts de Sang et gonflés de Larmes. Devant la divine Majesté, Tu pleures pour L'inciter à la compassion avec le malheur de tant de pauvres créatures. Et j'entends ta Voix qui dit : « Mon Père, il est vrai que la créature ingrate est de plus en plus lardée de fautes, qu'elle ne mérite plus ton Regard paternel.\"}, {\"id\": \"PASSION24.HOUR.19.P079\", \"n\": 79, \"t\": \"Mais regarde-Moi, Père, devant Toi Je veux tant pleurer, former un bain de larmes et de sang, pour laver cette saleté dont les créatures se sont couvertes.\"}, {\"id\": \"PASSION24.HOUR.19.P080\", \"n\": 80, \"t\": \"Père, veux-Tu Me rejeter ? Non, Tu ne le peux pas, Je suis ton Fils. Et si Je suis ton Fils, Je suis aussi la Tête de toutes les créatures et elles sont mes Membres. Sauve-les, ô Père, sauve-les. »\"}, {\"id\": \"PASSION24.HOUR.19.P081\", \"n\": 81, \"t\": \"Mon Jésus, Amour sans limites, je voudrais avoir tes Yeux pour pleurer devant la Majesté suprême pour la perte de tant de pauvres créatures et pour ces tristes moments.\"}, {\"id\": \"PASSION24.HOUR.19.P082\", \"n\": 82, \"t\": \"Permets-moi de prendre tes Larmes et tes propres Yeux, qui ne font qu'un\\navec les miens, et d'aller vers toutes les créatures.\\nAfin de pousser leurs âmes à la compassion pour ton Amour,\\nje leur ferai voir\\n- que Tu pleures pour eux et\\n- que, tandis qu'ils se salissent,\\nTu as tes Larmes et ton Sang prêts pour les laver.\\nEt Te voyant pleurer, ils se rendront.\"}, {\"id\": \"PASSION24.HOUR.19.P083\", \"n\": 83, \"t\": \"Oui, permets-moi de laver avec ces Larmes toute la souillure des créatures :\\n- qu'elles descendent dans leur cœur,\\n- qu'elles adoucissent tant d'âmes endurcies dans la culpabilité et\\n- qu'elles vainquent l'obstination de tous les cœurs.\\nAvec tes Regards, permets-moi de pénétrer les créatures de telle sorte\\n- que tous leurs regards s'élèvent vers le Ciel pour T’aimer,\\n- au lieu de se perdre sur la terre pour T’offenser.\"}, {\"id\": \"PASSION24.HOUR.19.P084\", \"n\": 84, \"t\": \"Ainsi le Père divin n'aura plus de mépris en regardant la pauvre humanité. Jésus crucifié, je vois que le divin Père n'est pas encore apaisé dans son indignation. Sa Bonté paternelle, prise de tant d'Amour pour la pauvre créature, a rempli le Ciel et la terre d'attestations d'Amour et de Bienfaits pour elle.\"}, {\"id\": \"PASSION24.HOUR.19.P085\", \"n\": 85, \"t\": \"Presque à chaque pas et à chaque acte, elle sent couler l'Amour et les Grâces de ce Cœur paternel.\"}, {\"id\": \"PASSION24.HOUR.19.P086\", \"n\": 86, \"t\": \"Mais la créature, toujours ingrate, méprise cet Amour\"}, {\"id\": \"PASSION24.HOUR.19.P087\", \"n\": 87, \"t\": \"Et elle ne veut pas le reconnaître.\\nAu contraire, elle s'oppose à tant d'Amour.\\nElle remplit le Ciel et la terre d'insultes, de mépris et d'outrages.\\nElle va jusqu'à le placer sous ses pieds impurs,\\n- voulant presque le détruire, s'idolâtrant elle-même.\"}, {\"id\": \"PASSION24.HOUR.19.P088\", \"n\": 88, \"t\": \"Toutes ces offenses pénètrent jusqu'aux Cieux et arrivent devant la divine\\nMajesté !\\nOh, comme Il est indigné de voir que l'ignoble créature vient L'insulter et\\nL'offenser de toutes les manières !\\nMais Toi, ô mon Jésus, qui as toujours l'intention de nous défendre,\\n- par la Puissance ravissante de ton Amour,\\nTu obliges le Père à regarder ton Visage très saint,\\n- couvert de toutes ces insultes et de tous ces mépris,\\net Tu dis :\\n« Mon Père, ne méprise pas les pauvres créatures.\\nSi Tu les méprises, Tu Me méprises. Oh, sois apaisé !\"}, {\"id\": \"PASSION24.HOUR.19.P089\", \"n\": 89, \"t\": \"Toutes ces offenses, Je les porte sur mon Visage. Je Te réponds pour toutes.\"}, {\"id\": \"PASSION24.HOUR.19.P090\", \"n\": 90, \"t\": \"Mon Père, arrête ta fureur contre la pauvre humanité. Elle est aveugle et ne sait pas ce qu'elle fait. Par conséquent, regarde-Moi bien, car Je suis réduit à cause d'elle.\"}, {\"id\": \"PASSION24.HOUR.19.P091\", \"n\": 91, \"t\": \"Si Tu n'es pas ému de compassion pour l'humanité misérable,\\nque mon Visage,\\n- souillé de crachats, couvert de Sang,\\n- pâle et gonflé par les nombreuses gifles et coups que J'ai reçus,\\nT’incite à la compassion.\"}, {\"id\": \"PASSION24.HOUR.19.P092\", \"n\": 92, \"t\": \"Pitié, Père ! J'étais le plus beau de tous. Et maintenant Je suis tout défiguré, de sorte que Je ne Me reconnais plus. Je suis devenu l'abjection de tous. C'est pourquoi, à tout prix, Je veux sauver la pauvre créature. »\"}, {\"id\": \"PASSION24.HOUR.19.P093\", \"n\": 93, \"t\": \"Mon Jésus, est-il possible que Tu nous aimes tant ? Ton amour écrase mon pauvre cœur.\"}, {\"id\": \"PASSION24.HOUR.19.P094\", \"n\": 94, \"t\": \"Voulant Te suivre en tout,\\npermets-moi de prendre ton très saint Visage\\n- pour l'avoir en mon pouvoir,\\n- pour le montrer sans cesse défiguré au Père,\\n- pour l'émouvoir de compassion pour la pauvre humanité,\\nqui est tellement opprimée sous le fouet de la Justice divine qu'elle gît presque\\nmourante.\\nPermets-moi\\n- d'aller parmi les créatures, et\\n- de leur faire voir ton Visage si défiguré à cause d'elles,\\npour les pousser à la compassion pour leurs âmes et pour ton Amour.\"}, {\"id\": \"PASSION24.HOUR.19.P095\", \"n\": 95, \"t\": \"Avec la Lumière que rayonne ton Visage et avec la Puissance ravissante de\\nton Amour, fais-leur comprendre\\n- qui Tu es et\\n- qui sont ceux qui osent T'offenser.\"}, {\"id\": \"PASSION24.HOUR.19.P096\", \"n\": 96, \"t\": \"Fais que leurs âmes se lèvent des nombreuses fautes\\n- dans lesquelles ils vivent, morts à la grâce,\\nafin qu'ils se prosternent tous devant Toi\\n- dans l'acte de T'adorer et de Te glorifier.\\nMon Jésus, adorable crucifié, la créature irrite toujours la Justice divine\"}, {\"id\": \"PASSION24.HOUR.19.P097\", \"n\": 97, \"t\": \"de sa langue
