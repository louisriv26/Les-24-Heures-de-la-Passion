9 une cr\u00e9ature \u00e0 ta divine Personne. Les Juifs cherchent \u00e0 Te faire mourir dans l'ignominie. Entretemps Toi, Tu penses \u00e0 donner la Vie \u00e0 tous. Et il semble que Tu dises :\"},{\"id\":\"PASSION24.HOUR.16.P006\",\"n\":6,\"t\":\"\u00ab P\u00e8re Saint, regarde ton Fils v\u00eatu comme un fou. Il r\u00e9pare la folie de tant de cr\u00e9atures quand elles tombent dans le p\u00e9ch\u00e9 !\"},{\"id\":\"PASSION24.HOUR.16.P007\",\"n\":7,\"t\":\"Que ce v\u00eatement blanc soit devant Toi pour la disculpation de beaucoup d'\u00e2mes qui rev\u00eatent le v\u00eatement pitoyable de la faute.\"},{\"id\":\"PASSION24.HOUR.16.P008\",\"n\":8,\"t\":\"Vois, \u00f4 P\u00e8re, la haine et la rage qu'ils ont contre Moi\\n- leur font perdre la raison et\\n- les rendent assoiff\u00e9es de mon Sang.\\nJe veux\\n- r\u00e9parer toutes les haines, les vengeances, les col\u00e8res, les homicides, et\\n- obtenir par mes Pri\u00e8res,\\nla Lumi\u00e8re de la Raison et de la Foi pour tous.\\nRegarde-Moi encore, \u00f4 mon P\u00e8re.\\nAurait-on pu Me faire une plus grande insulte ?\\nIls M\u2019ont fait passer apr\u00e8s un grand malfaiteur.\"},{\"id\":\"PASSION24.HOUR.16.P009\",\"n\":9,\"t\":\"Je veux ainsi r\u00e9parer pour toutes les fois\\nqu'on Nous fait passer en second : apr\u00e8s\\n- de vils int\u00e9r\u00eats,\"},{\"id\":\"PASSION24.HOUR.16.P010\",\"n\":10,\"t\":\"- la vanit\u00e9,\\n- les plaisirs,\\n- les attachements,\\n- les honneurs mondains,\\n- les ripailles.\\nLes cr\u00e9atures Nous font passer apr\u00e8s toutes sortes de niaiseries.\"},{\"id\":\"PASSION24.HOUR.16.P011\",\"n\":11,\"t\":\"Et Moi, Je suis pr\u00eat \u00e0 accepter qu'on Me fasse passer apr\u00e8s Barabbas pour r\u00e9parer toutes ces fautes ! \u00bb Comme elles sont r\u00e9elles et incessantes nos d\u00e9cisions de faire passer Dieu en second, m\u00eame chez ceux qui aiment J\u00e9sus !\"},{\"id\":\"PASSION24.HOUR.16.P012\",\"n\":12,\"t\":\"Ah ! cherchons cet Amour Pur et Fort\\nqui fait passer tous et tout apr\u00e8s J\u00e9sus, m\u00eame notre vie.\\n\u00d4 J\u00e9sus, je me sens remplie d'admiration \u00e0 la vue\\n- de ton Amour si sublime au milieu de tant de peines,\\n- de ton H\u00e9ro\u00efsme au milieu de tant d'insultes.\"},{\"id\":\"PASSION24.HOUR.16.P013\",\"n\":13,\"t\":\"Tes Paroles et tes R\u00e9parations, comme autant de fl\u00e8ches,\\n- blessent mon c\u0153ur.\\nDans ma souffrance, je veux m'associer \u00e0 tes Pri\u00e8res et \u00e0 tes R\u00e9parations. Pas\\nm\u00eame un seul instant je ne veux me d\u00e9tacher de Toi.\\nSinon beaucoup de choses m'\u00e9chapperaient de ce que Tu fais.\\nEt que vois-je ?\\nLes soldats Te conduisent tout pr\u00e8s d'une colonne pour Te flageller.\"},{\"id\":\"PASSION24.HOUR.16.P014\",\"n\":14,\"t\":\"Mon Amour, je Te suis. Et Toi, de ton Regard d'Amour, regarde-moi et donne-moi la force d'assister \u00e0 cet atroce supplice !\"},{\"id\":\"PASSION24.HOUR.16.P015\",\"n\":15,\"t\":\"La Flagellation de J\u00e9sus\"},{\"id\":\"PASSION24.HOUR.16.P016\",\"n\":16,\"t\":\"Mon J\u00e9sus infiniment pur,\\n- Tu es d\u00e9j\u00e0 tout pr\u00e8s de la colonne et\\n- les soldats d\u00e9cha\u00een\u00e9s Te d\u00e9lient pour T\u2019attacher \u00e0 cette colonne.\\nMais cela ne suffit pas. Ils Te d\u00e9pouillent de tes v\u00eatements\\npour que le Supplice de ton Corps infiniment saint soit plus cruel.\"},{\"id\":\"PASSION24.HOUR.16.P017\",\"n\":17,\"t\":\"Mon Amour et ma Vie,\"},{\"id\":\"PASSION24.HOUR.16.P018\",\"n\":18,\"t\":\"je me sens m'\u00e9vanouir par la souffrance de Te voir presque nu. Tu trembles de la t\u00eate aux pieds Ton Visage infiniment saint rougit par pudeur. Ta confusion et ton \u00e9puisement sont tels que, ne Te tenant plus debout, Tu es sur le point de T\u2019\u00e9crouler par terre.\"},{\"id\":\"PASSION24.HOUR.16.P019\",\"n\":19,\"t\":\"Mais, dans le but de mieux Te lier, et non pas pour T\u2019aider,\\nles soldats ne Te laissent pas T\u2019\u00e9crouler.\\nIls prennent les cordes et Te lient les Bras si fermement\\n- qu'ils se gonflent imm\u00e9diatement et\\n- que, de la pointe de tes Doigts, le Sang coule !\"},{\"id\":\"PASSION24.HOUR.16.P020\",\"n\":20,\"t\":\"Puis ils T\u2019attachent \u00e0 la colonne et ils font courir les cordes jusqu'\u00e0 tes Pieds.\\nIls Te lient, si fermement que Tu ne peux faire aucun mouvement.\\nEt ils font ainsi pour \u00eatre plus libres de se d\u00e9cha\u00eener sur Toi !\\nMon J\u00e9sus, Toi qui habilles toutes les choses cr\u00e9\u00e9es,\\n- le soleil de lumi\u00e8re, - le ciel d'\u00e9toiles,\\n- les plantes de feuilles, - les oiseaux de plumes,\\nte voil\u00e0 d\u00e9v\u00eatu ! Quelle effronterie !\"},{\"id\":\"PASSION24.HOUR.16.P021\",\"n\":21,\"t\":\"Et, plein d'Amour, Tu me dis par la Lumi\u00e8re que transmettent tes Yeux :\"},{\"id\":\"PASSION24.HOUR.16.P022\",\"n\":22,\"t\":\"\u00ab Tais-toi, \u00f4 mon enfant.\\nIl \u00e9tait n\u00e9cessaire que Je sois d\u00e9pouill\u00e9\\nafin de r\u00e9parer pour beaucoup qui se d\u00e9pouillent\\n- de toute pudeur, candeur et innocence,\\n- du bien et de ma Gr\u00e2ce,\\net se rev\u00eatent de laideur, et vivent \u00e0 la mani\u00e8re des brutes.\"},{\"id\":\"PASSION24.HOUR.16.P023\",\"n\":23,\"t\":\"Par la rougeur de ma Face, Je r\u00e9pare les malhonn\u00eatet\u00e9s, les mollesses et les plaisirs brutaux.\"},{\"id\":\"PASSION24.HOUR.16.P024\",\"n\":24,\"t\":\"Par cons\u00e9quent, sois attentive \u00e0 ce que Je fais, prie et r\u00e9pare avec Moi ! \u00bb J\u00e9sus tortur\u00e9, ton Amour passe d'un exc\u00e8s \u00e0 l'autre. Je vois que tes bourreaux prennent des fouets de corde et Te battent sans piti\u00e9, \u00e0 tel point que ton Corps infiniment saint devient tout livide.\"},{\"id\":\"PASSION24.HOUR.16.P025\",\"n\":25,\"t\":\"Comme ils poursuivent dans leur fureur, ton Sang pr\u00e9cieux coule sur le sol. Mais cela ne leur suffit pas. Deux autres bourreaux prennent la rel\u00e8ve avec cette fois des cha\u00eenes de fer crochu.\"},{\"id\":\"PASSION24.HOUR.16.P026\",\"n\":26,\"t\":\"Aux premiers coups, tes Chairs, broy\u00e9es et bless\u00e9es,\\n- se d\u00e9chirent davantage et\\n- tombent en lambeaux sur le sol, et tes Os se d\u00e9couvrent.\\nTon Sang coule \u00e0 flots,\\ntellement qu'Il forme une flaque au pied de la colonne.\\nMon J\u00e9sus, mon Amour d\u00e9pouill\u00e9,\\nTu subis cette temp\u00eate indescriptible de coups.\\nJ'embrasse tes Pieds divins afin de\\n- pouvoir prendre part \u00e0 tes Souffrances et\\n- d'\u00eatre couverte de ton Sang pr\u00e9cieux !\\n\u00d4 J\u00e9sus,\\nflagelle mon intelligence.\\nMets en fuite toutes les pens\u00e9es qui pourraient m'\u00e9loigner de Toi.\\nFlagelle mes yeux.\\nS'ils se tournent pour regarder les choses de la terre, fais en sorte\\nqu'un coup de tes fouets les attire \u00e0 n'admirer que Toi.\"},{\"id\":\"PASSION24.HOUR.16.P027\",\"n\":27,\"t\":\"J\u00e9sus, le bruit de tes fouets parvient \u00e0 mes oreilles ! Mon Roi bafou\u00e9, quand Tu me verras \u00e9couter des choses qui me distraient de Toi, fais en sorte qu'un coup de tes fouets me fasse \u00e9couter seulement ta divine Voix.\"},{\"id\":\"PASSION24.HOUR.16.P028\",\"n\":28,\"t\":\"J\u00e9sus, flagelle mon visage et si un acte de complaisance naissait en moi, que les coups de tes fouets me d\u00e9tachent de la terre et me poussent \u00e0 regarder seulement le Ciel.\"},{\"id\":\"PASSION24.HOUR.16.P029\",\"n\":29,\"t\":\"J\u00e9sus, flagelle ma langue et mes l\u00e8vres.\\nSi elles osaient prononcer des paroles\\n- qui ne soient pas d'Amour, qui ne disent pas ta Gloire,\\nfais en sorte que tes Fouets me jettent du Feu et des Flammes\\n- pour me faire br\u00fbler d'Amour.\"},{\"id\":\"PASSION24.HOUR.16.P030\",\"n\":30,\"t\":\"J\u00e9sus, flagelle mes mains afin que je ne fasse aucun mouvement et je n'accomplisse aucune \u0153uvre qui ne soit marqu\u00e9s du sceau de ton Amour.\"},{\"id\":\"PASSION24.HOUR.16.P031\",\"n\":31,\"t\":\"J\u00e9sus, que tes fouets frappent mes pieds, que je Te prie de lier aux Tiens,\\nafin que je sois emp\u00each\u00e9e de faire des pas qui\\n- ne soient pas pour Toi et\\n- n'attirent pas les autres \u00e0 T\u2019aimer.\"},{\"id\":\"PASSION24.HOUR.16.P032\",\"n\":32,\"t\":\"J\u00e9sus, flagelle mon c\u0153ur avec ses tendances, ses affections et ses d\u00e9sirs, afin que chaque coup que je recevrai le blesse, et que ces coups fassent rena\u00eetre en moi la Vie de l'Amour.\"},{\"id\":\"PASSION24.HOUR.16.P033\",\"n\":33,\"t\":\"Mon J\u00e9sus, j'entends tes G\u00e9missements que n'entendent pas tes ennemis, car la temp\u00eate de leurs coups assourdit l'air environnant.\"},{\"id\":\"PASSION24.HOUR.16.P034\",\"n\":34,\"t\":\"Par ces g\u00e9missements, Tu dis :\"},{\"id\":\"PASSION24.HOUR.16.P035\",\"n\":35,\"t\":\"\u00ab Vous tous qui M\u2019aimez,\\nvenez apprendre l'h\u00e9ro\u00efsme de l'Amour.\\nvenez noyer dans mon Sang\\n- la soif de vos passions,\\n- la soif de tant d'ambitions,\\n- la soif de fum\u00e9es, de plaisirs et de sensualit\u00e9s.\\nDans mon Sang, vous trouverez le Rem\u00e8de \u00e0 tous vos maux.\\nRegarde-Moi, P\u00e8re,\\ndans cette bourrasque de coups.\\nJe suis bless\u00e9 sur tout mon Corps, mais cela ne suffit pas.\"},{\"id\":\"PASSION24.HOUR.16.P036\",\"n\":36,\"t\":\"Je veux beaucoup de Plaies sur mon Corps pour pr\u00e9parer\\ndes chambres dans le Ciel de mon Humanit\u00e9\\npour toutes les \u00e2mes, afin\\n- qu'elles trouvent en Moi leur salut et\\n- qu'elles puissent ainsi passer au Ciel de ma Divinit\u00e9.\"},{\"id\":\"PASSION24.HOUR.16.P037\",\"n\":37,\"t\":\"Mon P\u00e8re, que chaque coup de ces fouets r\u00e9pare devant Toi, \u00e0 tour de r\u00f4le, les diverses sortes de p\u00e9ch\u00e9s.\"},{\"id\":\"PASSION24.HOUR.16.P038\",\"n\":38,\"t\":\"Et que ces coups de fouets excusent ceux qui commettent le p\u00e9ch\u00e9, qu'ils flagellent leurs passions. Qu'ils leur parlent de mon Amour, tant et si bien qu'ils soient forc\u00e9s de c\u00e9der devant Moi. \u00bb J\u00e9sus, l'Amour avec lequel Tu souffres, est si grand, que Tu excites presque tes bourreaux \u00e0 Te battre davantage !\"},{\"id\":\"PASSION24.HOUR.16.P039\",\"n\":39,\"t\":\"Mon J\u00e9sus d\u00e9charn\u00e9, ton Amour m'\u00e9crase, me rend folle. Alors que ton Amour n'est pas fatigu\u00e9, tes bourreaux, eux, sont \u00e9puis\u00e9s et cessent leur terrible massacre. Ils coupent tes cordes et, Presque mort, Tu tombes dans la mare de ton propre Sang. Tu vois sur le sol les lambeaux de ta Chair. Tu Te sens mourir de Douleur en y voyant les \u00e2mes r\u00e9prouv\u00e9es. Tu Te meurs dans ton Sang, \u00f4 J\u00e9sus ! Laisse-moi Te prendre dans mes bras pour Te restaurer au moins par mon amour. Je donne un baiser \u00e0 toutes tes Plaies.\"},{\"id\":\"PASSION24.HOUR.16.P040\",\"n\":40,\"t\":\"Par ces baisers j'enferme toutes les \u00e2mes en Toi. Ainsi, aucune ne se perdra plus. Et Toi, Tu me b\u00e9nis !\"}],\"reflections\":[{\"id\":\"PASSION24.HOUR.16.REF.P001\",\"t\":\"Pendant cette heure, J\u00e9sus\\n- est d\u00e9pouill\u00e9 de ses v\u00eatements et\\n- est soumis \u00e0 toutes sortes de coups.\\nEt nous, sommes-nous d\u00e9pouill\u00e9s de tout ?\"},{\"id\":\"PASSION24.HOUR.16.REF.P002\",\"t\":\"J\u00e9sus est li\u00e9 \u00e0 la colonne. Et nous, nous laissons-nous lier \u00e0 son Amour ?\"},{\"id\":\"PASSION24.HOUR.16.REF.P003\",\"t\":\"Par son Regard tendre, J\u00e9sus nous appelle \u00e0 Le d\u00e9lier. Ne voyons-nous pas en ce Regard qu'Il a aussi un reproche \u00e0 nous faire : celui d'avoir contribu\u00e9 \u00e0 Le lier ?\"},{\"id\":\"PASSION24.HOUR.16.REF.P004\",\"t\":\"Pour Le soulager,\\n- nous devons d'abord nous d\u00e9partir de nos propres cha\u00eenes\\npour pouvoir ensuite enlever celles des autres.\\nNos cha\u00eenes, bien souvent,\\nne sont rien d'autre que de petits attachements\\n- \u00e0 notre volont\u00e9, \u00e0 notre amour-propre vex\u00e9,\\n- \u00e0 nos petites vanit\u00e9s qui, s'entrela\u00e7ant,\\nlient douloureusement notre aimable J\u00e9sus.\"},{\"id\":\"PASSION24.HOUR.16.REF.P005\",\"t\":\"Parfois, pris d'Amour pour notre pauvre \u00e2me,\\nJ\u00e9sus veut Lui-m\u00eame nous enlever nos cha\u00eenes.\\nQuand nous nous lamentons parce que nous ne voulons pas \u00eatre li\u00e9s \u00e0 J\u00e9sus,\\nnous Le contraignons, chagrin\u00e9, \u00e0 se retirer.\\n\u00c0 travers ses Souffrances,\\nnotre J\u00e9sus martyris\u00e9 r\u00e9pare nos p\u00e9ch\u00e9s contre la modestie.\\nEt nous, sommes-nous purs\\n- dans nos regards, - dans nos paroles et - dans nos affections,\\nde sorte que nous n'ajoutions pas d'autres coups sur son Corps innocent ?\"},{\"id\":\"PASSION24.HOUR.16.REF.P006\",\"t\":\"Sommes-nous toujours attach\u00e9s \u00e0 J\u00e9sus de sorte que nous nous trouvions\\npr\u00eats \u00e0 Le d\u00e9fendre quand les cr\u00e9atures Le frappent par leurs offenses ?\\nMon J\u00e9sus encha\u00een\u00e9, que tes cha\u00eenes soient les miennes, de sorte\\n- que je Te sente toujours en moi, et que Tu me sentes toujours en Toi.\"}],\"subsections\":[]},{\"hour_id\":\"PASSION24.HOUR.17\",\"hour_number\":17,\"display_time\":\"9h \u00e0 10h\",\"title\":\"Le couronnement d\u2019\u00e9pines \u2013 La condamnation \u00e0 mort\",\"short_title\":\"Le couronnement d\u2019\u00e9pines \u2013 La condamnation \u00e0 mort\",\"source_pages\":[143,144,145,146,147,148,149,150,151,152,153,154],\"opening_prayer_ids\":[\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"],\"closing_prayer_ids\":[\"PASSION24.PRAYER.AFTER_EACH_HOUR\"],\"paragraphs\":[{\"id\":\"PASSION24.HOUR.17.P001\",\"n\":1,\"t\":\"J\u00e9sus est condamn\u00e9 \u00e0 mort Plus je Te regarde et plus je vois combien Tu souffres. Tu es tout lac\u00e9r\u00e9. Il n'y a aucune partie saine en ton Corps.\"},{\"id\":\"PASSION24.HOUR.17.P002\",\"n\":2,\"t\":\"Les bourreaux sont furieux de voir que malgr\u00e9 tant de Souffrances, Tu les regardes toujours avec Amour. Ton Regard aimant forme un doux enchantement et recherche de nouvelles Souffrances.\"},{\"id\":\"PASSION24.HOUR.17.P003\",\"n\":3,\"t\":\"Tes bourreaux,\"},{\"id\":\"PASSION24.HOUR.17.P004\",\"n\":4,\"t\":\"- non seulement parce qu'ils sont cruels,\\n- mais aussi forc\u00e9s \u00e0 leur insu par ton Amour,\\nte mettent sur pied pour T\u2019infliger de nouveaux Tourments.\"},{\"id\":\"PASSION24.HOUR.17.P005\",\"n\":5,\"t\":\"Mais Toi, \u00e0 bout de forces, Tu tombes de nouveau dans ton Sang. Les bourreaux, irrit\u00e9s, \u00e0 coups de pied et en Te poussant Te font parvenir au lieu o\u00f9 ils Te couronneront d'\u00e9pines.\"},{\"id\":\"PASSION24.HOUR.17.P006\",\"n\":6,\"t\":\"J\u00e9sus est couronn\u00e9 d\u2019\u00e9pines Mon Amour, si Tu ne me soutiens pas de ton Regard, je ne pourrai pas continuer \u00e0 Te voir ainsi tortur\u00e9. Je sens des frissons dans mes os. J'ai le c\u0153ur qui bat. Je me sens mourir : \u00ab J\u00e9sus, J\u00e9sus, aide-moi ! \u00bb\"},{\"id\":\"PASSION24.HOUR.17.P007\",\"n\":7,\"t\":\"Et Toi, Tu sembles me dire :\"},{\"id\":\"PASSION24.HOUR.17.P008\",\"n\":8,\"t\":\"\u00ab Mon enfant, courage,\\n- ne perds rien de ce que Je souffre,\\n- sois attentive \u00e0 mes Enseignements.\"},{\"id\":\"PASSION24.HOUR.17.P009\",\"n\":9,\"t\":\"Je dois refaire l'homme en toutes choses. Ses fautes l'ont couronn\u00e9 d'opprobres et de confusion, si bien qu'il ne peut para\u00eetre devant ma Majest\u00e9. Ses fautes l'ont d\u00e9shonor\u00e9 en lui faisant perdre tout droit aux honneurs et \u00e0 la gloire.\"},{\"id\":\"PASSION24.HOUR.17.P010\",\"n\":10,\"t\":\"Par cons\u00e9quent, Je veux \u00eatre couronn\u00e9 d'\u00e9pines pour\\n- remettre sa couronne sur son front et\\n- lui restituer tous ses droits, son honneur et sa gloire.\"},{\"id\":\"PASSION24.HOUR.17.P011\",\"n\":11,\"t\":\"Mes \u00e9pines seront devant mon P\u00e8re\\n- r\u00e9parations et disculpation pour ses nombreux p\u00e9ch\u00e9s\\ndans ses pens\u00e9es, surtout pour son orgueil.\"},{\"id\":\"PASSION24.HOUR.17.P012\",\"n\":12,\"t\":\"Mes \u00e9pines seront\\n- des Sources de Lumi\u00e8re pour chaque intelligence cr\u00e9\u00e9e,\\n- des Voix de supplication pour qu'elles ne M\u2019offensent plus.\"},{\"id\":\"PASSION24.HOUR.17.P013\",\"n\":13,\"t\":\"Toi, unis-toi \u00e0 Moi, prie et r\u00e9pare avec Moi. \u00bb\\nPoursuivant dans leurs cruaut\u00e9s, tes ennemis\\n- Te font asseoir,\\n- d\u00e9posent sur Toi une guenille de pourpre,\\n- prennent une couronne d'\u00e9pines qu'ils viennent de fabriquer,\"},{\"id\":\"PASSION24.HOUR.17.P014\",\"n\":14,\"t\":\"et avec une furie infernale, la placent sur ta T\u00eate adorable. Puis, \u00e0 coups de b\u00e2ton, ils Te font p\u00e9n\u00e9trer les \u00e9pines dans la T\u00eate.\"},{\"id\":\"PASSION24.HOUR.17.P015\",\"n\":15,\"t\":\"Les \u00e9pines\\n- parviennent \u00e0 tes Yeux et \u00e0 tes Oreilles,\\n- p\u00e9n\u00e8trent ton Cr\u00e2ne jusque derri\u00e8re ta Nuque.\"},{\"id\":\"PASSION24.HOUR.17.P016\",\"n\":16,\"t\":\"Mon Amour, quel Supplice, quelles Souffrances incommensurables ! Combien de Morts cruelles ne subis-Tu pas ! Le Sang coule sur ton Visage : on ne voit que du Sang.\"},{\"id\":\"PASSION24.HOUR.17.P017\",\"n\":17,\"t\":\"Mais sous ces \u00e9pines et ce Sang, on voit ton Visage infiniment saint\\n- rayonnant la Douceur, la Paix et l'Amour.\\nPoursuivant avec leurs moqueries, tes bourreaux\\n- Te mettent un roseau \u00e0 la Main en guise de sceptre et\\n- commencent leurs sarcasmes.\\nIls Te saluent comme Roi des Juifs, battent ta couronne et Te giflent.\"},{\"id\":\"PASSION24.HOUR.17.P018\",\"n\":18,\"t\":\"Et Toi, Tu Te tais et r\u00e9pares les ambitions de ceux\\n- qui aspirent \u00e0 r\u00e9gner,\\n- qui recherchent les dignit\u00e9s,\\n- qui, se trouvant en autorit\u00e9 et ne se comportant pas bien,\\ncausent la ruine des peuples et des \u00e2mes sur lesquelles ils ont autorit\u00e9 !\"},{\"id\":\"PASSION24.HOUR.17.P019\",\"n\":19,\"t\":\"Au moyen de ce roseau que Tu tiens dans ta Main, doux J\u00e9sus,\\nTu r\u00e9pares beaucoup d'\u0153uvres,\\n- peut-\u00eatre bonnes en soi,\\n- mais vides d'esprit int\u00e9rieur et\\n- faites m\u00eame dans des intentions mauvaises.\"},{\"id\":\"PASSION24.HOUR.17.P020\",\"n\":20,\"t\":\"Par les insultes et les moqueries que Tu subis, Tu r\u00e9pares pour ceux\\n- qui profanent et ridiculisent les choses saintes.\"},{\"id\":\"PASSION24.HOUR.17.P021\",\"n\":21,\"t\":\"Mon Roi J\u00e9sus, tes ennemis continuent leurs insultes.\\nIl y a tellement de Sang qui coule de ta T\u00eate qu'il\\n- en parvient jusque dans ta Bouche,\\n- T\u2019emp\u00eachant de me faire entendre clairement ta Voix.\"},{\"id\":\"PASSION24.HOUR.17.P022\",\"n\":22,\"t\":\"J\u00e9sus, je veux mettre ma t\u00eate sous ces \u00e9pines, afin de ressentir leurs piq\u00fbres.\\nJ\u00e9sus, comme il est bon d'\u00eatre avec Toi, m\u00eame au milieu de mille tourments !\\nEt Tu sembles me dire :\\n\u00ab Mon enfant, ces \u00e9pines disent\\n- que Je veux \u00eatre Roi de chaque c\u0153ur,\\n- que c'est \u00e0 Moi que revient toute domination.\\nToi, prends ces \u00e9pines et pique-toi le C\u0153ur.\"},{\"id\":\"PASSION24.HOUR.17.P023\",\"n\":23,\"t\":\"Fais-en sortir tout ce qui ne M\u2019appartient pas. Laisse une \u00e9pine dans ton c\u0153ur comme rappel que c'est Moi ton Roi, pour emp\u00eacher que quelque chose d'autre y entre.\"},{\"id\":\"PASSION24.HOUR.17.P024\",\"n\":24,\"t\":\"Va chez tous les c\u0153urs et, en les piquant,\\nfais-en sortir toute fum\u00e9e d'orgueil, pourriture, et\\nconstitue-Moi Roi de tous. \u00bb\\nMon Amour,\\nje Te prie de me piquer\\n- les oreilles de tes \u00e9pines, afin qu'elles puissent n'entendre que ta Voix,\\n- mes yeux pour qu'ils ne regardent que Toi,\\n- ma bouche pour que ma langue reste\\nmuette par rapport \u00e0 tout ce qui pourrait T\u2019offenser et\\nlibre pour Te louer et Te b\u00e9nir en toutes choses.\"},{\"id\":\"PASSION24.HOUR.17.P025\",\"n\":25,\"t\":\"Mon Roi, entoure-moi d'\u00e9pines, et que ces \u00e9pines me gardent toute attentive \u00e0 Toi. J\u00e9sus, je vois que tes ennemis Te conduisent \u00e0 Pilate, qui va Te condamner \u00e0 mort ! Je veux essuyer ton Sang et lui donner un baiser.\"},{\"id\":\"PASSION24.HOUR.17.P026\",\"n\":26,\"t\":\"Mon Amour, aide-moi \u00e0 continuer de T\u2019accompagner sur ton Chemin Douloureux.\"},{\"id\":\"PASSION24.HOUR.17.P027\",\"n\":27,\"t\":\"J\u00e9sus est de nouveau envoy\u00e9 \u00e0 Pilate\"},{\"id\":\"PASSION24.HOUR.17.P028\",\"n\":28,\"t\":\"Mon J\u00e9sus couronn\u00e9, mon c\u0153ur, qui a \u00e9t\u00e9 bless\u00e9 par ton Amour et transperc\u00e9 par tes \u00e9pines, ne peut vivre sans Toi. Te voil\u00e0 maintenant devant Pilate. Quel spectacle \u00e9mouvant ! Les Cieux sont saisis d'horreur et l'enfer tremble de peur et de rage !\"},{\"id\":\"PASSION24.HOUR.17.P029\",\"n\":29,\"t\":\"\u00d4 ma Vie, je ne peux supporter de Te voir dans un tel \u00e9tat. L'attirance de ton Amour m'am\u00e8ne \u00e0 Te regarder quand m\u00eame, afin que je comprenne bien tes Souffrances. \u00c0 travers mes larmes et mes soupirs d'amour, je Te contemple. Mon J\u00e9sus, Tu es presque nu. Au lieu de tes v\u00eatements, Tu es rev\u00eatu de Sang.\"},{\"id\":\"PASSION24.HOUR.17.P030\",\"n\":30,\"t\":\"Tes Chairs sont d\u00e9chir\u00e9es, tes Os sont d\u00e9nud\u00e9s, et ton Visage infiniment saint est m\u00e9connaissable. Les \u00e9pines enfonc\u00e9es dans ta T\u00eate T\u2019arrivent jusqu'aux Yeux et au Visage. Ton Sang pr\u00e9cieux s'\u00e9coule jusqu'\u00e0 terre. Mon J\u00e9sus, je ne Te reconnais plus. Comme Tu es mal en point ! Tu es parvenu aux exc\u00e8s les plus profonds des humiliations et des tourments !\"},{\"id\":\"PASSION24.HOUR.17.P031\",\"n\":31,\"t\":\"Je ne peux plus supporter cette vue si p\u00e9nible. Je me sens mourir ! Je voudrais Te soustraire de la pr\u00e9sence de Pilate pour T'enfermer dans mon c\u0153ur et Te donner du repos.\"},{\"id\":\"PASSION24.HOUR.17.P032\",\"n\":32,\"t\":\"Je voudrais gu\u00e9rir tes Plaies par mon amour. Je voudrais inonder de ton Sang le monde entier pour atteindre toutes les \u00e2mes et Te les amener comme tes conqu\u00eates ! \u00d4 patient J\u00e9sus, c'est avec difficult\u00e9 qu'\u00e0 travers les \u00e9pines\"},{\"id\":\"PASSION24.HOUR.17.P033\",\"n\":33,\"t\":\"Tu me regardes et Tu me dis :\"},{\"id\":\"PASSION24.HOUR.17.P034\",\"n\":34,\"t\":\"\u00ab Mon enfant, viens entre mes Bras, appuie ta t\u00eate sur ma Poitrine. Tu percevras des Souffrances plus intenses et plus cruelles.\"},{\"id\":\"PASSION24.HOUR.17.P035\",\"n\":35,\"t\":\"Car ce que tu vois \u00e0 l'ext\u00e9rieur de mon Humanit\u00e9 n'est que l'\u00e9cho de mes Peines int\u00e9rieures.\"},{\"id\":\"PASSION24.HOUR.17.P036\",\"n\":36,\"t\":\"Pr\u00eate attention aux Battements de mon C\u0153ur\"},{\"id\":\"PASSION24.HOUR.17.P037\",\"n\":37,\"t\":\"Tu comprendras que Je r\u00e9pare\\n- les injustices de ceux qui commandent,\\n- les oppressions qu'ils exercent sur les pauvres et les innocents,\\n- leur orgueil qui,\\npour obtenir des dignit\u00e9s, des fonctions ou la richesse, ne se g\u00eane pas\\n- de d\u00e9sob\u00e9ir aux lois \u00e9l\u00e9mentaires de leur conscience et\\n- d'\u00e9corcher leur prochain,\\nfermant leurs yeux \u00e0 la Lumi\u00e8re de la V\u00e9rit\u00e9.\\nPar ces \u00e9pines, Je veux briser leur orgueil.\"},{\"id\":\"PASSION24.HOUR.17.P038\",\"n\":38,\"t\":\"Par les trous qu'elles font dans ma T\u00eate, Je veux me frayer un chemin dans leur intelligence, pour tout y r\u00e9organiser selon la Lumi\u00e8re de la V\u00e9rit\u00e9.\"},{\"id\":\"PASSION24.HOUR.17.P039\",\"n\":39,\"t\":\"En \u00e9tant ainsi humili\u00e9 devant ce juge injuste,\"},{\"id\":\"PASSION24.HOUR.17.P040\",\"n\":40,\"t\":\"Je veux faire comprendre \u00e0 tous que la seule vertu est celle qui rend l'homme ma\u00eetre de lui-m\u00eame.\"},{\"id\":\"PASSION24.HOUR.17.P041\",\"n\":41,\"t\":\"Et J'enseigne \u00e0 ceux qui commandent que la vertu unie au savoir honn\u00eate est la seule qui rend apte \u00e0 gouverner et diriger les autres. Tandis que les dignit\u00e9s sans la vertu sont des choses dangereuses et \u00e0 d\u00e9plorer. Mon enfant, fais \u00e9cho \u00e0 mes R\u00e9parations et continue \u00e0 contempler mes Peines. \u00bb Mon Amour, je vois que,\"},{\"id\":\"PASSION24.HOUR.17.P042\",\"n\":42,\"t\":\"- Te voyant si mal en point, Pilate frissonne.\\nImpressionn\u00e9, il s'exclame :\\n\u00ab Est-il possible qu'il y ait tant de cruaut\u00e9 dans des poitrines humaines ?\\nAh ! ce n'\u00e9tait pas ce que je voulais quand je L'ai condamn\u00e9 \u00e0 \u00eatre battu ! \u00bb\"},{\"id\":\"PASSION24.HOUR.17.P043\",\"n\":43,\"t\":\"Il veut Te lib\u00e9rer d'entre les mains de tes ennemis.\\nTout humble et en d\u00e9tournant de Toi son regard,\\n- car il ne peut supporter la vue de ton horrible \u00e9tat,\\nil recommence \u00e0 T'interroger :\"},{\"id\":\"PASSION24.HOUR.17.P044\",\"n\":44,\"t\":\"\u00ab Mais dis-moi, qu'as-Tu fait ? Ton peuple T'a remis entre mes mains : dis-moi, es-Tu roi ? Quel est ton royaume ? \u00bb Comme Tu ne r\u00e9ponds pas \u00e0 ses questions, Pilate ajoute : \u00ab Ne sais-Tu pas qu'il est en mon pouvoir de Te lib\u00e9rer ou de Te condamner ? \u00bb\"},{\"id\":\"PASSION24.HOUR.17.P045\",\"n\":45,\"t\":\"Alors, mon Amour, Tu veux faire resplendir dans l'intelligence de Pilate la Lumi\u00e8re de ta V\u00e9rit\u00e9, et Tu r\u00e9ponds : \u00ab Tu n'aurais sur Moi aucun pouvoir s'il ne te venait d'en haut. Cependant, ceux qui M\u2019ont remis entre tes mains ont commis un p\u00e9ch\u00e9 plus grave que le tien. \u00bb\"},{\"id\":\"PASSION24.HOUR.17.P046\",\"n\":46,\"t\":\"J\u00e9sus est pr\u00e9sent\u00e9 comme \u00ab Ecce Homo \u00bb Alors, \u00e9mu par la douceur de ta Voix, Pilate d\u00e9cide, le c\u0153ur tourment\u00e9, de Te montrer au peuple \u00e0 partir de sa loge.\"},{\"id\":\"PASSION24.HOUR.17.P047\",\"n\":47,\"t\":\"Il esp\u00e8re\\n- que les Juifs seraient pris de compassion en Te voyant si d\u00e9figur\u00e9, et\\n- qu'il pourrait ainsi Te lib\u00e9rer.\\nMon J\u00e9sus attrist\u00e9,\\nTu marches avec difficult\u00e9, courb\u00e9 sous cette horrible couronne d'\u00e9pines.\\nTon Sang marque tes Pas. En arrivant dehors, Tu vois la foule en tumulte qui,\\nanxieuse, attend ta condamnation.\"},{\"id\":\"PASSION24.HOUR.17.P048\",\"n\":48,\"t\":\"Pilate impose le silence\\n- pour ramener tout le monde \u00e0 l'attention et\\n- pour se faire entendre de tous.\"},{\"id\":\"PASSION24.HOUR.17.P049\",\"n\":49,\"t\":\"Il prend avec d\u00e9go\u00fbt les deux lambeaux de la pourpre\\n- qui Te couvre la Poitrine et les \u00c9paules,\\nla soul\u00e8ve, afin que tous voient le piteux \u00e9tat dans lequel Tu Te trouves.\"},{\"id\":\"PASSION24.HOUR.17.P050\",\"n\":50,\"t\":\"\u00c0 voix haute il dit : \u00ab Ecce Homo ! Regardez-Le, Il n'a plus l'apparence d'un homme. Observez ses Plaies, on ne Le reconna\u00eet plus. S'Il a fait du mal, Il a d\u00e9j\u00e0 souffert assez, m\u00eame trop Moi, je regrette de L'avoir fait tant souffrir, laissons-Le donc libre ! \u00bb \u00c0 ces paroles, il se fait un silence profond au Ciel, sur terre et en enfer !\"},{\"id\":\"PASSION24.HOUR.17.P051\",\"n\":51,\"t\":\"Puis, comme d'une seule voix, j'entends le cri de tous : \u00ab Crucifie-Le, crucifie-Le ! Nous Le voulons mort ! \u00bb\"},{\"id\":\"PASSION24.HOUR.17.P052\",\"n\":52,\"t\":\"J\u00e9sus, mon Amour, laisse-moi Te soutenir, car je vois que Tu vacilles sous tant d'accablement. J\u00e9sus, ma Vie, je vois que Tu trembles. Ce cri de condamnation \u00e0 mort p\u00e9n\u00e8tre ton C\u0153ur.\"},{\"id\":\"PASSION24.HOUR.17.P053\",\"n\":53,\"t\":\"Et dans ces voix Tu per\u00e7ois la Voix de ton cher P\u00e8re qui dit : \u00ab Mon Fils, Je Te veux mort, et mort crucifi\u00e9 ! \u00bb\"},{\"id\":\"PASSION24.HOUR.17.P054\",\"n\":54,\"t\":\"Tu entends aussi ta Maman qui, malgr\u00e9 qu'elle en soit navr\u00e9e, fait \u00e9cho \u00e0 ton cher P\u00e8re et dit : \u00ab Fils, je Te veux mort ! \u00bb\"},{\"id\":\"PASSION24.HOUR.17.P055\",\"n\":55,\"t\":\"Les anges, les saints, l'enfer, tous, d'une voix unanime, crient : \u00ab Crucifie-Le, crucifie-Le. \u00bb Si bien qu'il n'y a aucune \u00e2me qui vive qui ne Te veuille mort.\"},{\"id\":\"PASSION24.HOUR.17.P056\",\"n\":56,\"t\":\"Et, \u00e0 ma plus grande horreur, moi aussi je me sens contrainte par une force supr\u00eame \u00e0 crier : \u00ab Crucifie-Le ! \u00bb\"},{\"id\":\"PASSION24.HOUR.17.P057\",\"n\":57,\"t\":\"Mon J\u00e9sus, pardonne \u00e0 la mis\u00e9rable p\u00e9cheresse que je suis de Te vouloir mort ! Je Te prie de me faire mourir avec Toi. Et Toi, \u00f4 mon J\u00e9sus tortur\u00e9, il semble que, \u00e9mu par ma souffrance, Tu me dises :\"},{\"id\":\"PASSION24.HOUR.17.P058\",\"n\":58,\"t\":\"\u00ab Mon enfant, serre-toi sur mon C\u0153ur. Prends part \u00e0 mes Peines et \u00e0 mes R\u00e9parations. Le moment est solennel : ou bien c'est ma Mort, ou bien c'est la mort de toutes les cr\u00e9atures. En ce moment, deux courants se d\u00e9versent dans mon C\u0153ur.\"},{\"id\":\"PASSION24.HOUR.17.P059\",\"n\":59,\"t\":\"Dans l'un il y a les \u00e2mes qui, si elles Me veulent mort, c'est parce qu'elles veulent trouver en Moi la Vie.\"},{\"id\":\"PASSION24.HOUR.17.P060\",\"n\":60,\"t\":\"Ainsi, comme J'accepte la mort \u00e0 leur place, elles sont lib\u00e9r\u00e9es de la condamnation \u00e9ternelle et les portes du Ciel s'ouvrent \u00e0 elles.\"},{\"id\":\"PASSION24.HOUR.17.P061\",\"n\":61,\"t\":\"Dans l'autre courant, il y a les \u00e2mes qui Me veulent mort par haine et pour la confirmation de leur condamnation. Mon C\u0153ur en est lac\u00e9r\u00e9 et ressent la mort de chacune et les peines m\u00eames de l'enfer o\u00f9 elles se dirigent !\"},{\"id\":\"PASSION24.HOUR.17.P062\",\"n\":62,\"t\":\"Ah ! mon C\u0153ur ne supporte pas ces Souffrances cruelles et Me fait r\u00e9p\u00e9ter : pourquoi tant de Sang vers\u00e9 en vain ? Pourquoi mes Peines seront-elles inutiles pour tant d'\u00e2mes ?\"},{\"id\":\"PASSION24.HOUR.17.P063\",\"n\":63,\"t\":\"Mon enfant, soutiens-Moi, Je n'en peux plus.\\nPrends part \u00e0 mes Peines.\\nQue ta vie soit une offrande continuelle\\n- pour sauver les \u00e2mes,\\n- pour adoucir mes tortures ! \u00bb\\nMon J\u00e9sus, tes Peines sont les miennes.\\nEt je veux participer \u00e0 tes R\u00e9parations.\"},{\"id\":\"PASSION24.HOUR.17.P064\",\"n\":64,\"t\":\"Je vois qu'aux cris de la foule, Pilate est stup\u00e9fait. Il se h\u00e2te de dire : \u00ab Comment, dois-je crucifier votre Roi ? Moi, je ne trouve pas de faute en Lui pour Le condamner. \u00bb\"},{\"id\":\"PASSION24.HOUR.17.P065\",\"n\":65,\"t\":\"Et les Juifs crient en assourdissant l'air : \u00ab Nous n'avons pas d'autre roi que C\u00e9sar. Si tu ne Le condamnes pas, tu n'es pas l'ami de C\u00e9sar. Crucifie-Le ! Crucifie-Le ! \u00bb\"},{\"id\":\"PASSION24.HOUR.17.P066\",\"n\":66,\"t\":\"J\u00e9sus est condamn\u00e9 \u00e0 mort\"},{\"id\":\"PASSION24.HOUR.17.P067\",\"n\":67,\"t\":\"Pilate, ne sachant que faire et craignant d'\u00eatre d\u00e9pos\u00e9, se fait apporter une bassine d'eau et, se lavant les mains, il dit : \u00ab Moi, je suis innocent du Sang de ce juste. \u00bb Et il Te livre \u00e0 la crucifixion.\"},{\"id\":\"PASSION24.HOUR.17.P068\",\"n\":68,\"t\":\"Mais les Juifs ajoutent : \u00ab Que son Sang retombe sur nous et sur nos enfants ! \u00bb Et, Te voyant condamn\u00e9, ils font la f\u00eate, battent des mains, sifflent, hurlent.\"},{\"id\":\"PASSION24.HOUR.17.P069\",\"n\":69,\"t\":\"Et Toi, \u00f4 J\u00e9sus, Tu r\u00e9pares\\npour ceux qui se trouvent dans les hauts rangs de la soci\u00e9t\u00e9 et\\nqui, mus par une vaine crainte et pour ne pas perdre leur poste,\\n- d\u00e9sob\u00e9issent aux lois les plus sacr\u00e9es,\\n- ne se pr\u00e9occupent pas de la ruine de peuples entiers,\\n- favorisent les impies et condamnent les innocents.\"},{\"id\":\"PASSION24.HOUR.17.P070\",\"n\":70,\"t\":\"Tu r\u00e9pares aussi pour ceux, qui, apr\u00e8s leur faute, incitent diaboliquement la Col\u00e8re divine \u00e0 les punir.\"},{\"id\":\"PASSION24.HOUR.17.P071\",\"n\":71,\"t\":\"Tandis que Tu r\u00e9pares tout cela, ton C\u0153ur saigne\\n\u00e0 cause de la Souffrance de voir ton peuple choisi\\n- marqu\u00e9 de la mal\u00e9diction du Ciel qu'il vient lui-m\u00eame d'appeler,\\n- la scellant de ton Sang qu'ils ont appel\u00e9 sur leur propre t\u00eate !\"},{\"id\":\"PASSION24.HOUR.17.P072\",\"n\":72,\"t\":\"Ah ! ton C\u0153ur s'\u00e9vanouit. Laisse-moi Te soutenir, partageant tes R\u00e9parations et tes Peines.\"},{\"id\":\"PASSION24.HOUR.17.P073\",\"n\":73,\"t\":\"Mais ton Amour Te pousse plus avant. Impatient, Tu cherches la Croix !\"},{\"id\":\"PASSION24.HOUR.17.P074\",\"n\":74,\"t\":\"Ma Vie, je Te suivrai, mais, pour l'instant, repose-toi dans mes bras. Apr\u00e8s, nous nous rendrons ensemble au Calvaire. Reste en moi et b\u00e9nis-moi.\"}],\"reflections\":[{\"id\":\"PASSION24.HOUR.17.REF.P001\",\"t\":\"J\u00e9sus est couronn\u00e9 d'\u00e9pines. Il est trait\u00e9 comme un roi de plaisanterie. Il est soumis \u00e0 des insultes et des Peines inou\u00efes. Il r\u00e9pare ainsi nos p\u00e9ch\u00e9s d'orgueil. Et nous, \u00e9vitons-nous les pens\u00e9es d'orgueil ?\"},{\"id\":\"PASSION24.HOUR.17.REF.P002\",\"t\":\"Savons-nous attribuer \u00e0 Dieu le bien que nous faisons ? Savons-nous nous estimer inf\u00e9rieurs aux autres ? Savons-nous garder notre intelligence exempte de pens\u00e9es frivoles ?\"},{\"id\":\"PASSION24.HOUR.17.REF.P003\",\"t\":\"Souvent nous ne sommes pas r\u00e9ceptifs \u00e0 la Gr\u00e2ce, parce que nous gardons notre intelligence occup\u00e9e par des pens\u00e9es frivoles. Et alors, comme notre intelligence n'est pas toute remplie de Dieu, le d\u00e9mon trouve la voie libre pour nous importuner. C'est un peu comme si c'\u00e9tait nous-m\u00eames qui fomentions nos tentations.\"},{\"id\":\"PASSION24.HOUR.17.REF.P004\",\"t\":\"Quand notre intelligence est remplie de Dieu, alors,\\n- ne trouvant pas en nous d'endroit o\u00f9 diriger ses tentations,\\nle d\u00e9mon s'\u00e9loigne confus.\"},{\"id\":\"PASSION24.HOUR.17.REF.P005\",\"t\":\"Les pens\u00e9es saintes ont tant de force contre le d\u00e9mon que,\\n- quand il veut s'approcher de nous,\\nces pens\u00e9es, comme autant d'\u00e9p\u00e9es, le blessent et le font s'\u00e9loigner.\\nC'est donc \u00e0 tort que nous nous lamentons quand notre intelligence est\\nimportun\u00e9e par l'ennemi.\\nNotre manque de vigilance qui l'incite \u00e0 nous attaquer.\\nC'est comme s'il espionnait notre intelligence pour y d\u00e9celer des points faibles\\net monter \u00e0 l'assaut.\"},{\"id\":\"PASSION24.HOUR.17.REF.P006\",\"t\":\"Alors, au lieu de soulager J\u00e9sus\\n- par nos saintes pens\u00e9es et Lui enlever ses \u00e9pines,\\nnous les Lui pressons sur la T\u00eate.\\nLa Gr\u00e2ce ne peut pr\u00e9senter \u00e0 notre intelligence de saintes inspirations.\\nSouvent nous faisons pire. Quand nous sentons le poids des tentations,\\nau lieu de les pr\u00e9senter \u00e0 J\u00e9sus pour les faire br\u00fbler au Feu de son Amour,\\n- nous nous inqui\u00e9tons, nous nous attristons, nous faisons des calculs.\"},{\"id\":\"PASSION24.HOUR.17.REF.P007\",\"t\":\"Ainsi non seulement notre intelligence est occup\u00e9e par les mauvaises pens\u00e9es, mais encore notre \u00eatre tout entier en est impr\u00e9gn\u00e9. Et il faut presque un miracle de J\u00e9sus pour nous en lib\u00e9rer.\"},{\"id\":\"PASSION24.HOUR.17.REF.P008\",\"t\":\"C'est comme si, \u00e0 travers ses \u00e9pines, J\u00e9sus nous regarde et nous dise :\"},{\"id\":\"PASSION24.HOUR.17.REF.P009\",\"t\":\"\u00ab Ah ! mon enfant, c'est toi-m\u00eame qui ne veux pas \u00eatre proche de Moi. Si seulement tu \u00e9tais venu tout de suite \u00e0 Moi, Je t'aurais aid\u00e9 \u00e0 Te lib\u00e9rer des vexations de l'ennemi et tu ne M\u2019aurais pas fait soupirer apr\u00e8s toi.\"},{\"id\":\"PASSION24.HOUR.17.REF.P010\",\"t\":\"Je cherchais ta coop\u00e9ration pour Me lib\u00e9rer d'\u00e9pines. Mais c'est en vain que Je t'ai attendu, parce que tu \u00e9tais occup\u00e9 par le travail intense que ton ennemi t'avait donn\u00e9.\"},{\"id\":\"PASSION24.HOUR.17.REF.P011\",\"t\":\"Oh ! comme tu serais moins tent\u00e9 si tout de suite tu venais dans mes Bras. Alors l'ennemi Me craindrait Moi-m\u00eame, plut\u00f4t que toi Et c'est tout de suite qu'il Te laisserait. \u00bb\"},{\"id\":\"PASSION24.HOUR.17.REF.P012\",\"t\":\"J\u00e9sus, que tes \u00e9pines\\n- enferment mes pens\u00e9es dans ton Intelligence et\\n- emp\u00eachent l'ennemi de m'accabler de tentations.\\nQuand J\u00e9sus se fait entendre dans notre intelligence et notre c\u0153ur,\\nr\u00e9pondons-nous \u00e0 ses Inspirations ou les oublions-nous rapidement ?\\nJ\u00e9sus est trait\u00e9 comme un roi de plaisanterie.\\nEt nous, savons-nous respecter les choses saintes ?\\nDevant elles, savons-nous user de la r\u00e9v\u00e9rence qui convient,\\ncomme si nous touchions \u00e0 J\u00e9sus-Christ Lui-m\u00eame ?\\nMon J\u00e9sus couronn\u00e9 d'\u00e9pines, fais que je ressente tes \u00e9pines,\\nafin que par leurs piq\u00fbres\\n- je comprenne combien Tu souffres et\\n- que je sache Te consid\u00e9rer comme mon Roi.\\nDebout dans la loge de Pilate,\\nJ\u00e9sus est condamn\u00e9 \u00e0 mort par ce peuple\\nqu'Il a tant aim\u00e9 et auquel il a fait tant de bien.\"},{\"id\":\"PASSION24.HOUR.17.REF.P013\",\"t\":\"Pour nous donner la Vie, J\u00e9sus accepte de mourir \u00e0 notre place.\\nEt nous, sommes-nous pr\u00eats \u00e0 accepter quelques peines\\n- pour que J\u00e9sus ne soit pas offens\u00e9 et souffre moins ?\"},{\"id\":\"PASSION24.HOUR.17.REF.P014\",\"t\":\"J\u00e9sus souffrit extr\u00eamement dans son Humanit\u00e9. Nous, qui devons continuer sa Vie sur terre, nous devons, au moyen de nos peines, Le payer de retour. Savons-nous compatir aux peines que J\u00e9sus souffre \u00e0 la vue des nombreuses \u00e2mes qui sont arrach\u00e9es \u00e0 son C\u0153ur ? Les Juifs veulent que J\u00e9sus meure crucifi\u00e9 comme un inf\u00e2me, afin que son Nom soit effac\u00e9 de la face de la terre. Et nous, voulons-nous vraiment que J\u00e9sus vive sur la terre ?\"},{\"id\":\"PASSION24.HOUR.17.REF.P015\",\"t\":\"Par nos actions, nos exemples et nos pas, nous devons r\u00e9pandre les\"},{\"id\":\"PASSION24.HOUR.17.REF.P016\",\"t\":\"empreintes divines dans le monde pour que J\u00e9sus soit connu de tous.\\nPar notre agir, nous devons faire en sorte\\n- que notre vie soit un \u00e9cho de sa Vie, et\\n- que cet \u00e9cho se fasse entendre d'un bout \u00e0 l'autre de la terre.\"},{\"id\":\"PASSION24.HOUR.17.REF.P017\",\"t\":\"Sommes-nous pr\u00eats \u00e0 donner notre vie\\n- pour que notre bien-aim\u00e9 J\u00e9sus soit d\u00e9dommag\u00e9\\nde toutes les offenses qui Lui sont faites,\\nOu bien imitons-nous les Juifs en criant avec eux : \u00ab Qu'Il soit crucifi\u00e9 ! \u00bb\\nMon J\u00e9sus condamn\u00e9,\\nje veux, par amour pour Toi, partager ta Condamnation.\"},{\"id\":\"PASSION24.HOUR.17.REF.P018\",\"t\":\"Et pour Te consoler, je veux continuellement\\n- d\u00e9verser mon amour en Toi et\\n- Te d\u00e9verser dans le c\u0153ur de toutes les cr\u00e9atures\\npour communiquer ta Vie \u00e0 tous.\"}],\"subsections\":[]},{\"hour_id\":\"PASSION24.HOUR.18\",\"hour_number\":18,\"display_time\":\"10h \u00e0 11h\",\"title\":\"J\u00e9sus est charg\u00e9 de sa Croix et conduit au Calvaire\",\"short_title\":\"J\u00e9sus est charg\u00e9 de sa Croix et conduit au Calvaire\",\"source_pages\":[155,156,157,158,159,160,161,162,163,164,165,166,167,168],\"opening_prayer_ids\":[\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"],\"closing_prayer_ids\":[\"PASSION24.PRAYER.AFTER_EACH_HOUR\"],\"paragraphs\":[{\"id\":\"PASSION24.HOUR.18.P001\",\"n\":1,\"t\":\"Mon J\u00e9sus, Amour insatiable, je vois que Tu ne Te donnes pas un instant de r\u00e9pit. Je ressens tes D\u00e9sirs ardents d'Amour. Ton C\u0153ur bat fort. A chaque Battement, je ressens tes \u00e9clatements et tes violences d'Amour. Ne pouvant contenir le Feu qui Te consume, Tu Te fatigues, Tu g\u00e9mis, Tu soupires.\"},{\"id\":\"PASSION24.HOUR.18.P002\",\"n\":2,\"t\":\"A chacun de tes g\u00e9missements, je T'entends dire : \u00ab Croix ! \u00bb Chaque goutte de ton Sang proclame : \u00ab Croix ! \u00bb\"},{\"id\":\"PASSION24.HOUR.18.P003\",\"n\":3,\"t\":\"Toutes tes Peines, dans lesquelles Tu Te noies comme dans une mer immense, r\u00e9p\u00e8tent : \u00ab Croix ! \u00bb\"},{\"id\":\"PASSION24.HOUR.18.P004\",\"n\":4,\"t\":\"Tu T'exclames :\"},{\"id\":\"PASSION24.HOUR.18.P005\",\"n\":5,\"t\":\"\u00ab \u00d4 Croix bien-aim\u00e9e et si ardemment d\u00e9sir\u00e9e, toi seule sauveras mes enfants. En Toi Je concentre tout mon Amour ! \u00bb\"},{\"id\":\"PASSION24.HOUR.18.P006\",\"n\":6,\"t\":\"J\u00e9sus est couronn\u00e9 d\u2019\u00e9pines pour la deuxi\u00e8me fois Tes ennemis Te font rentrer dans le pr\u00e9toire. Ils veulent Te faire endosser tes v\u00eatements et ils T'enl\u00e8vent la pourpre dont Tu es couvert. Mais quelle Souffrance !\"},{\"id\":\"PASSION24.HOUR.18.P007\",\"n\":7,\"t\":\"Il me serait plus facile de mourir que de Te voir tant souffrir ! Le v\u00eatement s'accroche \u00e0 ta couronne d'\u00e9pines et ils ne peuvent l'enlever. Alors, avec une cruaut\u00e9 inhumaine, ils arrachent d'un seul coup et le v\u00eatement et la couronne. Ce coup cruel brise plusieurs \u00e9pines qui demeurent enfonc\u00e9es dans ta T\u00eate. Et ton Sang coule abondamment. Tu g\u00e9mis sous la douleur. Mais, ne se souciant pas de tes tortures, tes ennemis T'enfilent ton v\u00eatement, et de nouveau Te remettent la couronne.\"},{\"id\":\"PASSION24.HOUR.18.P008\",\"n\":8,\"t\":\"Et comme ils la pressent fortement sur ta T\u00eate, les \u00e9pines Te parviennent jusqu'aux Yeux et aux Oreilles. Si bien qu'il n'y a aucune partie de ta T\u00eate infiniment sainte qui n'en ressente les douleurs.\"},{\"id\":\"PASSION24.HOUR.18.P009\",\"n\":9,\"t\":\"Ta Souffrance est si grande que Tu vacilles, Tu trembles de la t\u00eate aux pieds, Tu es sur le point de mourir. De tes Yeux languissants et pleins de Sang, Tu me regardes avec difficult\u00e9 pour me demander de l'aide dans cette d\u00e9tresse extr\u00eame. Mon J\u00e9sus, Roi des Douleurs, laisse-moi Te soutenir et Te serrer sur mon c\u0153ur.\"},{\"id\":\"PASSION24.HOUR.18.P010\",\"n\":10,\"t\":\"Je voudrais prendre le Feu qui Te d\u00e9vore pour\\n- r\u00e9duire en cendres tes ennemis et Te mettre \u00e0 l'abri.\\nMais toi, Tu ne veux pas, parce que tes D\u00e9sirs de la Croix se font plus ardents.\\nTu veux T'immoler sur elle imm\u00e9diatement pour tous, m\u00eame pour tes ennemis !\"},{\"id\":\"PASSION24.HOUR.18.P011\",\"n\":11,\"t\":\"Mais tandis que je me serre sur ton C\u0153ur et que Toi Tu Te serres sur le mien, Tu me dis :\"},{\"id\":\"PASSION24.HOUR.18.P012\",\"n\":12,\"t\":\"\u00ab Mon enfant, laisse-Moi donner libre cours \u00e0 mon Amour Avec Moi, r\u00e9pare pour ceux qui, tout en faisant le bien, Me d\u00e9shonorent. Ces Juifs Me font reprendre mes v\u00eatements pour Me d\u00e9consid\u00e9rer davantage devant le peuple, afin de le convaincre que Je suis un malfaiteur.\"},{\"id\":\"PASSION24.HOUR.18.P013\",\"n\":13,\"t\":\"Apparemment, l'action de Me v\u00eatir est bonne mais,\\ndans leur c\u0153ur, elle est mauvaise.\\nCombien de gens\\n- font de bonnes \u0153uvres,\\n- administrent les sacrements ou les fr\u00e9quentent,\\nmais \u00e0 des fins humaines, sinon carr\u00e9ment mauvaises.\\nLe bien, quand il est mal fait, porte \u00e0 la duret\u00e9.\"},{\"id\":\"PASSION24.HOUR.18.P014\",\"n\":14,\"t\":\"Je veux \u00eatre couronn\u00e9 une deuxi\u00e8me fois,\\navec des souffrances plus cruelles qu'\u00e0 la premi\u00e8re,\\n- pour briser cette duret\u00e9, et pour ainsi attirer les hommes \u00e0 Moi.\"},{\"id\":\"PASSION24.HOUR.18.P015\",\"n\":15,\"t\":\"Ah ! mon enfant, ce deuxi\u00e8me couronnement M\u2019est bien plus douloureux que le premier. Je sens ma T\u00eate comme si elle nageait dans les \u00e9pines. A chaque mouvement que Je fais ou \u00e0 chaque choc qu'on Me donne, ce sont autant de morts cruelles que Je vis.\"},{\"id\":\"PASSION24.HOUR.18.P016\",\"n\":16,\"t\":\"Je r\u00e9pare ainsi pour ceux qui,\\nau lieu de penser \u00e0 leur propre sanctification,\\n- se dissipent et rejettent ma Gr\u00e2ce,\\ntandis que Moi, Je g\u00e9mis et d\u00e9sire ardemment leur salut.\"},{\"id\":\"PASSION24.HOUR.18.P017\",\"n\":17,\"t\":\"Ah ! Je fais tout pour aimer les cr\u00e9atures et celles-ci font tout pour M\u2019offenser !\"},{\"id\":\"PASSION24.HOUR.18.P018\",\"n\":18,\"t\":\"Toi au moins, ne Me laisse pas seul dans mes Peines et dans mes R\u00e9parations ! \u00bb\"},{\"id\":\"PASSION24.HOUR.18.P019\",\"n\":19,\"t\":\"J\u00e9sus re\u00e7oit la Croix sur ses saintes Epaules Mon Bien tortur\u00e9, avec Toi je r\u00e9pare, avec Toi je souffre.\"},{\"id\":\"PASSION24.HOUR.18.P020\",\"n\":20,\"t\":\"L\u00e0 je vois que tes ennemis Te font tomber dans un escalier.\"},{\"id\":\"PASSION24.HOUR.18.P021\",\"n\":21,\"t\":\"Et apr\u00e8s, fi\u00e9vreusement, ils Te font arriver \u00e0 la Croix, toute pr\u00eate, qu'avec de si ardents D\u00e9sirs Tu cherches.\"},{\"id\":\"PASSION24.HOUR.18.P022\",\"n\":22,\"t\":\"C'est avec Amour que Tu la regardes D'un Pas assur\u00e9, Tu T'approches pour T'en emparer. Mais d'abord, Tu lui donnes un Baiser.\"},{\"id\":\"PASSION24.HOUR.18.P023\",\"n\":23,\"t\":\"Et tandis que ton Humanit\u00e9 infiniment sainte frissonne de joie, Tu la regardes et en mesures la longueur et la largeur. Tu en \u00e9tablis une portion pour chaque cr\u00e9ature. Tu en dotes suffisamment pour chacune, afin de la lier \u00e0 la Divinit\u00e9 par le lien du mariage et pour la rendre h\u00e9riti\u00e8re du Royaume des Cieux.\"},{\"id\":\"PASSION24.HOUR.18.P024\",\"n\":24,\"t\":\"Puis, ne pouvant contenir l'Amour avec lequel Tu nous aimes, Tu recommences \u00e0 lui donner des Baisers et Tu lui dis : \u00ab Croix ador\u00e9e, enfin Je t'embrasse. Tu es le d\u00e9sir ardent de mon C\u0153ur, le martyre de mon Amour. Tu as tard\u00e9 jusqu'\u00e0 maintenant, tandis que c'\u00e9tait toujours vers toi que mes Pas se dirigeaient.\"},{\"id\":\"PASSION24.HOUR.18.P025\",\"n\":25,\"t\":\"Sainte Croix, c'est toi le but de mon existence ici-bas.\\nEn toi Je concentre tout mon \u00eatre, en toi Je place tous mes enfants.\\nTu seras leur vie, leur lumi\u00e8re, leur d\u00e9fense, leur gardien et leur force.\\nTu les secourras en toutes choses\\nTu me les am\u00e8neras glorieux au Ciel.\\n\u00d4 Croix, chaire de Sagesse,\\n- toi seule enseigneras la vraie saintet\u00e9,\\n- toi seule formeras les h\u00e9ros, les athl\u00e8tes, les martyrs, les saints.\\nBelle Croix, c'est toi mon Tr\u00f4ne.\"},{\"id\":\"PASSION24.HOUR.18.P026\",\"n\":26,\"t\":\"Tandis que Je dois quitter cette terre, toi, tu seras toujours \u00e0 Moi. Je te donne en dot toutes les \u00e2mes. Garde-les-Moi, sauve-les-Moi. Je te les confie ! \u00bb Anxieux, Tu Te la fais placer sur tes \u00c9paules infiniment saintes. Ah ! mon J\u00e9sus, ta Croix est trop l\u00e9g\u00e8re pour ton Amour. Mais \u00e0 son poids s'ajoute celui de nos fautes, aussi lourd que toute la terre. Mon Bien, Tu Te sens \u00e9cras\u00e9 sous le poids de tant de fautes.\"},{\"id\":\"PASSION24.HOUR.18.P027\",\"n\":27,\"t\":\"Ton \u00c2me fr\u00e9mit d'horreur \u00e0 leur vue et elle ressent la peine de chacune. Ta Saintet\u00e9 est secou\u00e9e devant tant de laideur.\"},{\"id\":\"PASSION24.HOUR.18.P028\",\"n\":28,\"t\":\"Par cons\u00e9quent, en recevant la Croix sur tes \u00c9paules,\"},{\"id\":\"PASSION24.HOUR.18.P029\",\"n\":29,\"t\":\"Tu vacilles. Le souffle Te manque. Et de ton Humanit\u00e9 infiniment sainte coule une Sueur mortelle. Mon Amour, mon \u00e2me ne supporte pas de Te laisser seul. Je veux partager avec Toi le poids de ta Croix.\"},{\"id\":\"PASSION24.HOUR.18.P030\",\"n\":30,\"t\":\"Pour soulever le poids de nos fautes, je me serre contre tes Pieds.\\nJe veux Te donner au nom de toutes les cr\u00e9atures\\n- de l'amour pour quiconque ne T'aime pas,\\n- des louanges pour quiconque Te m\u00e9prise,\\n- des b\u00e9n\u00e9dictions, des remerciements, de l'ob\u00e9issance pour tous.\"},{\"id\":\"PASSION24.HOUR.18.P031\",\"n\":31,\"t\":\"Mon J\u00e9sus, pour toutes les offenses que Tu recevras, je veux T'offrir ma\\npersonne pour r\u00e9parer.\\nJe veux faire les actes oppos\u00e9s aux offenses que les cr\u00e9atures Te font.\\nJe veux Te consoler par mes baisers et mes actes d'amour continuels.\\nMais je sais fort bien\\n- que je suis trop mis\u00e9rable et\\n- que j'ai besoin de Toi pour pouvoir r\u00e9parer vraiment.\"},{\"id\":\"PASSION24.HOUR.18.P032\",\"n\":32,\"t\":\"Par cons\u00e9quent,\\nje m'unis \u00e0 ton Humanit\u00e9 infiniment sainte,\\nj'unis mes pens\u00e9es aux Tiennes\\n- pour r\u00e9parer mes pens\u00e9es mauvaises\\net celles de tous,\\nj'unis mes yeux aux Tiens\\n- pour r\u00e9parer les regards mauvais,\\nj\u2019unis ma bouche \u00e0 la Tienne\\n- pour r\u00e9parer les blasph\u00e8mes et les conversations mauvaises,\\nj\u2019unis mon c\u0153ur au Tien\\n- pour r\u00e9parer les tendances, les affections et les d\u00e9sirs mauvais\"},{\"id\":\"PASSION24.HOUR.18.P033\",\"n\":33,\"t\":\"En un mot, je veux r\u00e9parer tout ce que r\u00e9pare ton Humanit\u00e9 infiniment sainte\\nen m'unissant\\n- \u00e0 ton Amour infini et\\n- au bien immense que Tu fais \u00e0 tous.\"},{\"id\":\"PASSION24.HOUR.18.P034\",\"n\":34,\"t\":\"Mais je ne suis pas encore contente.\\n- je veux m'unir \u00e0 ta Divinit\u00e9,\\n- je veux perdre mon n\u00e9ant dans ta Divinit\u00e9.\\nEt ainsi, je pourrai tout Te donner.\"},{\"id\":\"PASSION24.HOUR.18.P035\",\"n\":35,\"t\":\"Je Te donne ton Amour pour \u00e9ponger tes amertumes. Je te donne ton C\u0153ur en r\u00e9paration\"},{\"id\":\"PASSION24.HOUR.18.P036\",\"n\":36,\"t\":\"- de nos froideurs,\\n- de nos manques de r\u00e9ciprocit\u00e9,\\n- de nos ingratitudes et\\n- de notre manque d'amour.\"},{\"id\":\"PASSION24.HOUR.18.P037\",\"n\":37,\"t\":\"Je Te donne\\ntes Harmonies\\n- pour Te d\u00e9dommager des outrages que Tu re\u00e7ois par les blasph\u00e8mes.\\nta Beaut\u00e9 pour Te d\u00e9dommager de la laideur de notre \u00e2me\\n- quand elle est souill\u00e9e par le p\u00e9ch\u00e9.\\nta Puret\u00e9 pour Te d\u00e9dommager de nos manques de droiture d'intention\\net de la boue qui couvre tant d'\u00e2mes.\\nton Ardeur pour br\u00fbler tous les p\u00e9ch\u00e9s et r\u00e9chauffer tous les c\u0153urs,\\nafin que tous t'aiment, et que personne ne t'offense plus.\"},{\"id\":\"PASSION24.HOUR.18.P038\",\"n\":38,\"t\":\"En somme, je Te donne tout ce que Tu es pour Te donner une satisfaction totale, un Amour \u00e9ternel et infini.\"},{\"id\":\"PASSION24.HOUR.18.P039\",\"n\":39,\"t\":\"Le Chemin au Calvaire Mon J\u00e9sus infiniment patient, Tu fais tes premiers Pas sous le poids immense de la Croix. Moi j'unis mes pas aux Tiens.\"},{\"id\":\"PASSION24.HOUR.18.P040\",\"n\":40,\"t\":\"Et quand, faible, saign\u00e9 \u00e0 blanc et vacillant, Tu seras sur le point de tomber,\\n- je serai \u00e0 ton c\u00f4t\u00e9 pour Te soutenir.\\n- je Te pr\u00eaterai mes \u00e9paules pour partager avec Toi le poids de la Croix.\\nNe me d\u00e9daigne pas, mais accepte-moi comme ta fid\u00e8le compagne.\\n\u00d4 J\u00e9sus, je vois que Tu r\u00e9pares pour tous ceux\\n- qui ne portent pas avec r\u00e9signation leur croix,\\n- qui jurent, s'irritent, se suicident ou font des meurtres.\\nTu implores pour tous la r\u00e9signation \u00e0 leur propre croix.\"},{\"id\":\"PASSION24.HOUR.18.P041\",\"n\":41,\"t\":\"J\u00e9sus tombe pour la premi\u00e8re fois\"},{\"id\":\"PASSION24.HOUR.18.P042\",\"n\":42,\"t\":\"Mais Tu Te sens \u00e9cras\u00e9 sous ta Croix.\\nTu en es \u00e0 tes premiers Pas avec elle, et d\u00e9j\u00e0 Tu tombes sous son poids.\\nEt, en tombant,\\n- Tu heurtes des pierres,\\n- les \u00e9pines s'enfoncent davantage dans ta T\u00eate, et\\n- toutes tes Plaies s'aggravent et laissent couler du Sang neuf.\"},{\"id\":\"PASSION24.HOUR.18.P043\",\"n\":43,\"t\":\"Et comme Tu n'as pas la force de Te relever, tes ennemis, irrit\u00e9s, cherchent \u00e0 Te remettre sur pied par des coups de pied et des bousculades. Mon Amour tomb\u00e9 sous la Croix, laisse-moi T'aider \u00e0 Te remettre sur pieds. Je T'embrasse, j'essuie ton Sang. Je veux r\u00e9parer pour ceux qui p\u00e8chent par ignorance ou fragilit\u00e9. Je Te prie d'aider ces \u00e2mes.\"},{\"id\":\"PASSION24.HOUR.18.P044\",\"n\":44,\"t\":\"J\u00e9sus rencontre sa tr\u00e8s Sainte M\u00e8re J\u00e9sus, ma Vie, \u00e0 travers des souffrances inou\u00efes, tes ennemis sont arriv\u00e9s \u00e0 Te remettre sur pied.\"},{\"id\":\"PASSION24.HOUR.18.P045\",\"n\":45,\"t\":\"Tandis que Tu marches en chancelant, j'entends ton Souffle haletant. Ton C\u0153ur bat plus fort et de nouvelles Peines Te transpercent. Tu secoues la T\u00eate pour Te d\u00e9barrasser les Yeux du Sang qui les remplit Anxieux, Tu regardes. Ah ! mon J\u00e9sus, j'ai tout compris :\"},{\"id\":\"PASSION24.HOUR.18.P046\",\"n\":46,\"t\":\"Ta Maman qui, comme une colombe plaintive, cherche \u00e0 Te rencontrer,\\nElle veut Te dire une derni\u00e8re parole et recevoir un dernier Regard de Toi.\\nTu la vois qui, p\u00e9n\u00e9trant dans la foule, veut \u00e0 tout prix\\n- Te voir,\\n- T'embrasser et\\n- Te faire un dernier adieu.\\nEt Tu ressens son C\u0153ur lac\u00e9r\u00e9.\"},{\"id\":\"PASSION24.HOUR.18.P047\",\"n\":47,\"t\":\"Tu es afflig\u00e9 de voir sa p\u00e2leur mortelle et toutes tes Peines qui, en vertu de son Amour pour Toi, sont reproduites en elle.\"},{\"id\":\"PASSION24.HOUR.18.P048\",\"n\":48,\"t\":\"Si elle vit, c'est un pur miracle de ton Omnipotence. Tu fais des pas pour la rencontrer, Mais c'est \u00e0 grand peine que Vous pouvez \u00e9changer un Regard ! Quels transpercements dans vos deux C\u0153urs ! Les soldats s'en aper\u00e7oivent. Par des bousculades, ils emp\u00eachent que la Maman et le Fils communiquent leur dernier adieu.\"},{\"id\":\"PASSION24.HOUR.18.P049\",\"n\":49,\"t\":\"J\u00e9sus tombe pour la deuxi\u00e8me fois Vos Souffrances r\u00e9ciproques sont telles que, p\u00e9trifi\u00e9e de Douleur, ta Maman est sur le point de succomber. Le fid\u00e8le Jean et les saintes femmes la soutiennent.\"},{\"id\":\"PASSION24.HOUR.18.P050\",\"n\":50,\"t\":\"Toi, de nouveau, Tu tombes sous le poids de la Croix.\"},{\"id\":\"PASSION24.HOUR.18.P051\",\"n\":51,\"t\":\"Alors, ce que ta Maman ne peut faire au moyen de son Corps parce qu'on l'en emp\u00eache, elle le fait au moyen de son \u00c2me :\"},{\"id\":\"PASSION24.HOUR.18.P052\",\"n\":52,\"t\":\"Elle entre en Toi,\\nElle fait sien le Vouloir de l'\u00c9ternel\\nElle s'associe \u00e0 toutes tes Peines, et\\n- elle Te fait office de Maman,\\n- elle Te donne des Baisers, Te refait, Te soulage, et\\n- elle verse en toutes tes Plaies le baume de son Amour endolori !\\nMon J\u00e9sus accabl\u00e9 de Douleurs, je m'unis \u00e0 ta Maman afflig\u00e9e.\\nJe veux faire miennes toutes tes Peines.\"},{\"id\":\"PASSION24.HOUR.18.P053\",\"n\":53,\"t\":\"Dans chaque goutte de ton Sang et dans chacune de tes Plaies,\\nje veux Te servir de maman.\\nAvec elle, et avec Toi-m\u00eame, je veux r\u00e9parer pour ceux\\n- qui font des rencontres dangereuses,\\n- qui s'exposent aux occasions de p\u00e9ch\u00e9.\\nMon J\u00e9sus, \u00e9tant tomb\u00e9 de nouveau sous la Croix, Tu g\u00e9mis.\\nLes soldats craignent que Tu meures avant le temps\\n- sous le poids de tant de souffrances et\\n- par la perte de tant de Sang.\\nN\u00e9anmoins, c'est \u00e0 coups de fouets et \u00e0 coups de pieds,\\navec beaucoup de mal, qu\u2019ils parviennent \u00e0 Te ramener sur tes pieds.\"},{\"id\":\"PASSION24.HOUR.18.P054\",\"n\":54,\"t\":\"Toi Tu r\u00e9pares\\n- les chutes r\u00e9p\u00e9t\u00e9es dans le p\u00e9ch\u00e9,\\n- les fautes graves commises par les diverses classes de personnes.\\nTu pries pour la conversion des p\u00e9cheurs obstin\u00e9s.\"},{\"id\":\"PASSION24.HOUR.18.P055\",\"n\":55,\"t\":\"La Plaie profonde de l\u2019Epaule de J\u00e9sus Mon Amour, tandis que je T'accompagne dans tes R\u00e9parations, je vois que Tu suffoques sous le poids \u00e9norme de la Croix. Tu trembles de partout. Les \u00e9pines, \u00e0 cause des chocs incessants que Tu re\u00e7ois, p\u00e9n\u00e8trent de plus en plus dans ta T\u00eate.\"},{\"id\":\"PASSION24.HOUR.18.P056\",\"n\":56,\"t\":\"La lourde Croix s'enfonce de plus en plus dans ton \u00c9paule. Elle y fait une Plaie si profonde qu'elle en d\u00e9couvre les Os.\"},{\"id\":\"PASSION24.HOUR.18.P057\",\"n\":57,\"t\":\"\u00c0 chacun de tes Pas, il semble que Tu meures Ceci Te met dans la quasi-impossibilit\u00e9 d'aller de l'avant.\"},{\"id\":\"PASSION24.HOUR.18.P058\",\"n\":58,\"t\":\"Mais ton Amour, qui peut tout, T'en donne la force. Et alors que la Croix p\u00e9n\u00e8tre dans ton \u00c9paule, Tu r\u00e9pares pour les p\u00e9ch\u00e9s cach\u00e9s.\"},{\"id\":\"PASSION24.HOUR.18.P059\",\"n\":59,\"t\":\"Le Cyr\u00e9n\u00e9en est oblig\u00e9 de porter la Croix de J\u00e9sus\"},{\"id\":\"PASSION24.HOUR.18.P060\",\"n\":60,\"t\":\"Mon J\u00e9sus,\\n- laisse-moi mettre mon \u00e9paule sous la Croix pour Te soulager,\\n- et laisse-moi r\u00e9parer avec Toi les p\u00e9ch\u00e9s secrets.\\nDe crainte que Tu ne meures sous la Croix, tes ennemis\\nobligent le Cyr\u00e9n\u00e9en \u00e0 T'aider \u00e0 la porter.\\nIl le fait de mauvais gr\u00e9, en maugr\u00e9ant.\\nCe n'est pas par amour qu'il T'aide, mais parce qu'on l'y oblige.\\nDans ton C\u0153ur se r\u00e9percutent toutes les lamentations de ceux qui manquent\\nde r\u00e9signation dans la souffrance.\\nTu r\u00e9pares leurs r\u00e9voltes, leurs col\u00e8res, et leur m\u00e9pris de la souffrance.\"},{\"id\":\"PASSION24.HOUR.18.P061\",\"n\":61,\"t\":\"Mais Tu es afflig\u00e9 bien davantage quand Tu vois que tes \u00e2mes consacr\u00e9es Te\\nfuient, celles que Tu appelles comme compagnes et aides dans ta Souffrance.\\nSi Tu les serres sur Toi avec douleur, elles se d\u00e9gagent pour aller \u00e0 la\\nrecherche des plaisirs.\\nEt ainsi elles Te laissent seul \u00e0 souffrir !\\nMon J\u00e9sus, tandis que je r\u00e9pare avec Toi,\\nje Te prie de me serrer dans tes Bras.\\nFais-le si fortement qu'il n'y ait aucune Peine que Tu souffres et\\n\u00e0 laquelle je ne prenne part, afin que\\n- je sois transform\u00e9e par ces peines et que\\n- je Te d\u00e9dommage pour l'abandon de toutes les cr\u00e9atures.\"},{\"id\":\"PASSION24.HOUR.18.P062\",\"n\":62,\"t\":\"V\u00e9ronique essuie le Visage de J\u00e9sus\"},{\"id\":\"PASSION24.HOUR.18.P063\",\"n\":63,\"t\":\"Mon J\u00e9sus, c'est \u00e0 grand peine que, tout courb\u00e9, Tu avances. Mais je vois que Tu t'arr\u00eates et cherches du Regard. Mon C\u0153ur, qu'est-ce c'est ? Que veux-Tu ?\"},{\"id\":\"PASSION24.HOUR.18.P064\",\"n\":64,\"t\":\"Ah ! c'est V\u00e9ronique qui, ne craignant rien, s'am\u00e8ne avec courage et essuie ton Visage tout couvert de Sang. Et Toi, en signe d'approbation, Tu laisses imprim\u00e9e sur son linge ta sainte Face.\"},{\"id\":\"PASSION24.HOUR.18.P065\",\"n\":65,\"t\":\"Mon g\u00e9n\u00e9reux J\u00e9sus, moi aussi je veux essuyer ta sainte Face. Non pas avec un linge, mais je veux m'offrir tout moi-m\u00eame pour Te soulager.\"},{\"id\":\"PASSION24.HOUR.18.P066\",\"n\":66,\"t\":\"Je veux entrer dans ton For int\u00e9rieur.\\nJe veux Te donner, \u00f4 J\u00e9sus,\\n- battement de c\u0153ur pour Battement de C\u0153ur,\\n- souffle pour Souffle, affection pour Affection, d\u00e9sir pour D\u00e9sir.\"},{\"id\":\"PASSION24.HOUR.18.P067\",\"n\":67,\"t\":\"J'entends me plonger dans ton Intelligence infiniment sainte. Faisant d\u00e9filer dans l'immensit\u00e9 de ta Volont\u00e9 tous ces Battements de C\u0153ur, Souffles, et D\u00e9sirs, je veux les multiplier \u00e0 l'infini.\"},{\"id\":\"PASSION24.HOUR.18.P068\",\"n\":68,\"t\":\"Je veux, \u00f4 mon J\u00e9sus, former des vagues de saints battements de c\u0153ur, afin\\n- qu'aucun battement mauvais ne se r\u00e9percute dans ton C\u0153ur et\\n- qu'ainsi soient adoucies tes Amertumes int\u00e9rieures.\"},{\"id\":\"PASSION24.HOUR.18.P069\",\"n\":69,\"t\":\"Je veux former des vagues de saintes affections et de saints d\u00e9sirs pour \u00e9loigner de Toi toute affection mauvaise et tout d\u00e9sir mauvais qui pourraient attrister ton C\u0153ur.\"},{\"id\":\"PASSION24.HOUR.18.P070\",\"n\":70,\"t\":\"Je veux, \u00f4 mon J\u00e9sus, former des vagues de saintes pens\u00e9es, pour \u00e9loigner de Toi toute pens\u00e9e qui pourrait Te d\u00e9plaire.\"},{\"id\":\"PASSION24.HOUR.18.P071\",\"n\":71,\"t\":\"Je serai tr\u00e8s attentive, \u00f4 J\u00e9sus, afin que rien ne T'afflige davantage et n'ajoute \u00e0 tes Peines int\u00e9rieures.\"},{\"id\":\"PASSION24.HOUR.18.P072\",\"n\":72,\"t\":\"\u00d4 J\u00e9sus, que tout mon for int\u00e9rieur nage dans l'immensit\u00e9 du Tien. Ainsi je pourrai y trouver assez d'Amour et assez de Volont\u00e9 pour faire en sorte que rien qui Te d\u00e9plaise puisse entrer en Toi.\"},{\"id\":\"PASSION24.HOUR.18.P073\",\"n\":73,\"t\":\"\u00d4 mon J\u00e9sus, je Te prie de sceller\\n- mes pens\u00e9es dans les Tiennes, ma volont\u00e9 dans la Tienne,\\n- mes d\u00e9sirs dans les Tiens, mes affections dans les Tiennes,\\n- mes sentiments dans les Tiens,\\nafin qu'une fois scell\u00e9s, ils ne trouvent vie qu'en Toi.\"},{\"id\":\"PASSION24.HOUR.18.P074\",\"n\":74,\"t\":\"Je Te prie encore, \u00f4 mon J\u00e9sus, d'accepter mon pauvre corps que je veux\\n- r\u00e9duire en pi\u00e8ces par amour pour Toi,\\n- r\u00e9duire en parcelles extr\u00eamement petites,\\npour les d\u00e9poser sur chacune de tes Plaies.\\nSur cette Plaie reli\u00e9e aux nombreux blasph\u00e8mes des cr\u00e9atures,\\nje mets, \u00f4 J\u00e9sus, une parcelle de mon corps pour qu'elle Te dise toujours :\\n\u00ab je Te b\u00e9nis ! \u00bb\"},{\"id\":\"PASSION24.HOUR.18.P075\",\"n\":75,\"t\":\"Sur cette Plaie reli\u00e9e aux ingratitudes humaines,\"},{\"id\":\"PASSION24.HOUR.18.P076\",\"n\":76,\"t\":\"je mets une parcelle de mon corps pour Te t\u00e9moigner ma gratitude. Sur cette Plaie qui Te fait tant souffrir \u00e0 cause des froideurs et du manque d'amour de mes fr\u00e8res et s\u0153urs humains, je mets beaucoup de parcelles de ma chair, pour qu'elles Te disent toujours : \u00ab je T'aime, je T'aime, je T'aime ! \u00bb\"},{\"id\":\"PASSION24.HOUR.18.P077\",\"n\":77,\"t\":\"Sur cette Plaie reli\u00e9e aux nombreuses irr\u00e9v\u00e9rences envers ta Personne infiniment sainte, je mets une parcelle de moi-m\u00eame, pour qu'elle Te dise toujours : \u00ab je T'adore, je T'adore, je T'adore ! \u00bb \u00d4 mon J\u00e9sus, c'est en toutes tes Plaies que je veux me diffuser. En tes Plaies envenim\u00e9es par les nombreuses incr\u00e9dulit\u00e9s, je veux que des parcelles de mon corps Te disent toujours : \u00ab Je crois, je crois en Toi, \u00f4 mon J\u00e9sus, \u00f4 mon Dieu, et en ta sainte \u00c9glise. Je suis pr\u00eate \u00e0 donner ma vie pour t\u00e9moigner de ma Foi ! \u00bb\"},{\"id\":\"PASSION24.HOUR.18.P078\",\"n\":78,\"t\":\"\u00d4 mon J\u00e9sus, je me plonge dans l'immensit\u00e9 de ta Volont\u00e9. En la faisant mienne, je veux enfermer l'\u00e2me de chaque cr\u00e9ature dans la Puissance de ta Volont\u00e9 infiniment sainte. J\u00e9sus, il me reste encore mon sang que je veux verser comme un baume gu\u00e9rissant sur tes Plaies, pour Te soulager et Te gu\u00e9rir compl\u00e8tement.\"},{\"id\":\"PASSION24.HOUR.18.P079\",\"n\":79,\"t\":\"Je veux encore, \u00f4 J\u00e9sus, faire d\u00e9filer mes pens\u00e9es dans le c\u0153ur des p\u00e9cheurs, pour les gronder continuellement, afin qu'ils n'osent plus T'offenser.\"},{\"id\":\"PASSION24.HOUR.18.P080\",\"n\":80,\"t\":\"Par ton propre Sang, fais en sorte que tous c\u00e8dent devant mes humbles\\npri\u00e8res. Ainsi je pourrai les amener tous \u00e0 ton C\u0153ur !\\nIl y a une autre Gr\u00e2ce, \u00f4 mon J\u00e9sus, que je Te demande : c'est\\n- qu'en tout ce que je vois, touche et sens,\\nce soit toujours Toi que je vois, touche et sente.\\n- que ton Image et ton Nom infiniment saints\\nsoient grav\u00e9s dans chaque parcelle de mon \u00eatre.\\nVoyant d'un mauvais oeil le geste de V\u00e9ronique,\\ntes ennemis Te fouettent, Te poussent et Te remettent en marche.\"},{\"id\":\"PASSION24.HOUR.18.P081\",\"n\":81,\"t\":\"J\u00e9sus console les saintes Femmes\"},{\"id\":\"PASSION24.HOUR.18.P082\",\"n\":82,\"t\":\"Mais quelques Pas plus loin, Tu T'arr\u00eates encore.\"},{\"id\":\"PASSION24.HOUR.18.P083\",\"n\":83,\"t\":\"M\u00eame sous le poids de tant de Peines, ton Amour ne cesse pas d'\u00eatre actif :\\n- voyant les saintes femmes qui pleurent \u00e0 cause de tes Peines,\\nTu T'oublies Toi-m\u00eame.\\nEt Tu les consoles en leur disant :\\n\u00ab Filles, ne pleurez pas sur mes Peines,\\nmais sur vos p\u00e9ch\u00e9s et sur vos enfants. \u00bb\"},{\"id\":\"PASSION24.HOUR.18.P084\",\"n\":84,\"t\":\"Quel enseignement sublime Tu nous donnes, \u00f4 J\u00e9sus ! Comme elle est douce, ta Parole ! Mon J\u00e9sus, avec Toi je r\u00e9pare les manques de charit\u00e9. Je Te demande la Gr\u00e2ce de m'oublier moi-m\u00eame, pour que je ne me rappelle que de Toi.\"},{\"id\":\"PASSION24.HOUR.18.P085\",\"n\":85,\"t\":\"J\u00e9sus tombe pour la troisi\u00e8me fois Mais, T'entendant parler, tes ennemis entrent en fureur. Ils Te tirent avec les cordes. Ils Te poussent avec tant de rage qu'ils Te font tomber. Et, en tombant, Tu heurtes des pierres. Le poids de la Croix T'\u00e9crase et Tu Te sens mourir !\"},{\"id\":\"PASSION24.HOUR.18.P086\",\"n\":86,\"t\":\"Laisse-moi Te soutenir et prot\u00e9ger de mes mains ton Visage infiniment saint. Je vois que Tu touches le sol et suffoques dans ton Sang.\"},{\"id\":\"PASSION24.HOUR.18.P087\",\"n\":87,\"t\":\"Voulant Te remettre sur pied, tes ennemis\\n- tirent avec les cordes et par les Cheveux et\\n- Te donnent des coups de pied.\\nMais tout cela est en vain.\\nTu meurs, mon J\u00e9sus ! Quelle peine ! Mon c\u0153ur se brise de douleur !\\nC'est presque en Te tra\u00eenant qu'ils Te conduisent au Calvaire.\\nTandis qu'ils Te tra\u00eenent,\\nTu r\u00e9pares toutes les offenses des \u00e2mes consacr\u00e9es qui Te sont d'un grand\\npoids, de sorte que tous tes efforts pour Te relever sont inutiles !\"},{\"id\":\"PASSION24.HOUR.18.P088\",\"n\":88,\"t\":\"Et c'est ainsi que, tra\u00een\u00e9 et foul\u00e9 aux pieds, Tu parviens au Calvaire, laissant sur ton passage une trace rouge de ton Sang pr\u00e9cieux. Mais ici, de nouvelles souffrances T'attendent.\"},{\"id\":\"PASSION24.HOUR.18.P089\",\"n\":89,\"t\":\"De nouveau, les soldats T'arrachent tes v\u00eatements et ta couronne d'\u00e9pines. Ah ! Tu g\u00e9mis en Te sentant arracher les \u00e9pines de la T\u00eate.\"},{\"id\":\"PASSION24.HOUR.18.P090\",\"n\":90,\"t\":\"Et tandis qu'ils T'arrachent tes v\u00eatements, ils arrachent aussi les Chairs lac\u00e9r\u00e9es qui y sont coll\u00e9es. Tes Plaies se d\u00e9chirent, et c'est \u00e0 ruisseaux que ton Sang coule. Elle est si grande ta Souffrance que, presque mort, Tu T'\u00e9croules. Mais personne n'a piti\u00e9 de Toi, \u00f4 mon Bien ! Au contraire, dans une fureur bestiale, ils Te remettent la couronne d'\u00e9pines en la frappant fortement. \u00c0 cause de toutes tes lac\u00e9rations et du coup sec qu'ils donnent \u00e0 tes Cheveux amass\u00e9s dans le Sang coagul\u00e9, ta torture est extr\u00eame. Seuls les anges pourraient dire ce que Tu souffres, tandis que, horrifi\u00e9s, ils d\u00e9tournent leurs regards et pleurent. Mon J\u00e9sus d\u00e9pouill\u00e9, permets-moi de Te serrer sur mon c\u0153ur pour Te r\u00e9chauffer, car je vois que Tu trembles et qu'une Sueur glac\u00e9e de mort envahit ton Humanit\u00e9.\"},{\"id\":\"PASSION24.HOUR.18.P091\",\"n\":91,\"t\":\"Comme je voudrais Te donner ma vie et tout mon sang\\npour remplacer le Tien, que Tu as r\u00e9pandu pour me donner la Vie.\\nComme s'Il me regardait de ses Yeux moribonds, J\u00e9sus semble me dire :\\n\u00ab Mon enfant, combien Me co\u00fbtent les \u00e2mes ! C'est ici le lieu\\no\u00f9 Je les attends toutes pour les sauver,\\no\u00f9 Je veux r\u00e9parer les p\u00e9ch\u00e9s de ceux\\n- qui vont jusqu'\u00e0 se d\u00e9grader au-dessous des b\u00eates et\\n- qui s'obstinent tellement \u00e0 M\u2019offenser\\nqu'ils en viennent \u00e0 ne plus pouvoir vivre sans p\u00e9cher.\"},{\"id\":\"PASSION24.HOUR.18.P092\",\"n\":92,\"t\":\"Leur raison est devenue aveugle et ils p\u00e8chent comme des fous.\\nVoil\u00e0 pourquoi une troisi\u00e8me fois, on Me couronne d'\u00e9pines.\\nEt par mon d\u00e9pouillement, Je r\u00e9pare\\n- pour ceux qui rev\u00eatent des v\u00eatements ind\u00e9cents,\\n- pour les p\u00e9ch\u00e9s contre la modestie, et\\n- pour ceux qui sont tellement li\u00e9s aux richesses,\\naux honneurs et aux plaisirs, qu'ils s'en font des dieux.\"},{\"id\":\"PASSION24.HOUR.18.P093\",\"n\":93,\"t\":\"Ah ! oui ! chacune de ces offenses est une mort que Je ressens.\\nSi Je ne meurs pas, c'est parce que la Volont\u00e9 de mon P\u00e8re \u00c9ternel le\\nveut ainsi ! \u00bb\\nMon Bien d\u00e9nud\u00e9, tandis qu'avec Toi je r\u00e9pare, je Te prie\\n- qu'au moyen de tes Mains infiniment saintes Tu me d\u00e9pouilles de tout\\n- que Tu ne permettes \u00e0 aucune affection mauvaise d'entrer dans mon c\u0153ur.\\nVeille sur lui, entoure-le de tes Peines, remplis-le de ton Amour.\"},{\"id\":\"PASSION24.HOUR.18.P094\",\"n\":94,\"t\":\"Que ma vie ne soit rien d'autre que la r\u00e9p\u00e9tition de la Tienne. Confirme par ta b\u00e9n\u00e9diction mon d\u00e9pouillement. Donne-moi la force d'assister \u00e0 ta douloureuse Crucifixion. Que je sois crucifi\u00e9e avec Toi !\"}],\"reflections\":[{\"id\":\"PASSION24.HOUR.18.REF.P001\",\"t\":\"J\u00e9sus porte sa Croix. Son Amour pour la Croix et son D\u00e9sir anxieux de mourir sur elle pour sauver les \u00e2mes, sont immenses !\"},{\"id\":\"PASSION24.HOUR.18.REF.P002\",\"t\":\"Et nous, comme J\u00e9sus, aimons-nous la souffrance ?\\nPouvons-nous dire\\n- que nos sentiments font \u00e9cho \u00e0 ses Sentiments divins,\\n- que nous aussi, nous d\u00e9sirons notre croix ?\\nQuand nous souffrons, avons-nous l'intention de nous faire les compagnons de\\nJ\u00e9sus pour all\u00e9ger sa Croix ? Comment L'accompagnons-nous ?\\nEt dans les insultes qu'Il re\u00e7oit, sommes-nous toujours pr\u00eats\\n\u00e0 Lui donner nos petites souffrances en soulagement des Siennes ?\\nQuand nous agissons, quand nous prions et\\nquand, sous le poids de peines int\u00e9rieures,\\nnous ressentons de la difficult\u00e9 dans nos souffrances,\\nsavons-nous les pr\u00e9senter \u00e0 J\u00e9sus, afin que,\\ncomme un voile essuyant ses Sueurs et son Sang, Il soit fortifi\u00e9 ?\"},{\"id\":\"PASSION24.HOUR.18.REF.P003\",\"t\":\"\u00d4 mon J\u00e9sus, appelle-moi toujours pr\u00e8s de Toi, et sois toujours pr\u00e8s de moi, pour que je Te r\u00e9conforte toujours au moyen de mes souffrances.\"}],\"subsections\":[]},{\"hour_id\":\"PASSION24.HOUR.19\",\"hour_number\":19,\"display_time\":\"11h \u00e0 midi\",\"title\":\"La Crucifixion\",\"short_title\":\"La Crucifixion\",\"source_pages\":[169,170,171,172,173,174,175,176,177,178,179,180,181,182,183,184,185,186,187,188,189,190,191,192,193,194],\"opening_prayer_ids\":[\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"],\"closing_prayer_ids\":[\"PASSION24.PRAYER.AFTER_EACH_HOUR\"],\"paragraphs\":[{\"id\":\"PASSION24.HOUR.19.P001\",\"n\":1,\"t\":\"J\u00e9sus, mon Amour, fatigu\u00e9s, mais non rassasi\u00e9s de Te tourmenter, tes ennemis Te d\u00e9pouillent de tes v\u00eatements pour Te crucifier.\"},{\"id\":\"PASSION24.HOUR.19.P002\",\"n\":2,\"t\":\"Ton Corps infiniment saint est si lac\u00e9r\u00e9 que Tu as l'air d'un agneau \u00e9corch\u00e9. Je vois que Tu trembles de tous tes membres, tandis que tes ennemis pr\u00e9parent la Croix pour Toi. Ne pouvant tenir debout, Tu tombes \u00e0 terre sur cette montagne.\"},{\"id\":\"PASSION24.HOUR.19.P003\",\"n\":3,\"t\":\"Mon Bien et mon Tout, mon c\u0153ur se serre de douleur en Te regardant, voyant que le sang coule de toutes les parties de ton Corps tr\u00e8s saint, tout bless\u00e9 de la t\u00eate aux pieds.\"},{\"id\":\"PASSION24.HOUR.19.P004\",\"n\":4,\"t\":\"J\u00e9sus est couronn\u00e9 d\u2019\u00e9pines pour la troisi\u00e8me fois\\nMais, \u00f4 indicible Souffrance,\\n- en T'enlevant tes v\u00eatements,\\n- ils T'ont arrach\u00e9 une autre fois ta couronne d'\u00e9pines.\"},{\"id\":\"PASSION24.HOUR.19.P005\",\"n\":5,\"t\":\"Puis, pour la troisi\u00e8me fois, ils Te l'ont enfonc\u00e9e sur la t\u00eate,\\n- Te faisant \u00e9prouver des souffrances inou\u00efes,\\n- ajoutant aux blessures pr\u00e9c\u00e9dentes d'autres encore plus douloureuses.\"},{\"id\":\"PASSION24.HOUR.19.P006\",\"n\":6,\"t\":\"Ah ! mon J\u00e9sus, lors de ce troisi\u00e8me couronnement d'\u00e9pines, Tu r\u00e9pares la perfidie de l'homme et son obstination dans le p\u00e9ch\u00e9 ! Mon J\u00e9sus, si l'Amour ne T'avait pas soutenu, Tu serais certainement mort \u00e0 cause de l'\u00e2pret\u00e9 de la souffrance que Tu as endur\u00e9e lors de ce troisi\u00e8me couronnement d'\u00e9pines.\"},{\"id\":\"PASSION24.HOUR.19.P007\",\"n\":7,\"t\":\"Mais je vois que Tu ne peux plus r\u00e9sister \u00e0 la souffrance et, les yeux couverts de sang, Tu regardes pour voir s'il n'y aurait pas quelqu'un qui veuille Te soutenir dans tant de souffrances et de confusion. Mon doux Bien, ma ch\u00e8re Vie, ici Tu n'es pas seul comme la nuit derni\u00e8re. Il y a ta Maman afflig\u00e9e, qui, le C\u0153ur transperc\u00e9 par une intense souffrance, subit autant de morts que Tu souffres de peines !\"},{\"id\":\"PASSION24.HOUR.19.P008\",\"n\":8,\"t\":\"Il y a aussi Marie Madeleine remplie d'amour et le fid\u00e8le Jean qui, \u00e0 la vue de tes Souffrances, restent muets de douleur.\"},{\"id\":\"PASSION24.HOUR.19.P009\",\"n\":9,\"t\":\"Dis-moi, mon Amour, qui veux-Tu pour Te soutenir dans tant de souffrances ?\\nDe gr\u00e2ce, permets que je vienne, moi qui,\\nplus que tous, ressens le besoin d'\u00eatre pr\u00e8s de Toi en ces moments.\\nTa ch\u00e8re Maman et les autres me c\u00e8dent la place.\\nEt voil\u00e0, \u00f4 J\u00e9sus, que je m'approche de Toi.\\nJe T'embrasse et je Te prie\\n- d'appuyer ta T\u00eate sur mon \u00e9paule\\n- et de me faire ressentir les blessures de tes \u00e9pines en r\u00e9paration\\nde toutes les offenses commises dans les pens\u00e9es des cr\u00e9atures.\"},{\"id\":\"PASSION24.HOUR.19.P010\",\"n\":10,\"t\":\"Mon Amour, de gr\u00e2ce, serre-moi sur Toi. Je veux baiser une par une les gouttes de Sang qui coulent sur ton saint Visage. Que chacune de ces gouttes soit une Lumi\u00e8re pour chaque intelligence cr\u00e9\u00e9e, afin qu'aucune ne T'offense par des pens\u00e9es mauvaises.\"},{\"id\":\"PASSION24.HOUR.19.P011\",\"n\":11,\"t\":\"Entre temps, mon J\u00e9sus, Tu regardes la Croix que tes ennemis sont en train de Te pr\u00e9parer. Tu entends les coups de marteau par lesquels ils font les trous pour enfoncer les clous qui Te tiendront crucifi\u00e9.\"},{\"id\":\"PASSION24.HOUR.19.P012\",\"n\":12,\"t\":\"Et ton C\u0153ur bat tr\u00e8s fort, tressaillant d'ivresse divine. Il d\u00e9sire ardemment que Tu T'\u00e9tendes sur ce lit de douleur, pour sceller de ta Mort le salut de nos \u00e2mes.\"},{\"id\":\"PASSION24.HOUR.19.P013\",\"n\":13,\"t\":\"Et je T\u2019entends dire :\"},{\"id\":\"PASSION24.HOUR.19.P014\",\"n\":14,\"t\":\"\u00ab Mon amour, ch\u00e8re Croix, mon Lit pr\u00e9cieux, Tu as \u00e9t\u00e9 mon Martyre dans la vie, et maintenant tu es mon Repos.\"},{\"id\":\"PASSION24.HOUR.19.P015\",\"n\":15,\"t\":\"Re\u00e7ois-Moi bient\u00f4t dans tes bras Je suis impatiente d'attendre. Sainte Croix, sur toi Je viens tout accomplir.\"},{\"id\":\"PASSION24.HOUR.19.P016\",\"n\":16,\"t\":\"Vite, Croix ! Accomplis les ardents D\u00e9sirs qui Me consument de donner la Vie aux \u00e2mes. Et ces vies seront scell\u00e9es par toi, \u00f4 Croix. Oh, ne tarde pas plus longtemps ! J'attends avec impatience de Me reposer sur toi pour ouvrir le Paradis \u00e0 tous mes enfants et fermer l'enfer. \u00d4 Croix, il est vrai que tu es mon Martyre, mais sous peu tu seras aussi ma Victoire et mon Triomphe complet.\"},{\"id\":\"PASSION24.HOUR.19.P017\",\"n\":17,\"t\":\"Et par toi Je donnerai de copieux H\u00e9ritages, Victoires, Triomphes et Couronnes \u00e0 mes enfants. \u00bb Mais, qui peut dire tout ce que mon doux J\u00e9sus a dit sur la Croix ? Et tandis que J\u00e9sus parle ainsi, ses bourreaux Lui ordonnent de s'\u00e9tendre sur la Croix. Il leur ob\u00e9it promptement, r\u00e9parant ainsi nos d\u00e9sob\u00e9issances.\"},{\"id\":\"PASSION24.HOUR.19.P018\",\"n\":18,\"t\":\"Mon Amour, avant que Tu T'\u00e9tendes sur la Croix, permets-moi\\n- de Te serrer plus fort sur mon c\u0153ur et\\n- de baiser tes blessures sanglantes.\"},{\"id\":\"PASSION24.HOUR.19.P019\",\"n\":19,\"t\":\"\u00c9coute, \u00f4 J\u00e9sus, je ne veux pas Te laisser. Avec Toi je veux m'\u00e9tendre sur la Croix et y rester clou\u00e9e avec Toi.\"},{\"id\":\"PASSION24.HOUR.19.P020\",\"n\":20,\"t\":\"L'Amour vrai ne supporte pas la s\u00e9paration. Pardonne la hardiesse de mon amour et conc\u00e8de-moi de rester crucifi\u00e9e avec Toi.\"},{\"id\":\"PASSION24.HOUR.19.P021\",\"n\":21,\"t\":\"Tu vois, mon tendre Amour, que je ne suis pas la seule qui Te demande cela.\\nIl y a aussi\\n- ta Maman afflig\u00e9e, de m\u00eame que\\n- l'ins\u00e9parable Marie Madeleine et\\n- le bien-aim\u00e9 Jean.\"},{\"id\":\"PASSION24.HOUR.19.P022\",\"n\":22,\"t\":\"Tous, nous Te disons qu'il sera plus supportable de rester clou\u00e9s avec Toi sur ta Croix que de Te voir crucifi\u00e9 seul !\"},{\"id\":\"PASSION24.HOUR.19.P023\",\"n\":23,\"t\":\"Par cons\u00e9quent, avec Toi je m'offre au P\u00e8re \u00e9ternel, identifi\u00e9e\\n- avec ta Volont\u00e9,\\n- avec ton C\u0153ur,\\n- avec tes r\u00e9parations et\\n- avec toutes tes souffrances.\\nAh ! Il semble que mon adorable J\u00e9sus me dise :\"},{\"id\":\"PASSION24.HOUR.19.P024\",\"n\":24,\"t\":\"\u00ab Mon enfant, tu as devanc\u00e9 mon Amour. Voici ma Volont\u00e9 : que tous ceux qui M\u2019aiment soient crucifi\u00e9s avec Moi.\"},{\"id\":\"PASSION24.HOUR.19.P025\",\"n\":25,\"t\":\"Ah ! viens donc t'\u00e9tendre avec Moi sur la Croix et Je Te donnerai la Vie par ma Vie. Tu seras la bien-aim\u00e9e de mon C\u0153ur ! \u00bb\"},{\"id\":\"PASSION24.HOUR.19.P026\",\"n\":26,\"t\":\"La Crucifixion\"},{\"id\":\"PASSION24.HOUR.19.P027\",\"n\":27,\"t\":\"Et voici, mon doux Bien, que Tu T'\u00e9tends sur la Croix.\"},{\"id\":\"PASSION24.HOUR.19.P028\",\"n\":28,\"t\":\"Tu regardes avec Amour et avec douceur tes bourreaux\\n- qui ont \u00e0 la main les clous et les marteaux pour Te clouer.\\nEt Tu leur fais une douce invitation pour r\u00e9clamer ta Crucifixion.\"},{\"id\":\"PASSION24.HOUR.19.P029\",\"n\":29,\"t\":\"Avec une f\u00e9rocit\u00e9 inhumaine, ils\\n- Te prennent la Main droite,\\n- fixent le clou sur la Paume, et\\n- enfoncent le clou \u00e0 coups de marteau dans ta sainte Main, et\\n- font sortir ce clou du c\u00f4t\u00e9 oppos\u00e9 de la Croix.\"},{\"id\":\"PASSION24.HOUR.19.P030\",\"n\":30,\"t\":\"Elle est si grande ta Douleur que Tu en trembles.\"},{\"id\":\"PASSION24.HOUR.19.P031\",\"n\":31,\"t\":\"La Lumi\u00e8re de tes beaux Yeux s'\u00e9clipse.\\nTon Visage infiniment saint p\u00e2lit et a l'air de celui d'un mort.\\nSainte Main droite de mon J\u00e9sus,\\n- je Te donne un baiser, je compatis avec Toi,\\n- je T'adore, et je Te remercie pour moi et pour tous.\"},{\"id\":\"PASSION24.HOUR.19.P032\",\"n\":32,\"t\":\"Je Te demande autant d'\u00e2mes que Tu re\u00e7ois de coups,\\n- pour que Tu les lib\u00e8res de la condamnation \u00e9ternelle.\\nJe te prie de laver dans ton Sang infiniment pr\u00e9cieux\\n- autant d'\u00e2mes que Tu verses de gouttes de Sang.\"},{\"id\":\"PASSION24.HOUR.19.P033\",\"n\":33,\"t\":\"\u00d4 mon J\u00e9sus, en raison de la douleur cruelle que Tu souffres, je Te prie d'ouvrir le Ciel \u00e0 tous et de b\u00e9nir toutes les cr\u00e9atures.\"},{\"id\":\"PASSION24.HOUR.19.P034\",\"n\":34,\"t
