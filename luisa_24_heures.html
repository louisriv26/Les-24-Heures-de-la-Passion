versations mauvaises,\\n- pour toutes les fois où j'ai contribué\\nà Te remplir d'amertume et à augmenter ta Soif.\"}, {\"id\": \"PASSION24.HOUR.22.P044\", \"n\": 44, \"t\": \"Je promets que chaque fois que me viendra la pensée d'entretenir des conversations qui pourraient T'offenser, je crierai immédiatement : « Jésus et Marie, je Vous recommande mon âme ! » Jésus, je donne un baiser à ton Cou infiniment saint, où je vois encore les marques des chaînes et des cordes qui T'ont tyrannisé.\"}, {\"id\": \"PASSION24.HOUR.22.P045\", \"n\": 45, \"t\": \"Je Te demande pardon pour nos nombreux attachements aux créatures, attachements qui ont augmenté les chaînes et les cordes autour de ton Cou infiniment sacré.\"}, {\"id\": \"PASSION24.HOUR.22.P046\", \"n\": 46, \"t\": \"Je Te promets que chaque fois que je me sentirai troublée par\\n- des attachements, des désirs et des affections qui ne sont pas pour Toi,\\nje crierai immédiatement :\\n« Jésus et Marie, je Vous recommande mon âme ! »\\nJésus, je donne un baiser à tes Épaules infiniment saintes.\"}, {\"id\": \"PASSION24.HOUR.22.P047\", \"n\": 47, \"t\": \"Je Te demande pardon pour\\n- les nombreuses satisfactions illicites,\\n- les nombreux péchés commis avec les cinq sens de mon corps.\"}, {\"id\": \"PASSION24.HOUR.22.P048\", \"n\": 48, \"t\": \"Je Te promets que chaque fois que me viendra la pensée de me procurer des plaisirs ou satisfactions qui ne soient pas pour ta Gloire, je crierai immédiatement : « Jésus et Marie, je Vous recommande mon âme ! » Jésus, je donne un baiser à ta Poitrine infiniment sainte.\"}, {\"id\": \"PASSION24.HOUR.22.P049\", \"n\": 49, \"t\": \"Je Te demande pardon pour les nombreuses\\n- froideurs, indifférences, tiédeurs et ingratitudes\\nque Tu reçois des créatures.\"}, {\"id\": \"PASSION24.HOUR.22.P050\", \"n\": 50, \"t\": \"Je Te promets que chaque fois que je sentirai se refroidir mon amour pour Toi, je crierai immédiatement : « Jésus et Marie, je Vous recommande mon âme ! » Jésus, je donne un baiser à tes Mains infiniment sacrées.\"}, {\"id\": \"PASSION24.HOUR.22.P051\", \"n\": 51, \"t\": \"Je Te demande pardon\\npour toutes nos œuvres mauvaises ou indifférentes,\\npour nos nombreuses actions guidées\\n- par l'amour propre, la vanité ou le respect humain.\"}, {\"id\": \"PASSION24.HOUR.22.P052\", \"n\": 52, \"t\": \"Je Te promets que chaque fois que me viendra la pensée de ne pas agir seulement par amour pour Toi, je crierai immédiatement : « Jésus et Marie, je Vous recommande mon âme ! » Jésus, je donne un baiser à tes Pieds infiniment saints.\"}, {\"id\": \"PASSION24.HOUR.22.P053\", \"n\": 53, \"t\": \"Je Te demande pardon pour\\n- les nombreux pas faits sans intention droite,\\n- les nombreuses rues fréquentées pour faire le mal.\\n- pour les nombreuses âmes qui s'éloignent de Toi\\npour aller à la recherche des plaisirs terrestres.\"}, {\"id\": \"PASSION24.HOUR.22.P054\", \"n\": 54, \"t\": \"Je Te promets que chaque fois où me viendra la pensée de m'éloigner de Toi, je crierai immédiatement : « Jésus et Marie, je Vous recommande mon âme ! »\"}, {\"id\": \"PASSION24.HOUR.22.P055\", \"n\": 55, \"t\": \"Jésus, je donne un baiser à ton Cœur infiniment sacré. Je veux m'enfermer en lui et y enfermer toutes les âmes rachetées par Toi, pour que toutes soient sauvées, sans aucune exception. Jésus, enferme-moi dans ton Cœur et fermes-en les portes, de sorte que je ne puisse voir que Toi.\"}, {\"id\": \"PASSION24.HOUR.22.P056\", \"n\": 56, \"t\": \"Je Te promets que chaque fois que me viendra la pensée de vouloir sortir de ce Cœur, je crierai immédiatement : « Jésus et Marie, à je Vous je donne mon cœur et mon âme ! »\"}], \"reflections\": [{\"id\": \"PASSION24.HOUR.22.REF.P001\", \"t\": \"Jésus brûle de Soif. Et nous, brûlons-nous d'amour pour Lui ?\\nNos pensées et nos affections ont-elles toujours pour but\\nd'étancher sa Soif ardente ?\\nJésus assoiffé, ne pouvant supporter la Soif qui le brûle, dit :\\n« Tout est consommé ! »\\nJésus s'est sacrifié tout entier pour nous.\\nEt nous, en toute chose, nous efforçons-nous d'être continuellement consumés\\nd'amour pour Lui ?\\nToutes les Actions, Paroles et Pensées de Jésus\\nle portaient vers le sacrifice total de Lui-même.\\nEt nous, chacune de nos actions, paroles et pensées\\nnous poussent-elles à nous consumer d'amour pour Lui ?\\nJésus, ma douce Vie,\\n- que ton Haleine moribonde pénètre dans mon pauvre cœur\\n- pour que je puisse recevoir l'empreinte de ton Sacrifice total.\\nSur la Croix, Jésus accomplit en toute chose la Volonté du Père\\net Il expire dans un Acte de parfait abandon à cette Volonté infiniment sainte.\"}, {\"id\": \"PASSION24.HOUR.22.REF.P002\", \"t\": \"Et nous, accomplissons-nous en toute chose la Volonté de Dieu ?\\nNous abandonnons-nous parfaitement à son Vouloir\\n- sans nous demander s'il nous en vient du bien ou du mal,\\n- contents de seulement nous trouver abandonnés dans ses Bras\\ninfiniment saints ?\"}, {\"id\": \"PASSION24.HOUR.22.REF.P003\", \"t\": \"Sommes-nous toujours disposés à mourir à nous-mêmes par amour pour Jésus ? Pouvons-nous dire que bien que nous vivions, nous ne vivons pas par nous-mêmes, c'est-à-dire que nous sommes morts à tout pour ne vivre que de la Vie de Jésus ?\"}, {\"id\": \"PASSION24.HOUR.22.REF.P004\", \"t\": \"Est-ce que tout ce que nous faisons, pensons, désirons, aimons, attire en nous la Vie de Jésus pour que meurent en Lui nos paroles, nos pas, nos désirs, nos pensées ?\"}, {\"id\": \"PASSION24.HOUR.22.REF.P005\", \"t\": \"Mon Jésus, que ma vie soit une mort continuelle par amour pour Toi, et que toute mort que je subis soit une Vie que je donne à toutes les âmes.\"}], \"subsections\": []}, {\"hour_id\": \"PASSION24.HOUR.23\", \"hour_number\": 23, \"display_time\": \"15h à 16h\", \"title\": \"Jésus transpercé par la lance – Sa déposition\", \"short_title\": \"Jésus transpercé par la lance – Sa déposition\", \"source_pages\": [226, 227, 228, 229, 230], \"opening_prayer_ids\": [\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"], \"closing_prayer_ids\": [\"PASSION24.PRAYER.AFTER_EACH_HOUR\"], \"paragraphs\": [{\"id\": \"PASSION24.HOUR.23.P001\", \"n\": 1, \"t\": \"Mon Jésus, au moment où Tu as expiré, toute la nature a pleuré ta douloureuse Mort. Elle Te reconnaissait pour son Créateur.\"}, {\"id\": \"PASSION24.HOUR.23.P002\", \"n\": 2, \"t\": \"Les anges, par milliers, volent autour de la Croix et pleurent ta Mort.\\n- ils T'adorent, Toi notre vrai Dieu, et\\n- ils T'accompagnent aux limbes.\\nLà Tu combles de joie tant d'âmes qui, depuis des siècles,\\nT‘attendent ardemment.\\nMon Jésus mort,\\n- je ne sais pas comment me détacher de ta Croix, et\\n- je ne me rassasie pas de baiser tes Plaies infiniment saintes.\\nCelles-ci me disent avec éloquence combien Tu m'aimes.\"}, {\"id\": \"PASSION24.HOUR.23.P003\", \"n\": 3, \"t\": \"En voyant tes horribles déchirures, la profondeur de tes Plaies, si profondes qu'elles découvrent tes Os, je me sens mourir !\"}, {\"id\": \"PASSION24.HOUR.23.P004\", \"n\": 4, \"t\": \"Je voudrais tant pleurer sur ces Plaies que je les laverais de mes larmes.\\nJe voudrais tant T'aimer\\n- que je Te guérirais tout entier par mon amour et\\n- que je restituerais à ton Humanité méconnaissable sa Beauté originale.\\nJe voudrais m'ouvrir les veines\\npour remplir les Tiennes de mon sang et Te ramener à la vie.\\nMon Jésus, que ne peut pas faire l'Amour ? L'Amour est Vie !\\nMoi, au moyen de mon amour, je veux Te redonner la Vie.\\nSi mon amour ne suffit pas, donne-moi ton propre Amour.\\nAu moyen de cet Amour, je pourrai tout.\\nOui, je pourrai redonner Vie à ton Humanité infiniment sainte.\\nMon doux Jésus, même mort, Tu veux me témoigner ton Amour et me donner\\nun refuge dans ton Cœur sacré.\"}, {\"id\": \"PASSION24.HOUR.23.P005\", \"n\": 5, \"t\": \"Un soldat, poussé par une force suprême, pour s'assurer de ta mort, Te déchire le Cœur d'un coup lance et T'y ouvre une Plaie profonde.\"}, {\"id\": \"PASSION24.HOUR.23.P006\", \"n\": 6, \"t\": \"Toi, mon Amour, Tu verses des gouttes de Sang et d'Eau, les dernières que contient ton Cœur embrasé.\"}, {\"id\": \"PASSION24.HOUR.23.P007\", \"n\": 7, \"t\": \"Cette Plaie ouverte par l'Amour me dit tellement de choses ! Ta Bouche est muette, mais ton Cœur me parle.\"}, {\"id\": \"PASSION24.HOUR.23.P008\", \"n\": 8, \"t\": \"Il me dit : « Mon enfant, J’avais tout donné. Par ce coup de lance, J’ai voulu ouvrir dans mon Cœur un refuge pour toutes les âmes.\"}, {\"id\": \"PASSION24.HOUR.23.P009\", \"n\": 9, \"t\": \"Mon Cœur ouvert, criera continuellement à tous : « Si vous voulez être sauvés, venez à Moi !\"}, {\"id\": \"PASSION24.HOUR.23.P010\", \"n\": 10, \"t\": \"En Moi vous trouverez\\n- la sainteté,\\n- le soulagement dans les afflictions,\\n- la force dans la faiblesse,\\n- la paix dans les doutes,\\n- la compagnie dans la solitude.\\nÔ âmes qui M'aimez :\\nsi vous voulez M'aimer vraiment, demeurez toujours dans ce Cœur.\"}, {\"id\": \"PASSION24.HOUR.23.P011\", \"n\": 11, \"t\": \"C'est ici que vous trouverez\\n- l'Amour vrai pour aimer et\\n- des Flammes ardentes pour vous brûler et vous consumer d'Amour.\"}, {\"id\": \"PASSION24.HOUR.23.P012\", \"n\": 12, \"t\": \"Tout est concentré dans ce Cœur : c'est là que se trouvent\\n- les Sacrements,\\n- la Vie de mon Église, et\\n- la Vie de toutes les âmes.\"}, {\"id\": \"PASSION24.HOUR.23.P013\", \"n\": 13, \"t\": \"En lui, Je ressens aussi\\n- les profanations qui se font contre mon Église,\\n- les intrigues de ses ennemis,\\n- les flèches qu'ils lui décochent,\\n- mes enfants qu'ils piétinent.\\nCar il n'y a pas d'offense que mon Cœur ne ressente.\"}, {\"id\": \"PASSION24.HOUR.23.P014\", \"n\": 14, \"t\": \"Par conséquent, mon enfant, que ta vie soit en mon Cœur.\\n- défends-le, répare toutes les offenses contre lui,\\n- conduis-y tous les gens. »\\nJésus,\\npar Amour pour moi, Tu T'es laissé blesser le Cœur par une lance.\\nDe tes Mains, blesse mon cœur, mes affections, mes désirs et tout moi-même.\\nQu'il n'y ait rien en moi qui ne soit blessé par tes Mains amoureuses.\"}, {\"id\": \"PASSION24.HOUR.23.P015\", \"n\": 15, \"t\": \"Je m'unis aux peines navrantes de notre chère Maman. En voyant qu'on Te déchire le Cœur, elle défaille de douleur et d'Amour.\"}, {\"id\": \"PASSION24.HOUR.23.P016\", \"n\": 16, \"t\": \"Comme une colombe, elle vole en ton Cœur\\npour y occuper la première place, pour y être\\n- la première Réparatrice,\\n- la Reine,\\n- la Médiatrice entre Toi et les créatures.\\nAvec ma Maman, je veux moi aussi voler dans ton Cœur\\nafin de voir comment elle y répare les offenses des créatures.\"}, {\"id\": \"PASSION24.HOUR.23.P017\", \"n\": 17, \"t\": \"Jésus, Je trouverai la Vie dans ton Cœur blessé, si bien que, peu importe ce que je ferai, mes actions y trouveront Vie. Je ne donnerai plus de vie à mes pensées, mais si elles veulent la Vie, je prendrai tes Pensées.\"}, {\"id\": \"PASSION24.HOUR.23.P018\", \"n\": 18, \"t\": \"Ma volonté n'aura plus de vie, mais si elle veut la Vie, je prendrai ta Volonté. Mon amour n'aura plus de vie, mais s'il veut la Vie, je prendrai ton Amour.\"}, {\"id\": \"PASSION24.HOUR.23.P019\", \"n\": 19, \"t\": \"Jésus, toute ta Vie m'appartient : c'est ta Volonté.\"}, {\"id\": \"PASSION24.HOUR.23.P020\", \"n\": 20, \"t\": \"Jésus Tu es mort. Tes disciples se dépêchent de Te déposer de la Croix. Joseph et Nicodème étaient jusqu'à présent tes disciples en secret.\"}, {\"id\": \"PASSION24.HOUR.23.P021\", \"n\": 21, \"t\": \"Eh bien, maintenant, avec courage, sans craindre quoi que ce soit, ils veulent Te donner une sépulture honorable. Ils prennent des marteaux et des tenailles pour accomplir le Déclouement sacré et si triste. Ta Mère, affligée, étend ses bras maternels pour Te recevoir sur son Sein. Mon Jésus, ils Te déclouent Je veux aider tes disciples à soutenir ton Corps infiniment saint. Au moyen des clous qu'ils T'enlèvent, cloue-moi tout entière sur Toi. Avec ta sainte Mère, je veux T'adorer, T'embrasser, puis m'enfermer dans ton Cœur pour ne plus jamais en sortir.\"}], \"reflections\": [{\"id\": \"PASSION24.HOUR.23.REF.P001\", \"t\": \"Après sa Mort, Jésus a voulu, par Amour pour nous, être blessé par une lance. Et nous, nous laissons-nous blesser en toutes choses par Jésus ? Ou bien nous laissons-nous blesser par les créatures, par les plaisirs, par l’attachement à nous-mêmes ? Les froideurs, les obscurités, les mortifications internes et externes sont des blessures que le Seigneur présente à notre âme.\"}, {\"id\": \"PASSION24.HOUR.23.REF.P002\", \"t\": \"Si nous ne les recevons pas des Mains de Dieu,\\n- nous nous blessons nous-mêmes,\\n- nos blessures activent nos passions, nos faiblesses, notre amour-propre et\\ntous nos maux.\\nSi, au contraire, nous les recevons comme des blessures aménagées en nous\\npar Jésus, il y mettra son Amour, ses Vertus et sa Ressemblance.\\nCeci nous fera mériter ses Baisers, ses Caresses et tous les stratagèmes de\\nl’Amour divin.\"}, {\"id\": \"PASSION24.HOUR.23.REF.P003\", \"t\": \"Ces blessures seront des voix qui L’appelleront et Le contraindront à demeurer avec nous continuellement. Mon Jésus, que ta Lance soit le garde qui me défende de toute blessure provenant des créatures.\"}, {\"id\": \"PASSION24.HOUR.23.REF.P004\", \"t\": \"En quittant la Croix, Jésus est déposé dans les Bras de sa Maman. Et nous, déposons-nous dans les Mains de notre Maman nos doutes, nos anxiétés, nos craintes ?\"}, {\"id\": \"PASSION24.HOUR.23.REF.P005\", \"t\": \"Jésus reposa sur le Sein de sa sainte Mère. Et nous, faisons-nous reposer Jésus en nous en faisant disparaître nos craintes et nos agitations ? Ma Maman, de tes Mains maternelles enlève de mon cœur tout ce qui pourrait empêcher Jésus de reposer en moi.\"}], \"subsections\": []}, {\"hour_id\": \"PASSION24.HOUR.24\", \"hour_number\": 24, \"display_time\": \"16h à 17h\", \"title\": \"La sépulture de Jésus – La Désolation de la Vierge Marie\", \"short_title\": \"La sépulture de Jésus – La Désolation de la Vierge Marie\", \"source_pages\": [231, 232, 233, 234, 235, 236, 237, 238, 239, 240, 241, 242, 243, 244], \"opening_prayer_ids\": [\"PASSION24.PRAYER.BEFORE_EACH_HOUR\"], \"closing_prayer_ids\": [\"PASSION24.PRAYER.AFTER_EACH_HOUR\"], \"paragraphs\": [{\"id\": \"PASSION24.HOUR.24.P001\", \"n\": 1, \"t\": \"24e Heure — 16h à 17h\"}, {\"id\": \"PASSION24.HOUR.24.P002\", \"n\": 2, \"t\": \"La sépulture de Jésus – La Désolation de la Vierge Marie\"}, {\"id\": \"PASSION24.HOUR.24.P003\", \"n\": 3, \"t\": \"La sépulture de Jésus\"}, {\"id\": \"PASSION24.HOUR.24.P004\", \"n\": 4, \"t\": \"Mon Jésus, dégagé de la Croix,\\nta Mère affligée fut la première à Te recevoir sur son Sein.\\nTa Tête transpercée reposa doucement dans ses Bras.\\nDouce Maman,\\n- ne dédaigne pas de m'avoir en ta compagnie et\\n- fais qu'avec toi je puisse accomplir mes derniers devoirs\\nenvers mon bien-aimé Jésus.\"}, {\"id\": \"PASSION24.HOUR.24.P005\", \"n\": 5, \"t\": \"Ma Mère pleine de douceur, Tu me surpasses dans l'amour et dans la délicatesse pour toucher à mon Jésus. Mais moi, je m'efforcerai de t'imiter de mon mieux pour Lui plaire en tout.\"}, {\"id\": \"PASSION24.HOUR.24.P006\", \"n\": 6, \"t\": \"Par conséquent, comme tu le fais si délicatement de tes Mains, je veux moi aussi, de mes mains, extraire toutes les épines qui entourent sa Tête adorée, et je veux unir mes profondes adorations aux tiennes.\"}, {\"id\": \"PASSION24.HOUR.24.P007\", \"n\": 7, \"t\": \"Ô céleste Maman, tes Mains enlèvent le Sang coagulé des Yeux de Jésus.\\nCes Yeux\\n- un jour, donnaient la Lumière à tout le monde et\\n- maintenant, sont obscurcis et éteints.\"}, {\"id\": \"PASSION24.HOUR.24.P008\", \"n\": 8, \"t\": \"Maman, je m'unis à toi\\nDonnons ensemble à ces Yeux divins un baiser et adorons-les profondément !\\nJe vois les Oreilles de mon Jésus\\n- trempées de Sang, écrasées par les gifles, lacérées par les épines.\"}, {\"id\": \"PASSION24.HOUR.24.P009\", \"n\": 9, \"t\": \"Donnons, ô Mère, nos adorations à ces Oreilles\\n- qui n'entendent plus et\\n- qui ont tant souffert, pour éveiller les âmes sourdes et obstinées\\naux appels de la Grâce.\\nÔ douce Maman,\\nTon visage est baigné de larmes en voyant le Visage de Jésus, l'Affligé.\\nJ'unis ma douleur à la Tienne.\\nEnsemble, enlevons-Lui la boue et les crachats qui L'ont à ce point déformé.\\nAdorons ce Visage de divine Majesté\\n- qui faisait s'éprendre le Ciel et la terre, et\\n- qui, maintenant, ne donne plus signe de Vie !\\nÔ douce Maman,\\ndonnons ensemble un baiser à la divine Bouche de Jésus qui\\n- par la suavité de sa Parole a attiré tant d'âmes à son Cœur !\\nÔ Mère, c'est avec ta propre Bouche que je veux baiser ses Lèvres livides et\\nensanglantées. Je les adore profondément.\\nÔ ma douce Maman,\\navec toi je veux donner des baisers\\nà l'adorable Corps de mon Jésus, réduit tout entier en une effroyable Plaie.\\nComme toi, j'utilise mes mains\\npour remettre en place les morceaux de Chair qui pendent de son Corps.\\nAdorons profondément ce Corps infiniment saint.\\nÔ Mère, donnons des baisers à,\\n- ces Mains créatrices, qui ont fait tant de Prodiges pour nous,\\n- ces Mains transpercées, contorsionnées,\\nmaintenant froides et raidies par la mort !\"}, {\"id\": \"PASSION24.HOUR.24.P010\", \"n\": 10, \"t\": \"Ô douce Maman, renfermons en leurs Blessures infiniment saintes le sort de toutes les âmes. À sa Résurrection, Jésus les trouvera placées là par toi, et aucune ne sera perdue.\"}, {\"id\": \"PASSION24.HOUR.24.P011\", \"n\": 11, \"t\": \"Ô Mère, au nom de tous et avec tous adorons ensemble ces précieuses Blessures. Ô céleste Maman, te voilà en train de donner des baisers aux Pieds de Jésus. Les Blessures de ces Pieds divins sont navrantes ! Les clous ont enlevé une partie de la Chair et de la Peau. Le poids du Corps infiniment sacré les a déchirés de manière horrible !\"}, {\"id\": \"PASSION24.HOUR.24.P012\", \"n\": 12, \"t\": \"Donnons ensemble un baiser à ces Blessures et adorons-les profondément.\\nEn elles, renfermons tous les pas des pécheurs afin que,\\n- quand ils marchent, ils entendent les Pas de Jésus derrière eux, et\\n- qu'ainsi ils n'osent pas L'offenser.\\nJe Te vois, ô douce Maman, fixer du regard\\nle Cœur ouvert de l'adorable Jésus.\\nDe grâce, ensevelis-moi en ce Cœur sacré.\\nEt comme je posséderai ainsi le Cœur et la Vie de mon Bien-Aimé,\\nj'y resterai cachée jusqu'à l'éternité.\"}, {\"id\": \"PASSION24.HOUR.24.P013\", \"n\": 13, \"t\": \"Donne-moi ton Amour, ô Maman, pour que je puisse aimer Jésus comme toi.\\nDonne-moi ta Douleur pour que, comme toi,\\n- je puisse souffrir et plaider pour tous, et\\n- réparer toutes les offenses faites à ce Cœur !\\nÔ Maman,\\ntoi qui prépares Jésus pour l'ensevelissement,\\nc’est de tes propres Mains que je veux être ensevelie avec Lui,\\nafin que je puisse ressusciter avec Lui. Ainsi soit-il.\\nEt maintenant, c'est à toi aussi, ô Mère amoureuse,\\nque je veux donner mon tribut filial.\\nJe compatis beaucoup avec toi.\"}, {\"id\": \"PASSION24.HOUR.24.P014\", \"n\": 14, \"t\": \"Au moyen de toutes les effusions d'amour de mon cœur,\\nje voudrais\\n- réunir tous les battements de cœur, tous les désirs, toute la vie des créatures\\n- les déposer devant toi comme autant d'actes d'amour.\"}, {\"id\": \"PASSION24.HOUR.24.P015\", \"n\": 15, \"t\": \"Je compatis avec toi pour l'extrême douleur que tu as soufferte en voyant Jésus couronné d'épines, torturé par les coups et les clous.\"}, {\"id\": \"PASSION24.HOUR.24.P016\", \"n\": 16, \"t\": \"Aussi en voyant\\n- ces Yeux qui ne Te regardent plus,\\n- ces Oreilles qui n'entendent plus ta voix,\\n- cette Bouche qui ne Te parle plus,\"}, {\"id\": \"PASSION24.HOUR.24.P017\", \"n\": 17, \"t\": \"- ces Mains qui ne Te caressent plus,\\n- ces Pieds qui ne Te suivront plus.\\nJe voudrais t'offrir le Cœur de ce même Jésus débordant d'Amour,\\n- pour compatir avec toi comme tu le mérites et\\n- pour donner un soulagement à tes Douleurs si cruelles.\"}], \"reflections\": [{\"id\": \"PASSION24.HOUR.24.REF.P001\", \"t\": \"Jésus est enseveli. Une pierre ferme le tombeau. Elle empêche la Maman de continuer à regarder et admirer son Fils.\"}, {\"id\": \"PASSION24.HOUR.24.REF.P002\", \"t\": \"Et nous, savons-nous nous dissimuler aux regards des créatures ?\\nSommes-nous indifférents à ce que tous nous oublient ?\\nDans les choses saintes,\\n- sommes-nous dans une sainte indifférence,\\n- ne nous opposant à rien de ce que Dieu attend de nous ?\"}, {\"id\": \"PASSION24.HOUR.24.REF.P003\", \"t\": \"Notre regard est-il enseveli dans le Regard de Jésus,\\nde sorte que nous ne regardions rien, sauf Jésus et ce qui émane de Lui ?\\nNotre voix est-elle ensevelie dans la Voix de Jésus,\\nde sorte que si nous parlons, nous ne parlions qu'avec la Langue de Jésus ?\\nNos pas sont-ils ensevelis dans ceux de Jésus,\\nde sorte que quand nous marchons, la seule empreinte que nous laissions\\n- soit celle des Pas de Jésus ?\\nEt notre cœur est-il enseveli dans celui de Jésus,\\nde sorte que nous n'aimions et ne désirions que\\n- ce qu'aime et désire son Cœur ?\\nMaman, quand, Jésus se dissimule à moi, pour le bien de mon âme,\\ndonne-moi la Grâce que tu avais quand tu étais privée de sa Présence,\\nafin que je puisse Lui donner toute la gloire\\nque tu Lui as donnée quand on L'a déposé dans le sépulcre.\\nJésus, je veux Te prier avec ta propre Voix.\\nEt comme ta Voix pénétrait les Cieux et se répercutait dans la voix de tous, en\\nparticulier dans la mienne, que ma voix pénètre jusqu'aux Cieux pour Te\\ndonner la gloire de ta propre Voix.\\nJésus, mon cœur palpite.\\nMais je ne serai pas contente si Tu ne le fais pas palpiter avec le Tien.\"}, {\"id\": \"PASSION24.HOUR.24.REF.P004\", \"t\": \"Avec tes Battements de Cœur, j'aimerai comme Toi Tu aimes.\"}, {\"id\": \"PASSION24.HOUR.24.REF.P005\", \"t\": \"Je Te donnerai l'amour de toutes les créatures. Nous n'entendrons qu'un cri : « Amour, Amour ! »\"}, {\"id\": \"PASSION24.HOUR.24.REF.P006\", \"t\": \"Mon Jésus, fais-toi honneur :\\nen tout ce que je fais, mets-y l'empreinte\\n- de ton Pouvoir,\\n- de ton Amour et\\n- de ta Gloire.\"}], \"subsections\": [{\"title\": \"La Désolation de la Vierge Marie\", \"paragraphs\": [{\"id\": \"PASSION24.HOUR.24.DESOL.P002\", \"n\": 2, \"t\": \"« Elles me coûtent trop, les âmes, elles me coûtent la Vie d'un Fils Dieu. Et moi, comme Corédemptrice et Mère, je les lie à toi, ô Croix. »\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P003\", \"n\": 3, \"t\": \"Maman souffrante, voilà que tu te disposes au sacrifice ultime de devoir donner la sépulture à ton Fils Jésus.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P004\", \"n\": 4, \"t\": \"Complètement résignée aux Vouloirs du Ciel, tu t'affaires près de Lui. De tes propres Mains, tu Le déposes dans le Sépulcre.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P005\", \"n\": 5, \"t\": \"Et tandis\\n- que tu arranges ses Membres et\\n- que tu es sur le point de Lui faire ton dernier adieu et de Lui donner ton\\ndernier Baiser, tu sens ton Cœur s'arracher de ta Poitrine !\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P006\", \"n\": 6, \"t\": \"L'Amour te cloue sur ses Membres. Par la force de l'Amour et de la Douleur, tu te sens t'éteindre avec ton Fils éteint ! Pauvre Maman ! Comment feras-tu sans Jésus qui était ta Vie, ton Tout ? Et pourtant, le Vouloir de l'Éternel le veut ainsi.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P007\", \"n\": 7, \"t\": \"Tu es aux prises avec deux Puissances insurmontables :\\nton Amour pour Jésus et le Vouloir divin.\\n- Ton Amour te cloue de telle sorte qu'il empêche la séparation,\\n- et le Vouloir divin s'impose et veut ce sacrifice.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P008\", \"n\": 8, \"t\": \"Pauvre Maman, comment feras-tu ? Comme je compatis avec toi !\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P009\", \"n\": 9, \"t\": \"De grâce, anges du Ciel, venez la soutenir auprès des Membres raidis de son\\nJésus. Autrement elle mourra elle aussi !\\nMais, ô prodige,\\n- tandis que tu sembles éteinte avec Jésus,\\n- j'entends ta Voix tremblante et entrecoupée de sanglots qui dit :\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P010\", \"n\": 10, \"t\": \"« Fils, ô Bien-Aimé Fils,\\nc'est le dernier soulagement qu'il me reste pour adoucir mes peines :\\n- m'épancher sur les Plaies de ton Humanité infiniment sainte,\\n- les adorer,\\n- les baiser.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P011\", \"n\": 11, \"t\": \"Et maintenant, cela aussi, on me l'enlève. Le Vouloir divin le veut ainsi. Et moi, je me résigne.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P012\", \"n\": 12, \"t\": \"Mais sache, ô Fils,\\n- que même si c'est ce que je veux,\\n- j'en suis incapable.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P013\", \"n\": 13, \"t\": \"À la seule pensée de le faire, les forces me manquent et la vie me fuit.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P014\", \"n\": 14, \"t\": \"De grâce, ô Fils,\\npour que je puisse avoir la force d'effectuer l'amère séparation,\\npermets-moi\\n- de me laisser toute ensevelie en Toi et\\n- de prendre ta Vie en moi, tes Peines, tes Réparations,\\net tout ce que Tu es.\\nAh ! seul un échange de Vies entre Toi et moi peut me donner la force\\nd'accomplir le sacrifice de me séparer de Toi ! »\\nMaman affligée,\\ntu penches ta tête sur celle de Jésus,\\ntu Lui donnes des baisers, et\\ntu enfermes tes pensées dans les Siennes.\\nOh ! comme tu voudrais ranimer son Intelligence avec la tienne,\\npour ainsi lui donner vie pour Vie !\\nMaman affligée,\\nje te vois donner des baisers aux Yeux éteints de Jésus.\\nOh ! comme tu souffres de constater que Jésus ne te regarde plus !\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P015\", \"n\": 15, \"t\": \"Combien de fois, en te regardant, ces Yeux divins te transportaient de joie et faisaient ressusciter ton Cœur ! Maintenant qu'Il ne te regarde plus, tu te sens mourir.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P016\", \"n\": 16, \"t\": \"Tu échanges tes yeux avec ceux de Jésus.\\nTu prends pour toi\\n- ses Larmes,\\n- l'amertume que Lui procuraient les offenses des créatures,\\n- leurs insultes et\\n- leurs mépris.\\nMaman affligée,\\nje te vois donner des baisers à ses Oreilles infiniment saintes.\\nTu l'appelles et lui dis :\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P017\", \"n\": 17, \"t\": \"« Mon Fils, est-il possible que Tu ne m'écoutes plus, Toi qui à chacun de mes appels joyeux, accourrais ? Maintenant, je pleure, je T'appelle, et Tu ne m'entends pas ? Ah ! l'Amour fortement ressenti est un cruel tyran. Toi, Tu étais pour moi plus que ma propre vie. Et maintenant, comment pourrais-je désormais survivre à tant de douleurs ?\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P018\", \"n\": 18, \"t\": \"Ô Fils, je laisse mon ouïe dans la Tienne et je prends pour moi ce qu'ont souffert tes Oreilles infiniment saintes. Seules tes Peines et tes Douleurs peuvent me redonner Vie. »\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P019\", \"n\": 19, \"t\": \"Et pendant que tu dis cela,\\n- la douleur et les serrements que tu ressens au Cœur sont si grands\\n- que tu en perds la voix et restes sans mouvement.\\nMa pauvre Maman, ma pauvre Maman, comme je compatis avec toi !\\nCombien de morts cruelles ne subis-tu pas !\\nMaman souffrante,\\nle Vouloir divin\\n- s'impose et te met en action.\\nAinsi\\n- tu regardes le Visage infiniment saint de ton Jésus,\\n- tu Lui donnes des baisers et t'exclames :\\n« Fils adoré, comme Tu es défiguré !\\nAh ! si l'Amour ne m'indiquait pas que Tu es mon Fils, ma Vie et mon\\nTout, je ne Te reconnaîtrais pas.\\n- Ta Beauté originale s'est transformée en difformités.\\n- le teint rose de tes Joues pourprées s'est changé en bleus.\\n- la Lumière et la Grâce que transmettait ton beau Visage,\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P020\", \"n\": 20, \"t\": \"qui comblait de joie ceux qui l'admiraient, se sont changées en pâleur de\\nmort !\\n« Ah ! Fils bien-aimé,\\nà quel piteux état as-Tu été réduit !\\nQuel horrible ravage a fait le péché sur tes Membres infiniment saints !\\nOh ! comme ton inséparable Maman voudrait Te restituer ta Beauté\\npremière !\\nJe veux échanger mon visage avec le Tien et prendre pour moi\\n- les gifles, les crachats, les mépris et\\n- tout ce que Tu as souffert dans ton saint Visage.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P021\", \"n\": 21, \"t\": \"Ah ! Fils, si Tu me veux en vie, donne-moi tes Peines,\\nautrement je mourrai ! »\\nTa douleur est telle, ô Maman, qu'elle\\n- Te paralyse,\\n- Te coupe la parole, et que\\n- tu es comme éteinte auprès du Visage de ton Jésus.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P022\", \"n\": 22, \"t\": \"Pauvre Maman, comme je compatis avec toi ! Mes saints anges, venez soutenir ma Maman. Sa douleur immense l'inonde, la suffoque, et il ne lui reste ni vie ni force.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P023\", \"n\": 23, \"t\": \"Mais, déchirant ces vagues de souffrances, le Vouloir divin te remet en Vie.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P024\", \"n\": 24, \"t\": \"Tu donnes des baisers sur la Bouche de Jésus. Ce faisant, tu sens tes lèvres devenir amères à cause du fiel qui a rempli sa Bouche d'amertume.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P025\", \"n\": 25, \"t\": \"En sanglotant tu Lui dis :\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P026\", \"n\": 26, \"t\": \"« Mon Fils, dis une dernière Parole à ta Maman.\\nEst-il possible que je ne puisse plus entendre ta Voix ?\\nToutes les Paroles que Tu m'as dites quand Tu étais en vie, eh bien,\\ncomme autant de flèches, me blessent le Cœur de Douleur et d'Amour.\\n« Maintenant que je Te vois muet,\\ntes flèches\\n- se meuvent dans mon Cœur,\\n- me donnent de continuelles morts et\\n- me disent :\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P027\", \"n\": 27, \"t\": \"« Tu ne L'entendras plus ! Tu n'entendras plus son doux Accent, la mélodie de sa Parole créatrice,\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P028\", \"n\": 28, \"t\": \"qui créait en toi autant de paradis qu'Il prononçait de Paroles ! »\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P029\", \"n\": 29, \"t\": \"Ah ! mon paradis est fini. Je n'aurai plus rien d'autre que de l'amertume ! Ah ! Fils, je veux échanger ma langue avec la Tienne.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P030\", \"n\": 30, \"t\": \"Fais-moi ressentir\\n- ce que Tu as souffert dans ta Bouche infiniment sainte,\\n- l'amertume du fiel et ta Soif ardente.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P031\", \"n\": 31, \"t\": \"Fais-moi aussi ressentir tes Réparations et tes Prières.\\nComme, au moyen de ta Langue, j'entendrai ta Voix,\\n- ma douleur sera plus supportable.\\nTa Mère souffrante pourra vivre par le moyen de tes Peines ! »\\nMaman torturée, je vois que tu Te hâtes,\\ncar ceux qui sont autour de toi veulent fermer le sépulcre.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P032\", \"n\": 32, \"t\": \"Alors\\n- tu prends les Mains de Jésus dans les tiennes,\\n- tu les baises,\\n- tu les serres sur ton Cœur, et\\n- tu fais tiennes leurs blessures.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P033\", \"n\": 33, \"t\": \"Puis,\\n- fixant du regard ses Pieds et\\n- voyant la torture cruelle que les clous leurs ont donnée,\\ntu fais tienne ces Plaies et ces Pieds mêmes,\\n- pour courir au moyen d'eux après tous les pécheurs et\\n- pour les arracher à l'enfer.\\nMaman angoissée,\\nje vois que tu adresses ton dernier adieu au Cœur transpercé de Jésus.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P034\", \"n\": 34, \"t\": \"Ici ton Cœur maternel subit le dernier assaut. Tu le sens s'arracher de ta poitrine par la véhémence de ton amour et de ta douleur.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P035\", \"n\": 35, \"t\": \"Il sent le besoin de faire sien\\n- le Cœur infiniment saint de Jésus,\\n- son Amour rejeté par tant de créatures,\\n- ses Douleurs,\\n- ses Blessures,\\n- ses nombreux Désirs ardents non réalisés\\nà cause des ingratitudes des créatures.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P036\", \"n\": 36, \"t\": \"Tu regardes avec étonnement la grande Blessure de ce Cœur. Tu Lui donnes des baisers. Tu en touches le Sang.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P037\", \"n\": 37, \"t\": \"Comme si tu en avais acquis la Vie, tu ressens la force de réaliser l'amère séparation. Et après avoir embrassé ton Jésus, tu permets qu'on ferme le sépulcre ! Maman souffrante, je te prie, en pleurant, de ne pas permettre pour le moment que Jésus soit soustrait à mes regards. Attends que d'abord je m'enferme en Lui pour prendre sa Vie en moi.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P038\", \"n\": 38, \"t\": \"Si tu ne peux pas vivre sans Jésus, toi qui es\\n- l'Immaculée,\\n- la Sainte,\\n- la Comblée de Grâces,\\nmoi, je le peux encore bien moins,\\nmoi qui suis la faiblesse, la misère, un abîme de péchés.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P039\", \"n\": 39, \"t\": \"De grâce, Maman souffrante,\\nne me laisse pas seule.\\n- Prends-moi avec toi.\\n- Mais dépose-moi d'abord tout entière en Jésus.\\n- Et vide-moi complètement, afin que\\nje puisse mettre Jésus tout entier en moi, comme tu L'as mis en toi.\\nCommence chez moi l'office maternel que Jésus t'a donné sur la Croix.\\nQue mon extrême pauvreté fasse impression sur ton Cœur maternel.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P040\", \"n\": 40, \"t\": \"De tes mains maternelles,\\n- enferme-moi tout entière en Jésus, et\\n- enferme Jésus tout entier en moi.\\n- enferme dans mon intelligence les Pensées de Jésus,\\nafin que nulle autre pensée n'entre en moi.\\n- enferme les Yeux de Jésus dans les miens,\\nafin que rien ne puisse jamais échapper à mon regard ;\\n- enferme son Ouïe dans la mienne, pour que je l'écoute toujours et\\nqu'en toutes choses j'accomplisse son Vouloir infiniment saint.\\n- enferme son Visage dans le mien, afin que, admirant ce Visage si défiguré\\npar Amour pour moi, je l'aime, je compatisse avec Lui et Le répare.\\n- enferme sa Langue dans la mienne, pour que je parle, prie, et enseigne\\nau moyen de la Langue de Jésus ;\\n- enferme ses Mains dans les miennes, afin que\\ntout mouvement que je ferai et\\ntoute œuvre que j'accomplirai\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P041\", \"n\": 41, \"t\": \"prennent Vie des Œuvres et des Mouvements de Jésus ;\\n- enferme ses Pieds dans les miens, afin que tout pas que je ferai\\napporte la Vie, le Salut et la Force aux créatures.\\nMaman affligée,\\nque moi aussi je donne des baisers à son Cœur,\\nque j'en touche le Sang infiniment précieux.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P042\", \"n\": 42, \"t\": \"Enfermant son Cœur dans le mien, fais en sorte que je puisse vivre\\n- de son Amour,\\n- de ses Désirs et\\n- de ses Peines.\\nEt maintenant, prenant la Main droite raidie de Jésus,\\n- donne-moi par elle ta bénédiction,\\n- puis permets qu'on l'enferme de nouveau dans le tombeau.\\nLa pierre ferme maintenant le sépulcre.\\nToi, torturée, tu la baises et, en pleurant, tu essaies de partir.\\nMais ta douleur est si grande que tu restes pétrifiée !\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P043\", \"n\": 43, \"t\": \"Ma Mère torturée et affligée, avec toi je fais mes adieux à Jésus. En pleurant, je compatis avec toi et je te tiens compagnie en ton amère désolation.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P044\", \"n\": 44, \"t\": \"Je veux me mettre à tes côtés\\npour donner à chacune de tes respirations et de tes douleurs\\n- une parole de réconfort,\\n- un regard de compassion.\\nJe recueillerai tes larmes.\\nSi je te vois t'évanouir, je te soutiendrai de mes bras.\\nAvec un effort surhumain,\\n- tu te détaches du sépulcre et\\n- tu entreprends de retourner à Jérusalem\\npar le même chemin que tu as suivi pour venir.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P045\", \"n\": 45, \"t\": \"Tu as fait à peine quelques pas et la Croix se présente à toi, la Croix sur laquelle Jésus a tant souffert et est mort.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P046\", \"n\": 46, \"t\": \"Tu cours et tu l'embrasses. Tu vois la Croix teintée de Sang. Alors, les Douleurs que Jésus a souffertes sur elle se renouvellent une à une dans ton Cœur. Tu ne peux plus contenir tant d'angoisse.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P047\", \"n\": 47, \"t\": \"Tu t'exclames désolée : « Ô Croix, pourquoi as-tu été si cruelle envers mon Fils ? Oh ! tu ne L'as épargné en rien ! Tu as été inflexible !\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P048\", \"n\": 48, \"t\": \"Tu ne m'as pas permis, à moi, sa Mère souffrante,\\n- de Lui donner ne serait-ce qu'une gorgée d'eau quand Il la demandait,\\nalors qu'à sa Bouche desséchée on donna du fiel et du vinaigre !\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P049\", \"n\": 49, \"t\": \"Ah ! je sentais fondre mon Cœur transpercé et j'aurais voulu apprêter pour ses Lèvres mon Cœur liquéfié pour Le désaltérer ! Ô Croix à la fois cruelle et sainte, Tu as été sanctifiée et divinisée au contact de mon Fils ! Cette cruauté dont tu as fait usage envers Lui, change-la en compassion pour les misérables mortels.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P050\", \"n\": 50, \"t\": \"En raison des Peines qu'Il a souffertes sur toi, obtiens par ses Prières et ses Souffrances la force pour les âmes souffrantes. Qu'aucune d'entre elles ne se perde à cause des tribulations et des croix.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P051\", \"n\": 51, \"t\": \"Elles me coûtent trop, les âmes, elles me coûtent la Vie d'un Fils Dieu. Et moi, comme Corédemptrice et Mère, je les lie à toi, ô Croix. Et c'est en te donnant des baisers que je pars. »\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P052\", \"n\": 52, \"t\": \"Pauvre Maman, comme je compatis avec toi ! À chaque pas, tu souffres de nouvelles douleurs qui, rendant plus amers les flots qui t'inondent, te noient. Tu te sens mourir !\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P053\", \"n\": 53, \"t\": \"Et tu parviens à cet endroit où tu rencontras Jésus sous le poids énorme de la Croix, exténué, ruisselant de Sang, avec un faisceau d'épines sur la Tête, lesquelles, heurtant la Croix, pénétraient en dedans, Lui donnant des douleurs extrêmes.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P054\", \"n\": 54, \"t\": \"Alors, rencontrant les tiens, les Regards de Jésus cherchaient de la pitié.\\nMais, pour Vous priver tous les deux de tout soulagement,\\nles soldats\\n- bousculèrent Jésus,\\n- Le firent tomber, Lui faisant verser du Sang nouveau.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P055\", \"n\": 55, \"t\": \"Tu vois le terrain encore imprégné de son Sang Tu te prosternes à terre et tu baises ce Sang et je t'entends dire :\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P056\", \"n\": 56, \"t\": \"« Mes anges, venez vous mettre de garde auprès de ce Sang, afin que pas une goutte ne soit foulée aux pieds et profanée. »\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P057\", \"n\": 57, \"t\": \"Maman souffrante, laisse-moi te donner la main pour t'aider à te relever,\\ncar je te vois agoniser sur le Sang de ton Fils.\\nPendant que tu marches,\\n- partout tu trouves des traces du Sang de Jésus et\\n- tu te souviens de ses Douleurs.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P058\", \"n\": 58, \"t\": \"Finalement, hâtant le pas, tu t'enfermes au Cénacle.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P059\", \"n\": 59, \"t\": \"Moi aussi je m'enferme au Cénacle. Mais mon Cénacle est le Cœur infiniment saint de Jésus. Et de l'intérieur de son Cœur, je veux venir sur tes Genoux en cette heure de désolation si amère. Mon âme ne supporte pas de Te laisser seule dans une si grande douleur !\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P060\", \"n\": 60, \"t\": \"Maman désolée,\\nregarde, moi aussi je suis ton enfant et seule je ne peux, ni ne veux vivre.\\nPrends-moi sur tes genoux et presse-moi dans tes bras maternels.\\nSers-moi de Maman, j'ai besoin d'un guide, d'aide, de soutien.\\nRegarde ma pauvreté.\\nSur mes plaies, verse une de tes larmes, et quand tu me verras distraite, serre-moi sur ton Cœur maternel et rafraîchis en moi la Vie de Jésus.\\nMère désolée, comme je compatis avec toi !\\nTes Douleurs sont effroyables !\\nJe voudrais changer mon être en langue et en voix\\n- pour te dire ma compassion.\\nMais, pour tes nombreuses Douleurs, mes commisérations sont un néant.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P061\", \"n\": 61, \"t\": \"Par conséquent, j'appelle les anges et j'invoque la Très Sainte Trinité.\\nJe les implore de mettre autour de toi\\n- leurs harmonies, leurs joies, leur beauté,\\npour calmer tes Douleurs intenses et compatir avec toi.\\nQue les trois Personnes Te prennent dans leurs Bras divins et\\nchangent en Amour toutes tes Peines.\\nEt maintenant, ô Mère désolée, en raison de tout ce que tu as souffert,\\nje Te demande une grâce toute spéciale.\\nJe Te prie, en raison de ta désolation amère,\\nde venir m'assister au moment de ma mort,\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P062\", \"n\": 62, \"t\": \"- quand ma pauvre âme se trouvera seule, abandonnée de tous,\\nparmi mille anxiétés et mille craintes.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P063\", \"n\": 63, \"t\": \"Viens en ce moment pour me tenir compagnie,\\n- comme tant de fois je t'ai tenue compagnie durant ma vie.\\nViens m'assister, assieds-toi à mes côtés et mets l'ennemi en fuite.\\n- Lave mon âme au moyen de tes larmes,\\n- couvre-moi du Sang de Jésus,\\n- fais-moi revêtir ses Mérites.\\nEmbellis-moi de ses Peines et de ses Œuvres.\\nEt en vertu des Peines de Jésus et des Tiennes,\\n- fais que tous mes péchés soient effacés par un pardon total.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P064\", \"n\": 64, \"t\": \"Quand mon âme quittera mon corps,\\n- reçois-moi dans tes Bras,\\n- mets-moi sous ton Manteau,\\n- cache-moi du regard de l'ennemi.\\nDe ton vol, porte-moi au Ciel et mets-moi dans les Bras de Jésus.\\nQu'il en soit ainsi, ma chère Maman !\\nJe te prie aussi de rendre la compagnie que je t'ai tenue aujourd'hui\\nà tous les moribonds. Pour tous, sers de Mère.\\nIls sont dans des moments extrêmes où ils ont besoin de grands secours.\\nPar conséquent, ne refuse à personne ton office maternel.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P065\", \"n\": 65, \"t\": \"Un dernier mot en te laissant, ô douce Maman. Je te prie de m'enfermer dans le Cœur infiniment saint de Jésus. Et pendant que je baise ta Main maternelle, bénis-moi. Ainsi soit-il.\"}, {\"id\": \"PASSION24.HOUR.24.DESOL.P066\", \"n\": 66, \"t\": \"Nos cum prole pia, benedicat Virgo Maria.\"}]}]}], \"prayers\": [{\"prayer_id\": \"PASSION24.PRAYER.BEFORE_EACH_HOUR\", \"title\": \"Prière avant chaque Heure\", \"prayer_type\": \"before_hour\", \"paragraphs\": [{\"id\": \"PASSION24.PRAYER.BEFORE_EACH_HOUR.P001\", \"t\": \"Ô mon Seigneur Jésus-Christ, prosterné devant Toi,\\nje supplie ton Cœur infiniment amoureux de bien vouloir m'admettre\\n- à la méditation des Heures douloureuses de ta Passion\\ndurant lesquelles, par Amour pour nous,\\nTu voulus souffrir dans ton Corps adorable et dans ton Âme infiniment sainte,\\njusqu'à mourir sur la Croix.\"}, {\"id\": \"PASSION24.PRAYER.BEFORE_EACH_HOUR.P002\", \"t\": \"Daigne me donner\\n- ton Aide, ta Grâce, ton Amour,\\n- ainsi qu'une profonde compassion à ton endroit et\\n- une profonde compréhension de tes Souffrances,\\npendant que je méditerai sur la ... (préciser) Heure.\"}, {\"id\": \"PASSION24.PRAYER.BEFORE_EACH_HOUR.P003\", \"t\": \"Et pour les Heures sur lesquelles je ne pourrai pas méditer,\\nc'est-à-dire celles pendant lesquelles je serai contraint\\n- soit de m'appliquer à mes devoirs journaliers,\\n- soit de m'adonner au sommeil,\\nje veux T'offrir la volonté que j'ai de méditer aussi sur elles.\"}, {\"id\": \"PASSION24.PRAYER.BEFORE_EACH_HOUR.P004\", \"t\": \"Accepte alors, ô Seigneur miséricordieux, mon intention d'amour. Et fais en sorte que ces Heures me profitent et profitent à beaucoup d'autres comme si je les faisais effectivement et saintement.\"}, {\"id\": \"PASSION24.PRAYER.BEFORE_EACH_HOUR.P005\", \"t\": \"Entre temps, je Te rends grâce ô Jésus,\\n- Toi qui m'appelles à m'unir à Toi dans la prière,\\net je me plonge dans tes Pensées, tes Paroles, ta Volonté et ton Amour,\\n- en implorant l'aide de ta Très Sainte Mère et de mon ange gardien.\"}, {\"id\": \"PASSION24.PRAYER.BEFORE_EACH_HOUR.P006\", \"t\": \"Réciter :\"}, {\"id\": \"PASSION24.PRAYER.BEFORE_EACH_HOUR.P007\", \"t\": \"un ‘Je vous salue Marie’ à la Très Sainte Vierge,\\nun ‘Gloire au Père’ à son ange gardien,\\nun ‘De profundis’ (Ps 129) pour les âmes du Purgatoire,\\n- auxquelles il ne faut pas manquer d'appliquer les indulgences\\nqui seront gagnées par la méditation du Mystère.\"}]}, {\"prayer_id\": \"PASSION24.PRAYER.AFTER_EACH_HOUR\", \"title\": \"Prière à la fin de chaque Heure\", \"prayer_type\": \"after_hour\", \"paragraphs\": [{\"id\": \"PASSION24.PRAYER.AFTER_EACH_HOUR.P001\", \"t\": \"Mon aimable Jésus,\\nTu m'as appelé durant cette Heure de ta Passion à Te tenir compagnie,\\net je suis venu.\\nIl m'a semblé Te voir prier, réparer et souffrir,\\n- et avec les Paroles les plus tendres, plaider pour le salut des âmes.\"}, {\"id\": \"PASSION24.PRAYER.AFTER_EACH_HOUR.P002\", \"t\": \"J'ai cherché à Te suivre en tout. Avant de Te laisser, je veux Te dire un « merci » et un « sois béni ».\"}, {\"id\": \"PASSION24.PRAYER.AFTER_EACH_HOUR.P003\", \"t\": \"Oui, ô Jésus, merci mille fois. Je Te loue et Te bénis pour tout ce que Tu as fait et souffert pour nous tous.\"}, {\"id\": \"PASSION24.PRAYER.AFTER_EACH_HOUR.P004\", \"t\": \"Je Te dis merci et je Te bénis\\n- pour chaque goutte de ton Sang et chacune de tes Larmes versées,\\n- pour chacune de tes Respirations,\\n- pour chaque Battement de ton Cœur,\\n- pour chacun de tes Pas, de tes Paroles et de tes Regards, et\\n- pour chaque offense que Tu as supportée pour nous.\"}, {\"id\": \"PASSION24.PRAYER.AFTER_EACH_HOUR.P005\", \"t\": \"De grâce, fais en sorte, ô mon Jésus, que tout mon être T'envoie un flot continu de remerciements et de bénédictions,\"}, {\"id\": \"PASSION24.PRAYER.AFTER_EACH_HOUR.P006\", \"t\": \"de sorte que cela attire sur moi et sur toutes les créatures les flots de tes Grâces et de tes Bénédictions.\"}, {\"id\": \"PASSION24.PRAYER.AFTER_EACH_HOUR.P007\", \"t\": \"Ô Jésus,\\nserre-moi sur ton Cœur avec tes Mains infiniment saintes :\\nmarque toutes les parcelles de mon être de ton « Je te bénis »,\\nde sorte que rien ne sorte de moi\\n- sauf un hymne d'amour ininterrompu pour Toi !\"}, {\"id\": \"PASSION24.PRAYER.AFTER_EACH_HOUR.P008\", \"t\": \"Je m'abandonne à Toi et je veux Te suivre en tout.\"}, {\"id\": \"PASSION24.PRAYER.AFTER_EACH_HOUR.P009\", \"t\": \"Je laisse\\nmes pensées en Toi pour qu'elles Te défendent de tes ennemis,\\nmes respirations pour qu'elles Te servent de cortège et Te tiennent compagnie,\\nles battements de mon cœur\\n- pour Te dire sans cesse « je T'aime » et\\n- pour Te dédommager de l'amour que ne Te donnent pas les autres\\ncréatures ;\\nles gouttes de mon sang\\n- en offrande de réparation et\\n- pour Te restituer les honneurs et l'estime dont Te privent tes ennemis,\\nfinalement tout mon être pour Te garder.\"}, {\"id\": \"PASSION24.PRAYER.AFTER_EACH_HOUR.P010\", \"t\": \"Mon doux Amour, bien que je doive m’occuper de mes tâches journalières, je reste dans ton Cœur et je crains d'en sortir. Tu me garderas en Toi, n'est-ce pas ?\"}, {\"id\": \"PASSION24.PRAYER.AFTER_EACH_HOUR.P011\", \"t\": \"Nos battements de cœur s'entendront l'un l'autre et se confondront,\\nde sorte qu'ils me donneront\\n- vie, amour, et union étroite et inséparable avec Toi.\"}, {\"id\": \"PASSION24.PRAYER.AFTER_EACH_HOUR.P012\", \"t\": \"Mon Jésus, si Tu vois que je suis sur le point de Te fuir, que tes Battements de Cœur s'accélèrent dans mon cœur, que tes Mains me pressent plus fortement sur ton Cœur, que tes Yeux me regardent et me jettent des flèches de feu, afin que, Te ressentant, je me laisse tout de suite gagner à rester avec Toi.\"}, {\"id\": \"PASSION24.PRAYER.AFTER_EACH_HOUR.P013\", \"t\": \"Je T'en prie, ô mon Jésus, donne-moi le Baiser de l'Amour divin et bénis-moi. Et moi, je baise ton Cœur infiniment doux et je reste en Toi. Que la bénédiction de Dieu, le Tout-Puissant, Père et Fils et Esprit-Saint, descende sur moi et y demeure à jamais. Amen.\"}]}, {\"prayer_id\": \"PASSION24.PRAYER.HOLY_HOUR_PREPARATION\", \"title\": \"Oraison préparatoire à l’Heure Sainte\", \"prayer_type\": \"holy_hour_preparation\", \"paragraphs\": [{\"id\": \"PASSION24.PRAYER.HOLY_HOUR_PREPARATION.P001\", \"t\": \"Oraison préparatoire à l'Heure Sainte\"}, {\"id\": \"PASSION24.PRAYER.HOLY_HOUR_PREPARATION.P002\", \"t\": \"Ô Jésus, mon divin Rédempteur, daigne m'admettre aux côtés de tes trois chers apôtres, pour assister à ton Agonie dans le Jardin des Oliviers !\"}, {\"id\": \"PASSION24.PRAYER.HOLY_HOUR_PREPARATION.P003\", \"t\": \"Bien averti par le doux reproche que tu fis à Pierre et aux deux autres qui dormaient, je veux veiller une heure avec Toi. Fais-moi ressentir au moins une Blessure de ton Cœur agonisant, un Souffle de ta Respiration perturbée.\"}, {\"id\": \"PASSION24.PRAYER.HOLY_HOUR_PREPARATION.P004\", \"t\": \"Je veux fixer mon regard sur ton divin Visage et le contempler quand il pâlit, quand il s'émeut, quand il ressent une grande angoisse, quand il s'incline jusqu'à terre !\"}, {\"id\": \"PASSION24.PRAYER.HOLY_HOUR_PREPARATION.P005\", \"t\": \"Je vois, ô mon Jésus, ta divine Personne vaciller et tomber, tantôt d'un côté,\"}, {\"id\": \"PASSION24.PRAYER.HOLY_HOUR_PREPARATION.P006\", \"t\": \"tantôt de l'autre. Je Te vois joindre les Mains.\"}, {\"id\": \"PASSION24.PRAYER.HOLY_HOUR_PREPARATION.P007\", \"t\": \"J'entends les gémissements d'Amour et de Souffrance que Tu élèves vers le Ciel ! Ô mon Jésus, agonisant dans ce sombre Jardin, pendant cette heure où je Te tiendrai compagnie, fais couler sur moi quelques gouttes du Sang infiniment adorable qui s'écoule de tous tes Membres !\"}, {\"id\": \"PASSION24.PRAYER.HOLY_HOUR_PREPARATION.P008\", \"t\": \"De grâce, ô mon bien-aimé Rédempteur,\\nque je boive au moins une gorgée de ton amer calice,\\nque je ressente quelques-unes des Peines de ton divin Cœur, et\\nque je sente mon cœur se briser par le repentir d'avoir offensé mon Seigneur\\n- qui, pour moi, en est réduit à cette Agonie terrible !\\nÔ mon Jésus, donne-moi la Grâce de souffrir et de pleurer avec Toi pendant au\\nmoins une heure dans ce Jardin !\"}, {\"id\": \"PASSION24.PRAYER.HOLY_HOUR_PREPARATION.P009\", \"t\": \"Ô Marie, Mère affligée, fais-moi ressentir la compassion de ton Cœur transpercé envers Jésus agonisant. Amen.\"}]}, {\"prayer_id\": \"PASSION24.PRAYER.HOLY_HOUR_THANKSGIVING\", \"title\": \"Prière de remerciement pour l’Heure Sainte\", \"prayer_type\": \"holy_hour_thanksgiving\", \"paragraphs\": [{\"id\": \"PASSION24.PRAYER.HOLY_HOUR_THANKSGIVING.P001\", \"t\": \"Je Te rends grâce, ô mon infiniment doux Seigneur, d'avoir daigné m'admettre en ta sainte Compagnie pendant au moins une heure de ta terrible Agonie dans le Jardin.\"}, {\"id\": \"PASSION24.PRAYER.HOLY_HOUR_THANKSGIVING.P002\", \"t\": \"Ce fut sans doute pour Toi un réconfort médiocre, mais l'Amour infini de ton Cœur compatissant Te fait trouver du soulagement même dans le plus petit acte de compassion envers Toi !\"}, {\"id\": \"PASSION24.PRAYER.HOLY_HOUR_THANKSGIVING.P003\", \"t\": \"Ah ! la vue de ton adorable Personne\\n- tremblante, abattue, humiliée, effondrée dans la poussière,\\n- toute couverte de sueur de Sang dans la sombre horreur du Jardin\\nne me sortira plus de l'esprit !\"}, {\"id\": \"PASSION24.PRAYER.HOLY_HOUR_THANKSGIVING.P004\", \"t\": \"Et j'ai éprouvé, ô Jésus, que d'être avec Toi souffrant, de goûter ne serait-ce qu'une goutte de l'amertume angoissante de ton divin Cœur, est le plus grand destin qu'on puisse avoir sur cette terre ! Ô Jésus, c'est avec générosité que je renonce aux choses terrestres et trompeuses. Je ne veux que Toi, mon Seigneur opprimé, souffrant, affligé ! Du Jardin jusqu'au Calvaire je veux Te tenir compagnie avec fidélité et douceur.\"}, {\"id\": \"PASSION24.PRAYER.HOLY_HOUR_THANKSGIVING.P005\", \"t\": \"Ô Jésus, fais en sorte que je sois capturée avec Toi, traînée avec Toi aux tribunaux. Fais que je partage les outrages, les insultes, les crachats et les gifles dont tes ennemis Te couvriront.\"}, {\"id\": \"PASSION24.PRAYER.HOLY_HOUR_THANKSGIVING.P006\", \"t\": \"Conduis-moi avec Toi de Pilate à Hérode et de Hérode à Pilate.\\nLie-moi avec Toi à la colonne\\net fais-moi ressentir une partie de tes coups de fouet.\\nDonne-moi quelques-unes de tes épines, Jésus,\\n- pour qu’elles me transpercent.\"}, {\"id\": \"PASSION24.PRAYER.HOLY_HOUR_THANKSGIVING.P007\", \"t\": \"Fais en sorte qu'avec Toi je sois condamnée à mourir crucifiée,\\n- Toi en tant que victime d'Amour pour moi,\\n- et moi en tant que victime expiatrice pour mes péchés !\\nDonne-moi le destin du Cyrénéen pour T'accompagner jusqu'au Calvaire.\\nLà, fais en sorte qu'avec Toi je sois clouée sur la Croix,\\nque j'y agonise et y meure avec Toi.\"}, {\"id\": \"PASSION24.PRAYER.HOLY_HOUR_THANKSGIVING.P008\", \"t\": \"Ô Mère affligée,\\nqui m'as aidée à compatir avec Jésus agonisant dans le Jardin,\\naide-moi\\n- à être crucifiée avec toi sur la Croix de Jésus, et\\n- de savoir Lui offrir les réparations\\navec les mérites mêmes de sa Passion et de sa Mort sur la Croix.\\nAmen.\"}]}, {\"prayer_id\": \"PASSION24.PRAYER.DE_PROFUNDIS\", \"title\": \"De profundis / Psaume 129 (AELF)\", \"prayer_type\": \"psalm\", \"paragraphs\": [{\"id\": \"PASSION24.PRAYER.DE_PROFUNDIS.P001\", \"t\": \"Psaume 129 — De profundis (AELF)\"}, {\"id\": \"PASSION24.PRAYER.DE_PROFUNDIS.P002\", \"t\": \"01 Des profondeurs je crie vers toi, Seigneur,\\n02 Seigneur, écoute mon appel !\\nQue ton oreille se fasse attentive\\nau cri de ma prière !\\n03 Si tu retiens les fautes, Seigneur,\\nSeigneur, qui subsistera ?\\n04 Mais près de toi se trouve le pardon\\npour que l’homme te craigne.\"}, {\"id\": \"PASSION24.PRAYER.DE_PROFUNDIS.P003\", \"t\": \"05 J’espère le Seigneur de toute mon âme ;\\nje l’espère, et j’attends sa parole.\\n06 Mon âme attend le Seigneur\\nplus qu’un veilleur ne guette l’aurore.\\nPlus qu’un veilleur ne guette l’aurore,\\n07 attends le Seigneur, Israël.\\nOui, près du Seigneur, est l’amour ;\\nprès de lui, abonde le rachat.\\n08 C’est lui qui rachètera Israël\\nde toutes ses fautes.\"}, {\"id\": \"PASSION24.PRAYER.DE_PROFUNDIS.P004\", \"t\": \"Gloire au Père, au Fils et au Saint-Esprit, maintenant et toujours et pour les siècles des siècles. Amen\"}]}], \"sections\": [{\"section_id\": \"PASSION24.SECTION.INTRODUCTION\", \"segment_type\": \"INTRODUCTION\", \"title\": \"Introduction\", \"display_text\": \"INTRODUCTION\\n\\nAvec toute la réserve nécessaire, dans la soumission la plus parfaite au jugement de la sainte Église, sans faire appel à une autre foi que la foi humaine et conformément au décret du Pape Urbain VIII, nous transcrivons ici des révélations privées que Notre-Seigneur Jésus-Christ a faites à la servante de Dieu Luisa Piccarreta, à qui il inspira cet ouvrage.\\n\\nCitons ici une lettre envoyée par Luisa au Révérend Canon Di Francia :\\n\\n« Mon très Révérend Père,\\n\\nEnfin, voici que je vous remets le texte des Heures de la Passion. Je l'ai écrit tout à la gloire de Notre-Seigneur. Je joins à la présente un autre feuillet qui mentionne l'affection toute particulière et les belles promesses de Jésus envers ceux qui pratiqueront ces Heures.\\n\\nJe crois que si celui qui les médite est un pécheur, il se convertira, s'il est imparfait, il deviendra parfait, s'il est saint, il deviendra plus saint, s'il est tenté, il trouvera la victoire, s'il est souffrant, il trouvera la force, le remède, le réconfort ; et si son âme est faible et pauvre, il trouvera un aliment spirituel et un miroir où il pourra se regarder continuellement pour s'embellir et se rendre semblable à Jésus notre modèle.\\n\\nLe contentement qu'éprouve Jésus lorsqu'on médite ces Heures est si grand qu'Il voudrait qu'il y en ait au moins une copie dans chaque village ou cité pour qu'on puisse en faire la méditation.\\n\\nÀ travers ces méditations, Jésus entend sa propre voix et ses propres Prières telles qu'Il les adressait à son Père durant les 24 Heures de sa Passion.\\n\\nEt si un assez grand nombre d'âmes s'y adonnent dans chaque village ou cité, il semble que Jésus me fait savoir que la Justice divine en sera partiellement apaisée. Et, en cette triste époque de calamités et d'effusion de sang,\\n\\nces fléaux seront partiellement arrêtés.\\n\\nFaites appel à tous, Révérend Père, et propagez ce petit ouvrage que mon aimable Jésus m'a demandé de rédiger.\\n\\nJe vous dis aussi que le but de ces écrits\\n- n'est pas tant de raconter l'histoire de la Passion de Notre-Seigneur\\ncar il y a beaucoup de livres qui traitent de ce sujet et il ne serait pas\\nnécessaire d'en écrire un autre,\\n\\nc’est d'inciter le lecteur à la réparation, ce que nous avons fait en adjoignant aux divers points de la Passion des suggestions à ce sujet.\\n\\nPar exemple,\\n- dans certains passages, on bénit Jésus,\\n- dans d'autres, on compatit avec Lui,\\n- dans d'autres, on Le loue,\\n- dans d'autres on Le réconforte,\\n- dans d'autres on rachète à ses côtés,\\n- dans d'autres on prie, on demande, on supplie.\\n\\nPar conséquent, je vous laisse le soin, Révérend Père, de faire connaître le but de ces Écrits dans une préface. »\"}, {\"section_id\": \"PASSION24.SECTION.BENEFITS\", \"segment_type\": \"BENEFITS_AND_PROMISES\", \"title\": \"Promesses et bienfaits\", \"display_text\": \"L'affection toute particulière et les belles promesses de Jésus envers ceux qui pratiqueront ces Heures.\\n\\nLe feuillet dont il est question plus haut contient quelques passages de Paroles que Notre-Seigneur a dites à Luisa.\\n\\nLDC 7 - 9 novembre 1906 - L’âme qui médite souvent ma Passion me donne beaucoup de réconfort.\\n\\nLorsqu'une âme médite sur la Passion\\n- que Je souffris dans mon âme et mon corps\\n- avec tant d'Amour et de Souffrances infinies,\\net lorsqu'elle s'afflige et compatit avec Moi,\\n\\ncela m'est tellement agréable que Je me sens comme dédommagé de toutes\\nles tortures et les ignominies que J'ai subies,\\n- non seulement dans ma Passion,\\n- mais à partir du moment de mon Incarnation\\njusqu' à mon dernier souffle sur la Croix.\\n\\nL'âme qui médite souvent sur ma Passion me réconforte de diverses façons :\\n\\nSi, durant ma Passion, on Me lia avec des cordes et des chaînes, l'âme qui Me considère ainsi attaché et compatit avec Moi, Me délie et Me rend la liberté.\\n\\nSi les hommes d'armes Me méprisèrent, Me crachèrent dessus\\n- et Me déshonorèrent,\\nL'âme compatissante Me donne de l'estime,\\n- Me lave de ces crachats et M'honore.\\n\\nSi mes bourreaux Me dévêtirent et Me flagellèrent, l'âme compatissante Me guérit et M'habille.\\n\\nSi on Me couronna d'épines, si on Me traita comme un roi de plaisanterie, si on Me remplit la bouche de fiel et Me crucifia,\\n\\nL'âme qui considère avec compassion toutes ces souffrances,\\n- Me couronne de Gloire, M'honore comme son Roi,\\n- Me remplit la bouche de douceur,\\n- Me décloue de la Croix et\\n- Me fait ressusciter dans son cœur.\\nEt, en échange\\n- de sa méditation amoureuse et\\n- de sa considération pour mes peines,\\nJe donne à cette âme une vie de grâces renouvelée.\\n\\nTandis qu'elle M'attire à elle\\n- par la contemplation de mes Souffrances et par sa compassion,\\nJe l'attire à Moi et Je Me donne à elle comme Aliment spirituel.\\n\\nTandis qu'elle se nourrit\\n- de mes Plaies, de mes Opprobres et des Agonies de mon Cœur,\\nJe me nourris\\n- de son âme en l’absorbant en Moi-même dans l'Amour.\\n\\nVoilà pourquoi la méditation dévote et fréquente de ma Passion M'est si agréable. »\\n\\nLDC 11 - 10 avril 1913 - Méditer sur ma Passion fait naître dans le cœur une source salutaire.\\n\\n« Celui qui pense souvent à ma Passion fait naître dans son cœur comme une source salutaire. Plus l'âme s'applique à réfléchir et à méditer sur ma douloureuse Passion, plus le débit de cette source augmente.\\n\\nLes eaux qui coulent d'une fontaine sont des eaux pour tous,\\nDe même, cette source de salut, qui se forme dans le cœur de celui qui médite\\nsur ma Passion, sert\\n- à ma Gloire,\\n- au bien personnel de cette âme et\\n- au profit de beaucoup d'autres âmes. »\\n\\nLDC 11 - 10 avril 1913 - Luisa demande à Jésus ce qu’Il va donner en échange de cette méditation.\\n\\nLuisa demanda à Jésus : « Dis-moi, Ô mon Bien, que donneras-Tu en échange aux âmes qui méditeront les Heures de ta Passion comme Tu me l'as enseigné ? »\\n\\nNotre-Seigneur répondit : « Ma fille, ces Heures, Je ne les considérerai pas comme des choses provenant de vous, mais comme si c'était Moi qui les faisais.\\n\\nÀ ceux qui les méditeront, Je donnerai mes Mérites\\n- comme si Je souffrais la Passion durant ce temps qu'ils les méditent.\\n\\nLes effets\\n- que produisait ma Passion quand Je l'endurais, et\\n- qu'elle peut produire à toute époque,\\nseront renouvelés dans les âmes qui méditeront sur ces Heures,\\nselon la qualité de leurs dispositions intérieures.\\n\\nIl n 'y a pas de récompense plus grande que celle-là qu'on puisse recevoir en cette vie terrestre.\\n\\nAu Paradis, Je mettrai ces âmes en ma Présence divine, devant ma Face,\\nJe les darderai de flèches d'Amour et de contentements éternels.\\nEt, elles-mêmes, enivrées de mon Amour,\\n- me répondront en dardant mon Cœur de toute la capacité d'amour\\nqu'aura leur âme dans la béatitude céleste.\\n\\nCeci constituera un doux enchantement pour tous les bienheureux du Ciel (c'est-à-dire toutes les créatures qui jouissent de la vue parfaite de Dieu). »\\n\\nLDC 11 - 6 septembre 1913 - Les Heures de la Passion sont issues du tréfonds du Cœur de Jésus.\\n\\nJe pensais aux Heures de la Passion et au fait qu'elles sont sans indulgences. Ceci fait que ceux qui les font ne gagnent rien, alors qu'il existe de nombreuses prières enrichies d'indulgences.\\n\\nAvec beaucoup de gentillesse, mon toujours aimable Jésus me dit :\\n\\n« Ma fille, on peut gagner quelques choses par les prières indulgenciées.\\n\\nMais les Heures de ma Passion,\\n- qui sont mes propres prières et\\n- qui débordent d'Amour,\\nviennent du tréfonds de mon Cœur.\\n\\nAurais-tu oublié\\n- combien de temps Nous avons mis pour les composer et\\n- que, par elles, des châtiments se sont changés en grâces sur toute la terre ?\\n\\nMa satisfaction par rapport à ces prières est telle que,\\n- plutôt que des indulgences,\\nJe donne à l'âme une surabondance d'Amour\\naccompagnée de grâces d'un prix incalculable.\\n\\nQuand elles sont faites dans un Amour pur,\\n- elles permettent à mon Amour de se déverser.\\nEt cela n'est pas banal que la créature puisse\\n- donner du soulagement à son Créateur et\\n- lui permettre de déverser son Amour. »\\n\\nLDC 11 - 6 septembre 1913 - Même s'il n'y avait qu'une seule âme qui les méditait, tu devrais être contente.\\n\\nLuisa raconte ceci :\\nUne autre fois, j'étais en train de me plaindre auprès de Jésus\\n- sur le fait que, après tant de sacrifices à écrire ces Heures de la Passion,\\nil y avait si peu d'âmes qui les méditaient.\\n\\nJésus me dit : « Ne te plains pas, o fille. Même s'il n'y avait qu'une seule âme qui les méditait, tu devrais être contente.\\n\\nEst-ce que Moi, Je n'aurais pas souffert ma douloureuse Passion et ma Mort en Croix même pour une seule âme ? Tu dois agir ainsi toi aussi.\\n\\nIl ne faut jamais omettre le bien parce que peu de personnes en profiteraient.\\n\\nMa Passion et ma Mort firent acquérir à ma sainte Humanité les mérites\\n- comme si tous allaient être sauvés,\\ntelle étant ma Volonté et le but de toutes mes Souffrances et de ma Mort.\\n\\nAinsi toi, selon que ta volonté aura voulu faire du bien à tous dans ma Volonté, tu seras récompensée de ton travail dans cette même proportion.\\n\\nTout le mal reviendra à ceux qui ne les mettront pas en pratique,\\n- soit à cause de leur nature infirme,\\n- soit à la suite de suggestions diaboliques. »\\n\\nLDC 11 - 6 septembre 1913 - Cet exercice pieux de réparation est vraiment sorti de mon Cœur.\\n\\nUne autre fois, Jésus dit à Luisa :\\n« Les Heures de ma Passion furent remplies\\n- de mes Prières, de mes Réparations et de mon Amour.\\nCet exercice pieux de réparation fait dans la méditation de ces Heures\\n- est vraiment sorti de mon Cœur.\\n\\nAh ! combien de fois, grâce à ces méditations pratiquées secrètement dans toute mon Église par tant d'âmes qui m'étaient chères, n'ai-Je pas changé des fléaux en grâces pour toute la terre !\\n\\nCes méditations ont un prix incalculable.\\nSi les exercices pieux que tu as pratiqués et que tu as mis par écrit\\n- sont pratiqués par d'autres avec amour,\\nmon Amour y trouvera son épanchement et son réconfort.\\n\\nEt sache, Ô fille, que ce n'est pas peu de choses que la créature donne\\n- du soulagement et\\n- de l'épanchement à l'Amour de son Créateur. »\\nLDC 11 - 6 septembre 1913 - Je souhaite la méditation de ces Heures\\ndans chaque cité ou village.\\n\\nNotre-Seigneur donna aussi à Luisa ces Paroles expressives qui résonnèrent au plus profond de son âme contemplative :\\n\\n« Oh ! combien J’aimerais que dans chaque cité ou village il se trouve, ne fût-ce qu'une âme, qui s'applique à méditer ces Heures de ma Passion !\\n\\nAlors, Je m'entendrais Moi-même dans chaque cité ou village. Et ma Justice qui en cette époque, est très indignée, serait en partie apaisée ! »\\n\\nLDC 11 - 14 octobre 1914 - Luisa demanda à Jésus si ce petit ouvrage Lui serait agréable et dans quelle mesure.\\n\\nLuisa se répandait en compassion et en amour envers Jésus souffrant, du Jeudi Saint à 17h jusqu'au Vendredi Saint à 17h, alors que tout se termine par la sépulture de son Corps adorable.\\n\\nAprès avoir mis par écrit ces Heures de la Passion, elle demanda, avec une confiance spéciale que son Époux céleste lui a donnée, si ce petit ouvrage Lui serait agréable et dans quelle mesure.\\n\\nJésus lui répondit :\\n« En échange du fait que tu as écrit ces Heures de ma Passion,\\npour chaque mot que tu as écrit\\n- Je donnerai un baiser à ton âme et\\n- Je t'accorderai une âme. »\\n\\nEt Luisa reprit : « Seigneur, c'est ce que Tu me donneras à moi, mais le donneras-Tu également à quiconque méditera ces Heures ? »\\n\\n« Oui, répondit Notre-Seigneur,\\n- à chacun Je donnerai une âme, à chaque mot,\\n- à condition qu'il les médite uni à Moi et dans ma propre Volonté\\ncar l'efficacité de la méditation de ces Heures sera proportionnelle\\n- à l'union plus ou moins grande qu'on aura avec Moi.\\nSi l'âme les fait dans ma Volonté,\\n- elle se cachera avec Moi dans cette Volonté.\\nEt quand ma Volonté se met à agir, Je peux faire tout le bien que Je veux,\\n- même pour un seul mot, et ce, autant de fois qu'on méditera ainsi. »\\n\\nLDC 11 - 14 octobre 1914 - La Valeur des Heures de la Passion.\\n\\nQuant à la Valeur de ces Heures, Notre-Seigneur a parlé ainsi :\\n\\nCette méditation est préférable à beaucoup d’autres exercices. Car cette méditation n'est rien d'autre qu'un renouvellement et une augmentation continus\\n\\n- des Mérites\\n- de tout ce que J'ai fait et souffert au cours de ma Vie mortelle, et\\n- de ce que J'ai fait et que Je fais continuellement dans ma sainte Eucharistie.\\n\\nQuand Je vois une âme méditer ces Heures,\\n- J’entends ma propre Voix, mes propres Prières,\\n- Je vois ma propre Volonté en cette âme,\\nc'est-à-dire la volonté de vouloir le bien de tous et de réparer pour tous.\\n\\nEt Je Me sens attiré à demeurer en cette âme.\\n\\nLDC 11 - 4 novembre 1914 - La satisfaction que causent à Jésus les Heures de la Passion.\\n\\nJe faisais les Heures de la Passion et, tout heureux, Jésus me dit : « Ma fille, si tu savais quelle grande satisfaction Je ressens en te voyant refaire ces Heures de ma Passion encore et encore, tu en serais très heureuse.\\n\\nIl est vrai que mes saints ont médité ma Passion et ayant compris à quel point\\nJ'ai souffert, ils ont versé des larmes de compassion.\\n- jusqu'à se sentir consumés d'amour pour mes Souffrances.\\n\\nCependant,\\nil ne s'agissait pas de cette manière toujours répétée et dans cet ordre.\\nTu es la première à Me donner ce plaisir si grand et si spécial\\n- de revivre intérieurement, Heure après Heure,\\nma Vie et tout ce que J'ai souffert.\\nJe Me sens si attiré par cela que, Heure après Heure,\\nJe te donne cette nourriture et Je la mange avec toi,\\n- faisant avec toi ce que tu fais.\\n\\nSache que Je te récompenserai abondamment de Lumière et de Grâces nouvelles. Même après ta mort, chaque fois que des âmes sur la terre feront ces Heures, au Ciel Je te vêtirai de Lumière et de Gloire nouvelles. »\\n\\nLDC 11 - 6 novembre 1914 - L'âme qui fait les Heures de la Passion devient corédemptrice.\\n\\nPendant que, suivant mon habitude, je faisais les Heures de la Passion, mon aimable Jésus me dit :\\n\\n« Ma fille,\\nle monde renouvelle sans cesse ma Passion.\\nPuisque mon immensité enveloppe toutes les créatures,\\n- tant intérieurement qu'extérieurement,\\n\\nJe suis forcé, à leur contact, de recevoir\\n- clous, épines, coups de fouet,\\n- mépris, crachats et tout le reste\\ndont J'étais accablé pendant ma Passion, et même plus.\\n\\nCependant, au contact des âmes qui font les Heures de ma Passion,\\nJe sens\\n- que les clous s'enlèvent, que les épines sont détruites,\\n- que mes blessures sont soulagées et que les crachats disparaissent.\\n\\nJe Me sens dédommagé pour le mal que les autres créatures Me font. Et, sentant que ces âmes ne Me font aucun mal, mais plutôt du bien, Je M'appuie sur elles. »\\n\\nJésus béni ajouta :\\n« Ma fille, sache qu'en faisant ces Heures, l'âme s'empare\\n- de mes Pensées, de mes Réparations, de mes Prières,\\n- de mes désirs, de mes affections et même\\n- de mes fibres les plus intimes.\\nEt elle les fait siens.\\n\\nS'élevant entre le Ciel et la terre, elle remplit la fonction de co-rédemptrice et elle dit à ma suite : \\\"Me voici, je veux réparer pour tous, implorer pour tous et répondre de tous.\\\" »\\n\\nLDC 11 - 14 août 1915 - La Passion de Jésus, ses Plaies, son Sang et tout ce qu'Il a fait et souffert opèrent sans cesse.\\n\\n« Ma fille,\\n\\nma Passion, mes Plaies, mon Sang, et tout ce que J'ai fait et souffert opèrent sans cesse comme si tout se passait actuellement.\\n\\nIls servent de supports\\n- sur lesquels Je peux M'appuyer et\\n- sur lesquels les âmes peuvent s'appuyer\\npour ne pas tomber dans le péché et pour être sauvées.\\n\\nEn ces temps de châtiments, Je suis comme une personne\\n\\n- suspendue dans les airs et\\n- qui reçoit des coups continuellement :\\n\\nla Justice Me frappe à partir du Ciel et les créatures, par le péché, Me frappent à partir de la terre.\\n\\nPlus l'âme reste auprès de Moi,\\n- baisant mes Plaies,\\n- faisant réparation et\\n- offrant mon Sang,\\nen un mot, refaisant tout ce que J'ai fait durant ma Vie et ma Passion,\\n\\nplus elle forme des supports\\n- sur lesquels Je peux M'appuyer pour ne pas tomber, et\\n\\nplus le cercle s'agrandit où les âmes peuvent trouver appui\\n- pour ne pas tomber dans le péché et\\n- pour être sauvées.\\n\\nNe te lasse pas, ma fille,\\n- de te tenir auprès de Moi et\\n- de parcourir mes Plaies encore et encore.\\n\\nJe te donnerai\\n- les pensées,\\n- les affections et\\n- les mots\\npour que tu puisses rester auprès de Moi.\\n\\nSois-Moi fidèle. Parce que le temps est court. Et parce que, irritée par les créatures, la Justice veut déployer sa fureur. Il est nécessaire que les supports se multiplient. Ne cesse pas de travailler. »\\n\\nLDC 11 - 23 avril 1916 - Chaque pensée sur la Passion de Jésus produit dans l'âme de la Lumière qui se transformera en Joie éternelle.\\n\\nPendant que je me trouvais dans mon état habituel, mon aimable Jésus se montra tout inondé de Lumière.\\n\\nCette Lumière émanait de sa très sainte Humanité et Lui conférait une très grande beauté. Je fus surprise et Il me dit :\\n\\n« Ma fille,\\n- chaque douleur que J'ai subie dans mon Humanité,\\n- chaque goutte de Sang que J’ai versée,\\n- chaque Blessure, chaque Prière, chaque Parole, chaque Action, chaque Pas,\\netc., produisaient de la Lumière dans mon Humanité.\\n\\nEt cette Lumière M'embellissait au point que tous les bienheureux du Ciel en étaient ravis.\\n\\nEn ce qui concerne les âmes,\\n- chaque pensée qu'elles ont sur ma Passion,\\n- chaque acte de compassion qu'elles effectuent,\\n- chaque acte de réparation, etc.\\nfait descendre en elles de la Lumière émanant de mon Humanité et qui les\\nembellit.\\n\\nChaque pensée sur ma Passion est un ajout de Lumière qui se transformera en Joie éternelle. »\\n\\nLDC 11 - 13 octobre 1916 - Les anges entourent les âmes qui font les Heures de la Passion. Ces Heures sont pour Jésus d'agréables petites douceurs.\\n\\nJ'étais à faire les Heures de la Passion et Jésus béni me dit : « Ma fille, pendant ma Vie terrestre, des milliers et des milliers d'anges accompagnaient mon Humanité.\\n\\nIls recueillaient tout ce que Je faisais : mes Pas, mes Travaux, mes Paroles,\\nmes Soupirs, mes Peines, les gouttes de mon Sang, etc.\\n- Ils Me donnaient des honneurs.\\n- Ils obéissaient à tous mes désirs.\\n- Et ils montaient au Ciel et en redescendaient\\npour apporter au Père tout ce que Je faisais.\\nCes anges ont une mission particulière :\\nQuand une âme se remémore ma Vie, ma Passion, mon Sang, mes Plaies,\\nmes Prières, etc.,\\n- ils viennent auprès de cette âme et\\n- ils recueillent ses paroles, ses prières, ses actes de compassion, ses larmes,\\n\\nses offrandes, etc.,\\n- ils les unissent aux Miens et les apportent devant ma majesté pour renouveler\\nma Gloire.\\n\\nAvec révérence, ils écoutent ce que les âmes disent et ils prient avec elles.\\n\\nPar conséquent, avec quelle attention et quel respect les âmes doivent-elles faire les Heures de la Passion, sachant que les anges sont suspendus à leurs lèvres pour répéter ce qu'elles disent ! » Il ajouta : « Au milieu de tant d'amertume que me donnent les créatures, ces Heures sont pour Moi d'agréables petites douceurs, même si elles sont trop peu nombreuses, vu toute l'amertume que Je reçois des créatures.\\n\\nPar conséquent, fais connaître ces Heures autant que tu peux. »\\n\\nLDC 11 - 14 Octobre 1914 - La Valeur des Heures de la Passion et les récompenses qui y sont attachées.\\n\\nPendant que j'écrivais les Heures de la Passion, je me disais : « Que de sacrifices il me faut faire pour écrire ces Heures bénies de la Passion, surtout quand je dois mentionner certaines choses intérieures qui se sont passées entre moi et Jésus ! Quelle récompense me donnera-t-Il ? »\\n\\nD'une voix tendre et douce, Il me dit : « Ma fille, pour chaque mot que tu as écrit, Je te donnerai un baiser, une âme. »\\n\\nJe repris : « Mon Amour, cela est pour moi, mais que donneras-Tu à ceux qui les feront ? »\\n\\nIl me dit : « S'ils les font avec Moi dans ma Volonté, Je leur donnerai aussi une âme pour chaque mot qu'ils réciteront. En fait, l'effet sera petit ou grand suivant la grandeur de leur union avec Moi. En les faisant dans ma Volonté, la créature se cache en Elle. Comme c'est ma Volonté qui agit, Je peux produire tous les biens que Je veux, même à travers un seul Mot. »\\n\\nUne autre fois, Je me plaignais à Jésus en constatant qu'après tant de sacrifices pour écrire ces Heures, très peu d'âmes les font.\\n\\nIl me dit : « Ma fille, ne te plains pas. Même s'il n'y avait qu'une seule âme qui les faisait, tu devrais être contente. N'aurais-Je pas souffert ma Passion au complet même s'il n'y avait eu qu'une âme qui allait être sauvée ? De même pour toi.\\n\\nOn ne doit pas omettre de faire le bien sous prétexte que peu de gens en profiteront. Le dommage sera du côté de ceux qui ne voudront pas en profiter.\\n\\nMa Passion fit acquérir à mon Humanité le mérite nécessaire pour que tous soient sauvés, même si certains ne veulent pas en profiter.\\n\\nLa même chose pour toi : tu seras récompensée dans la proportion où ta\\nvolonté aura été identifiée à la Mienne et aura voulu le bien de tous.\\nTout le dommage est du côté de ceux qui,\\nbien qu'ils en soient capables, ne les font pas.\\nCes Heures sont très précieuses parce qu'elles ne sont rien d'autre\\n- que la répétition de ce que J'ai fait au cours de ma Vie mortelle et\\n- que Je continue de faire dans le très saint Sacrement.\\n\\nQuand J'entends ces Heures, J'entends ma propre Voix, mes propres Prières.\\n\\nDans l'âme qui fait ces Heures, Je vois ma Volonté voulant\\n- le bien de tous et\\n- la réparation pour tous\\nEt Je me sens attiré à venir habiter en cette âme pour y faire ce qu'elle fait.\\n\\nOh ! comme J'aimerais que, dans chaque ville, il y ait au moins une âme qui fasse les Heures de ma Passion ! Je m'entendrais ainsi dans chaque ville. Et ma Justice, si indignée en ces temps, serait en partie apaisée. » Un jour, alors que j'en étais à l'Heure où la céleste Maman participa à l'ensevelissement de Jésus, je me tenais près d'elle pour la consoler.\\n\\nEn fait, je ne faisais généralement pas cette Heure et j'hésitais à la faire.\\n\\nSur un ton suppliant et plein d'amour, Jésus béni me dit :\\n\\n« Ma fille, Je ne veux pas que tu omettes cette Heure-là.\\nTu la feras\\n- par amour pour Moi et\\n- en l'honneur de ma Maman.\\n\\nSache que chaque fois que tu la fais,\\n- ma Maman se sent comme si elle revivait sa vie terrestre et\\n- elle reçoit la gloire et l'amour qu'elle me donnait.\\n\\nQuant à Moi, Je ressens\\n- sa tendresse maternelle, son amour\\n- et toute la gloire qu'elle me donnait.\\nDe plus, Je te considère comme une mère. »\\nEnsuite, Il m'embrassa et me dit avec une grande douceur :\\n« Ma maman, maman ! »,\\nEt Il me murmura tout ce que sa douce Maman fit et souffrit durant cette Heure.\\n\\nÀ partir de cet instant, aidé de sa grâce, je n'ai plus jamais omis cette Heure.\\n\\nLDC 11 - 4 novembre 1914 - La satisfaction que causent à Jésus les Heures de la Passion.\\n\\nJe faisais les Heures de la Passion et, tout heureux, Jésus me dit :\\n\\n« Ma fille, si tu savais quelle grande satisfaction Je ressens\\n- en te voyant refaire ces Heures de ma Passion encore et encore,\\ntu en serais très heureuse.\\n\\nIl est vrai que mes saints ont médité ma Passion et ayant compris à quel point\\nJ'ai souffert, ils ont versé des larmes de compassion jusqu'à se sentir consumés d'amour pour mes souffrances.\\n\\nCependant,\\nil ne s'agissait pas de cette manière toujours répétée et dans cet ordre.\\nTu es la première à Me donner ce plaisir si grand et si spécial\\n- de revivre intérieurement, Heure après Heure,\\nma Vie et tout ce que J'ai souffert.\\n\\nJe me sens si attiré par cela que, Heure après Heure,\\nJe te donne cette nourriture et Je la mange avec toi,\\n- faisant avec toi ce que tu fais.\\n\\nSache que Je te récompenserai abondamment\\n- de Lumière et de Grâces nouvelles.\\n\\nMême après ta mort, chaque fois que des âmes sur la terre feront ces Heures, au Ciel Je te vêtirai de Lumière et de Gloire nouvelles. »\\n\\nLDC 11 - 6 novembre 1914 - L'âme qui fait les Heures de la Passion devient corédemptrice.\\n\\nPendant que, suivant mon habitude, je faisais les Heures de la Passion, mon aimable Jésus me dit :\\n\\n« Ma fille,\\nle monde renouvelle sans cesse ma Passion.\\nPuisque mon immensité enveloppe toutes les créatures,\\n- tant intérieurement qu'extérieurement,\\nJe suis forcé, à leur contact, de recevoir\\n- clous, épines, coups de fouet,\\n- mépris, crachats et tout le reste\\ndont J'étais accablé pendant ma Passion, et même plus.\\n\\nCependant, au contact des âmes qui font les Heures de ma Passion,\\nJe sens\\n- que les clous s'enlèvent, que les épines sont détruites,\\n- que mes blessures sont soulagées et que les crachats disparaissent.\\n\\nJe Me sens dédommagé pour le mal que les autres créatures me font. Et, sentant que ces âmes ne Me font aucun mal, mais plutôt du bien, Je M'appuie sur elles. » Jésus béni ajouta :\\n\\n« Ma fille, sache qu'en faisant ces Heures,\\nl'âme s'empare\\n- de mes Pensées, de mes Réparations, de mes Prières,\\n- de mes désirs, de mes affections et même\\n- de mes fibres
